        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/action_plans/plan_references',\n  headers: {'content-type': 'application/json'},\n  body: {\n    plan_reference: {\n      plan_item_id: 54,\n      type: 'specification_section',\n      payload: {\n        drawing_revision_id: 53,\n        file_version_id: 54,\n        document_management_document_reference: {\n          collection_id: '123e4567-e89b-12d3-a456-426614174000',\n          container_id: '123e4567-e89b-12d3-a456-426614174001'\n        },\n        specification_section_id: 55,\n        submittal_log_id: 65,\n        generic_tool_item_id: 56,\n        form_id: 57,\n        meeting_id: 58,\n        observation_item_id: 59\n      }\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
