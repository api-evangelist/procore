openapi: 3.2.0
info:
  title: Procore REST Open Items API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Open Items
paths:
  /rest/v1.0/open_items/all:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Open Items Statistics
      description: Return open items statistics for a project (all users)
      tags:
      - Open Items
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: tool_name
        in: query
        description: Limits the statistics to a single item type. When omitted or unrecognized, all of the listed types are counted together.
        schema:
          type: string
          enum:
          - Punchlist Item
          - RFI
          - Submittals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Open items statistics data
                properties:
                  count:
                    type: integer
                    description: Total number of open items counted.
                    example: 42
                  open_count:
                    type: integer
                    description: Number of items due more than seven days from now, plus items with no due date.
                    example: 25
                  upcoming_count:
                    type: integer
                    description: Number of items due between today and seven days from now.
                    example: 12
                  overdue_count:
                    type: integer
                    description: Number of items whose due date has already passed.
                    example: 5
                  last_activity:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Timestamp of the most recent update across the counted items. Null when no items matched.
                    example: '2021-06-21T13:46:51Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/open_items/all',\n  qs: {project_id: 'SOME_INTEGER_VALUE', tool_name: 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/open_items/all?project_id=SOME_INTEGER_VALUE&tool_name=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/open_items/all?project_id=SOME_INTEGER_VALUE&tool_name=SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/open_items/all?project_id=SOME_INTEGER_VALUE&tool_name=SOME_STRING_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: getOpenItemsStatistics
