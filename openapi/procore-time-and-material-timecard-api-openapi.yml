                          description: Unique identifier of the user who created this timecard.
                          example: 160586
                        login:
                          type: string
                          description: Email address of the user who created this timecard.
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Full name of the user who created this timecard.
                          example: Carl Contractor
                    login_information:
                      type: object
                      properties:
                        id:
