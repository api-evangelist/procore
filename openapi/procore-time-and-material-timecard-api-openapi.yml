                  description: Time And Material Timecard
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the Time & Material timecard.
                      example: 1023
                    hours_worked:
                      type: number
                      format: float
                      description: Total hours worked for this timecard entry.
                      example: '7.5'
                    company_id:
                      type: integer
                      description: Identifier of the company that owns this timecard.
                      example: 1509
                    project_id:
                      type: integer
                      description: Unique identifier for the project.
                      example: 14406
                    time_and_material_entry_id:
                      type: integer
                      description: Identifier of the Time & Material entry this timecard belongs to.
                      example: 13
                    timecard_time_type_id:
                      type: integer
                      description: Identifier of the time type (e.g., Regular Time, Overtime) applied to this timecard.
                      example: 19
                    work_classification_id:
                      type: integer
                      description: Identifier of the worker's trade or work classification.
                      example: 10
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when this timecard was last modified, in ISO 8601 format.
                      example: '2019-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this timecard was created, in ISO 8601 format.
                      example: '2019-11-12T21:26:28Z'
