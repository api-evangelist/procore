openapi: 3.2.0
info:
  title: Procore REST Project API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Project
paths:
  /rest/v2.0/companies/{company_id}/estimating/bid_board_projects/{bid_board_project_id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      tags:
      - Project
      summary: Get Bid Board project by id
      operationId: Project_GetProject
      parameters:
      - name: bid_board_project_id
        in: path
        required: true
        description: Unique BidBoard project identifier
        schema:
          type: string
          format: int64
        x-position: 1
      - name: company_id
        in: path
        required: true
        description: Unique company identifier associated with the Procore User Account.
        schema:
          type: string
        x-position: 2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type:
                    - object
                    - 'null'
                    description: Represents a project with its details and configurations.
                    additionalProperties: false
                    properties:
                      use_hip_and_valley:
                        type: boolean
                        description: Indicates whether the Bid Board project includes hip and valley calculations.
                      deleted:
                        type: boolean
                        description: Indicates whether the Bid Board project is deleted.
                        example: false
                      use_unit_labor_cost:
                        type: boolean
                        description: Indicates whether the Bid Board project uses unit labor cost.
                      wbs_validation_enabled:
                        type:
                        - boolean
                        - 'null'
                        description: Indicates whether WBS validation is enabled for the Bid Board project.
                      disable_ea_parts_rounding:
                        type: boolean
                        description: Indicates whether EA parts rounding is disabled for the Bid Board project.
                      estimator_user_id:
                        type:
                        - string
                        - 'null'
                        description: The unique identifier for the estimator associated with the project. Use the "Company Users" endpoint to retrieve full user details.
                      office_id:
                        type:
                        - string
                        - 'null'
                        description: The unique identifier for the Procore office associated with the project. Use the "Company Offices" endpoint to retrieve office details.
                      customer_company:
                        type:
                        - object
                        - 'null'
                        description: Represents the customer company (vendor) associated with the project.
                        additionalProperties: false
                        properties:
                          id:
                            type:
                            - string
                            - 'null'
                            description: The Procore vendor identifier for the customer company. Use the Procore "List company vendors" endpoint (GET /rest/v1.0/vendors?company_id={companyId}) to look up vendor ids and retrieve full vendor details. Null when the customer company is not a Procore directory vendor (Estimating-only).
                          name:
                            type:
                            - string
                            - 'null'
                            description: The name of the customer company.
                      id:
                        type:
                        - string
                        - 'null'
                        description: The unique identifier of the Bid Board project.
                      name:
                        type:
                        - string
                        - 'null'
                        description: The name of the Bid Board project.
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the Bid Board project.
                      created_on:
                        type:
                        - string
                        - 'null'
                        description: The creation date of the Bid Board project.
                        format: date-time
                      due_date:
                        type:
                        - string
                        - 'null'
                        description: The due date of the Bid Board project.
                        format: date-time
                        example: '2025-01-22T16:40:00Z'
                      last_status_change:
                        type:
                        - string
                        - 'null'
                        description: The date when the Bid Board project's status was last changed.
                        format: date-time
                      status:
                        type: string
                        description: The current status of the project.
                        x-enumNames:
                        - Estimating
                        - BidSubmitted
                        - Accepted
                        - Delayed
                        - Lost
                        - InProgress
                        - Complete
                        - Invitation
                        - ToDo
                        - CustomStage1
                        - CustomStage2
                        - CustomStage3
                        - CustomStage4
                        - CustomStage5
                        - CustomStage6
                        - CustomStage7
                        enum:
                        - ESTIMATING
                        - BID_SUBMITTED
                        - ACCEPTED
                        - DELAYED
                        - LOST
                        - IN_PROGRESS
                        - COMPLETE
                        - INVITATION
                        - TO_DO
                        - CUSTOM_STAGE1
                        - CUSTOM_STAGE2
                        - CUSTOM_STAGE3
                        - CUSTOM_STAGE4
                        - CUSTOM_STAGE5
                        - CUSTOM_STAGE6
                        - CUSTOM_STAGE7
                      archived:
                        type: boolean
                        description: Indicates whether the Bid Board project is archived.
                        example: false
                      use_metric_units:
                        type: boolean
                        description: Indicates whether the Bid Board project uses metric units.
                      use_tax_from_cost:
                        type: boolean
                        description: Indicates whether the Bid Board project uses tax calculations based on cost.
                      individual_labor_rates:
                        type: boolean
                        description: Indicates whether the Bid Board project uses individual labor rates.
                      stats:
                        type:
                        - object
                        - 'null'
                        description: The Bid Board project statistics.
                        additionalProperties: false
                        properties:
                          total:
                            type: number
                            description: The total cost or value associated with the Bid Board project.
                            format: decimal
                          completed_tasks:
                            type: integer
                            description: The number of completed tasks in the Bid Board project.
                            format: int32
                          total_tasks:
                            type: integer
                            description: The total number of tasks in the Bid Board project.
                            format: int32
                          total_notes:
                            type: integer
                            description: The total number of notes associated with the Bid Board project.
                            format: int32
                      project_number:
                        type:
                        - string
                        - 'null'
                        description: The Bid Board project number.
                      square_footage:
                        type:
                        - number
                        - 'null'
                        description: The square footage of the Bid Board project.
                        format: decimal
                        example: 0
                      pricing_locked:
                        type: boolean
                        description: Indicates whether the Bid Board project pricing is locked.
                        example: false
                      address:
                        type:
                        - object
                        - 'null'
                        description: The address associated with the Bid Board project.
                        additionalProperties: false
                        properties:
                          street:
                            type:
                            - string
                            - 'null'
                            description: The street address.
                          city:
                            type:
                            - string
                            - 'null'
                            description: The city of the address.
                          state:
                            type:
                            - string
                            - 'null'
                            description: The state of the address.
                          zip:
                            type:
                            - string
                            - 'null'
                            description: The zip code of the address.
                          country:
                            type:
                            - string
                            - 'null'
                            description: The country of the address.
                      is_template:
                        type: boolean
                        description: Indicates whether the Bid Board project is a template.
                        example: false
                      updated_at:
                        type:
                        - string
                        - 'null'
                        description: The date and time when the Bid Board project was last updated.
                        format: date-time
                        example: '2026-03-25T13:25:00Z'
                      project_id:
                        type:
                        - string
                        - 'null'
                        description: 'The Procore Portfolio project identifier linked to this Bid Board project. Null if the Bid Board project is not added to Portfolio.

                          Use this to join Bid Board Project data with the Procore Portfolio Project API data.'
                      primary_contact:
                        description: The primary contact of the customer company associated with the project. For projects linked to a Procore bid, the bid requester is available via the Procore Bidding APIs.
                        type:
                        - object
                        - 'null'
                        additionalProperties: false
                        properties:
                          id:
                            type:
                            - string
                            - 'null'
                            description: The Procore user identifier for the contact. Use the Procore "List company users" endpoint (GET /rest/v1.1/companies/{companyId}/users?filters[vendor_id]={customer_company.id}) to look up user ids for a given vendor. "0" identifies the vendor's default primary contact. Null when the customer company is not a Procore directory vendor (Estimating-only).
                          name:
                            type:
                            - string
                            - 'null'
                            description: The name of the contact.
                          email:
                            type:
                            - string
                            - 'null'
                            description: The email address of the contact.
                          phone:
                            type:
                            - string
                            - 'null'
                            description: The phone number of the contact.
                          address:
                            description: The address of the contact.
                            type:
                            - object
                            - 'null'
                            additionalProperties: false
                            properties:
                              street:
                                type:
                                - string
                                - 'null'
                                description: The street address.
                              city:
                                type:
                                - string
                                - 'null'
                                description: The city of the address.
                              state:
                                type:
                                - string
                                - 'null'
                                description: The state of the address.
                              zip:
                                type:
                                - string
                                - 'null'
                                description: The zip code of the address.
                              country:
                                type:
                                - string
                                - 'null'
                                description: The country of the address.
