      x-changelog:
      - summary: Introducing new endpoint to get Bid Board project by ID
        description: This endpoint allows retrieving a Bid Board project by its ID.
        endpoint: GET /companies/{company_id}/estimating/bid_board_projects/{bid_board_project_id}
        type: new
        breaking: false
        datestamp: '2024-07-25'
        versions:
        - v2.0
      - summary: Introducing new fields in the response of Bid Board project endpoints
        description: 'The response of Bid Board project endpoints now includes new fields: estimator_user_id, office_id, customer_company and updated_at.'
        endpoint: GET /companies/{company_id}/estimating/bid_board_projects/{bid_board_project_id}
        type: refinement
        breaking: false
        datestamp: '2026-04-01'
        versions:
        - v2.0
      - summary: 'Introducing new field to the response models: project_id'
        description: 'The response of Bid Board project endpoints now includes project_id: the Procore Portfolio project identifier linked to this Bid Board project.'
        endpoint: GET /companies/{company_id}/estimating/bid_board_projects/{bid_board_project_id}
        type: refinement
        breaking: false
        datestamp: '2026-05-18'
        versions:
        - v2.0
      - summary: 'Introducing new field to the response models: primary_contact'
        description: 'The response of single Bid Board project endpoints now includes primary_contact: the primary contact of the project''s customer company. The primary_contact.id is the Procore user identifier (look it up via GET /rest/v1.1/companies/{companyId}/users?filters[vendor_id]={customer_company.id}); "0" identifies the customer company''s default contact. The id is null when the customer company is not a Procore directory vendor. For projects linked to a Procore bid, the bid requester is available via the Procore Bidding APIs.'
        endpoint: GET /companies/{company_id}/estimating/bid_board_projects/{bid_board_project_id}
        type: refinement
        breaking: false
        datestamp: '2026-09-14'
        versions:
        - v2.0
