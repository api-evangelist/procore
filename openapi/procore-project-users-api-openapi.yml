                      vendor:
                        type: object
                        title: Compact
                        properties:
                          id:
                            type: integer
                            description: Unique integer identifier for this vendor/company.
                            example: 161072
                          name:
                            type: string
                            description: Display name of the vendor or contractor company.
                            example: SID Architecture
                  - type: object
                    title: web view
                    description: Project Person
