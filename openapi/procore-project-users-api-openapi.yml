  /rest/v1.0/projects/{project_id}/people:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Project People
      description: 'Return a list of People associated with a Project. Includes users in the directory and reference users.


        See Filtering on List Actions for information on using the filtering capabilities provided by this endpoint.'
      tags:
      - Project Users
      parameters:
      - name: view
        in: query
        description: Specifies which view of the resource to return (which attributes should be present in the response). Users without read permissions to Directory are limited to the normal and extended views. If a valid view is not provided, it will default to normal.
        schema:
          type: string
          enum:
          - extended
          - normal
          - web
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[is_employee]
        in: query
        description: If true, returns item(s) where `is_employee` value is true.
        required: false
        schema:
          type: boolean
      - name: filters[reference_users_only]
        in: query
        required: false
        description: If true, returns only people who are reference users.
        schema:
          type: boolean
      - name: filters[without_reference_users]
        in: query
        required: false
        description: If true, returns only people who are not reference users.
        schema:
          type: boolean
      - name: filters[include_company_people]
        in: query
        required: false
        description: If true, returns people in the Company not just the Project. This option only works if the user has permission to create people in the project directory or permission to read from the company directory.
        schema:
          type: boolean
      - name: filters[search]
        in: query
        description: Returns People where the search string matches the Person's name (first, last, or full), email address, mobile phone, business phone, fax number, or job title.
        required: false
        schema:
          type: string
      - name: filters[connected]
        in: query
        description: If true, returns only people who are connected users. If false, returns only people who are not connected users.
        required: false
        schema:
          type: boolean
      - name: filters[vendor_id]
        in: query
        description: Return item(s) with the specified Vendor IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[job_title]
        in: query
        description: Returns only people who have the specified job title.
        required: false
        schema:
          type: string
      - name: filters[country_code]
        in: query
        description: Returns only people who have the specified country code.
        required: false
        schema:
          type: string
      - name: filters[state_code]
        in: query
        description: Returns only people who have the specified state code.
        required: false
        schema:
          type: string
      - name: filters[trade_id]
        in: query
        description: Array of Trade IDs. Returns item(s) with the specified Trade IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[permission_template_id]
        in: query
        description: Array of Permission Template IDs. Returns item(s) with the specified Permission Template IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: sort
        in: query
        description: Return items with the specified sort
        required: false
        schema:
          type: string
          enum:
          - name
          - vendor_name
          - job_title
          - permission_template
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of project People
                items:
