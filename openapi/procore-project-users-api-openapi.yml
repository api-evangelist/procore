  /rest/v1.0/projects/{project_id}/users:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Project Users
      description: 'Returns a list of active users associated with a project.


        See Filtering on List Actions for information on using the filtering capabilities provided by this endpoint.'
      tags:
      - Project Users
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: Specifies which view of the resource to return (which attributes should be present in the response). Users without read permissions to Directory are limited to the compact view. Otherwise, the default view is normal.
        schema:
          type: string
          enum:
          - compact
          - normal
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[permission_template]
        in: query
        description: Permission Template ID. Returns item(s) assiociated with the specified Permission Template ID.
        schema:
          type: integer
      - name: filters[vendor_id]
        in: query
        description: Return item(s) with the specified Vendor IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[origin_id]
        in: query
        description: Origin ID. Returns item(s) with the specified Origin ID.
        required: false
        schema:
          type: string
      - name: filters[trade_id][]
        in: query
        description: Returns users whose vendor record is associated with the specified trade id(s).
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[search]
        in: query
        description: Returns users where the search string matches the user's first name, last name, email address, keywords, job title, or company name
        required: false
        schema:
          type: string
      - name: filters[employee]
        in: query
        description: Returns users whose is_employee attribute matches the parameter.
        required: false
        schema:
          type: boolean
      - name: filters[id][]
        in: query
        description: Returns users whose id attribute matches the parameter.
        required: false
        explode: true
        style: form
        schema:
          type: array
          items:
            type: integer
      - name: filters[search_by_full_name]
        in: query
        description: Returns users whose full_name matches the parameter.
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Returns items with the specified sort.
        required: false
        schema:
          type: string
          enum:
          - name
          - vendor_name
          - permission_template
