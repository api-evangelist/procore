  /rest/v1.0/companies/{company_id}/capital_planning/projects/{procore_project_id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    patch:
      description: Upserts capital planning data for a project. Handles planned_amount auto-fill, monthly_forecast merge, and budget_type switching.
      operationId: CapitalPlanProjectsController_updateProject_rest/v1.0
      parameters:
      - name: company_id
        required: true
        in: path
        description: Procore company identifier
        schema:
          type: string
      - name: procore_project_id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planned_amount:
                  type:
                  - string
                  - 'null'
                  example: '500000.00'
                  description: 'Set a Planned Amount. Use "0.00" to clear and freeze at zero. null means never set — the response follows the live budget (COALESCE(revised_budget, estimated_budget)). To store blank with no tracking, send planned_amount: null with budget_cleared: true.'
                budget_type:
                  allOf:
                  - type: string
                    enum:
                    - lump_sum
                    - multiple_line_items
                    - synced_original_budget
                    - synced_revised_budget
                budget_cleared:
                  type: boolean
                  example: false
                  description: When true with a null planned_amount, the cell stays blank and does not track the budget. An explicit budget_cleared in the same request wins even alongside a non-null planned_amount.
                in_plan:
                  type: boolean
                  example: true
                planned_start_date:
                  type:
                  - string
                  - 'null'
                  example: '2027-03-01'
                planned_end_date:
                  type:
                  - string
                  - 'null'
                  example: '2029-06-30'
                curve_type:
                  allOf:
                  - type: string
                    enum:
                    - front_loaded
                    - back_loaded
                    - bell
                    - linear
                    - manual
                monthly_forecasts:
                  type: object
                  additionalProperties:
                    type:
                    - string
                    - 'null'
                  description: Manual forecast values keyed by month (`YYYY-MM`); a null clears that month. At most 240 months in one request. Keys that are exactly one fiscal year (12 consecutive FY-aligned months) or one fiscal quarter (3 consecutive FY-aligned months) record a single `FY{year}` / `FQ{n} {year}` change-history row, not one row per month — that is the current FE year/quarter cell payload.
                  example:
                    2026-01: '50000.00'
                    2026-02: null
      responses:
        '200':
          description: Updated project row with meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      procore_project_id:
                        type: string
                        example: '9988'
                      procore_program_id:
                        type:
                        - string
                        - 'null'
                        example: '456'
                      program_name:
                        type:
                        - string
                        - 'null'
                        example: Infrastructure
                        description: Display name of the legacy Procore program the project belongs to (the flat-view Program column); null when unassigned.
                      portfolio_program_uuid:
                        type:
                        - string
                        - 'null'
                        format: uuid
                        example: 6f1d2c3e-4b5a-4c6d-8e7f-9a0b1c2d3e4f
                        description: The portfolio-hierarchy node the project belongs to; null when unassigned. Always null on snapshot reads (not captured).
                      name:
                        type: string
                        example: Tower A
                      number:
                        type:
                        - string
                        - 'null'
                        example: P-001
                      stage:
                        type:
                        - string
                        - 'null'
                        example: Concept
                      priority:
                        type:
                        - string
                        - 'null'
                        example: high
                      region:
                        type:
                        - string
                        - 'null'
                        example: EMEA
                      project_type:
                        type:
                        - string
                        - 'null'
                        example: Healthcare
                      departments:
                        example:
                        - Engineering
                        - Finance
                        type: array
                        items:
                          type: string
                      budget_type:
                        allOf:
                        - type: string
                          enum:
                          - lump_sum
                          - multiple_line_items
                          - synced_original_budget
                          - synced_revised_budget
                      planned_amount:
                        type:
                        - string
                        - 'null'
                        example: '500000.00'
                        description: Effective Planned Amount. When the stored column is null and budget_cleared is false, this is resolved from COALESCE(revised_budget, estimated_budget) and tracks later budget changes. A stored "0.00" is a cleared value and does not re-prefill.
                      budget_cleared:
                        type: boolean
                        example: false
                        description: True when the Planned Amount was explicitly emptied (null + no budget tracking). False for untouched (tracks budget), set, or cleared-to-zero ("0.00") cells.
                      monthly_forecasts:
                        type: object
                        additionalProperties:
                          type: string
                        example:
                          2026-01: '50000.00'
                      original_budget:
                        type:
                        - string
                        - 'null'
                        example: '450000.00'
                      revised_budget:
                        type:
                        - string
                        - 'null'
                        example: '475000.00'
                      estimated_budget:
                        type:
                        - string
                        - 'null'
                        example: '300000.00'
                      job_to_date_costs:
                        type:
                        - string
                        - 'null'
                        example: '120000.00'
                      forecast_to_complete:
                        type:
                        - string
                        - 'null'
                        example: '70000.00'
                      estimated_cost_at_completion:
                        type:
                        - string
                        - 'null'
                        example: '190000.00'
                      remaining:
                        type:
                        - string
                        - 'null'
                        example: '380000.00'
                      has_budget:
                        type: boolean
                        example: true
                      budget_url:
                        type:
                        - string
                        - 'null'
                        example: https://app.procore.com/123456/project/budget
                      currency_code:
                        type:
                        - string
                        - 'null'
                        example: USD
                      planned_start_date:
                        type:
                        - string
                        - 'null'
                        example: '2027-03-01'
                      planned_end_date:
                        type:
                        - string
                        - 'null'
                        example: '2029-06-30'
                      curve_type:
                        type:
                        - string
                        - 'null'
                        enum:
                        - front_loaded
                        - back_loaded
                        - bell
                        - linear
                        - manual
                      in_plan:
                        type: boolean
                        example: true
                        description: Whether the project counts toward the capital plan. A project with no capital_plan_projects row reads as true.
                    required:
                    - procore_project_id
                    - procore_program_id
                    - program_name
                    - portfolio_program_uuid
                    - name
                    - number
                    - stage
                    - priority
                    - region
                    - project_type
                    - departments
                    - budget_type
                    - planned_amount
                    - budget_cleared
                    - monthly_forecasts
                    - original_budget
                    - revised_budget
                    - estimated_budget
                    - job_to_date_costs
                    - forecast_to_complete
                    - estimated_cost_at_completion
                    - remaining
                    - has_budget
                    - budget_url
                    - currency_code
                    - planned_start_date
                    - planned_end_date
                    - curve_type
                    - in_plan
                  meta:
                    type: object
                    properties:
                      line_items_deleted:
                        type: boolean
                        example: false
                      deleted_line_item_count:
                        type: number
                        example: 0
                    required:
                    - line_items_deleted
                    - deleted_line_item_count
                required:
                - data
                - meta
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
