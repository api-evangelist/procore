        exposure: public
      summary: List Company Roles
      description: Returns project roles for the specified company.
      tags:
      - Roles
      parameters:
      - name: page
        in: query
        description: Page number for pagination.
        required: false
        schema:
          type: integer
          default: 1
      - name: per_page
        in: query
        description: Number of roles to return per page.
        required: false
        schema:
          type: integer
          default: 100
      - name: filters[users_only]
        in: query
        description: When true, return only roles of type contact.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Project roles for the company.
                    items:
                      title: Role
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the project role.
                          example: '12345'
                        add_to_project_team:
                          type: boolean
                          description: Whether contacts holding this role on a project are listed in the Project Team section of Project Home. This is a display setting only; it does not assign anyone to a project.
                          default: true
                        archetype:
                          type: string
                          description: Industry grouping for the role.
                          enum:
                          - construction_managers
                          - design_team
                          - general_contractors
                          - miscellaneous
                          - owner
                          - specialty_contractors
                          - subcontractors
                          example: owner
                        deletable:
                          type: boolean
                          description: Whether the role can be deleted. False when project role memberships exist.
                          example: true
                          readOnly: true
                        display_on_company_home:
                          type: boolean
                          description: Whether the role is shown on the company home page.
                          example: true
                        name:
                          type: string
                          description: Display name of the role.
                          example: Owner
                        type:
                          type: string
                          description: Whether the role applies to people (contact) or companies (vendor).
                          enum:
                          - contact
                          - vendor
                          example: contact
                        position:
                          type: integer
                          description: Sort order of the role within the company.
                          example: 0
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
