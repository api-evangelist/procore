        required: true
        schema:
          type: string
      - name: item_id
        in: path
        description: Unique identifier of the item being edited
        required: true
        schema:
          type: string
      - name: operation_id
        in: path
        description: Idempotent operation identifier returned by POST pages/edit
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      operation_id:
                        type: string
                      linearized_fas_id:
                        type: string
                      total_page_count:
                        type: integer
                        format: int32
                      already_applied:
