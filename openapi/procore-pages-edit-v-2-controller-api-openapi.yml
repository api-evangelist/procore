          conn = http.client.HTTPConnection("localhost:8080")


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/file_processors/%7Bitem_type%7D/%7Bitem_id%7D/pages/edit/version")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
