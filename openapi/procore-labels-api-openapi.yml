      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      tags:
      - Labels
      summary: Adds existing labels to specified resources
      description: 'Associates one or more existing labels with one or more resources (materials or documents).

        Labels must already exist within the company and project scope.'
      operationId: Labels_AddLabelsToResources
      parameters:
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Details of labels and resources.
        content:
          application/json:
            schema:
              required:
              - label_guids
              type: object
              properties:
                label_guids:
                  type: array
                  items:
                    type: string
                    format: uuid
                resource_guids:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    format: uuid
              additionalProperties: false
      responses:
        '204':
          description: No Content
        '400':
