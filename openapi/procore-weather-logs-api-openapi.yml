      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Weather Logs
      description: 'Returns all Weather Logs for the current date.


        See Working with Daily Logs for information on filtering the response using the log\_date, start\_date, and end\_date parameters. Note that if none of the date parameters are provided in the call, only logs from the current date are returned.'
      tags:
      - Weather Logs
      parameters:
      - name: log_date
        in: query
        description: Date of specific logs desired. Example formats YYYY-MM-DD, YYYY/MM/DD, DD-MM-YYYY, DD/MM/YYYY
        schema:
          type: string
          format: date
      - name: start_date
        in: query
        description: Start date of specific logs desired. Use together with end_date to specify a date range. Example formats YYYY-MM-DD, YYYY/MM/DD, DD-MM-YYYY, DD/MM/YYYY
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: End date of specific logs desired. Use together with start_date to specify a date range. Example formats YYYY-MM-DD, YYYY/MM/DD, DD-MM-YYYY, DD/MM/YYYY
        schema:
          type: string
          format: date
      - name: filters[status]
        in: query
        description: Filter on log status
        schema:
          type: string
          enum:
          - all
          - approved
          - pending
      - name: filters[created_by_id]
        in: query
        description: Returns item(s) created by the specified User IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - example:
        - 123456
        name: filters[daily_log_segment_id]
        in: query
        description: Daily Log Segment ID filter
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Weather Log
                  properties:
                    id:
                      type: integer
                      example: 20160101
                    attachments:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          url:
                            type: string
                    average:
                      type: string
                      description: Average temperature for the workday
                      example: 50
