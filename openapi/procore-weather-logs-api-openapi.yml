      summary: List Weather Logs
      x-deprecated-at: '2021-09-03'
      deprecated: true
      description: 'Returns all Weather Logs for the current date.


        See Working with Daily Logs for information on filtering the response using the log\_date, start\_date, and end\_date parameters. Note that if none of the date parameters are provided in the call, only logs from the current date are returned.'
      tags:
      - Weather Logs
      parameters:
      - name: log_date
        in: query
        description: Date of specific logs desired in YYYY-MM-DD format
        schema:
          type: string
          format: date
      - name: start_date
        in: query
        description: Start date of specific logs desired in YYYY-MM-DD format (use together with end_date)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: End date of specific logs desired in YYYY-MM-DD format (use together with start_date)
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - example:
        - 123456
        name: filters[daily_log_segment_id]
        in: query
        description: Daily Log Segment ID filter
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 20160101
                    attachments:
                      type: array
                      description: :filename to be depricated, use :name
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                            description: Use :name, :filename to be deprecated
                          url:
                            type: string
                          filename:
                            type: string
                            description: :filename to be deprecated, use :name
                    average:
                      type: string
                      description: Average temperature for the workday
                      example: 50
                    calamity:
                      type: string
                      description: Type of calamity the jobsite was subject to
                      example: Fire
                    comments:
                      type: string
                      description: Additional comments
                      example: Weather Log Comments
                    created_at:
                      type: string
                      format: date-time
                      description: Created at
                      example: '2012-10-23T21:39:40Z'
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    date:
                      type: string
                      format: date
                      description: 'Format: YYYY-MM-DD Example: 2016-04-19'
                      example: '2016-05-19'
                    datetime:
                      type: string
                      format: date-time
                      description: Estimated UTC datetime of record
                      example: '2016-05-19T12:00:00Z'
                    is_weather_delay:
                      type: integer
                      description: Weather delay status
                      example: 1
                    ground:
                      type: string
                      description: Ground condition
                      example: Dry
                    location:
                      type:
                      - object
                      - 'null'
                      title: Location
                      properties:
                        id:
                          type: integer
                          description: Location ID
                          example: 15504
                        name:
                          type: string
                          description: Location name
                          example: North Building>First Floor>Electrical Closet
                        node_name:
                          type: string
                          description: Location node name
                          example: Electrical Closet
                        parent_id:
                          type:
                          - integer
                          - 'null'
                          description: Location parent id
                          example: 788866
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp of Location creation
                          example: '2016-08-01T23:33:54Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp of last update to Location
                          example: '2016-08-01T23:33:54Z'
                    daily_log_segment_id:
                      type:
                      - integer
                      - 'null'
                      description: Daily Log Segment ID
                      example: 123456
                    daily_log_segment:
                      type:
                      - object
                      - 'null'
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 123456
                        name:
                          type: string
                          description: Name of the segment
                          example: Morning Shift
                        description:
                          type:
                          - string
                          - 'null'
                          description: Description of the segment
                          example: Work performed during the morning shift
                        deleted_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Timestamp when the segment was soft deleted
                          example: '2025-01-15T10:30:00Z'
                        deleted:
                          type: boolean
                          description: Indicates if the segment is deleted
                          example: false
                    position:
                      type: integer
                      description: Order in which this entry was recorded for the day
                      example: 1
                    precipitation:
                      type: string
                      description: Precipitation conditions
                      example: true
                    sky:
                      type: string
                      description: Sky condition
                      example: Clear
                    temperature:
                      type: string
                      description: Weather temperature
                      example: Hot
                    time:
                      type: string
                      format: date-time
                      description: UTC time weather conditions were observed
                      example: '2012-10-24T21:39:40Z'
                    wind:
                      type: string
                      description: Wind condition
                      example: Calm
                    updated_at:
                      type: string
                      format: date-time
                      description: Updated at
                      example: '2012-10-24T21:39:40Z'
                    vendor:
                      type: object
                      title: Compact
                      properties:
                        id:
                          type: integer
                          description: Unique integer identifier for this vendor/company.
                          example: 161072
                        name:
                          type: string
                          description: Display name of the vendor or contractor company.
