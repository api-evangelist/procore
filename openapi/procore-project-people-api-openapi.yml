        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"person\":{\"first_name\":\"string\",\"last_name\":\"string\",\"is_employee\":false,\"employee_id\":\"string\",\"origin_id\":\"string\",\"job_title\":\"Developer\",\"work_classification_id\":398438}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.0/projects/%7Bproject_id%7D/people?view=SOME_STRING_VALUE", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
