        required: true
        content:
          application/json:
            schema:
              title: Project Person Body
              type: object
              required:
              - person
              properties:
                person:
                  title: Project Person
                  type: object
                  required:
                  - last_name
                  properties:
                    first_name:
                      type: string
                      description: The First Name of the Project Person
                    last_name:
                      type: string
                      description: The Last Name of the Project Person
