        link: company-bid-packages?version=1.0#show-bid-package
      operationId: showBidPackage
  /rest/v1.0/companies/{company_id}/bid_packages:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: page
      in: query
      description: Page
      schema:
        type: integer
    - name: per_page
      in: query
      description: Elements per page
      schema:
        type: integer
    - name: sort
      in: query
      description: Direction (asc/desc) can be controlled by the presence or absence of '-' before the sort parameter.
      schema:
        type: string
        enum:
        - bid_package_name
        - project_name
        - bid_due_date
        - bids_sent
        - bids_received
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Bid Packages
      description: Return a list of Bid Packages for a Company.
      tags:
      - Bid Packages
      responses:
        '200':
          description: Bid Packages listed successfully
          headers:
            Per-Page:
