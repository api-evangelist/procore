        description: Added flexible_response_types_enabled boolean flag to the bid package response
        endpoint: GET /companies/{company_id}/bid_packages/{id}
        type: feature
        breaking: false
        datestamp: '2025-03-28'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: company-bid-packages?version=1.0#show-bid-package
      - summary: Added currency configuration fields
        description: 'Added two new fields to support currency configuration:

          - `project_currency_iso_code`: The ISO code of the project''s currency (e.g., ''USD'', ''EUR'')

          - `project_currency_display`: The display format of the project''s currency (e.g., ''$'', ''€'')'
        endpoint: GET /companies/{company_id}/bid_packages/{id}
        type: feature
        breaking: false
        datestamp: '2025-05-16'
