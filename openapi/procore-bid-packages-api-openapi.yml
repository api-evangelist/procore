  /rest/v1.1/projects/{project_id}/bid_packages:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Bid Packages
      description: Return a list of all Bid Packages for a Project.
      tags:
      - Bid Packages
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: When set to all, both open and closed bid packages will be returned. When set to internal, more keys will be made available for each bid package. When set to use_previous_bidders, a key will be made available that will provide information on whether the bid package has bid forms
        schema:
          type: string
          enum:
          - all
          - internal
          - use_previous_bidders
          - use_previous_bid_packages
      - name: filter
        in: query
        description: Filters down list of bid packages for a project.
        schema:
          type: string
          enum:
          - open
          - closed
          - hidden
          - has_bid_forms
      - name: with_flags
        in: query
        required: false
        description: Filter bid packages by available features (e.g., flexible_response_types_enabled, bid_form_sections_enabled). For accurate results in the CPBP feature, both flags should be passed, not just one.
        schema:
          type: array
          items:
            type: string
            enum:
            - flexible_response_types_enabled
            - bid_form_sections_enabled
      - name: sort
        in: query
        description: Direction (asc/desc) can be controlled by the presence or absence of '-' before the sort parameter. Only applies when view=internal.
        schema:
          type: string
          enum:
          - number
          - title
          - bid_due_date
          - invited_bids_count
          - bids_will_bid_count
          - submitted_bids_count
          - status
      - name: filters[bid_due_date]
        in: query
        description: Return item(s) whose associated bid package has the specified bid due date (ISO 8601 date format)
        required: false
        schema:
          type: string
          format: date
      - name: filters[status]
        in: query
        description: Filter by bid package status. Accepted values are 'open', 'closed', or 'hidden'. When omitted, recycle-bin (hidden) bid packages are excluded by default.
        required: false
        schema:
          type: string
          enum:
          - open
          - closed
          - hidden
      - name: filters[created_at]
        in: query
        description: Return item(s) within a specific created at iso8601 datetime range
        required: false
        schema:
          type: string
      - name: filters[has_bid_forms]
        in: query
        description: Filter by bid form presence. When true, only bid packages that have bid forms are returned; when false, only bid packages without bid forms are returned. When omitted, no bid form filtering is applied. This filter is independent of the status filter and can be combined with it.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Bid Packages
                items:
                  type: object
                  allOf:
                  - type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 75414
                      project_id:
                        type: integer
                        description: Unique identifier for the project.
                        example: 2342
                      bid_due_date:
                        type: string
                        format: date-time
                        description: Due date
                        example: '2016-12-13T03:00:00Z'
                      created_at:
                        type: string
                        format: date-time
                        description: Date the Bid Package was created
                        example: '2016-12-01T00:00:00Z'
                      number:
                        type:
                        - integer
                        - 'null'
                        description: Package Number
                        example: 42
                      title:
                        type: string
                        description: Title
                        example: Package Bid
                      submitted_bids_count:
                        type: integer
                        description: Number bids submitted
                        example: 2
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
