openapi: 3.2.0
info:
  title: Procore REST Bid Packages API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Bid Packages
paths:
  /rest/v1.0/companies/{company_id}/bid_packages/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: ID
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Show Bid Package
      description: Return Bid Package detailed information.
      tags:
      - Bid Packages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accept_post_due_submissions:
                    type: boolean
                    description: Accepts bid post due submissions
                    example: false
                  accounting_method:
                    type: string
                    description: Bid package accounting method, either 'amount' or 'unit'
                    example: unit
                  allow_bidder_sum:
                    type: boolean
                    description: Allow lump sum bidding
                    example: false
                  project_currency_iso_code:
                    type: string
                    description: The ISO code of the project's currency (e.g., 'USD', 'EUR')
                    example: USD
                  project_currency_display:
                    type: string
                    description: The display format of the project's currency (e.g., '$', '€')
                    example: $
                  anticipated_award_date:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Anticipated award date
                    example: '2016-12-13'
                  bidding_countdown_email_days:
                    type:
                    - integer
                    - 'null'
                    description: Days before sending countdown email
                    example: 2
                  bid_docs_manifest:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 5324
                      streaming_url:
                        type: string
                        description: Link to the bid package zip file
                        example: https://<server>/download?uuid=<id>
                  bid_due_date:
                    type: string
                    description: Due date
                    format: date-time
                    example: '2016-12-13T03:00:00Z'
                  bid_email_message:
                    type: string
                    description: Information displayed in emails for Bidders
                    example: Procore would like to invite you to bid on new campus.
                  bid_emails_include_link_to_bidding_documents:
                    type: boolean
                    description: Include link to download zipped bidding documents in the Bid Invitation email
                    example: false
                  bid_submission_confirmation:
                    type:
                    - string
                    - 'null'
                    description: Bid Package submission confirmation text
                    example: Your Bid Has Been Successfully Submitted
                  bid_web_message:
                    type: string
                    description: Bid Package instructions for Bidder
                    example: Please reach out to our help desk if you need assistance with bidding.
                  blind_bidding:
                    type: boolean
                    description: Enable blind bidding
                    example: false
                  created_by:
                    type: object
                    properties:
                      email:
                        type: string
                        description: Email
                        example: john.doe@example.com
                      first:
                        type: string
                        description: First name
                        example: John
                      last:
                        type: string
                        description: First name
                        example: Doe
                      numbers:
                        type: string
                        description: Phone numbers
                        example: 512-555-5555
                  distribution_members:
                    type: array
                    description: Array of the distribution members
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          description: Contact email
                          example: john.doe@example.com
                        first:
                          type: string
                          description: Contact first name
                          example: John
                        last:
                          type: string
                          description: Contact last name
                          example: Doe
                        numbers:
                          type: string
                          description: Contact numbers
                          example: 512-555-5555
                  display_project_name:
                    type: boolean
                    description: Display Project Name
                    example: false
                  bid_form_sections_enabled:
                    type: boolean
                    description: Bid Form Sections Enabled
                    example: true
                  flexible_response_types_enabled:
                    type: boolean
                    description: Flexible Response Types Enabled
                    example: true
                  distribution_member_ids:
                    type: array
                    description: Array of distribution member ids
                    items:
                      type: integer
                      description: Distribution member id
                      example: 123
                  enable_countdown_emails:
                    type: boolean
                    description: Enable countdown emails
                    example: false
                  enable_prebid_rfi_deadline:
                    type: boolean
                    description: Enable prebid RFI deadline
                    example: false
                  enable_prebid_walkthrough:
                    type: boolean
                    description: Enable prebid walkthrough
                    example: false
                  has_any_bid_invited:
                    type: boolean
                    description: Has any Bid been Invited
                    example: true
                  has_bids_sent_nda:
                    type: boolean
                    description: Have any Bidders been sent NDA
                    example: true
                  has_no_nda_activity:
                    type: boolean
                    description: Has no Non-Disclosure Agreement activity
                    example: false
                  nda_invited_bids_with_activity_count:
                    type: integer
                    description: Bids count with Non-Disclosure Agreement activity like viewed, declined or downloaded
                    example: 2
                  attachments_zip_streaming_url:
                    type: string
                    description: Streaming URL to download all attachments. It's an optional parameter when the require non-disclosure agreement is on.
                    example: http://www.example.com/
                  hidden:
                    type: boolean
                    description: Whether or not the bid package has been recycled
                    example: true
                  id:
                    type: integer
                    description: ID
                    example: 75414
                  links:
                    type: object
                    description: Links that can be used by Frontend
                    properties:
                      add_vendor:
                        type: string
                        example: /159/project/bid_packages/75/vendors
                      analyticsEventsPath:
                        type: string
                        example: /rest/v1.0/analytic_events
                      attach_documents:
                        type: string
                        example: /159/project/bid_packages/75/attachments
                      bid_list:
                        type: string
                        example: /159/project/bid_packages/75/bidders
                      bid_packages:
                        type: string
                        example: /rest/v1.0/projects/159/bid_packages
                      bid_packages_by_project:
                        type: string
                        example: /159/project/bid_packages/75/search_for_bidders/filter_options/copy_bid_list_from
                      bulk_create_bids:
                        type: string
                        example: /159/project/bid_packages/75/bids/bulk_create
                      cost_codes:
                        type: string
                        example: /159/project/bid_packages/75/search_for_bidders/filter_options/standard_cost_codes
                      overview:
                        type: string
                        example: /159/project/bid_packages/75/overview
                      permission_templates:
                        type: string
                        example: /159/project/bid_packages/permission_templates
                      submit:
                        type: string
                        example: /159/project/bidding/bid_packages/75/add_to_bid_list
                      trades:
                        type: string
                        example: /159/project/bid_packages/75/search_for_bidders/filter_options/trades
                      vendors:
                        type: string
                        example: /159/project/bid_packages/75/vendors
                  lump_sum_bidding:
                    type: boolean
                    description: Lump Sum Bidding Enabled
                    example: true
                  manager:
                    type: object
                    properties:
                      login_information_id:
                        type: integer
                        description: Login Information ID
                        example: 67
                      contact_id:
                        type: integer
                        description: Contact ID
                        example: 345
                      name:
                        type: string
                        description: Manager Name
                        example: John Doe
                      email:
                        type: string
                        description: Manager Email
                        example: null
                      job_title:
                        type: string
                        description: Manager Job Title
                        example: Estimator
                      invited:
                        type: boolean
                        description: User Invited
                        example: true
                      vendor:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Vendor ID
                            example: 123
                          name:
                            type: string
                            description: Vendor name
                            example: Vendor Name
                  nda_attachments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID
                          example: '123'
                        item_type:
                          type: string
                          description: Item Type
                          example: BidPackage
                        item_id:
                          type: string
                          description: Item ID
                          example: '123'
                        prostore_file_id:
                          type: string
                          description: Prostore File ID
                          example: '123'
                        url:
                          type: string
                          description: URL
                          example: https://procoretech-qa.com/v2/d/default/prostore-thumbnail-bucket/453550640
                        name:
                          type: string
                          description: Name
                          example: NDA.pdf
                  number:
                    type:
                    - integer
                    - 'null'
                    description: Bid Package Number
                    example: 46
                  open:
                    type: boolean
                    description: Whether or not the bid package is active
                    example: true
                  point_of_contact:
                    type: object
                    properties:
                      email:
                        type: string
                        description: A person's email
                        example: john.doe@example.com
                      first:
                        type: string
                        description: A person's name
                        example: John
                      last:
                        type: string
                        description: A person's last name
                        example: Doe
                      numbers:
                        type: string
                        description: A person's phone numbers
                        example: '5432132345'
                  point_of_contact_login_id:
                    type:
                    - integer
                    - 'null'
                    description: Point of contact ID
                    example: 123
                  pre_bid_rfi_deadline_date:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Prebid RFI deadline date
                    example: '2016-12-13T03:00:00Z'
                  pre_bid_walk_through_date:
                    type:
                    - string
                    - 'null'
                    description: Scheduled pre-bid walkthrough date
                    format: date-time
                    example: '2016-12-13T03:00:00Z'
                  pre_bid_walk_through_notes:
                    type:
                    - string
                    - 'null'
                    description: Pre-bid walkthrough notes
                    example: So Many Potential Change Orders
                  project_id:
                    type: integer
                    description: Unique identifier for the project.
                    example: 2342
                  project_image_url:
                    type:
                    - string
                    - 'null'
                    description: Link to project image
                    example: https://procoretech-qa.com/v2/d/default/prostore-thumbnail-bucket/453550640
                  project_logo_name:
                    type:
                    - string
                    - 'null'
                    description: Name of the project's logo file
                    example: procore-logo.png
                  project_logo_url:
                    type:
                    - string
                    - 'null'
                    description: Link to project logo image
                    example: https://procoretech-qa.com/v2/d/default/prostore-thumbnail-bucket/453550640
                  project_latitude:
                    type:
                    - string
                    - 'null'
                    description: Latitude of project location
                    example: -119.490849179262
                  project_location:
                    type: string
                    description: Address of bid package project
                    example: 123 Campus Way Carpinteria CA 91303
                  project_longitude:
                    type:
                    - string
                    - 'null'
                    description: Longtitude of project location
                    example: 34.385046412363
                  project_name:
                    type: string
                    description: Name of bid package project
                    example: Procore Campus
                  require_nda:
                    type: boolean
                    description: Require Non-Disclosure Agreement
                    example: false
                  sealed:
                    type: boolean
                    description: Enabled sealed bidding
                    example: false
                  show_bid_info:
                    type: boolean
                    description: Show bid info
                    example: false
                  submitted_bids_count:
                    type: integer
                    description: Number bids submitted
                    example: 2
                  title:
                    type: string
                    description: Title
                    example: Procore Sky Campus
                  enable_public_discovery:
                    type:
                    - boolean
                    - 'null'
                    description: Whether the bid package is discoverable by the public
                    example: false
                  primary_slug_with_ids:
                    type:
                    - string
                    - 'null'
                    description: "Primary public slug for the bid package with company ID and bid package ID prefix \n(format: {company_id}_{bid_package_id}_{slug}). Used in public URLs. \nAuto-generated from title when created or when title is updated.\n\n**Uniqueness:** Guaranteed by the {company_id}_{bid_package_id} prefix, even if \nmultiple bid packages have identical titles. The slug portion may change if the \ntitle is updated."
                    example: 123_456_procore-sky-campus
                  pre_bid_meeting_location:
                    type:
                    - string
                    - 'null'
                    description: Location for the pre-bid meeting
                    example: 123 Main St, Conference Room A, Austin, TX 78701
                  pre_bid_meeting_date:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Date and time for the pre-bid meeting in UTC (ISO 8601 format)
                    example: '2025-10-20T14:00:00Z'
                  pre_bid_meeting_online_link:
                    type:
                    - string
                    - 'null'
                    description: Online meeting link for the pre-bid meeting
                    example: https://example.com
                  pre_bid_meeting_notes:
                    type:
                    - string
                    - 'null'
                    description: Notes for the pre-bid meeting
                    example: Please bring safety equipment and hard hats
                  public_project_funding_source:
                    type:
                    - string
                    - 'null'
                    description: Source of funding for the public project, either 'private' or 'public'
                    example: public
                  show_location_for_nda_projects:
                    type: boolean
                    description: Whether the location for the NDA project is shown
                    example: false
                  public_bid_opening_details_date:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Date and time for the public bid opening in UTC (ISO 8601 format)
                    example: '2025-10-20T14:00:00Z'
                  public_bid_opening_details_location:
                    type:
                    - string
                    - 'null'
                    description: Location for the public bid opening
                    example: City Hall, Room 301, Austin, TX 78701
                  public_bid_opening_details_online_link:
                    type:
                    - string
                    - 'null'
                    format: uri
                    description: Online link for the public bid opening
                    example: https://example.com
                  trades_and_services:
                    type: array
                    description: Array of trades and services
                    items:
                      type: object
                      properties:
                        trade_level:
                          type:
                          - string
                          - 'null'
                          description: The level of the PCN trade classification
                          example: Division
                        trade_path:
                          type:
                          - string
                          - 'null'
                          description: The hierarchical path of the PCN trade
                          example: 03 - Concrete
                        trade_key:
                          type:
                          - string
                          - 'null'
                          description: The unique key identifier for the PCN trade
                          example: '03000'
                  business_classifications:
                    type: array
                    description: Array of business classifications
                    items:
                      type: object
                      properties:
                        classification_name:
                          type:
                          - string
                          - 'null'
                          description: The full name of the business classification
                          example: Asian American Business
                        classification_abbreviation:
                          type:
                          - string
                          - 'null'
                          description: The abbreviated form of the business classification
                          example: ABE
                        classification_key:
                          type:
                          - string
                          - 'null'
                          description: The unique key identifier for the business classification
                          example: ABE
                  lock_unit_fields_base_bid:
                    type: boolean
                    description: Lock unit fields for all base bid items (global setting for new bid forms)
                    example: false
                    default: false
                  lock_quantity_fields_base_bid:
                    type: boolean
                    description: Lock quantity fields for all base bid items (global setting for new bid forms)
                    example: false
                    default: false
                  lock_unit_fields_alternates:
                    type: boolean
                    description: Lock unit fields for all alternate items (global setting for new bid forms)
                    example: false
                    default: false
                  lock_quantity_fields_alternates:
                    type: boolean
                    description: Lock quantity fields for all alternate items (global setting for new bid forms)
                    example: false
                    default: false
                  has_pdm_documents:
                    type: boolean
                    description: Whether the bid package has any PDM documents
                    example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/bid_packages/%7Bid%7D'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/companies/%7Bcompany_id%7D/bid_packages/%7Bid%7D")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/bid_packages/%7Bid%7D"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/bid_packages/%7Bid%7D\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
