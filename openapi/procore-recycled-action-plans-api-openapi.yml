openapi: 3.2.0
info:
  title: Procore REST Recycled Action Plans API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Recycled Action Plans
paths:
  /rest/v1.0/projects/{project_id}/recycle_bin/action_plans/plans:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Recycled Action Plan
      description: Returns a list of Recycled Action Plans for a given project.
      tags:
      - Recycled Action Plans
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[approver_id]
        in: query
        description: Return Action Plan(s) that have any of the specified Party IDs as an Action Plan Approver.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            example: 55
      - name: filters[custom_fields]
        in: query
        description: Return Action Plan(s) whose custom field values match the supplied JSON object. Each key must be a custom field definition ID. A scalar value matches Action Plan(s) whose value for that field is equal to it; an array value matches Action Plan(s) whose value for that field is any one of the supplied values. Supplying more than one key returns only the Action Plan(s) that match every key. Custom fields are configured per Action Plan Type, so an Action Plan whose type does not configure the supplied field never matches.
        required: false
        schema:
          type: object
          description: JSON object where each key is a custom field definition ID
          example: '{"1": true, "5": [4,3] }'
      - name: filters[number]
        in: query
        description: Return Action Plan(s) with the specified Action Plan number(s). A range such as `10...20` is also accepted.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            example: 12
      - name: filters[receiver_id]
        in: query
        description: Return Action Plan(s) that have any of the specified Party IDs as an Action Plan Receiver. Matches every Receiver regardless of whether they have signed.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            example: 61
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[deleted_at]
        in: query
        description: Returns item(s) deleted within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
      - name: filters[deleted_by_id]
        in: query
        description: Return item(s) with a specific Deleted By ID or a range of Deleted By IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[include_sublocations]
        in: query
        description: 'Use together with `filters[location_id]`

          '
        schema:
          type: boolean
          default: false
      - name: filters[location_id]
        in: query
        description: Location ID. Returns item(s) with the specified Location ID or a range of Location IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            example: 45
      - name: filters[manager_id]
        in: query
        description: Return item(s) with a specific Manager ID or a range of Manager ID(s).
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[private]
        in: query
        description: If true, returns only item(s) with a `private` status.
        schema:
          type: boolean
      - name: filters[plan_type_id]
        in: query
        description: Action Plan Type ID. Returns item(s) with the specified Action Plan Type ID(s).
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[company_template_id]
        in: query
        description: Return Action Plan(s) whose resolved company-level Action Plan Template matches the specified ID(s). A project template resolves through its `company_template_id`; a company template matches itself. Pass `null` (or `nil`) to match plans with no resolved company template.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filters[project_template_id]
        in: query
        description: Return Action Plan(s) whose template is a project-level Action Plan Template with the specified ID(s). Pass `null` (or `nil`) to match plans with no project template, including plans created from a company template directly. Distinct from `filters[template_id]`, which matches `itp_plans.template_id` regardless of company vs project scope.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filters[template_id]
        in: query
        description: Return Action Plan(s) associated with the specified Action Plan Template ID(s).
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[root_template_id]
        in: query
        description: 'Return Action Plan(s) whose template lineage root matches the specified ID(s). A project-level copy of a company template resolves to that company template; a company template and a project template with no company lineage each resolve to their own ID. Soft-deleted templates still resolve a root. Pass `null` (or `nil`) to match plans with no template. Distinct from `filters[company_template_id]`, which is the group-by facet: that one excludes soft-deleted templates and places plans with no company lineage in the unassigned bucket rather than under their own ID. Cell `template_id` values returned by the Portfolio `with_action_plans` view use this same roll-up and can be passed straight through.'
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: sort
        in: query
        description: Direction (asc/desc) can be controlled by the presence or absence of '-' before the sort parameter.
        schema:
          type: string
          enum:
          - created_at
          - deleted_at
          - deleted_by
          - location
          - manager
          - number
          - plan_approvers
          - plan_receivers
          - title
          - type
          - updated_at
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Recycled Action Plans (Index)
                items:
                  type: object
                  description: Recycled Action Plan (Show)
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the deleted Action Plan.
                      example: 43584
                    plan_approvers:
                      type: array
                      items:
                        type: object
                        description: Action Plan Approver (Show)
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for this Action Plan Approver. Use as the {plan_approver_id} path parameter to manage the approver's signature.
                            example: 12
                          plan_id:
                            type: integer
                            description: ID of the Action Plan this approver is assigned to. Use as filters[plan_id] to list approvers for a specific plan.
                            example: 54
                          updated_at:
                            type: string
                            description: Timestamp in ISO 8601 format when this approver record was last updated. Use with filters[updated_at] to retrieve recently changed approvers.
                            example: '2018-09-20T21:39:40Z'
                          party:
                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: integer
                                description: Party Person ID
                                example: 23
                              first_name:
                                type: string
                                description: First name of the Party Person
                                example: Paul
                              last_name:
                                type: string
                                description: Last name of the Party Person
                                example: Admin
                              name:
                                type: string
                                description: Full name of the Party Person
                                example: Paul Admin
                              user_id:
                                type: integer
                                description: User ID of the login account associated with this party person.
                                example: 453
                              is_employee:
                                type: boolean
                                description: Whether this party person is an employee of the current company, as opposed to an external vendor contact.
                                example: true
                              employee_id:
                                type:
                                - string
                                - 'null'
                                description: Employee ID string for this party person. Null if no employee ID is assigned.
                                example: '12'
                              login:
                                type: string
                                description: Email address (login) of the party person's user account.
                                example: login@example.com
                              updated_at:
                                type: string
                                format: date-time
                                description: Time the Party Person was updated
                                example: '2018-09-20T21:39:40Z'
                              vendor:
                                type:
                                - object
                                - 'null'
                                properties:
                                  id:
                                    type: integer
                                    description: Unique identifier of the vendor company this party person belongs to.
                                    example: 223
                                  name:
                                    type: string
                                    description: Name of the vendor company this party person belongs to.
                                    example: Freddie's Excavating
                          signature:
                            type:
                            - object
                            - 'null'
                            description: Action Plan Approver Signature (Show)
                            properties:
                              id:
                                type: integer
                                description: Unique identifier for this approver signature record.
                                example: 32
                              attachment:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: Unique identifier of the Prostore file containing the signature image.
                                    example: 23
                                  content_type:
                                    type: string
                                    description: MIME type of the signature file.
                                    example: image/png
                                  name:
                                    type: string
                                    description: File name of the uploaded signature image.
                                    example: image.png
                                  url:
                                    type: string
                                    description: URL to download the signature image. The URL is temporary and expires after a period.
                                    example: https://storage.procore.com/files/signature.png
                              captured_at:
                                type: string
                                format: date-time
                                description: Timestamp in ISO 8601 format when this approver signature was captured.
                                example: '2015-02-07T00:00:00Z'
                              captured_by:
                                type:
                                - object
                                - 'null'
                                properties:
                                  id:
                                    type: integer
                                    description: Party Person ID
                                    example: 23
                                  first_name:
                                    type: string
                                    description: First name of the Party Person
                                    example: Paul
                                  last_name:
                                    type: string
                                    description: Last name of the Party Person
                                    example: Admin
                                  name:
                                    type: string
                                    description: Full name of the Party Person
                                    example: Paul Admin
                                  user_id:
                                    type: integer
                                    description: User ID of the login account associated with this party person.
                                    example: 453
                                  is_employee:
                                    type: boolean
                                    description: Indicates whether Party is an Employee of the current Company
                                    example: true
                                  employee_id:
                                    type:
                                    - integer
                                    - 'null'
                                    description: Employee ID of this party person. Null if no employee ID is assigned.
                                    example: 12
                                  login:
                                    type: string
                                    description: Email address (login) of the party person's user account.
                                    example: contractor@example.com
                                  vendor:
                                    type: object
                                    properties:
                                      id:
                                        type: integer
                                        description: Unique identifier of the vendor company this party person belongs to.
                                        example: 223
                                      name:
                                        type: string
                                        description: Name of the vendor company this party person belongs to.
                                        example: Freddie's Excavating
                                  updated_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp in ISO 8601 format when this party person record was last updated.
                                    example: '2017-01-04T21:27:18Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Time the Action Plan was created
                      example: '2018-09-20T21:39:40Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when the Action Plan was moved to the recycle bin. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
                    deleted_by:
                      type: object
                      description: User who moved this Action Plan to the recycle bin.
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user.
                          example: 808
                        name:
                          type: string
                          description: Full name of the user who deleted the plan.
                          example: Jane Doe
                        login:
                          type: string
                          description: Login email address of the user.
                          example: jane.doe@example.com
                        company_name:
                          type: string
                          description: Name of the vendor the user belongs to within the company. Empty string when the user has no vendor association.
                          example: Acme Construction
                    description:
                      type: string
                      description: Description of the Action Plan in rich text form
                      example: <p>Important Safety Action.</p>
                    description_plain_text:
                      type: string
                      description: Description of the Action Plan in plain text form
                      example: Important Safety Action
                    location:
                      type:
                      - object
                      - 'null'
                      title: Location
                      properties:
                        id:
                          type: integer
                          description: Location ID
                          example: 15504
                        name:
                          type: string
                          description: Location name
                          example: North Building>First Floor>Electrical Closet
                        node_name:
                          type: string
                          description: Location node name
                          example: Electrical Closet
                        parent_id:
                          type:
                          - integer
                          - 'null'
                          description: Location parent id
                          example: 788866
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp of Location creation
                          example: '2016-08-01T23:33:54Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp of last update to Location
                          example: '2016-08-01T23:33:54Z'
                        code:
                          type:
                          - string
                          - 'null'
                          description: The unique code for this Location
                          example: L1
                    manager:
                      type:
                      - object
                      - 'null'
                      properties:
                        id:
                          type: integer
                          description: Party Person ID
                          example: 23
                        first_name:
                          type: string
                          description: First name of the Party Person
                          example: Paul
                        last_name:
                          type: string
                          description: Last name of the Party Person
                          example: Admin
                        name:
                          type: string
                          description: Full name of the Party Person
                          example: Paul Admin
                        user_id:
                          type: integer
                          description: User ID of the login account associated with this party person.
                          example: 453
                        is_employee:
                          type: boolean
                          description: Whether this party person is an employee of the current company, as opposed to an external vendor contact.
                          example: true
                        employee_id:
                          type:
                          - string
                          - 'null'
                          description: Employee ID string for this party person. Null if no employee ID is assigned.
                          example: '12'
                        login:
                          type: string
                          description: Email address (login) of the party person's user account.
                          example: login@example.com
                        updated_at:
                          type: string
                          format: date-time
                          description: Time the Party Person was updated
                          example: '2018-09-20T21:39:40Z'
                        vendor:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: integer
                              description: Unique identifier of the vendor company this party person belongs to.
                              example: 223
                            name:
                              type: string
                              description: Name of the vendor company this party person belongs to.
                              example: Freddie's Excavating
                    number:
                      type: integer
                      description: Sequential number assigned to the Action Plan within its project.
                      example: 3
                    plan_receivers:
                      type: array
                      items:
                        type: object
                        description: Action Plan Receiver (Show)
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for this Action Plan receiver assignment.
                            example: 54
                          plan_id:
                            type: integer
                            description: ID of the Action Plan this receiver is assigned to. Use as the plan_id filter when listing receivers for a specific plan.
                            example: 54
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp in ISO 8601 format when this receiver assignment was last updated.
                            example: '2018-09-20T21:39:40Z'
                          party:
                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: integer
                                description: Party Person ID
                                example: 23
                              first_name:
                                type: string
                                description: First name of the Party Person
                                example: Paul
                              last_name:
                                type: string
                                description: Last name of the Party Person
                                example: Admin
                              name:
                                type: string
                                description: Full name of the Party Person
                                example: Paul Admin
                              user_id:
                                type: integer
                                description: User ID of the login account associated with this party person.
                                example: 453
                              is_employee:
                                type: boolean
                                description: Whether this party person is an employee of the current company, as opposed to an external vendor contact.
                                example: true
                              employee_id:
                                type:
                                - string
                                - 'null'
                                description: Employee ID string for this party person. Null if no employee ID is assigned.
                                example: '12'
                              login:
                                type: string
                                description: Email address (login) of the party person's user account.
                                example: login@example.com
                              updated_at:
                                type: string
                                format: date-time
                                description: Time the Party Person was updated
                                example: '2018-09-20T21:39:40Z'
                              vendor:
                                type:
                                - object
                                - 'null'
                                properties:
                                  id:
                                    type: integer
                                    description: Unique identifier of the vendor company this party person belongs to.
                                    example: 223
                                  name:
                                    type: string
                                    description: Name of the vendor company this party person belongs to.
                                    example: Freddie's Excavating
                          signature:
                            type:
                            - object
                            - 'null'
                            description: Action Plan Receiver Signature (Show)
                            properties:
                              id:
                                type: integer
                                description: Unique identifier for this signature record.
                                example: 32
                              attachment:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: Unique identifier of the Prostore file containing the signature image.
                                    example: 23
                                  content_type:
                                    type: string
                                    description: MIME type of the signature file.
                                    example: image/png
                                  name:
                                    type: string
                                    description: File name of the uploaded signature image.
                                    example: action_plan_receiver_signature_1.png
                                  url:
                                    type: string
                                    description: URL to download the signature image. The URL is temporary and expires after a period.
                                    example: https://storage.procore.com/files/signature.png
                              captured_at:
                                type: string
                                format: date-time
                                description: Timestamp in ISO 8601 format when the signature was captured.
                                example: '2015-02-07T00:00:00Z'
                              captured_by:
                                type:
                                - object
                                - 'null'
                                properties:
                                  id:
                                    type: integer
                                    description: Party Person ID
                                    example: 23
                                  first_name:
                                    type: string
                                    description: First name of the Party Person
                                    example: Paul
                                  last_name:
                                    type: string
                                    description: Last name of the Party Person
                                    example: Admin
                                  name:
                                    type: string
                                    description: Full name of the Party Person
                                    example: Paul Admin
                                  user_id:
                                    type: integer
                                    description: User ID of the login account associated with this party person.
                                    example: 453
                                  is_employee:
                                    type: boolean
                                    description: Indicates whether Party is an Employee of the current Company
                                    example: true
                                  employee_id:
                                    type:
                                    - integer
                                    - 'null'
                                    description: Employee ID of this party person. Null if no employee ID is assigned.
                                    example: 12
                                  login:
                                    type: string
                                    description: Email address (login) of the party person's user account.
                                    example: contractor@example.com
                                  vendor:
                                    type: object
                                    properties:
                                      id:
                                        type: integer
                                        description: Unique identifier of the vendor company this party person belongs to.
                                        example: 223
                                      name:
                                        type: string
                                        description: Name of the vendor company this party person belongs to.
                                        example: Freddie's Excavating
                                  updated_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp in ISO 8601 format when this party person record was last updated.
                                    example: '2017-01-04T21:27:18Z'
                    plan_type:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the Action Plan type.
                          example: 21
                        active:
                          type: boolean
                          description: Whether this type is enabled for use. When false, it is hidden from selection when creating new plans or templates.
                          example: true
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the type was created. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        name:
                          type: string
                          description: Localized display name of the Action Plan type.
                          example: Safety
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when the type was last modified. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        source_key:
                          type:
                          - string
                          - 'null'
                          description: System key identifying a built-in type. Null for user-created custom types.
                          example: safety
                    plan_status:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the plan status.
                          example: 21
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the status was created. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        global:
                          type: boolean
                          description: Whether this is a system-wide status available to all companies. Global statuses cannot be deleted.
                          example: true
                        name:
                          type: string
                          description: Display name of the plan status (e.g., 'In Progress', 'Closed').
                          example: In Progress
                        status:
                          type: string
                          description: Underlying status type category. Custom company statuses map to one of these base types.
                          example: in_progress
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when the status was last modified. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                    status:
                      type: string
                      description: Display name of the plan status at the time of deletion.
                      enum:
                      - draft
                      - in_progress
                      - completed
                      example: draft
                    title:
                      type: string
                      description: Title of the Action Plan
                      example: A New Action Plan
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when the Action Plan was last modified. ISO 8601 format.
                      example: '2015-03-19T12:00:00Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
