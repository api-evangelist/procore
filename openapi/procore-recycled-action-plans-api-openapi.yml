      - summary: Added filters[root_template_id] to the Recycled Action Plans list
        description: '`GET /projects/{project_id}/recycle_bin/action_plans/plans` now accepts

          `filters[root_template_id]`, inherited from the live Action Plans list.

          Matches plans whose template lineage root is one of the given ids: a

          project-level copy of a company template resolves to that company

          template; a company template and a project template with no company

          lineage each resolve to their own id. Soft-deleted templates still

          resolve a root. Pass `null` (or `nil`) to match plans with no template.'
