openapi: 3.2.0
info:
  title: Procore REST Operations API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Operations
paths:
  /rest/v2.0/companies/{company_id}/async_operations:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Operations
      description: List all asynchronous operations for the company. Non-admin users only see operations they created, unless the request is filtered to a company-readable operation type (for example `bulk_create_and_initialize_projects`) — either directly via `operation_type` or via `parent_id` — in which case matching operations are returned with a restricted payload that omits `result`, `error`, and `created_by_id`.
      tags:
      - Operations
      parameters:
      - name: parent_id
        in: query
        description: Return child operations of the specified parent operation.
        required: false
        schema:
          type: string
      - name: operation_type
        in: query
        description: Return operations of the specified type.
        required: false
        schema:
          type: string
      - name: started_after
        in: query
        description: Return operations that started after this timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - name: started_before
        in: query
        description: Return operations that started before this timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: Return operations with the specified status.
        required: false
        schema:
          type: string
          enum:
          - created
          - in_progress
          - done
          - failed
          - partial_done
          - cancelled
      - name: project_id
        in: query
        description: Return operations associated with the specified project.
        required: false
        schema:
          type: string
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Asynchronous operations matching the request filters.
                    items:
                      type: object
                      description: Asynchronous operation summary for list responses.
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the operation
                          example: '12345'
                        operation_type:
                          type: string
                          description: Kind of asynchronous work this operation performs.
                          example: create_and_initialize_project
                        started_at:
                          type:
                          - string
                          - 'null'
                          description: Timestamp when the operation started. Null if it has not started.
                          format: date-time
                          example: '2024-08-12T08:40:51Z'
                        completed_at:
                          type:
                          - string
                          - 'null'
                          description: Timestamp when the operation finished. Null if it has not completed.
                          format: date-time
                          example: '2024-08-12T08:40:51Z'
                        status:
                          type: string
                          description: Lifecycle state of the operation.
                          enum:
                          - created
                          - in_progress
                          - done
                          - failed
                          - partial_done
                          - cancelled
                        error:
                          description: Failure details when the operation failed. Null otherwise.
                          type:
                          - object
                          - 'null'
                          properties:
                            message:
                              type: string
                              description: Human-readable failure message.
                              example: Item not found
                        result:
                          description: Operation-specific result. See the initiating API for the result format.
                          type:
                          - object
                          - 'null'
                        context:
                          description: Opaque internal context for the operation.
                          type:
                          - object
                          - 'null'
                        created_by_id:
                          type:
                          - string
                          - 'null'
                          description: Login information ID of the user who created the operation.
                          example: '123456'
                        project_id:
                          type:
                          - string
                          - 'null'
                          description: ID of the project the operation belongs to, if any
                          example: '789'
                        parent_id:
                          type:
                          - string
                          - 'null'
                          description: ID of the parent operation, if this operation is a child of a batch operation
                          example: '12344'
                        failure_details:
                          description: Why this operation failed, when the failure was recorded with a reason. Populated for rows of a bulk create that were rejected before a project was attempted, or that failed while initializing. Null for operations that did not fail this way.
                          type:
                          - object
                          - 'null'
                          properties:
                            errors:
                              type: array
                              description: Reasons this operation failed
                              items:
                                type: string
                                example: Name can't be blank
                            submitted_row:
                              type: object
                              description: Values submitted for this row, keyed by bulk-create template column. Restricted to the name and project_number columns for readers who are neither the operation creator nor a company admin.
                              additionalProperties:
                                type: string
                            row_index:
                              type:
                              - integer
                              - 'null'
                              description: Zero-based position of this row in the original bulk-create upload. Present on failed create_and_initialize_project children so clients can label the row and restore upload order. Children are not created in upload order — pre-flight rejects are inserted after executed rows — so created_at is not a substitute.
                              example: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/async_operations',\n  qs: {\n    parent_id: 'SOME_STRING_VALUE',\n    operation_type: 'SOME_STRING_VALUE',\n    started_after: 'SOME_STRING_VALUE',\n    started_before: 'SOME_STRING_VALUE',\n    status: 'SOME_STRING_VALUE',\n    project_id: 'SOME_STRING_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/async_operations?parent_id=SOME_STRING_VALUE&operation_type=SOME_STRING_VALUE&started_after=SOME_STRING_VALUE&started_before=SOME_STRING_VALUE&status=SOME_STRING_VALUE&project_id=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/async_operations?parent_id=SOME_STRING_VALUE&operation_type=SOME_STRING_VALUE&started_after=SOME_STRING_VALUE&started_before=SOME_STRING_VALUE&status=SOME_STRING_VALUE&project_id=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/async_operations?parent_id=SOME_STRING_VALUE&operation_type=SOME_STRING_VALUE&started_after=SOME_STRING_VALUE&started_before=SOME_STRING_VALUE&status=SOME_STRING_VALUE&project_id=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Add parent_id filter to asynchronous operations list endpoint
        description: 'Add a new filter to the asynchronous operations list endpoint to filter child operations by their parent operation id. The parent_id field is now also included in operation responses.

          '
        endpoint: GET /companies/{company_id}/async_operations
        type: feature
        breaking: false
        datestamp: '2026-07-27'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: operations?version=2.0#list-operations
      - summary: Add project_id filter to asynchronous operations list endpoint
        description: 'Add a new filter to the asynchronous operations list endpoint to filter operations by project_id.

          '
        endpoint: GET /companies/{company_id}/async_operations
        type: feature
        breaking: false
        datestamp: '2025-11-12'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: operations?version=2.0#list-operations
      - summary: Add new v2 asynchronous operations list endpoint
        description: 'Add a new v2 endpoint to get a list of asynchronous operations for a company.

          '
        endpoint: GET /companies/{company_id}/async_operations
        type: new
        breaking: false
        datestamp: '2025-01-07'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: operations?version=2.0#list-operations
      - summary: Add created_by_id to asynchronous operations list response
        description: 'Added created_by_id field to the asynchronous operations list response to identify the user who created the operation.

          '
        endpoint: GET /companies/{company_id}/async_operations
        type: feature
        breaking: false
        datestamp: '2026-01-13'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: operations?version=2.0#list-operations
      - summary: Add failure_details to asynchronous operations list response
        description: 'Added an optional failure_details field to the asynchronous operations list response, matching the

          field added to the details response. This field is populated for operations that failed with a

          recorded reason and contains an errors array of failure reasons, a submitted_row object

          holding the values that were submitted, and a row_index integer for the row''s 0-based position

          in the original bulk-create upload. Operations that did not fail this way return null. Readers

          who are neither the operation creator nor a company admin receive submitted_row restricted to the

          name and project_number columns; errors and row_index are returned in full because showing

          reasons to company readers is the purpose of the field.

          '
        endpoint: GET /companies/{company_id}/async_operations
        type: feature
        breaking: false
        datestamp: '2026-08-13'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: operations?version=2.0#list-operations
      - summary: Return the unrestricted view when listing children of an operation you created
        description: 'Filtering the asynchronous operations list by parent_id now returns the unrestricted payload when

          the requesting user created the parent operation, matching the entitlement the details endpoint

          already grants a creator. Previously a creator who was not a company admin was served the

          restricted company-readable payload, which omits result, error, and created_by_id.

          '
        endpoint: GET /companies/{company_id}/async_operations
        type: fix
        breaking: false
        datestamp: '2026-08-13'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: operations?version=2.0#list-operations
      operationId: listOperations
  /rest/v2.0/companies/{company_id}/async_operations/{operation_id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Operation Details
      description: Retrieve details of a specific asynchronous operation for the company. Available to the operation's creator and company admins. For company-readable operation types (for example `bulk_create_and_initialize_projects`), any company member may read the operation, receiving a restricted payload that omits `result`, `error`, `created_by_id`, and `sub_operations`.
      tags:
      - Operations
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
      - name: operation_id
        in: path
        description: Unique identifier for the operation.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Asynchronous operation details for show responses, including sub-operations when present.
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the operation
                        example: '12345'
                      operation_type:
                        type: string
                        description: Kind of asynchronous work this operation performs.
                        example: create_and_initialize_project
                      started_at:
                        type:
                        - string
                        - 'null'
                        description: Timestamp when the operation started. Null if it has not started.
                        format: date-time
                        example: '2024-08-12T08:40:51Z'
                      completed_at:
                        type:
                        - string
                        - 'null'
                        description: Timestamp when the operation finished. Null if it has not completed.
                        format: date-time
                        example: '2024-08-12T08:40:51Z'
                      status:
                        type: string
                        description: Lifecycle state of the operation.
                        enum:
                        - created
                        - in_progress
                        - done
                        - failed
                        - partial_done
                        - cancelled
                      error:
                        description: Failure details when the operation failed. Null otherwise.
                        type:
                        - object
                        - 'null'
                        properties:
                          message:
                            type: string
                            description: Human-readable failure message.
                            example: Item not found
                      result:
                        description: Operation-specific result. See the initiating API for the result format.
                        type:
                        - object
                        - 'null'
                      context:
                        description: Opaque internal context for the operation.
                        type:
                        - object
                        - 'null'
                      created_by_id:
                        type:
                        - string
                        - 'null'
                        description: Login information ID of the user who created the operation.
                        example: '123456'
                      project_id:
                        type:
                        - string
                        - 'null'
                        description: ID of the project the operation belongs to, if any.
                        example: '789'
                      parent_id:
                        type:
                        - string
                        - 'null'
                        description: ID of the parent operation, if this operation is a child of a batch operation
                        example: '12344'
                      failure_details:
                        description: Why this operation failed, when the failure was recorded with a reason. Populated for rows of a bulk create that were rejected before a project was attempted, or that failed while initializing. Null for operations that did not fail this way.
                        type:
                        - object
                        - 'null'
                        properties:
                          errors:
                            type: array
                            description: Reasons this operation failed
                            items:
                              type: string
                              example: Name can't be blank
                          submitted_row:
                            type: object
                            description: Values submitted for this row, keyed by bulk-create template column. Restricted to the name and project_number columns for readers who are neither the operation creator nor a company admin.
                            additionalProperties:
                              type: string
                          row_index:
                            type:
                            - integer
                            - 'null'
                            description: Zero-based position of this row in the original bulk-create upload. Present on failed create_and_initialize_project children so clients can label the row and restore upload order. Children are not created in upload order — pre-flight rejects are inserted after executed rows — so created_at is not a substitute.
                            example: 0
                      progress:
                        description: Progress summary for parent operations that fan out into child operations. Only populated for bulk-create parent operations.
                        type:
                        - object
                        - 'null'
                        properties:
                          total:
                            type: integer
                            description: Total number of child operations (submitted rows), capped at 100
                            example: 100
                          successful:
                            type: integer
                            description: Number of child operations whose base project was successfully initialized
                            example: 95
                          failed:
                            type: integer
                            description: Number of child operations that failed validation or base initialization
                            example: 5
                          in_progress:
                            type: integer
                            description: Number of child operations still in progress
                            example: 0
                          percentage:
                            type: integer
                            description: Percentage of successful base-project initializations (successful / total * 100)
                            example: 95
                      sub_operations:
                        type: array
                        description: Child sub-operations that make up this operation, when present.
                        items:
                          type: object
                          description: Child unit of work within a parent asynchronous operation.
                          properties:
                            id:
                              type: string
                              description: Unique identifier for the sub-operation
                              example: '12345'
                            sub_operation_type:
                              type: string
                              description: Kind of work this sub-operation performs.
                              example: directory_initializer
                            started_at:
                              type:
                              - string
                              - 'null'
                              description: Timestamp when the sub-operation started. Null if it has not started.
                              format: date-time
                              example: '2024-08-12T08:40:51Z'
                            completed_at:
                              type:
                              - string
                              - 'null'
                              description: Timestamp when the sub-operation finished. Null if it has not completed.
                              format: date-time
                              example: '2024-08-12T08:40:51Z'
                            status:
                              type: string
                              description: Lifecycle state of the sub-operation.
                              enum:
                              - created
                              - enqueued
                              - in_progress
                              - done
                              - failed
                              - retry
                              - partial_done
                              - cancelled
                            error:
                              description: Failure details when the sub-operation failed. Null otherwise.
                              type:
                              - object
                              - 'null'
                              properties:
                                message:
                                  type: string
                                  description: Human-readable failure message.
                                  example: Item not found
                            result:
                              description: Sub-operation-specific result. See the initiating API for the result format.
                              type:
                              - object
                              - 'null'
                            context:
                              description: Opaque internal context for the sub-operation.
                              type:
                              - object
                              - 'null'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
