 unit: 'Count',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'CumulativePayloadTotals',\n        name: 'Cumulative Payload Totals',\n        value: '1500.5',\n        unit: 'kilogram',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'Distance',\n        name: 'Distance',\n        value: '25000.5',\n        unit: 'kilometre',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'MaximumSpeedLast24',\n        name: 'Maximum Speed Last 24',\n        value: '45.2304',\n        unit: 'kilometres per hour',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'AverageLoadFactorLast24',\n        name: 'Average Load Factor Last 24',\n        value: '75.25',\n        unit: 'Percent',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'EngineStatus',\n        name: 'Engine Status',\n        value: 'true',\n        unit: 'boolean',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'FuelUsed',\n        name: 'Fuel Used',\n        value: '500',\n        unit: 'litre',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'FuelUsedLast24',\n        name: 'Fuel Used Last 24',\n        value: '50',\n        unit: 'litre',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'FuelRemaining',\n        name: 'Fuel Remaining',\n        value: '30.25',\n        unit: 'Percent',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'DEFRemaining',\n        name: 'DEF Remaining',\n        value: '85.75',\n        unit: 'Percent',\n        datetime: '2025-01-16T12:00:00Z',\n        properties: []\n      },\n      {\n        key: 'TirePressureFrontLeft',\n    