                    name: Fuel Used
                    value: '500'
                    unit: litre
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: FuelUsedLast24
                    name: Fuel Used Last 24
                    value: '50'
                    unit: litre
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: FuelRemaining
                    name: Fuel Remaining
                    value: '30.25'
                    unit: Percent
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: DEFRemaining
                    name: DEF Remaining
                    value: '85.75'
                    unit: Percent
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
