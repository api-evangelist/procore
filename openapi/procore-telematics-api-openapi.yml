25-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"AverageLoadFactorLast24\",\"name\":\"Average Load Factor Last 24\",\"value\":\"75.25\",\"unit\":\"Percent\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"EngineStatus\",\"name\":\"Engine Status\",\"value\":\"true\",\"unit\":\"boolean\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"FuelUsed\",\"name\":\"Fuel Used\",\"value\":\"500\",\"unit\":\"litre\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"FuelUsedLast24\",\"name\":\"Fuel Used Last 24\",\"value\":\"50\",\"unit\":\"litre\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"FuelRemaining\",\"name\":\"Fuel Remaining\",\"value\":\"30.25\",\"unit\":\"Percent\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"DEFRemaining\",\"name\":\"DEF Remaining\",\"value\":\"85.75\",\"unit\":\"Percent\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[]},{\"key\":\"TirePressureFrontLeft\",\"name\":\"Tire Pressure Front Left\",\"value\":\"32\",\"unit\":\"psi\",\"datetime\":\"2025-01-16T12:00:00Z\",\"properties\":[{\"key\":\"Axle\",\"value\":\"1\"}]}]}"


          headers = { ''content-type'': "application/json" }


