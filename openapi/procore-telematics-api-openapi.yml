openapi: 3.2.0
info:
  title: Procore REST Telematics API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Telematics
paths:
  /rest/v2.0/companies/{company_id}/telematics/stats:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      tags:
      - Telematics
      summary: Save telematics stats data
      description: Posts telematics diagnostics for a piece of Procore equipment. Identify the equipment with resource_id, or with oem_id and oem_name when the equipment is already linked to a telematics provider. Use the canonical keys, names, and units as per example. Diagnostics with other keys are also accepted and stored, and are returned by the telematics read endpoints. Diagnostics with an empty value are ignored. Integrations that already produce ISO 15143-3 (AEMP 2.0) payloads should use the AEMP endpoints instead.
      operationId: saveDiagnosticsData
      parameters:
      - name: company_id
        in: path
        description: The ID of the company.
        required: true
        schema:
          type: string
        example: '1234'
      requestBody:
        description: Telematics diagnostics for a single piece of equipment. The example lists every canonical diagnostic, plus one provider-specific diagnostic to show that other keys are accepted.
        content:
          application/json:
            schema:
              type: object
              example:
                header:
                  resource_id: 01JFZBBYQK7H9Z0RNCTM58WDFY
                  resource_type: EQUIPMENT
                  oem_name: CAT
                  oem_id: QK7H9Z0RNCTM58SN01
                  model: 306 CR
                  pin: QK7H9Z0RNCTM58SN01
                location:
                  latitude: -33.867487
                  longitude: 151.20699
                  altitude: 45.5
                  altitude_unit: meter
                  datetime: '2025-01-16T12:00:00Z'
                  properties:
                  - key: Address
                    value: 625 Cesar E. Chavez Avenue, Pontiac, MI, 48342
                diagnostics:
                - key: CumulativeOperatingHours
                  name: Cumulative Operating Hours
                  value: '1000.5'
                  unit: Hour
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: CumulativeIdleHours
                  name: Cumulative Idle Hours
                  value: '200'
                  unit: Hour
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: CumulativeIdleNonOperatingHours
                  name: Cumulative Idle Non Operating Hours
                  value: '50'
                  unit: Hour
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: CumulativeActiveRegenerationHours
                  name: Cumulative Active Regeneration Hours
                  value: '120.5'
                  unit: Hour
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: CumulativePowerTakeOffHours
                  name: Cumulative Power Take Off Hours
                  value: '300'
                  unit: Hour
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: CumulativeLoadCount
                  name: Cumulative Load Count
                  value: '500'
                  unit: Count
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: CumulativePayloadTotals
                  name: Cumulative Payload Totals
                  value: '1500.5'
                  unit: kilogram
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: Distance
                  name: Distance
                  value: '25000.5'
                  unit: kilometre
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: MaximumSpeedLast24
                  name: Maximum Speed Last 24
                  value: '45.2304'
                  unit: kilometres per hour
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: AverageLoadFactorLast24
                  name: Average Load Factor Last 24
                  value: '75.25'
                  unit: Percent
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: EngineStatus
                  name: Engine Status
                  value: 'true'
                  unit: boolean
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: FuelUsed
                  name: Fuel Used
                  value: '500'
                  unit: litre
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: FuelUsedLast24
                  name: Fuel Used Last 24
                  value: '50'
                  unit: litre
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: FuelRemaining
                  name: Fuel Remaining
                  value: '30.25'
                  unit: Percent
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: DEFRemaining
                  name: DEF Remaining
                  value: '85.75'
                  unit: Percent
                  datetime: '2025-01-16T12:00:00Z'
                  properties: []
                - key: TirePressureFrontLeft
                  name: Tire Pressure Front Left
                  value: '32'
                  unit: psi
                  datetime: '2025-01-16T12:00:00Z'
                  properties:
                  - key: Axle
                    value: '1'
              properties:
                header:
                  type: object
                  properties:
                    resource_id:
                      type: string
                      description: Unique identifier assigned to the equipment in Procore. When omitted, oem_id and oem_name must match equipment that is already linked to a telematics provider.
                      example: 01JFZBBYQK7H9Z0RNCTM58WDFY
                    resource_type:
                      type: string
                      description: Resource type against which you want to send data (equipment/labour/material) in Procore. Default value is equipment
                      enum:
                      - EQUIPMENT
                      - LABOUR
                      - MATERIAL
                      example: EQUIPMENT
                    oem_name:
                      type: string
                      description: Telematics provider or equipment OEM name. Required with oem_id when resource_id is omitted.
                      example: CAT
                    oem_id:
                      type: string
                      description: Provider equipment identifier, such as a VIN or serial number. When resource_id is omitted, requires oem_name and equipment that is already linked to a telematics provider.
                      example: QK7H9Z0RNCTM58SN01
                    model:
                      type: string
                      description: Equipment Model
                      example: 306 CR
                    pin:
                      type: string
                      description: OEM ISO Number, can be same as oem_id as per AEMP 2.0 standard.
                      example: QK7H9Z0RNCTM58SN01
                location:
                  type: object
                  properties:
                    latitude:
                      type: number
                      format: double
                      description: Latitude in decimal degrees
                      example: 45.781
                    longitude:
                      type: number
                      format: double
                      description: Longitude in decimal degrees
                      example: -108.503
                    altitude:
                      type: number
                      format: double
                      description: Altitude
                      example: 189
                    altitude_unit:
                      type: string
                      description: Unit of measure for altitude
                      example: meter
                    datetime:
                      type: string
                      format: date-time
                      description: location date- time (ISO 8601 format)
                      example: '2021-08-10T10:00:00Z'
                    properties:
                      type: array
                      description: Additional location properties. Use the key Address for a formatted address.
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            example: Address
                          value:
                            type: string
                            example: 625 Cesar E. Chavez Avenue, Pontiac, MI, 48342
                diagnostics:
                  type: array
                  description: List of diagnostics
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        description: Canonical, case-sensitive diagnostic key returned by the telematics field-definition endpoint. Other keys are also accepted and stored.
                        example: Distance
                      name:
                        type: string
                        description: Canonical diagnostic display name returned by the telematics field-definition endpoint.
                        example: Distance
                      value:
                        type: string
                        description: Diagnostic value represented as a string
                        example: '1500'
                      unit:
                        type: string
                        description: Unit of measure returned for this diagnostic by the telematics field-definition endpoint. Units are not validated, so send the unit listed for the key you are posting.
                        example: kilometre
                      datetime:
                        type: string
                        format: date-time
                        description: diagnostic time (ISO 8601 format)
                        example: '2021-08-10T10:00:00Z'
                      properties:
                        type: array
                        description: Optional diagnostic-specific key-value properties
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              example: Address
                            value:
                              type: string
                              example: 625 Cesar E. Chavez Avenue, Pontiac, MI, 48342
            examples:
              All supported diagnostics:
                description: All supported diagnostics
                value:
                  header:
                    resource_id: 01JFZBBYQK7H9Z0RNCTM58WDFY
                    resource_type: EQUIPMENT
                    oem_name: CAT
                    oem_id: QK7H9Z0RNCTM58SN01
                    model: 306 CR
                    pin: QK7H9Z0RNCTM58SN01
                  location:
                    latitude: -33.867487
                    longitude: 151.20699
                    altitude: 45.5
                    altitude_unit: meter
                    datetime: '2025-01-16T12:00:00Z'
                    properties:
                    - key: Address
                      value: 625 Cesar E. Chavez Avenue, Pontiac, MI, 48342
                  diagnostics:
                  - key: CumulativeOperatingHours
                    name: Cumulative Operating Hours
                    value: '1000.5'
                    unit: Hour
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: CumulativeIdleHours
                    name: Cumulative Idle Hours
                    value: '200'
                    unit: Hour
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: CumulativeIdleNonOperatingHours
                    name: Cumulative Idle Non Operating Hours
                    value: '50'
                    unit: Hour
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: CumulativeActiveRegenerationHours
                    name: Cumulative Active Regeneration Hours
                    value: '120.5'
                    unit: Hour
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: CumulativePowerTakeOffHours
                    name: Cumulative Power Take Off Hours
                    value: '300'
                    unit: Hour
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: CumulativeLoadCount
                    name: Cumulative Load Count
                    value: '500'
                    unit: Count
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: CumulativePayloadTotals
                    name: Cumulative Payload Totals
                    value: '1500.5'
                    unit: kilogram
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: Distance
                    name: Distance
                    value: '25000.5'
                    unit: kilometre
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: MaximumSpeedLast24
                    name: Maximum Speed Last 24
                    value: '45.2304'
                    unit: kilometres per hour
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: AverageLoadFactorLast24
                    name: Average Load Factor Last 24
                    value: '75.25'
                    unit: Percent
                    datetime: '2025-01-16T12:00:00Z'
                    properties: []
                  - key: EngineStatus
                    name: Engine Status
                    value: 'true'
                    unit: boolean
