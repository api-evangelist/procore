      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: severity_level_id
      in: path
      description: Incident Severity Level ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: User ID of the incident alert recipient.
      required: true
      schema:
        type: integer
      example: 1
