      summary: List all equipment logs
      description: Return a list of all equipment Logs for the projects the current user has access to.
      tags:
      - Equipment Log
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of equipment logs
                items:
                  type: object
                  description: Equipment Log
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of this equipment log entry.
                      example: 75414
                    project_id:
                      type: integer
                      description: Identifier of the project the equipment was logged for.
                      example: 14406
                    managed_equipment_id:
                      type: integer
                      description: Identifier of the managed equipment item this log entry records.
                      example: 1
                    onsite:
                      type: string
                      format: date
                      description: Date the equipment arrived on the project site, in YYYY-MM-DD format.
                      example: '2019-04-10'
                    offsite:
                      type: string
                      format: date
                      description: Date the equipment left or is scheduled to leave the project site, in YYYY-MM-DD format. Null if the equipment is still on site.
                      example: '2019-05-10'
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp of the last update to this record, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this record was created, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when this record was soft-deleted, in ISO 8601 format. Null if the record is active.
                      example: '2015-11-12T21:26:28Z'
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user who created this log entry.
                          example: 160586
                        login:
                          type: string
                          description: Email address (login) of the user who created this log entry.
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Full name of the user who created this log entry.
                          example: Carl Contractor
                    formatted_offsite:
                      type: string
                      description: Locale-formatted display string of the offsite date.
                      example: 11/12/2015
                    formatted_onsite:
                      type: string
                      description: Locale-formatted display string of the onsite date.
                      example: 04/10/2019
                    responsible_contractor:
                      type: string
                      description: Name of the contractor responsible for the equipment while on the project site.
                      example: MD construction
                    inspection_date:
                      type: string
                      format: date
                      description: Date the equipment was last inspected, in YYYY-MM-DD format.
                      example: '2019-02-19'
                    induction_checklist_list_id:
                      type: integer
                      description: Identifier of the inspection checklist template assigned to this equipment for site induction.
                      example: 1
                    induction_number:
                      type: string
                      description: The number used for equipment induction, unique within the project.
                      example: 1
                    induction_status:
                      type: boolean
                      description: Indicates whether the equipment has been successfully inspected and cleared to perform work on site.
                      example: false
