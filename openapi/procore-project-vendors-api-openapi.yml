openapi: 3.2.0
info:
  title: Procore REST Project Vendors API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Project Vendors
paths:
  /rest/v1.0/projects/{project_id}/vendors:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List project vendors
      description: Return a list of Vendors associated with a specified Project.
      tags:
      - Project Vendors
      parameters:
      - name: view
        in: query
        description: 'The normal view provides what is shown below.

          The extended view is the same as the normal view but includes children_count, legal_name, parent, and bidding.

          The default view is normal.'
        schema:
          type: string
          enum:
          - normal
          - extended
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[search]
        in: query
        description: Return vendors where the search string matches the vendor name, keywords, origin_code, or ABN/EIN number
        required: false
        schema:
          type: string
      - name: filters[standard_cost_code_id][]
        in: query
        description: Returns vendors associated with the specified standard cost code id(s)
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[trade_id][]
        in: query
        description: Returns vendors associated with the specified trade id(s)
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[id][]
        in: query
        description: Returns vendors with the specified id(s)
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[parent_id][]
        in: query
        description: Returns vendors with the specified parent id(s)
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[abbreviated_name][]
        in: query
        description: Return vendors(s) matching any of the specified abbreviated names in the abbreviated_name filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        description: Return items with the specified sort.
        required: false
        schema:
          type: string
          enum:
          - name
          - main_office_name
          - project_and_bid_counts
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of project vendors
                items:
                  allOf:
                  - type: object
                    title: extended view
                    properties:
                      bidding:
                        description: Bidding status
                        properties:
                          affirmative_action:
                            type: boolean
                            example: true
                          small_business:
                            type: boolean
                            example: false
                          african_american_business:
                            type: boolean
                            example: false
                          hispanic_business:
                            type: boolean
                            example: false
                          womens_business:
                            type: boolean
                            example: false
                          historically_underutilized_business:
                            type: boolean
                            example: false
                          sdvo_business:
                            type: boolean
                            example: false
                          certified_business_enterprise:
                            type: boolean
                            example: false
                          asian_american_business:
                            type: boolean
                            example: false
                          native_american_business:
                            type: boolean
                            example: false
                          disadvantaged_business:
                            type: boolean
                            example: false
                          minority_business_enterprise:
                            type: boolean
                            example: true
                          eight_a_business:
                            type: boolean
                            example: false
                        example:
                          affirmative_action: false
                          small_business: false
                          african_american_business: true
                          hispanic_business: false
                          womens_business: false
                          historically_underutilized_business: false
                          sdvo_business: false
                          certified_business_enterprise: true
                          asian_american_business: false
                          native_american_business: true
                          disadvantaged_business: false
                          minority_business_enterprise: false
                          eight_a_business: true
                        type:
                        - object
                        - 'null'
                      bidding_distribution:
                        type: array
                        description: Bidding Distribution List
                        items:
                          allOf:
                          - type: object
                            properties:
                              login:
                                type: string
                                description: Email
                                example: carl.contractor@example.com
                              company_name:
                                type: string
                                description: name of company
                                example: SID Architecture
                          - type: object
                            properties:
                              id:
                                type: integer
                                description: Login Information ID of the User
                                example: 161072
                              name:
                                type: string
                                example: Carl the Contractor
                      business:
                        title: Business (Normal View)
                        type:
                        - object
                        - 'null'
                        properties:
                          id:
                            type: string
                            description: UUID for the business
                            example: 2975a9c3-f28b-4eb6-a29a-2332e73b3ad7
                          name:
                            type: string
                            description: Name of the Business
                            example: Test Company, Inc.
                          dba:
                            type: string
                            description: Business Name DBA (Doing Business As)
                            example: Test Company
                          website:
                            type: string
                            description: Primary URL for the business website
                            example: www.testcompanyinc.com
                          about:
                            type: string
                            description: About the Business text
                            example: The best test company around.
                          published:
                            type: boolean
                            description: Indicates whether the Business has been publically published on PCN
                            example: true
                          primary_slug:
                            type: string
                            description: Slug for Business
                            example: test-company-carpinteria
                          logo_url:
                            type: string
                            description: URL link to Logo for the Business
                            example: www.storage.com/company_logo.png
                          source:
                            type: object
                            description: Information about where the business information was sourced from
                            properties:
                              id:
                                type: string
                                description: Unique identifier for the business in the source data. For example, typeform id in snowflake
                                example: m7pn7civb73iwijcm7wxxpaxniejvyo2
                              source:
                                type: string
                                description: More detailed source information, for example the source field on snowflake records
                                example: ucd/public_data/typeform_Jul2021/responses (1) (2).csv
                              type:
                                type: string
                                description: The high level source this data was pulled from. This is currently always 'snowflake'
                                example: SNOWFLAKE
                              record_type:
                                type: string
                                description: More detailed type information, for example the record type on snowflake records
                                example: Typeform
                          addresses:
                            type: array
                            description: Addresses for the Business. These are also reflected in Offices for the Company.
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: UUID for the address
                                  example: 2975a9c3-f28b-4eb6-a29a-2332e73b3ad7
                                name:
                                  type: string
                                  description: Address Name
                                  example: Main Office
                                address1:
                                  type: string
                                  description: Business Street Address
                                  example: 6309 Carpinteria Ave
                                address2:
                                  type: string
                                  description: Street Address Line 2
                                  example: Suite 100
                                city:
                                  type: string
                                  description: Address City
                                  example: Carpinteria
                                latitude:
                                  type: number
                                  description: Latitude of the Address
                                  example: 42.39996
                                longitude:
                                  type: number
                                  description: Longitude of the Address
                                  example: -84.35104
                                province:
                                  type: string
                                  description: Address State or Province
                                  example: CA
                                postal_code1:
                                  type: string
                                  description: Address Primary Zip Code or Other Postal Code
                                  example: '93013'
                                country_code:
                                  type: string
                                  description: Country Code
                                  example: US
                                phone_number:
                                  type: string
                                  description: Business Phone Number
                                  example: +1-517-936-7923
                                fax_number:
                                  type: string
                                  description: Business Fax Number
                                  example: +1-517-936-7923
                                primary:
                                  type: boolean
                                  description: Indicates whether this is the primary address for the Business. This is also the Main Office of the company.
                                  example: true
                                address_types:
                                  type: array
                                  description: Address Types
                                  items:
                                    type: string
                                    example: office
                          provided_services:
                            type: array
                            description: Services the Business Provides
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Provided Service UUID
                                  example: 245acd0d-a3e1-4b8d-8891-7fdc364910ec
                                key:
                                  type: string
                                  description: i18n key for the name of the Provided Service
                                  example: existing_material_assessment
                                path:
                                  type: string
                                  description: The keys of the Provided Service hierarchy, e.g. key1#key2#key3
                                  example: professional_and_business_services#assessments_and_studies#existing_material_assessment
                                level:
                                  type: string
                                  description: The name of this Provided Service's level, ex. 'trade' or 'category'
                                  example: specialty
                          construction_sectors:
                            type: array
                            description: Construction Sectors this Business works in
                            items:
                              type: string
                              example: industrial_and_energy
                          business_types:
                            type: array
                            description: Business Types this Business falls under
                            items:
                              type: string
                              example: general_contractor
                          project_types:
                            type: array
                            description: Project Types this Business falls under
                            items:
                              type: string
                              example: seaport
                          classifications:
                            type: array
                            description: Classifications this Business falls under
                            items:
                              type: object
                              properties:
                                abbreviation:
                                  type: string
                                  description: Abbreviation of the Classification
                                  example: SBE
                                key:
                                  type: string
                                  description: Identifier key of the Classification
                                  example: SBE
                                name:
                                  type: string
                                  description: Name of the Classification
                                  example: Small Business
                          coverage_areas:
                            type: array
                            description: Business area coverage
                            items:
                              type: object
                              properties:
                                country_code:
                                  type: string
                                  description: Country Code
                                  example: US
                                google_place_id:
                                  type: string
                                  description: Google Place ID
                                  example: ChIJL4iEQEoS6YAR04viVA12TNw
                                admin1:
                                  type: string
                                  description: State (Province)
                                  example: CA
                                admin2:
                                  type: string
                                  description: County
                                  example: Orange County
                                admin3:
                                  type:
                                  - string
                                  - 'null'
                                  description: Not used in US
                                  example: null
                                admin4:
                                  type:
                                  - string
                                  - 'null'
                                  description: Not used in US
                                  example: null
                                locality:
                                  type: string
                                  description: Locality (City)
                                  example: Anaheim Hills
                                selected_level:
                                  type: string
                                  description: The admin level that was originally chosen by user
                                  example: locality
                          claimed:
                            type: boolean
                            description: Indicates whether the Business has been claimed by a user
                            example: true
                          Tags:
                            type: object
                            description: Tags to indicate the current status of business
                            properties:
                              claim_status:
                                type: string
                                description: Indicates that a claim request was made for the business and request is in consideration
                                enum:
                                - PENDING
                                - APPROVED
                              approval_status:
                                type: string
                                description: Indicates that an approval request was made for the business and request is in consideration
                                enum:
                                - PENDING
                                - APPROVED
                                - REJECTED
                              publishable:
                                type: string
                                description: Indicates that a business can be published
                                enum:
                                - 'true'
                                - 'false'
                          start_of_operations:
                            type:
                            - string
                            - 'null'
                            description: Date when the business started operations
                            example: '2023-10-24'
                            format: date
                          updated_by:
                            type:
                            - string
                            - 'null'
                            description: E-mail of last user to update a PCN profile
                            example: samantha@example.com
                          published_at:
                            type:
                            - string
                            - 'null'
                            description: Datetime of when the business published its PCN profile
                            example: '2024-10-03T20:40:59Z'
                            format: date-time
                          published_by:
                            type:
                            - string
                            - 'null'
                            description: E-mail of last user to publish a business's PCN profile
                            example: samantha@example.com
                      children_count:
                        type: integer
                        description: Count of Vendors whose parent_id is this Vendor's ID
                        example: 0
                      legal_name:
                        type: string
                        description: Name of the parent, if one exists. Otherwise same as name.
                        example: Stock Construction
                      parent:
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                        example:
                          id: 634512
                          name: Poodle Electric Inc.
                        type:
                        - object
                        - 'null'
                      trades:
                        type: array
                        description: Trades
                        items:
                          type:
                          - object
                          - 'null'
                          title: Trade
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for this trade.
                              example: 999
                            name:
                              type: string
                              description: Display name of the trade.
                              example: 09 - acoustical panels
                            active:
                              type: boolean
                              description: Whether the trade is active.
                              example: true
                            updated_at:
                              type: string
                              format: date-time
                              description: Timestamp when this trade was last updated.
                              example: '2016-08-01T23:33:54Z'
                  - type: object
                    title: normal view
                    properties:
                      id:
                        type: integer
                        example: 161072
                      name:
                        type: string
                        example: SID Architecture
                      abbreviated_name:
                        description: Abbreviated name
                        example: PE
                        type:
                        - string
                        - 'null'
                      address:
                        description: Address
                        example: 846 Dogglesworth Drive
                        type:
                        - string
                        - 'null'
                      attachments:
                        type: array
                        description: Attachments
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 5324
                            url:
                              type: string
                              description: URL
                              example: http://www.example.com/
                            name:
                              type: string
                              description: Filename
                              example: january_receipt_copy.jpg
                            filename:
                              type: string
                              description: Filename
                              example: january_receipt_copy.jpg
                      authorized_bidder:
                        type: boolean
                        description: Authorized bidder status
                        example: true
                      business_id:
                        description: Business id
                        example: 89cac92d-fbd8-40ec-a1fc-24bbbd035a78
                        type:
                        - string
                        - 'null'
                      business_phone:
                        description: Business phone
                        example: (812) 989-9810
                        type:
                        - string
                        - 'null'
                      business_register:
                        description: business register
                        properties:
                          id:
                            type: integer
                            example: 321
                          type:
                            type: string
                            description: business register type (ABN, EIN)
                            example: abn
                          identifier:
                            type: string
                            description: Identification code
                            example: '51824753556'
                          verified_at:
                            format: date-time
                            description: Verified at
                            example: '2018-06-11T15:56:25Z'
                            type:
                            - string
                            - 'null'
                          verification_status:
                            description: Verification status (active, cancelled, does_not_exist)
                            example: active
                            enum:
                            - active
                            - cancelled
                            - does_not_exist
                            - null
                            type:
                            - string
                            - 'null'
                        example:
                          id: 321
                          type: abn
                          identifier: '51824753556'
                          verified_at: '2018-06-11T15:56:25Z'
                          verification_status: active
                        type:
                        - object
                        - 'null'
                      city:
                        description: City
                        example: Jeffersonville
                        type:
                        - string
                        - 'null'
                      company:
