            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Stable machine-readable error code for a group-managed membership.
                    example: MEMBERSHIP_GROUP_MANAGED
                  message:
                    type: string
                    description: Human readable message describing the error.
                    example: This project membership is managed by Groups and cannot be modified directly.
                  hint:
                    type: string
                    description: Machine-actionable hint; indicates the membership is group-managed.
                    example: group_managed
