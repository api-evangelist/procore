    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: severity_level_id
      in: path
      description: Incident Severity Level ID
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Incident Alert Recipients
      description: Return a list of all Incident Alert Recipients associated with the specified Company and Incident Severity Level.
      tags:
      - Alert Recipients
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: sort
        in: query
        description: Sort results by the specified field.
        schema:
          type: string
          enum:
          - name
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                description: Array of Incident Alert Recipients
                items:
                  type: object
                  title: Incident Alert Recipient
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the user who is configured as an alert recipient.
                      example: 160586
                    login:
                      type: string
                      description: Email address the user uses to log in to Procore.
                      example: carl.contractor@example.com
                    name:
                      type: string
                      description: Full name of the alert recipient.
                      example: Carl Contractor
                    company_name:
                      type: string
                      description: Name of the company the alert recipient belongs to.
                      example: Company ABC
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
