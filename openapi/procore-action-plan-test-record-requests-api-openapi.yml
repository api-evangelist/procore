                          description: Identifier of the linked checklist template. Present when type is 'checklist'.
                          example: 55
                        form_template_id:
                          type:
                          - integer
                          - 'null'
                          description: Identifier of the linked form template. Present when type is 'form'.
                          example: 56
                        generic_tool_id:
                          type:
                          - integer
                          - 'null'
                          description: Identifier of the linked generic tool. Present when type is 'generic_tool'.
                          example: 57
