                      type: integer
                      description: Unique identifier of the Action Plan Item this test record request belongs to.
                      example: 54
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the test record request was created. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
