    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Affliction Types
      description: Returns a paginated list of all affliction types configured for the specified company.
      tags:
      - Affliction Types
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[active]
        in: query
        description: If true, returns item(s) with a status of 'active'.
        schema:
          type: boolean
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: sort
        in: query
        description: Sort results by the specified field.
        schema:
          type: string
          enum:
          - name
      - name: filters[query]
        in: query
        description: Return item(s) containing query.
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Affliction Types
                items:
                  type: object
                  title: Affliction Type
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this affliction type.
                      example: 999
                    name:
                      type: string
                      description: Display name of the affliction type, localized to the requester's language preference.
                      example: Sprain
                    name_key:
                      type: string
                      description: Untranslated key for the affliction type name. Use this value for programmatic comparisons rather than the localized name field.
                      example: Sprain
                    active:
                      type: boolean
                      description: Indicates whether this affliction type is available for selection when recording injuries. Inactive types are hidden from end users.
                      example: true
                    global:
                      type: boolean
                      description: Indicates whether this affliction type is a Procore-provided default. Global types cannot have their names changed.
                      example: true
                    created_at:
                      type: string
                      description: ISO 8601 timestamp of when this affliction type was created.
                      format: date-time
                      example: '2016-10-25T17:53:35Z'
                    updated_at:
                      type: string
                      description: ISO 8601 timestamp of the most recent update to this affliction type.
                      format: date-time
                      example: '2016-10-25T17:53:35Z'
