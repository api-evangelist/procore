openapi: 3.2.0
info:
  title: Procore REST Correspondence Type Items API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Correspondence Type Items
paths:
  /rest/v1.0/projects/{project_id}/correspondence_type_items:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Correspondence Type Items
      description: 'Returns a list of all Correspondence Type Items in the specified Project.

        For more information on Generic Tool and Correspondence Tool endpoints,

        see Working with the Correspondence Tool.'
      tags:
      - Correspondence Type Items
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[login_information_id]
        in: query
        description: Array of Login Information IDs. Returns item(s) with the specified Login Information ID.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[status]
        in: query
        description: Returns item(s) matching the specified status value.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filters[overdue]
        in: query
        description: If true, returns item(s) that are overdue.
        schema:
          type: boolean
      - name: filters[query]
        in: query
        description: Return item(s) containing search query
        schema:
          type: string
      - name: filters[recycle_bin]
        in: query
        description: If true, returns item(s) that have been deleted.
        schema:
          type: boolean
      - name: filters[generic_tool_id]
        in: query
        description: Return item(s) within the specified Generic Tool ID(s)
        required: false
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[received_from_id]
        in: query
        description: Received From ID
        schema:
          type: integer
      - name: filters[created_by_id]
        in: query
        description: Returns item(s) created by the specified User IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[closed_at]
        in: query
        description: Returns item(s) closed within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
          format: date
      - name: filters[issued_at]
        in: query
        description: Returns item(s) issued within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
      - name: filters[vendor_id]
        in: query
        description: Return item(s) with the specified Vendor ID.
        schema:
          type: integer
      - name: filters[private]
        in: query
        description: If true, returns only item(s) with a `private` status.
        schema:
          type: boolean
      - name: filters[location_id]
        in: query
        description: 'Filters by specific location (Note: Use *either* this or location_id_with_sublocations, but not both)'
        schema:
          type: integer
      - name: sort
        in: query
        description: 'Field to sort by. If the field is passed with a - (EX: -updated_at) it is sorted in reverse order'
        schema:
          type: string
          enum:
          - due_date
          - login_information
          - position
          - status
          - title
          - updated_at
          - created_at
      - name: group
        in: query
        description: Controls if the Items are returned sorted by the sort attribute then the Generic Tool's Title or just the sort attribute. Defaults to 'generic_tool_title'.
        required: false
        schema:
          type: string
          enum:
          - generic_tool_title
          - none
      - name: view
        in: query
        description: Defines the type of view returned. Must be one of 'extended', 'compact', 'ids_only', or 'flatten_v0'.
        required: false
        schema:
          type: string
          enum:
          - extended
          - compact
          - ids_only
          - flatten_v0
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Correspondence Type Items
                items:
                  title: GenericToolItem
                  type: object
                  description: Generic Tool Item
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the Generic Tool Item
                      example: 85
                    closed_at:
                      type: string
                      format: date-time
                      description: Generic Tool Item closed at
                      example: '2016-08-08T21:35:58Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Generic Tool Item created at
                      example: '2016-08-08T21:35:58Z'
                    description:
                      type: string
                      description: Description of a Generic Tool Item
                      example: This is a description.
                    due_date:
                      type: string
                      format: date
                      description: Generic Tool Item Due Date
                      example: '2016-08-08'
                    issued_at:
                      type: string
                      format: date-time
                      description: Generic Tool Item issued at
                      example: '2016-08-08T21:35:58Z'
                    origin_generic_tool_item_id:
                      type: integer
                      description: Origin Generic Tool Item ID
                      example: 9
                    origin_rfi_id:
                      type: integer
                      description: Origin RFI ID
                      example: 14
                    position:
                      type: string
                      description: The Number of the Generic Tool Item
                      example: A1
                    private:
                      type: boolean
                      description: If the Generic Tool Item is private
                      example: false
                    schedule_impact:
                      type: object
                      properties:
                        status:
                          type: string
                          description: Schedule impact status
                          example: yes_known
                          enum:
                          - yes_known
                          - yes_unknown
                          - no_impact
                          - tbd
                          - n_a
                        value:
                          type: number
                          format: float
                          description: Schedule impact value
                          example: 14
                    cost_impact:
                      type: object
                      properties:
                        status:
                          type: string
                          description: Cost impact status
                          example: yes_known
                          enum:
                          - yes_known
                          - yes_unknown
                          - no_impact
                          - tbd
                          - n_a
                        value:
                          type: number
                          format: float
                          description: Cost impact value in dollars
                          example: 75.5
                    updated_at:
                      type: string
                      format: date-time
                      description: Generic Tool Item updated at
                      example: '2016-08-08T21:35:58Z'
                    status:
                      type: string
                      description: Status of the Generic Tool Item
                      example: open
                    status_type:
                      type: string
                      description: The default status the Generic Tool Item's status is mapped to.
                      example: Open
                      enum:
                      - Open
                      - Closed
                      - Draft
                    title:
                      type: string
                      description: Title of the Generic Tool Item
                      example: This is the title
                    created_by:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 160586
                          login:
                            type: string
                            description: Email
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Name
                            example: Carl Contractor
                      - type: object
                        properties:
                          company:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: ID
                                example: 160583
                              name:
                                type: string
                                description: Name
                                example: Company ABC
                    received_from:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 160586
                          login:
                            type: string
                            description: Email
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Name
                            example: Carl Contractor
                      - type: object
                        properties:
                          company:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: ID
                                example: 160583
                              name:
                                type: string
                                description: Name
                                example: Company ABC
                    location:
                      type:
                      - object
                      - 'null'
                      title: Location
                      properties:
                        id:
                          type: integer
                          description: Location ID
                          example: 15504
                        name:
                          type: string
                          description: Location name
                          example: North Building>First Floor>Electrical Closet
                        node_name:
                          type: string
                          description: Location node name
                          example: Electrical Closet
                        parent_id:
                          type:
                          - integer
                          - 'null'
                          description: Location parent id
                          example: 788866
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp of Location creation
                          example: '2016-08-01T23:33:54Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp of last update to Location
                          example: '2016-08-01T23:33:54Z'
                        code:
                          type:
                          - string
                          - 'null'
                          description: The unique code for this Location
                          example: L1
                    cost_code:
                      title: compact
                      type: object
                      properties:
                        id:
                          description: ID
                          example: 12345
                          type:
                          - integer
                          - 'null'
                        full_code:
                          type: string
                          description: Full Cost code, including parent prefixes
                          example: 02-300
                        name:
                          type: string
                          description: Name
                          example: Earthwork
                    specification_section:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the specification section.
                          example: 161072
                        number:
                          type: string
                          description: Identifying number of the specification section.
                          example: 08560
                        description:
                          type: string
                          description: Descriptive title of the specification section.
                          example: Vinyl Windows
                        label:
                          type: string
                          description: Combined label of the section, formatted as "number description".
                          example: 08560 Vinyl Windows
                        current_revision_id:
                          type:
                          - integer
                          - 'null'
                          description: ID of the section's current revision. Null if no revision exists.
                          example: 145092
                    trade:
                      type:
                      - object
                      - 'null'
                      title: Trade
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for this trade.
                          example: 999
                        name:
                          type: string
                          description: Display name of the trade.
                          example: 09 - acoustical panels
                        active:
                          type: boolean
                          description: Whether the trade is active.
                          example: true
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when this trade was last updated.
                          example: '2016-08-01T23:33:54Z'
                    trades:
                      type: array
                      description: Trades
                      items:
                        type:
                        - object
                        - 'null'
                        title: Trade
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for this trade.
                            example: 999
                          name:
                            type: string
                            description: Display name of the trade.
                            example: 09 - acoustical panels
                          active:
                            type: boolean
                            description: Whether the trade is active.
                            example: true
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp when this trade was last updated.
                            example: '2016-08-01T23:33:54Z'
                    tasks:
                      type: array
                      description: Tasks
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Task ID
                            example: 999
                          name:
                            type: string
                            description: Full Task name
                            example: 01 - Closeout
                          task_name:
                            type: string
                            description: Task name
                            example: Closeout
                          key:
                            type: string
                            description: Task Key
                            example: A101
                    sub_job:
                      type: object
                      title: Sub Job
                      properties:
                        id:
                          type: integer
                          description: Sub Job ID
                          example: 999
                        name:
                          type: string
                          description: Sub Job Name
                          example: Garage
                        Code:
                          type: string
                          description: Sub Job Code
                          example: 1
                    generic_tool:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the generic tool.
                          example: 5324
                        abbreviation:
                          type: string
                          description: Abbreviation for the Title. Will be used as a prefix for the Generic Tool Item number.
                          example: CT
                        domain_id:
                          type: integer
                          description: Unique identifier for the generic tool domain.
                          example: -5324
                        title:
                          type: string
                          description: Primary name/title for the generic tool.
                          example: Custom Tool
                    attachments:
                      type: array
                      description: Attachments
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for the attachment.
                            example: 5324
                          url:
                            type: string
                            description: URL of the attachment.
                            example: http://www.example.com/
                          filename:
                            type: string
                            description: Filename of the attachment.
                            example: january_receipt_copy.jpg
                    document_management_document_revision_ids:
                      type: array
                      description: PDM document revision IDs
                      items:
                        type: string
                      example:
                      - 51GW47XAV5N64CQ2F8HTWFW0M4
                      - 51H5MADM07T70B3DAK6X2TFVB0
                    distribution_members:
                      type: array
                      description: Distribution Members
                      items:
                        allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 160586
                            login:
                              type: string
                              description: Email
                              example: carl.contractor@example.com
                            name:
                              type: string
                              description: Name
                              example: Carl Contractor
                        - type: object
                          properties:
                            company:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID
                                  example: 160583
                                name:
                                  type: string
                                  description: Name
                                  example: Company ABC
                    assignees:
                      type: array
                      description: Assignees
                      items:
                        allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 160586
                            login:
                              type: string
                              description: Email
                              example: carl.contractor@example.com
                            name:
                              type: string
                              description: Name
                              example: Carl Contractor
                        - type: object
                          properties:
                            company:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID
                                  example: 160583
                                name:
                                  type: string
                                  description: Name
                                  example: Company ABC
                    custom_fields:
                      type: object
                      properties:
                        custom_field_%{custom_field_string_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: string
                            value:
                              type: string
                              description: The value of the custom field
                              example: custom field value
                            variant:
                              type: string
                              description: The variant of the Custom Field Definition (e.g. `phone_number`). Present only when the definition has an associated variant.
                              example: phone_number
                        custom_field_%{custom_field_decimal_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: decimal
                            value:
                              type: number
                              description: The value of the custom field
                              example: 2.2
                        custom_field_%{custom_field_boolean_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: boolean
                            value:
                              type: boolean
                              description: The value of the custom field
                              example: true
                        custom_field_%{custom_field_lov_entry_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: lov_entry
                            value:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID of the LOV Entry
                                  example: 1
                                label:
                                  type: string
                                  description: Label of the LOV Entry
                                  example: Open
                            variant:
                              type: string
                              description: The variant of the Custom Field Definition (e.g. `project_directory`). Present only when the definition has an associated variant.
                              example: with_code
                        custom_field_%{custom_field_lov_entries_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: lov_entries
                            value:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID of the LOV Entry
                                    example: 2
                                  label:
                                    type: string
                                    description: Label of the LOV Entry
                                    example: Open
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/correspondence_type_items',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[id]': 'SOME_ARRAY_VALUE',\n    'filters[login_information_id]': 'SOME_ARRAY_VALUE',\n    'filters[status]': 'SOME_ARRAY_VALUE',\n    'filters[overdue]': 'SOME_BOOLEAN_VALUE',\n    'filters[query]': 'SOME_STRING_VALUE',\n    'filters[recycle_bin]': 'SOME_BOOLEAN_VALUE',\n    'filters[generic_tool_id]': 'SOME_ARRAY_VALUE',\n    'filters[received_from_id]': 'SOME_INTEGER_VALUE',\n    'filters[created_by_id]': 'SOME_ARRAY_VALUE',\n    'filters[created_at]': 'SOME_STRING_VALUE',\n    'filters[updated_at]': 'SOME_STRING_VALUE',\n    'filters[closed_at]': 'SOME_STRING_VALUE',\n    'filters[issued_at]': 'SOME_STRING_VALUE',\n    'filters[vendor_id]': 'SOME_INTEGER_VALUE',\n    'filters[private]': 'SOME_BOOLEAN_VALUE',\n    'filters[location_id]': 'SOME_INTEGER_VALUE',\n    sort: 'SOME_STRING_VALUE',\n    group: 'SOME_STRING_VALUE',\n    view: 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/correspondence_type_items?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Blogin_information_id%5D=SOME_ARRAY_VALUE&filters%5Bstatus%5D=SOME_ARRAY_VALUE&filters%5Boverdue%5D=SOME_BOOLEAN_VALUE&filters%5Bquery%5D=SOME_STRING_VALUE&filters%5Brecycle_bin%5D=SOME_BOOLEAN_VALUE&filters%5Bgeneric_tool_id%5D=SOME_ARRAY_VALUE&filters%5Breceived_from_id%5D=SOME_INTEGER_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bclosed_at%5D=SOME_STRING_VALUE&filters%5Bissued_at%5D=SOME_STRING_VALUE&filters%5Bvendor_id%5D=SOME_INTEGER_VALUE&filters%5Bprivate%5D=SOME_BOOLEAN_VALUE&filters%5Blocation_id%5D=SOME_INTEGER_VALUE&sort=SOME_STRING_VALUE&group=SOME_STRING_VALUE&view=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/correspondence_type_items?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Blogin_information_id%5D=SOME_ARRAY_VALUE&filters%5Bstatus%5D=SOME_ARRAY_VALUE&filters%5Boverdue%5D=SOME_BOOLEAN_VALUE&filters%5Bquery%5D=SOME_STRING_VALUE&filters%5Brecycle_bin%5D=SOME_BOOLEAN_VALUE&filters%5Bgeneric_tool_id%5D=SOME_ARRAY_VALUE&filters%5Breceived_from_id%5D=SOME_INTEGER_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bclosed_at%5D=SOME_STRING_VALUE&filters%5Bissued_at%5D=SOME_STRING_VALUE&filters%5Bvendor_id%5D=SOME_INTEGER_VALUE&filters%5Bprivate%5D=SOME_BOOLEAN_VALUE&filters%5Blocation_id%5D=SOME_INTEGER_VALUE&sort=SOME_STRING_VALUE&group=SOME_STRING_VALUE&view=SOME_STRING_VALUE'"
