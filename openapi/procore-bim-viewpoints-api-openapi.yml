openapi: 3.2.0
info:
  title: Procore REST BIM Viewpoints API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: BIM Viewpoints
paths:
  /rest/v1.0/bim_model_revision_viewpoints:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List BIM Model Revision Viewpoints
      description: List BIM Model Revision Viewpoints associated to a BIM model revision
      tags:
      - BIM Viewpoints
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[bim_model_revision_id]
        in: query
        description: Filter item(s) with matching Bim Model Revision ids.
        schema:
          type: integer
      - name: filters[updated_at]
        in: query
        description: Filter item(s) within a specific updated at iso8601 datetime range.
        schema:
          type: string
      - name: filters[primary]
        in: query
        description: Filter items by primary flag
        schema:
          type: boolean
      - name: view
        in: query
        description: 'The compact view contains only ids.

          The extended view contains the response shown below.

          The normal view contains bim_viewpoint_id instead of object.

          The default view is normal.'
        schema:
          type: string
          enum:
          - compact
          - normal
          - extended
      - name: viewpoint_format
        in: query
        description: 'Specify viewpoint data format. This parameter functions only when the query parameter view is ''extended''

          The default format returns the viewpoint content as saved.

          The procore format returns the viewpoint content converted to Procore format. If a valid conversion is not possible, empty viewpoint is returned.'
        schema:
          type: string
          enum:
          - default
          - procore
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: BIM Model Revision Viewpoints listed successfully
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - type: object
                    description: BIM Model Revision Viewpoint associates BIM Model Revisions to BIM Viewpoint
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 1
                      bim_model_revision_id:
                        type: integer
                        description: ID of associated published BIM Model Revision
                        example: 91
                      bim_viewpoint_id:
                        type: integer
                        description: ID of associated BIM Viewpoint
                        example: 83
                      primary:
                        type: boolean
                        description: Indicates whether primary viewpoint
                        example: false
                      created_at:
                        type: string
                        format: date-time
                        description: Created date
                        example: '2018-04-19T09:36:42Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Updated date
                        example: '2018-04-20T09:36:42Z'
                  - type: object
                    description: BIM Model Revision Viewpoint associates BIM Model Revisions to BIM Viewpoint
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 1
                      bim_model_revision_id:
                        type: integer
                        description: ID of associated published BIM Model Revision
                        example: 91
                      bim_viewpoint:
                        type: object
                        allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 206
                            bim_file_id:
                              type: integer
                              description: ID of associated BIM File
                              example: 809
                            view_folder_id:
                              type:
                              - integer
                              - 'null'
                              description: ID of associated BIM View Folder
                              example: 316
                            created_at:
                              type: string
                              format: date-time
                              description: Created date
                              example: '2018-04-19T09:36:42Z'
                            updated_at:
                              type: string
                              format: date-time
                              description: Updated date
                              example: '2018-04-20T09:36:42Z'
                            snapshot:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                  description: Base name of the file without its path
                                  example: filename.ext
                                content_type:
                                  type: string
                                  description: A mime type or a file extension
                                  example: image/png
                                url:
                                  type: string
                                  description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                                  example: https://storage.procore.com/v3/d/default/procore-files/1ZE258W9K804SAJJZX19JVAB3R?sig=e7a476ec0a46154d05e0d4a554fb2ea0904cb6604670f9247c54d7c56a84d0b6
                            name:
                              type: string
                              description: Viewpoint name
                              example: Mechanical Conflict View
                            render_mode:
                              type: string
                              description: Viewer render mode when viewpoint is applied
                              enum:
                              - shaded
                              - xray
                            uuid:
                              type:
                              - string
                              - 'null'
                              description: Unique identifier for the Extraction viewpoint
                              example: 123e4567-e89b-12d3-a456-426614174000
                            visibility:
                              type:
                              - object
                              - 'null'
                              description: Object Visibility settings
                              properties:
                                default_visibility:
                                  type: boolean
                                exceptions:
                                  type: object
                                  description: Group of model objects represented as an array of object ids, or object ranges
                                  properties:
                                    object_ids:
                                      type: array
                                      description: Array of object ids
                                      example:
                                      - 24861
                                      - 46732
                                      items:
                                        type: integer
                                    object_ranges:
                                      type: array
                                      description: Array of object ranges. A range is an array containing two numbers, the first represents object id, the second represents the number of objects in the range.
                                      example:
                                      - - 24862
                                        - 24
                                      items:
                                        type: array
                                        items:
                                          type: integer
                                        minItems: 2
                                        maxItems: 2
                        - type: object
                          properties:
                            camera_data:
                              type: string
                              description: JSON string representation of camera position
                              example: '{"perspective_camera":{"camera_direction":{"x":-0.24,"y":-0.14,"z":-0.99},"camera_up_vector":{"x":-0.17,"y":-0.74,"z":0.14},"camera_view_point":{"x":-13.86,"y":64.83,"z":31.9},"field_of_view":0.78,"target_distance":9.18,"unit":"ft"}}'
                        - type: object
                          properties:
                            redlines_data:
                              type: string
                              description: JSON string representation of markup
                              example: '{"lines":[{"color":{"a":1.0,"b":0,"g":0,"r":1},"end_point":{"x":-0.29,"y":-0.15,"z":0.0},"thickness":3,"start_point":{"x":-0.29,"y":-0.53,"z":0.0}}],"texts":[{"origin":{"x":-0.29,"y":-0.15,"z":0.0},"text":"Issue","color":{"a":1.0,"b":0,"g":0,"r":1}}],"arrows":[{"color":{"a":1.0,"b":0,"g":0,"r":1},"end_point":{"x":-0.16,"y":0.33,"z":0.0},"thickness":3,"start_point":{"x":0.58,"y":0.25,"z":0.0}}],"ellipses":[{"color":{"a":1.0,"b":0,"g":0,"r":1},"max_point":{"x":0.11,"y":-0.25,"z":0.0},"min_point":{"x":0.31,"y":0.68,"z":0.0},"thickness":3}]}'
                        - type: object
                          properties:
                            sections_data:
                              type: string
                              description: JSON string representation of sections applied to a 3d model as a set of clipping planes
                              example: '[{"location":{"x":0.0,"y":0.0,"z":28.82},"direction":{"x":0,"y":0,"z":-1},"unit":"ft"},{"location":{"x":10.0,"y":50.0,"z":68.82},"direction":{"x":2,"y":4,"z":-6}}]'
                      primary:
                        type: boolean
                        description: Indicates whether primary viewpoint
                        example: false
                      created_at:
                        type: string
                        format: date-time
                        description: Created date
                        example: '2018-04-19T09:36:42Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Updated date
                        example: '2018-04-20T09:36:42Z'
        '403':
          description: User does not have permission to view BIM Model Revision Viewpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
