          description: Returns Project Metadata Values
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: number
            Total:
              description: Total number of items to be retrieved
              schema:
                type: number
            Link:
              description: Link headers for the first, prev, next and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: List of project metadata values
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 01FVG7CQBPS470N4DAC1GTB1DS
                          description: Unique identifier for the metadata value
                        code:
                          type: string
                          example: S3
                          description: Code for the metadata value
                        label:
                          type: string
                          example: Suitable for review and comment
                          description: Label for the metadata value
                        active:
                          type: boolean
                          example: true
                          description: Is project metadata value active
                        tags:
                          description: Tags associated with the metadata value
                          type: array
                          items:
                            type: string
                        field_id:
                          type: string
                          example: 01FVG7CQBPS470N4DAC1GTB1DT
                          description: Field ID for reference metadata values (present when originId exists)
                        group:
                          description: Resolved color group for the value (pilot). Absent when the pilot flag is off; null when on but the value has no assignment.
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: string
                                description: Stable enum-style identifier for the color group.
                                enum:
                                - approved
                                - in_review
                                - not_accepted
                                - open
                                - draft
                                example: approved
                              color:
                                type: string
                                description: Design-system Pill color token for the group (`green`, `yellow`, `red`, `blue`, `gray`).
                                enum:
                                - green
                                - yellow
                                - red
                                - blue
                                - gray
                                example: green
                              label:
                                type: string
                                description: Translated display label for the caller's locale.
                                example: Approved
                            required:
                            - id
                            - color
                            - label
                      required:
