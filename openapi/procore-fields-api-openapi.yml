        required: false
        in: query
        description: Only return metadata values that are included in the filters of the given document collection
        schema:
          type: string
      - name: upload_collection_id
        required: false
        in: query
        description: Only return metadata values that are included in the filters of the given upload collection
        schema:
          type: string
      - name: keyword
        required: false
        in: query
        description: Returns metadata values that are matched with the given keyword
        schema:
          type: string
      - name: sort_by
        required: false
        in: query
        description: Sort by field values
        schema:
          type: string
          enum:
          - position
          - active
          - code
          - label
      - name: sort_order
        required: false
        in: query
        description: Sort order for the sort_by field values
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: include_all
        required: false
        in: query
        description: Include all metadata values
        schema:
          type: boolean
      - name: include_readonly
        required: false
        in: query
        description: Include read-only metadata values
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Page
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        required: false
        in: query
        description: Elements per page
        schema:
