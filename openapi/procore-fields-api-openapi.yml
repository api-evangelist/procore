    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      description: Returns the Fields for a Project
      operationId: ProjectFieldsV2Controller_getProjectFieldListV2_0
      parameters:
      - name: company_id
        required: true
        in: path
        description: Company ID
        schema:
          type: string
      - name: project_id
        required: true
        in: path
        description: Project ID
        schema:
          type: string
      - name: filters
        required: false
        in: query
        description: 'Object with whitelisted Field ids as keys and their corresponding MetadataValue id, MetadataValue ids array, or primitive string value as values.

          Valid filterable fields are:

          active,

          can_affect_permissions'
        schema:
          type: object
          properties:
            active:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
            can_affect_permissions:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
      - name: page
        required: false
        in: query
        description: Page
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        required: false
        in: query
        description: Elements per page
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: locale
        required: false
        in: query
        description: Language for the response to be translated into
        schema:
          type: string
          enum:
          - de-DE
          - en-AE
          - en-AU
          - en-CA
          - en-GB
          - en-SG
          - en
          - es-ES
          - es
          - fr-CA
          - fr-FR
          - is-IS
          - ja-JP
          - pl-PL
          - pseudo
          - pt-BR
          - th-TH
          - zh-SG
          - zh-TW
          - nb-NO
          - pt-PT
          - it-IT
