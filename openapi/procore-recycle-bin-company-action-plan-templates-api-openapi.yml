openapi: 3.2.0
info:
  title: Procore REST Recycle Bin Company Action Plan Templates API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Recycle Bin Company Action Plan Templates
paths:
  /rest/v1.0/companies/{company_id}/recycle_bin/action_plans/plan_templates:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Recycled Company Action Plan Templates
      description: Returns a list of Recycled Company Action Plan Templates for a given company.
      tags:
      - Recycle Bin Company Action Plan Templates
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[deleted_at]
        in: query
        description: Returns item(s) deleted within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
      - name: filters[deleted_by_id]
        in: query
        description: Return item(s) deleted by the specified User IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[type_id]
        in: query
        description: Return item(s) with a specific Action Plan Type ID or a range of Action Plan Type IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: sort
        in: query
        description: Direction (asc/desc) can be controlled by the presence or absence of '-' before the sort parameter.
        schema:
          type: string
          enum:
          - created_at
          - deleted_by
          - title
          - plan_type
          - updated_at
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Company Action Plan Templates (Index)
                items:
                  type: object
                  description: Company Action Plan Template (Show)
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the deleted Action Plan Template.
                      example: 43584
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the template was created. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when the template was moved to the recycle bin. ISO 8601 format.
                      example: '2015-03-19T12:00:00Z'
                    deleted_by:
                      type: object
                      description: User who moved this template to the recycle bin.
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user.
                          example: 808
                        name:
                          type: string
                          description: Full name of the user who deleted the template.
                          example: John Michaels
                        login:
                          type: string
                          description: Login email address of the user.
                          example: john.michaels@example.com
                    description:
                      type: string
                      description: Description of the template in rich text (HTML) form.
                      example: <p>Important Safety Company Action Plan Template.</p>
                    description_plain_text:
                      type: string
                      description: Description of the template in plain text form.
                      example: Important Safety Company Action Plan Template.
                    status:
                      type: string
                      description: Lifecycle state of the template at time of deletion.
                      enum:
                      - draft
                      - in_revision
                      - published
                      example: draft
                    title:
                      type: string
                      description: Title of the Action Plan Template.
                      example: A New Company Action Plan Template
                    plan_type:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the Action Plan type.
                          example: 21
                        active:
                          type: boolean
                          description: Whether this type is enabled for use. When false, it is hidden from selection when creating new plans or templates.
                          example: true
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the type was created. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        name:
                          type: string
                          description: Localized display name of the Action Plan type.
                          example: Safety
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when the type was last modified. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        source_key:
                          type:
                          - string
                          - 'null'
                          description: System key identifying a built-in type. Null for user-created custom types.
                          example: safety
                    global_plan_template_name:
                      type:
                      - string
                      - 'null'
                      description: Name of the Procore-provided global template this template was created from. Null when the template was not created from a Procore global template.
                      example: project_development
                    template_type:
                      type: string
                      description: Scope of the template. 'company' templates are company-wide; 'project' templates are project-specific.
                      enum:
                      - company
                      - project
                      example: company
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when the template was last modified. ISO 8601 format.
                      example: '2015-03-19T12:00:00Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
