        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#company-folder-and-file-index
      operationId: companyFolderAndFileIndex2
  /rest/v2.0/companies/{company_id}/documents/{document_id}/revisions:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: document_id
      in: path
      description: Unique identifier for the document (file).
      required: true
      schema:
        type: string
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: List of Document Revisions (Company)
      description: Return a list of the 20 most recent file versions (revisions) for a specific document in a company, sorted by created_at in descending order.
      tags:
      - Documents
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Document Revisions
                    items:
                      type: object
                      title: Document Revision V2
                      description: A file version (revision) for a document
                      properties:
                        id:
                          type: string
                          description: File version id
                          example: '12345'
                        prostore_id:
                          type: string
                          description: Prostore file id
                          example: '933005548'
                        url:
                          type: string
                          format: uri
                          description: URL for the file version
                        file_id:
                          type: string
                          description: File id (prostore file id)
                          example: '933005548'
                        file_name:
                          type: string
                          description: Name of the file
                        file_size:
                          type: integer
                          description: Size of the file in bytes
                        file_version:
                          type: integer
                          description: Version number of the file
                        file_type:
                          type: string
                          description: File type or extension (e.g. pdf)
                        created_by:
                          allOf:
                          - type: object
                            properties:
                              login:
                                type: string
                                description: Email
                                example: carl.contractor@example.com
                          - type: object
                            properties:
                              id:
                                type: string
                                description: ID
                                example: '161072'
                              name:
                                type: string
                                description: Name
                                example: Carl the Contractor
                          description: User who created this version
                        created_at:
                          type: string
                          format: date-time
                          description: When this version was created
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
