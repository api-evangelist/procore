        description: 'The v2.0 company documents index endpoint has graduated from beta to GA

          (generally available). It should be used for folder and file retrieval.'
        endpoint: GET /companies/{company_id}/documents
        type: feature
        breaking: false
        datestamp: '2026-06-03'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#company-folder-and-file-index
      - summary: Company documents folder_id filter includes recycled files for recycle bin folders
        description: 'The company documents index now returns files that are in the recycle bin

          when `folder_id` points to the recycle bin root folder or to a folder

          that lives in the recycle bin.'
        endpoint: GET /companies/{company_id}/documents
        type: refinement
        breaking: false
