      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/invoices/requisitions/123/line_item_payment_application_associations',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    line_item_ids: ['6', '7']\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/invoices/requisitions/123/line_item_payment_application_associations?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&line_item_ids=6&line_item_ids=7")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
