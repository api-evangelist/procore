openapi: 3.2.0
info:
  title: Procore REST Export API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Export
paths:
  /rest/v1.1/projects/{project_id}/bid_packages/{bid_package_id}/bid_forms/export_forms:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    - name: bid_package_id
      in: path
      description: Bid Package ID
      required: true
      schema:
        type: integer
    - name: export_format
      in: query
      description: Export File Format
      required: true
      schema:
        type: string
        enum:
        - csv
    - name: bid_form_id
      in: query
      description: Bid Form ID
      required: false
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Export Forms with Bids
      description: Download a summary of all Bid Forms and their Bids in the Bid Package. Vendors are resolved from both the project directory and PCN Business Registry.
      tags:
      - Export
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                description: CSV Format (if export_format=csv)
                example: 'Bid Form,Bidders,Bid Status,Bid Amount,Bid Recipients,Notes,Last Activity

                  Electrical Form,Mike''s Electrical,Bid Submitted,$500,Mike Example (mike@example.com, Office: 999-6519 ext. 222, Mobile: 123-4596),Steve confirmed he will adjust lump sum. Mark Johnson 6/8/21,Bid resubmitted 6/3/21 at 3:11 PM CST

                  Electrical Form,Rebecca''s Electrical,Will Bid,,Rebecca Example (rebecca@example.com, Office: 123-4567, Mobile: 833-3322),Left voicemail Aaron Garcia 6/3/21,Will bid 6/3/21 at 3:11 PM CST

                  '
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: User does not have right permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Cannot find bid package
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/bid_packages/%7Bbid_package_id%7D/bid_forms/export_forms',\n  qs: {export_format: 'SOME_STRING_VALUE', bid_form_id: 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.1/projects/%7Bproject_id%7D/bid_packages/%7Bbid_package_id%7D/bid_forms/export_forms?export_format=SOME_STRING_VALUE&bid_form_id=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/bid_packages/%7Bbid_package_id%7D/bid_forms/export_forms?export_format=SOME_STRING_VALUE&bid_form_id=SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/bid_packages/%7Bbid_package_id%7D/bid_forms/export_forms?export_format=SOME_STRING_VALUE&bid_form_id=SOME_STRING_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Versioned export_forms endpoint
        description: 'Added a v1.1 export_forms endpoint that resolves vendors from both the project directory

          and PCN Business Registry via VendorAggregator. The v1.0 endpoint remains unchanged and

          uses directory-only vendor resolution.'
        endpoint: GET /projects/{project_id}/bid_packages/{bid_package_id}/bid_forms/export_forms
        type: new
        breaking: false
        datestamp: '2026-03-29'
        versions:
        - '1.1'
        x-doc:
          visibility: public
          stage: beta
          exposure: public
        link: bid-forms?version=1.1#export-forms-with-bids
      - summary: 'Expose endpoint as public beta: Export Forms with Bids'
        description: 'Expose endpoint as public beta: Export Forms with Bids'
        endpoint: GET /projects/{project_id}/bid_packages/{bid_package_id}/bid_forms/export_forms
        type: refinement
        breaking: false
        datestamp: '2026-04-22'
        versions:
        - '1.1'
        x-doc:
          visibility: public
          stage: beta
          exposure: public
        link: bid-forms?version=1.1#export-forms-with-bids
      operationId: exportFormsWithBids
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
