    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Possible Assignees (Project)
      description: Returns a list of all workflows possible assignees for a given project and tool.
      tags:
      - Workflow Possible Assignees
      parameters:
      - name: tool_type
        in: query
        description: Return workflow possible assignees for the associated tool.
        required: true
        schema:
          type: string
      - name: tool_subtype
        in: query
        description: Return workflow possible assignees for the associated tool_subtype. Required when tool_type is 'correspondence'.
        required: false
        schema:
          type: integer
      - name: step_occurrence_id
        in: query
        description: Optional current workflow step occurrence. When supplied, users already assigned to that step are excluded before pagination. The step must belong to this project and match the requested tool.
        required: false
        schema:
          type: string
      - name: filters[search]
        in: query
        description: Case-insensitive substring matched against formatted assignee names before pagination.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Workflow Possible Assignees (Index)
                properties:
                  data:
                    type: array
                    description: List of possible assignees
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the assignee
                          example: '161072'
                        login:
                          type: string
                          description: Assignee login
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name of the assignee
                          example: Carl the Contractor
                        company:
                          type:
                          - object
                          - 'null'
                          description: Vendor company for the assignee when one is associated in the requested company context
                          properties:
                            name:
                              type: string
                              description: Vendor display name
                              example: Brickworks
