      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/generic_tools/%7Bgeneric_tool_id%7D/generic_tool_items/%7Bgeneric_tool_item_id%7D/generic_tool_item_responses',\n  qs: {page: 'SOME_INTEGER_VALUE', per_page: 'SOME_INTEGER_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/generic_tools/%7Bgeneric_tool_id%7D/generic_tool_items/%7Bgeneric_tool_item_id%7D/generic_tool_item_responses?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/generic_tools/%7Bgeneric_tool_id%7D/generic_tool_items/%7Bgeneric_tool_item_id%7D/generic_tool_item_responses?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/generic_tools/%7Bgeneric_tool_id%7D/generic_tool_items/%7Bgeneric_tool_item_id%7D/generic_tool_item_responses?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Expose download_all_attachments_url on response payload
        description: The list response payload for a generic tool item's responses now includes a download_all_attachments_url field. It is populated only when the response has at least 2 prostore-file attachments, pointing at the new dedicated REST endpoint; null otherwise.
        endpoint: GET /projects/{project_id}/generic_tools/{generic_tool_id}/generic_tool_items/{generic_tool_item_id}/generic_tool_item_responses
        type: refinement
        breaking: false
        datestamp: '2026-06-02'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: correspondences?version=1.0#list-responses-for-a-generic-tool-item
      - summary: Count PDM attachments toward download_all_attachments_url on response payload
        description: download_all_attachments_url on a generic tool item response is now populated when the combined number of ProStore and PDM (document_management_document_revision) attachments is at least 2, instead of counting ProStore-file attachments only. This exposes the URL for PDM-only and mixed responses. The streamed zip itself remains ProStore-only.
        endpoint: GET /projects/{project_id}/generic_tools/{generic_tool_id}/generic_tool_items/{generic_tool_item_id}/generic_tool_item_responses
        type: fix
        breaking: false
        datestamp: '2026-08-04'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: correspondences?version=1.0#list-responses-for-a-generic-tool-item
      operationId: listResponsesForAGenericToolItem
