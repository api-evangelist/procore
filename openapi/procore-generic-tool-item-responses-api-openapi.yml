                  type: object
                  allOf:
                  - properties:
                      notes:
                        type: string
                        description: The notes property.
                      official:
                        type: boolean
                        description: If this property is set to true, the response is an official response. If this property is set to false, the response is not an official response.
                      skip_emails:
                        type: boolean
                        description: If true creating the response will not send emails to the users on the item.
                      attachments:
                        type: array
                        description: 'Specifies the Generic Tool Item Response attachments.

                          To upload attachments you must upload the entire payload as a `multipart/form-data` content-type and

                          specify each parameter as form-data together with `attachments[]` as files.'
                        items:
                          type: string
                  - properties:
                      drawing_revision_ids:
                        type: array
                        description: Drawing Revisions to attach to the response
                        items:
                          type: integer
                        example:
                        - 4
                        - 5
                      file_version_ids:
                        type: array
                        description: File Versions to attach to the response
                        items:
                          type: integer
                        example:
                        - 6
                        - 7
                      form_ids:
                        type: array
                        description: Forms to attach to the response
                        items:
                          type: integer
                        example:
                        - 7
                        - 8
                      image_ids:
                        type: array
                        description: Images to attach to the response
                        items:
                          type: integer
                        example:
                        - 9
                        - 10
                      upload_ids:
                        type: array
                        description: Uploads to attach to the response
                        items:
                          type: string
                        example:
                        - 4120226e-36a8-416f-970e-880bae78164f
                        - de07e35a-4860-4f96-acd8-8360833dc495
                      document_management_document_revision_ids:
                        type: array
                        description: PDM document to attach to the response
                        items:
                          type: string
                        example:
                        - 01JC3TZNKJK6121Z1A2V7G574Q
                        - 01JC3TZPXCJMC6P88CHHD6PTZ9
          multipart/form-data:
            schema:
              type: object
