openapi: 3.2.0
info:
  title: Procore REST Generic Tool Item Responses API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Generic Tool Item Responses
paths:
  ? /rest/v1.0/projects/{project_id}/generic_tools/{generic_tool_id}/generic_tool_items/{generic_tool_item_id}/generic_tool_item_responses
  : parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: generic_tool_id
      in: path
      description: Unique identifier for the generic tool.
      required: true
      schema:
        type: integer
    - name: generic_tool_item_id
      in: path
      description: Unique identifier for the generic tool item.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Responses for a Generic Tool Item
      description: 'Returns a list of all responses for a generic tool item in the specified project and generic tool.

        For more information on Generic Tool and Correspondence Tool endpoints,

        see Working with the Correspondence Tool.'
      tags:
      - Generic Tool Item Responses
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of generic tool items
                items:
                  title: GenericToolItemResponse
                  type: object
                  description: Generic Tool Item Response
                  properties:
                    id:
                      type: integer
                      description: Drawing Upload ID
                      example: 85
                    notes:
                      type: string
                      description: The text of the Response
                      example: This is a response.
                    created_at:
                      type: string
                      format: date-time
                      description: Generic Tool Item Response created at
                      example: '2016-08-08T21:35:58Z'
                    official:
                      type: boolean
                      description: If the response is an Official Response
                      example: true
                    position:
                      type: integer
                      description: Position of the Response
                      example: 3
                    status:
                      type: string
                      description: Status of the Generic Tool Item Response
                      example: open
                    created_by:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            description: The unique identifier of the user.
                            example: 160586
                          login:
                            type: string
                            description: The email address of the user that is used to log in.
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: The name of the user.
                            example: Carl the Contractor
                      - type: object
                        properties:
                          company_name:
                            type: string
                            description: User's Company Name
                            example: Company ABC
                    attachments:
                      type: array
                      description: Attachments
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 5324
                          url:
                            type: string
                            description: URL
                            example: http://www.example.com/
                          filename:
                            type: string
                            description: Filename
                            example: january_receipt_copy.jpg
                    download_all_attachments_url:
                      type:
                      - string
                      - 'null'
                      description: URL for downloading all of the response's prostore-file attachments as a single zip. Only present when the response has at least 2 prostore-file attachments; null otherwise. PDM (document_management_document_revision) attachments are not currently included in the zip.
                      example: https://api.procore.com/rest/v1.0/projects/1/generic_tools/2/generic_tool_items/3/generic_tool_item_responses/4/download_all_attachments
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
