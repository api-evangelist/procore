paths:
  /rest/v1.0/projects/{project_id}/crews:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List all Project Crews
      description: Return a list of all Crews with details for a specified Project.
      tags:
      - Crews
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: serializer_view
        in: query
        description: Changes what fields are included in the response.
        schema:
          type: string
          enum:
          - ids_only
      - name: filters[id]
        in: query
        description: Return crew(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[deleted_at]
        in: query
        description: 'Return crew(s) deleted within the specified datetime/date range. Formats: YYYY-MM-DD...YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ...YYYY-MM-DDTHH:MM:SSZ.'
        required: false
        schema:
          type: string
      - name: filters[with_search]
        in: query
        description: Filter crews by search text.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Crews
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    project_id:
                      type: integer
                    company_id:
                      type: integer
                    employees:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 160586
                          login:
                            type: string
                            description: Email
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Name
                            example: Carl Contractor
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    lead:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    lead_party:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        first_name:
                          type: string
                          description: First Name
                          example: Carl
                        last_name:
                          type: string
                          description: Surname
                          example: Contractor
                        is_employee:
                          type: boolean
                          description: Is an Employee?
                          example: true
                        employee_id:
                          type: string
                          description: Employee ID if an employee
                          example: 1234
                        user_id:
                          type: integer
                          description: User ID if a user
                          example: 123
                        is_active:
                          type: boolean
                          description: Is active party?
                          example: true
                    members:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 160586
                          first_name:
                            type: string
                            description: First Name
                            example: Carl
                          last_name:
                            type: string
                            description: Surname
                            example: Contractor
                          is_employee:
                            type: boolean
                            description: Is an Employee?
                            example: true
                          employee_id:
                            type: string
                            description: Employee ID if an employee
                            example: 1234
                          user_id:
                            type: integer
                            description: User ID if a user
                            example: 123
                          is_active:
                            type: boolean
                            description: Is active party?
                            example: true
                    created_at:
                      type: string
                      format: date-time
                      description: Created at
                      example: '2015-05-15T00:00:00Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Created at
                      example: '2015-05-15T00:00:00Z'
