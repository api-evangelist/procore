                      example: '{''example'':''related data''}'
                    line_item_type_id:
                      type: integer
                      description: The ID of the Line Item Type of Timecard Entry
                      example: 13
              example:
                project_id: 513526
                timecard_entry:
                  date: '2018-10-14'
                  description: Description
                  billable: true
