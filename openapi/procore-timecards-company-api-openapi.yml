        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/companies/%7Bcompany_id%7D/timecard_entries?filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Bparty_id%5D=SOME_ARRAY_VALUE&filters%5Bin_progress_only%5D=SOME_BOOLEAN_VALUE&filters%5Binclude_in_progress%5D=SOME_BOOLEAN_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bdeleted_at%5D=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&start_time_in=SOME_STRING_VALUE&end_time_in=SOME_STRING_VALUE&use_filter_tz=SOME_STRING_VALUE&serializer_view=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
