openapi: 3.2.0
info:
  title: Procore REST Timecards (Company) API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Timecards (Company)
paths:
  /rest/v1.0/companies/{company_id}/timecard_entries:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List timecard entries (Company)
      description: Return a list of all Timecard Entries, serialized according to the MyTime field set
      tags:
      - Timecards (Company)
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[party_id]
        in: query
        description: Return item(s) with the specified Party ID.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[in_progress_only]
        in: query
        required: false
        description: Return work in progress item(s).
        schema:
          type: boolean
      - name: filters[include_in_progress]
        in: query
        required: false
        description: Return available and work in progress item(s).
        schema:
          type: boolean
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[deleted_at]
        in: query
        description: Return item(s) that were deleted within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: start_date
        in: query
        description: The beginning of the date range for entries. (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: The ending of the date range for entries. (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: start_time_in
        in: query
        description: The beginning of the time_in range for entries (YYYY-MM-DDTHH:MM:SSZ). "Z" represents the timezone offset (i.e. -08:00, -0800). Optionally you may pass the literal "Z" which also means "UTC".
        schema:
          type: string
          format: time
      - name: end_time_in
        in: query
        description: The ending of the time_in range for entries (YYYY-MM-DDTHH:MM:SSZ). "Z" represents the timezone offset (i.e. -08:00, -0800). Optionally you may pass the literal "Z" which also means "UTC".
        schema:
          type: string
          format: time
      - name: use_filter_tz
        in: query
        description: When passed as "true" the timezone from start_time_in or end_time_in will be used for all timestamps in the response. Otherwise they'll use UTC.
        schema:
          type: string
          enum:
          - 'true'
      - name: serializer_view
        in: query
        description: Changes what fields are included in the response.
        schema:
          type: string
          enum:
          - ids_only
          - compact_with_date_range
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of timecard entries.  NOTE the timecards entries will be serialized according to the MyTime field set, not the Timesheet field set.
                items:
                  allOf:
                  - type: object
                    title: TimecardEntry
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the timecard entry.
                        example: 1
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when this timecard entry was created, in ISO 8601 format.
                        example: '2012-10-23T21:39:40Z'
                      date:
                        type: string
                        format: date
                        description: Date of this timecard entry.
                        example: '2015-05-12'
                      deleted_at:
                        type: string
                        format: date-time
                        description: Timestamp when this timecard entry was soft-deleted, in ISO 8601 format. Null if active.
                        example: '2017-07-29T21:39:40Z'
                      description:
                        type: string
                        description: Description or notes for this timecard entry.
                        example: Description
                      billable:
                        type: boolean
                        description: Whether this timecard entry is billable.
                        example: true
                      in_progress:
                        type: boolean
                        description: Whether this timecard entry is currently in progress (clocked in but not clocked out).
                        example: false
                      hours:
                        type: string
                        description: Total hours worked for this timecard entry.
                        example: '5.0'
                      time_in:
                        type: string
                        format: date-time
                        description: Clock-in time for this entry, in ISO 8601 format.
                        example: '2019-05-12T08:26:28Z'
                      time_out:
                        type: string
                        format: date-time
                        description: Clock-out time for this entry, in ISO 8601 format.
                        example: '2019-05-12T17:26:28Z'
                      lunch_time:
                        type: string
                        description: Duration of lunch break in minutes.
                        example: '30'
                      approval_status:
                        type: string
                        description: Supervisor approval status for this entry (e.g., pending, reviewed, approved, completed).
                        example: pending
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when this timecard entry was last modified, in ISO 8601 format.
                        example: '2019-05-12T21:26:28Z'
                      timecard_type:
                        type: string
                        description: Display name of the time type (e.g., Regular Time, Overtime).
                        example: Regular Time
                      origin_id:
                        type: integer
                        description: ID of related external data
                        example: 23423
                      origin_data:
                        type: string
                        description: Value of related external data
                        example: '{''example'':''related data''}'
                      timesheet:
                        type: object
                        title: Timesheet
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the timesheet.
                            example: 1
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp when this timesheet was created, in ISO 8601 format.
                            example: '2012-10-23T21:39:40Z'
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp when this timesheet was last modified, in ISO 8601 format.
                            example: '2012-10-24T21:39:40Z'
                          date:
                            type: string
                            format: date
                            description: Date of this timesheet.
                            example: '2015-05-12'
                          number:
                            type: integer
                            description: Sequential number of this timesheet.
                            example: 1
                          created_by:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Unique identifier of the user who created this timesheet.
                                example: 160586
                              login:
                                type: string
                                description: Email address of the user who created this timesheet.
                                example: carl.contractor@example.com
                              name:
                                type: string
                                description: Full name of the user who created this timesheet.
                                example: Carl Contractor
                          name:
                            type: string
                            description: Display name of the timesheet (typically date and number).
                            example: 2015-05-12 - 01
                          status:
                            type: string
                            description: The approval status of the Timesheet
                            example: pending
                      cost_code:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the cost code.
                            example: 12345
                          name:
                            type: string
                            description: Display name of the cost code.
                            example: Earthwork
                      sub_job:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the sub job.
                            example: 3483483
                          name:
                            type: string
                            description: Display name of the sub job.
                            example: Floor 2
                          code:
                            type: string
                            description: Unique code in the scope of a Project
                            example: 18
                      created_by:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the user who created this entry.
                            example: 160586
                          login:
                            type: string
                            description: Email address of the user who created this entry.
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Full name of the user who created this entry.
                            example: Carl Contractor
                      login_information:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the user this entry is for.
                            example: 160586
                          login:
                            type: string
                            description: Email address of the user this entry is for.
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Full name of the user this entry is for.
                            example: Carl Contractor
                      timecard_time_type:
                        type: object
                        title: TimecardTimeType
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the time type.
                            example: 1
                          abbreviated_time_type:
                            type: string
                            description: Abbreviated code for this time type (e.g., REG, OVE).
                            example: REG
                          company_id:
                            type: integer
                            description: Identifier of the company that owns this time type.
                            example: 15125
                          global:
                            type: boolean
                            description: Whether this is a system-provided global time type.
                            example: false
                          time_type:
                            type: string
                            description: Display name of the time type (e.g., Regular Time, Overtime).
                            example: Another Time
                      party:
                        type: object
                        title: Party
                        properties:
                          id:
                            type: integer
                            description: Identifier of the party (employee/contact).
                            example: 1
                          name:
                            type: string
                            description: Full name of the party.
                            example: Dolores Umbridge
                      crew:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                      procore_signature:
                        title: Timesheets Signature
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the signature.
                            example: 5324
                          signature_text:
                            type: string
                            description: Acknowledgement text the signer agreed to.
                            example: I acknowledge these hours are correct.
                          file_name:
                            type: string
                            description: Filename of the signature image.
                            example: signature_2018_09_16.jpg
                          url:
                            type: string
                            description: Direct URL to the full-size signature image.
                            example: http://www.example.com/
                          medium_thumbnail_url:
                            type: string
                            description: URL for a medium-sized thumbnail of the signature image.
                            example: http://www.example.com/
                          large_thumbnail_url:
                            type: string
                            description: URL for a large-sized thumbnail of the signature image.
                            example: http://www.example.com/
                          created_by:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Unique identifier of the user who created this signature.
                                example: 160586
                              login:
                                type: string
                                description: Email address of the user who created this signature.
                                example: carl.contractor@example.com
                              name:
                                type: string
                                description: Full name of the user who created this signature.
                                example: Carl Contractor
                      project:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for the project.
                            example: 99
                          name:
                            type: string
                            description: Project Display Name (could include Project Number)
                            example: More Mesa Renovation
                      clock_in:
                        type: object
                        properties:
                          id:
                            type: integer
                      clock_out:
                        type: object
                        properties:
                          id:
                            type: integer
                      line_item_type_id:
                        type: integer
                        description: The ID of the Line Item Type of the Timecard Entry
                        example: 13
                      wbs_code:
                        allOf:
                        - type: object
                          description: A work breakdown structure code
                          properties:
                            id:
                              type: integer
                              description: Unique identifier of the Work Breakdown Structure code. Use as the {id} path parameter in PATCH /rest/v1.0/projects/{project_id}/work_breakdown_structure/wbs_codes/{id}.
                              example: 1
                            flat_code:
                              type: string
                              description: The Work Breakdown Structure code made up of segment values, concatenated by the set delimiter. Use this value to display or identify a WBS code.
                              example: 01.100.Concrete.Slabs
                            flat_name:
                              type: string
                              description: The names of the Work Breakdown Structure segments concatenated using the company's delimiter and WBS pattern.
                              example: SubJob.CostCode.CostType
                            description:
                              type: string
                              description: Description of the WBS code. Falls back to flat_name when no custom description  has been set.
                              example: WBS Description
                            status:
                              type: string
                              enum:
                              - active
                              - inactive
                              description: 'Lifecycle status of the WBS code. One of: ''active'' (available for use in budgets and line items), ''inactive'' (not available for selection). Filter collections with filters[status][]=active or filters[status][]=inactive.'
                              example: active
                            created_at:
                              type: string
                              format: date-time
                              description: Timestamp when this WBS code was created, in ISO 8601 format.
                              example: '2016-06-30T20:41:58Z'
                            updated_at:
                              type: string
                              format: date-time
                              description: Timestamp when this WBS code was last updated, in ISO 8601 format.
                              example: '2016-08-30T18:11:43Z'
                            segment_items:
                              type: array
                              description: The segment items that make up this WBS code, one per segment in the WBS pattern. Each item represents a cost code, line item type, sub-job, or custom segment item.
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: Unique ID of this segment item (cost code, sub-job, line item type, or custom segment item). Use as segment_item_id when constructing a new WBS code via POST /rest/v1.0/projects/{project_id}/work_breakdown_structure/wbs_codes.
                                    example: 456
                                  code:
                                    type: string
                                    description: Short alphanumeric code for this segment item (e.g., '01-222'). Combined with sibling segment codes to form the flat_code on the parent WBS code.
                                    example: 01-222
                                  name:
                                    type: string
                                    description: Human-readable name of this segment item (e.g., 'Lighting'). Combined with sibling segment names to form the flat_name on the parent WBS code.
                                    example: Lighting
                                  created_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp when this segment item was created, in ISO 8601 format.
                                    example: '2016-06-30T20:41:58Z'
                                  updated_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp when this segment item was last updated, in ISO 8601 format.
                                    example: '2016-08-30T18:11:43Z'
                                  parent_id:
                                    type:
                                    - integer
                                    - 'null'
                                    description: ID of the parent segment item in a tiered segment hierarchy. Null for root-level items or items in a flat-structure segment.
                                    example: 123
                                  path_ids:
                                    type: array
                                    description: Ordered list of IDs from the root ancestor down to (and including) this segment item. Use to reconstruct the full hierarchy path.
                                    items:
                                      type: integer
                                    example:
                                    - 123
                                    - 456
                                  path_code:
                                    type: string
                                    description: Full path code for this segment item representing the leaf code in its hierarchy (e.g., '01-222').
                                    example: a
                                  is_parent:
                                    type: boolean
                                    description: Whether this segment item has child items in a tiered segment structure. Always false for flat-structure segments.
                                    example: false
                                  path_codes:
                                    type: array
                                    description: Ordered list of code strings from the root ancestor down to (and including) this segment item, formatted as 'code - name'.
                                    items:
                                      type: string
                                    example:
                                    - 01 - Requirements
                                    - 01-222 - Lighting
                                  path_names:
                                    type: array
                                    description: Ordered list of name strings from the root ancestor down to (and including) this segment item, formatted as 'code - name'.
                                    items:
                                      type: string
                                    example:
                                    - 01 - Requirements
                                    - 01-222 - Lighting
                                  in_use:
                                    type: boolean
                                    description: Whether this segment item is currently referenced by at least one entity (e.g., a budget line item or WBS code).
                                    example: true
                                  segment:
                                    type: object
                                    description: The WBS segment definition that this segment item belongs to.
                                    properties:
                                      id:
                                        type: integer
                                        description: Unique ID of the WBS segment definition.
                                        example: 3
                                      name:
                                        type: string
                                        description: Display name of the segment (e.g., 'Cost Code', 'Sub Job').
                                        example: Cost Code
                                      type:
                                        type: string
                                        enum:
                                        - cost_code
                                        - line_item_type
                                        - sub_job
                                        - custom
                                        - attribute
                                        description: 'Category of this segment. One of: ''cost_code'', ''line_item_type'', ''sub_job'', ''custom'', ''attribute''. Determines which domain entity backs the segment items.'
                                        example: cost_code
                                      position:
                                        type: integer
                                        description: Display order of this segment within the WBS pattern. Lower numbers appear first when reading the flat_code left to right.
                                        example: 1
                                      delimiter:
                                        type: string
                                        description: Character used to separate this segment's value from adjacent segments in the flat_code (e.g., '.').
                                        example: .
                                      required:
                                        type: boolean
                                        description: Whether this segment must have a value for a WBS code to be valid.
                                        example: true
                                      segment_items_count:
                                        type: integer
                                        description: Total number of segment items defined for this segment.
                                        example: 2
                                      project_can_modify_origin_project:
                                        type: boolean
                                        description: Whether project-level users can modify segment items that originated from this project.
                                        example: true
                                      project_can_delete_origin_company:
                                        type: boolean
                                        description: Whether project-level users can delete segment items that originated from the company level.
                                        example: true
                                      structure:
                                        type: string
                                        enum:
                                        - tiered
                                        - flat
                                        description: Hierarchy structure of the segment. 'flat' means items have no parent-child relationship; 'tiered' means items can be nested with parent_id references.
                                        example: tiered
                                      created_at:
                                        type: string
                                        format: date-time
                                        description: Timestamp when this segment definition was created, in ISO 8601 format.
                                        example: '2016-06-30T20:41:58Z'
                                      updated_at:
                                        type: string
                                        format: date-time
                                        description: Timestamp when this segment definition was last updated, in ISO 8601 format.
                                        example: '2016-08-30T18:11:43Z'
                                      wbs_pattern_id:
                                        type: integer
                                        description: ID of the WBS pattern this segment belongs to.
                                        example: 4567
                                    example:
                                      id: 3
                                      name: Cost Code
                                      type: cost_code
                                      position: 1
                                      delimiter: .
                                      required: true
                                      segment_items_count: 2
                                      project_can_modify_origin_project: true
                                      project_can_delete_origin_company: true
                                      structure: tiered
                                      created_at: '2016-06-30T20:41:58Z'
                                      updated_at: '2016-08-30T18:11:43Z'
                                      wbs_pattern_id: 4567
                                  status:
                                    type: string
                                    enum:
                                    - active
                                    - inactive
                                    description: 'Lifecycle status of the segment item. One of: ''active'' (available for selection when creating WBS codes), ''inactive'' (not available for new WBS codes).'
                                    example: active
                            wbs_pattern_id:
                              type: integer
                              description: ID of the WBS pattern that defines the segment structure for this code. All WBS codes under the same project share the same wbs_pattern_id.
                              example: 42
                            attribute_items:
                              type: array
                              description: Custom attribute items assigned to this WBS code. Only present when the project has WBS attributes configured. Empty array when no attributes are assigned.
                              items:
                                type: object
                                properties:
                                  attribute_id:
                                    type: string
                                    description: ID of the WBS attribute definition.
                                    example: '7'
                                  id:
                                    type: string
                                    description: ID of the WBS attribute item.
                                    example: '12'
                                  name:
                                    type: string
                                    description: Display name of the assigned attribute item (a value within an attribute, e.g. 'Labor').
                                    example: Labor
                            is_in_group:
                              type: boolean
                              description: Whether this WBS code belongs to the group specified by the group_type and group_id query parameters. Only present when the group_type query parameter is provided;  group_id is optional.
                              example: true
                        - type: object
                          properties:
                            cost_code:
                              type: object
                            sub_job:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                code:
                                  type: string
                            line_item_type:
                              type: object
                              title: LineItemType
                              description: Line Item Type
                              properties:
                                id:
                                  type: integer
                                  description: Unique identifier for this Line Item Type (cost type). Use as the {id} path parameter to retrieve, update, or delete it via /rest/v1.0/line_item_types/{id}.
                                  example: 12345
                                name:
                                  type: string
                                  description: Human-readable name of the Line Item Type, such as "Labor" or "Equipment".
                                  example: Equipment
                                code:
                                  type: string
                                  description: Short abbreviation code for the Line Item Type, used in CSV imports and cost reports to reference this type.
                                  example: LB
                                base_type:
                                  type: string
                                  enum:
                                  - labor
                                  - equipment
                                  - materials
                                  - commitment
                                  - owner_cost
                                  - professional_services
                                  - other
                                  description: Underlying cost category this Line Item Type maps to, which determines how associated costs are classified.
                                  example: materials
                                origin_data:
                                  type:
                                  - string
                                  - 'null'
                                  description: Free-form data carried over from the external system of record (such as an ERP) this Line Item Type originated from. Null when the Line Item Type was not created through an external integration.
                                  example: OD-2398273424
                                origin_id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Identifier of this Line Item Type in the external system of record (such as an ERP). Null when the Line Item Type was not created through an external integration.
                                  example: ABC123
                      custom_fields:
                        type: object
                        properties:
                          custom_field_%{custom_field_string_definition_id}:
                            type: object
                            properties:
                              data_type:
                                type: string
                                description: The data type of the Custom Field Definition.
                                example: string
                              value:
                                type: string
                                description: The value of the custom field.
                                example: custom field value
                          custom_field_%{custom_field_decimal_definition_id}:
                            type: object
                            properties:
                              data_type:
                                type: string
                                description: The data type of the Custom Field Definition.
                                example: decimal
                              value:
                                type: number
                                description: The value of the custom field.
                                example: 2.2
                          custom_field_%{custom_field_boolean_definition_id}:
                            type: object
                            properties:
                              data_type:
                                type: string
                                description: The data type of the Custom Field Definition.
                                example: boolean
                              value:
                                type: boolean
                                description: The value of the custom field.
                                example: true
                          custom_field_%{custom_field_lov_entry_definition_id}:
                            type: object
                            properties:
                              data_type:
                                type: string
                                description: The data type of the Custom Field Definition.
                                example: lov_entry
                              value:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: The unique identifier of the list of values (LOV) entry.
                                    example: 1
                                  label:
                                    type: string
                                    description: Label of the list of values (LOV) entry.
                                    example: Open
                          custom_field_%{custom_field_lov_entries_definition_id}:
                            type: object
                            properties:
                              data_type:
                                type: string
                                description: The data type of the Custom Field Definition.
                                example: lov_entries
                              value:
