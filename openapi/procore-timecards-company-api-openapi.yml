    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update timecard entry (Company)
      description: Update a specified Timecard Entry.
      tags:
      - Timecards (Company)
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - timecard_entry
              properties:
                project_id:
                  type: integer
                  description: The ID of the Project the Timecard Entry belongs to
                  example: 2910
                timecard_entry:
                  title: TimecardEntry
                  type: object
                  description: Timecard Entry object
                  required:
                  - date
                  properties:
                    date:
                      type: string
                      format: date
                      description: The Date of the Timecard Entry
                      example: '2019-06-01'
                    hours:
                      type: string
                      description: The Hours of the Timecard Entry
                      example: '8.0'
                    lunch_time:
                      type: string
                      description: Duration of lunch break in minutes for the Timecard Entry. Only required if Timesheet time entry is configured for Start Time and Stop Time.
                      example: '60'
                    time_in:
                      type: string
                      description: The Start Time of the Timecard Entry in ISO 8601 format. Only required if Timesheet time entry is configured for Start Time and Stop Time.
                      example: '2019-06-01T07:08:00Z'
                    time_out:
                      type: string
                      description: The Stop Time of the Timecard Entry in ISO 8601 format. Only required if Timesheet time entry is configured for Start Time and Stop Time.
                      example: '2019-06-01T07:17:00Z'
                    billable:
                      type: boolean
                      description: The Billable status of the Timecard Entry
                      default: false
                    description:
                      type: string
                      description: The Description of the Timecard Entry
                      example: Moderate rain.
                    timecard_time_type_id:
                      type: integer
                      description: The ID of the Timecard Time Type of the Timecard Entry
                      example: 1029
                    location_id:
                      type: integer
                      description: The ID of the Location of the Timecard Entry
                      example: 1009
                    cost_code_id:
                      type: integer
                      description: The ID of the Cost Code of the Timecard Entry
                      example: 108
                    set_timecard_time_type_automatically:
                      type: boolean
                      description: Whether or not to allow the automatic overtime management system to apply the configured rules to set the timecard_time_type_id and/or split the timecard entry automatically
                      example: true
                    sub_job_id:
                      type: integer
                      description: The ID of the Sub Job of the Timecard Entry
                      example: 191
                    party_id:
                      type: integer
                      description: The ID of the Party of the Timecard Entry
                      example: 192
                    crew_id:
                      type: integer
                      description: The ID of the Crew of the Timecard Entry
                      example: 1119
                    procore_signature_id:
                      type: integer
                      description: The ID of the Procore Signature of the Timecard Entry
                      example: 10
                    timesheet_id:
                      type: integer
                      description: The ID of the Timesheet of the Timecard Entry
                      example: 41823
                    clock_in_id:
                      type: integer
                      description: The ID of the clock in Gps Position of the Timecard Entry
                      example: 345
                    clock_out_id:
                      type: integer
                      description: The ID of the clock out Gps Position of the Timecard Entry
                      example: 642
                    clock_in_time:
                      type: string
                      description: The datetime a timecard clock in was punched
                      example: '2020-03-24T04:14:06Z'
                    clock_out_time:
                      type: string
                      description: The datetime a timecard clock out was punched
                      example: '2020-03-24T05:14:22Z'
                    approval_status:
                      type: string
                      description: The Approval Status of the Timecard Entry
                      example: approved
                      enum:
                      - pending
                      - reviewed
                      - approved
                      - completed
                    origin_id:
                      type: integer
                      description: ID of related external data
                      example: 23423
                    origin_data:
                      type: string
                      description: Value of related external data
                      example: '{''example'':''related data''}'
                    line_item_type_id:
                      type: integer
                      description: The ID of the Line Item Type of the Timecard Entry
                      example: 13
              example:
                timecard_entry:
                  date: '2018-10-14'
                  description: Description
                  billable: true
                  hours: '8.0'
                  lunch_time: '60'
                  time_in: '2018-10-14T07:00:00Z'
                  time_out: '2018-10-14T16:00:00Z'
                  timecard_time_type_id: 1
                  timesheet_id: 41823
                  cost_code_id: 12345
                  sub_job_id: 3483483
                  location_id: 161072
                  procore_signature_id: 1121
                  party_id: 2341
                  crew_id: 1022
                  clock_in: 4567
                  clock_out: 1267
                  approval_status: approved
                  origin_id: 23423
                  origin_data: '{''example'':''related data''}'
                  line_item_type_id: 13
        required: true
