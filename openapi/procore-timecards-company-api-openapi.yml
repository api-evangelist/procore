                      example: true
                    sub_job_id:
                      type: integer
                      description: The ID of the Sub Job of the Timecard Entry
                      example: 11
                    party_id:
                      type: integer
                      description: The ID of the Party of the Timecard Entry
                      example: 87
                    crew_id:
                      type: integer
                      description: The ID of the Crew of the Timecard Entry
                      example: 92
                    procore_signature_id:
                      type: integer
                      description: The ID of the Procore Signature of the Timecard Entry
                      example: 980
