            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/schedule/tasks/%7Btask_id%7D/requested_changes',\n  headers: {'content-type': 'application/json'},\n  body: {\n    requested_change: {\n      change_reason: 'Change schedule request',\n      other_change: 'Other change',\n      task: {start: '2022-01-31', finish: '2022-02-15', percentage: 50},\n      notes: 'Delayed due to weather'\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"requested_change\":{\"change_reason\":\"Change schedule request\",\"other_change\":\"Other change\",\"task\":{\"start\":\"2022-01-31\",\"finish\":\"2022-02-15\",\"percentage\":50},\"notes\":\"Delayed due to weather\"}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.1/projects/%7Bproject_id%7D/schedule/tasks/%7Btask_id%7D/requested_changes", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/schedule/tasks/%7Btask_id%7D/requested_changes \\\n  --header 'content-type: application/json' \\\n  --data '{\"requested_change\":{\"change_reason\":\"Change schedule request\",\"other_change\":\"Other change\",\"task\":{\"start\":\"2022-01-31\",\"finish\":\"2022-02-15\",\"percentage\":50},\"notes\":\"Delayed due to weather\"}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/schedule/tasks/%7Btask_id%7D/requested_changes\"),\n    Content = new StringContent(\"{\\\"requested_change\\\":{\\\"change_reason\\\":\\\"Change schedule request\\\",\\\"other_change\\\":\\\"Other change\\\",\\\"task\\\":{\\\"start\\\":\\\"2022-01-31\\\",\\\"finish\\\":\\\"2022-02-15\\\",\\\"percentage\\\":50},\\\"notes\\\":\\\"Delayed due to weather\\\"}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Added requested changes create endpoint
        description: Added requested changes endpoint
        endpoint: POST /projects/{project_id}/schedule/tasks/{task_id}/requested_changes
        type: new
        breaking: false
        datestamp: '2022-03-16'
        versions:
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: task-requested-changes?version=1.1#create-requested-change
      operationId: createRequestedChange
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
