openapi: 3.2.0
info:
  title: Procore REST Requested Change API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Requested Change
paths:
  /rest/v1.1/projects/{project_id}/schedule/requested_changes:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List requested changes for a Schedule or a Task
      description: Returns the requested change list.
      tags:
      - Requested Change
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: task_id
        description: Task ID
        in: query
        required: false
        schema:
          type: integer
      - name: view
        in: query
        description: The `with_task` view includes an additional task data for correspondent requested changes
        schema:
          type: string
        required: false
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Requested change id
                      example: 333713
                    change_requested:
                      type: string
                      description: Requested change
                      example: '<ul><li>Other change: why7</li></ul>'
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    new_finish:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Requested change finish date
                      example: '2022-03-04T00:00:00Z'
                    new_start:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Requested change start date
                      example: '2022-01-31T00:00:00Z'
                    new_percentage:
                      type:
                      - integer
                      - 'null'
                      description: Requested change percentage
                      example: 50
                    old_finish:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Current finish date
                      example: '2022-03-04T00:00:00Z'
                    old_start:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Current start date
                      example: '2022-01-31T00:00:00Z'
                    old_percentage:
                      type:
                      - integer
                      - 'null'
                      description: Current percentage
                      example: 50
                    other_change:
                      type: string
                      description: Other change
                      example: Add as milestone
                    reason:
                      type:
                      - string
                      - 'null'
                      description: Requested change reason
                      example: <p>this is a description</p>
                    status:
                      type: string
                      description: Localized requested change status
                      example: Pending
                    status_not_localized:
                      type: string
                      description: Requested change status not localized
                      enum:
                      - approved
                      - rejected
                      - pending
                      example: pending
                    notes:
                      type:
                      - string
                      - 'null'
                      description: Requested change notes
                      example: Notes
                    created_at:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Requested change created date
                      example: '2022-03-04T00:00:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/schedule/requested_changes',\n  qs: {\n    task_id: 'SOME_INTEGER_VALUE',\n    view: 'SOME_STRING_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.1/projects/%7Bproject_id%7D/schedule/requested_changes?task_id=SOME_INTEGER_VALUE&view=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/schedule/requested_changes?task_id=SOME_INTEGER_VALUE&view=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.1/projects/%7Bproject_id%7D/schedule/requested_changes?task_id=SOME_INTEGER_VALUE&view=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Added requested changes endpoint
        description: Added requested changes query endpoint
        endpoint: GET /projects/{project_id}/schedule/requested_changes
        type: new
        breaking: false
        datestamp: '2022-03-16'
        versions:
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: task-requested-changes?version=1.1#list-requested-changes-for-a-schedule-or-a-task
      - summary: Add `with_task` view
        description: Add possibility to return task data for requested changes specifiying `view` param as `with_task`
        endpoint: GET /projects/{project_id}/schedule/requested_changes
        type: refinement
        breaking: false
        datestamp: '2022-09-05'
        versions:
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: task-requested-changes?version=1.1#list-requested-changes-for-a-schedule-or-a-task
      operationId: listRequestedChangesForAScheduleOrATask
  /rest/v1.1/projects/{project_id}/schedule/tasks/{task_id}/requested_changes:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Requested Change
      description: Create a new requested change on a Task.
      tags:
      - Requested Change
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: task_id
        description: Task ID
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_change:
                  type: object
                  properties:
                    change_reason:
                      type: string
                      description: Requested change reason
                      example: Change schedule request
                    other_change:
                      type: string
                      example: Other change
                    task:
                      type: object
                      properties:
                        start:
                          type: string
                          description: Requested change start date
                          example: '2022-01-31'
                        finish:
                          type: string
                          description: Requested change finish date
                          example: '2022-02-15'
                        percentage:
                          type: integer
                          description: Requested change percentage
                          example: 50
                    notes:
                      type: string
                      description: Requested change notes
                      example: Delayed due to weather
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Requested change id
                    example: 333713
                  change_requested:
                    type: string
                    description: Requested change
                    example: '<ul><li>Other change: why7</li></ul>'
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                  new_finish:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Requested change finish date
                    example: '2022-03-04T00:00:00Z'
                  new_start:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Requested change start date
                    example: '2022-01-31T00:00:00Z'
                  new_percentage:
                    type:
                    - integer
                    - 'null'
                    description: Requested change percentage
                    example: 50
                  old_finish:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Current finish date
                    example: '2022-03-04T00:00:00Z'
                  old_start:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Current start date
                    example: '2022-01-31T00:00:00Z'
                  old_percentage:
                    type:
                    - integer
                    - 'null'
                    description: Current percentage
                    example: 50
                  other_change:
                    type: string
                    description: Other change
                    example: Add as milestone
                  reason:
                    type:
                    - string
                    - 'null'
                    description: Requested change reason
                    example: <p>this is a description</p>
                  status:
                    type: string
                    description: Localized requested change status
                    example: Pending
                  status_not_localized:
                    type: string
                    description: Requested change status not localized
                    enum:
                    - approved
                    - rejected
                    - pending
                    example: pending
                  notes:
                    type:
                    - string
                    - 'null'
                    description: Requested change notes
                    example: Notes
                  created_at:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Requested change created date
                    example: '2022-03-04T00:00:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
