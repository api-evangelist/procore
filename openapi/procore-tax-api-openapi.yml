openapi: 3.2.0
info:
  title: Procore REST Tax API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Tax
paths:
  /rest/v1.0/tax_codes:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: query
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Tax Codes
      description: 'Return a list of all Tax Codes for a given Company


        When tax suport is enabled in Procore you can associate line items

        with a specific Tax Code. The Tax Code (sometimes known as a Tax Group)

        determines the tax rate to be applied to the line item for each Tax Type

        defined in Procore (Note that presently Procore only supports a single

        Tax Type per company).


        You may define as many Tax Codes as required. Through the web interface, a

        Procore admin user may identify one of these tax codes as the default

        value to be shown when creating new line items.'
      tags:
      - Tax
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Expect number of items in response. min: 1, max: 100'
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: The ID of the Tax Code
                      example: 123
                    code:
                      type: string
                      description: The Tax Code
                      example: GST@10%
                    description:
                      type: string
                      description: Description of the Tax Code
                      example: Goods and Services Tax
                    origin_data:
                      type: string
                      description: 'Additional Third-party Metadata for the Tax Code. Note: This is a free-form text field.'
                      example: '{ parent_ids: [1,2] }'
                    origin_id:
                      type: string
                      description: The Third-party ID of the Tax Code
                      example: 1VT-33778-013
                    rate1:
                      type: number
                      format: float
                      description: Rate to apply for first Tax Type
                      example: 10
                    archived:
                      type: boolean
                      description: Set to true if this tax code has been archived
                      example: false
                    default_tax_code:
                      type: boolean
                      description: Set to true if this tax code is default tax code
                      example: false
                    display_in_budget:
                      type: boolean
                      description: Whether this tax code should be displayed in budget views. Defaults to false.
                      example: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
