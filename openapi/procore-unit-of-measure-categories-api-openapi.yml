tags:
- name: Unit of Measure Categories
paths:
  /rest/v1.0/companies/{company_id}/uom_categories:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Unit of Measure Categories
      description: Returns the company's Unit of Measure (UOM) Categories. Categories are the seven Procore-standard groupings every company has by default — `time`, `amount`, `length`, `area`, `volume`, `mass`, and `other` — and are returned localized for the requesting user. Use the returned `id` as the `uom_category_id` when creating or updating a Unit of Measure via `POST` or `PATCH /rest/v1.0/companies/{company_id}/uoms`.
      tags:
      - Unit of Measure Categories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: A Unit of Measure (UOM) Category that groups related units (e.g., 'length', 'time').
                  properties:
                    id:
                      type: integer
                      description: Numeric identifier of the UOM Category. Use as the `uom_category_id` when creating or updating a Unit of Measure via `POST` or `PATCH /rest/v1.0/companies/{company_id}/uoms`.
                      example: 202
                    name:
                      type: string
                      description: 'Name of the UOM Category. One of Procore''s standard categories: `time`, `amount`, `length`, `area`, `volume`, `mass`, `other`. Returned localized for the requesting user.'
                      example: time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
