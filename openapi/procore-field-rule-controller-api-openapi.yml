    post:
      tags:
      - field-rule-controller
      summary: Create Field Rule
      description: Creates a field rule. For FIELD_DEFAULTS, the rule is scoped to an asset type, fieldset, and trigger field. The scope tuple must be unique among active rules.
      operationId: createFieldRule
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: Accept-Language
