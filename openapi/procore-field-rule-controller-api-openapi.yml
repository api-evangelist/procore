openapi: 3.2.0
info:
  title: Procore REST Field Rule Controller API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: field-rule-controller
paths:
  /rest/v2.0/companies/{company_id}/assets/settings/asset_types/{asset_type_id}/available_fields:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      tags:
      - field-rule-controller
      summary: List Available Fields for Rule Configuration
      description: 'Returns the set of fields eligible for FIELD_DEFAULTS rule configuration on the given asset type: Procore default fields + configurable fieldset fields, with excluded field names / types (e.g., file uploads) filtered out.'
      operationId: getAvailableFields
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: asset_type_id
        in: path
        description: Unique identifier for the asset type.
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: A field eligible for FIELD_DEFAULTS rule configuration
                      properties:
                        name:
                          type: string
                          description: Field name (e.g. trade_id, custom_field_1234)
                        label:
                          type: string
                          description: Display label
                        data_type:
                          type: string
                          description: FieldType key (string, boolean, decimal, lov_entry, etc.)
                          enum:
                          - boolean
                          - cost_code
                          - datetime
                          - datetime/time
                          - datetime/mm_yyyy
                          - datetime/yyyy
                          - decimal
                          - decimal/currency
                          - location
                          - login_information
                          - login_information/project_directory
                          - login_informations
                          - lov_entries
                          - lov_entry
                          - lov_entry/radio_button
                          - lov_entry/with_code
                          - prequal_file_uploads
                          - prostore_files
                          - rich_text
                          - rich_text/read_only
                          - string
                          - string/phone_number
                          - vendor
                        variant:
                          type: string
                          description: Variant for the data type
                        fieldset_id:
                          type: string
                          description: 'Fieldset id: ''-1'' for Procore defaults, external id for custom fields'
                        required:
                          type: boolean
                          description: Whether this field is required in the fieldset
                        visible:
                          type: boolean
                          description: Whether this field is visible in the fieldset
                        list_of_values:
                          type: array
                          description: List of values for LOV fields; null for Procore default LOV fields (values come from AssetStatus / AssetTrade) and for non-LOV fields
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                format: int64
                              label:
                                type: string
                              code:
                                type: string
                              position:
                                type: integer
                                format: int32
                              active:
                                type: boolean
        '400':
          description: The server could not understand the request due to invalid syntax or parameters that fail to meet validation requirements.
        '401':
          description: Although the HTTP standard specifies "unauthorized", semantically this response means "unauthenticated". That is, the client must authenticate itself to get the requested response.
        '403':
          description: The client does not have access rights to the content; that is, it is authenticated, but the server is refusing to give the requested resource. Unlike 401, the client's identity is known to the server.
        '404':
          description: The server can not find the requested resource. This can mean either the URL is not recognized, or the resource itself does not exist. Servers may also send this response instead of 403 to hide the existence of a resource from an unauthorized client.
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'http://localhost:8080/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/available_fields',\n  headers: {\n    'Procore-Company-Id': 'SOME_INTEGER_VALUE',\n    'Accept-Language': 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: "import http.client\n\nconn = http.client.HTTPConnection(\"localhost:8080\")\n\nheaders = {\n    'Procore-Company-Id': \"SOME_INTEGER_VALUE\",\n    'Accept-Language': \"SOME_STRING_VALUE\"\n    }\n\nconn.request(\"GET\", \"/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/available_fields\", headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url http://localhost:8080/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/available_fields \\\n  --header 'Accept-Language: SOME_STRING_VALUE' \\\n  --header 'Procore-Company-Id: SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"http://localhost:8080/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/available_fields\"),\n    Headers =\n    {\n        { \"Procore-Company-Id\", \"SOME_INTEGER_VALUE\" },\n        { \"Accept-Language\", \"SOME_STRING_VALUE\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
  /rest/v2.0/companies/{company_id}/assets/settings/asset_types/{asset_type_id}/field_rules:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      tags:
      - field-rule-controller
      summary: List Field Rules for an Asset Type
      description: Returns field rules (FIELD_DEFAULTS) scoped to the given asset type. Optionally filter by rule_type and fieldset_id. Used by the admin UI's configured fields table and by runtime clients that apply defaults / read-only flags during asset creation.
      operationId: listFieldRulesForAssetType
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: asset_type_id
        in: path
        description: Unique identifier for the asset type.
        required: true
        schema:
          type: string
      - name: rule_type
        in: query
        description: Optional rule type filter (e.g. FIELD_DEFAULTS)
        required: false
        schema:
          type: string
          enum:
          - NAMING
          - FIELD_DEFAULTS
          - VALIDATION
          - CROSS_FIELD
          - MANDATORY
          - WARNING
      - name: rule_types
        in: query
        description: Optional repeatable rule-type filter (e.g. rule_type=MANDATORY&rule_type=WARNING). When provided, takes precedence over the single rule_type param.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NAMING
            - FIELD_DEFAULTS
            - VALIDATION
            - CROSS_FIELD
            - MANDATORY
            - WARNING
      - name: fieldset_id
        in: query
        description: Optional fieldset id filter ("-1" for Procore defaults)
        required: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: Field rule response (NAMING or FIELD_DEFAULTS)
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the field rule
                        company_id:
                          type: integer
                          format: int64
                          description: Company this rule belongs to
                        project_id:
                          type: integer
                          format: int64
                          description: Project this rule applies to; null for company-level rules
                        asset_type_id:
                          type: string
                          description: Asset type this rule applies to. Populated for FIELD_DEFAULTS; null for NAMING.
                        fieldset_id:
                          type: string
                          description: Fieldset scope. '-1' for Procore default fields, external configurable fieldset id for custom fields. Null for NAMING.
                        rule_type:
                          type: string
                          description: Kind of rule
                          enum:
                          - NAMING
                          - FIELD_DEFAULTS
                          - VALIDATION
                          - CROSS_FIELD
                          - MANDATORY
                          - WARNING
                        trigger_field:
                          type: string
                          description: Field that triggers this rule (e.g. asset_code for NAMING, custom_field_1234 for FIELD_DEFAULTS)
                        rule_name:
                          type: string
                          description: Name of the rule
                        description:
                          type: string
                          description: Optional description of the rule
                        definition:
                          description: 'Structured rule definition. Shape depends on ruleType: FieldRuleDefinitionDTO for NAMING, FieldDefaultsDefinitionDTO for FIELD_DEFAULTS, ConditionalValidationDefinitionDTO for MANDATORY/WARNING.'
                          oneOf:
                          - type: object
                            description: Rule definition containing expression segments
                            properties:
                              expression_fields:
                                type: array
                                description: Ordered list of expression segments
                                items:
                                  type: object
                                  description: Expression segment for naming rule
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - LITERAL
                                      - REF
                                      - DELIMITER
                                      - SEQ
                                    order:
                                      type: integer
                                      format: int32
                                      description: Display order of the segment
                                      minimum: 1
                                    value:
                                      type: string
                                      description: 'For LITERAL: static text value'
                                    field:
                                      type: string
                                      description: 'For REF: field identifier from Constants.NAMING_FIELDS (e.g. project, asset_type_id)'
                                    fallback:
                                      type: string
                                      description: 'For REF: fallback when field value is null or empty'
                                    skip_if_empty:
                                      type: boolean
                                      description: 'For REF: when true, omit this segment (and collapse delimiters) if the resolved value is empty instead of using fallback. Mutually exclusive with fallback. Default false.'
                                    dedupe_parent_segments:
                                      type: boolean
                                      description: 'For REF parent_asset_id only: when true, enable ancestor segment de-duplication by dropping other REF segments whose values are already represented in the parent asset ID. Default false.'
                                    digits:
                                      type: integer
                                      format: int32
                                      description: 'For SEQ: number of digits for padding (e.g. 3 -> 001)'
                                    start_value:
                                      type: integer
                                      format: int64
                                      description: 'For SEQ: optional starting sequence number'
                                    char:
                                      type: string
                                      description: 'For DELIMITER: single character (e.g. "-", "_")'
                                  required:
                                  - order
                                  - type
                                maxItems: 2147483647
                                minItems: 1
                            required:
                            - expression_fields
                          - type: object
                            description: Rule definition for FIELD_DEFAULTS rules (actions-based)
                            properties:
                              actions:
                                type: array
                                description: Non-empty list of actions to apply. Must include exactly one SET_DEFAULT; SET_READ_ONLY is optional and appears at most once.
                                items:
                                  type: object
                                  description: A single action inside a field rule definition
                                  properties:
                                    type:
                                      type: string
                                      description: Action type (SET_DEFAULT, SET_READ_ONLY)
                                      enum:
                                      - SET_DEFAULT
                                      - SET_READ_ONLY
                                    value:
                                      type: object
                                      description: 'Action value. For SET_DEFAULT: matches the Asset custom_fields storage format (String/Number/Boolean for primitives, {id, name} for reference types). For SET_READ_ONLY: Boolean true/false.'
                                    data_type:
                                      type: string
                                      description: FieldType key (required for SET_DEFAULT; null for SET_READ_ONLY)
                                      enum:
                                      - boolean
                                      - cost_code
                                      - datetime
                                      - datetime/time
                                      - datetime/mm_yyyy
                                      - datetime/yyyy
                                      - decimal
                                      - decimal/currency
                                      - location
                                      - login_information
                                      - login_information/project_directory
                                      - login_informations
                                      - lov_entries
                                      - lov_entry
                                      - lov_entry/radio_button
                                      - lov_entry/with_code
                                      - prequal_file_uploads
                                      - prostore_files
                                      - rich_text
                                      - rich_text/read_only
                                      - string
                                      - string/phone_number
                                      - vendor
                                    message:
                                      type: string
                                      description: Optional message (reserved for future action types like SET_REQUIRED)
                                  required:
                                  - type
                                maxItems: 2147483647
                                minItems: 1
                            required:
                            - actions
                          - type: object
                            description: Rule definition for MANDATORY/WARNING rules (optional custom message)
                            properties:
                              message:
                                type: string
                                description: Optional custom validation message shown when the rule fires
                                maxLength: 512
                                minLength: 0
                        conditions:
                          description: Conditions AST for a conditional-validation rule
                          properties:
                            schema_version:
                              type: integer
                              format: int32
                              description: Version of the conditions schema
                            root:
                              type: object
                              description: Root node of the recursive conditions tree
                          required:
                          - root
                          - schema_version
                        rule_group_id:
                          type: string
                          description: Group id linking granular rules authored from one admin UI row. Null when ungrouped.
                        expression:
                          type: string
                          description: Derived expression string (e.g. 'default=Carrier, readOnly=true')
                        is_active:
                          type: boolean
                          description: Whether the rule is active and applied; false to deactivate without deleting
                        lov_fields:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  example: '12345'
                                label:
                                  type: string
                                code:
                                  type: string
                                active:
                                  type: boolean
                        validation_errors:
                          type: array
                          description: Validation issues detected on this rule. Null when the rule is valid; a non-empty list otherwise.
                          items:
                            type: object
                            description: Validation issue detected on a field rule at read time.
                            properties:
                              code:
                                type: string
                                description: Code identifying the class of issue.
                                enum:
                                - FIELDSET_NOT_FOUND
                                - FIELDSET_NOT_MAPPED
                                - FIELD_NOT_FOUND
                                - LOV_ENTRY_NOT_FOUND
                                - VENDOR_NOT_FOUND
                                - STATUS_NOT_FOUND
                                - STATUS_GROUP_MISMATCH
                                - CONDITIONAL_TARGET_FIELD_INELIGIBLE
                                - CONDITIONAL_TARGET_FIELD_ALWAYS_REQUIRED
                                - ASSET_TYPE_NOT_FOUND
                                - TRADE_NOT_FOUND
                                - ASSET_TYPE_HIDDEN_AT_PROJECT
                                - FIELDSET_VALIDATION_UNAVAILABLE
                                - REFERENCE_VALIDATION_UNAVAILABLE
                              severity:
                                type: string
                                description: Severity of the issue ("error" or "warning").
                              cause:
                                type: string
                                description: Description of what went wrong.
                              effect:
                                type: string
                                description: Description of the impact of this issue.
                              remedy:
                                type: string
                                description: Guidance on how an admin can resolve the issue.
                        overridden:
                          type: boolean
                          description: 'Project-scope overlay indicator. Populated only in the project-scoped list view: true when a project rule overrides the company configuration for this field (value and/or editability differs, or no company rule exists); false when the row is inherited from the company with no project override. Null in company-scoped responses.'
                        created_at:
                          type: string
                          format: date-time
                        modified_at:
                          type: string
                          format: date-time
                        created_by:
                          description: Contact Information
                          properties:
                            id:
                              type: string
                              description: User ID
                              example: '12345'
                            name:
                              type: string
                              description: User's full name
                              example: John Doe
                            email:
                              type: string
                              description: User's email address
                              example: user@example.com
                        modified_by:
                          description: Contact Information
                          properties:
                            id:
                              type: string
                              description: User ID
                              example: '12345'
                            name:
                              type: string
                              description: User's full name
                              example: John Doe
                            email:
                              type: string
                              description: User's email address
                              example: user@example.com
        '400':
          description: The server could not understand the request due to invalid syntax or parameters that fail to meet validation requirements.
        '401':
          description: Although the HTTP standard specifies "unauthorized", semantically this response means "unauthenticated". That is, the client must authenticate itself to get the requested response.
        '403':
          description: The client does not have access rights to the content; that is, it is authenticated, but the server is refusing to give the requested resource. Unlike 401, the client's identity is known to the server.
        '404':
          description: The server can not find the requested resource. This can mean either the URL is not recognized, or the resource itself does not exist. Servers may also send this response instead of 403 to hide the existence of a resource from an unauthorized client.
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'http://localhost:8080/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/field_rules',\n  qs: {\n    rule_type: 'SOME_STRING_VALUE',\n    rule_types: 'SOME_ARRAY_VALUE',\n    fieldset_id: 'SOME_STRING_VALUE'\n  },\n  headers: {\n    'Procore-Company-Id': 'SOME_INTEGER_VALUE',\n    'Accept-Language': 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: "import http.client\n\nconn = http.client.HTTPConnection(\"localhost:8080\")\n\nheaders = {\n    'Procore-Company-Id': \"SOME_INTEGER_VALUE\",\n    'Accept-Language': \"SOME_STRING_VALUE\"\n    }\n\nconn.request(\"GET\", \"/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/field_rules?rule_type=SOME_STRING_VALUE&rule_types=SOME_ARRAY_VALUE&fieldset_id=SOME_STRING_VALUE\", headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'http://localhost:8080/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/field_rules?rule_type=SOME_STRING_VALUE&rule_types=SOME_ARRAY_VALUE&fieldset_id=SOME_STRING_VALUE' \\\n  --header 'Accept-Language: SOME_STRING_VALUE' \\\n  --header 'Procore-Company-Id: SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"http://localhost:8080/rest/v2.0/companies/1234/assets/settings/asset_types/%7Basset_type_id%7D/field_rules?rule_type=SOME_STRING_VALUE&rule_types=SOME_ARRAY_VALUE&fieldset_id=SOME_STRING_VALUE\"),\n    Headers =\n    {\n        { \"Procore-Company-Id\", \"SOME_INTEGER_VALUE\" },\n        { \"Accept-Language\", \"SOME_STRING_VALUE\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
  /rest/v2.0/companies/{company_id}/assets/settings/field_rules/available_fields:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      tags:
      - field-rule-controller
      summary: List Available Fields Across Asset Types
      description: Returns the intersection of rule-eligible fields common to every supplied asset type, for the grouped conditional-rule builder of the given rule_type (MANDATORY or WARNING). Omit asset_type_id to target all asset types. Otherwise, supply asset types as repeated asset_type_id params and/or a single comma-separated value (e.g. asset_type_id=typeA,typeB). A blank/empty value means 'all asset types'.
      operationId: getAvailableFieldsForAssetTypes
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: rule_type
        in: query
        description: Rule type the fields are being authored for (MANDATORY or WARNING). Determines the field-eligibility semantics.
        required: true
        schema:
          type: string
          enum:
          - NAMING
          - FIELD_DEFAULTS
          - VALIDATION
          - CROSS_FIELD
          - MANDATORY
          - WARNING
      - name: asset_type_id
        in: query
        description: Optional asset type ids. Omit for all asset types; or repeat the param and/or pass a single comma-separated value (e.g. asset_type_id=typeA,typeB). A blank value also means 'all asset types'.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: A field eligible for FIELD_DEFAULTS rule configuration
                      properties:
                        name:
                          type: string
                          description: Field name (e.g. trade_id, custom_field_1234)
                        label:
                          type: string
                          description: Display label
                        data_type:
                          type: string
                          description: FieldType key (string, boolean, decimal, lov_entry, etc.)
                          enum:
                          - boolean
                          - cost_code
                          - datetime
                          - datetime/time
                          - datetime/mm_yyyy
                          - datetime/yyyy
                          - decimal
                          - decimal/currency
                          - location
                          - login_information
                          - login_information/project_directory
                          - login_informations
                          - lov_entries
                          - lov_entry
                          - lov_entry/radio_button
                          - lov_entry/with_code
                          - prequal_file_uploads
                          - prostore_files
                          - rich_text
                          - rich_text/read_only
                          - string
                          - string/phone_number
                          - vendor
                        variant:
                          type: string
                          description: Variant for the data type
                        fieldset_id:
                          type: string
                          description: 'Fieldset id: ''-1'' for Procore defaults, external id for custom fields'
                        required:
                          type: boolean
                          description: Whether this field is required in the fieldset
                        visible:
                          type: boolean
                          description: Whether this field is visible in the fieldset
                        list_of_values:
                          type: array
                          description: List of values for LOV fields; null for Procore default LOV fields (values come from AssetStatus / AssetTrade) and for non-LOV fields
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                format: int64
                              label:
                                type: string
                              code:
                                type: string
                              position:
                                type: integer
                                format: int32
                              active:
                                type: boolean
        '400':
          description: The server could not understand the request due to invalid syntax or parameters that fail to meet validation requirements.
        '401':
          description: Although the HTTP standard specifies "unauthorized", semantically this response means "unauthenticated". That is, the client must authenticate itself to get the requested response.
        '403':
          description: The client does not have access rights to the content; that is, it is authenticated, but the server is refusing to give the requested resource. Unlike 401, the client's identity is known to the server.
        '404':
          description: The server can not find the requested resource. This can mean either the URL is not recognized, or the resource itself does not exist. Servers may also send this response instead of 403 to hide the existence of a resource from an unauthorized client.
      x-doc:
