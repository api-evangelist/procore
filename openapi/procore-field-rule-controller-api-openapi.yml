    post:
      tags:
      - field-rule-controller
      summary: Bulk Create Field Rules
      description: Creates multiple field rules in a single request. Each item is validated independently; the response reports successes and failures per item.
      operationId: bulkCreateFieldRules
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Request to create a field rule (NAMING or FIELD_DEFAULTS)
                properties:
                  rule_type:
                    type: string
                    description: Rule type. Defaults to NAMING for backward compatibility.
                    enum:
                    - NAMING
                    - FIELD_DEFAULTS
                    - VALIDATION
                    - CROSS_FIELD
                    - MANDATORY
                    - WARNING
                  asset_type_id:
                    type: string
                    description: Asset type id (required for FIELD_DEFAULTS; null for NAMING).
                    maxLength: 26
                    minLength: 0
                  fieldset_id:
                    type: string
                    description: Fieldset id (required for FIELD_DEFAULTS). '-1' for Procore default fields; external configurable fieldset id for custom fields. Null for NAMING.
                    maxLength: 255
                    minLength: 0
                  trigger_field:
                    type: string
                    description: 'Trigger field. For NAMING: asset_code. For FIELD_DEFAULTS: the field this rule configures (e.g., custom_field_1234, trade_id).'
                    maxLength: 128
                    minLength: 0
                  rule_name:
                    type: string
                    description: 'Display name for the rule. Optional: when omitted or blank, the backend auto-generates a scope-indicative name of the form ''{rule_type}::{company_id}::{asset_type_id|NA}::{fieldset_id|NA}::{trigger_field}''.'
                    maxLength: 255
                    minLength: 0
                  description:
                    type: string
                    description: Optional description
                    maxLength: 512
                    minLength: 0
                  is_active:
                    type: boolean
                    description: Whether the rule is created active. Absent/null defaults to active. Set false to create an inactive rule directly (e.g. a draft); for MANDATORY/WARNING rules an inactive rule skips conflict validation because inactive rules never conflict.
                  rule_group_id:
                    type: string
                    description: Groups granular rules created from a single admin UI row (MANDATORY/WARNING). Normally set by the grouped create API; optional and null for standalone/legacy clients.
                    maxLength: 26
                    minLength: 0
                  conditions:
                    description: Conditions AST for a conditional-validation rule
                    properties:
                      schema_version:
                        type: integer
                        format: int32
                        description: Version of the conditions schema
                      root:
                        type: object
                        description: Root node of the recursive conditions tree
                    required:
                    - root
                    - schema_version
                  definition:
                    description: 'Structured rule definition. Shape depends on ruleType: FieldRuleDefinitionDTO for NAMING, FieldDefaultsDefinitionDTO for FIELD_DEFAULTS, ConditionalValidationDefinitionDTO for MANDATORY/WARNING.'
                    oneOf:
                    - type: object
                      description: Rule definition containing expression segments
                      properties:
                        expression_fields:
                          type: array
                          description: Ordered list of expression segments
                          items:
                            type: object
                            description: Expression segment for naming rule
                            properties:
                              type:
                                type: string
                                enum:
                                - LITERAL
                                - REF
                                - DELIMITER
                                - SEQ
                              order:
                                type: integer
                                format: int32
                                description: Display order of the segment
                                minimum: 1
                              value:
                                type: string
                                description: 'For LITERAL: static text value'
                              field:
                                type: string
                                description: 'For REF: field identifier from Constants.NAMING_FIELDS (e.g. project, asset_type_id)'
                              fallback:
                                type: string
                                description: 'For REF: fallback when field value is null or empty'
                              skip_if_empty:
                                type: boolean
                                description: 'For REF: when true, omit this segment (and collapse delimiters) if the resolved value is empty instead of using fallback. Mutually exclusive with fallback. Default false.'
                              dedupe_parent_segments:
                                type: boolean
                                description: 'For REF parent_asset_id only: when true, enable ancestor segment de-duplication by dropping other REF segments whose values are already represented in the parent asset ID. Default false.'
                              digits:
                                type: integer
                                format: int32
                                description: 'For SEQ: number of digits for padding (e.g. 3 -> 001)'
                              start_value:
                                type: integer
                                format: int64
                                description: 'For SEQ: optional starting sequence number'
                              char:
                                type: string
                                description: 'For DELIMITER: single character (e.g. "-", "_")'
                            required:
                            - order
                            - type
                          maxItems: 2147483647
                          minItems: 1
                      required:
                      - expression_fields
                    - type: object
                      description: Rule definition for FIELD_DEFAULTS rules (actions-based)
                      properties:
                        actions:
                          type: array
                          description: Non-empty list of actions to apply. Must include exactly one SET_DEFAULT; SET_READ_ONLY is optional and appears at most once.
                          items:
                            type: object
                            description: A single action inside a field rule definition
                            properties:
                              type:
                                type: string
                                description: Action type (SET_DEFAULT, SET_READ_ONLY)
                                enum:
                                - SET_DEFAULT
                                - SET_READ_ONLY
                              value:
                                type: object
                                description: 'Action value. For SET_DEFAULT: matches the Asset custom_fields storage format (String/Number/Boolean for primitives, {id, name} for reference types). For SET_READ_ONLY: Boolean true/false.'
                              data_type:
                                type: string
                                description: FieldType key (required for SET_DEFAULT; null for SET_READ_ONLY)
                                enum:
                                - boolean
                                - cost_code
                                - datetime
                                - datetime/time
                                - datetime/mm_yyyy
                                - datetime/yyyy
                                - decimal
                                - decimal/currency
                                - location
                                - login_information
                                - login_information/project_directory
                                - login_informations
                                - lov_entries
                                - lov_entry
                                - lov_entry/radio_button
                                - lov_entry/with_code
                                - prequal_file_uploads
                                - prostore_files
                                - rich_text
                                - rich_text/read_only
                                - string
                                - string/phone_number
                                - vendor
                              message:
                                type: string
                                description: Optional message (reserved for future action types like SET_REQUIRED)
                            required:
                            - type
                          maxItems: 2147483647
                          minItems: 1
                      required:
                      - actions
                    - type: object
                      description: Rule definition for MANDATORY/WARNING rules (optional custom message)
                      properties:
                        message:
                          type: string
                          description: Optional custom validation message shown when the rule fires
                          maxLength: 512
                          minLength: 0
                required:
                - definition
                - trigger_field
        required: true
