      operationId: createFieldRuleForProject
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: project_id
        in: path
        description: Unique identifier for the project.
        required: true
        schema:
          type: string
        example: '1234'
