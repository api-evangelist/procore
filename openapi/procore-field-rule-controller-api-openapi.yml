          application/json:
            schema:
              type: object
              description: Request to create a field rule (NAMING or FIELD_DEFAULTS)
              properties:
                rule_type:
                  type: string
                  description: Rule type. Defaults to NAMING for backward compatibility.
                  enum:
                  - NAMING
                  - FIELD_DEFAULTS
                  - VALIDATION
                  - CROSS_FIELD
                  - MANDATORY
                  - WARNING
                asset_type_id:
                  type: string
                  description: Asset type id (required for FIELD_DEFAULTS; null for NAMING).
                  maxLength: 26
                  minLength: 0
                fieldset_id:
                  type: string
                  description: Fieldset id (required for FIELD_DEFAULTS). '-1' for Procore default fields; external configurable fieldset id for custom fields. Null for NAMING.
                  maxLength: 255
                  minLength: 0
                trigger_field:
                  type: string
                  description: 'Trigger field. For NAMING: asset_code. For FIELD_DEFAULTS: the field this rule configures (e.g., custom_field_1234, trade_id).'
                  maxLength: 128
                  minLength: 0
                rule_name:
                  type: string
                  description: 'Display name for the rule. Optional: when omitted or blank, the backend auto-generates a scope-indicative name of the form ''{rule_type}::{company_id}::{asset_type_id|NA}::{fieldset_id|NA}::{trigger_field}''.'
                  maxLength: 255
                  minLength: 0
                description:
                  type: string
                  description: Optional description
                  maxLength: 512
                  minLength: 0
                is_active:
                  type: boolean
                  description: Whether the rule is created active. Absent/null defaults to active. Set false to create an inactive rule directly (e.g. a draft); for MANDATORY/WARNING rules an inactive rule skips conflict validation because inactive rules never conflict.
                rule_group_id:
                  type: string
                  description: Groups granular rules created from a single admin UI row (MANDATORY/WARNING). Normally set by the grouped create API; optional and null for standalone/legacy clients.
                  maxLength: 26
                  minLength: 0
                conditions:
                  description: Conditions AST for a conditional-validation rule
                  properties:
                    schema_version:
                      type: integer
                      format: int32
                      description: Version of the conditions schema
                    root:
                      type: object
                      description: Root node of the recursive conditions tree
                  required:
                  - root
                  - schema_version
                definition:
                  description: 'Structured rule definition. Shape depends on ruleType: FieldRuleDefinitionDTO for NAMING, FieldDefaultsDefinitionDTO for FIELD_DEFAULTS, ConditionalValidationDefinitionDTO for MANDATORY/WARNING.'
                  oneOf:
                  - type: object
                    description: Rule definition containing expression segments
                    properties:
                      expression_fields:
                        type: array
                        description: Ordered list of expression segments
                        items:
                          type: object
                          description: Expression segment for naming rule
                          properties:
                            type:
                              type: string
                              enum:
                              - LITERAL
                              - REF
                              - DELIMITER
                              - SEQ
                            order:
                              type: integer
                              format: int32
                              description: Display order of the segment
                              minimum: 1
                            value:
                              type: string
                              description: 'For LITERAL: static text value'
                            field:
                              type: string
                              description: 'For REF: field identifier from Constants.NAMING_FIELDS (e.g. project, asset_type_id)'
                            fallback:
                              type: string
                              description: 'For REF: fallback when field value is null or empty'
                            skip_if_empty:
                              type: boolean
                              description: 'For REF: when true, omit this segment (and collapse delimiters) if the resolved value is empty instead of using fallback. Mutually exclusive with fallback. Default false.'
                            dedupe_parent_segments:
                              type: boolean
                              description: 'For REF parent_asset_id only: when true, enable ancestor segment de-duplication by dropping other REF segments whose values are already represented in the parent asset ID. Default false.'
                            digits:
                              type: integer
                              format: int32
                              description: 'For SEQ: number of digits for padding (e.g. 3 -> 001)'
                            start_value:
                              type: integer
                              format: int64
                              description: 'For SEQ: optional starting sequence number'
                            char:
                              type: string
