  /rest/v2.0/companies/{company_id}/projects/{project_id}/assets/settings/field_rules:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    put:
      tags:
      - field-rule-controller
      summary: Bulk Update Field Rules (Project Scope)
      description: Updates multiple project-scoped field rules in a single request. Each item carries its own rule_id, must belong to the given project, and is validated independently; the response reports successes and failures per item.
      operationId: bulkUpdateFieldRulesForProject
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: project_id
        in: path
        description: Unique identifier for the project.
        required: true
        schema:
          type: string
        example: '1234'
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Single item in a bulk field rule update request. Contains the rule ID plus the fields to update.
                properties:
                  rule_id:
                    type: string
                    description: ID of the field rule to update
                    minLength: 1
                  rule_type:
                    type: string
                    description: 'Optional metadata. NOT updatable: if provided, must match the existing rule''s type; the server rejects mismatches.'
                    enum:
                    - NAMING
                    - FIELD_DEFAULTS
                    - VALIDATION
                    - CROSS_FIELD
                    - MANDATORY
                    - WARNING
                  fieldset_id:
                    type: string
                    description: New fieldset id (FIELD_DEFAULTS only)
                    maxLength: 255
                    minLength: 0
                  rule_name:
                    type: string
                    description: Display name for the rule
                    maxLength: 255
                    minLength: 0
                  description:
                    type: string
                    description: Optional description
                    maxLength: 512
                    minLength: 0
                  definition:
                    type: object
                    description: Rule definition; shape must match the rule's stored type
                  is_active:
                    type: boolean
                    description: Whether the rule is active
                required:
                - rule_id
        required: true
      responses:
        '200':
          description: All rules updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Response for bulk field rule create or update operations
                    properties:
                      succeeded:
                        type: array
                        description: Rules that were successfully created or updated
                        items:
                          type: object
                          description: Field rule response (NAMING or FIELD_DEFAULTS)
                          properties:
                            id:
                              type: string
                              description: Unique identifier of the field rule
                            company_id:
                              type: integer
                              format: int64
                              description: Company this rule belongs to
                            project_id:
                              type: integer
                              format: int64
                              description: Project this rule applies to; null for company-level rules
                            asset_type_id:
                              type: string
                              description: Asset type this rule applies to. Populated for FIELD_DEFAULTS; null for NAMING.
                            fieldset_id:
                              type: string
                              description: Fieldset scope. '-1' for Procore default fields, external configurable fieldset id for custom fields. Null for NAMING.
                            rule_type:
                              type: string
                              description: Kind of rule
                              enum:
                              - NAMING
                              - FIELD_DEFAULTS
                              - VALIDATION
                              - CROSS_FIELD
                              - MANDATORY
                              - WARNING
                            trigger_field:
                              type: string
                              description: Field that triggers this rule (e.g. asset_code for NAMING, custom_field_1234 for FIELD_DEFAULTS)
                            rule_name:
                              type: string
                              description: Name of the rule
                            description:
                              type: string
                              description: Optional description of the rule
                            definition:
                              description: 'Structured rule definition. Shape depends on ruleType: FieldRuleDefinitionDTO for NAMING, FieldDefaultsDefinitionDTO for FIELD_DEFAULTS, ConditionalValidationDefinitionDTO for MANDATORY/WARNING.'
                              oneOf:
                              - type: object
                                description: Rule definition containing expression segments
                                properties:
                                  expression_fields:
                                    type: array
                                    description: Ordered list of expression segments
                                    items:
                                      type: object
                                      description: Expression segment for naming rule
                                      properties:
                                        type:
                                          type: string
                                          enum:
                                          - LITERAL
                                          - REF
                                          - DELIMITER
                                          - SEQ
                                        order:
                                          type: integer
                                          format: int32
                                          description: Display order of the segment
                                          minimum: 1
                                        value:
                                          type: string
                                          description: 'For LITERAL: static text value'
                                        field:
                                          type: string
                                          description: 'For REF: field identifier from Constants.NAMING_FIELDS (e.g. project, asset_type_id)'
                                        fallback:
                                          type: string
                                          description: 'For REF: fallback when field value is null or empty'
