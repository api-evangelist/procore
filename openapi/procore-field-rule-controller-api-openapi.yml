                        items:
                          type: object
                          description: A single action inside a field rule definition
                          properties:
                            type:
                              type: string
                              description: Action type (SET_DEFAULT, SET_READ_ONLY)
                              enum:
                              - SET_DEFAULT
                              - SET_READ_ONLY
                            value:
                              type: object
                              description: 'Action value. For SET_DEFAULT: matches the Asset custom_fields storage format (String/Number/Boolean for primitives, {id, name} for reference types). For SET_READ_ONLY: Boolean true/false.'
                            data_type:
