            schema:
              description: Update a grouped conditional-validation rule (reconciles granular rows)
              properties:
                rule_type:
                  type: string
                  description: Rule type; when provided must match the existing group's type (type is immutable)
                  enum:
                  - NAMING
                  - FIELD_DEFAULTS
                  - VALIDATION
                  - CROSS_FIELD
                  - MANDATORY
                  - WARNING
                asset_type_ids:
                  type: array
                  description: Desired asset type ids; a single null entry means 'all asset types'. Maximum 100 entries.
                  items:
                    type: string
                    description: Desired asset type ids; a single null entry means 'all asset types'. Maximum 100 entries.
                  maxItems: 100
                  minItems: 0
                trigger_fields:
                  type: array
                  description: Desired trigger fields. Maximum 100 entries.
                  items:
                    type: string
                    description: Desired trigger fields. Maximum 100 entries.
                  maxItems: 100
                  minItems: 0
                conditions:
                  description: Conditions AST for a conditional-validation rule
                  properties:
                    schema_version:
                      type: integer
                      format: int32
                      description: Version of the conditions schema
                    root:
                      type: object
                      description: Root node of the recursive conditions tree
                  required:
                  - root
                  - schema_version
                is_active:
                  type: boolean
                  description: Whether the group's rules are active
                message:
                  type: string
                  description: Optional custom message shown when the rule fires; also used as the rule description
                  maxLength: 512
                  minLength: 0
              required:
              - asset_type_ids
              - trigger_fields
        required: true
