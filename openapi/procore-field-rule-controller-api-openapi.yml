        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Request to update a field rule (definition + metadata)
              properties:
                rule_type:
                  type: string
                  description: 'Optional metadata. NOT updatable: if provided, must match the existing rule''s type; the server rejects mismatches.'
                  enum:
                  - NAMING
                  - FIELD_DEFAULTS
                  - VALIDATION
                  - CROSS_FIELD
                  - MANDATORY
                  - WARNING
                fieldset_id:
                  type: string
                  description: New fieldset id. FIELD_DEFAULTS only; ignored / rejected for NAMING. Provided to recover a rule whose asset type's fieldset has been changed by an admin. Must match the asset type's current fieldset and must contain the rule's trigger_field.
                  maxLength: 255
                  minLength: 0
                rule_name:
                  type: string
                  description: Display name for the rule
                  maxLength: 255
                  minLength: 0
                description:
                  type: string
                  description: Optional description
                  maxLength: 512
                  minLength: 0
                definition:
                  type: object
                  description: Rule definition. Shape must match the rule's stored type — for NAMING, supply expression_fields; for FIELD_DEFAULTS, supply actions. Sent as a raw JSON object; the server converts it to the correct subtype and runs explicit validation. Omit entirely to update only metadata (e.g. is_active toggles).
                is_active:
                  type: boolean
                  description: Whether the rule is active. Set to false to deactivate.
                conditions:
                  description: Conditions AST for a conditional-validation rule
                  properties:
                    schema_version:
                      type: integer
                      format: int32
                      description: Version of the conditions schema
                    root:
                      type: object
                      description: Root node of the recursive conditions tree
                  required:
                  - root
                  - schema_version
