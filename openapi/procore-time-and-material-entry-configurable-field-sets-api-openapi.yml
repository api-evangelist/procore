paths:
  /rest/v1.0/projects/{project_id}/time_and_material_entries/configurable_field_sets:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List all Time And Material Entry Configurable Field Sets
      description: Return a list of all Time And Material Entry Configurable Field Sets associated with the specified project
      tags:
      - Time and Material Entry Configurable Field Sets
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Time And Material Entry Configurable Field Sets
                items:
                  type: object
                  title: Configurable Field Set
                  properties:
                    id:
                      type:
                      - integer
                      - 'null'
                      description: The unique identifier of the configurable field set.
                      example: 999
                    name:
                      type:
                      - string
                      - 'null'
                      description: The name of the configurable field set.
                      example: Observation Fields
                    type:
                      type: string
                      description: The type of configurable field set
                      example: ConfigurableFieldSet::Observations::Item
                    category:
                      type: string
                      description: Specifies the category for the configurable field set if it exists or an empty string. This property was added for the ConfigurableFieldSet::Observations::Item class.
                      example: commissioning
                    class_name:
                      type: string
                      description: Specifies the class the configurable field set is associated with.
                      example: Observations::Item
                    fields:
                      type: object
                      additionalProperties: true
                      description: Specifies the hash of fields on an object. This is for example purposes only.
                      properties:
                        field_1:
                          type: object
                          description: The first Observation Field object.
                          properties:
                            name:
                              type: string
                              description: The name of the field.
                              example: field_1
                            visible:
                              type: boolean
                              description: If this property is set to true, the field is visible. If this property is set to false, the field is not visible.
                              example: true
                            required:
                              type: boolean
                              description: If this property is set to true, the field is required, if the property is set to false, the field is not required.
                              example: true
                        custom_field_1:
                          type: object
                          description: Custom Field object for an existing custom field in this configurable field set object.
                          properties:
                            id:
                              type: integer
                              description: The metadatum identifier of the custom field.
                              example: 999
                            name:
                              type: string
                              description: The name of the custom field.
                              example: custom_field_1
                            label:
                              type: string
                              description: The label of the custom field definition.
                              example: Worked hours
                            description:
                              type: string
                              description: The description of the custom field definition.
                              example: description
                            custom_field_definition_id:
                              type: integer
                              description: The definition identifier of the custom field.
                              example: 999
                            data_type:
                              type: string
                              description: Data type of the custom field.
                              enum:
                              - string
                              - number
                              - boolean
                              - lov_entry
                              - lov_entries
                            variant:
                              type: string
                              description: The variant type of the custom field.
                              enum:
                              - currency
                            position:
                              type: integer
                              description: The display position of the custom field, which is sorted ascending, lowest position is visually the top left of the page on a grid basis (used in conjunction with column_width property to calculate row and column properties).
                              example: 999
                            required:
                              type: boolean
                              description: If this property is set to true, the custom field is required. If this property is set to false, the custom field is not required.
                              example: true
                            visible:
                              type: boolean
                              description: If this property is set to true, the custom field is visible. If this property is set to false, the custom field is not visible.
                              example: true
                            row:
                              type: number
                              description: The number of the row where the custom field is positioned on the form.
                              example: 1
                            column:
                              type: number
                              description: The number of the column where the custom field is positioned on the form.
                              example: 1
                            column_width:
                              type: number
                              description: The number of columns the custom field spans on the form.
                              example: 3
                    sections:
                      type: array
                      description: An array of sections that are used for custom fields.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: The unique identifier of the section.
                            example: 1
                          name:
                            type: string
                            description: The name of the section.
                            example: Section 1
                          description:
                            type: string
                            description: The description of the section.
                            example: Project ABC
                          position:
                            type: integer
                            description: The display position of the section, which is sorted ascending, lowest position is visually the top of the page.
                            example: 999
                          from_v1_custom_fields:
                            type: boolean
                            description: If field was migrated from a v1 custom field.
                            example: false
                    inspection_type_id:
                      type:
                      - integer
                      - 'null'
                      description: The unique identifier of the inspection type.
                      example: 1
                    incident_type_id:
                      type:
                      - integer
                      - 'null'
                      description: The unique identifier of the incident type.
                      example: 1
                    generic_tool_id:
                      type:
                      - integer
                      - 'null'
                      description: The unique idenfitier of the generic tool.
                      example: 1
                    action_plan_type_id:
                      type:
                      - integer
                      - 'null'
                      description: The unique idenfitier of the action plan type.
                      example: 1
                    observations_category_id:
                      type:
                      - integer
                      - 'null'
                      description: The unique idenfitier of the observations category.
                      example: 1
                    updated_at:
                      type: string
                      format: date-time
                      description: The time when the field set was last updated.
                      example: '2025-08-20T12:34:56Z'
                    updated_by:
                      type:
                      - object
                      - 'null'
                      description: The user who last updated the field set.
                      properties:
                        id:
                          type: integer
                          description: The unique identifier of the user who last updated the field set.
                          example: 999
                        email:
                          type: string
                          description: The email address of the user who last updated the field set.
                          example: user@example.com
                        name:
                          type: string
                          description: The name of the user who last updated the field set.
                          example: John Doe
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
