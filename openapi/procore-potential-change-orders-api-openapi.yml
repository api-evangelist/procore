openapi: 3.2.0
info:
  title: Procore REST Potential Change Orders API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Potential Change Orders
paths:
  /rest/v1.0/potential_change_orders/sync:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Sync Potential Change Orders
      description: 'This endpoint creates or updates a batch of Potential Change Orders (PCO).

        See Using Sync Actions for additional information.'
      tags:
      - Potential Change Orders
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: contract_id
        in: query
        description: ID of the contract (prime or commitment) whose potential change orders this request targets.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: Potential Change Order Body
              type: object
              required:
              - updates
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      change_order_request_id:
                        type: integer
                        description: ID of the Change Order Request (COR) this PCO belongs to. Used on multi-tier contract configurations to group the PCO under a request.
                        example: 56490
                      change_order_request:
                        type: object
                        properties:
                          change_order_package_id:
                            type: integer
                            description: ID of the Change Order Package the PCO's Change Order Request is assigned to. Applies to two-tier contract configurations.
                            example: 875689
                      commitment_change_event_id:
                        type: integer
                        description: ID of the commitment Change Event this PCO was generated from. Set when the contract is a commitment.
                        example: 135314
                      description:
                        type: string
                        description: Free-text description of the scope of this change order.
                        example: Freezer slab replacement
                      due_date:
                        type: string
                        format: date-time
                        description: Date by which the change order is due, in ISO 8601 format.
                        example: '2017-08-19T21:39:40Z'
                      invoiced_date:
                        type: string
                        format: date
                        description: Date the change order was invoiced (YYYY-MM-DD).
                        example: '2017-08-19'
                      number:
                        type: string
                        description: Human-readable change order number, unique within the contract.
                        example: C34
                      origin_data:
                        type: string
                        description: Free-form metadata from an external system, stored to correlate this PCO with its source record.
                        example: OD-2398273424
                      origin_id:
                        type: string
                        description: Identifier of this PCO in the external system it was imported from. Use to match records during integrations.
                        example: '459247544'
                      paid_date:
                        type: string
                        format: date
                        description: Date the change order was paid (YYYY-MM-DD).
                        example: '2017-08-18'
                      prime_change_event_id:
                        type: integer
                        description: ID of the prime contract Change Event this PCO was generated from. Set when the contract is a prime contract.
                        example: 135314
                      schedule_impact_amount:
                        type: integer
                        description: Estimated impact of this change order on the project schedule, in days.
                        example: 2
                      status:
                        type: string
                        description: Workflow status of the change order. Ignored on projects where the tool is configured for single-tier change orders.
                        example: draft
                        enum:
                        - draft
                        - not_pricing
                        - pricing
                        - pending
                        - revised
                        - proceeding
                        - not_proceeding
                        - no_charge
                        - approved
                        - rejected
                        - void
                      title:
                        type: string
                        description: Short title summarizing the change order.
                        example: Concrete freezer slab
                      currency_exchange_rate:
                        type: string
                        description: Exchange rate used to convert from the change order's currency to the project's currency. Accepted only on projects where multicurrency conversion is available.
                        example: '20.0'
        required: true
      responses:
        '200':
          description: Array of Potential Change Orders
          content:
            application/json:
              schema:
                title: arrayOfPotentialChangeOrders
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for this Potential Change Order. Use as the {id} path parameter to retrieve, update, or delete it.
                          example: 2843048
                        accounting_method:
                          type: string
                          description: 'How the change order is priced: "amount" for a lump-sum total or "unit" for quantity-times-unit-cost line items.'
                          example: unit
                          enum:
                          - amount
                          - unit
                        change_order_change_reason_id:
                          type: integer
                          description: ID of the change reason assigned to this PCO, if change reasons are enabled for the project.
                          example: 847264
                        change_order_request_id:
                          type: integer
                          description: ID of the Change Order Request (COR) this PCO belongs to, on multi-tier contract configurations.
                          example: 283764
                        commitment_change_event_id:
                          type: integer
                          description: ID of the commitment Change Event this PCO was generated from. Set when the contract is a commitment.
                          example: 135314
                        contract_id:
                          type: integer
                          description: ID of the contract (prime or commitment) this PCO belongs to.
                          example: 304485
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the PCO was created, in ISO 8601 format.
                          example: '2017-08-14T21:39:40Z'
                        creator:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 160586
                            login:
                              type: string
                              description: Email
                              example: carl.contractor@example.com
                            name:
                              type: string
                              description: Name
                              example: Carl Contractor
                        deleted_at:
                          type: string
                          format: date-time
                          description: Timestamp when the PCO was soft-deleted, in ISO 8601 format. Null for active PCOs.
                          example: '2017-11-10T21:39:40Z'
                        description:
                          type: string
                          description: Free-text description of the scope of this change order.
                          example: Freezer slab replacement
                        designated_reviewer:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 160586
                            login:
                              type: string
                              description: Email
                              example: carl.contractor@example.com
                            name:
                              type: string
                              description: Name
                              example: Carl Contractor
                        due_date:
                          type: string
                          format: date-time
                          description: Date by which the change order is due, in ISO 8601 format.
                          example: '2017-08-19T21:39:40Z'
                        field_change:
                          type: boolean
                          description: True when this change order originated as a field change (a change identified in the field rather than through the office workflow).
                          example: true
                        grand_total:
                          type: string
                          format: float
                          description: Total value of the change order including markup, as a decimal string.
                          example: '37593.0'
                        invoiced_date:
                          type: string
                          format: date
                          description: Date the change order was invoiced (YYYY-MM-DD).
                          example: '2017-08-18'
                        attachments:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                                description: Use :name, :filename to be deprecated
                              url:
                                type: string
                              filename:
                                type: string
                                description: :filename to be deprecated, use :name
                        line_items:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Unique identifier for this change order line item.
                                example: 238473
                              position:
                                type: integer
                                description: Ordering position of this line item within the change order.
                                example: 3
                              description:
                                type: string
                                description: Free-text description of the work or item this line covers.
                                example: Concrete slab
                              quantity:
                                type: number
                                format: float
                                description: Number of units for this line item, in the given unit of measure.
                                example: 2000
                              uom:
                                type: string
                                description: Unit of measure for the quantity (a unit from the company's Units of Measure list).
                                example: lbs
                              total_amount:
                                type: string
                                format: float
                                description: Total amount for this line item, as a decimal string.
                                example: '100.0'
                              extended_amount:
                                type: string
                                format: float
                                description: Line item amount after applied markup, as a decimal string.
                                example: '900.0'
                              cost_code_id:
                                type: integer
                                description: ID of the Cost Code this line item is charged against.
                                example: 383762
                              tax_code_id:
                                type: integer
                                description: ID of the Tax Code applied to this line item, if any.
                                example: 1
                              unit_cost:
                                type: number
                                format: float
                                description: Cost per unit, as a decimal. Multiplied by quantity to compute the line item amount.
                                example: 0.05
                              cost_code:
                                oneOf:
                                - title: compact
                                  type: object
                                  properties:
                                    id:
                                      description: ID
                                      example: 12345
                                      type:
                                      - integer
                                      - 'null'
                                    full_code:
                                      type: string
                                      description: Full Cost code, including parent prefixes
                                      example: 02-300
                                    name:
                                      type: string
                                      description: Name
                                      example: Earthwork
                                - type: object
                                  title: extended
                                  properties:
                                    id:
                                      type: integer
                                      description: Unique identifier for this Cost Code record.
                                      example: 12345
                                    biller:
                                      type: string
                                      description: Display name of the entity (project or sub job) that owns this cost code.
                                      example: Campus
                                    biller_id:
                                      type: integer
                                      description: Procore ID of the owning project or sub job. Use with biller_type to identify the owning entity.
                                      example: 12345
                                    biller_type:
                                      type: string
                                      enum:
                                      - Project
                                      - SubJob
                                      description: 'Type of entity that owns this cost code. One of: ''Project'' (a standard project) or ''SubJob'' (a sub job within the project).'
                                      example: Project
                                    biller_origin_id:
                                      type:
                                      - string
                                      - 'null'
                                      description: ERP origin ID of the owning project or sub job. Null when no ERP origin has been set.
                                      example: '98765'
                                    budgeted:
                                      type: boolean
                                      description: Whether this cost code has been marked as budgeted. True when at least one budget line item exists for this cost code.
                                      example: false
                                    code:
                                      type: string
                                      description: Cost code segment, not including the parent prefix. For example, for full code "02-300", this field is "300".
                                      example: '300'
                                    created_at:
                                      type: string
                                      format: date-time
                                      description: Timestamp when this cost code was created, in ISO 8601 format.
                                      example: '2015-05-15T00:00:00Z'
                                    deleted_at:
                                      type: string
                                      format: date-time
                                      description: Timestamp when this cost code was soft-deleted, in ISO 8601 format. Null when the record is active.
                                      example: '2017-07-29T21:39:40Z'
                                    full_code:
                                      type: string
                                      description: Full cost code including all parent prefixes (e.g. "02-300").
                                      example: 02-300
                                    name:
                                      type: string
                                      description: Display name of the cost code.
                                      example: Earthwork
                                    origin_data:
                                      type: string
                                      description: Free-form third-party metadata string from the ERP system. Null when no ERP origin data has been set.
                                      example: OD-129947
                                    origin_id:
                                      type: string
                                      description: ERP system identifier for this cost code. Used by sync operations to match records across systems.
                                      example: '9874484'
                                    parent:
                                      type: object
                                      description: The immediate parent cost code of this record, if any.
                                      properties:
                                        id:
                                          type: integer
                                          description: Procore ID of this cost code's parent cost code. Null for root-level cost codes.
                                          example: 2345
                                    position:
                                      type: integer
                                      description: Sort order of this cost code within its parent.
                                      example: 1
                                    sortable_code:
                                      type: string
                                      description: Deprecated alias for full_code. Use full_code instead. Included for backwards compatibility.
                                      example: 02-300
                                    standard_cost_code_id:
                                      type: integer
                                      description: ID of the company-level standard cost code that this project cost code was created from. Null when not derived from a standard list.
                                      example: 122334
                                    standard_cost_code_list_id:
                                      type:
                                      - integer
                                      - 'null'
                                      description: ID of the company-level standard cost code list associated with this cost code via its standard cost code. Null when not linked to a standard list. Only present in the extended view.
                                      example: 133445
                                    updated_at:
                                      type: string
                                      format: date-time
                                      description: Timestamp when this cost code was last updated, in ISO 8601 format.
                                      example: '2015-05-15T00:00:00Z'
                                    line_item_types:
                                      type: array
                                      description: Array of line item types (cost types) assigned to this cost code. Each entry represents one Cost Code / Line Item Type assignment.
                                      items:
                                        type: object
                                        title: LineItemType
                                        description: A line item type assigned to this cost code.
                                        properties:
                                          id:
                                            type: integer
                                            description: Unique identifier for the Line Item Type.
                                            example: 12345
                                          name:
                                            type: string
                                            description: Display name of the Line Item Type.
                                            example: Equipment
                                          code:
                                            type: string
                                            description: Short code used for CSV import of this Line Item Type.
                                            example: LB
                                          base_type:
                                            type: string
                                            enum:
                                            - equipment
                                            - materials
                                            - commitment
                                            - owner_cost
                                            - professional_services
                                            - labor
                                            - other
                                            description: 'Canonical cost category for this line item type. One of: ''equipment'', ''materials'', ''commitment'', ''owner_cost'', ''professional_services'', ''labor'', ''other''.'
                                            example: materials
                                          origin_id:
                                            type:
                                            - string
                                            - 'null'
                                            description: ERP system identifier for this line item type. Null when not linked to an ERP system.
                                            example: ABC123
                              line_item_type:
                                type: object
                                title: LineItemType
                                description: Line Item Type
                                properties:
                                  id:
                                    type: integer
                                    description: Unique identifier for the Line Item Type
                                    example: 12345
                                  name:
                                    type: string
                                    description: Name for the Line Item Type
                                    example: Equipment
                                  code:
                                    type: string
                                    description: Code for the Line Item Type
                                    example: LB
                                  base_type:
                                    type: string
                                    enum:
                                    - equipment
                                    - materials
                                    - commitment
                                    - owner_cost
                                    - professional_services
                                    - other
                                    description: Base type
                                    example: materials
                                  origin_data:
                                    type: string
                                    description: Origin data
                                    example: OD-2398273424
                                  origin_id:
                                    type:
                                    - string
                                    - 'null'
                                    description: Origin ID
                                    example: ABC123
                              markup_line_items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      description: Markup Line Item ID
                                      example: 352362
                                    amount:
                                      type: string
                                      description: Markup Line Item amount
                                    created_at:
                                      type: string
                                      format: date-time
                                      description: Created at
                                      example: '2017-08-14T21:39:40Z'
                                    updated_at:
                                      type: string
                                      format: date-time
                                      description: Updated at
                                      example: '2017-08-14T21:39:40Z'
                                    markup:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: Markup ID
                                          example: 462136
                                        position:
                                          type: integer
                                          description: Position
                                          example: 1
                                        markup_set:
                                          type: string
                                          description: Markup set
                                          example: horizontal
                                        name:
                                          type: string
                                          description: name
                                          example: Foo
                                        percentage:
                                          type: string
                                          description: Percentage
                                          example: 10
                                        compounds_markups_above:
                                          type: boolean
                                          description: Compounds markups above?
                                          example: false
                                        created_at:
                                          type: string
                                          format: date-time
                                          description: Created at
                                          example: '2017-08-14T21:39:40Z'
                                        updated_at:
                                          type: string
                                          format: date-time
                                          description: Updated at
                                          example: '2017-08-14T21:39:40Z'
                                        destination_cost_code:
                                          type: object
                                          properties:
                                            id:
                                              type:
                                              - integer
                                              - 'null'
                                              description: ID
                                              example: 12345
                                            full_code:
                                              type: string
                                              description: Full Cost code, including parent prefixes
                                              example: 02-300
                                            name:
                                              type: string
                                              description: Name
                                              example: Earthwork
                                        destination_line_item_type:
                                          type: object
                                          title: LineItemType
                                          description: Line Item Type
                                          properties:
                                            id:
                                              type: integer
                                              description: Unique identifier for the Line Item Type
                                              example: 12345
                                            name:
                                              type: string
                                              description: Name for the Line Item Type
                                              example: Equipment
                                            code:
                                              type: string
                                              description: Code for the Line Item Type
                                              example: LB
                                            base_type:
                                              type: string
                                              enum:
                                              - equipment
                                              - materials
                                              - commitment
                                              - owner_cost
                                              - professional_services
                                              - other
                                              description: Base type
                                              example: materials
                                            origin_data:
                                              type: string
                                              description: Origin data
                                              example: OD-2398273424
                                            origin_id:
                                              type:
                                              - string
                                              - 'null'
                                              description: Origin ID
                                              example: ABC123
                                        desitination_budget_line_item_id:
                                          type: integer
                                          description: Destination Budget Line Item ID
                                          example: 362262
                                        destination_sub_job:
                                          allOf:
                                          - type: object
                                            properties:
                                              origin_id:
                                                type: string
                                                description: The Third-party ID of the Sub Job
                                              origin_data:
                                                type: string
                                                description: The Third-party Data of the Sub Job
                                                example: '{"data_field":{"is_important":true}}'
                                              created_at:
                                                type: string
                                                description: Created at
                                                example: '2017-08-14T21:39:40Z'
                                              updated_at:
                                                type: string
                                                description: Updated at
                                                example: '2017-08-15T21:39:40Z'
                                          - type: object
                                            properties:
                                              id:
                                                type: integer
                                                description: ID
                                                example: 3483483
                                              name:
                                                type: string
                                                description: Name
                                                example: Floor 2
                                              code:
                                                type: string
                                                description: Unique code in the scope of a Project
                                                example: 18
                                    currency_configuration:
                                      type: object
                                      properties:
                                        currency_iso_code:
                                          type:
                                          - string
                                          - 'null'
                                          description: Currency ISO Code configured for the financial entity
                                          example: USD
                              currency_configuration:
                                type: object
                                properties:
                                  currency_iso_code:
                                    type:
                                    - string
                                    - 'null'
                                    description: Currency ISO Code configured for the financial entity
                                    example: USD
                        line_items_extended_total:
                          type: string
                          format: float
                          description: Sum of all line item extended amounts (after markup), as a decimal string.
                          example: '100.0'
                        line_items_total:
                          type: string
                          format: float
                          description: Sum of all line item amounts (before markup), as a decimal string.
                          example: '100.0'
                        location_id:
                          type: integer
                          description: ID of the project location this change order is associated with.
                          example: 438264
                        number:
                          type: string
                          description: Human-readable change order number, unique within the contract.
                          example: C34
                        origin_data:
                          type: string
                          description: Free-form metadata from an external system, stored to correlate this PCO with its source record.
                          example: OD-2398273424
                        origin_id:
                          type: string
                          description: Identifier of this PCO in the external system it was imported from. Use to match records during integrations.
                          example: '459247544'
                        paid:
                          type: boolean
                          description: True when the change order has been marked as paid.
                          example: true
                        paid_date:
                          type: string
                          format: date
                          description: Date the change order was paid (YYYY-MM-DD).
                          example: '2017-08-18'
                        position:
                          type: integer
                          description: Ordering position of this PCO within its contract.
                          example: 3
                        prime_change_event_id:
                          type: integer
                          description: ID of the prime contract Change Event this PCO was generated from. Set when the contract is a prime contract.
                          example: 135314
                        private:
                          type: boolean
                          description: If true, visible to admins only; otherwise visible to those with access to the parent contract.
                          example: true
                        reason:
                          type: string
                          description: Reason the change order was raised.
                          example: Owner Request
                        received_from:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 160586
                            login:
                              type: string
                              description: Email
                              example: carl.contractor@example.com
                            name:
                              type: string
                              description: Name
                              example: Carl Contractor
                        reference:
                          type: string
                          description: Free-text reference linking this PCO to a related record (for example, a change event).
                          example: 'CE #23'
                        request_for_quote_id:
                          type: integer
                          description: ID of the Request for Quote (RFQ) this PCO is associated with, if any.
                          example: 4336438
                        reviewed_at:
                          type: string
                          format: date-time
                          description: Timestamp when the change order was reviewed, in ISO 8601 format. Null if not yet reviewed.
                          example: '2017-08-20T21:39:40Z'
                        reviewer:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 160586
                            login:
                              type: string
                              description: Email
                              example: carl.contractor@example.com
                            name:
                              type: string
                              description: Name
                              example: Carl Contractor
                        revision:
                          type: integer
                          description: Revision number of the change order, incremented on each revision.
                          example: 4
                        schedule_impact_amount:
                          type: integer
                          description: Estimated impact of this change order on the project schedule, in days.
                          example: 2
                        status:
                          type: string
                          description: Workflow status of the change order.
                          example: draft
                          enum:
                          - draft
                          - not_pricing
                          - pricing
                          - pending
                          - revised
                          - proceeding
                          - not_proceeding
                          - no_charge
                          - approved
                          - rejected
                          - void
                        title:
                          type: string
                          description: Short title summarizing the change order.
                          example: Concrete freezer slab
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when the PCO was last updated, in ISO 8601 format.
                          example: '2017-08-16T21:39:40Z'
                        vendor:
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: integer
                                example: 161072
                              name:
                                type: string
                                example: SID Architecture
                          - type: object
                            properties:
                              abbreviated_name:
                                type:
                                - string
                                - 'null'
                                description: Abbreviated name
                                example: PE
                              address:
                                type:
                                - string
                                - 'null'
                                description: Address
                                example: 846 Dogglesworth Drive
                              authorized_bidder:
                                type: boolean
                                description: Authorized bidder status
                                example: true
                              business_phone:
                                type:
                                - string
                                - 'null'
                                description: Business phone
                                example: (800) 555-1234
                              city:
                                type:
                                - string
                                - 'null'
                                description: City
                                example: Jeffersonville
                              contact_count:
                                type: integer
                                description: Count of active Contacts associated with the vendor record.
                                example: 5
                              company:
                                type:
                                - string
                                - 'null'
                                description: Company
                                example: Stock Construction
                              country_code:
                                type:
                                - string
                                - 'null'
                                description: Country code (ISO-3166 Alpha-2 format)
                                example: US
                              created_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: Created at
                                example: '2016-10-23T21:39:40Z'
                              email_address:
                                type:
                                - string
                                - 'null'
                                format: email
