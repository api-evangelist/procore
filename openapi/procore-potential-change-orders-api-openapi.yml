  /rest/v1.0/potential_change_orders/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      description: Unique identifier of the Potential Change Order.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Show Potential Change Orders
      description: Return detailed information about a Potential Change Order (PCO).
      tags:
      - Potential Change Orders
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: contract_id
        in: query
        description: ID of the contract (prime or commitment) whose potential change orders this request targets.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for this Potential Change Order. Use as the {id} path parameter to retrieve, update, or delete it.
                    example: 2843048
                  accounting_method:
                    type: string
                    description: 'How the change order is priced: "amount" for a lump-sum total or "unit" for quantity-times-unit-cost line items.'
                    example: unit
                    enum:
                    - amount
                    - unit
                  change_order_change_reason_id:
                    type: integer
                    description: ID of the change reason assigned to this PCO, if change reasons are enabled for the project.
                    example: 847264
                  change_order_request_id:
                    type: integer
                    description: ID of the Change Order Request (COR) this PCO belongs to, on multi-tier contract configurations.
                    example: 283764
                  commitment_change_event_id:
                    type: integer
                    description: ID of the commitment Change Event this PCO was generated from. Set when the contract is a commitment.
                    example: 135314
                  contract_id:
                    type: integer
                    description: ID of the contract (prime or commitment) this PCO belongs to.
                    example: 304485
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when the PCO was created, in ISO 8601 format.
                    example: '2017-08-14T21:39:40Z'
                  creator:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                  deleted_at:
                    type: string
                    format: date-time
                    description: Timestamp when the PCO was soft-deleted, in ISO 8601 format. Null for active PCOs.
                    example: '2017-11-10T21:39:40Z'
                  description:
                    type: string
                    description: Free-text description of the scope of this change order.
                    example: Freezer slab replacement
                  designated_reviewer:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
