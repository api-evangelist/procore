openapi: 3.2.0
info:
  title: Procore REST Correspondences API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Correspondences
paths:
  /rest/v1.0/companies/{company_id}/bid_packages/{bid_package_id}/correspondences:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: bid_package_id
      in: path
      description: Bid Package ID
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Correspondences
      description: Return a list of all Correspondences for a Bid Package.
      tags:
      - Correspondences
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Correspondences
                items:
                  allOf:
                  - type: object
                    title: Correspondence
                    description: Correspondence
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 94529
                      bid_package_id:
                        type: integer
                        description: Bid package ID
                        example: 91011
                      bid_package_title:
                        type: string
                        description: Bid package title
                        example: Ocean Home Bid Package
                      created_at:
                        type: string
                        description: Correspondence created-at
                        example: Monday, May 14, 2018 at 11:31 am
                      subject:
                        type: string
                        description: Subject within Correspondence
                        example: Ocean Home 9171
                  - type: object
                    title: Correspondence
                    description: Correspondence
                    properties:
                      attachments:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: File ID
                              example: 1
                            name:
                              type: string
                              description: Base name of the file without its path
                              example: contract.pdf
                            url:
                              type: string
                              description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                              example: https://storage.procore.com
                            filename:
                              type: string
                              description: Base name of the file without its path
                              deprecated: true
                              example: contract.pdf
                            content_type:
                              type: string
                              description: A mime type or a file extension
                              example: application/pdf
                            share_url:
                              type: string
                              description: Shareable URL(enabled on company level) or file URL
                              example: https://storage.procore.com
                            viewable_type:
                              type: string
                              description: Document type
                              enum:
                              - document
                              - document_pending
                              - image
                              - mp4
                              - default
                              example: default
                            viewable_url:
                              type: string
                              description: Viewable document URL
                              example: https://app.procore.com/
                      message:
                        type: string
                        description: Body of Correspondence
                        example: Please note new revision of Ocean Home 9171
                      recipients:
                        type: array
                        description: List of recipient names Correspondence was sent to
                        example:
                        - Hector Jimenez
                        - Mike Wazny
                        items:
                          type: string
                          description: Recipient name
                          example: Jane Doe
                      from:
                        type: object
                        properties:
                          first:
                            type: string
                            description: Recipients first name
                            example: John
                          last:
                            type: string
                            description: Recipients last name
                            example: Doe
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
