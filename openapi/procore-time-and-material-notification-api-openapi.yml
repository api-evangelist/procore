        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Time and Material Notification
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the Time & Material notification configuration.
                    example: 1200
                  project_id:
                    type: integer
                    description: Identifier of the project this notification configuration belongs to.
                    example: 1456
                  company_id:
                    type: integer
                    description: Identifier of the company that owns this notification configuration.
                    example: 1590
                  creation:
                    type: array
                    description: Array of user identifiers to notify when a Time & Material ticket is created.
                    items:
                      type: integer
                      example: 95861
                  customer_signed:
                    type: array
                    description: Array of user identifiers to notify when a customer signs a Time & Material ticket.
                    items:
                      type: integer
                      example: 95861
                  company_signed:
                    type: array
                    description: Array of user identifiers to notify when a company representative signs a Time & Material ticket.
                    items:
                      type: integer
                      example: 95861
                  closed:
                    type: array
                    description: Array of user identifiers to notify when a Time & Material ticket is closed.
                    items:
                      type: integer
                      example: 95861
                  group_equipment_totals_by:
                    type: string
                    description: 'Controls how equipment totals are grouped when pushing to change events. Values: none, per_ticket, per_change_event.'
                    example: per_ticket
                  group_labor_totals_by:
                    type: string
                    description: 'Controls how labor totals are grouped when pushing to change events. Values: none, per_ticket, per_change_event.'
                    example: per_ticket
                  notify_dl_on_customer_signed:
                    type: boolean
                    description: Whether to notify the project distribution list when a customer signs.
                    example: true
                  notify_dl_on_company_signed:
                    type: boolean
                    description: Whether to notify the project distribution list when a company representative signs.
                    example: true
                  notify_dl_on_creation:
                    type: boolean
                    description: Whether to notify the project distribution list when a ticket is created.
                    example: true
                  notify_dl_on_closed:
                    type: boolean
                    description: Whether to notify the project distribution list when a ticket is closed.
                    example: true
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when this notification configuration was last modified, in ISO 8601 format.
                    example: '2019-12-10T22:10:33Z'
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when this notification configuration was created, in ISO 8601 format.
                    example: '2019-12-10T22:10:33Z'
