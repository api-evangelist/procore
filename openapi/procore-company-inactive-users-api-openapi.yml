paths:
  /rest/v1.0/companies/{company_id}/users/inactive:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List company inactive users
      description: 'Return a list of all Inactive Users associated with a Company.


        See Filtering on List Actions for information on using the filtering capabilities provided by this endpoint.'
      tags:
      - Company Inactive Users
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: sort
        in: query
        description: Return items with the specified sort.
        required: false
        schema:
          type: string
          enum:
          - name
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of company inactive users
                items:
                  title: Inactive User
                  description: Inactive User
                  allOf:
                  - type: object
                    title: User
                    description: The Company User object
                    properties:
                      address:
                        type:
                        - string
                        - 'null'
                        description: The address of the user.
                        example: 6305 Carpinteria Ave
                      avatar:
                        type:
                        - string
                        - 'null'
                        description: The URL pointing to the user avatar.
                        example: http://s3.amazonaws.com/pro-core.com/prostore/20150713184222_production_74548228.gif?AWSAccessKeyId=0PFNH01C4MGHNNJSGNK82&Expires=2067964943&Signature=l4zpZIM3bgxydrr4hn6lM%2FdtreQ%3D
                      business_id:
                        description: Business id
                        example: 89cac92d-fbd8-40ec-a1fc-24bbbd035a78
                        type:
                        - string
                        - 'null'
                      business_phone:
                        type:
                        - string
                        - 'null'
                        description: The business phone number of the user.
                        example: 1-800-555-1234
                      business_phone_extension:
                        type:
                        - integer
                        - 'null'
                        description: The business phone extension of the user.
                        example: '21'
                      city:
                        type:
                        - string
                        - 'null'
                        description: The city that applies to the user.
                        example: Carpinteria
                      country_code:
                        type:
                        - string
                        - 'null'
                        description: The country code that applies to the user, must be in ISO-3166 Alpha-2 format.
                        example: US
                      email_address:
                        type:
                        - string
                        - 'null'
                        format: email
                        description: The email address of the user.
                        example: user-company@example.com
                      email_signature:
                        type:
                        - string
                        - 'null'
                        description: The email signature of the user.
                        example: <p>Sent from Example Company.</p>
                      employee_id:
                        type:
                        - string
                        - 'null'
                        description: The unique employee identifier of the user.
                        example: '123456789'
                      erp_integrated_accountant:
                        type: boolean
                        description: If this property is set to true, the user is an ERP-integrated accountant, if this property is set to false, the user is not an ERP-integrated accountant.
                        example: true
                      fax_number:
                        type:
                        - string
                        - 'null'
                        description: The fax number of the user.
                        example: 1-800-555-5678
                      first_name:
                        type:
                        - string
                        - 'null'
                        description: The first name of the user.
                        example: Leah
                      id:
                        type: integer
                        description: The unique idenfier of the user.
                        example: 381006
                      initials:
                        type:
                        - string
                        - 'null'
                        description: The initials of the user.
                        example: LR
                      is_active:
                        type:
                        - boolean
                        - 'null'
                        description: If this property is set to true, the user status is active. If this property is set to false, the user status is inactive.
                        example: true
                      is_employee:
                        type:
                        - boolean
                        - 'null'
                        description: If this property is set to true, the user is an employee. If this property is set to false, the user is not an employee.
                        example: false
                      job_title:
                        type:
                        - string
                        - 'null'
                        description: The job title of the user.
                        example: QA Manager
                      last_login_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: The date and time when the user logged in last.
                        example: '2016-06-30T20:41:58Z'
                      last_name:
                        type: string
                        description: The last name of the user.
                        example: Russell
                      mobile_phone:
                        type:
                        - string
                        - 'null'
                        description: The mobile phone number of the user.
                        example: 1-800-555-1234
                      name:
                        type: string
                        description: The full name of the user.
                        example: Leah Russell
                      notes:
                        type:
                        - string
                        - 'null'
                        description: The user notes.
                        example: notes
                      state_code:
                        type:
                        - string
                        - 'null'
                        description: The state code that applies to the user. Must be in ISO-3166 Alpha-2 format.
                        example: CA
                      welcome_email_sent_at:
                        type: string
                        format: date-time
                        description: The date and time when the welcome email was sent to the user.
                        example: '2013-05-30T20:41:58Z'
                      zip:
                        type:
                        - string
                        - 'null'
                        description: The ZIP code of the user.
                        example: '93013'
                      origin_id:
                        type: string
                        example: foobar
                        description: The unique idenfitier for the user origin.
                      origin_data:
                        type: string
                        description: User origin data.
                        example: OD-2398273424
                      created_at:
                        type: string
                        format: date-time
                        description: The date and time when the user was created in the system.
                        example: '2016-10-23T21:39:40Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: The date and time when the user was updated in the system.
                        example: '2020-10-23T21:39:40Z'
                      vendor:
                        type: object
                        properties:
                          id:
