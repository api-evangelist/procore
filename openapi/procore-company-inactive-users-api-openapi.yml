                    properties:
                      _links:
                        type: object
                        description: API Links
                        properties:
                          reactivate:
                            type: string
                            description: Link to reactivate user
                            example: https://api.procore.com/rest/v1.0/companies/1/users/inactive/1
        '401':
          description: Unauthorized
          content:
