        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"permission_template_assignments\":{\"user_id\":3461,\"permission_template_id\":5678}}"


          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v1.0/projects/%7Bproject_id%7D/permission_template_assignments", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
