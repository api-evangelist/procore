        content: "const request = require('request');\n\nconst options = {\n  method: 'PATCH',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/permission_template_assignments',\n  headers: {'content-type': 'application/json'},\n  body: {permission_template_assignments: {user_id: 3461, permission_template_id: 5678}},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
