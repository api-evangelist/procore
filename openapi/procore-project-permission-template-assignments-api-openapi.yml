paths:
  /rest/v1.0/projects/{project_id}/permission_template_assignments:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update a permission template assignment for a user on a project
      description: Returns the user_id and permission_template_id for the new permission template assignment
      tags:
      - Project Permission Template Assignments
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - permission_template_assignments
              properties:
                permission_template_assignments:
                  title: Permission Template Assignments
                  type: object
                  required:
                  - user_id
                  - permission_template_id
                  properties:
                    user_id:
                      type: integer
                      description: The ID of the user you wish to update the permission template for
                      example: 3461
                    permission_template_id:
                      type: integer
                      description: The ID of the permission template you'd like to assign to the user for the project
                      example: 5678
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    example: 12
                  permission_template_id:
                    type: integer
                    example: 157
                  project_id:
                    type: integer
                    example: 953
