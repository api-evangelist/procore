openapi: 3.2.0
info:
  title: Procore REST Saved Views V2 API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Saved Views V2
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/document_management/saved_views:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      description: 'Returns the Saved Views a Project user can see: their own plus every project-level Saved View. Unusable Saved Views are never returned.


        By default only Saved Views belonging to a Document Collection are returned. Passing `filters[upload_collection_ids]` or `filters[recycle_bin_collection_ids]` scopes the response to Saved Views on those collections instead. A Saved View belongs to at most one collection, so at most one of `document_collection_id`, `upload_collection_id` and `recycle_bin_collection_id` is non-null.


        Recycle Bin Saved Views are only returned when the Recycle Bin is enabled for the Project; when it is not, scoping to them returns an empty page rather than an error.


        Supported filters: `ids`, `updated_at`, `document_collection_ids`, `upload_collection_ids`, `recycle_bin_collection_ids`.


        Pass `view=ids_only` to receive an array of Saved View ids instead of full objects.'
      operationId: SavedViewsV2Controller_getSavedViewsListV2_0
      parameters:
      - name: company_id
        required: true
        in: path
        description: Company ID
        schema:
          type: string
      - name: project_id
        required: true
        in: path
        description: Project ID
        schema:
          type: string
      - name: view
        required: false
        in: query
        description: Optional response view. Omit or pass `default` for full Saved View objects. `ids_only` returns an array of ids and raises the `per_page` ceiling from 100 to 5000. The published `per_page` maximum reflects the default view.
        schema:
          enum:
          - default
          - ids_only
          type: string
      - name: page
        required: false
        in: query
        description: Page
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        required: false
        in: query
        description: Elements per page
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: locale
        required: false
        in: query
        description: Language for the response to be translated into
        schema:
          type: string
          enum:
          - de-DE
          - en-AE
          - en-AU
          - en-CA
          - en-GB
          - en-SG
          - en
          - es-ES
          - es
          - fr-CA
          - fr-FR
          - is-IS
          - ja-JP
          - pl-PL
          - pseudo
          - pt-BR
          - th-TH
          - zh-SG
          - zh-TW
          - nb-NO
          - pt-PT
          - it-IT
      - name: filters
        required: false
        in: query
        description: 'Object with whitelisted Field ids as keys and their corresponding MetadataValue id, MetadataValue ids array, or primitive string value as values.

          Valid filterable fields are:

          ids,

          updated_at,

          document_collection_ids,

          upload_collection_ids,

          recycle_bin_collection_ids'
        schema:
          type: object
          properties:
            ids:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
            updated_at:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
            document_collection_ids:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
            upload_collection_ids:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
            recycle_bin_collection_ids:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
      responses:
        '200':
          description: Returns a list of Saved Views
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: number
            Total:
              description: Total number of items to be retrieved
              schema:
                type: number
            Link:
              description: Link headers for the first, prev, next and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        tags:
                          description: The tags on a saved view
                          type: array
                          items:
                            type: string
                        filters:
                          description: The filters on a saved view
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                example: 01G3F39BRDKDK04FV9BARK6YTS
                                description: 'Can be a Field ID or some other supported table filter key (ex: document_collection_index_type)'
                              key_type:
                                type: string
                                enum:
                                - field
                                - option
                                description: Indicates what type of filter this is
                              field:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    example: 01G3F39BRDKDK04FV9BARK6YTS
                                  name:
                                    type: string
                                    enum:
                                    - original_filename
                                    - file_format
                                    - format
                                    - type
                                    - name
                                    - description
                                    - revision
                                    - status
                                    - classification
                                    - project_stage
                                    - project
                                    - originator
                                    - volume
                                    - location
                                    - discipline
                                    - number
                                    - created_at
                                    - created_by
                                    - date_authored
                                    - authored_by
                                    - updated_at
                                    - updated_by
                                    - uploaded_at
                                    - uploaded_by
                                    - file_size
                                    - project_new
                                    - assigned_workflow
                                    - assigned_workflow_template
                                    - workflow_assignees
                                    - workflow_current_step_assignees
                                    - workflow_current_step
                                    - workflow_step_due_date
                                    - workflow_manager
                                    - workflow_status
                                    - workflow_template_version
                                    - workflow_pending_assignees
                                    - workflow_current_step_roles
                                    - version
                                    - in_active_workflow
                                    - workflow_completion_date
                                    - submitted_into_drawings
                                    - custom_field_id
                                    - submitted_into_drawings_by
                                    - submitted_into_drawings_at
                                    - cf_lov_entries
                                    - recycled_by
                                    - recycled_at
                                    - recycled_reason
                                    - action_required
                                    - document_stage
                                    - item_content
                                    - placeholder_assignee
                                    - placeholder_due_date
                                    - placeholder_created_by
                                    - package
                                  type:
                                    type: string
                                    enum:
                                    - string
                                    - reference
                                    - lov_entry
                                    - lov_entries
                                    - rich_text
                                    - timestamp
                                    - numeric
                                  label:
                                    type: string
                                    example: Label
                                  description:
                                    type: string
                                    example: Description
                                required:
                                - id
                                - name
                                - type
                                - label
                                - description
                              values:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      example: '123'
                                    code:
                                      type: string
                                      example: S3
                                    active:
                                      type: boolean
                                      example: true
                                    tags:
                                      example:
                                      - ML:auto-detect.type.drawing
                                      type: array
                                      items:
                                        type: string
                                    value:
                                      type: string
                                      example: '123'
                                    type:
                                      type: string
                                      enum:
                                      - string
                                      - reference
                                      - lov_entry
                                      - lov_entries
                                      - rich_text
                                      - timestamp
                                      - numeric
                                      - procore_project
                                      - procore_project_stage
                                      - procore_location
                                      - procore_company
                                      - procore_user
                                      - procore_vendor
                                      - procore_workflow_template
                                      - procore_workflow_template_preset
                                      - procore_workflow_status
                                      - procore_workflow_template_version
                                      - with_code
                                      - procore_users
                                      - procore_tool_user
                                      - multi_select
                                      - package
                                      - computed
                                    label:
                                      type: string
                                      example: Label
                                  required:
                                  - value
                                  - type
                                  - label
                            required:
                            - key
                            - key_type
                            - field
                            - values
                        id:
                          type: string
                          example: 01G3F39BRDKDK04FV9BARK6YTS
                        document_collection_id:
                          type:
                          - string
                          - 'null'
                          example: 01G3F39BRDKDK04FV9BARK6YTB
                          description: The Document Collection this saved view belongs to. Null for saved views outside a Document Collection.
                        upload_collection_id:
                          type:
                          - string
                          - 'null'
                          example: 01G3F39BRDKDK04FV9BARK6YTB
                          description: The Upload Collection this saved view belongs to. Null for saved views outside an Upload Collection.
                        name:
                          type: string
                          example: Saved View
                          format: string
                        description:
                          type: string
                          example: Filters by Type=Drawing and Status=Approved,Approved with Comment
                          format: string
                        share_type:
                          type:
                          - string
                          - 'null'
                          enum:
                          - project
                          description: Categorizes the saved view as a user level saved view or a project level saved view.
                        shortcut_type:
                          type:
                          - string
                          - 'null'
                          enum:
                          - drawings_tool
                          - specifications_tool
                          description: PDM tool alias that are permanent saved views on all projects
                        deletable:
                          type: boolean
                          description: Determines whether a saved view can be deleted or not
                        created_at:
                          type: string
                          example: '2021-03-31T16:00:00Z'
                          format: date-time
                        updated_at:
                          type: string
                          example: '2021-03-31T16:00:00Z'
                          format: date-time
                        columns_config:
                          description: The table configuration for the saved view
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: Can be a Field ID or some other supported table column key
                                example: 01G3F39BRDKDK04FV9BARK6YTS
                              key_type:
                                type: string
                                description: Indicates what type of column this is
                                enum:
                                - field
                                - calculated
                                example: field
                              pinned:
                                type:
                                - string
                                - 'null'
                                enum:
                                - left
                                - right
                                example: left
                              hidden:
                                type: boolean
                                example: false
                              position:
                                type: string
                                example: aaa....
                              sort:
                                type: string
                                example: asc
                                enum:
                                - asc
                                - desc
                              sort_index:
                                type: number
                                example: 1
                            required:
                            - key
                            - key_type
                        last_accessed_at:
                          type: string
                          example: '2021-03-31T16:00:00Z'
                          format: date-time
                          description: Last accessed timestamp for the saved view
                        access_count:
                          type: number
                          example: 42
                          description: Number of times this saved view has been accessed
                        recycle_bin_collection_id:
                          type:
                          - string
                          - 'null'
                          example: 01G3F39BRDKDK04FV9BARK6YTB
                          description: The Recycle Bin Collection this saved view belongs to. Null for every saved view outside the Recycle Bin.
                      required:
                      - tags
                      - filters
                      - id
                      - name
                      - description
                      - deletable
                      - created_at
                      - updated_at
                required:
                - data
