    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create image category
      description: Create a new Photo Album (Category) for Images.
      tags:
      - Image Categories
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - image_category
              properties:
                image_category:
                  title: ImageCategory
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: The Name of the Image Category
                      example: 1/1/17 album
                    private:
                      type: boolean
                      description: The Private status of the Image Category
                      default: false
                      example: false
                    album_cover_id:
                      type: integer
                      description: ID of an Image that is the cover Image of the Image Category.
                      example: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                title: ImageCategory
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the photo album (image category). Pass as the {id} path parameter to GET/PATCH/DELETE /rest/v1.0/image_categories/{id}.
                  name:
                    type: string
                    description: Display name of the album, e.g. 'Site Progress - March'.
                  position:
                    type:
                    - integer
                    - 'null'
                    description: Sort order of the album within the project's album list; lower values appear first.
                  album_cover_id:
                    type:
                    - integer
                    - 'null'
                    description: Identifier of the Image set as this album's cover, referencing an Image in this album. Null when no cover has been set.
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when the album was created, in ISO 8601 format.
                  private:
                    type: boolean
                    description: Whether the album and its images are restricted to users with private-photo access.
                  count:
                    type: integer
                    description: Number of images in the album visible to the requesting user; private images are excluded unless the user has private-photo access.
                example:
                  id: 51065
                  count: 3
                  cover_photo: https://s3.amazonaws.com/pro-core.com/prostore/20141028153752_production_28603561.jpg?AWSAccessKeyId=REDACTED_AWS_ACCESS_KEY_ID&Expires=2099098110&Signature=M7gx3Hp9q7xg7PyM87oJW%2BDOvr4%3D
