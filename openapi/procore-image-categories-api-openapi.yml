- bearerAuth: []
tags:
- name: Image Categories
paths:
  /rest/v1.0/image_categories:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List image categories
      description: Return a list of all Photo Albums (Image Categories) in a specified project.
      tags:
      - Image Categories
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of image categories
                items:
                  title: ImageCategory
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the photo album (image category). Pass as the {id} path parameter to GET/PATCH/DELETE /rest/v1.0/image_categories/{id}.
                    count:
                      type: integer
                      description: Number of images in the album visible to the requesting user; private images are excluded unless the user has private-photo access.
                    cover_photo:
                      type:
                      - string
                      - 'null'
                      description: URL of the album's cover thumbnail. Null when the album has no cover image visible to the user.
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the album was created, in ISO 8601 format.
                    links:
                      type: object
                      description: Action URLs for this album.
                      properties:
                        show:
                          type: string
                          description: Web URL to view the album's images.
                        delete:
                          type: string
                          description: REST URL to delete the album via DELETE. Present only when the user may delete the album and it is not the default 'Unclassified' album.
                        update:
                          type: string
                          description: REST URL to update the album via PATCH. Present only when the user may modify the album and it is not the default 'Unclassified' album.
                    name:
                      type: string
                      description: Display name of the album, e.g. 'Site Progress - March'.
                    private:
                      type: boolean
                      description: Whether the album and its images are restricted to users with private-photo access.
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when the album was last modified, in ISO 8601 format.
                    position:
                      type: integer
                      description: Sort order of the album within the project's album list; lower values appear first.
                  example:
                    id: 51065
                    count: 3
                    cover_photo: https://s3.amazonaws.com/pro-core.com/prostore/20141028153752_production_28603561.jpg?AWSAccessKeyId=REDACTED_AWS_ACCESS_KEY_ID&Expires=2099098110&Signature=M7gx3Hp9q7xg7PyM87oJW%2BDOvr4%3D
                    created_at: '2013-11-08T00:00:00Z'
                    links:
                      show: /22585/project/images/show_album?id=51065
                      update: /rest/v1.0/image_categories/1301434?project_id=173074
                      delete: /rest/v1.0/image_categories/51065?project_id=22585
                    name: Test
                    private: false
                    updated_at: '2016-04-27T17:45:18Z'
                    position: 1
        '401':
          description: Unauthorized
