- name: Company Managed Equipment
paths:
  /rest/v1.0/companies/{company_id}/managed_equipment/bulk_restore:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      deprecated: true
      x-deprecated-at: '2024-12-01'
      x-sunset: '2025-12-02'
      summary: Bulk Retrieve Managed Equipment
      description: Restore multiple Managed Equipment with one request.
      tags:
      - Company Managed Equipment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - managed_equipment
              properties:
                managed_equipment:
                  description: Parameters for bulk-restoring managed equipment.
                  type: object
                  properties:
                    managed_equipment_ids:
                      description: IDs of all Managed Equipment specified for bulk restore
                      type: array
                      items:
                        type: integer
                        description: Unique identifier of a managed equipment to restore.
                        example: 65
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of Equipment
                items:
                  type: object
                  description: Managed Equipment
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the managed equipment.
                      example: 75414
                    name:
                      type: string
                      description: Display name of the managed equipment.
                      example: Backhoe
                    company_id:
                      type: integer
                      description: Identifier of the company that owns this managed equipment.
                      example: 1
                    current_project_id:
                      type: integer
                      description: Identifier of the project this equipment is currently dispatched to. Null if not assigned.
                      example: 1
                    company_visible:
                      type: boolean
                      description: Whether this equipment is visible at the company level across all projects.
                      example: false
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when this managed equipment was last modified, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this managed equipment was created, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when this managed equipment was soft-deleted, in ISO 8601 format. Null if the record is active.
                      example: '2015-11-12T21:26:28Z'
                    serial_number:
                      type: string
                      description: Serial number of the equipment.
                      example: S#12892
                    identification_number:
                      type: string
                      description: Identification number of the equipment.
                      example: ID#9018290
                    description:
                      type: string
                      description: Description of the equipment.
                      example: This equipment was brought in for the backyard work.
                    managed_equipment_make_id:
                      type: integer
                      description: Identifier of the equipment make associated with this equipment.
                      example: 14
                    managed_equipment_model_id:
                      type: integer
                      description: Identifier of the equipment model associated with this equipment.
                      example: 13
                    managed_equipment_type_id:
                      type: integer
                      description: Identifier of the equipment type associated with this equipment.
                      example: 132
                    managed_equipment_category_id:
                      type: integer
                      description: Identifier of the equipment category associated with this equipment.
                      example: 13
                    year:
                      type: integer
                      description: Year the equipment was manufactured in.
                      example: 2017
                    status:
                      type: string
                      description: Current operational status of the equipment.
                      enum:
                      - available
                      - in_use
                      - under_maintenance
                      example: in_use
                    ownership:
                      type: string
                      description: Ownership arrangement for this equipment.
                      enum:
                      - owned
                      - rented
                      - sub
                      example: owned
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user who created this managed equipment.
                          example: 160586
                        login:
                          type: string
                          description: Email address of the user who created this managed equipment.
