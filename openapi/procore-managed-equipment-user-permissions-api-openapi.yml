- bearerAuth: []
tags:
- name: Managed Equipment User Permissions
paths:
  /rest/v1.0/companies/{company_id}/managed_equipment/user_permissions:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      deprecated: true
      x-deprecated-at: '2024-12-01'
      x-sunset: '2025-12-02'
      summary: Update User Permission
      description: Updating a Company Managed Equipment User Permission
      tags:
      - Managed Equipment User Permissions
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: Managed Equipment Permission update Body
              type: object
              properties:
                id:
                  type: integer
                  description: Unique identifier of the user permission record to update.
                  example: 93988
                user_access_level_id:
                  type: integer
                  description: User Access Level ID - '1' for None, '2' for Read-Only, '3' for Standard, '4' for Admin
                  enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  example: 2
        required: true
      responses:
        '200':
          description: Company Managed Equipment User Permission updated
          content:
            application/json:
              schema:
                type: object
                title: CompanyManagedEquipmentUserPermission
                description: Company Managed Equipment User Permission
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the user permission record.
                    example: 93988
                  company_directory_admin:
                    type: boolean
                    description: User is a Company directory admin
                    example: false
                  name:
                    type: string
                    description: Full name of user
                    example: user, test
                  user_access_level:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Numeric access level identifier.
                      name:
                        type: string
                        description: Human-readable name for the access level (e.g., None, Read-Only, Standard, Admin).
                  permission_template:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Unique identifier for the Permission Template
                        example: 1
                      name:
                        type: string
                        description: The name of the Permission Template
                        example: General Contractor
                      project_specific:
                        type: boolean
                        description: If the Permission Template is project specific
                        example: true
                    example:
                      id: 1
                      name: General Contractor
                      project_specific: true
                  vendor:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the vendor.
                        example: 161072
                      name:
                        type: string
                        description: Name of the vendor.
                        example: SID Architecture
        '422':
          description: Error updating a Company Managed Equipment User Permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
