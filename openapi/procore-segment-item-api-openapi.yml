      - summary: Return 422 when update is not supported for the segment type
        description: 'Updating a segment item that is not supported at the current company or project

          level (for example a sub job at company level, or a Cost type (line item type) at project

          level) now returns 422 Unprocessable Entity with a descriptive error instead of 500.'
        endpoint: PATCH /companies/{company_id}/work_breakdown_structure/segments/{segment_id}/segment_items/{id}
        type: refinement
