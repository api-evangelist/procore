      - summary: Added default_uom_id field to Update Company Segment Item
        description: The request body now accepts an optional default_uom_id field to set the default Unit of Measure for a Cost type (line item type) segment item. Part of the Units of Measure Validation beta.
        endpoint: PATCH /companies/{company_id}/work_breakdown_structure/segments/{segment_id}/segment_items/{id}
        breaking: false
        type: feature
        datestamp: '2026-07-15'
