openapi: 3.2.0
info:
  title: Procore REST Segment Item API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Segment Item
paths:
  /rest/v1.0/companies/{company_id}/work_breakdown_structure/segments/{segment_id}/segment_items/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: segment_id
      in: path
      description: ID of the WBS Segment to scope this request to (e.g., the cost_code or line_item_type segment). Retrieve valid segment IDs from segments[].id in the GET patterns response.
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Segment Item ID
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update Company Segment Item
      description: Update a specific Company Segment Item. For cost types (line item types), the status attribute can be used to activate or deactivate the cost type when the cost type deactivation feature is enabled. Deactivating the default cost type (Other) or the last remaining active cost type will return a 422 error. Segment types that cannot be updated at the company level, such as sub jobs, also return a 422 error.
      tags:
      - Segment Item
      parameters:
      - name: standard_cost_code_list_id
        in: query
        description: ID of the Standard Cost Code List to scope this request to. Required for cost_code segments — omitting it will result in an error for those segments. Retrieve valid list IDs from GET /rest/v1.0/companies/{company_id}/work_breakdown_structure/segments/{segment_id}/lists.
        required: false
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Short alphanumeric code for this segment item (e.g., '300'). For tiered segments, provide the leaf-level code only — not the full path code including parent prefixes.
                  example: '300'
                name:
                  type: string
                  description: Display name of this segment item (e.g., 'Concrete'). Shown in the WBS picker when building a WBS code.
                  example: Concrete
                status:
                  type: string
                  enum:
                  - active
                  - inactive
                  description: 'Lifecycle status of the segment item. One of: ''active'' (available for selection when building WBS codes), ''inactive'' (hidden from the WBS picker but retained for historical records).'
                  example: active
                parent_id:
                  type:
                  - integer
                  - 'null'
                  description: ID of the new parent segment item for tiered segments. Set to null to move the item to the root level.
                  example: 34
                default_uom_id:
                  type:
                  - integer
                  - 'null'
                  description: ID of the default unit of measure. Applies to line_item_type segment items only (company scope); ignored for other segment types.
                  example: 5
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique ID of this segment item (cost code, sub-job, line item type, or custom segment item). Use as segment_item_id when constructing a new WBS code via POST /rest/v1.0/projects/{project_id}/work_breakdown_structure/wbs_codes.
                    example: 456
                  code:
                    type: string
                    description: Short alphanumeric code for this segment item (e.g., '01-222'). Combined with sibling segment codes to form the flat_code on the parent WBS code.
                    example: 01-222
                  name:
                    type: string
                    description: Human-readable name of this segment item (e.g., 'Lighting'). Combined with sibling segment names to form the flat_name on the parent WBS code.
                    example: Lighting
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when this segment item was created, in ISO 8601 format.
                    example: '2016-06-30T20:41:58Z'
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when this segment item was last updated, in ISO 8601 format.
                    example: '2016-08-30T18:11:43Z'
                  parent_id:
                    type:
                    - integer
                    - 'null'
                    description: ID of the parent segment item in a tiered segment hierarchy. Null for root-level items or items in a flat-structure segment.
                    example: 123
                  path_ids:
                    type: array
                    description: Ordered list of IDs from the root ancestor down to (and including) this segment item. Use to reconstruct the full hierarchy path.
                    items:
                      type: integer
                    example:
                    - 123
                    - 456
                  path_code:
                    type: string
                    description: Full path code for this segment item representing the leaf code in its hierarchy (e.g., '01-222').
                    example: a
                  is_parent:
                    type: boolean
                    description: Whether this segment item has child items in a tiered segment structure. Always false for flat-structure segments.
                    example: false
                  path_codes:
                    type: array
                    description: Ordered list of code strings from the root ancestor down to (and including) this segment item, formatted as 'code - name'.
                    items:
                      type: string
                    example:
                    - 01 - Requirements
                    - 01-222 - Lighting
                  path_names:
                    type: array
                    description: Ordered list of name strings from the root ancestor down to (and including) this segment item, formatted as 'code - name'.
                    items:
                      type: string
                    example:
                    - 01 - Requirements
                    - 01-222 - Lighting
                  in_use:
                    type: boolean
                    description: Whether this segment item is currently referenced by at least one entity (e.g., a budget line item or WBS code).
                    example: true
                  segment:
                    type: object
                    description: The WBS segment definition that this segment item belongs to.
                    properties:
                      id:
                        type: integer
                        description: Unique ID of the WBS segment definition.
                        example: 3
                      name:
                        type: string
                        description: Display name of the segment (e.g., 'Cost Code', 'Sub Job').
                        example: Cost Code
                      type:
                        type: string
                        enum:
                        - cost_code
                        - line_item_type
                        - sub_job
                        - custom
                        - attribute
                        description: 'Category of this segment. One of: ''cost_code'', ''line_item_type'', ''sub_job'', ''custom'', ''attribute''. Determines which domain entity backs the segment items.'
                        example: cost_code
                      position:
                        type: integer
                        description: Display order of this segment within the WBS pattern. Lower numbers appear first when reading the flat_code left to right.
                        example: 1
                      delimiter:
                        type: string
                        description: Character used to separate this segment's value from adjacent segments in the flat_code (e.g., '.').
                        example: .
                      required:
                        type: boolean
                        description: Whether this segment must have a value for a WBS code to be valid.
                        example: true
                      segment_items_count:
                        type: integer
                        description: Total number of segment items defined for this segment.
                        example: 2
                      project_can_modify_origin_project:
                        type: boolean
                        description: Whether project-level users can modify segment items that originated from this project.
                        example: true
                      project_can_delete_origin_company:
                        type: boolean
                        description: Whether project-level users can delete segment items that originated from the company level.
                        example: true
                      structure:
                        type: string
                        enum:
                        - tiered
                        - flat
                        description: Hierarchy structure of the segment. 'flat' means items have no parent-child relationship; 'tiered' means items can be nested with parent_id references.
                        example: tiered
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when this segment definition was created, in ISO 8601 format.
                        example: '2016-06-30T20:41:58Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when this segment definition was last updated, in ISO 8601 format.
                        example: '2016-08-30T18:11:43Z'
                      wbs_pattern_id:
                        type: integer
                        description: ID of the WBS pattern this segment belongs to.
                        example: 4567
                    example:
                      id: 3
                      name: Cost Code
                      type: cost_code
                      position: 1
                      delimiter: .
                      required: true
                      segment_items_count: 2
                      project_can_modify_origin_project: true
                      project_can_delete_origin_company: true
                      structure: tiered
                      created_at: '2016-06-30T20:41:58Z'
                      updated_at: '2016-08-30T18:11:43Z'
                      wbs_pattern_id: 4567
                  status:
                    type: string
                    enum:
                    - active
                    - inactive
                    description: 'Lifecycle status of the segment item. One of: ''active'' (available for selection when creating WBS codes), ''inactive'' (not available for new WBS codes).'
                    example: active
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  exception:
                    type: string
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'PATCH',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/work_breakdown_structure/segments/%7Bsegment_id%7D/segment_items/%7Bid%7D',\n  qs: {standard_cost_code_list_id: 'SOME_INTEGER_VALUE'},\n  headers: {'content-type': 'application/json'},\n  body: {\n    code: '300',\n    name: 'Concrete',\n    status: 'active',\n    parent_id: 34,\n    default_uom_id: 5\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"code\":\"300\",\"name\":\"Concrete\",\"status\":\"active\",\"parent_id\":34,\"default_uom_id\":5}"


          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v1.0/companies/%7Bcompany_id%7D/work_breakdown_structure/segments/%7Bsegment_id%7D/segment_items/%7Bid%7D?standard_cost_code_list_id=SOME_INTEGER_VALUE", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request PATCH \\\n  --url 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/work_breakdown_structure/segments/%7Bsegment_id%7D/segment_items/%7Bid%7D?standard_cost_code_list_id=SOME_INTEGER_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"code\":\"300\",\"name\":\"Concrete\",\"status\":\"active\",\"parent_id\":34,\"default_uom_id\":5}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Patch,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/work_breakdown_structure/segments/%7Bsegment_id%7D/segment_items/%7Bid%7D?standard_cost_code_list_id=SOME_INTEGER_VALUE\"),\n    Content = new StringContent(\"{\\\"code\\\":\\\"300\\\",\\\"name\\\":\\\"Concrete\\\",\\\"status\\\":\\\"active\\\",\\\"parent_id\\\":34,\\\"default_uom_id\\\":5}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
