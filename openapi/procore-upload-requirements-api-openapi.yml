openapi: 3.2.0
info:
  title: Procore REST Upload Requirements API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Upload Requirements
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/document_management/upload_requirements:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      description: Returns a list of Upload Requirements for the Project
      operationId: ProjectUploadRequirementsV2Controller_getProjectUploadRequirementListV2_0
      parameters:
      - name: company_id
        required: true
        in: path
        description: Company ID
        schema:
          type: string
      - name: project_id
        required: true
        in: path
        description: Project ID
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: per_page
        required: false
        in: query
        description: Elements per page
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: locale
        required: false
        in: query
        description: Language for the response to be translated into
        schema:
          type: string
          enum:
          - de-DE
          - en-AE
          - en-AU
          - en-CA
          - en-GB
          - en-SG
          - en
          - es-ES
          - es
          - fr-CA
          - fr-FR
          - is-IS
          - ja-JP
          - pl-PL
          - pseudo
          - pt-BR
          - th-TH
          - zh-SG
          - zh-TW
          - nb-NO
          - pt-PT
          - it-IT
      responses:
        '200':
          description: Returns Upload Requirements for the Project
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: number
            Total:
              description: Total number of items to be retrieved
              schema:
                type: number
            Link:
              description: Link headers for the first, prev, next and last link
              schema:
                type: string
