                  - line_item_guid
                  type: object
                  properties:
                    quantity:
                      type:
                      - number
                      - 'null'
                      format: double
                    date_time:
                      type:
                      - string
                      - 'null'
                      format: date-time
                    location:
                      type:
                      - integer
                      - 'null'
                      format: int64
