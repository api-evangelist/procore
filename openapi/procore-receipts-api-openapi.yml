    get:
      tags:
      - Receipts
      summary: Get paginated receipt line items for a receipt with specified id
      description: 'Returns a paginated list of line items for the specified receipt.

        Supports view types: Normal (default), Compact, and Id.'
      operationId: Receipts_GetAllLineItems
      parameters:
      - name: filters[show_void]
        in: query
        description: 'Whether to include line items with VOID line status.

          Defaults to true.'
        schema:
          type: boolean
        required: false
      - name: filters[condition]
        in: query
        description: Filter by condition
        schema:
          type: string
        required: false
      - name: filters[storage_location]
        in: query
        description: Filter by storage location ID
        schema:
          type: integer
          format: int64
        required: false
      - name: filters[columns]
        in: query
        description: Filter by dynamic columns (comma separated)
        schema:
          type: string
        required: false
      - name: view
        in: query
        description: Response view type
        schema:
          enum:
          - Id
          - Compact
          - Normal
          - Mobile
          type: string
        required: false
      - name: per_page
        in: query
        description: The page size between 1 and 100. For Ids view the maximum page size is 5000.
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
        required: false
      - name: filters[labels]
        in: query
        description: Filter for labels (comma separated).
        schema:
          type: string
        required: false
      - name: filters[id]
        in: query
        description: Filter by line item ID
        schema:
          type: string
        required: false
      - name: sort
        in: query
        description: The sort string
        schema:
          type: string
          description: The sort string
        required: false
      - name: filters[search]
        in: query
        description: The search term
        schema:
          type: string
          description: The search term
        required: false
      - name: page
        in: query
        description: The page number
        schema:
          type: integer
          description: The page number
          format: int32
        required: false
      - name: id
        in: path
        description: Receipt id
        required: true
        schema:
          type: string
          format: uuid
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: The number of items per page
              schema:
                type: integer
