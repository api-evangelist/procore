            schema:
              type: object
              properties:
                quantity_expected:
                  type:
                  - number
                  - 'null'
                  format: double
                quantity_received:
                  type:
                  - number
                  - 'null'
                  format: double
                void:
                  type:
                  - boolean
                  - 'null'
                notes:
                  type:
                  - string
                  - 'null'
              additionalProperties: false
