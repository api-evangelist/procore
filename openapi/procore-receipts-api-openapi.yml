  /rest/v2.0/companies/{company_id}/projects/{project_id}/materials_mgmt/receipts/line_items:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      tags:
      - Receipts
      summary: Get paginated receipt line items
      description: 'Returns a paginated list of receipt line items across all receipts in the project.

        Supports view types: Normal (default), Short, Mobile, and Id.'
      operationId: Receipts_GetReceiptLineItems
      parameters:
      - name: filters[show_void]
        in: query
        description: 'Whether to include line items with VOID line status.

          Defaults to true.'
        schema:
          type: boolean
        required: false
      - name: filters[material_types]
        in: query
        description: Filter by line item material types (comma separated)
        schema:
          type: string
        required: false
      - name: filters[material_property_key]
        in: query
        description: Filter by line item material property key (comma separated)
        schema:
          type: string
        required: false
      - name: filters[material_property_value]
        in: query
        description: Filter by line item material property value (comma separated)
        schema:
          type: string
        required: false
      - name: filters[received_at]
        in: query
        description: 'Raw date range string for received_at filter. Format: [YYYY-MM-DD...YYYY-MM-DD] (e.g. [2026-01-01...2026-12-31]).

          Setting this constructs Adapter.Api.Controller.rest.v2.ReceiptRequest.Read.ReceiptsRequest.dates.'
        schema:
          type: string
        required: false
      - name: filters[created_at]
        in: query
        description: 'Raw date range string for created_at filter. Format: [YYYY-MM-DD...YYYY-MM-DD] (e.g. [2026-01-01...2026-12-31]).'
        schema:
          type: string
        required: false
      - name: filters[updated_at]
        in: query
        description: 'Raw date range string for updated_at filter. Format: [YYYY-MM-DD...YYYY-MM-DD] (e.g. [2026-01-01...2026-12-31]).'
        schema:
          type: string
        required: false
      - name: filters[status]
        in: query
        description: Filter by receipt status(es)
        schema:
          type: array
          items:
            enum:
            - STARTED
            - IN_REVIEW
            - COMPLETE
            - COMPLETE_HANDOVER
            - DEFECTS
            - VOID
            type: string
        required: false
      - name: filters[state]
        in: query
        description: Filter by receipt state. Multiple values supported as comma-separated string.
        schema:
          type: string
        required: false
      - name: filters[condition]
        in: query
        description: Receipt condition value; serialized in UPPER_SNAKE_CASE via Core.JsonConverters.UpperSnakeCaseConverter.
        schema:
          type: string
        required: false
      - name: filters[site]
        in: query
        description: Site identifier filter.
        schema:
          type: string
        required: false
      - name: filters[location_received]
        in: query
        description: Location where the receipt was received.
        schema:
          type: string
        required: false
      - name: filters[columns]
        in: query
        description: Comma-separated column keys controlling dynamic projection (e.g. "id,status,site").
        schema:
          type: string
        required: false
      - name: filters[show_recycled]
        in: query
        description: Whether to include recycled receipts.
        schema:
          type: boolean
        required: false
      - name: view
        in: query
        description: Response view type
        schema:
          enum:
          - Id
          - Compact
          - Short
          - Normal
          - Mobile
          type: string
        required: false
      - name: per_page
        in: query
        description: The page size between 1 and 100. For Ids view the maximum page size is 5000.
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 10
        required: false
      - name: filters[labels]
        in: query
        description: Comma-separated label identifiers.
        schema:
          type: string
        required: false
      - name: filters[associated_doc_ids]
        in: query
        description: Comma-separated associated document IDs.
        schema:
          type: string
        required: false
      - name: filters[receipt_id]
        in: query
        description: Comma-separated receipt IDs.
        schema:
          type: string
        required: false
      - name: filters[id]
        in: query
        description: Comma-separated internal record IDs.
        schema:
          type: string
        required: false
      - name: filters[vendor]
        in: query
        description: Comma-separated vendor identifiers.
        schema:
          type: string
        required: false
      - name: filters[property_key]
        in: query
        description: Dynamic property key for document property filtering.
