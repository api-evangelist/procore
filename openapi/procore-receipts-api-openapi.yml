  /rest/v2.0/companies/{company_id}/projects/{project_id}/materials_mgmt/receipts/{id}/line_items/bulk_create:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      tags:
      - Receipts
      summary: Adds multiple line items to a draft receipt in bulk
      description: 'This method processes the bulk creation of line items for a draft receipt. It validates the

        receipt ID and forwards the request to the receipt service for processing. The response includes the created

        line items or an error message if the operation fails.'
      operationId: Receipts_AddLinesToDraftReceipt
      parameters:
      - name: id
        in: path
        description: The unique identifier of the draft receipt. Must not be an empty GUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Array of line item creation requests.
        content:
          application/json:
            schema:
              oneOf:
              - title: CreateReceiptLinesFromShipmentRequest
                allOf:
                - required:
                  - shipment_id
                  type: object
                  properties:
                    shipment_id:
                      type: string
                      description: 'Creates receipt lines by importing all line items from an existing shipment.

                        Use this when the receipt should reflect items that were shipped via a specific shipment document.'
                      format: uuid
                  additionalProperties: false
              - title: CreateReceiptLinesFromPurchaseOrderRequest
                allOf:
                - required:
                  - order_id
                  type: object
                  properties:
                    order_id:
                      type: string
                      description: 'Creates receipt lines by importing all line items from a purchase order.

                        Use this when the receipt should reflect items that were ordered via a specific purchase order.'
                      format: uuid
                  additionalProperties: false
              - title: CreateReceiptLinesFromLinesRequest
                allOf:
                - required:
                  - line_items
                  type: object
                  properties:
                    line_items:
                      type: array
                      items:
                        required:
                        - line_item_guid
                        type: object
                        properties:
                          quantity:
                            type:
                            - number
                            - 'null'
                            format: double
                          date_time:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          location:
                            type:
                            - integer
                            - 'null'
                            format: int64
                          line_item_guid:
                            type: string
                            description: 'Creates a receipt line by referencing an existing line item using its GUID.

                              Use this when the source line item is already known by its unique identifier.'
                            format: uuid
                        additionalProperties: false
                      description: 'Creates receipt lines from a collection of existing line items identified by their GUIDs.

                        Use this when receiving specific line items that are already tracked in another document.'
                  additionalProperties: false
              - title: CreateReceiptLinesFromItemRequest
                allOf:
                - required:
                  - items
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        required:
                        - item_id
                        type: object
                        properties:
                          quantity:
                            type:
                            - number
                            - 'null'
                            format: double
                          date_time:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          location:
                            type:
                            - integer
                            - 'null'
                            format: int64
                          item_id:
                            type: string
                            description: Material catalog item ID to create a receipt line from.
                            format: uuid
                        additionalProperties: false
                      description: 'Creates receipt lines from a collection of material catalog items.

                        Use this when receiving items that are not yet associated with a shipment or purchase order.'
                  additionalProperties: false
              additionalProperties: false
              description: Create receipt lines request
