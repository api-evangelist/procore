    patch:
      tags:
      - Receipts
      summary: Updates a single receipt line item
      description: 'This endpoint allows updating properties (such as date, quantity, status, and location) for a specific receipt line item.

        The receipt must not be in a Final state, except when voiding.

        Set `void` to true to void the line item (quantity to 0). A note may be supplied on the same request.

        Voiding requires a Final receipt, admin access, and the materials_management_void-enabled feature flag.

        If the input is invalid or the line item doesn''t exist, a 400 Bad Request response is returned.'
      operationId: Receipts_PatchLineItem
      parameters:
      - name: receipt_id
        in: path
        description: Receipt id
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        description: Line item id
        required: true
        schema:
          type: string
          format: uuid
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: A Core.Models.Receipts.ReceiptLineUpdate object containing the properties to update.
        content:
