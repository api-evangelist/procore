openapi: 3.2.0
info:
  title: Procore REST Capital Planning — Snapshots API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Capital Planning — Snapshots
paths:
  /rest/v1.0/companies/{company_id}/capital_planning/snapshots:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      description: Returns the company's non-deleted snapshots, newest first (shared across the company).
      operationId: SnapshotsController_list_rest/v1.0
      parameters:
      - name: company_id
        required: true
        in: path
        description: Procore company identifier
        schema:
          type: string
      responses:
        '200':
          description: Snapshot summaries
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '42'
                        name:
                          type: string
                          example: Approved FY27 Plan
                        description:
                          type:
                          - string
                          - 'null'
                          example: Board-approved baseline
                        created_by_name:
                          type:
                          - string
                          - 'null'
                          example: Jane Owner
                          description: Creator display name from the company directory; null until the build worker resolves it (or if the directory lookup fails). Clients fall back to created_by_user_id.
                        created_by_user_id:
                          type: string
                          example: '1048576'
                        status:
                          allOf:
                          - type: string
                            enum:
                            - pending
                            - processing
                            - completed
                            - failed
                        created_at:
                          type: string
                          example: '2026-08-03T12:00:00.000Z'
                      required:
                      - id
                      - name
                      - description
                      - created_by_name
                      - created_by_user_id
                      - status
                      - created_at
        '403':
          description: Access denied — `TOOL_NOT_ACTIVATED`, `INSUFFICIENT_PERMISSIONS`, `READONLY_ACCESS`, or `ADMIN_ACCESS_REQUIRED`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            message:
                              type: string
                          required:
                          - field
                          - message
                    required:
                    - code
                    - message
                    - details
                required:
                - error
        '503':
          description: The permission check could not be completed (`AUTHORIZATION_UNAVAILABLE`) — safe to retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            message:
                              type: string
                          required:
                          - field
                          - message
                    required:
                    - code
                    - message
                    - details
                required:
                - error
      summary: List snapshots
      tags:
      - Capital Planning — Snapshots
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/capital_planning/snapshots',\n  headers: {'Procore-Company-Id': 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Procore-Company-Id'': "SOME_STRING_VALUE" }


          conn.request("GET", "/rest/v1.0/companies/%7Bcompany_id%7D/capital_planning/snapshots", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/capital_planning/snapshots \\\n  --header 'Procore-Company-Id: SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/capital_planning/snapshots\"),\n    Headers =\n    {\n        { \"Procore-Company-Id\", \"SOME_STRING_VALUE\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
    post:
      description: Validates and creates a pending snapshot, returns 202 immediately, and copies the live plan in the background.
      operationId: SnapshotsController_create_rest/v1.0
      parameters:
      - name: company_id
        required: true
        in: path
        description: Procore company identifier
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Approved FY27 Plan
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 2000
                table_config:
                  type: object
                  additionalProperties: true
                  example:
                    saved_view_id: null
                    columns: []
                    filters: {}
                hierarchy_view:
                  example: structured
                  allOf:
                  - type: string
                    enum:
                    - structured
                    - flat
                    description: The view (structured | flat) the snapshot was created in. Null when the hierarchy was off at creation or the snapshot predates the field.
              required:
              - name
      responses:
        '202':
          description: Pending snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: '42'
                  name:
                    type: string
                    example: Approved FY27 Plan
                  description:
                    type:
                    - string
                    - 'null'
                    example: Board-approved baseline
                  created_by_name:
                    type:
                    - string
                    - 'null'
                    example: Jane Owner
                    description: Creator display name from the company directory; null until the build worker resolves it (or if the directory lookup fails). Clients fall back to created_by_user_id.
                  created_by_user_id:
                    type: string
                    example: '1048576'
                  status:
                    allOf:
                    - type: string
                      enum:
                      - pending
                      - processing
                      - completed
                      - failed
                  created_at:
                    type: string
                    example: '2026-08-03T12:00:00.000Z'
                  table_config:
                    type: object
                    additionalProperties: true
                  hierarchy_view:
                    description: The view (structured | flat) the snapshot was created in. Null when the hierarchy was off at creation or the snapshot predates the field.
                    allOf:
                    - type: string
                      enum:
                      - structured
                      - flat
                      description: The view (structured | flat) the snapshot was created in. Null when the hierarchy was off at creation or the snapshot predates the field.
                  updated_at:
                    type: string
                    example: '2026-08-03T12:00:05.000Z'
                required:
                - id
                - name
                - description
                - created_by_name
                - created_by_user_id
                - status
                - created_at
                - table_config
                - hierarchy_view
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            message:
                              type: string
                          required:
                          - field
                          - message
                    required:
                    - code
                    - message
                    - details
                required:
                - error
