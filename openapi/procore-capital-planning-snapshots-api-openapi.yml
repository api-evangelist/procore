        content: "import http.client\n\nconn = http.client.HTTPSConnection(\"api.procore.com\")\n\npayload = \"{\\\"name\\\":\\\"Approved FY27 Plan\\\",\\\"description\\\":\\\"string\\\",\\\"table_config\\\":{\\\"saved_view_id\\\":null,\\\"columns\\\":[],\\\"filters\\\":{}},\\\"hierarchy_view\\\":\\\"structured\\\"}\"\n\nheaders = {\n    'Procore-Company-Id': \"SOME_STRING_VALUE\",\n    'content-type': \"application/json\"\n    }\n\nconn.request(\"POST\", \"/rest/v1.0/companies/%7Bcompany_id%7D/capital_planning/snapshots\", payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
