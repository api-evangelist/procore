                            type: integer
                            description: ID of the user who created the snapshot.
                            example: 1234
                          name:
                            type: string
                            description: Full name of the user who created the snapshot.
                            example: John Doe
                          login:
                            type: string
                            description: Login email address of the user who created the snapshot.
                            example: john.doe@example.com
                      budget_view:
                        type: object
                        description: The budget view this snapshot was taken from.
                        properties:
                          id:
                            type: integer
                            description: ID of the budget view this snapshot was taken from.
                            example: 1234
                      snapshot_type:
                        type: string
                        enum:
                        - ad_hoc
                        - project_status_snapshot
                        description: Kind of snapshot. Use filters[snapshot_type] to filter collections by this value.
                        example: ad_hoc
                      approval_status:
                        type: string
                        enum:
                        - approved
                        - under_review
                        - custom
                        description: Review state of the snapshot. Present for project status snapshots; when a company-defined custom status applies, see the status object. Use filters[approval_status] to filter collections by this value.
                        example: approved
                      status:
                        type: object
                        description: The company-defined custom status assigned to the snapshot. Present for project status snapshots that have a custom status assigned.
                        properties:
                          id:
                            type: string
                            description: Identifier of the custom status.
                            example: '1234'
                          name:
                            type: string
                            description: Display name of the custom status.
                            example: Approved
                          mapped_to_status:
                            type: string
                            enum:
                            - open
                            - closed
