                            type: boolean
                            description: Whether the custom status can currently be selected for snapshots.
                            example: true
                          initial:
                            type: boolean
                            description: Whether this custom status is the default applied to newly created snapshots.
                            example: false
                          standard_type:
                            type: string
                            enum:
                            - approved
                            - under_review
                            - custom
                            description: The underlying standard category of the custom status.
                            example: approved
                          created_at:
                            type: string
                            description: Timestamp when the custom status was created, in ISO 8601 format.
                            example: '2018-01-17T18:09:03Z'
                          updated_at:
                            type: string
                            description: Timestamp when the custom status was last updated, in ISO 8601 format.
                            example: '2018-01-17T18:09:03Z'
                      financial_period_id:
                        type:
                        - integer
                        - 'null'
                        deprecated: true
                        description: Obsolete. Identifier of the financial period the snapshot is assigned to. Use the `financial_period` object instead; this field is retained only for backward compatibility.
                        example: 42
                      date_range_for_actuals:
                        type:
                        - array
                        - 'null'
                        description: Start and end dates that bound the actuals captured in the snapshot, in ISO 8601 format. Null when the snapshot was generated without an actuals date range.
                        items:
                          type: string
                          format: date
                        example:
                        - '2024-01-01'
                        - '2024-12-31'
                      include_actuals_without_dates:
                        type:
                        - boolean
                        - 'null'
                        description: Whether actuals with no date were included alongside the date-ranged actuals when the snapshot was generated. Null when no actuals date range was applied.
                        example: true
                      forecast_start_date:
                        type:
                        - string
                        - 'null'
                        format: date
                        description: Date from which forecasting calculations begin for this snapshot. Null when forecasting was not applied.
                        example: '2024-01-01'
                      financial_period:
                        type:
                        - object
                        - 'null'
                        description: The financial period the snapshot is assigned to. Present for project status snapshots that have a period assigned; null otherwise (including ad hoc snapshots).
                        properties:
                          id:
                            type: string
                            description: Identifier of the financial period
                            example: '1234'
                          name:
                            type: string
                            description: Display name of the financial period
                            example: January 2026
                          group_name:
                            type: string
                            description: Name of the group the financial period belongs to
                            example: FY2026
                          status:
                            type: string
                            enum:
                            - open
                            - closed
                            description: Whether the financial period is currently open or closed
                            example: open
                          start_date:
                            type: string
                            description: First day of the financial period
                            example: '2026-01-01'
                          end_date:
                            type: string
                            description: Last day of the financial period
                            example: '2026-01-31'
                      links:
                        type: object
                        description: URLs for retrieving the row data captured in this snapshot.
                        properties:
                          detail_rows:
                            type: string
                            description: URL to fetch the Snapshot Detail Rows for this budget view snapshot.
