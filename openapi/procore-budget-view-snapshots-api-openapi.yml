      summary: List Budget View Snapshots
      description: Returns a list of project-level snapshots for both project status and ad hoc. You can filter by type.
      tags:
      - Budget View Snapshots
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[budget_template_id]
        in: query
        description: Return snapshot(s) using the specified budget template id.
        required: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[budget_view_id]
        in: query
        description: Return snapshot(s) using the specified budget view id. (This will replace budget_template_id filter)
        required: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[snapshot_type]
        in: query
        description: Return snapshot(s) of the specified type.
        required: false
        schema:
          type: string
          enum:
          - ad_hoc
          - project_status_snapshot
      - name: filters[approval_status]
        in: query
        description: Return snapshot(s) in the specified status.
        required: false
        schema:
          type: string
          enum:
          - approved
          - under_review
      - name: sort
        in: query
        description: Direction (asc/desc) can be controlled by the presence or absence of '-' before the sort parameter
        schema:
          type: string
          enum:
          - snapshot_type
          - approval_status
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Budget View Snapshots
                items:
                  oneOf:
                  - type: object
                    description: Budget View Snapshot
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the budget view snapshot. Use as the {budget_view_snapshot_id} path parameter to retrieve its summary rows or detail rows.
                        example: 75414
                      name:
                        type: string
                        description: Display name of the snapshot.
                        example: January Snapshot
                      description:
                        type: string
                        description: Free-text description of the snapshot.
                        example: This is the January Budget Snapshot
                      created_at:
                        type: string
                        description: Timestamp when the snapshot was created, in ISO 8601 format.
                        example: '2018-01-17T18:09:03Z'
                      created_by:
                        type: object
                        description: User who created the snapshot.
                        properties:
                          id:
                            type: integer
                            description: ID of the user who created the snapshot.
                            example: 1234
                          name:
                            type: string
                            description: Full name of the user who created the snapshot.
                            example: John Doe
                          login:
                            type: string
                            description: Login email address of the user who created the snapshot.
                            example: john.doe@example.com
                      budget_view:
                        type: object
                        description: The budget view this snapshot was taken from.
                        properties:
                          id:
                            type: integer
                            description: ID of the budget view this snapshot was taken from.
                            example: 1234
                      links:
                        type: object
                        description: URLs for retrieving the row data captured in this snapshot.
                        properties:
                          detail_rows:
                            type: string
                            description: URL to fetch the Snapshot Detail Rows for this budget view snapshot.
                            example: https://app.procore.com/rest/v1.0/budget_view_snapshots/1/detail_rows?project_id=2
                          summary_rows:
                            type: string
                            description: URL to fetch the Snapshot Summary Rows for this budget view snapshot.
                            example: https://app.procore.com/rest/v1.0/budget_view_snapshots/1/summary_rows?project_id=2
                  - type: object
                    description: Budget View Snapshot
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the budget view snapshot. Use as the {budget_view_snapshot_id} path parameter to retrieve its summary rows or detail rows.
                        example: 75414
                      name:
                        type: string
