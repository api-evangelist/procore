openapi: 3.2.0
info:
  title: Procore REST Budget View Snapshots API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Budget View Snapshots
paths:
  /rest/v1.0/budget_view_snapshots/{budget_view_snapshot_id}/detail_rows:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      deprecated: true
      x-deprecated-at: '2026-09-28'
      x-sunset: '2027-09-30'
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Budget View Snapshot Detail Rows
      description: '**Deprecated.** This endpoint is deprecated and will be removed on 2027-09-30. Use `GET /rest/v2.0/companies/{company_id}/projects/{project_id}/budget_views/{budget_view_id}/detail_rows` with the `source_snapshot_id` query parameter instead — see Budget Detail Rows (v2.0). Column metadata for the v2.0 response (labels, types, formats) comes from Budget View (v2.0).


        Returns a list of all budget view snapshots detail rows for project status and ad hoc types.


        Note: In addition to all the fields outlined in the response, there will be an additional key for each visible

        source and formula column created for the particular budget view. As well, when using a Forecasting View ID, additional keys

        will be visible that give calculated forecasts for each month, as defined by the Advanced Forecasting Tool.'
      tags:
      - Budget View Snapshots
      parameters:
      - name: budget_view_snapshot_id
        in: path
        description: Budget View Snapshot ID
        required: true
        schema:
          type: integer
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: biller[]
        in: query
        description: Return item(s) within a specific biller. Format is biller[]=id=1,type=SubJob or biller[]=id=1,type=Project
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: cost_code_id[]
        in: query
        description: Return item(s) within a specific Cost Code id or range of Cost Code IDs
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: cost_code_name[]
        in: query
        description: Return item(s) within a specific Cost Code name or range of Cost Code names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: root_cost_code_id[]
        in: query
        description: Return item(s) within a specific Root Cost Code id or range of Root Cost Code IDs
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: root_cost_code_name[]
        in: query
        description: Return item(s) within a specific Root Cost Code name or range of Root Cost Code names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: category_id[]
        in: query
        description: Return item(s) within a specific category id (line item type id) or range of category IDs
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: budget_line_item_id[]
        in: query
        description: Return item(s) within a specific budget line item id or range of budget line item IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: sort
        in: query
        description: 'Return item(s) with the specified sort. Default is biller_type,biller,root_cost_code,cost_code,category_id

          '
        schema:
          type: string
          enum:
          - biller_type
          - project
          - biller
          - category_id
          - cost_code
          - root_cost_code
      - name: budget_row_type
        in: query
        required: false
        description: Return budgeted, unbudgeted or all item(s) from all budget rows for a project. Default is all. Note that when the unbudgeted or all values are supplied, the id field will be null for rows that have budgeted false
        schema:
          type: string
          enum:
          - budgeted
          - unbudgeted
          - all
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Budget View Snapshot Detail Rows
                items:
                  type: object
                  description: Budget View Detail Row
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the budget line item backing this row. May be null for unbudgeted rows.
                      example: 75414
                    deletable:
                      type: boolean
                      description: Indicates whether the underlying budget line item can be deleted.
                      example: true
                    budgeted:
                      type: boolean
                      description: Indicates whether this row has an associated budget line item.
                      example: true
                    budgetable:
                      type: boolean
                      description: Indicates whether this row's cost code and cost type combination can be budgeted.
                      example: true
                    company_id:
                      type: integer
                      description: ID of the company that owns the project this row belongs to.
                      example: 75414
                    company:
                      type: string
                      description: Name of the company that owns the project.
                      example: Acme Construction
                    project_id:
                      type: integer
                      description: ID of the project this budget row belongs to.
                      example: 75414
                    wbs_code_id:
                      type:
                      - integer
                      - 'null'
                      description: ID of the Work Breakdown Structure (WBS) code for this row. Null when WBS information is not available.
                      example: 75414
                    biller_id:
                      type: integer
                      description: ID of the biller (sub job or project) the row is attributed to.
                      example: 75414
                    root_cost_code_id:
                      type: integer
                      description: ID of the root cost code (division) grouping this row.
                      example: 75414
                    cost_code_id:
                      type: integer
                      description: ID of the cost code for this row.
                      example: 75414
                    cost_code_origin_id:
                      type:
                      - string
                      - 'null'
                      description: External system identifier for the cost code, if integrated. Null when not set.
                      example: abc-123
                    category_id:
                      type: integer
                      description: ID of the line item type (cost type) category for this row.
                      example: 75414
                    project:
                      type: string
                      description: Name of the project this row belongs to.
                      example: Downtown Office Tower
                    biller:
                      type: string
                      description: Name of the biller (sub job or project) the row is attributed to.
                      example: Floor 1
                    biller_type:
                      type: string
                      enum:
                      - Project
                      - SubJob
                      description: Whether the biller is the project itself or a sub job.
                      example: SubJob
                    root_cost_code:
                      type: string
                      description: Name of the root cost code (division).
                      example: '1'
                    cost_code:
                      type: string
                      description: Name of the cost code.
                      example: '300'
                    category:
                      type: string
                      description: Name of the line item type (cost type), such as Labor or Equipment.
                      example: Labor
                    curve:
                      type:
                      - string
                      - 'null'
                      description: Distribution curve used to spread this line's budget over the schedule. Null when no curve is set.
                      enum:
                      - front_loaded
                      - bell
                      - back_loaded
                      - linear
                      - manual
                      example: linear
                    start_date:
                      type:
                      - string
                      - 'null'
                      description: Formatted start date of the line's budgeted schedule. Null when no date range is set.
                      example: Jan 1, 2024
                    end_date:
                      type:
                      - string
                      - 'null'
                      description: Formatted end date of the line's budgeted schedule. Null when no date range is set.
                      example: Dec 31, 2024
                    budget_modifications:
                      type: string
                      format: float
                      description: Net amount transferred to or from this row via budget modifications.
                      example: '3000.00'
                    original_budget_amount:
                      type: string
                      format: float
                      description: Original budgeted amount for this row, before any budget changes.
                      example: '50000.00'
                    budget_forecast:
                      type: object
                      description: Forecasted budget detail for this row.
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the budget forecast record.
                          example: 123
                        manual_amount:
                          type: string
                          format: float
                          description: Forecast amount entered manually by a user.
                          example: '20000.00'
                        automatic_amount:
                          type: string
                          format: float
                          description: Forecast amount calculated automatically by the system.
                          example: '20000.00'
                        amount:
                          type: string
                          format: float
                          description: Effective forecast amount in use, either the manual_amount or the automatic_amount.
                          example: '20000.00'
                        automatically_calculated:
                          type: boolean
                          description: True when amount is the automatic_amount; false when amount is the manual_amount.
                          example: true
                        calculation_strategy:
                          type: string
                          description: How the forecast amount is calculated, such as 'itemized'.
                          example: itemized
                        notes:
                          type: string
                          description: Free-text notes about the budget forecast.
                          example: forecast notes
                    currency_configuration:
                      type: object
                      description: Currency in which this row's monetary amounts are denominated.
                      properties:
                        currency_iso_code:
                          type: string
                          description: ISO 4217 currency code for the row's amounts.
                          example: USD
                    unbudgeted_reason:
                      type: string
                      description: Explanation of why this row has no associated budget line item. Present only for unbudgeted rows.
                      example: Cost Code and Cost Type have not been budgeted.
                  additionalProperties: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
