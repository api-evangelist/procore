  /rest/v1.0/budget_view_snapshots/{budget_view_snapshot_id}/summary_rows:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      deprecated: true
      x-deprecated-at: '2026-09-28'
      x-sunset: '2027-09-30'
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Budget View Snapshot Summary Rows
      description: '**Deprecated.** This endpoint is deprecated and will be removed on 2027-09-30. Use `GET /rest/v2.0/companies/{company_id}/projects/{project_id}/budget_views/{budget_view_id}/summary_rows` with the `source_snapshot_id` query parameter instead — see Budget Summary Rows (v2.0). Column metadata for the v2.0 response (labels, types, formats) comes from Budget View (v2.0).


        Returns a list of all budget view snapshots summary rows for project status and ad hoc types.

        The type of row returned is dependent on

        the value used in the group_by query param.


        Note: In addition to all the fields outlined in the response, there will be an additional key for each visible

        standard, source, and formula column created for the particular budget view.'
      tags:
      - Budget View Snapshots
      parameters:
      - name: budget_view_snapshot_id
        in: path
        description: Budget View Snapshot ID
        required: true
        schema:
          type: integer
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: biller[]
        in: query
        description: Return item(s) within a specific biller. Format is biller[]=id=1,type=SubJob or biller[]=id=1,type=Project
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: cost_code_id[]
        in: query
        description: Return item(s) within a specific Cost Code id or range of Cost Code IDs
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: cost_code_name[]
        in: query
        description: Return item(s) within a specific Cost Code name or range of Cost Code names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: root_cost_code_id[]
        in: query
        description: Return item(s) within a specific Root Cost Code id or range of Root Cost Code IDs
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: root_cost_code_name[]
        in: query
        description: Return item(s) within a specific Root Cost Code name or range of Root Cost Code names
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: category_id[]
        in: query
        description: Return item(s) within a specific category id (line item type id) or range of category IDs
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: budget_line_item_id[]
        in: query
        description: Return item(s) within a specific budget line item id or range of budget line item IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: group_by
        in: query
        description: Groups the data. Value can be a comma separated string. Default is biller,root_cost_code
        schema:
          type: string
          enum:
          - project
          - biller
          - category
          - cost_code
          - root_cost_code
          - cost_code_name
          - root_cost_code_name
      - name: budget_row_type
        in: query
        required: false
        description: Return budgeted, unbudgeted or all item(s) from all budget rows for a project. Default is all. Note that when the unbudgeted or all values are supplied, the subtotals may change depending on the presence of rows that have budgeted false
        schema:
          type: string
          enum:
          - budgeted
          - unbudgeted
          - all
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Budget View Snapshot Summary Rows
                items:
                  type: object
                  description: Budget View Snapshot Summary Row
                  properties:
                    id:
                      type: string
                      description: Identifier of the entity this snapshot summary row aggregates (e.g. a cost code, category, or biller, depending on the group_by used).
                      example: 75414
                    name:
                      type: string
                      description: Display name of the entity this snapshot summary row aggregates.
                      example: Labor
                    biller_type:
                      type: string
                      enum:
                      - Project
                      - SubJob
                      description: Whether the biller is the project itself or a sub job. Populated only when grouping by biller.
                      example: SubJob
                    budget_line_item_ids:
                      type: array
                      description: IDs of the budget line items captured in this snapshot that roll up into this group.
                      items:
                        type: string
                        example: '123'
                  additionalProperties: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
