        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/budget_view_snapshots/%7Bbudget_view_snapshot_id%7D/detail_rows',\n  qs: {\n    project_id: 'SOME_INTEGER_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'biller[]': 'SOME_ARRAY_VALUE',\n    'cost_code_id[]': 'SOME_ARRAY_VALUE',\n    'cost_code_name[]': 'SOME_ARRAY_VALUE',\n    'root_cost_code_id[]': 'SOME_ARRAY_VALUE',\n    'root_cost_code_name[]': 'SOME_ARRAY_VALUE',\n    'category_id[]': 'SOME_ARRAY_VALUE',\n    'budget_line_item_id[]': 'SOME_ARRAY_VALUE',\n    sort: 'SOME_STRING_VALUE',\n    budget_row_type: 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
