                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Is Tax Project Configuration enabled
                        example: false
                      financial_tools:
                        type: object
                        description: Package Settings for each Financial Tool
                        properties:
                          prime_contract:
                            type: boolean
                            description: Is Tax enabled on Prime Contracts
                            example: false
                          purchase_order_contract:
                            type: boolean
                            description: Is Tax enabled on Purchase Order Contracts
                            example: false
                          work_order_contract:
                            type: boolean
                            description: Is Tax enabled on Work Order Contracts
                            example: false
                          direct_costs:
                            type: boolean
                            description: Is Tax enabled on Direct Costs. Defaults to false when no package setting is stored.
                            example: false
                      codes:
                        type: object
                        description: Allow List Data
                        properties:
                          allow_all:
                            type: boolean
                            description: When true, all company-level tax codes are available for this project. When false, only the tax codes listed in tax_codes are available.
                            example: false
                          tax_codes:
                            type: array
                            items:
                              type: object
                              required:
                              - id
                              - default
                              properties:
                                id:
                                  type: string
                                  description: Tax Code ID
                                  example: '1234567890'
                                default:
                                  type: boolean
                                  description: When true, this tax code is pre-selected as the default for new line items in this project.
                                  example: true
                      max_tax_codes_per_line:
                        type: integer
                        description: Maximum number of tax codes that can be applied to a single line item in this project. Determined by the company subscription. Read-only; cannot be set via the update endpoint.
