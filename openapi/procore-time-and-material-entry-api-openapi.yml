        visibility: public
        stage: ga
        exposure: public
      summary: Update Multiple Time And Material Entries
      description: Multiple Time And Material Entries Updated
      tags:
      - Time And Material Entry
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: run_configurable_validations
        in: query
        required: false
        description: If true, validations are run for the corresponding Configurable Field Set.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              title: Time and Material Entry Bulk Update Body
              type: object
              required:
              - time_and_material_entry
              properties:
                time_and_material_entry:
                  title: TimeAndMaterialEntry
                  type: object
                  description: Time and Material Entry Object
                  properties:
                    time_and_material_entry_ids:
                      type: array
                      description: Array of Time & Material entry identifiers to update.
                      items:
                        type: integer
                        description: Unique identifier of a Time & Material entry to update.
                        example: 1200
                    change_event_id:
                      type: integer
                      description: Identifier of the change event to associate with these entries.
                      example: 65
                    update_change_event_attachment:
                      type: boolean
                      description: Whether to sync attachments to the associated change event.
        required: true
      responses:
        '200':
          description: Returns the updated Time And Material Entries
          content:
            application/json:
              schema:
                type: array
                description: Array of Time And Material Entry
                items:
                  type: object
                  description: Time and Material Entry
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the Time & Material entry.
                      example: 1200
                    name:
                      type: string
                      description: Title of the Time & Material ticket.
                      example: Remove all pipes
                    reference_number:
                      type: string
                      description: Reference number associated with this Time & Material ticket.
                      example: ABCDE789
                    description:
                      type: string
                      description: Description of the work performed.
                      example: We focused on removing all damaged pipe
                    status:
                      type: string
                      description: Current lifecycle status of this Time & Material ticket.
                      enum:
                      - in_progress
                      - ready_for_review
                      - field_verified
                      - closed
                      - revise_and_resubmit
                      - rejected
                      example: in_progress
                    private:
                      type: boolean
                      description: Whether this Time & Material ticket is private (visible only to users with admin-level permissions).
                      example: false
                    number:
                      type: integer
                      description: Auto-assigned sequential number for this Time & Material ticket within its project.
                    company_signee_party:
                      description: Party designated as the company-side signee for this ticket.
                      type: object
                      title: extended view
                      properties:
                        employee_id:
                          type:
                          - string
                          - 'null'
                          description: Employee ID for the Party Person
                          example: '123456789'
                        first_name:
                          type: string
                          description: Party Person first name
                          example: Leah
                        id:
                          type: integer
                          description: Unique identifier for the Party Person.
                          example: 381006
                        is_employee:
                          type:
                          - boolean
                          - 'null'
                          description: Employee status for the Party Person
                          example: false
                        last_name:
                          type: string
                          description: Party Person last name
                          example: Russell
                        user_id:
                          type:
                          - integer
                          - 'null'
                          description: User ID if this Party Person represents a User. NULL for a Reference User.
                          example: 700215
                        work_classification:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 57869
                            name:
                              type: string
                              description: The name of the classification
                              example: Driver
                    company_signature:
                      description: Signature provided by the company-side signee.
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the signature.
                          example: 5324
                        signature_text:
                          type: string
                          description: Acknowledgement text the signer agreed to.
                          example: I acknowledge these hours are correct.
                        file_name:
                          type: string
                          description: Filename of the signature image.
                          example: signature_2018_09_16.jpg
                        url:
                          type: string
                          description: Direct URL to the full-size signature image.
                          example: http://www.example.com/
                        medium_thumbnail_url:
                          type: string
                          description: URL for a medium-sized thumbnail of the signature image.
                          example: http://www.example.com/
                        large_thumbnail_url:
                          type: string
                          description: URL for a large-sized thumbnail of the signature image.
                          example: http://www.example.com/
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when this signature was created, in ISO 8601 format.
                          example: '2024-03-15T06:13:10Z'
                        created_by:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier of the user who created this signature.
                              example: 160586
                            login:
                              type: string
                              description: Email address of the user who created this signature.
