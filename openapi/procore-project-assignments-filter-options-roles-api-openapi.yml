openapi: 3.2.0
info:
  title: Procore REST Project Assignments Filter Options - Roles API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Project Assignments Filter Options - Roles
paths:
  /rest/v1.0/companies/{company_id}/users/{user_id}/project_assignments/filter_options/roles:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: user_id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Roles for a Company User
      description: This endpoint returns the list of Roles for the specified User. This includes the roles of Projects that the User is currently assigned to.
      tags:
      - Project Assignments Filter Options - Roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of roles
                items:
                  type: object
                  properties:
                    filter_value:
                      type: integer
                      description: Role ID
                      example: 1
                    label:
                      type: string
                      description: Role name
                      example: Project Manager
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
