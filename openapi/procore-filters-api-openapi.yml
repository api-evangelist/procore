      responses:
        '200':
          description: List of filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Filter index
                          example: 0
                        key:
                          type: string
                          description: Filter key
                          example: type
                        endpoint:
                          type: string
                          description: Filter endpoint
                        value:
                          type: string
                          description: Filter value
                          example: Type
                  saved_filters:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          description: Filter index
                          example: 0
                        key:
                          type: string
                          description: Filter key
                          example: type
                        endpoint:
                          type: string
                          description: Filter endpoint
                        value:
                          type: string
                          description: Filter value
                          example: Type
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
