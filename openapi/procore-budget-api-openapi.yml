  /rest/v2.0/companies/{company_id}/projects/{project_id}/budget_views/{budget_view_id}/detail_rows:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: budget_view_id
      in: path
      description: Unique identifier for the Budget View (also known as Budget Template).
      required: true
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Get Detail Rows for a Project's Budget
      description: 'Get detail rows for a project''s budget view.

        To restrict or reorder which columns are returned, pass `column_ids` with the desired column `id` values, in the desired order. A column''s `id` (used for `column_ids`) is different from its `attribute` (the key used for that column''s value in each row below) — see Get a Budget View for the `columns` array, which has both plus display metadata (`label`, `type`, `format`, `display_rules`).

        To read rows from a snapshot instead of the live budget, pass `source_snapshot_id` — this query parameter is shared across this endpoint, Summary Rows, and the Budget View endpoint.

        For forecasting views, spread columns will be included for budget line items where appropriate. Spread columns represent monthly forecast amounts and are named using the pattern "spread_{month}_{year}" (e.g., "spread_may_2010", "spread_june_2010").

        This endpoint is paginated with `page`/`per_page` (maximum 100); requests with a larger `per_page` return 400. Page through results with `page`, and read `Total`, `Per-Page`, and `Link` from the response headers.'
      tags:
      - Budget
      parameters:
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: filters
        in: query
        description: Structure to filter budget detail rows. An array of object is expected. Each object is expected to contain id(optional based on type), tier (optional), type (expected values segment, attribute, budget_row_note_status, date_range_for_actuals, forecast_start_date, wbs_code), values.
        required: false
        schema:
          type: array
          items:
            type: object
            example:
              \"id\": \"23\"
              \"tier\": 1
              \"type\": \"segment\"
              \"values\":
              - 2
              - 3
            required:
            - type
            - values
            properties:
              id:
                type: string
                description: ID of the filter. Required for segment and attribute filters.
                example: '68'
              tier:
                type: integer
                description: Tier of the Segment if applicable
                example: 1
              type:
                type: string
                description: Type of the filter.
                example: segment
                enum:
                - attribute
                - budget_row_note_status
                - date_range_for_actuals
                - forecast_start_date
                - segment
                - wbs_code
              values:
                type: array
                description: Values of the filter
                items:
                  type: string
                  example: '1'
      - name: comparison
        in: query
        description: Structure to compare details
        required: false
        schema:
          type: object
          example:
            \"snapshot_id\": \"23\"
            \"column_ids\":
            - \"1\"
            - \"2\"
            \"mode\": \"difference\"
          required:
          - snapshot_id
          - mode
          properties:
            snapshot_id:
              type: string
              description: ID of the snapshot to compare against
              example: '68'
            column_ids:
              type: array
              description: List of column IDs to include in the comparison
              items:
                type: string
              example:
              - '1'
              - '2'
              - '3'
            modes:
              type: string
              description: Additional comparison information to include with reference column values
              enum:
              - comparison
              - variance
      - name: source_snapshot_id
        in: query
        description: 'Unique identifier for a budget snapshot.

          If provided, the response reflects that snapshot instead of the live budget.

          If omitted, the response reflects the live budget.


          This single query parameter is shared across the Budget View, Detail Rows, and

          Summary Rows v2.0 endpoints.'
        required: false
        schema:
          type: string
      - name: column_ids
        in: query
        description: Array of Column IDs ordered by desired position.
        required: false
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Budget Detail Rows
                    properties:
                      currency_configuration:
                        type: object
                        description: Currency configuration
                        properties:
                          currency_iso_code:
                            type:
                            - string
                            - 'null'
                            description: Currency iso code for all detail rows
                            example: USD
                      detail_rows:
                        type: array
                        description: Detail rows
                        items:
                          type: object
                          properties:
                            budget_forecast:
                              type: object
                              description: Budget forecast. Omitted when `column_ids` is provided and the Forecast To Complete column is not among the requested columns.
                              properties:
                                id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Id for the associated budget forecast
                                  example: '123'
                                amount:
                                  type: integer
                                  description: Amount
                                  example: 100
                                automatic_amount:
                                  type: integer
                                  description: Automatic amount
                                  example: 200
                                automatically_calculated:
                                  type: boolean
                                  description: Automatically calculated
                                  example: true
                                calculation_strategy:
                                  type: string
                                  description: Calculation strategy
                                  example: automatic
                                notes:
                                  type: string
                                  description: Notes entered on the budget forecast. Empty string when there are no notes.
                                  example: Forecast notes
                            budget_line_item:
                              type: object
                              description: Budget line item. Omitted when `column_ids` is provided and the Original Budget Amount column is not among the requested columns.
                              properties:
                                id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Id for the associated budget line item
                                  example: '123'
                                non_deletable_reason:
                                  type:
                                  - string
                                  - 'null'
                                  description: The reason for why this budget line item cannot be deleted if the budget line item exists
                                unbudgeted_reason:
                                  type:
                                  - string
                                  - 'null'
                                  description: The reason for why this budget line item is unbudgeted or cannot be budgeted if the budget line item does not exist
                                budgetable:
                                  type: boolean
                                  description: Whether this row can be budgeted (i.e. a budget line item can be created for its WBS code).
                                  example: true
                                original_budget_amount:
                                  type:
                                  - string
                                  - 'null'
                                  format: float
                                  description: Original budget amount for the budget line item
                                  example: '1000.0'
                                calculation_strategy:
                                  type:
                                  - string
