                                  description: 'The aggregated total of comparison snapshots for this column. Null when the requested comparison financial period has no snapshot total for this column.

                                    '
                                  example: 900
                                delta:
                                  type:
                                  - number
                                  - 'null'
                                  description: 'Difference between the current grand total and the comparison value. Computed only when both the current grand total and the comparison value are present; null if either is null.

                                    '
                                  example: 100.5
