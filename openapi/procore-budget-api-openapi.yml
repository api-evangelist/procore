                        properties:
                          currency_iso_code:
                            type: string
                            description: Currency Configuration ISO code
                            example: USD
                      grand_total:
                        type: array
                        description: Array of totals grouped by budget column id
                        items:
                          type: object
                          properties:
                            budget_column_id:
                              type: string
                              description: The ID of the budget column being aggregated
                              example: '22222'
                            total:
                              type: number
                              description: The total value of all project snapshots with this budget column
                              example: 1000.5
                            comparison:
                              type: object
                              description: 'Comparison data relative to snapshots in the requested comparison financial period. Present only when a comparison financial period is requested; otherwise this object is omitted. When present, the value and delta sub-properties may still be individually null (see their descriptions).

                                '
