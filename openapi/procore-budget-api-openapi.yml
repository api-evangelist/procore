openapi: 3.2.0
info:
  title: Procore REST Budget API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Budget
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/advanced_forecastings/rows:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Advanced Forecasting Rows of a Project
      description: Get Advanced forecasting rows. Each page will have a maximum of 100 items.
      tags:
      - Budget
      parameters:
      - name: budget_view_id
        in: query
        description: Unique identifier for the Budget View (also known as Budget Template). Required to return spread amount for other curves besides manual. Also required when column-based forecasting is enabled.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: filters
        in: query
        description: "Array structure to filter the result of the advanced forecasting endpoint\nSupported filter objects (with and without budget_view_id):\n  - WBS segment item filter\n    Structure:\n      - id: <segment_id>\n      - tier: <segment_tier>\n      - type: 'segment'\n      - values: <array of segment item ids>\n  \n    Example:\n    `{\"id\": \"23\", tier: <segment_tier>, \"type\": \"segment\", \"values\": [2]}`\n\n    URL example:\n    https://app.procore.com/rest/v2.0/companies/<company_id>/projects/<project_id>/advanced_forecastings/rows?filters[][id]=23&filters[][tier]=1&filters[][type]=segment&filters[][values][]=2&page=1&per_page=100&budget_view_id=2\n\nSupported filters only if budget_view_id is provided:\n  - Actuals by date\n    Structure:\n      - id: 'date_range_for_actuals'\n      - code: 'date_range_for_actuals'\n      - type: 'date_range_for_actuals'\n      - values: [`<start_date>(YYYY-MM-DD)`, `<end_date>(YYYY-MM-DD)`, `<include_actuals_without_dates (boolean)>`].\n    \n    Example:\n    `{\"id\": \"date_range_for_actuals\", \"code\": \"date_range_for_actuals\", \"type\": \"date_range_for_actuals\", \"values\": [\"2021-01-01\", \"2021-01-31\", false]}`\n\n    URL Example:\n    https://app.procore.com/rest/v2.0/companies/<company_id>/projects/<project_id>/advanced_forecastings/rows?filters[][code]=date_range_for_actuals&filters[][id]=date_range_for_actuals&filters[][type]=date_range_for_actuals&filters[][values][]=2021-01-01&filters[][values][]=2021-01-31&filters[][values][]=false&page=1&per_page=100&budget_view_id=2"
        example:
        - \"id\": \"23\"
          \"tier\": 1
          \"type\": \"segment\"
          \"values\":
          - 2
          - 3
        required: false
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Identifier of the thing being filtered on. For a segment filter this is the WBS segment id; for a date-range-for-actuals filter it is the literal 'date_range_for_actuals'.
                example: '68'
              code:
                type: string
                description: Filter code. Required for the date-range-for-actuals filter (set to 'date_range_for_actuals'); omit for segment filters.
                example: date_range_for_actuals
              tier:
                type: integer
                description: Tier of the Segment if applicable
                example: 1
              type:
                type: string
                description: Type of the filter
                example: segment
                enum:
                - segment
                - forecast_start_date
                - date_range_for_actuals
                - budget_row_type
              values:
                type: array
                description: Values of the filter
                items:
                  type: string
                  example: '1'
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of Advanced forecasting summarized rows
                    items:
                      type: object
                      description: Advanced forecasting Row Summarized
                      properties:
                        budget_line_item_id:
                          type: string
                          description: Identifier of the budget line item this forecasting row belongs to. Null for rows that do not yet have a persisted budget line item.
                          example: '56'
                        wbs_code_id:
                          type: string
                          description: Identifier of the WBS (Work Breakdown Structure) code that scopes this forecasting row. Uniquely identifies the budget cost code combination being forecast.
                          example: '76'
                        start_date:
                          type: string
                          description: First day the forecast applies to, in 'YYYY-MM-DD' format. Together with end_date it defines the span over which periods are distributed.
                          example: '2024-06-24'
                        end_date:
                          type: string
                          description: Last day the forecast applies to, in 'YYYY-MM-DD' format. Together with start_date it defines the span over which periods are distributed.
                          example: '2024-07-24'
                        curve:
                          type: string
                          description: The curve of the line item. For more information about the curve distribution visit https://support.procore.com/faq/how-do-procores-advanced-forecasting-curves-distribute-projected-cost-to-complete-amounts
                          example: manual
                          enum:
                          - bell
                          - back_loaded
                          - front_loaded
                          - linear
                          - manual
                        forecast_to_complete:
                          type: number
                          description: Total projected cost remaining (forecast to complete) for this line item, as a currency amount. This total is distributed across periods according to the curve.
                          example: 100
                        periods:
                          type: array
                          description: Per-period breakdown of the forecast-to-complete amount across the line item's date span.
                          items:
                            type: object
                            properties:
                              period_date:
                                type: string
                                description: Month this period applies to, in 'YYYY-MM' format.
                                example: 2024-06
                              amount:
                                type: number
                                description: Currency amount of the forecast allocated to this period.
                                example: 100
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
