      - name: filters[created_by_id]
        in: query
        description: Filter snapshots by created_by_id
        required: false
        schema:
          type: string
      - name: filters[created_at]
        in: query
        description: Filter snapshots by created_at date range, inclusive
        required: false
        schema:
          type: string
          example: 2024-12-01T00:00:00Z...2024-12-31T00:00:00Z
      - name: comparison_financial_period_id
