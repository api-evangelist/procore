  /rest/v2.0/companies/{company_id}/projects/{project_id}/budget_views/{budget_view_id}/summary_rows:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: budget_view_id
      in: path
      description: Unique identifier for the Budget View (also known as Budget Template).
      required: true
      schema:
        type: string
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Get Summary Rows for a Project's Budget
      description: 'Get summary rows for a project''s budget view. Rows are grouped and aggregated according to `group_by`, unlike Detail Rows, which returns one row per budget line item.

        To restrict or reorder which columns are returned, pass `column_ids` with the desired column `id` values, in the desired order. A column''s `id` (used for `column_ids`) is different from its `attribute` (the key used for that column''s value in each row below) — see Get a Budget View for the `columns` array, which has both plus display metadata (`label`, `type`, `format`, `display_rules`).

        To read rows from a snapshot instead of the live budget, pass `source_snapshot_id` — this query parameter is shared across this endpoint, Detail Rows, and the Budget View endpoint.

        This endpoint is paginated with `page`/`per_page` (maximum 100); requests with a larger `per_page` return 400. Page through results with `page`, and read `Total`, `Per-Page`, and `Link` from the response headers.'
      tags:
      - Budget
      parameters:
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: filters
        in: query
        description: Structure to filter budget rows
        required: false
        schema:
          type: array
          items:
            type: object
            required:
            - type
            - values
            properties:
              id:
                type: string
                description: ID of the filter. Required for segment and attribute filters.
                example: '68'
              tier:
                type: integer
                description: Tier of the Segment if applicable
                example: 1
              type:
                type: string
                description: Type of the filter.
                example: segment
                enum:
                - attribute
                - budget_row_note_status
                - date_range_for_actuals
                - forecast_start_date
                - segment
              values:
                type: array
                description: Values of the filter
                items:
                  type: string
                  example: '1'
            example:
            - id: '12'
              tier: 1
              type: segment
              values:
              - 2
              - 3
      - name: group_by
        in: query
        description: "Array of group objects to create hierarchical groupings. Rows will be grouped by the first criterion, \nthen by the second within each first-level group, and so on.\n\nSupported group object types:\n  - WBS segment group\n    Structure:\n      - id: <segment_id>\n      - tier: <segment_tier>\n      - type: 'segment'\n      - values: <array of segment item ids>\n\n    Example:\n    `{\"id\": \"23\", tier: <segment_tier>, \"type\": \"segment\", \"values\": [2, 3]}`\n    \n  - WBS attribute group\n    Structure:\n      - id: <attribute_id>\n      - type: 'attribute'\n      - values: <array of attribute item ids>\n\n    Example:\n    `{\"id\": \"23\", \"type\": \"attribute\", \"values\": [2, 3]}`\n\n**Hierarchical grouping examples**:\n\nMultiple groups (array format):\n```json\n[\n  {\"id\": \"12\", \"tier\": 1, \"type\": \"segment\"},\n  {\"id\": \"23\", \"type\": \"attribute\"}\n]\n```\n\nQuery string example:\n`group_by[0][id]=12&group_by[0][tier]=1&group_by[0][type]=segment&group_by[1][id]=23&group_by[1][type]=attribute`\n\nThis would group rows first by segment ID 12, then by attribute ID 23 within each segment group."
        required: false
        schema:
          type: array
          items:
            type: object
            required:
            - type
            properties:
              id:
                type: string
                description: ID of the filter.
                example: '68'
              tier:
                type: integer
                description: Tier of the Segment if applicable
                example: 1
              type:
                type: string
                description: Type of grouping
                example: segment
                enum:
                - segment
                - attribute
          description: Array of group objects for hierarchical grouping
          example:
          - id: '12'
            tier: 1
            type: segment
          - id: '23'
            type: attribute
      - name: comparison
        in: query
        description: "Specifies what snapshot and budget view columns to compare against, as well as what comparison columns to include in the response.\nSupported object \n  - Structure:\n      - snapshot_id: number\n      - column_ids: array of numbers\n      - modes: array of string enums\n        - comparison\n        - variance\n\n    Example:\n    `{\"snapshot_id\": \"23\", \"column_ids\": [\"1\", \"2\"], \"modes\": [\"variance\"]}`\n\n    Query string example:\n    `comparison[snapshot_id]=1&comparison[column_ids][]=23&comparison[column_ids][]=45&comparison[modes][]=variance`"
        required: false
        schema:
          type: object
          required:
          - snapshot_id
          - mode
          properties:
            snapshot_id:
              type: string
              description: ID of the snapshot to compare against
              example: '68'
            column_ids:
              type: array
              description: List of column IDs to include in the comparison
              items:
                type: string
              example:
              - '1'
              - '2'
              - '3'
            modes:
              type: array
              description: The comparison modes to include with reference column values
              items:
                type: string
                enum:
                - comparison
                - variance
      - name: column_ids
        in: query
        description: Array of Column IDs ordered by desired position.
        required: false
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: source_snapshot_id
        in: query
        description: 'Unique identifier for a budget snapshot.

          If provided, the response reflects that snapshot instead of the live budget.

          If omitted, the response reflects the live budget.


          This single query parameter is shared across the Budget View, Detail Rows, and

          Summary Rows v2.0 endpoints.'
        required: false
        schema:
          type: string
      - name: filter_groups
        in: query
        description: 'Alternative to `filters` for expressing OR logic. An array of filter groups: groups are OR''d together,

          while the filters within each group are AND''d. Each inner element has the same shape as a `filters` entry.'
        required: false
        schema:
          type: array
          items:
            type: array
            items:
              type: object
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Budget Summary Rows
                    properties:
                      currency_configuration:
                        type: object
                        description: Currency configuration
                        properties:
                          currency_iso_code:
                            type:
                            - string
                            - 'null'
                            description: Currency iso code for all summary rows
                            example: USD
                      summary_rows:
                        type: array
                        description: Summary rows
                        items:
                          type: object
                          properties:
                            groups:
                              type: array
                              description: Array of group objects containing label and value pairs. Each element represents a level in the grouping hierarchy.
                              items:
                                type: object
                                properties:
                                  label:
                                    type: string
                                    description: Display label for the group
                                    example: 03 - Concrete
                                  value:
                                    type: array
                                    items:
                                      oneOf:
                                      - type: integer
                                      - type: string
