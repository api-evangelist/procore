      tags:
      - Budget
      parameters:
      - name: filters[from_date]
        in: query
        description: 'Inclusive lower bound of the date window (ISO 8601 date, "YYYY-MM-DD"). When provided, only groups whose span ends on or after this date are returned. Groups are returned in full (all their periods), not only the periods inside the window. Optional; when omitted the window is unbounded below.

          '
        required: false
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: filters[to_date]
        in: query
        description: 'Inclusive upper bound of the date window (ISO 8601 date, "YYYY-MM-DD"). When provided, only groups whose span starts on or before this date are returned. Groups are returned in full (all their periods), not only the periods inside the window. Optional; when omitted the window is unbounded above. Must be on or after `filters[from_date]` when both are given.

          '
        required: false
        schema:
          type: string
          format: date
          example: '2026-12-31'
      - name: sort
        in: query
        description: 'Sort groups by start date. `date` orders by earliest period start ascending (the default); `-date` orders descending.

          '
        required: false
        schema:
          type: string
          enum:
          - date
          - -date
