      parameters:
      - name: filters[status_id]
        in: query
        description: Filter snapshots by PSS custom status ID
        required: false
        schema:
          type: string
      - name: filters[approval_status]
        in: query
        description: Filter snapshots by approval status.
        required: false
        schema:
          type: string
          enum:
          - approved
          - under_review
          - custom
          example: approved
      - name: filters[financial_period_id][]
        in: query
        description: Filter snapshots by financial period ID. Accepts one or more IDs. Pass the token `null` (or `nil`) as a value to match snapshots that have no financial period. Tokens and IDs can be combined — e.g. `["42", "null"]` matches snapshots in period 42 or with no period.
        required: false
        schema:
          type: array
          items:
            type: string
          example:
          - '42'
          - 'null'
      - name: filters[project_id]
        in: query
        description: Filter snapshots by project ID
        required: false
        schema:
          type: string
      - name: filters[project_number][]
        in: query
        description: Filter snapshots by one or more project numbers
        required: false
        schema:
          type: array
          items:
            type: string
      - name: filters[program_id]
        in: query
        description: Filter snapshots by program ID
        required: false
        schema:
          type: string
      - name: filters[region_id]
        in: query
        description: Filter snapshots by region ID
        required: false
        schema:
          type: string
      - name: filters[stage_id]
        in: query
        description: Filter snapshots by stage ID
        required: false
        schema:
          type: string
      - name: filters[office_id]
        in: query
        description: Filter snapshots by office ID
        required: false
        schema:
          type: string
      - name: filters[department_id]
        in: query
        description: Filter snapshots by department ID
        required: false
        schema:
          type: string
      - name: filters[created_by_id]
        in: query
        description: Filter snapshots by created_by_id
        required: false
        schema:
          type: string
      - name: filters[created_at]
        in: query
        description: Filter snapshots by created_at date range, inclusive
        required: false
        schema:
          type: string
          example: 2024-12-01T00:00:00Z...2024-12-31T00:00:00Z
      - name: comparison_financial_period_id
        in: query
        description: ID of the financial period to use as the comparison baseline. When omitted, no comparison data is returned.
        required: false
        schema:
          type: string
      - name: comparison_budget_column_ids
        in: query
        description: Restrict comparison data to these budget column IDs. When omitted, comparison is returned for all columns.
        required: false
        schema:
          type: array
          items:
            type: string
          example:
          - '12345'
          - '6789'
