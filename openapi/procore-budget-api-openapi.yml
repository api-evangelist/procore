    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: budget_view_id
      in: path
      description: ID of the budget view
      required: true
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: List Project Status Snapshots
      description: Returns a paginated list of project-level project status snapshots with optional filtering and sorting
      tags:
      - Budget
      parameters:
      - name: filters[status_id]
        in: query
        description: Filter snapshots by PSS custom status ID
        required: false
        schema:
          type: string
      - name: filters[approval_status]
        in: query
        description: Filter snapshots by approval status.
        required: false
        schema:
          type: string
          enum:
          - approved
          - under_review
          - custom
          example: approved
      - name: filters[financial_period_id][]
        in: query
        description: Filter snapshots by financial period ID. Accepts one or more IDs. Pass the token `null` (or `nil`) as a value to match snapshots that have no financial period. Tokens and IDs can be combined — e.g. `["42", "null"]` matches snapshots in period 42 or with no period.
        required: false
        schema:
          type: array
          items:
            type: string
          example:
          - '42'
          - 'null'
      - name: comparison_budget_column_ids
        in: query
        description: Restrict comparison data to these budget column IDs. When omitted, comparison is returned for all columns.
        required: false
        schema:
          type: array
          items:
            type: string
          example:
          - '12345'
          - '6789'
      - name: sort
        in: query
        description: Sort order for the returned snapshots. Prefix a value with `-` for descending order. `created_at` sorts by when the snapshot was taken; `financial_period` sorts by the associated financial period's date range (snapshots without a financial period sort last when ascending).
        required: false
        schema:
          type: string
          default: -created_at
          enum:
          - created_at
          - -created_at
          - financial_period
          - -financial_period
          example: -created_at
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of the snapshot
                          example: '1234'
                        name:
                          type: string
                          description: The name of the snapshot
                          example: Q4 Budget Review
                        description:
                          type:
                          - string
                          - 'null'
                          description: A description of the snapshot
                          example: Description
                        approval_status:
                          type:
                          - string
                          - 'null'
                          description: Approval state of the project status snapshot. Null for ad-hoc snapshots that have no approval workflow.
                          enum:
                          - approved
                          - under_review
                          - custom
                          example: approved
                        status:
                          allOf:
                          - type: object
                            description: Custom status object.
                            properties:
                              id:
                                type: string
                                description: ID of the custom status
                                example: '1234'
                              name:
                                type: string
                                description: Name of the custom status
                                example: Approved
                              mapped_to_status:
                                type: string
                                enum:
                                - open
                                - closed
                                - void
                                - pending
                                description: The default status this custom status maps to
                                example: closed
                              available:
                                type: boolean
                                description: Whether the status is available for selection
                                example: true
                              initial:
                                type: boolean
                                description: Whether this is the initial status for new snapshots
                                example: false
                              standard_type:
                                type: string
                                enum:
                                - approved
                                - under_review
                                - custom
                                description: 'Origin/category of the status: approved and under_review are Procore-provided; custom is company-defined.'
                                example: approved
                              created_at:
                                type: string
                                format: date-time
                                description: Created At timestamp
                                example: '2024-01-17T18:09:03Z'
                              updated_at:
                                type: string
                                format: date-time
                                description: Updated At timestamp
                                example: '2024-01-17T18:09:03Z'
                        created_by:
                          type: object
                          properties:
                            id:
                              type: string
                              description: The ID of the user who created the snapshot
                              example: '5678'
                            display:
                              type: string
                              description: The display name of the user who created the snapshot
                              example: John Doe
                        created_at:
                          type: string
                          format: date-time
                          description: The time the snapshot request was created
                          example: '2024-10-29T14:00:00Z'
                        currency_configuration:
                          type: object
                          description: Currency configuration object, the currency for the snapshot
