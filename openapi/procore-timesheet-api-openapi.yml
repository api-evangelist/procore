          application/json:
            schema:
              type: object
              properties:
                hours:
                  type: string
                  description: Total number of hours worked (excluding breaks) for the timecard entry. This property is not required if the timesheet time entry is configured for start time and stop time.
                  example: '8.0'
                lunch_time:
                  type: string
                  description: The duration of the lunch break, in minutes, for the Timecard Entry. This property is only required if the timesheet time entry is configured for start time and stop time.
                  example: '60'
                time_in:
                  type: string
                  description: The start time of the Timecard Entry in ISO 8601 format. This property is only required if the timesheet time entry is configured for start time and stop time.
                  example: '2020-10-14T07:00:00Z'
                time_out:
                  type: string
                  description: The stop time of the Timecard Entry in ISO 8601 format. This property is only required if the timesheet time entry is configured for start time and stop time.
                  example: '2018-10-14T16:00:00Z'
                billable:
                  type: boolean
                  description: The billable status of the Timecard Entry. Must be either true or false.
                  default: false
                  example: false
                date:
                  type: string
                  format: date
                  description: The date of the Timecard Entry in ISO 8601 format.
                  example: '2020-10-14'
                description:
                  type: string
                  description: The description of the Timecard Entry.
                  example: This is a description.
                timecard_time_type_id:
                  type: integer
                  description: The ID of the Timecard Time Type corresponding to the Timecard Entry property.
                  example: 1
                timesheet_id:
                  type: integer
                  description: The ID of the Timesheet corresponding to the Timecard Entry property.
                  example: 41823
                cost_code_id:
                  type: integer
                  description: The ID of the Cost Code corresponding to the Timecard Entry property.
                  example: 12345
                sub_job_id:
                  type: integer
                  description: The ID of the Subjob corresponding to the Timecard Entry property.
                  example: 3483483
                location_id:
                  type: integer
                  description: The ID of the Location corresponding to the Timecard Entry property.
                  example: 161072
                login_information_id:
                  type: integer
                  description: The ID of the Login Information corresponding to the Timecard Entry property.
                  example: 2341
                party_id:
                  type: integer
                  description: The ID of the Party corresponding to the Timecard Entry property.
                  example: 2341
                origin_id:
                  type: integer
                  description: The ID of the related external data.
                  example: 23423
                origin_data:
                  type: string
                  description: The value of the related external data.
                  example: '{''example'':''related data''}'
                line_item_type_id:
