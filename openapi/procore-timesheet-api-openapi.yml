        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'PATCH',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/timesheets',\n  headers: {'content-type': 'application/json'},\n  body: {timesheet_id: 1, timecard_entries: [{date: '2017-04-19'}]},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"timesheet_id\":1,\"timecard_entries\":[{\"date\":\"2017-04-19\"}]}"


          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v1.0/projects/%7Bproject_id%7D/timesheets", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
