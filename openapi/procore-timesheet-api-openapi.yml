  /rest/v1.0/projects/{project_id}/timesheets/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Show A Timesheet
      description: Return Timesheet detailed information.
      tags:
      - Timesheet
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: id
        in: path
        description: ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: Timesheet
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the timesheet.
                    example: 1
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when this timesheet was created, in ISO 8601 format.
                    example: '2012-10-23T21:39:40Z'
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when this timesheet was last modified, in ISO 8601 format.
                    example: '2012-10-24T21:39:40Z'
                  date:
                    type: string
                    format: date
                    description: Date of this timesheet.
                    example: '2015-05-12'
                  number:
                    type: integer
                    description: Sequential number of this timesheet.
                    example: 1
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the user who created this timesheet.
                        example: 160586
                      login:
                        type: string
                        description: Email address of the user who created this timesheet.
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Full name of the user who created this timesheet.
                        example: Carl Contractor
                  name:
                    type: string
                    description: Display name of the timesheet (typically date and number).
                    example: 2015-05-12 - 01
                  status:
                    type: string
                    description: The approval status of the Timesheet
                    example: pending
                  timecard_entries:
                    type: array
                    items:
                      type: object
                      title: Timesheet Entries
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the timecard entry.
                          example: 1
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when this timecard entry was created, in ISO 8601 format.
                          example: '2012-10-23T21:39:40Z'
                        date:
                          type: string
                          format: date
                          description: Date of this timecard entry.
                          example: '2015-05-12'
                        deleted_at:
                          type: string
                          format: date-time
                          description: Timestamp when this timecard entry was soft-deleted. Null if active.
                          example: '2017-07-29T21:39:40Z'
                        description:
                          type: string
                          description: Description or notes for this timecard entry.
                          example: Description
                        hours:
                          type: string
                          description: Total hours worked for this entry (excluding breaks).
                          example: '5.0'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when this timecard entry was last modified.
                          example: '2012-10-24T21:39:40Z'
                        time_in:
                          type: string
                          format: date-time
                          description: Clock-in time for this entry.
                          example: '2017-07-29T21:39:40Z'
                        time_out:
                          type: string
                          format: date-time
                          description: Clock-out time for this entry.
                          example: '2017-07-29T21:39:40Z'
                        injured:
                          type: boolean
                          description: Whether an injury was reported during this work period.
                          example: false
                        lunch_time:
                          type: integer
                          description: Duration of lunch break in minutes.
                          example: 30
                        billable:
                          type: boolean
                          description: Whether this timecard entry is billable.
                          example: true
                        origin_id:
                          type: integer
                          description: ID of related external data
                          example: 23423
