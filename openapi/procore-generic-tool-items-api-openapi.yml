        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/generic_tools/%7Bgeneric_tool_id%7D/generic_tool_items',\n  qs: {\n    view: 'SOME_STRING_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[id]': 'SOME_ARRAY_VALUE',\n    'filters[login_information_id]': 'SOME_ARRAY_VALUE',\n    'filters[status]': 'SOME_ARRAY_VALUE',\n    'filters[overdue]': 'SOME_BOOLEAN_VALUE',\n    'filters[query]': 'SOME_STRING_VALUE',\n    'filters[recycle_bin]': 'SOME_BOOLEAN_VALUE',\n    'filters[received_from_id]': 'SOME_INTEGER_VALUE',\n    'filters[created_by_id]': 'SOME_ARRAY_VALUE',\n    'filters[created_at]': 'SOME_STRING_VALUE',\n    'filters[updated_at]': 'SOME_STRING_VALUE',\n    'filters[closed_at]': 'SOME_STRING_VALUE',\n    'filters[issued_at]': 'SOME_STRING_VALUE',\n    'filters[vendor_id]': 'SOME_INTEGER_VALUE',\n    sort: 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/generic_tools/%7Bgeneric_tool_id%7D/generic_tool_items?view=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Blogin_information_id%5D=SOME_ARRAY_VALUE&filters%5Bstatus%5D=SOME_ARRAY_VALUE&filters%5Boverdue%5D=SOME_BOOLEAN_VALUE&filters%5Bquery%5D=SOME_STRING_VALUE&filters%5Brecycle_bin%5D=SOME_BOOLEAN_VALUE&filters%5Breceived_from_id%5D=SOME_INTEGER_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bclosed_at%5D=SOME_STRING_VALUE&filters%5Bissued_at%5D=SOME_STRING_VALUE&filters%5Bvendor_id%5D=SOME_INTEGER_VALUE&sort=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
