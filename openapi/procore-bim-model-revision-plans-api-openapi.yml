openapi: 3.2.0
info:
  title: Procore REST BIM Model Revision Plans API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: BIM Model Revision Plans
paths:
  /rest/v1.0/bim_model_revision_plans:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List BIM Model Revision Plans
      description: Lists BIM Model Revision Plans associated with the specified Project.
      tags:
      - BIM Model Revision Plans
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: 'The compact view contains only ids.

          The extended view contains the response shown below.

          The normal view contains ''bim_plan_id'' and ''bim_level_id'' instead of objects.

          The default view is normal.'
        schema:
          type: string
          enum:
          - compact
          - normal
          - extended
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[bim_plan_id]
        in: query
        description: Filter item(s) with matching BIM Plan ids
        schema:
          type: integer
      - name: filters[bim_model_revision_id]
        in: query
        description: Filter item(s) with matching Bim Model Revision ids.
        schema:
          type: integer
      - name: filters[bim_level_id]
        in: query
        description: Filter item(s) with matching BIM Level ids
        schema:
          type: integer
      responses:
        '200':
          description: BIM Model Revision Plans listed successfully
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - allOf:
                    - type: object
                      description: BIM Model Revision Plan associates BIM Plans to published BIM Model Revisions
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 144
                        bim_model_revision_id:
                          type: integer
                          description: ID of associated published BIM Model Revision
                          example: 16
                        created_at:
                          type: string
                          format: date-time
                          description: Created date
                          example: '2019-01-04T06:13:10Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Updated date
                          example: '2019-01-06T11:26:08Z'
                    - type: object
                      properties:
                        bim_plan_id:
                          type: integer
                          description: ID of the BIM Plan
                          example: 16
                        bim_level_id:
                          type: integer
                          description: ID of the Bim Level linked to the plan
                          example: 18
                  - type: object
                    description: BIM Model Revision Plan associates BIM Plans to published BIM Model Revisions
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 144
                      bim_model_revision_id:
                        type: integer
                        description: ID of associated published BIM Model Revision
                        example: 16
                      bim_plan:
                        allOf:
                        - type: object
                          description: BIM Plan captures the plan view of a level and contains the plan as a drawing or an attached 2D sheet
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 144
                            bim_level_id:
                              type: integer
                              description: ID of the BIM Level that the plan is associated to
                              example: 16
                            drawing_id:
                              type: integer
                              description: ID of the Drawing that the plan is associated to
                              example: 16
                            created_at:
                              type: string
                              format: date-time
                              description: Created date
                              example: '2019-01-04T06:13:10Z'
                            updated_at:
                              type: string
                              format: date-time
                              description: Updated date
                              example: '2019-01-06T11:26:08Z'
                        - type: object
                          properties:
                            title:
                              type: string
                              description: Title of the plan. This reflects the title of the drawing associated to the plan. If plan is not associated to a drawing, the title will contain the associated location name
                              example: 'A201: Floor II Plan'
                            image:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                  description: Base name of the file without its path
                                  example: drawing.png
                                content_type:
                                  type: string
                                  description: A mime type or a file extension
                                  example: image/png
                                url:
                                  type: string
                                  description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                                  example: https://storage.procore.com/v3/d/default/procore-files/1ZE258W9K804SAJJZX19JVAB3R?sig=e7a476ec0a46154d05e0d4a554fb2ea0904cb6604670f9247c54d7c56a84d0b6
                                height:
                                  type: integer
                                  description: Image height
                                  example: 1200
                                width:
                                  type: integer
                                  description: Image width
                                  example: 1600
                            thumbnail:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID
                                  example: 149
                                size:
                                  type: string
                                  description: Thumbnail size
                                  example: small
                                  enum:
                                  - small
                                  - medium
                                  - large
                                url:
                                  type: string
                                  description: Thumbnail url
                                  example: https://storage.procore.com/thumbnail-bucket/46971c37f_thumbnail_large.png?sig=e7a476ec0a46154d05e0d
                            sheet_map_start:
                              type: object
                              description: 2D Coordinate Point
                              properties:
                                x:
                                  type: number
                                  format: double
                                  description: x-axis coordinate
                                  example: '6.24'
                                y:
                                  type: number
                                  format: double
                                  description: y-axis coordinate
                                  example: '12.48'
                            sheet_map_end:
                              type: object
                              description: 2D Coordinate Point
                              properties:
                                x:
                                  type: number
                                  format: double
                                  description: x-axis coordinate
                                  example: '6.24'
                                y:
                                  type: number
                                  format: double
                                  description: y-axis coordinate
                                  example: '12.48'
                            model_map_start:
                              type: object
                              description: 3D Coordinate Point
                              properties:
                                x:
                                  type: number
                                  format: double
                                  description: x-axis coordinate
                                  example: '6.24'
                                y:
                                  type: number
                                  format: double
                                  description: y-axis coordinate
                                  example: '12.48'
                                z:
                                  type: number
                                  format: double
                                  description: z-axis coordinate
                                  example: '24.96'
                            model_map_end:
                              type: object
                              description: 3D Coordinate Point
                              properties:
                                x:
                                  type: number
                                  format: double
                                  description: x-axis coordinate
                                  example: '6.24'
                                y:
                                  type: number
                                  format: double
                                  description: y-axis coordinate
                                  example: '12.48'
                                z:
                                  type: number
                                  format: double
                                  description: z-axis coordinate
                                  example: '24.96'
                      bim_level:
                        allOf:
                        - type: object
                          description: BIM Model Level
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 144
                            elevation:
                              type: number
                              format: float
                              description: Level elevation
                              example: 10.25
                            name:
                              type: string
                              description: Level name
                              example: 1space>1 space
                            created_at:
                              type: string
                              format: date-time
                              description: Created date
                              example: '2019-01-04T06:13:10Z'
                            updated_at:
                              type: string
                              format: date-time
                              description: Updated date
                              example: '2019-01-06T11:26:08Z'
                        - type: object
                          properties:
                            bim_file_id:
