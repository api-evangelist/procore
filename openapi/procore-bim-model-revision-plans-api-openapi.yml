                              description: ID of the BIM Model revision linked to the Level
                              example: 16
                            location_id:
                              type:
                              - integer
                              - 'null'
                              description: ID of location linked to the Level
                              example: 16
                            created_by_id:
                              type: integer
                              description: ID of user that created the level
                              example: 16
                      created_at:
                        type: string
                        format: date-time
                        description: Created date
                        example: '2019-01-04T06:13:10Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Updated date
                        example: '2019-01-06T11:26:08Z'
        '403':
