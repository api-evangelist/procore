      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url http://localhost:8080/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents/markup_indicator \\\n  --header 'content-type: application/json' \\\n  --data '{\"item_type\":\"string\",\"item_ids\":[\"string\"]}'"
