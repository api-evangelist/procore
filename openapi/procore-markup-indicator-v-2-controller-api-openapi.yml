          payload = "{\"item_type\":\"string\",\"item_ids\":[\"string\"]}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents/markup_indicator", payload, headers)


          res = conn.getresponse()

          data = res.read()


