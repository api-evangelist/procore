  /rest/v1.0/electronic_signatures:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Create an Electronic Signature
      description: The Electronic Signature endpoint allows for the creation of a Electronic Signature
      tags:
      - Electronic Signatures
      parameters:
      - name: company_id
        in: query
        description: company_id (either company_id or project_id is required)
        required: false
        schema:
          type: integer
      - name: project_id
        in: query
        description: project_id (either project_id or company_id is required)
        required: false
        schema:
          type: integer
      - name: object_id
        in: query
        description: ID of the object for which we need the create the electronic signature
        required: true
        schema:
          type: integer
      - name: object_type
        in: query
        description: Type of the object for which we need the create the electronic signature
        required: true
        schema:
          type: string
          enum:
          - Billings::Requisition
          - Contract
          - ChangeOrderPackage
          - ChangeOrderRequest
          - PotentialChangeOrder
          - PaymentApplication
          - GenericToolItem
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account_type:
                  type: string
                  enum:
                  - manual
                  description: Provider type. Pass "manual" to create a manual upload electronic signature record without requiring DocuSign or ProcoreSign. Omit for standard DocuSign / ProcoreSign flows.
                prostore_file_id:
                  type: integer
                  description: ID of the pre-uploaded signed document. Required when account_type is "manual".
                redirect_path:
                  type: string
                  description: Relative path (no host or scheme) to redirect the user to. Absolute or protocol-relative paths are rejected.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Electronic Signature
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the electronic signature. Use as the {electronic_signature_id} path parameter for the show, void, withdraw, and refresh endpoints.
                    example: 58820
                  object_id:
                    type: number
                    description: Identifier of the source record (for example, a contract or requisition) the electronic signature was created for. Paired with object_type to locate the signed item.
                    example: 1634
                  object_type:
                    type: string
                    description: Class name of the source record the electronic signature was created for.
                    example: Contract
                  status:
                    type: string
                    description: Current lifecycle state of the electronic signature (for example, created, signed, or voided).
                    example: created
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when this electronic signature record was created, in ISO 8601 format.
                    example: '2026-08-31T21:39:40Z'
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when this electronic signature record was last updated
                    example: '2026-08-31T21:45:12Z'
                  metadata:
                    type: object
                    description: Display metadata describing the current state of the electronic signature.
                    properties:
                      title:
                        type: string
                        description: Human-readable title summarizing the current state of the electronic signature.
                      message:
                        type: string
                        description: Human-readable message providing additional detail about the current state of the electronic signature.
                      type:
                        type: string
                        description: Category of the metadata, used to style or group the status message in the UI.
                  actions:
                    type: array
                    description: Actions that can be performed on the electronic signature in its current state.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Identifier of an action that can currently be performed on the electronic signature.
                          enum:
                          - void
                          - withdraw
                          - edit
                          - refresh
                          - sign
                          - reauthenticate
                          - download
                          - finish
                        url:
                          type: string
                          description: URL used to invoke this action.
                        display_name:
                          type: string
                          description: Localized, human-readable label for the action, suitable for display on a button.
                  ball_in_court_names:
                    type: array
                    description: Names of the users currently responsible for acting on the electronic signature (ball-in-court).
                    items:
                      type: string
                      description: Name of a user currently responsible for acting on the electronic signature.
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                description: Electronic Signature
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the electronic signature. Use as the {electronic_signature_id} path parameter for the show, void, withdraw, and refresh endpoints.
                    example: 58820
                  object_id:
                    type: number
                    description: Identifier of the source record (for example, a contract or requisition) the electronic signature was created for. Paired with object_type to locate the signed item.
                    example: 1634
