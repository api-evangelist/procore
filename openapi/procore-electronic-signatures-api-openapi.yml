                        url:
                          type: string
                          description: URL used to invoke this action.
                        display_name:
                          type: string
                          description: Localized, human-readable label for the action, suitable for display on a button.
                  ball_in_court_names:
                    type: array
                    description: Names of the users currently responsible for acting on the electronic signature (ball-in-court).
                    items:
                      type: string
                      description: Name of a user currently responsible for acting on the electronic signature.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
