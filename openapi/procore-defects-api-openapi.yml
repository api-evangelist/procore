    patch:
      tags:
      - Defects
      summary: Updates a line item for a defect
      description: 'Updates resolution_status, notes, and location_id for defect line items.

        When the resolution is ADD_TO_STOCK, a location_id must be provided;

        otherwise a 400 (RESOLUTION_LOCATION_NOT_SET) is returned.

        When resolving a defect line with ADD_TO_STOCK resolution for a PO that originates from a commitment,

        an invoice (requisition) will be created in Procore for the defect quantity.'
      operationId: Defects_PatchLine
      parameters:
      - name: id
        in: path
        description: The ID of the defect
        required: true
        schema:
          type: string
          format: uuid
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: The updates to apply to the line item
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  line_item_guid:
                    type: string
                    format: uuid
                  resolution_status:
                    enum:
                    - UNRESOLVED
                    - ADD_TO_STOCK
                    - RESOLVED_WITHOUT_INVENTORY_CHANGE
                    type: string
                  notes:
                    type:
                    - string
                    - 'null'
                  location_id:
                    type:
                    - string
                    - 'null'
                additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                    - array
                    - 'null'
