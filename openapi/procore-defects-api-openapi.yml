                          type: string
                          format: uuid
                        line_number:
                          type:
                          - string
                          - 'null'
                        resource:
                          type: object
                          properties:
                            name:
                              type:
                              - string
                              - 'null'
                            id:
                              type:
                              - string
                              - 'null'
                              format: uuid
                            description:
                              type:
                              - string
                              - 'null'
                            uom:
                              type:
                              - string
                              - 'null'
                          additionalProperties: false
                        condition:
                          enum:
                          - ACCEPTABLE
                          - UNACCEPTABLE
                          - DAMAGED
                          - SHORT
                          - OVERAGE
                          - ADD
                          - REMOVE
                          - RETURNED_TO_STOCK
                          type: string
                        quantity:
                          type: number
                          format: double
                        resolution_status:
                          enum:
                          - UNRESOLVED
                          - ADD_TO_STOCK
                          - RESOLVED_WITHOUT_INVENTORY_CHANGE
                          type: string
                        resolved_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        location_id:
                          type:
                          - string
                          - 'null'
                        notes:
                          type:
                          - string
                          - 'null'
                        invoice:
                          type: object
                          properties:
                            created:
                              type:
                              - boolean
                              - 'null'
                            id:
                              type:
                              - string
                              - 'null'
                            error_codes:
                              type:
