servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Company Offices
paths:
  /rest/v1.0/offices:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List company offices
      description: Returns offices associated with a company.
      tags:
      - Company Offices
      parameters:
      - name: company_id
        in: query
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: Response fields to include. `normal` returns id, address, city, country_code, division, fax, logo, name, phone, state_code, and zip. `extended` additionally returns main_office.
        required: false
        schema:
          type: string
          enum:
          - normal
          - extended
      responses:
        '200':
          description: Company offices.
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of offices for the company.
                items:
                  type: object
                  title: Office
                  description: Company office.
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this office.
                      example: 1
                    name:
                      type: string
                      description: Display name of the office.
                      example: Main Office
                    address:
                      type:
                      - string
                      - 'null'
                      description: Street address of the office.
                      example: 100 Construction Lane
                    city:
                      type:
                      - string
                      - 'null'
                      description: City of the office.
                      example: Santa Barbara
                    state_code:
                      type:
                      - string
                      - 'null'
                      description: State or region code in ISO-3166 Alpha-2 format.
                      example: CA
                    country_code:
                      type:
                      - string
                      - 'null'
                      description: Country code in ISO-3166 Alpha-2 format.
                      example: US
                    zip:
                      type:
                      - string
                      - 'null'
                      description: Postal or ZIP code of the office.
                      example: '93101'
                    phone:
                      type:
                      - string
                      - 'null'
                      description: Phone number of the office.
                      example: '8059831234'
                    fax:
                      type:
                      - string
                      - 'null'
                      description: Fax number of the office.
                      example: '8059834321'
                    division:
                      type:
                      - string
                      - 'null'
                      description: Business division associated with the office.
                      example: First
                    main_office:
                      type: boolean
                      description: Whether this office is the company's main office. Present when view is `extended`.
                      example: true
                    logo:
                      type:
                      - object
                      - 'null'
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the logo file.
                          example: 42
                        name:
                          type:
                          - string
                          - 'null'
                          description: Display name of the logo file.
                          example: office-logo.png
                        url:
                          type:
                          - string
                          - 'null'
                          description: URL of the logo file.
                          example: https://storage.procore.com/files/42/office-logo.png
                        filename:
                          type: string
                          description: Filename of the logo file. Prefer `name`; this field is deprecated.
                          example: office-logo.png
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
