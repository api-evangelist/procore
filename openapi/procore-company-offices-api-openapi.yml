      summary: Create company office
      description: 'Creates an office associated with a company.


        #### Uploading logo

        To upload an office logo you must upload whole payload as `multipart/form-data` content-type

        and specify each parameter as form-data together with `office[logo]` as file.


        #### Country and State codes

        The `country_code` and `state_code` parameter values must conform to the ISO-3166 Alpha-2 specification.

        See Working with Country Codes for additional information.'
      tags:
      - Company Offices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - company_id
              - office
              properties:
                company_id:
                  type: integer
                  description: ID of the company the office belongs to.
                office:
                  title: Office
                  type: object
                  description: Office attributes to create or update.
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Display name of the office.
                    address:
                      type: string
                      description: Street address of the office.
                    city:
                      type: string
                      description: City of the office.
                    state_code:
                      type: string
                      description: State or region code in ISO-3166 Alpha-2 format.
                    country_code:
                      type: string
                      description: Country code in ISO-3166 Alpha-2 format.
                    zip:
                      type: string
                      description: Postal or ZIP code of the office.
                    phone:
                      type: string
                      description: Phone number of the office.
                    fax:
                      type: string
                      description: Fax number of the office.
                    division:
                      type: string
                      description: Business division associated with the office.
                    logo_prostore_file_id:
                      type: integer
                      description: ID of an existing Prostore file to use as the office logo.
              example:
                company_id: 1
                office:
                  name: Main Office
                  address: 100 Construction Lane
                  city: Santa Barbara
                  state_code: CA
                  country_code: US
                  zip: '93101'
                  phone: '8059835555'
                  fax: '8059835558'
                  division: Engineering
                  logo_prostore_file_id: 123456
          multipart/form-data:
            schema:
              title: Body
              type: object
              required:
              - company_id
              - office
              properties:
                company_id:
                  type: integer
                  description: ID of the company the office belongs to.
                office:
                  title: Office
                  type: object
                  description: Office attributes to create or update.
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Display name of the office.
                    address:
                      type: string
                      description: Street address of the office.
                    city:
                      type: string
                      description: City of the office.
                    state_code:
                      type: string
                      description: State or region code in ISO-3166 Alpha-2 format.
                    country_code:
                      type: string
                      description: Country code in ISO-3166 Alpha-2 format.
                    zip:
                      type: string
                      description: Postal or ZIP code of the office.
                    phone:
                      type: string
                      description: Phone number of the office.
                    fax:
                      type: string
                      description: Fax number of the office.
                    division:
                      type: string
                      description: Business division associated with the office.
                    logo:
                      type: string
                      format: binary
                      description: Office logo image file. Send the full payload as multipart/form-data with `office[logo]` as the file field.
              example:
                company_id: 1
                office:
                  name: Main Office
                  address: 100 Construction Lane
                  city: Santa Barbara
                  state_code: CA
                  country_code: US
                  zip: '93101'
                  phone: '8059835555'
                  fax: '8059835558'
                  division: Engineering
                  logo: logo.png
