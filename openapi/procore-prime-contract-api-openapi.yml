openapi: 3.2.0
info:
  title: Procore REST Prime Contract API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Prime Contract
paths:
  /rest/v1.0/potential_change_orders/{potential_change_order_id}/line_items/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: potential_change_order_id
      in: path
      description: Potential Change Order ID
      required: true
      schema:
        type: integer
    - name: id
      in: path
      description: Unique identifier of the Potential Change Order Line Item.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update Potential Change Order Line Item
      description: 'Update a Potential Change Order Line Item.

        Note: For non-budgeted line items, a corresponding budget line item may be created automatically.'
      tags:
      - Prime Contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - project_id
              - line_item
              properties:
                project_id:
                  type: integer
                  description: Unique identifier for the project.
                  example: 34567
                line_item:
                  title: Line Item
                  type: object
                  description: The Line Item object
                  properties:
                    amount:
                      type: string
                      description: Total amount for this line item, as a decimal string. When extended_type is "calculated", this is derived from quantity multiplied by unit_cost. When extended_type is "manual", this value is set directly and takes precedence over unit_cost and quantity.
                      example: '1000.0'
                    cost_code_id:
                      type: integer
                      description: ID of the Cost Code this line item is charged against. Must belong to the project's cost code list.
                      example: 77408196
                    description:
                      type: string
                      description: Free-text description of the work or item this line covers.
                      example: Cleanup
                    extended_type:
                      type: string
                      description: How the line item amount is derived. Use "calculated" to compute amount from quantity and unit cost, or "manual" to set the amount directly.
                      enum:
                      - manual
                      - calculated
                      example: calculated
                    quantity:
                      type: string
                      description: Number of units for this line item, as a decimal string.
                      example: '20.0'
                    line_item_type_id:
                      type: integer
                      description: ID of the Line Item Type (cost classification such as labor, material, or equipment) applied to this line item.
                      example: 5085801
                    origin_data:
                      type: string
                      description: Free-form metadata from an external system, stored to help correlate this line item with its source record.
                      example: AC-1234
                    origin_id:
                      type: string
                      description: Identifier of this line item in the external system it was imported from. Use to match records during integrations.
                      example: 55555
                    tax_code_id:
                      type: integer
                      description: ID of the Tax Code applied to this line item, if any.
                      example: 1
                    unit_cost:
                      type: string
                      description: Cost per unit, as a decimal string. Multiplied by quantity to compute amount when extended_type is "calculated".
                      example: '50.00'
                    uom:
                      type: string
                      description: Unit of measure for the quantity. Must be a unit present in the company's Units of Measure list. On update, send null or an empty string to clear the unit of measure.
                      example: Hours
                      enum:
                      - Any value present in the Company list of Units of Measure
                    wbs_code_id:
                      type: integer
                      description: ID of the Work Breakdown Structure (WBS) code this line item is assigned to.
                      example: 34567
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                title: default
                description: Line Item (when the 'default' view is requested)
                properties:
                  id:
                    type: integer
                    description: Line Item id
                    example: 4896147
                  amount:
                    type: string
                    description: Line Item amount
                    example: '1000.0'
                  company:
                    type: object
                    description: Company
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 163215
                      name:
                        type: string
                        description: Name
                        example: Procore Tech
                  cost_code:
                    type: object
                    title: extended
                    properties:
                      id:
                        type: integer
                        description: Unique identifier for this Cost Code record.
                        example: 12345
                      biller:
                        type: string
                        description: Display name of the entity (project or sub job) that owns this cost code.
                        example: Campus
                      biller_id:
                        type: integer
                        description: Procore ID of the owning project or sub job. Use with biller_type to identify the owning entity.
                        example: 12345
                      biller_type:
                        type: string
                        enum:
                        - Project
                        - SubJob
                        description: 'Type of entity that owns this cost code. One of: ''Project'' (a standard project) or ''SubJob'' (a sub job within the project).'
                        example: Project
                      biller_origin_id:
                        type:
                        - string
                        - 'null'
                        description: ERP origin ID of the owning project or sub job. Null when no ERP origin has been set.
                        example: '98765'
                      budgeted:
                        type: boolean
                        description: Whether this cost code has been marked as budgeted. True when at least one budget line item exists for this cost code.
                        example: false
                      code:
                        type: string
                        description: Cost code segment, not including the parent prefix. For example, for full code "02-300", this field is "300".
                        example: '300'
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp when this cost code was created, in ISO 8601 format.
                        example: '2015-05-15T00:00:00Z'
                      deleted_at:
                        type: string
                        format: date-time
                        description: Timestamp when this cost code was soft-deleted, in ISO 8601 format. Null when the record is active.
                        example: '2017-07-29T21:39:40Z'
                      full_code:
                        type: string
                        description: Full cost code including all parent prefixes (e.g. "02-300").
                        example: 02-300
                      name:
                        type: string
                        description: Display name of the cost code.
                        example: Earthwork
                      origin_data:
                        type: string
                        description: Free-form third-party metadata string from the ERP system. Null when no ERP origin data has been set.
                        example: OD-129947
                      origin_id:
                        type: string
                        description: ERP system identifier for this cost code. Used by sync operations to match records across systems.
                        example: '9874484'
                      parent:
                        type: object
                        description: The immediate parent cost code of this record, if any.
                        properties:
                          id:
                            type: integer
                            description: Procore ID of this cost code's parent cost code. Null for root-level cost codes.
                            example: 2345
                      position:
                        type: integer
                        description: Sort order of this cost code within its parent.
                        example: 1
                      sortable_code:
                        type: string
                        description: Deprecated alias for full_code. Use full_code instead. Included for backwards compatibility.
                        example: 02-300
                      standard_cost_code_id:
                        type: integer
                        description: ID of the company-level standard cost code that this project cost code was created from. Null when not derived from a standard list.
                        example: 122334
                      standard_cost_code_list_id:
                        type:
                        - integer
                        - 'null'
                        description: ID of the company-level standard cost code list associated with this cost code via its standard cost code. Null when not linked to a standard list. Only present in the extended view.
                        example: 133445
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when this cost code was last updated, in ISO 8601 format.
                        example: '2015-05-15T00:00:00Z'
                      line_item_types:
                        type: array
                        description: Array of line item types (cost types) assigned to this cost code. Each entry represents one Cost Code / Line Item Type assignment.
                        items:
                          type: object
                          title: LineItemType
                          description: A line item type assigned to this cost code.
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the Line Item Type.
                              example: 12345
                            name:
                              type: string
                              description: Display name of the Line Item Type.
                              example: Equipment
                            code:
                              type: string
                              description: Short code used for CSV import of this Line Item Type.
                              example: LB
                            base_type:
                              type: string
                              enum:
                              - equipment
                              - materials
                              - commitment
                              - owner_cost
                              - professional_services
                              - labor
                              - other
                              description: 'Canonical cost category for this line item type. One of: ''equipment'', ''materials'', ''commitment'', ''owner_cost'', ''professional_services'', ''labor'', ''other''.'
                              example: materials
                            origin_id:
                              type:
                              - string
                              - 'null'
                              description: ERP system identifier for this line item type. Null when not linked to an ERP system.
                              example: ABC123
                  created_at:
