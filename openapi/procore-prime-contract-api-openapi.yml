          payload = "{\"updates\":[{\"id\":123,\"amount\":\"1000.0\",\"cost_code_id\":77408196,\"description\":\"Cleanup\",\"extended_type\":\"calculated\",\"quantity\":\"20.0\",\"line_item_type_id\":5085801,\"origin_data\":\"AC-1234\",\"origin_id\":55555,\"tax_code_id\":1,\"unit_cost\":\"50.00\",\"uom\":\"Hours\",\"wbs_code_id\":34567}]}"


          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v1.0/prime_contracts/%7Bprime_contract_id%7D/line_items/sync?project_id=SOME_INTEGER_VALUE", payload, headers)


