      summary: List Change Event Production Quantities
      description: Returns a list of all Change Event Production Quantities for a given Change Event.
      tags:
      - Change Event Production Quantities
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this Change Event Production Quantity. Use as the {id} path parameter to update or delete it via /rest/v1.0/projects/{project_id}/change_events/{change_event_id}/change_event_production_quantities/{id}.
                      example: 999
                    cost_code_id:
                      type: integer
                      description: ID of the Cost Code this production quantity is attributed to. Kept in sync with wbs_code_id.
                      example: 123
                    quantity:
                      type: string
                      description: Quantity of work for this production item, in the given unit of measure. Returned as a decimal string.
                      example: '2250.0'
                    uom:
                      type: string
                      description: Unit of measure for the quantity. Must be a unit from the company's Units of Measure master list that is not categorized as "Time".
                      example: sf
                    description:
                      type: string
                      description: Free-text description of the production quantity item.
                      example: Additional Concrete Needed
                    wbs_code_id:
                      type: integer
                      description: ID of the WBS (Budget) Code this production quantity is attributed to. Kept in sync with cost_code_id.
                      example: 333
