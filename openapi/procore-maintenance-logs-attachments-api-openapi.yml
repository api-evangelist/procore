openapi: 3.2.0
info:
  title: Procore REST Maintenance Logs Attachments API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Maintenance Logs Attachments
paths:
  /rest/v1.0/companies/{company_id}/managed_equipment_maintenance_logs/{id}/attachments:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      deprecated: true
      x-deprecated-at: '2024-12-01'
      x-sunset: '2025-12-02'
      summary: List all maintenance logs attachment
      description: Return a list of all Maintenance Log attachments for the Maintenance Log the current user has access to.
      tags:
      - Maintenance Logs Attachments
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: Identifier of the managed equipment maintenance log.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of managed equipment maintenance logs attachments
                items:
                  type: object
                  title: ManagedEquipmentMaintenanceLogsAttachment
                  description: Maintenance Log Attachment
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of this maintenance log attachment.
                      example: 75413
                    presentation_url:
                      type: string
                      description: URL for the presentation-sized rendering of the attached file. Suitable for display in a viewer.
                      example: http://www.example.com/presentation_url
                    url:
                      type: string
                      description: URL for downloading the original attached file at full resolution.
                      example: http://www.example.com/
                    thumbnail_url:
                      type: string
                      description: URL for a thumbnail-sized preview of the attached file. Suitable for list views.
                      example: http://www.example.com/thumbnail_url
                    filename:
                      type: string
                      description: Original filename of the uploaded attachment, including its file extension.
                      example: Example Filename
                    content_type:
                      type: string
                      description: MIME type of the attached file, such as application/pdf or image/png.
                      example: image/png
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/managed_equipment_maintenance_logs/%7Bid%7D/attachments'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/companies/%7Bcompany_id%7D/managed_equipment_maintenance_logs/%7Bid%7D/attachments")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/managed_equipment_maintenance_logs/%7Bid%7D/attachments"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/managed_equipment_maintenance_logs/%7Bid%7D/attachments\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
