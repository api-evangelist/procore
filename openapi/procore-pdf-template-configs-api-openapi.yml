servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: PDF Template Configs
paths:
  /rest/v1.0/companies/{company_id}/pdf_template_configs:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List PDF template configs
      description: Returns a list of PDF template configs
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[record_generic_tool_id]
        in: query
        required: false
        description: Return item(s) with the specified Generic Tool ID.
        schema:
          type: integer
      - name: filters[project_id]
        in: query
        description: Return item(s) with the Project ID.
        schema:
          type: integer
      - name: filters[template_name]
        in: query
        description: Return item(s) with provided template_name.
        schema:
          type: string
      - name: filters[only_parent]
        in: query
        description: Return only parent records.
        schema:
          type: boolean
      - name: scope
        in: query
        description: Return only scoped records.
        schema:
          type: string
          enum:
          - inspections
      tags:
      - PDF Template Configs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID
                      example: 333675
                    description:
                      type: string
                      description: description of the PdfTemplateConfig
                      example: pdf template config description
                    template_name:
                      type: string
                      description: PdfTemplate name
                      example: bid_single
                    default_project:
                      type: boolean
                      description: set the configs as default to every company's project
                    pdf_config_options:
                      type: object
                      properties:
                        collapse_na_sections:
                          type: boolean
                        show_na_items:
                          type: boolean
                        show_status_change:
                          type: boolean
                        show_activity_details:
                          type: boolean
                        disclaimer_footer_text:
                          type: boolean
                        attendees_table_format:
                          type: boolean
                        attendees_phone_number_display:
                          type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
