        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/pdf_template_configs?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Brecord_generic_tool_id%5D=SOME_INTEGER_VALUE&filters%5Bproject_id%5D=SOME_INTEGER_VALUE&filters%5Btemplate_name%5D=SOME_STRING_VALUE&filters%5Bonly_parent%5D=SOME_BOOLEAN_VALUE&scope=SOME_STRING_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
