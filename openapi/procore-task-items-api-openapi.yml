    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create a task item comment
      description: Create a new task item comment for a given task_item_id and created_by_id
      tags:
      - Task Items
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_item_comment:
                  type: object
                  required:
                  - task_item_id
                  properties:
                    comment:
                      type: string
                      description: The message of the comment
                      example: Clean up area 4
                    status:
                      type: string
                      description: 'The status of the task item at the time the comment is created.

                        Standard users who are assigned to the task item cannot change the status to closed or void.'
                      example: in_progress
                      enum:
                      - initiated
                      - in_progress
                      - ready_for_review
                      - closed
                      - void
                    task_item_id:
                      type: integer
                      description: The task_item associated with the comment
                      example: 731
                    attachments:
                      type: array
                      description: 'Attachments.

                        To upload attachments you must upload the entire payload as `multipart/form-data` content-type and

                        specify each parameter as form-data together with `attachments[]` as files.'
                      items:
                        type: string
                    drawing_revision_ids:
                      type: array
                      description: Drawing Revisions to attach to the response
                      items:
                        type: integer
                      example:
                      - 4
                      - 5
                    file_version_ids:
                      type: array
