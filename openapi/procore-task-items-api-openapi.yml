  /rest/v1.0/companies/{company_id}/projects/{project_id}/task_item_comments:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Task Item Comments
      description: Returns a list of comments associated with the project. Can be filtered by task_item_id and/or created_by_id.
      tags:
      - Task Items
      parameters:
      - name: filters[task_item_id]
        in: query
        description: Filter by task_item_id to return comments for only that task_item
        required: false
        schema:
          type: integer
      - name: filters[created_by_id]
        in: query
        description: Returns item(s) created by the specified User IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: 'Serialization view for each comment. Defaults to **`normal`** when omitted.


          - **`compact`** — core fields including `task_item_id` (no nested `created_by` / attachments metadata).

          - **`normal`** — includes `created_by` and attachments (default).

          - **`extended`** — includes nested `task_item` (compact); omits `task_item_id`.

          '
        required: false
        schema:
          type: string
          enum:
          - compact
          - normal
          - extended
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - title: compact
                  description: When `view=compact`
                  type: array
                  items:
                    type: object
                    description: Compact view — core fields without nested associations
                    properties:
                      id:
                        type: integer
                        description: Unique ID of the comment
                      comment:
                        type: string
                        description: The message of the comment
                      status:
                        type: string
                        description: The status of the task item at the time this comment was created or updated
                        enum:
                        - initiated
                        - in_progress
                        - ready_for_review
                        - closed
                        - void
                      task_item_id:
                        type: integer
                        description: The task item id associated with the comment
                      created_by_id:
                        type: integer
                        description: Login ID of the user who created the comment
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                - title: normal
                  description: When `view=normal` or omitted
                  type: array
                  items:
                    type: object
                    description: Normal view of task item comment
                    properties:
                      id:
                        type: integer
                        description: Unique ID of the comment
                        example: 6732
                      comment:
                        type: string
                        description: The actual message of the comment
                        example: This comment just needs signoff
                      status:
                        type: string
                        description: The status of the task item at the time this comment was created
                        example: in_progress
                        enum:
                        - initiated
                        - in_progress
                        - ready_for_review
                        - closed
                        - void
                      attachments:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 5324
                          url:
                            type: string
                            description: URL
                            example: http://www.example.com/
                          filename:
                            type: string
                            description: Filename
                            example: january_receipt_copy.jpg
                      created_by:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the login information.
                            example: 513
                          name:
                            type: string
                            description: The name that is associated with the login information.
                            example: Jane Doe
                          login:
                            type: string
                            description: The email address that is associated with the login information.
                            example: test.user@example.com
                      task_item_id:
                        type: integer
                        description: The task item id associated with the comment
                        example: 626
                      created_at:
                        type: string
                        format: date-time
                        description: The UTC datetime for the creation of the resource in ISO 8601 format.
                        example: '2019-09-14T16:20:00Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: The UTC datetime for the last update of the resource in ISO 8601 format.
                        example: '2019-09-14T16:20:00Z'
                - title: extended
                  description: When `view=extended`
                  type: array
                  items:
                    type: object
                    description: Extended view — includes `task_item` (compact) and omits `task_item_id` in favor of the nested task item.
                    properties:
                      id:
                        type: integer
                        description: Unique ID of the comment
                      comment:
                        type: string
                      status:
                        type: string
                        enum:
                        - initiated
                        - in_progress
                        - ready_for_review
                        - closed
                        - void
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      created_by:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          login:
                            type: string
                      attachments:
                        type: object
                        description: Attachment metadata (shape matches normal view)
                      task_item:
                        type: object
                        description: Compact serialization view
                        properties:
                          id:
                            type: integer
                            description: Task item ID
                          title:
                            type: string
                            description: Title
        '403':
          description: User does not have the required permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
