                      items:
                        type: integer
                      example:
                      - 6
                      - 7
                    form_ids:
                      type: array
                      description: Forms to attach to the response
                      items:
                        type: integer
                      example:
                      - 7
                      - 8
                    image_ids:
                      type: array
