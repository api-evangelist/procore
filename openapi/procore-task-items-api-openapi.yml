openapi: 3.2.0
info:
  title: Procore REST Task Items API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Task Items
paths:
  /rest/v1.0/companies/{company_id}/projects/{project_id}/task_item_categories:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List task item categories
      description: Returns a list of task item categories associated with the company
      tags:
      - Task Items
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: 'Serialization view. Defaults to **`normal`**.


          - **`ids_only`** — JSON array of category IDs (integers); pagination headers apply.

          - **`compact`** / **`normal`** — `id` and friendly `name`.

          - **`extended`** — adds `created_at` and `updated_at`.

          '
        required: false
        schema:
          type: string
          enum:
          - ids_only
          - compact
          - normal
          - extended
      responses:
        '200':
          description: 'OK — shape depends on `view` (see parameter). Default is an array of categories (**normal**).

            '
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - title: ids_only
                  description: When `view=ids_only`
                  type: array
                  items:
                    type: integer
                - title: compact_or_normal
                  description: When `view=compact` or `view=normal` or omitted
                  type: array
                  items:
                    type: object
                    description: Information about task items categories associated with company
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Unique integer ID
                        example: 2827
                      name:
                        type: string
                        description: User given name of category
                        example: Electrical
                - title: extended
                  description: When `view=extended`
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                        description: Friendly category name
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
        '403':
          description: User does not have required permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
