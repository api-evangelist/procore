paths:
  /rest/v1.0/companies/{company_id}/action_plans/plan_template_references/bulk_create:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Bulk Create Plan Template References
      description: Creates multiple Plan Template References
      tags:
      - Plan Template References
      parameters:
      - name: completion_mode
        in: query
        description: Whether to update what can be or nothing if one can not be updated. Defaults to "all_or_nothing"
        schema:
          type: string
          enum:
          - all_or_nothing
          - atomic
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - plan_template_references
              properties:
                plan_template_references:
                  title: Plan Template References
                  type: array
                  items:
                    type: object
                    required:
                    - plan_template_item_id
                    - type
                    - payload
                    properties:
                      plan_template_item_id:
                        type: integer
                        description: Plan Template Item ID
                        example: 54
                      type:
                        type: string
                        description: Plan Template Reference Type
                        enum:
                        - attachment
                        example: specification_section
                      payload:
                        type: object
                        description: Payload for the attachment type
                        properties:
                          attachment:
                            type: string
                            format: binary
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of update status
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The ID of the Item
                        example: 123
                      status:
                        type: string
                        description: status of the update on that Item
                        enum:
                        - success
                        - failure
                        example: success
                      errors:
                        type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
