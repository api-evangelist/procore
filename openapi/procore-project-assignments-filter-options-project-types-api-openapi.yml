paths:
  /rest/v1.0/companies/{company_id}/users/{user_id}/project_assignments/filter_options/project_types:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: user_id
      in: path
      description: User ID
      required: true
      schema:
        type: integer
    - name: scope
      in: query
      required: false
      description: 'The scope to use when getting the filter options for project assignments.

        The user scope returns only filter options for projects that the user is currently assigned to.

        The company scope returns all filter options for all projects in the company.

        The user scope is the default.'
      schema:
        type: string
        enum:
        - user
        - company
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Project Types for a Company User
      description: This endpoint returns the list of Project Types for the specified User.
      tags:
      - Project Assignments Filter Options - Project Types
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of project types
                items:
                  type: object
                  properties:
                    filter_value:
                      type: integer
                      description: Project Type ID
                      example: 1
                    label:
                      type: string
                      description: Project Type name
                      example: Commercial
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
