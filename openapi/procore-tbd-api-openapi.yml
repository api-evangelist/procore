        description: Unique identifier for the Commitment Contract.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                wbs_pdf_groups:
                  type: array
                  description: Optional list of Work Breakdown Structure (WBS) segment group identifiers used to group the contract's line items in the generated PDF. Each entry is the string id of a WBS segment, optionally suffixed with a tier index (for example "123" or "123,0"). Omit to render line items without WBS grouping.
                  items:
                    type: string
                  example:
                  - '123'
                  - 456,0
