    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Check PDF generation status
      description: 'Check the status of a PDF document generation for a Commitment Change Order Batch.

        Note: This endpoint is currently only supported in Procore Zones US01 && US02.'
