                      property_type:
                        enum:
                        - BOOLEAN
                        - DATE
                        - NUMBER
                        - LOCATION
                        - TEXT
                        - HIDDEN
                        - PERSON
                        type: string
                    additionalProperties: false
                  description: Collection of resource parameters to delete from the document header.
                name:
                  type:
                  - string
                  - 'null'
                  description: Name of the document header.
                description:
                  type:
                  - string
                  - 'null'
                  description: Description of the document header.
                notes:
                  type:
                  - string
                  - 'null'
                  description: Notes associated with the document header.
                scope_start_at:
                  type:
                  - string
                  - 'null'
                  description: Start date and time for scope. Clears header field if value is an empty string or "0001-01-01T00:00:00.0000000+00:00".
                  format: date-time
                scope_end_at:
                  type:
                  - string
                  - 'null'
                  description: End date and time for the scope. Clears header field if value is an empty string or "0001-01-01T00:00:00.0000000+00:00".
                  format: date-time
                required_on_site_date:
                  type:
                  - string
                  - 'null'
                  description: Date and time by which the item is required to be on site.
                  format: date-time
                status:
                  enum:
                  - DRAFT
                  - FINAL
                  - CLOSED
                  - READY_FOR_REVIEW
                  type: string
                void:
                  type:
                  - boolean
                  - 'null'
                  description: 'When true, voids the document by setting the quantity required on every line item to 0.

                    Only admin users can void, and only Final documents are eligible.

                    When `notes` is also supplied it is applied to the document note as part of the void.'
              additionalProperties: false
              description: Represents a request to update header fields for a document that requires a header patch operation.
