  /rest/v2.0/companies/{company_id}/projects/{project_id}/materials_mgmt/material_requirements/{id}/line_items/sync:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      tags:
      - MaterialRequirements
      summary: Sync material requirements lines
      description: 'Creates or updates material requirements lines identified using either ids or origin_ids.

        The material on the line must already exist and can be specified using either item_id or item_origin_id.

        The connected material requirements header must already exist.

        The maximum number of entities per request is 1000. Exceeding this limit will result in a 413 response.

        See https://developers.procore.com/documentation/using-sync-actions for more information.'
