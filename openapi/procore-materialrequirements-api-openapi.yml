    delete:
      tags:
      - MaterialRequirements
      summary: Recycles a material requirement
      description: 'Recycles a material requirement. When recycle_items is false, only the requirement document is recycled.

        When recycle_items is true, associated items in resource_project are also recycled.

        If the items on the requirement are connected to other documents, the items cannot be recycled.

        Fails with 400 if the requirement is in Final state.'
      operationId: MaterialRequirements_RecycleMaterialRequirement
      parameters:
      - name: id
        in: path
        description: Material requirement ID
        required: true
        schema:
          type: string
          format: uuid
      - name: recycle_items
        in: query
        description: If true, also recycle items in resource_project for this requirement's lines; default false
        schema:
          type: boolean
          default: false
        required: false
      - name: company_id
