                      property_type:
                        enum:
                        - BOOLEAN
                        - DATE
                        - NUMBER
                        - LOCATION
                        - TEXT
                        - HIDDEN
                        - PERSON
                        type: string
                    additionalProperties: false
                  description: Collection of resource parameters to update in the document header.
                properties_to_delete:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
                      key:
                        type:
                        - string
                        - 'null'
                      value:
                        type:
                        - string
                        - 'null'
                        description: 'Value rules:


                          - TEXT: Any string

                          - BOOLEAN: "true" / "false"

                          - DATE: "YYYY-MM-DD" (e.g. "2026-03-02"). Send null or "" to clear.

                          - NUMBER: Numeric string (e.g. "42", "3.14"). Stored as-is.

                          - LOCATION: Any string (e.g. a location name or ID)

                          - HIDDEN: Any string

