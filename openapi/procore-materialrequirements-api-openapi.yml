paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/materials_mgmt/material_requirements/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      tags:
      - MaterialRequirements
      summary: Updates a material requirements document header
      description: 'Updates header fields such as title, notes, and status on the material requirements document.

        Use status transitions to move the document through its workflow states.

        Send `void` as true to void the document instead, which sets the quantity required on every line item to 0.

        Voiding is admin only, applies to Final documents only, and applies `notes` to the document note when provided.'
      operationId: MaterialRequirements_PatchNeeds
      parameters:
      - name: id
        in: path
        description: The material requirements document ID.
        required: true
        schema:
          type: string
          format: uuid
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: The patch request containing the updates.
        content:
          application/json:
            schema:
              type: object
              properties:
                properties_to_add:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
                      key:
                        type:
                        - string
                        - 'null'
                      value:
                        type:
                        - string
                        - 'null'
                        description: 'Value rules:


                          - TEXT: Any string

                          - BOOLEAN: "true" / "false"

                          - DATE: "YYYY-MM-DD" (e.g. "2026-03-02"). Send null or "" to clear.

                          - NUMBER: Numeric string (e.g. "42", "3.14"). Stored as-is.

                          - LOCATION: Any string (e.g. a location name or ID)

                          - HIDDEN: Any string

                          - PERSON: A valid long user/person ID as string (e.g. "12345"). Send null, "", or "0" to clear.'
                      property_type:
                        enum:
                        - BOOLEAN
                        - DATE
                        - NUMBER
                        - LOCATION
                        - TEXT
                        - HIDDEN
                        - PERSON
                        type: string
                    additionalProperties: false
                  description: Collection of resource parameters to add to the document header.
                properties_to_update:
                  type:
                  - array
                  - 'null'
                  items:
                    type: object
                    properties:
