              properties:
                work_classification:
                  title: WorkClassification
                  type: object
                  description: Work Classification Object
                  properties:
                    name:
                      type: string
                      description: Name of the classification
                      example: Driver
                    abbreviation:
                      type: string
                      description: The shortened form of classification
                      example: DR1
      responses:
        '201':
          description: Classification Created Succesfully
          content:
            application/json:
              schema:
                type: object
                description: Work Classification
                properties:
