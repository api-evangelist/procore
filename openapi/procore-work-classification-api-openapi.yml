      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/work_classifications?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&serializer_view=SOME_STRING_VALUE'"
