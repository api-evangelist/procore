servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Work Classification
paths:
  /rest/v1.0/companies/{company_id}/work_classifications:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List all Classification
      description: Return a list of all Classification with details for a specified company.
      tags:
      - Work Classification
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: serializer_view
        in: query
        description: The data set that should be returned from the serializer. Default view is normal.
        required: false
        schema:
          type: string
          enum:
          - compact
          - extended
          - ids_only
          - normal
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Classification
                items:
                  type: object
                  description: Work Classification
                  properties:
                    id:
                      type: integer
                      description: ID
                      example: 57869
                    name:
                      type: string
                      description: The name of the classification
                      example: Driver
                    abbreviation:
                      type: string
                      description: The shortened form of classification
                      example: DR1
                    company_id:
                      type: integer
                      description: The comapny ID the classification was created with
                      example: 1
                    deletable:
                      type: boolean
                      description: Indicates if the classification can be deleted
                      example: true
                      readOnly: true
                    company_visible:
                      type: boolean
                      description: Is the classification visible as a company classification
                      example: false
                    updated_at:
                      type: string
                      format: date-time
                      description: Date the classification was updated
                      example: '2019-12-10T22:10:33Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Date the classification was created
                      example: '2019-12-10T22:10:33Z'
                    created_by_id:
                      type: integer
                      description: The user ID the classification was created with
                      example: 7
                    project_ids:
                      type: array
                      items:
                        type: integer
                        description: Project ids the classification has belongs to
                        example:
                        - 2
                        - 4
                        - 56
                        - 78
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
