openapi: 3.2.0
info:
  title: Procore REST Sub Jobs API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Sub Jobs
paths:
  /rest/v1.0/sub_jobs:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Sub Jobs
      description: Return a list of all Sub Jobs in a specified Project.
      tags:
      - Sub Jobs
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - type: object
                    properties:
                      origin_id:
                        type:
                        - string
                        - 'null'
                        description: Third-party unique identifier assigned by an ERP or external integration system. Null when the sub job has not been synced with an external system. Use to correlate sub jobs with records in an integrated ERP.
                        example: ERP-SUB-001
                      origin_code:
                        type:
                        - string
                        - 'null'
                        description: Third-party code assigned by an ERP or external integration system, distinct from origin_id. Null when the sub job has not been synced externally or when the integration does not use a separate code field.
                        example: SJ-CODE-42
                      origin_data:
                        type:
                        - string
                        - 'null'
                        description: Arbitrary JSON string containing additional third-party data associated with this sub job by an external integration. Null when not synced externally. Parse as JSON to access individual fields.
                        example: '{"data_field":{"is_important":true}}'
                      created_at:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp of when this sub job was created. Use to sort or filter sub jobs by creation date.
                        example: '2017-08-14T21:39:40Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: ISO 8601 timestamp of when this sub job was last modified. Use to detect whether cached sub job data needs to be refreshed.
                        example: '2017-08-15T21:39:40Z'
                  - type: object
                    properties:
                      id:
                        type: integer
                        description: Unique integer identifier for this sub job. Use as the {id} path parameter in GET/PATCH/DELETE /rest/v1.0/sub_jobs/{id}.
                        example: 3483483
                      name:
                        type: string
                        description: Display name of the sub job shown in the UI and budget code pickers (e.g. "Floor 2", "Phase 1 - Foundation").
                        example: Floor 2
                      code:
                        type:
                        - string
                        - 'null'
                        description: Short alphanumeric code identifying the sub job within the project. Unique per project (scoped to project_id). Null when no code has been assigned. Use as a compact identifier in budget code strings.
                        example: '18'
        '403':
          description: User does not have right permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/sub_jobs',\n  qs: {\n    project_id: 'SOME_INTEGER_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/sub_jobs?project_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/sub_jobs?project_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/sub_jobs?project_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
