  /rest/v1.0/sub_jobs/sync:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Sync Sub Jobs
      tags:
      - Sub Jobs
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: Sub Job Sync Body
              type: object
              required:
              - updates
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Procore integer ID of the sub job to update. Use the id field from GET /rest/v1.0/sub_jobs. Omit to create a new sub job during sync.
                        example: 13513
                      name:
                        type: string
                        description: Display name for the sub job (e.g. "Floor 2", "Phase 1 - Foundation").
                        example: Floor 2
                      code:
                        type: string
                        description: Short alphanumeric code for the sub job, unique within the project.
                        example: '18'
                      origin_id:
                        type: string
                        description: Third-party unique identifier from an ERP or external integration used to match this sub job to an external record.
                      origin_data:
                        type: string
                        description: Arbitrary JSON string containing additional third-party data from an external integration.
                        example: '{"data_field":{"is_important":true}}'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    description: Array of sub job objects that were successfully created or updated during the sync. Each object conforms to the sub_job schema.
                    items:
                      allOf:
                      - type: object
                        properties:
                          origin_id:
                            type:
                            - string
                            - 'null'
                            description: Third-party unique identifier assigned by an ERP or external integration system. Null when the sub job has not been synced with an external system. Use to correlate sub jobs with records in an integrated ERP.
                            example: ERP-SUB-001
                          origin_code:
                            type:
                            - string
                            - 'null'
                            description: Third-party code assigned by an ERP or external integration system, distinct from origin_id. Null when the sub job has not been synced externally or when the integration does not use a separate code field.
                            example: SJ-CODE-42
                          origin_data:
                            type:
                            - string
                            - 'null'
                            description: Arbitrary JSON string containing additional third-party data associated with this sub job by an external integration. Null when not synced externally. Parse as JSON to access individual fields.
                            example: '{"data_field":{"is_important":true}}'
                          created_at:
                            type: string
                            format: date-time
                            description: ISO 8601 timestamp of when this sub job was created. Use to sort or filter sub jobs by creation date.
                            example: '2017-08-14T21:39:40Z'
                          updated_at:
                            type: string
                            format: date-time
                            description: ISO 8601 timestamp of when this sub job was last modified. Use to detect whether cached sub job data needs to be refreshed.
                            example: '2017-08-15T21:39:40Z'
                      - type: object
                        properties:
                          id:
                            type: integer
                            description: Unique integer identifier for this sub job. Use as the {id} path parameter in GET/PATCH/DELETE /rest/v1.0/sub_jobs/{id}.
                            example: 3483483
                          name:
                            type: string
                            description: Display name of the sub job shown in the UI and budget code pickers (e.g. "Floor 2", "Phase 1 - Foundation").
                            example: Floor 2
                          code:
                            type:
                            - string
                            - 'null'
                            description: Short alphanumeric code identifying the sub job within the project. Unique per project (scoped to project_id). Null when no code has been assigned. Use as a compact identifier in budget code strings.
                            example: '18'
                  errors:
                    type: array
                    description: Array of error objects for sub jobs that failed to sync. Each object contains the sub job id, and an errors map keyed by attribute name listing validation messages.
                    items:
                      type: object
                    example:
                    - id: 3
                      errors:
                        id:
                        - Entity with this ID not found
