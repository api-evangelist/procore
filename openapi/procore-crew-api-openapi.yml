servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Crew
paths:
  /rest/v1.0/projects/{project_id}/crews:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create a new Crew
      description: Create a new Crew associated with the specified Project.
      tags:
      - Crew
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Crew Body
              type: object
              required:
              - crew
              properties:
                crew:
                  title: Crew
                  type: object
                  description: Crew Object
                  properties:
                    lead_party_id:
                      type: integer
                      description: Party Id of crew leader
                      example: 1
                    name:
                      type: string
                      description: Crew Name
                      example: ADL Crew
                    party_ids:
                      type: array
                      items:
                        type: integer
                        description: Party Ids of crew members
                    equipment_ids:
                      type: array
                      items:
                        type: integer
                        description: Equipment Ids of equipment on crew
      responses:
        '201':
          description: Crew Created Succesfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  project_id:
                    type: integer
                  company_id:
                    type: integer
                  employees:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                  lead:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                  lead_party:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      first_name:
                        type: string
                        description: First Name
                        example: Carl
                      last_name:
                        type: string
                        description: Surname
                        example: Contractor
                      is_employee:
                        type: boolean
                        description: Is an Employee?
                        example: true
                      employee_id:
                        type: string
                        description: Employee ID if an employee
                        example: 1234
                      user_id:
                        type: integer
                        description: User ID if a user
                        example: 123
                      is_active:
                        type: boolean
                        description: Is active party?
                        example: true
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        first_name:
                          type: string
                          description: First Name
                          example: Carl
                        last_name:
                          type: string
                          description: Surname
                          example: Contractor
