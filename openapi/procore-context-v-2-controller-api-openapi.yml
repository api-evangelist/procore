        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Put,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/contexts/%7Bcontext_id%7D\"),\n    Content = new StringContent(\"{\\\"name\\\":\\\"string\\\",\\\"settings\\\":{\\\"property1\\\":null,\\\"property2\\\":null}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
    delete:
      tags:
      - context-v-2-controller
      summary: Delete context by ID
      description: Delete a context and all its associated layers, groups, and markups using context ID.
      operationId: deleteContext
      parameters:
      - name: company_id
        in: path
        description: Unique identifier of the company
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: Unique identifier of the project
        required: true
        schema:
          type: string
      - name: context_id
        in: path
        description: Unique identifier of the context
        required: true
        schema:
          type: string
      - name: skip_resource_deletion
        in: query
        description: When true, skip deletion of associated resources (markups)
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: No Content
