        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context_type:
                  type: string
                  enum:
                  - document_revision
                  - document_container
                  - FileVersion
                  - folders_attachments
                  - specification_section_revision
                  - drawing_revision
                context_type_id:
                  type: string
                  minLength: 1
                sub_context_type:
                  type: string
                  enum:
                  - NONE
                  - PIN
                sub_context_type_id:
                  type: string
                include_groups:
                  type: boolean
              required:
              - context_type
              - context_type_id
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      context:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          context_type:
                            type: string
                            enum:
                            - document_revision
                            - document_container
                            - FileVersion
                            - folders_attachments
                            - specification_section_revision
                            - drawing_revision
                          context_type_id:
                            type: string
                          sub_context_type:
                            type: string
                            enum:
                            - NONE
                            - PIN
                          sub_context_type_id:
                            type: string
                          company_id:
                            type: string
                          project_id:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                          created_by_id:
                            type: string
                          deleted:
                            type: boolean
                          settings:
                            type: object
                            additionalProperties: {}
                          layers:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                name:
                                  type: string
                                type:
                                  type: string
                                  enum:
                                  - PRIVATE
                                  - PUBLIC
                                context_id:
                                  type: string
                                company_id:
                                  type: string
                                project_id:
                                  type: string
                                created_at:
                                  type: string
                                  format: date-time
                                updated_at:
                                  type: string
                                  format: date-time
                                created_by_id:
                                  type: string
                                deleted:
                                  type: boolean
                                visibility:
                                  type: boolean
                                order_index:
                                  type: number
                                settings:
                                  type: object
                                  additionalProperties: {}
                                groups:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      id:
                                        type: string
                                      name:
                                        type: string
                                      layer_id:
                                        type: string
                                      company_id:
                                        type: string
                                      project_id:
                                        type: string
                                      created_at:
                                        type: string
                                        format: date-time
                                      updated_at:
                                        type: string
                                        format: date-time
                                      created_by_id:
                                        type: string
                                      deleted:
                                        type: boolean
                                      visibility:
                                        type: boolean
                                      order_index:
                                        type: number
                                      color:
                                        type: string
                                      settings:
                                        type: object
                                        additionalProperties: {}
                                      editable:
                                        type: boolean
                                      allow_delete:
                                        type: boolean
                                      system_generated_read_only:
                                        type: boolean
                                      layer_type:
                                        type: string
                                        enum:
                                        - PRIVATE
                                        - PUBLIC
                                      sub_context_type_id:
                                        type: string
                                editable:
                                  type: boolean
                      created:
                        type: boolean
      x-rate-limit-enabled: true
      x-doc:
        visibility: public
        stage: ga
