  /rest/v2.0/companies/{company_id}/projects/{project_id}/layer_structure:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      tags:
      - context-v-2-controller
      summary: Get complete layer structure
      description: Retrieve or create the complete hierarchy (contexts -> layers -> groups) by context type.
      operationId: getLayerStructure
      parameters:
      - name: company_id
        in: path
        description: Unique identifier of the company
        required: true
        schema:
          type: string
      - name: project_id
        in: path
