                      description: Represents whether or not a user can be a Point of Contact for an Inspection.
                      example: true
                    potential_distribution_member:
                      type: boolean
                      description: Represents whether or not a user can be a Distribution Member for an Inspection.
                    potential_signatory:
                      type: boolean
