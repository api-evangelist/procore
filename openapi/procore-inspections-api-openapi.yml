openapi: 3.2.0
info:
  title: Procore REST Inspections API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Inspections
paths:
  /rest/v1.0/projects/{project_id}/checklist/lists:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Checklist (Inspection)
      description: Creates an instance of Inspection in a given Project
      tags:
      - Inspections
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: run_configurable_validations
        in: query
        required: false
        description: If true, validations are run for the corresponding Configurable Field Set.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - list_template_id
              - list
              properties:
                list_template_id:
                  type: integer
                  format: int64
                  description: ID of the Checklist List Template (Inspection Template) that the Checklist (Inspection) will be created from
                  example: 12
                list:
                  type: object
                  properties:
                    description:
                      type: string
                      description: Description of the Inspection
                      example: Ensure proper window installation
                    due_at:
                      type: string
                      format: date-time
                      description: Timestamp indicating when the Inspection is due.
                      example: '2019-08-18T23:36:30Z'
                    inspection_date:
                      type: string
                      format: date
                      description: Date of the Inspection
                      example: '2019-10-31'
                    inspection_type_id:
                      type: integer
                      description: The ID of the Inspection's Type
                      example: 34
                    number:
                      type: integer
                      description: The Number of the Checklist. If no number is passed in, the next available number will be used.
                      example: 42
                    managed_equipment_id:
                      type: integer
                      description: The ID of the Inspection's Managed Equipment
                      example: 123
                    point_of_contact_id:
                      type: integer
                      description: The ID of the Inspection's Point of Contact
                      example: 12
                    inspector_ids:
                      type: array
                      description: The IDs of the Inspectors performing the Inspection
                      items:
                        type: integer
                      example:
                      - 12
                      - 13
                    private:
                      type: boolean
                      description: Indicates whether this Inspection is private
                      default: true
                      example: true
                    responsible_contractor_id:
                      type: integer
                      description: The ID of the Inspection's Responsible Contractor
                      example: 123
                    spec_section_id:
                      type: integer
                      description: The ID of the Inspection's Specification Section
                      example: 5
                    status:
                      type: string
                      description: The Inspection's status
                      enum:
                      - open
                      - in_review
                      - closed
                      example: open
                    trade_id:
                      type: integer
                      description: The ID of the Trade involved in the Inspection
                      example: 123
                    distribution_member_ids:
                      type: array
                      description: The IDs of the Distribution Members for the Inspection
                      items:
                        type: integer
                      example:
                      - 2
                      - 3
                    location_id:
                      type: integer
                      description: The ID of the Location of the Inspection
                      example: 1
                    custom_field_%{custom_field_definition_id}:
                      description: 'Value of the custom field. The data type of the value passed in corresponds with the data_type of the Custom Field Definition.

                        For a lov_entry data_type the value passed in should be the ID of one of the Custom Field Definition''s LOV Entries. For a lov_entries data_type the value passed in should be an array of IDs of the Custom Field Definition''s LOV Entries.'
                      example: custom field value
                      oneOf:
                      - type: string
                        title: string
                      - type: number
                        title: number
                      - type: boolean
                        title: boolean
                      - type: array
                        title: array
                        items:
                          type: integer
                    upload_ids:
                      type: array
                      description: Uploads to attach to the response
                      items:
                        type: string
                      example:
                      - 4120226e-36a8-416f-970e-880bae78164f
                      - de07e35a-4860-4f96-acd8-8360833dc495
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                title: Checklist
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the inspection.
                    example: 42
                  name:
                    type: string
                    description: Name of the inspection.
                    example: Window Inspection
                  list_template_id:
                    type: integer
                    description: Checklist Template ID from which this Checklist was created
                    example: 1
                  list_template_name:
                    type: string
                    description: Current name of the Checklist Template from which this Checklist was created
                    example: Window Inspection v2
                  number:
                    type: integer
                    description: Number of the inspection.
                    example: 1
                  identifier:
                    type: string
                    description: Human-readable identifier assigned to the inspection.
                    example: INS-42
                  status:
                    type: string
                    description: Current status of the inspection.
                    enum:
                    - Open
                    - In Review
                    - Closed
                    example: Closed
                  location:
                    type:
                    - object
                    - 'null'
                    title: Location
                    properties:
                      id:
                        type: integer
                        description: Location ID
                        example: 15504
                      name:
                        type: string
                        description: Location name
                        example: 1space>1 space
                      code:
                        type: string
                        description: Location code
                        example: code
                      node_name:
                        type: string
                        description: Location node name
                        example: 1 space
                      parent_id:
                        type: integer
                        description: Location parent id
                        example: 788866
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp of Location creation
                        example: '2016-08-01T23:33:54Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp of last update to Location
                        example: '2016-08-01T23:33:54Z'
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp of creation
                    example: '2017-10-31T23:36:30Z'
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp of last update
                    example: '2018-12-11T04:58:42Z'
                  closed_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Timestamp of when inspection was closed
                    example: '2018-12-11T04:58:42Z'
                  drawing_ids:
                    type: array
                    description: Array of Drawing IDs
                    items:
                      type: integer
                  current_drawing_revision_ids:
                    type: array
                    description: Array of Current Drawing Revision IDs
                    items:
                      type: integer
                  default_response_phrasing:
                    type: object
                    description: Conforming/Deficient responses used for items having the default response type
                    properties:
                      conforming_response:
                        type: string
                        description: Conforming response of the default response set
                        example: Safe
                      deficient_response:
                        type: string
                        description: Deficient/Non-conforming response of the default response set
                        example: At Risk
                      global:
                        type: boolean
                        description: Boolean flag indicating if the default response phrasing is Procore-provided
                        example: true
                  description:
                    type: string
                    description: Description of the inspection.
                    example: Checklist for circular windows
                  deleted:
                    type: boolean
                    description: Indicates whether this Checklist has been deleted
                    example: false
                  due_at:
                    type: string
                    format: date-time
                    description: Timestamp indicating when the Inspection is due
                    example: '2019-08-18T23:36:30Z'
                  inspection_date:
                    type: string
                    format: date
                    description: Date that the inspection was performed
                  inspection_type:
                    type: object
                    title: Inspection Type
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 142
                      name:
                        type: string
                        description: Name
                        example: Safety Compliance
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp of creation
                        example: '2014-12-10T23:36:30Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp of last update
                        example: '2014-12-11T04:58:42Z'
                  private:
                    type: boolean
                    description: Indicates whether this Checklist is private
                    example: false
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: exampleuser@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                      company_name:
                        type:
                        - string
                        - 'null'
                        description: Company Name
                        example: Company ABC
                  closed_by:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: exampleuser@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                      company_name:
                        type:
                        - string
                        - 'null'
                        description: Company Name
                        example: Company ABC
                  responsible_contractor:
                    type:
                    - object
                    - 'null'
                    description: Vendor responsible for the work being inspected
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 1
                      name:
                        type: string
                        description: Name
                        example: Freddie's Excavating
                  point_of_contact:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: exampleuser@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                      company_name:
                        type:
                        - string
                        - 'null'
                        description: Company Name
                        example: Company ABC
                  trade:
                    type:
                    - object
                    - 'null'
                    title: Trade
                    properties:
                      id:
                        type: integer
                        description: Trade ID
                        example: 999
                      name:
                        type: string
                        description: Trade name
                        example: 09 - acoustical panels
                      active:
                        type: boolean
                        description: Trade availability
                        example: true
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp of last update to Trade
                        example: '2016-08-01T23:33:54Z'
                  inspectors:
                    type: array
                    description: Inspectors
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: exampleuser@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                        company_name:
                          type:
                          - string
                          - 'null'
                          description: Company Name
                          example: Company ABC
                  distribution_members:
                    type: array
                    description: Distribution Members
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: exampleuser@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                        company_name:
                          type:
                          - string
                          - 'null'
                          description: Company Name
                          example: Company ABC
                  signature_requests:
                    type: array
                    description: Checklist Signature Requests
                    items:
                      title: Checklist Signature Request
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 21
                        signatory:
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: integer
                                description: The unique identifier of the user.
                                example: 160586
                              login:
                                type: string
                                description: The email address of the user that is used to log in.
                                example: exampleuser@example.com
                              name:
                                type: string
                                description: The name of the user.
                                example: Carl the Contractor
                          - type: object
                            properties:
                              company_name:
                                type: string
                                description: User's Company Name
                                example: Company ABC
                        signature:
                          title: Checklist Signature
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 5324
                            captured_by:
                              allOf:
                              - type: object
                                properties:
                                  id:
                                    type: integer
                                    description: The unique identifier of the user.
                                    example: 160586
                                  login:
                                    type: string
                                    description: The email address of the user that is used to log in.
                                    example: exampleuser@example.com
                                  name:
                                    type: string
                                    description: The name of the user.
                                    example: Carl the Contractor
                              - type: object
                                properties:
                                  company_name:
                                    type: string
                                    description: User's Company Name
                                    example: Company ABC
                            captured_at:
                              type: string
                              format: date-time
                              description: Timestamp of creation
                              example: '2012-10-23T21:39:40Z'
                            attachment:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID
                                  example: 5324
                                url:
                                  type: string
                                  description: URL
                                  example: http://www.example.com/
                                filename:
                                  type: string
                                  description: Filename
                                  example: january_receipt_copy.jpg
                                name:
                                  type: string
                                  description: Attachment name
                                  example: january_receipt_copy.jpg
                  managed_equipment_id:
                    type:
                    - integer
                    - 'null'
                    description: Managed Equipment ID
                    example: 1
                  equipment_id:
                    type:
                    - string
                    - 'null'
                    description: ID of the Equipment associated with this inspection.
                    example: EQ-100
                  equipment:
                    type:
                    - object
                    - 'null'
                    title: Equipment
                    description: Equipment associated with this inspection.
                    properties:
                      id:
                        type: string
                        description: Equipment ID
                        example: EQ-100
                      name:
                        type: string
                        description: Equipment name
                        example: Excavator 12
                  asset_ids:
                    type: array
                    description: IDs of Assets linked to this Inspection via Related Items
                    items:
                      type: string
                    example:
                    - 01HQRT4MNBV2XJKZ8DPWE3YC5A
                  specification_section:
                    type:
                    - object
                    - 'null'
                    description: Specification Section
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 1
                      description:
                        type: string
                        description: Description
                        example: Vinyl Windows
                      section:
                        type: string
                        description: Number
                        example: 08560
                      latest_revision_url:
                        type:
                        - string
                        - 'null'
                        description: Url to PDF view
                        example: link_to_pdf
                  attachments:
                    type: array
                    description: Attachments
                    items:
                      type: object
                      title: Checklist (Inspection) Attachment
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 5324
                        url:
                          type: string
                          description: URL
                          example: http://www.example.com/
                        thumbnail_url:
                          type:
                          - string
                          - 'null'
                          description: URL
                          example: http://www.example.com/
                        name:
                          type: string
                          description: Filename
                          example: january_receipt_copy.jpg
                        filename:
                          type: string
                          description: Filename (deprecated)
                          example: january_receipt_copy.jpg
                        content_type:
                          type: string
                          example: application/pdf
                        viewable_document_id:
                          type: integer
                          description: Viewable Document ID
                          example: 492
                  conforming_item_count:
                    type: integer
                    description: Number of Checklist Items with a status of `yes`
                    example: 1
                  deficient_item_count:
                    type: integer
                    description: Number of Checklist Items with a status of `no`
                    example: 1
                  not_applicable_item_count:
                    type: integer
                    description: Number of Checklist Items with a status of `n/a`
                    example: 0
                  neutral_item_count:
                    type: integer
                    description: Number of Checklist Items with a status of `neutral`
                    example: 1
                  amber_item_count:
                    type: integer
                    description: Number of Checklist Items with a status of `amber`
                    example: 1
                  inspected_item_count:
                    type: integer
                    description: Number of Checklist Items that have been inspected
                    example: 4
                  observations_count:
                    type: integer
                    description: Number of Observations from this Checklist
                    example: 2
                  closed_observations_count:
                    type: integer
                    description: Number of closed Observations pertaining to the Checklist
                    example: 1
                  item_count:
                    type: integer
                    description: Number of Checklist Items within the Checklist
                    example: 1
                  respondable_item_count:
                    type: integer
                    description: Number of Checklist Items that can receive a response.
                    example: 1
                  custom_fields:
                    type: object
                    properties:
                      custom_field_%{custom_field_string_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: The data type of the Custom Field Definition.
                            example: string
                          value:
                            type: string
                            description: The value of the custom field.
                            example: custom field value
                      custom_field_%{custom_field_decimal_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: The data type of the Custom Field Definition.
                            example: decimal
                          value:
                            type: number
                            description: The value of the custom field.
                            example: 2.2
                      custom_field_%{custom_field_boolean_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: The data type of the Custom Field Definition.
                            example: boolean
                          value:
                            type: boolean
                            description: The value of the custom field.
                            example: true
                      custom_field_%{custom_field_lov_entry_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: The data type of the Custom Field Definition.
                            example: lov_entry
                          value:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: The unique identifier of the list of values (LOV) entry.
                                example: 1
                              label:
                                type: string
                                description: Label of the list of values (LOV) entry.
                                example: Open
                      custom_field_%{custom_field_lov_entries_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: The data type of the Custom Field Definition.
                            example: lov_entries
                          value:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: The unique identifier of the list of values (LOV) entry.
                                  example: 2
                                label:
                                  type: string
                                  description: The label of the list of values (LOV) entry.
                                  example: Open
                  template_id:
                    type: integer
                    description: Template ID
                    example: 176
                  overdue:
                    type: boolean
                    description: Indicates whether the inspection is past its due date.
                    example: true
                  reinspected_from_id:
                    type:
                    - integer
                    - 'null'
                    description: ID of the source inspection this reinspection was created from.
                    example: 41
                  reinspected_by_id:
                    type:
                    - integer
                    - 'null'
                    description: ID of the inspection that reinspects this inspection.
                    example: 43
                  schedule:
                    type:
                    - object
                    - 'null'
                    title: Schedule
                    description: Schedule that generated this inspection.
                    properties:
                      id:
                        type: integer
                        description: Schedule ID
                        example: 7
                      name:
                        type: string
                        description: Schedule name
                        example: Weekly Safety Walk
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/checklist/lists',\n  qs: {run_configurable_validations: 'SOME_BOOLEAN_VALUE'},\n  headers: {\n    Authorization: 'Bearer REPLACE_BEARER_TOKEN',\n    'content-type': 'application/json'\n  },\n  body: {\n    list_template_id: 12,\n    list: {\n      description: 'Ensure proper window installation',\n      due_at: '2019-08-18T23:36:30Z',\n      inspection_date: '2019-10-31',\n      inspection_type_id: 34,\n      number: 42,\n      managed_equipment_id: 123,\n      point_of_contact_id: 12,\n      inspector_ids: [12, 13],\n      private: true,\n      responsible_contractor_id: 123,\n      spec_section_id: 5,\n      status: 'open',\n      trade_id: 123,\n      distribution_member_ids: [2, 3],\n      location_id: 1,\n      'custom_field_%{custom_field_definition_id}': 'custom field value',\n      upload_ids: ['4120226e-36a8-416f-970e-880bae78164f', 'de07e35a-4860-4f96-acd8-8360833dc495']\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
