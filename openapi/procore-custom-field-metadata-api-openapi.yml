openapi: 3.2.0
info:
  title: Procore REST Custom Field Metadata API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Custom Field Metadata
paths:
  /rest/v1.0/custom_field_metadata:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: query
      description: Unique identifier for the company. You must supply either a company_id or project_id.
      required: false
      schema:
        type: integer
    x-compliance-level: full
    get:
      deprecated: true
      x-deprecated-at: '2026-07-27'
      x-sunset: '2027-07-28'
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Custom Field Metadata
      description: Return a list of all Custom Field Metadata associated with the Current Company.
      tags:
      - Custom Field Metadata
      parameters:
      - name: project_id
        in: query
        description: Unique identifier for the project. You must supply either a company_id or project_id.
        required: false
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        required: false
        description: 'The extended view provides what is shown below.

          The default view returns the same as the extended view but excludes the attributes company_id, host_type, source_type, source_id, label, data_type.

          The with_lov_entries returns the default attributes but adding lov_entries.'
        schema:
          type: string
          enum:
          - default
          - with_lov_entries
          - extended
      - name: filters[field_set_type][]
        in: query
        description: Return a list of all Custom Field Metadata associated with the Current Company and source_type provided.
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filters[field_set_id][]
        in: query
        description: Return a list of all Custom Field Metadata associated with the Current Company and source_id provided.
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[custom_field_definitions_id]
        in: query
        description: Return a list of all Custom Field Metadata associated with the Current Company and custom_field_definition_id provided.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Custom Field Metadata
                items:
                  type: object
                  title: Custom Field Metadatum
                  properties:
                    id:
                      type: number
                      description: Custom Field Metadatum ID
                      example: 999
                    custom_field_definition_id:
                      type: number
                      description: Custom Field Definition ID
                      example: 999
                    position:
                      type: number
                      description: Position is sorted ascending, lowest position is visually the top left of the page on a grid basis (used in conjunction with column_width property to calculate row and column properties).
                      example: 999
                    required:
                      type: boolean
                      description: Whether or not the Custom Field Metadatum is required
                      example: true
                    visible:
                      type: boolean
                      description: Whether or not the Custom Field Metadatum is visible
                      example: true
                    company_id:
                      type: number
                      description: Company ID
                      example: 999
                    host_type:
                      type: string
                      description: Procore Entity
                      example: ProcoreEntityName
                    source_type:
                      type: string
                      description: Configurable FieldSet Class
                      example: ConfigurableFieldSet::Base
                    source_id:
                      type: string
                      description: Configurable FieldSet ID
                      example: 999
                    label:
                      type: string
                      description: Custom Field Metadatum Label
                      example: Impact
                    data_type:
                      type: string
                      description: Type of Custom field
                      example: string
                    variant:
                      type: string
                      description: The variant type of the Custom Field
                      example: string
                    default_value:
                      type: string
                      description: The default value of the Custom Field
                      example: string
                    row:
                      type: number
                      description: Row the Field is position on the Form
                      example: 1
                    column:
                      type: number
                      description: Column the Field is position on the Form
                      example: 1
                    column_width:
                      type: number
                      description: How many columns the field spans on the Form
                      example: 3
                    custom_fields_section_id:
                      type:
                      - number
                      - 'null'
                      description: The display section of the Custom Field, if null it is the general section, visually in the top level section typically called "General Information".
                      example: 789
                    lov_entries:
                      type: array
                      items:
                        type: object
                        title: Custom Field Lov Entry
                        properties:
                          id:
                            type: integer
                            description: Custom Field Lov Entry ID
                            example: 999
                          label:
                            type: string
                            description: Label
                            example: High
                          position:
                            type: number
                            description: Position is sorted descending, highest position is visually the top of the list.
                            example: 1
                          active:
                            type: boolean
                            description: Whether or not the Custom Field Lov Entry is active
                            example: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
