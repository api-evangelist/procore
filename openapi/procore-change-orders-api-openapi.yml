      - summary: Add funding_rule_id field to Financial Markups list API
        description: Adds optional `funding_rule_id` to Financial Markups list responses. Null when no funding rule is assigned.
        endpoint: GET /financials/markups
        type: new
        breaking: false
        datestamp: '2026-08-26'
