        link: financial-markups?version=1.0#retrieve-a-list-of-markups
      operationId: retrieveAListOfMarkups
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Add a new Markup
      description: Add a new Markup to the holder. This endpoint supports the Contract and Potential Change Order tools. Access requires the user to have admin permissions for the relevant tool. Markups associated with contracts can be updated at any time. Markups on potential change orders can only be updated when the SOV (Schedule of Values) lines are in an editable state.
      tags:
      - Change Orders
      parameters:
      - name: project_id
        in: query
        description: ID of the Markup's Project
        required: true
        schema:
          type: integer
      - name: holder_type
        in: query
        description: Type of the Markup's Holder
        required: true
        schema:
          type: string
          enum:
          - Contract
          - PotentialChangeOrder
      - name: holder_id
        in: query
        description: ID of the Markup's Holder
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
