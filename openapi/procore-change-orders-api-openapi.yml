      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: General availability of retrieves a list of the Financial Markups API
        description: Retrieves a list of markups associated with the specified holder.  This endpoint supports the Contract and Potential Change Order tools.  Access requires the user to have admin permissions for the relevant tool. For more information see [this page](https://developers.procore.com/reference/rest/financial-markups?version=1.0#retrieve-a-list-of-markups).
        endpoint: GET /financials/markups
        type: new
        breaking: false
        datestamp: '2025-02-05'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: financial-markups?version=1.0#retrieve-a-list-of-markups
      - summary: Add tax_code_id field to Financial Markups list API
        description: Adds `tax_code_id` as a scalar tax-code field in Financial Markups list responses. Clients may use it while `tax_code_ids` remains supported during the migration.
        endpoint: GET /financials/markups
        type: new
        breaking: false
        datestamp: '2026-07-21'
        versions:
        - '1.0'
        x-doc:
          visibility: public
