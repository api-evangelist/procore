      - summary: General availability of add a Financial Markups API
        description: Add a new Markup to the holder. This endpoint supports the Contract and Potential Change Order tools.  Access requires the user to have admin permissions for the relevant tool. Markups associated with contracts can be updated at any time. Markups on potential change orders can only be updated when the SOV (Schedule of Values) lines  are in an editable state. For more information see [this page](https://developers.procore.com/reference/rest/financial-markups?version=1.0#add-a-new-markup).
        endpoint: POST /financials/markups
        type: new
        breaking: false
        datestamp: '2025-02-05'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: financial-markups?version=1.0#add-a-new-markup
      - summary: Add tax_code_id field to Financial Markups create API
        description: 'Adds `tax_code_id` as a scalar tax-code field in Financial Markups create requests and responses. Clients may use it while `tax_code_ids` remains supported during the migration. When both are sent, `tax_code_ids` is authoritative and `tax_code_id` mirrors the first id. Clear tax with `tax_code_id: null` or `tax_code_ids: []`. Omitting both keys is a no-op.'
        endpoint: POST /financials/markups
        type: new
        breaking: false
        datestamp: '2026-07-21'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: financial-markups?version=1.0#add-a-new-markup
      - summary: Add funding_rule_id field to Financial Markups create API
        description: Adds optional `funding_rule_id` to Financial Markups create requests and responses. Assign an active project-level funding rule, or omit/null when unassigned. Accepted on Prime Contract and Potential Change Order markups.
        endpoint: POST /financials/markups
        type: new
        breaking: false
        datestamp: '2026-08-26'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: financial-markups?version=1.0#add-a-new-markup
      - summary: Deprecate tax_code_ids on Financial Markups create API
        description: 'Deprecates legacy `tax_code_ids` in favor of `tax_code_id`. Migration path: replace `tax_code_ids` usage with `tax_code_id`. Planned sunset date for `tax_code_ids`: 2027-07-21.'
        endpoint: POST /financials/markups
        type: deprecated
        breaking: false
        datestamp: '2026-07-21'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: financial-markups?version=1.0#add-a-new-markup
      - summary: Reject multiple tax_code_ids on Financial Markups create
        description: After cutover to scalar `tax_code_id`, a `tax_code_ids` array with more than one distinct id is rejected with a warning. The request fails and no markup is created. Prefer a single `tax_code_id`. Duplicate ids in the array are still treated as one code.
        endpoint: POST /financials/markups
        type: refinement
        breaking: true
        datestamp: '2026-09-20'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: financial-markups?version=1.0#add-a-new-markup
