    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Modify an existing Markup
      description: Modify an existing Markup with new data for specified holder. This endpoint supports the Contract and Potential Change Order tools. Access requires the user to have admin permissions for the relevant tool. Markups associated with contracts can be updated at any time. Markups on potential change orders can only be updated when the SOV (Schedule of Values) lines are in an editable state
      tags:
      - Change Orders
      parameters:
      - name: project_id
        in: query
        description: ID of the Markup's Project
        required: true
        schema:
          type: integer
      - name: holder_type
        in: query
        description: Type of the Markup's Holder
        required: true
        schema:
          type: string
          enum:
          - Contract
          - PotentialChangeOrder
      - name: holder_id
        in: query
        description: ID of the Markup's Holder
        required: true
        schema:
          type: integer
      - name: id
        in: path
        description: ID of the Markup
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - markup
              properties:
                markup:
                  type: object
                  properties:
                    applies_to_all:
                      type: boolean
                      default: false
                      description: Indicates if the markup applies to all change management items within the holder.
                      example: true
                    compound:
                      type: object
                      description: Details of the compound calculations for the markup.
                      properties:
                        selections:
                          type:
                          - array
                          - 'null'
                          description: Specifies which existing markups to include in the calculation when 'selective' compounding is chosen.
                          items:
                            type: integer
                          example:
                          - 1
                          - 2
                          - 3
                        type:
                          type:
                          - string
                          - 'null'
                          description: 'Type of calculation for the markup:

                            - **Basic Calculation (null):** Percentage is multiplied by the line items that meet the application criteria.

                            - **Compounds all Above (above):** Percentage is multiplied by the line items that meet the application criteria and all preceding markups in the markup table.

                            - **Selective Compounding (selective):** Percentage is multiplied by the line items that meet the application criteria and any individually selected markups.

                            - **Iterative Calculation or Margin (margin):** Percentage is multiplied by the line item total, including all markups.'
                          example: above
                    compounds_markups_above:
                      type: boolean
                      description: When true, the markup percentage is calculated on the holder's subtotal plus all markups positioned above it (by `position`); when false, it is calculated on the subtotal alone. This is the legacy boolean form of the `compound.type` "above" calculation.
                      example: false
                    line_item_type_ids:
                      type: array
                      description: Identifiers of the line item types the markup applies to. Empty when the markup is not restricted to specific line item types.
                      items:
                        type: integer
                      example:
                      - 41
                      - 42
                    markup_conditions:
                      type:
                      - array
                      - 'null'
                      description: Conditions that determine how the markup will be applied to change management items within the holder.
                      items:
                        type: object
                        properties:
                          _destroy:
                            type: boolean
                            description: Indicates whether the markup condition should be deleted.
                            example: true
                          id:
                            type: integer
                            description: Unique identifier for the markup condition.  Provide this value to update an existing condition;  if not provided, a new condition will be created.
                            example: 231
                          match_type:
                            type: string
                            description: Specifies whether the condition includes or excludes items.
                            enum:
                            - excludes
                            - includes
                            example: includes
                          wbs_segment_id:
                            type: integer
                            description: Unique identifier for the WBS Segment associated with the markup condition.  Supported segments include Cost Type and Cost Code.
                            example: 10
                          markup_condition_items:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                _destroy:
                                  type: boolean
                                  description: Indicates whether the markup condition should be deleted.
                                  example: true
                                id:
                                  type: integer
                                  description: Unique identifier for the markup condition item. Provide this value to update an existing condition; if not provided, a new condition will be created.
                                  example: 764
                                wbs_segment_item_id:
                                  type: integer
                                  description: Unique identifier for the WBS Segment Item associated with the markup condition.  If the match type is 'includes' and the WBS Segment is Cost Type,  the markup will be applied to all change management items with the selected Cost Type.
                                  example: 265
                    markup_set:
                      type: string
                      description: "Set of the markup.\n- **Horizontal markup:** Calculates the markup amount on an individual line item.\n- **Vertical markup:** Calculates the markup amount as a subtotal on all line items on a change order. \n\nContracts use 'change_orders_horizontal' and 'change_orders_vertical'.  \nPotential Change Orders use 'vertical' and 'horizontal'."
                      enum:
                      - change_orders_horizontal
                      - change_orders_vertical
                      - horizontal
                      - vertical
                      example: vertical
                    name:
                      type: string
                      description: Name of the markup.
                      example: Profit
                    percentage:
                      type: string
                      format: decimal
                      description: Percentage value of the markup. The default precision is 50.
                      example: '5.25'
                    position:
                      type: integer
                      description: Position of the markup in the markup set of the holder.  The default is the next available position, starting at 1.
                      example: 1
                    prime_line_item_id:
                      type:
                      - integer
                      - 'null'
                      description: Unique identifier for the Prime Contract Line Item associated with the markup.  This ensures synchronization between the estimated value (without vertical markup) and  the revenue value (with vertical markup) in the integrated ERP system.  Applicable only to vertical markups on a prime contract or prime contract change order  when the ERP Integrations tool (Ryvit or Sage 300 CRE) is enabled. You need to pass query parameter `view=with_erp_data` to retrieve this value.
                      example: 123
                    tax_code_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Canonical tax code identifier associated with the markup. This may point to a tax-group code (`is_group: true`) or an individual code. Send `null` to clear the assignment. This is a behavior change vs the previous no-op. Omit the field to leave the existing assignment unchanged.'
                      example: 101
                    funding_rule_id:
                      type:
                      - integer
                      - 'null'
                      description: Unique identifier of the funding rule assigned to this markup. Null when no funding rule is assigned. Pass an active project-level funding rule for this project on create or update; pass null to clear. Accepted on Prime Contract and Potential Change Order markups.
                      example: 42
                    tax_code_ids:
                      type:
                      - array
                      - 'null'
                      deprecated: true
                      description: Legacy compatibility field. Use `tax_code_id` as the canonical field. This is derived as `[tax_code_id].compact`. On write, more than one distinct id is rejected (HTTP 422); it is not truncated to the first id.
                      items:
                        type: integer
                      example:
                      - 101
                    wbs_code_id:
                      type:
                      - integer
                      - 'null'
                      description: ID of the Wbs Code the Markup percentage will be applied to on a project's budget. Default is ID of the `None` Wbs Code.
                      example: 999
