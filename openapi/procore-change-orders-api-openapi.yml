openapi: 3.2.0
info:
  title: Procore REST Change Orders API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Change Orders
paths:
  /rest/v1.0/change_order/statuses:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Change Order Statuses
      description: Return a list of all Change Order Statuses.
      tags:
      - Change Orders
      parameters:
      - name: company_id
        in: query
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this company-defined change order status.
                      example: 324737
                    name:
                      type: string
                      description: Display name of the custom change order status (e.g. No Charge).
                      example: No Charge
                    mapped_to_status:
                      type: string
                      description: The built-in system status this custom status maps to for workflow and reporting purposes (e.g. approved, pending, draft).
                      example: approved
                    show_in_select:
                      type: boolean
                      description: When true, this status is selectable in change order status dropdowns in the UI.
                      example: true
        '403':
          description: User does not have permission to access Change Order Statuses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/change_order/statuses',\n  qs: {\n    company_id: 'SOME_INTEGER_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/change_order/statuses?company_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/change_order/statuses?company_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/change_order/statuses?company_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: listChangeOrderStatuses
  /rest/v1.0/financials/markups:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Retrieve a list of Markups
      description: Retrieves a list of markups associated with the specified holder. This endpoint supports the Contract and Potential Change Order tools. Access requires the user to have admin permissions for the relevant tool.
      tags:
      - Change Orders
      parameters:
      - name: project_id
        in: query
        description: ID of the Markup's Project
        required: true
        schema:
          type: integer
      - name: holder_type
        in: query
        description: Type of the Markup's Holder
        required: true
        schema:
          type: string
          enum:
          - Contract
          - PotentialChangeOrder
      - name: holder_id
        in: query
        description: ID of the Markup's Holder
        required: true
        schema:
          type: integer
      - name: view
        in: query
        description: When set to `with_erp_data`, includes the `prime_line_item_id` field in the response.
        required: false
        schema:
          type: string
          enum:
          - with_erp_data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of Markups
                items:
                  title: Financial Markup
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the markup.
                      example: 121
                    applies_to_all:
                      type: boolean
                      default: false
                      description: Indicates if the markup applies to all change management items within the holder.
                      example: true
                    compound:
                      type: object
                      description: Details of the compound calculations for the markup.
                      properties:
                        selections:
                          type:
                          - array
                          - 'null'
                          description: Specifies which existing markups to include in the calculation when 'selective' compounding is chosen.
                          items:
                            type: integer
                          example:
                          - 1
                          - 2
                          - 3
                        type:
                          type:
                          - string
                          - 'null'
                          description: 'Type of calculation for the markup:

                            - **Basic Calculation (null):** Percentage is multiplied by the line items that meet the application criteria.

                            - **Compounds all Above (above):** Percentage is multiplied by the line items that meet the application criteria and all preceding markups in the markup table.

                            - **Selective Compounding (selective):** Percentage is multiplied by the line items that meet the application criteria and any individually selected markups.

                            - **Iterative Calculation or Margin (margin):** Percentage is multiplied by the line item total, including all markups.'
                          example: above
                    compounds_markups_above:
                      type: boolean
                      description: When true, the markup percentage is calculated on the holder's subtotal plus all markups positioned above it (by `position`); when false, it is calculated on the subtotal alone. This is the legacy boolean form of the `compound.type` "above" calculation.
                      example: false
                    holder_id:
                      type: integer
                      description: Unique identifier for the markup holder.
                      example: 29
                    holder_type:
                      type: string
                      description: Type of the markup holder.
                      enum:
                      - Contract
                      - PotentialChangeOrder
                      example: Contract
                    line_item_type_ids:
                      type: array
                      description: Identifiers of the line item types the markup applies to. Empty when the markup is not restricted to specific line item types.
                      items:
                        type: integer
                      example:
                      - 41
                      - 42
                    markup_conditions:
                      type:
                      - array
                      - 'null'
                      description: Conditions that determine how the markup will be applied to change management items within the holder.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for the markup condition.
                            example: 231
                          match_type:
                            type: string
                            description: Specifies whether the condition includes or excludes items.
                            enum:
                            - excludes
                            - includes
                            example: includes
                          wbs_segment_id:
                            type: integer
                            description: Unique identifier for the WBS Segment associated with the markup condition.  Supported segments include Cost Type and Cost Code.
                            example: 10
                          markup_condition_items:
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Unique identifier for the markup condition item.
                                  example: 764
                                wbs_segment_item_id:
                                  type: integer
                                  description: Unique identifier for the WBS Segment Item associated with the markup condition.  If the match type is 'includes' and the WBS Segment is Cost Type,  the markup will be applied to all change management items with the selected Cost Type.
                                  example: 265
                    markup_set:
                      type: string
                      description: "Set of the markup.\n- **Horizontal markup:** Calculates the markup amount on an individual line item.\n- **Vertical markup:** Calculates the markup amount as a subtotal on all line items on a change order. \n\nContracts use 'change_orders_horizontal' and 'change_orders_vertical'.  \nPotential Change Orders use 'vertical' and 'horizontal'."
                      enum:
                      - change_orders_horizontal
                      - change_orders_vertical
                      - horizontal
                      - vertical
                      example: vertical
                    name:
                      type: string
                      description: Name of the markup.
                      example: Profit
                    percentage:
                      type: string
                      format: decimal
                      description: Percentage value of the markup. The default precision is 50.
                      example: '5.25'
                    position:
                      type: integer
                      description: Position of the markup in the markup set of the holder.  The default is the next available position, starting at 1.
                      example: 1
                    prime_line_item_id:
                      type:
                      - integer
                      - 'null'
                      description: Unique identifier for the Prime Contract Line Item associated with the markup.  This ensures synchronization between the estimated value (without vertical markup) and  the revenue value (with vertical markup) in the integrated ERP system.  Applicable only to vertical markups on a prime contract or prime contract change order  when the ERP Integrations tool (Ryvit or Sage 300 CRE) is enabled. You need to pass query parameter `view=with_erp_data` to retrieve this value.
                      example: 123
                    project_id:
                      type: integer
                      description: Unique identifier for the project associated with the markup.
                      example: 15
                    tax_code_id:
                      type:
                      - integer
                      - 'null'
                      description: 'Canonical tax code identifier associated with the markup. This may point to a tax-group code (`is_group: true`) or an individual code. Send `null` to clear the assignment. This is a behavior change vs the previous no-op. Omit the field to leave the existing assignment unchanged.'
                      example: 101
                    funding_rule_id:
                      type:
                      - integer
                      - 'null'
                      description: Unique identifier of the funding rule assigned to this markup. Null when no funding rule is assigned. Pass an active project-level funding rule for this project on create or update; pass null to clear. Accepted on Prime Contract and Potential Change Order markups.
                      example: 42
                    tax_code_ids:
                      type:
                      - array
                      - 'null'
                      deprecated: true
                      description: Legacy compatibility field. Use `tax_code_id` as the canonical field. This is derived as `[tax_code_id].compact`. On write, more than one distinct id is rejected (HTTP 422); it is not truncated to the first id.
                      items:
                        type: integer
                      example:
                      - 101
                    wbs_code:
                      type: object
                      description: WBS Code to which the markup percentage will be applied on a project's budget.
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the WBS Code.
                          example: 999
                        flat_code:
                          type: string
                          description: Code of the WBS Code.
                          example: 01-011.O
                        description:
                          type:
                          - string
                          - 'null'
                          description: Description of the WBS Code.
                          example: Purpose.Other
                        segment_items:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 77
                              code:
                                type: string
                                example: 01-001
                              name:
                                type: string
                                example: Purpose
                              path_codes:
                                type: array
                                items:
                                  type: string
                                example:
                                - 01 - General Requirements
                                - 01-001 - Purpose
                              path_ids:
                                type: array
                                items:
                                  type: integer
                                example:
                                - 55
                                - 77
                              segment_type:
                                type: string
                                example: cost_code
                              segment_id:
                                type: integer
                                example: 88
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
