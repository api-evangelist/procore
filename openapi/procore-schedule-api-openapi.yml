        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - calendar_item
              properties:
                calendar_item:
                  type: object
                  properties:
                    assigned_id:
                      type: integer
                      description: ID of the assigned user for the Calendar Item
                    color:
                      type: string
                      description: Calendar Item color (as a hex triplet)
                      example: '#A4505D'
                    description:
                      type: string
                      description: Calendar Item description
                      example: Use some power tools to fix the drywall.
                    finish:
                      type: string
                      format: date
                      description: The finish date of the Calendar Item
                      example: '2020-02-02'
                    name:
                      type: string
                      description: Calendar Item name
                      example: Fix Drywall
                    percentage:
                      type: integer
                      description: Calendar Item completion percentage
                      example: 50
                    private:
                      type: boolean
                      description: Calendar Item private status
                      example: false
                    start:
                      type: string
                      format: date
                      description: The start date of the Calendar Item
                      example: '2020-01-01'
      responses:
