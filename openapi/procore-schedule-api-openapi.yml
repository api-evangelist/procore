                  description:
                    type: string
                    description: Calendar Item description
                    example: Use some power tools to fix the drywall.
                  finish:
                    type: string
                    format: date
                    description: Calendar Item finish date
                    example: '2020-02-02'
                  full_outline_path:
                    type: string
                    description: ToDo full outline path (corresponds to matching field on Tasks)
                    example: Fix drywall
                  milestone:
                    type: boolean
                    description: Calendar Item milestone status
                    example: true
                  name:
                    type: string
                    description: Calendar Item name
                    example: Fix Drywall
                  percentage:
                    type: integer
