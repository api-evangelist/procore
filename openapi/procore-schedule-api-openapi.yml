                description: Schedule Calendar Item
                properties:
                  id:
                    type: integer
                    description: Calendar Item ID
                  assigned:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                  color:
                    type: string
                    description: Calendar Item color (as a hex triplet)
                    example: '#A4505D'
