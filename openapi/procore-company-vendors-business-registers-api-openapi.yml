servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Company Vendors Business Registers
paths:
  /rest/v1.0/vendors/{id}/business_register:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Company Vendor Business Register
      description: Create a new Business Register associated with a specified Vendor.
      tags:
      - Company Vendors Business Registers
      parameters:
      - name: id
        in: path
        description: ID of the Company Vendor
        required: true
        schema:
          type: integer
      - name: company_id
        in: query
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Business Register Body
              type: object
              properties:
                business_register:
                  type: object
                  required:
                  - type
                  - identifier
                  properties:
                    type:
                      type: string
                      description: Entity Type
                      enum:
                      - abn
                      - ein
                      example: abn
                    identifier:
                      type: string
                      description: Entity ID. This field ignores spaces and dashes.
                      example: '51824753556'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                description: business register
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: integer
                    example: 321
                  type:
                    type: string
                    description: business register type (ABN, EIN)
                    example: abn
                  identifier:
                    type: string
                    description: Identification code
                    example: '51824753556'
                  verified_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Verified at
                    example: '2018-06-11T15:56:25Z'
                  verification_status:
                    type:
                    - string
                    - 'null'
                    description: Verification status (active, cancelled, does_not_exist)
                    example: active
                    enum:
                    - active
                    - cancelled
                    - does_not_exist
                    - null
                example:
                  id: 321
                  type: abn
                  identifier: '51824753556'
                  verified_at: '2018-06-11T15:56:25Z'
                  verification_status: active
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '409':
          description: A Business Register is already associated with the Vendor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/vendors/%7Bid%7D/business_register',\n  qs: {company_id: 'SOME_INTEGER_VALUE'},\n  headers: {\n    Authorization: 'Bearer REPLACE_BEARER_TOKEN',\n    'content-type': 'application/json'\n  },\n  body: {business_register: {type: 'abn', identifier: '51824753556'}},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
