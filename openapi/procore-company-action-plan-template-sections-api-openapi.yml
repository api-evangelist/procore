      summary: Create Company Action Plan Template Section
      description: Creates a Company Action Plan Template Section for a given Company Action Plan Template.
      tags:
      - Company Action Plan Template Sections
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - plan_template_section
              properties:
                plan_template_section:
                  type: object
                  required:
                  - plan_template_id
                  - title
                  properties:
                    plan_template_id:
                      type: integer
                      description: ID of the Company Action Plan Template to be created under
                      example: 42
                    title:
                      type: string
                      description: Title
                      example: A new Company Action Plan Template Section
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Company Action Plan Template Section (Show)
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the template section.
                    example: 43584
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when the section was created. ISO 8601 format.
                    example: '2018-09-20T21:39:40Z'
                  plan_template_id:
                    type: integer
                    description: Unique identifier of the parent Action Plan Template.
                    example: 57
                  position:
                    type: integer
                    description: Ordinal position of this section within the template. Use to determine display order.
                    example: 3
                  title:
                    type: string
                    description: Title of the template section.
                    example: A New ITP Company Plan Template Section
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when the section was last modified. ISO 8601 format.
