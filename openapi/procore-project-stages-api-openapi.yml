      summary: List Project Stages
      description: Return a list of project stages for a company.
      tags:
      - Project Stages
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: project_id
        in: query
        required: false
        description: Project ID used to establish project context for authorization.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of project stages.
                items:
                  title: ProjectStage
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this project stage.
                      example: 1
                    name:
                      type: string
                      description: Display name of the project stage.
                      example: Project Stage A
                    is_bidding_stage:
                      type: boolean
                      description: Whether this stage is a bidding stage.
                      example: false
                    is_concept_stage:
                      type: boolean
                      description: Whether this stage is a concept stage.
                      example: false
                    category:
                      type:
                      - string
                      - 'null'
                      description: Parent Procore category for this company stage.
                      enum:
                      - pre_construction
                      - course_of_construction
                      - post_construction
                      - completed
                      - not_awarded
                      - canceled
                      example: course_of_construction
                    readonly:
                      type: boolean
                      description: Whether this is a built-in Procore category stage.
                      example: false
                    default_stage:
                      type: boolean
                      description: Whether this is a global default stage that cannot be edited or deleted.
                      example: false
                    hideable:
                      type: boolean
                      description: Whether this stage can be hidden from a company.
                      example: true
                    has_rfi_prefixes:
                      type: boolean
                      description: Whether any RFI headers in the company use this stage.
                      example: true
                    project_stage_has_children:
                      type: boolean
                      description: Whether this stage has child stages under the company.
                      example: true
