      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Recycled Action Plan Template Sections
      description: Returns all Recycled Action Plan Template Sections for a given company
      tags:
      - Action Plan Template Sections
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[plan_template_id]
        in: query
        description: Return section(s) associated with the specified Action Plan Template ID(s).
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Recycled Action Plan Template Sections (Index)
                items:
                  type: object
                  description: Recycled Action Plan Template Section (Show)
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the deleted template section.
                      example: 43584
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the section was created. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when the section was moved to the recycle bin. ISO 8601 format.
                      example: '2017-01-16T18:42:12Z'
                    plan_template_id:
                      type: integer
                      description: Unique identifier of the parent Action Plan Template.
                      example: 57
                    position:
                      type: integer
                      description: Ordinal position of this section within the template. Use to determine display order.
                      example: 3
                    title:
                      type: string
                      description: Title of the template section.
                      example: A New Action Plan Template Section
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when the section was last modified. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
