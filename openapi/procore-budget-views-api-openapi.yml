openapi: 3.2.0
info:
  title: Procore REST Budget Views API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Budget Views
paths:
  /rest/v1.0/budget_views/{budget_view_id}/budget_detail_columns:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Budget Detail Columns
      description: 'Return a list of columns relevant to a Budget View for a Budget Detail Report.


        Note: The ID field of each Budget Column will appear as keys in rows returned by the List Budget Details API.'
      tags:
      - Budget Views
      parameters:
      - name: budget_view_id
        in: path
        description: Budget View ID
        required: true
        schema:
          type: integer
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of Budget Detail Columns
                items:
                  type: object
                  description: Budget Detail Columns
                  properties:
                    aggregatable:
                      type: boolean
                      description: Whether this column's values can be summed when budget detail rows are grouped. true for numeric columns that are meaningful to total; false for descriptive or identifier columns.
                      example: true
                    filterable:
                      type: boolean
                      description: Whether budget detail rows can be filtered by this column. When true, pass this column's id as column_id to the List Budget Detail Filter Options API to retrieve the valid filter values.
                      example: true
                    groupable:
                      type: boolean
                      description: Whether budget detail rows can be grouped (subtotaled) by this column's values.
                      example: true
                    id:
                      type: string
                      description: Identifier of the column, returned as a string. Appears as a key on each row of the List Budget Details response. Standard columns use slugs (e.g. 'biller', 'cost_code', 'detail_type'); template columns use the numeric column id rendered as a string.
                      example: biller
                    name:
                      type: string
                      description: Localized, human-readable display name of the column as shown in the Budget Detail Report.
                      example: Detail Type
                    position:
                      type: integer
                      description: Ordering index controlling the left-to-right placement of columns in the Budget Detail Report. Standard columns use negative positions so they sort ahead of configurable template columns, which use their own non-negative positions.
                      example: 1
                    type:
                      type: string
                      description: Classification of the column, indicating what kind of data it represents.
                      example: source
                      enum:
                      - standard
                      - source
                      - budget_forecast
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/budget_views/%7Bbudget_view_id%7D/budget_detail_columns',\n  qs: {project_id: 'SOME_INTEGER_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/budget_views/%7Bbudget_view_id%7D/budget_detail_columns?project_id=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/budget_views/%7Bbudget_view_id%7D/budget_detail_columns?project_id=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/budget_views/%7Bbudget_view_id%7D/budget_detail_columns?project_id=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: listBudgetDetailColumns
  /rest/v1.0/budget_detail_filters:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Budget Detail Filter Options
      description: 'Returns a list of valid filter options when given a specific filter type.


        Note: When using "biller" for column_id, the "value" key will contain objects, not integers.


        These objects will have a "type" field and a "value" field. Type indicates whether the biller

        is a Sub Job or a Project and will be a string. "value" contains the ID of the biller and will be an array of integers.'
      tags:
      - Budget Views
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: column_id
        in: query
        required: true
        description: Type of filter options to return
        schema:
          type: string
          enum:
          - biller
          - root_cost_code
          - cost_code
          - cost_type
          - vendor
          - detail_type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of Budget Detail Filter Options
                items:
                  type: object
                  description: Budget Detail Filter Options
                  properties:
                    label:
                      type: string
                      description: Localized display label for the filter option (for example a cost code's long name, a vendor name, or "None"). Options that share the same label are grouped into a single entry.
                      example: 01-000 - Purpose
                    value:
                      type: array
                      description: 'Record IDs represented by this option. Pass these values in the "filters" object of the List Budget Details request to filter rows by this option. A single option can contain multiple IDs when records share the same label. Note: when column_id is "biller", each item is an object with "type" and "value" keys instead of an integer (see the endpoint description).'
                      items:
                        type: integer
                        description: ID of a record to filter budget detail rows by
                        example: 42
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/budget_detail_filters',\n  qs: {project_id: 'SOME_INTEGER_VALUE', column_id: 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/budget_detail_filters?project_id=SOME_INTEGER_VALUE&column_id=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/budget_detail_filters?project_id=SOME_INTEGER_VALUE&column_id=SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/budget_detail_filters?project_id=SOME_INTEGER_VALUE&column_id=SOME_STRING_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
