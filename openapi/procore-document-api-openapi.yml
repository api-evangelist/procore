      - summary: Added sorting to the rest v2.0 project root Folder endpoint
        description: Added optional multi-column sorting for immediate folder children using comma-separated `sort` terms. Supported fields are `updated_at`, `name`, `document_type`, `created_at`, and `created_by`. Prefix a field with `-` for descending order. Invalid sort terms return a 400 response.
        endpoint: GET /companies/{company_id}/projects/{project_id}/folders
        type: feature
        breaking: false
        datestamp: '2026-08-13'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#list-project-root-folder-children-company-scoped
      - summary: Added filtering and project-wide descendant search to the rest v2.0 project root Folder endpoint
        description: 'Added `filters[...]` support. By default filters apply to the immediate accessible children of the project root folder, so the existing response shape and scope are unchanged. Supplying `include_descendants=true` alongside at least one filter widens the search to every accessible folder and file in the project Documents tool, regardless of depth; supplied on its own it has no effect. Supported filters: `search`, `created_by_id`, `created_at`, `updated_at`, `document_type`, `file_type`, `is_in_recycle_bin`, `private` (explicitly-marked items only), `folder_id` (subtree), `custom_tag_ids`, and `custom_fields`. Sorting, `exclude_folders`/`exclude_files`, and pagination apply in both modes. When searching descendants, recycle bin content is excluded unless `filters[is_in_recycle_bin]` is provided. Results are permission-filtered so an item is returned only when it and all of its ancestors are accessible; the `Total` header is exact and pagination is uncapped for all users. Unknown filter keys, invalid filter values, malformed `filters`, and a non-boolean `include_descendants` return a 400 response.'
        endpoint: GET /companies/{company_id}/projects/{project_id}/folders
        type: feature
        breaking: false
        datestamp: '2026-08-24'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#list-project-root-folder-children-company-scoped
      - summary: Added has_private_ancestor to the rest v2.0 project Folder index endpoint
        description: Each item in the response now carries a boolean `has_private_ancestor`, indicating whether it inherits privacy from above it — that is, whether its parent or any further ancestor is explicitly private. This is independent of the existing `private` field, which remains true only when the item is itself explicitly private, so an item may be private with a public ancestry, inherit privacy without being private itself, or both. Returned for the `normal` and `web_normal` projections; `sync_compact` is unchanged.
        endpoint: GET /companies/{company_id}/projects/{project_id}/folders
        type: feature
        breaking: false
        datestamp: '2026-09-01'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#list-project-root-folder-children-company-scoped
      - summary: Added the web_extended view to the rest v2.0 project Folder index endpoint
        description: '`view=web_extended` returns every `web_normal` field plus a `file` object on file rows with `file_type`, `current_version` (`id`, `number`, `size`, `created_at`, `notes`), `checked_out_by` and `checked_out_until`. Folder rows return `file: null`. Version data is returned whether or not `show_latest_file_version_only` is set. Other views are unchanged.'
        endpoint: GET /companies/{company_id}/projects/{project_id}/folders
        type: feature
        breaking: false
        datestamp: '2026-09-25'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#list-project-root-folder-children-company-scoped
      - summary: Added the is_tracked filter to the rest v2.0 project Folder index endpoint
        description: '`filters[is_tracked]=true` returns only the folders and files the current user is tracking; `false` returns the items they are not tracking. Items tracked by other users are never matched. Combines with every other filter, `sort`, pagination, `exclude_files`/`exclude_folders` and `view`, and with `include_descendants=true` spans the whole project. Results stay permission-filtered and exclude the recycle bin unless `filters[is_in_recycle_bin]` is provided. Non-boolean values return 400.'
        endpoint: GET /companies/{company_id}/projects/{project_id}/folders
