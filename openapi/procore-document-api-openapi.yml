      - summary: Added the is_tracked filter to the rest v2.0 company Folder index endpoint
        description: '`filters[is_tracked]=true` returns only the folders and files the current user is tracking; `false` returns the items they are not tracking. Items tracked by other users are never matched. Combines with every other filter, `sort`, pagination, `exclude_files`/`exclude_folders` and `view`, and with `include_descendants=true` spans the whole company Documents tool. Results stay permission-filtered and exclude the recycle bin unless `filters[is_in_recycle_bin]` is provided. Non-boolean values return 400.'
