  /rest/v2.0/companies/{company_id}/projects/{project_id}/folders:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List project root folder children (Company-scoped)
      description: 'Returns the immediate accessible children of the project root folder as a single mixed collection of folders and files, scoped under a company (descendants beyond one level are not included). Any `filters[...]` parameters apply to those immediate children.

        With `include_descendants=true` and at least one `filters[...]` parameter, the endpoint instead searches the entire project Documents tool and returns every accessible folder and file matching all provided filters, regardless of depth in the folder tree. `sort`, `exclude_folders`, `exclude_files`, and pagination apply in both modes. When searching descendants, recycle bin content is excluded unless `filters[is_in_recycle_bin]` is provided, and `filters[private]` matches only items explicitly marked private (items inheriting privacy from a parent folder are not matched).

        Results are permission-filtered for every user: an item is returned only when it and all of its ancestors are accessible. Schedules content requires the "Can See Schedule" permission and recycle bin content requires the "See Recycle Bin" permission; without them, those folders and everything beneath them are omitted. The `Total` header is exact and pagination is uncapped in both modes.'
      tags:
      - Document
      parameters:
      - name: view
        in: query
        required: false
        description: 'Response projection. Supports legacy `web_normal` requests for compatibility with v1 folder-index flows. `normal` and `web_normal` include `has_private_ancestor`; `sync_compact` omits it. `web_extended` returns everything `web_normal` returns plus a `file` object on file rows with `file_type`, `current_version` (`id`, `number`, `size`, `created_at`, `notes`), `checked_out_by` and `checked_out_until`; folder rows return `file: null`.'
        schema:
          type: string
          enum:
          - normal
          - web_normal
          - web_extended
          - sync_compact
      - name: show_latest_file_version_only
        in: query
        required: false
        description: Return only the latest file version per file.
        schema:
          type: boolean
      - name: exclude_folders
        in: query
        required: false
        description: Exclude child folders from the response.
        schema:
          type: boolean
      - name: exclude_files
        in: query
        required: false
        description: Exclude child files from the response.
        schema:
          type: boolean
      - name: include_descendants
        in: query
        required: false
        description: 'Search the addressed folder''s entire subtree instead of only its immediate children. On a root-children endpoint the addressed folder is the root, so this spans the whole Documents tool; on a nested folder endpoint it spans only that folder''s subtree.

          Only takes effect alongside at least one `filters[...]` parameter; supplied on its own, the response remains the immediate children. Filters supplied without this parameter continue to apply to the immediate children only, so the default behavior of the endpoint is unchanged.'
        schema:
          type: boolean
      - name: sort
        in: query
        description: Sort immediate folder children by one or more comma-separated terms in left-to-right priority order. Supported fields are `updated_at`, `name`, `document_type`, `created_at`, and `created_by`. Prefix a term with `-` for descending order; no prefix means ascending. For example, `document_type,-created_at,name`. Leading or interior blank terms and malformed direction prefixes return 400. Native parsing ignores trailing commas; for duplicate fields, the first occurrence keeps its priority and the last occurrence sets direction. When omitted or blank, folders are returned first in natural-name order.
        required: false
        schema:
          type: string
          pattern: ^(\s*|-?(updated_at|name|document_type|created_at|created_by)(,-?(updated_at|name|document_type|created_at|created_by))*[,]*)$
          example: document_type,-created_at,name
      - name: filters[created_by_id]
        in: query
        description: Return item(s) created by the specified User IDs
        required: false
        schema:
          type: array
          items:
            type: string
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[document_type]
        in: query
        description: Return item(s) that are file or folder
        required: false
        schema:
          type: string
          enum:
          - file
          - folder
      - name: filters[file_type]
        in: query
        description: Return item(s) that have the file extensions, as a comma-separated list (e.g. `filters[file_type]=pdf,txt`).
        style: form
        required: false
        explode: false
        schema:
          type: array
          items:
            type: string
          example:
          - pdf
          - txt
      - name: filters[is_in_recycle_bin]
        in: query
        description: Return item(s) that are in or not in the recycle bin
        required: false
        schema:
          type: boolean
      - name: filters[search]
        in: query
        description: Returns item(s) matching the specified search query string.
        required: false
        schema:
          type: string
      - name: filters[folder_id]
        in: query
        description: Returns the folder for a given id with all subfolders and subfiles up to a depth of 100.  Depths greater than 100 will need multiple queries to get all children.
        required: false
        schema:
          type: string
          description: Interger id for a folder
          example: '26'
      - name: filters[custom_tag_ids]
        in: query
        description: Return item(s) with specified custom tag IDs
        style: form
        required: false
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[custom_fields]
        in: query
        required: false
        description: Return item(s) whose custom field values match the supplied JSON object, given as a string mapping custom field definition ids to the values to match (e.g. `{"12345":"Bid Set"}`). Keys must be integer definition ids; any other key is rejected with a 400. Multiple entries are combined with AND.
        schema:
          type: string
      - name: filters[private]
        in: query
        description: If true, returns only item(s) with a `private` status.
        required: false
        schema:
          type: boolean
      - name: filters[is_tracked]
        in: query
        description: If true, returns only folders and files the current user is tracking ("Items you are tracking"). If false, returns only items the current user is not tracking. Items tracked by other users are never matched. Combine with `include_descendants=true` on the root-children endpoint to span the whole Documents tool.
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
