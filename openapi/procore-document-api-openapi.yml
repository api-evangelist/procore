openapi: 3.2.0
info:
  title: Procore REST Document API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Document
paths:
  /rest/v1.0/companies/{company_id}/documents:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      deprecated: true
      x-deprecated-at: '2025-08-19'
      x-sunset: '2026-08-20'
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Company Folder and File index
      description: Return a list of all folders and files in the company
      tags:
      - Document
      parameters:
      - name: view
        in: query
        description: Determines how much information to include in the response. `normal` is the default, `extended` provides additional data. The example below shows the `extended` response.
        schema:
          type: string
          enum:
          - compact
          - normal
          - common_extended
          - extended
          - mobile_extended
          - context_search
          - ids_only
      - name: sort
        in: query
        description: 'Field to sort by. If the field is passed with a - (EX: -updated_at) it is sorted in reverse order'
        schema:
          type: string
          enum:
          - updated_at
          - name
          - document_type
          - document_type_then_name
          - document_type_then_created_at
          - document_type_then_updated_at
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[created_by_id]
        in: query
        description: Return item(s) created by the specified User IDs
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[document_type]
        in: query
        description: Return item(s) that are file or folder
        schema:
          type: string
          enum:
          - file
          - folder
      - name: filters[file_type]
        in: query
        description: Return item(s) that have the file extensions
        schema:
          type: array
          items:
            type: string
          example:
          - pdf
          - txt
      - name: filters[is_in_recycle_bin]
        in: query
        description: Return item(s) that are in or not in the recycle bin
        schema:
          type: boolean
      - name: filters[search]
        in: query
        description: Return item(s) that contain string in document name and file description
        schema:
          type: string
      - name: filters[folder_id]
        in: query
        description: Returns the folder for a given id with all subfolders and subfiles up to a depth of 100.  Depths greater than 100 will need multiple queries to get all children.
        schema:
          type: integer
          description: Interger id for a folder
          example: 26
      - name: filters[private]
        in: query
        description: If true, returns only item(s) with a `private` status.
        schema:
          type: boolean
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Documents
                items:
                  type: object
                  title: example of a Folder that is a file
                  properties:
                    id:
                      type: integer
                      description: Folder id
                      example: 2
                    name:
                      type: string
                      description: Folder name
                      example: file.png
                    name_with_path:
                      type: string
                      description: Full file path with folder name
                      example: Root Folder/Subfolder/file.png
                    parent_id:
                      type: integer
                      description: Folder parent id
                      example: 1
                    created_at:
                      type: string
                      format: date-time
                      description: Folder created at
                      example: '2017-01-04T21:27:18Z'
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    updated_at:
                      type: string
                      format: date-time
                      description: Folder updated at
                      example: '2017-01-04T21:27:18Z'
                    read_only:
                      type: boolean
                      description: File is read_only (only updatable via Schedule)
                      example: false
                    is_deleted:
                      type: boolean
                      description: Folder is in the recycle bin status
                      example: false
                    is_recycle_bin:
                      type: boolean
                      description: Folder is recycle bin status
                      example: false
                    document_type:
                      type: string
                      description: Folder or File
                      enum:
                      - file
                      - folder
                      example: file
                    is_tracked:
                      type: boolean
                      description: Status whether Folder is explicitly tracked
                      example: false
                    private:
                      type: boolean
                      description: Status whether Folder is explicitly private
                      example: false
                    private_parent:
                      type: object
                      title: Folder
                      properties:
                        id:
                          type: integer
                          description: Folder id
                          example: 2
                        name:
                          type: string
                          description: Folder name
                          example: Subfolder
                        name_with_path:
                          type: string
                          description: Full file path with folder name
                          example: Root Folder/Subfolder
                    tracked_folder:
                      type: object
                      title: Folder
                      properties:
                        id:
                          type: integer
                          description: Folder id
                          example: 2
                        name:
                          type: string
                          description: Folder name
                          example: Subfolder
                        name_with_path:
                          type: string
                          description: Full file path with folder name
                          example: Root Folder/Subfolder
                    file:
                      type: object
                      description: will be filled if document_type is a file
                      properties:
                        checked_out_by:
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: integer
                                description: ID
                                example: 160586
                              login:
                                type: string
                                description: Email
                                example: carl.contractor@example.com
                              name:
                                type: string
                                description: Name
                                example: Carl Contractor
                          - type: object
                            properties:
                              locale:
                                type: string
                                description: Name
                                example: en-CA
                          type: object
                          properties:
                            company_name:
                              type: string
                              description: Name
                              example: Some Company Name
                        checked_out_until:
                          type: string
                          description: File checked out time
                          example: '2017-01-04T21:27:18Z'
                        current_version:
                          allOf:
                          - type: object
                            properties:
                              id:
                                type: integer
                                description: File version id
                                example: 12
                              notes:
                                type: string
                                description: File version notes
                                example: this is a cool file version
                              url:
                                type: string
                                description: File version url
                                example: https://storage.procore.com/files/attachment.png
                              size:
                                type: integer
                                description: File version size in bytes
                                example: 12674
                              created_at:
                                type: string
                                format: date-time
                                description: File version created at
                                example: '2017-01-04T21:27:18Z'
                              number:
                                type: integer
                                description: File version number
                                example: 1
                              has_public_markup:
                                type: boolean
                                description: If true, this file version has public markup.
                                example: false
                          - type: object
                            properties:
                              created_by:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID
                                    example: 160586
                                  login:
                                    type: string
                                    description: Email
                                    example: carl.contractor@example.com
                                  name:
                                    type: string
                                    description: Name
                                    example: Carl Contractor
                              prostore_file:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                                    description: Use :name, :filename to be deprecated
                                  url:
                                    type: string
                                    example: https://storage.procore.com/files/attachment.png
                                  filename:
                                    type: string
                                    description: :filename to be deprecated, use :name
                          - type: object
                            properties:
                              file_id:
                                type: integer
                                description: Parent Files id
                                example: 14
                        description:
                          type: string
                          description: Description entered for the File
                          example: some description
                        file_type:
                          type: string
                          description: File type
                          example: PDF
                    children:
                      type: object
                      description: if folder is implicitly tracked, reflects the folder that is the cause
                      properties:
                        has_children:
                          type: boolean
                          description: whether the Folder has children
                          example: false
                        has_children_files:
                          type: boolean
                          description: whether the Folder has children that are file
                          example: false
                        has_children_folders:
                          type: boolean
                          description: whether the Folder has children that are not file
                          example: false
                    custom_fields:
                      type: object
                      properties:
                        custom_field_%{custom_field_string_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: string
                            value:
                              type: string
                              description: The value of the custom field
                              example: custom field value
                            variant:
                              type: string
                              description: The variant of the Custom Field Definition (e.g. `phone_number`). Present only when the definition has an associated variant.
                              example: phone_number
                        custom_field_%{custom_field_decimal_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: decimal
                            value:
                              type: number
                              description: The value of the custom field
                              example: 2.2
                        custom_field_%{custom_field_boolean_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: boolean
                            value:
                              type: boolean
                              description: The value of the custom field
                              example: true
                        custom_field_%{custom_field_lov_entry_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: lov_entry
                            value:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID of the LOV Entry
                                  example: 1
                                label:
                                  type: string
                                  description: Label of the LOV Entry
                                  example: Open
                            variant:
                              type: string
                              description: The variant of the Custom Field Definition (e.g. `project_directory`). Present only when the definition has an associated variant.
                              example: with_code
                        custom_field_%{custom_field_lov_entries_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: lov_entries
                            value:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID of the LOV Entry
                                    example: 2
                                  label:
                                    type: string
                                    description: Label of the LOV Entry
                                    example: Open
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/documents',\n  qs: {\n    view: 'SOME_STRING_VALUE',\n    sort: 'SOME_STRING_VALUE',\n    'filters[id]': 'SOME_ARRAY_VALUE',\n    'filters[created_by_id]': 'SOME_ARRAY_VALUE',\n    'filters[created_at]': 'SOME_STRING_VALUE',\n    'filters[updated_at]': 'SOME_STRING_VALUE',\n    'filters[document_type]': 'SOME_STRING_VALUE',\n    'filters[file_type]': ['pdf', 'txt'],\n    'filters[is_in_recycle_bin]': 'SOME_BOOLEAN_VALUE',\n    'filters[search]': 'SOME_STRING_VALUE',\n    'filters[folder_id]': '26',\n    'filters[private]': 'SOME_BOOLEAN_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/companies/%7Bcompany_id%7D/documents?view=SOME_STRING_VALUE&sort=SOME_STRING_VALUE&filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bdocument_type%5D=SOME_STRING_VALUE&filters%5Bfile_type%5D=pdf&filters%5Bfile_type%5D=txt&filters%5Bis_in_recycle_bin%5D=SOME_BOOLEAN_VALUE&filters%5Bsearch%5D=SOME_STRING_VALUE&filters%5Bfolder_id%5D=26&filters%5Bprivate%5D=SOME_BOOLEAN_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/documents?view=SOME_STRING_VALUE&sort=SOME_STRING_VALUE&filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bdocument_type%5D=SOME_STRING_VALUE&filters%5Bfile_type%5D=pdf&filters%5Bfile_type%5D=txt&filters%5Bis_in_recycle_bin%5D=SOME_BOOLEAN_VALUE&filters%5Bsearch%5D=SOME_STRING_VALUE&filters%5Bfolder_id%5D=26&filters%5Bprivate%5D=SOME_BOOLEAN_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/documents?view=SOME_STRING_VALUE&sort=SOME_STRING_VALUE&filters%5Bid%5D=SOME_ARRAY_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bdocument_type%5D=SOME_STRING_VALUE&filters%5Bfile_type%5D=pdf&filters%5Bfile_type%5D=txt&filters%5Bis_in_recycle_bin%5D=SOME_BOOLEAN_VALUE&filters%5Bsearch%5D=SOME_STRING_VALUE&filters%5Bfolder_id%5D=26&filters%5Bprivate%5D=SOME_BOOLEAN_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
