        description: 'Added `filters[...]` support. By default filters apply to the immediate accessible children of the company root folder, so the existing response shape and scope are unchanged. Supplying `include_descendants=true` alongside at least one filter widens the search to every accessible folder and file in the company Documents tool, regardless of depth; supplied on its own it has no effect. Supported filters: `search`, `created_by_id`, `created_at`, `updated_at`, `document_type`, `file_type`, `is_in_recycle_bin`, `private` (explicitly-marked items only), and `folder_id` (subtree). Sorting, `exclude_folders`/`exclude_files`, and pagination apply in both modes. When searching descendants, recycle bin content is excluded unless `filters[is_in_recycle_bin]` is provided. Results are permission-filtered so an item is returned only when it and all of its ancestors are accessible; the `Total` header is exact and pagination is uncapped for all users. Unknown filter keys, invalid filter values, malformed `filters`, and a non-boolean `include_descendants` return a 400 response.'
        endpoint: GET /companies/{company_id}/folders
        type: feature
        breaking: false
        datestamp: '2026-08-24'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: documents?version=2.0#list-company-root-folder-children
      - summary: Added has_private_ancestor to the rest v2.0 company Folder index endpoint
        description: Each item in the response now carries a boolean `has_private_ancestor`, indicating whether it inherits privacy from above it — that is, whether its parent or any further ancestor is explicitly private. This is independent of the existing `private` field, which remains true only when the item is itself explicitly private, so an item may be private with a public ancestry, inherit privacy without being private itself, or both. Returned for the `normal` and `web_normal` projections; `sync_compact` is unchanged.
        endpoint: GET /companies/{company_id}/folders
        type: feature
        breaking: false
        datestamp: '2026-09-01'
        versions:
