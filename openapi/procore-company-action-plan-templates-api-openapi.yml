          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Company Action Plan Templates (Index)
                items:
                  type: object
                  description: Company Action Plan Template (Show)
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the Action Plan Template.
                      example: 43584
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the template was created. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
                    description:
                      type: string
                      description: Description of the template in rich text (HTML) form.
                      example: <p>Important Safety Company Action Plan Template.</p>
                    description_plain_text:
                      type: string
                      description: Description of the template in plain text form.
                      example: Important Safety Company Action Plan Template.
                    status:
                      type: string
                      description: Lifecycle state of the template. Templates must be 'published' before plans can be created from them.
                      enum:
                      - draft
                      - in_revision
                      - published
                      example: draft
                    title:
                      type: string
                      description: Title of the Action Plan Template.
                      example: A New Company Action Plan Template
                    plan_type:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the Action Plan type.
                          example: 21
                        active:
                          type: boolean
                          description: Whether this type is enabled for use. When false, it is hidden from selection when creating new plans or templates.
                          example: true
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the type was created. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        name:
                          type: string
                          description: Localized display name of the Action Plan type.
                          example: Safety
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when the type was last modified. ISO 8601 format.
                          example: '2018-09-20T21:39:40Z'
                        source_key:
                          type:
                          - string
                          - 'null'
                          description: System key identifying a built-in type. Null for user-created custom types.
                          example: safety
                    global_plan_template_name:
                      type:
                      - string
                      - 'null'
                      description: Name of the Procore-provided global template this template was created from. Null when the template was not created from a Procore global template.
                      example: project_development
                    template_type:
                      type: string
                      description: Scope of the template. 'company' templates are company-wide; 'project' templates are project-specific.
                      enum:
                      - company
                      - project
                      example: company
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when the template was last modified. ISO 8601 format.
                      example: '2015-03-19T12:00:00Z'
