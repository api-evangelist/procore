  /rest/v2.0/companies/{company_id}/estimating/bid_board_projects/{bid_board_project_id}/proposals/{proposal_id}/summary:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      tags:
      - Proposal
      summary: Retrieve the Estimate Summary for a proposal
      description: 'margin is always stored as margin, not markup.

        Convert markup to margin with margin = 100 * markup / (100 + markup) (25% markup = 20% margin).

        Each item in markups includes an id that can be used as markup_id on the markup endpoints.'
      operationId: Proposal_GetEstimateSummary2
      parameters:
      - name: proposal_id
        in: path
        required: true
        description: Proposal Id
        schema:
          type: string
          format: int64
        x-position: 1
      - name: company_id
        in: path
        required: true
        description: Unique company identifier associated with the Procore User Account.
        schema:
          type: string
        x-position: 2
      - name: bid_board_project_id
        in: path
        required: true
        description: Unique BidBoard project identifier
        schema:
          type: string
        x-position: 3
      responses:
        '200':
          description: The proposal's Estimate Summary settings and markups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type:
                    - object
                    - 'null'
                    description: The proposal settings shown on the Estimate Summary tab.
                    additionalProperties: false
                    properties:
                      waste:
                        description: Waste percentages by cost category.
                        type:
                        - object
                        - 'null'
                        additionalProperties: false
                        properties:
                          material:
                            type: number
                            description: Material value.
                            format: decimal
                          labor:
                            type: number
                            description: Labor value.
                            format: decimal
                          equipment:
                            type: number
                            description: Equipment value.
                            format: decimal
                          subcontractor:
                            type: number
                            description: Subcontractor value.
                            format: decimal
                          travel:
                            type: number
                            description: Travel value.
                            format: decimal
                      margin:
                        description: 'Profit percentages by cost category, always stored as margin (not markup).

                          To convert a markup percentage to margin: margin = 100 * markup / (100 + markup).

                          Example: 25% markup is stored as 20% margin.'
                        type:
                        - object
                        - 'null'
                        additionalProperties: false
                        properties:
                          material:
                            type: number
                            description: Material value.
                            format: decimal
                          labor:
                            type: number
                            description: Labor value.
                            format: decimal
                          equipment:
                            type: number
                            description: Equipment value.
                            format: decimal
                          subcontractor:
                            type: number
                            description: Subcontractor value.
                            format: decimal
                          travel:
                            type: number
                            description: Travel value.
                            format: decimal
                      labor_cost:
                        type: number
                        description: The labor rate or cost.
                        format: decimal
                      labor_factor:
                        type: number
                        description: The labor difficulty factor.
                        format: decimal
                      tax:
                        description: Tax percentages by cost category.
                        type:
                        - object
                        - 'null'
                        additionalProperties: false
                        properties:
                          material:
                            type: number
                            description: Material value.
                            format: decimal
                          labor:
                            type: number
                            description: Labor value.
                            format: decimal
                          equipment:
                            type: number
                            description: Equipment value.
                            format: decimal
                          subcontractor:
                            type: number
                            description: Subcontractor value.
                            format: decimal
                          travel:
                            type: number
                            description: Travel value.
                            format: decimal
                      markups:
                        type:
                        - array
                        - 'null'
                        description: Enabled pre-tax and post-tax markups. Use each markup's id as markup_id on the markup endpoints.
                        items:
                          type: object
                          description: Represents a markup (adjustment) applied to a proposal.
                          additionalProperties: false
                          properties:
                            id:
                              type:
                              - string
                              - 'null'
                              description: The unique identifier of the markup. Returned by GET Estimate Summary in markups; use as markup_id on markup endpoints.
                            name:
                              type:
                              - string
                              - 'null'
                              description: The display name of the markup.
                            value:
                              type: number
                              description: The numeric value of the markup (percentage or lump sum amount).
                              format: decimal
                            value_type:
                              description: The type of the markup value.
                              type: string
                              x-enumNames:
                              - LumpSum
                              - Percent
                              - Iterative
                              - LegacyOverhead
                              - LegacyDiscount
                              enum:
                              - LUMP_SUM
                              - PERCENT
                              - ITERATIVE
                              - LEGACY_OVERHEAD
                              - LEGACY_DISCOUNT
                            stage:
                              description: The calculation stage of the markup.
                              type: string
                              x-enumNames:
                              - PreTax
                              - PostTax
                              enum:
                              - PRE_TAX
                              - POST_TAX
                            compound_all:
                              type: boolean
                              description: Whether this markup compounds with all preceding markups in the same stage.
                            compound_with:
                              type:
                              - array
                              - 'null'
                              description: The IDs of specific markups this markup compounds with.
                              items:
                                type: string
                            tax_mapping:
                              description: The tax mapping category for this markup.
                              type:
                              - string
                              - 'null'
                              x-enumNames:
                              - Material
                              - Labor
                              - Equipment
                              - Subcontractor
                              - Travel
                              enum:
                              - MATERIAL
                              - LABOR
                              - EQUIPMENT
                              - SUBCONTRACTOR
                              - TRAVEL
                            application_criteria:
                              type:
                              - array
                              - 'null'
                              description: The flat list of conditions controlling which line items this markup applies to. Conditions are combined with logical AND.
                              items:
                                type: object
                                description: A single application-criteria condition. Multiple conditions on a markup are combined with logical AND.
                                additionalProperties: false
                                required:
                                - operator
                                - property
                                properties:
                                  operator:
                                    description: Whether this condition includes or excludes matching items.
                                    type: string
                                    x-enumNames:
                                    - Exclude
                                    - Include
                                    enum:
                                    - EXCLUDE
                                    - INCLUDE
                                  property:
                                    description: The property this condition targets.
                                    type: string
                                    x-enumNames:
                                    - CostCategory
                                    - CostCode
                                    - CostType
                                    - CatalogItemType
                                    - SubJob
                                    - Tag
                                    - GroupOrLayer
                                    enum:
                                    - COST_CATEGORY
                                    - COST_CODE
                                    - COST_TYPE
                                    - CATALOG_ITEM_TYPE
                                    - SUB_JOB
                                    - TAG
                                    - GROUP_OR_LAYER
                                  category:
                                    type:
                                    - array
                                    - 'null'
                                    description: Cost categories to match.
                                    items:
                                      type: string
                                      description: The cost category used in a markup application criteria filter.
                                      x-enumNames:
                                      - Material
                                      - Labor
                                      - Equipment
                                      - Subcontractor
                                      - Travel
                                      enum:
                                      - MATERIAL
                                      - LABOR
                                      - EQUIPMENT
                                      - SUBCONTRACTOR
                                      - TRAVEL
                                  cost_code:
                                    type:
