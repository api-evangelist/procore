      summary: List BIM View Folders
      description: Lists BIM View Folders associated with the specified Project.
      tags:
      - BIM View Folders
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[bim_file_id]
        in: query
        description: Filter item(s) with matching BIM File ids
        schema:
          type: integer
      - name: filters[parent_id]
        in: query
        description: Filter item(s) with matching parent_id
        schema:
          type: integer
      responses:
        '200':
          description: BIM View Folders listed successfully
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID
                      example: 109
                    name:
                      type: string
                      description: Name of view folder
                      example: Mechanical
                    parent_id:
                      type:
                      - integer
                      - 'null'
                      description: Id of parent BimViewFolder
                      example: 168
                    bim_file_id:
                      type: integer
                      description: Id of associated BimFile
                      example: 196
                    project_id:
                      type: integer
                      description: Project Id
                      example: 101
                    created_by_id:
                      type: integer
                      description: Id if creator
                      example: 137
                    created_at:
                      type: string
                      format: date-time
                      description: Created date
                      example: '2018-04-19T09:36:42Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Updated date
                      example: '2018-04-20T09:36:42Z'
        '403':
          description: User does not have permission to view BIM View Folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
