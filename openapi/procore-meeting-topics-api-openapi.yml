  /rest/v1.1/projects/{project_id}/meeting_topics/{meeting_topic_id}/parent_minutes:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get the minutes and date created for all parent topics
      description: Returns an array of objects of minutes and created_on values for all parent meeting topics
      tags:
      - Meeting Topics
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: meeting_id
        in: query
        description: ID of the meeting
        required: true
        schema:
          type: integer
      - name: meeting_topic_id
        in: path
        description: ID of the meeting topic
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Minutes recorded on each ancestor (parent) of the requested topic, ordered from nearest parent outward.
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Identifier of the ancestor meeting topic these minutes belong to.
                      example: 965039
                    meeting_id:
                      type: integer
                      description: Identifier of the Meeting the ancestor topic belongs to.
                      example: 82593
                    created_on:
                      type: string
                      format: date
                      description: Date the ancestor topic's minutes were recorded.
                      example: '2014-04-25'
                    minutes:
                      type: string
                      description: Rich-text (HTML) minutes recorded on the ancestor topic, or a placeholder message when none exist.
                      example: <p>Reviewed the previous action items.</p>
                    no_minutes:
                      type: boolean
                      description: True when the ancestor topic has no recorded minutes.
                      example: false
                    marked:
                      type: boolean
                      description: Whether the ancestor topic's minutes are starred (flagged for emphasis on the PDF).
                      example: false
                    meeting_position:
                      type: integer
                      description: Position of the ancestor topic's Meeting within its series.
                      example: 1
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: User does not have the right permissions to view the meeting
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
