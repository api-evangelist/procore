                  example: 12345
                crew_id:
                  type: integer
                  description: The ID of the crew for the Timecard Entry
                  example: 23456
                date:
                  type: string
                  format: date
                  description: The Date of the Timecard Entry
                  example: '2017-04-19'
                description:
                  type: string
                  description: The description of the Timecard Entry
                  example: This is extra info about the Timecard Entry
                hours:
                  type: integer
                  description: Hours worked on a Timecard Entry
                  example: 8
                location_id:
                  type: integer
                  description: The location ID for the Timecard Entry
                  example: 34567
                origin_id:
                  type: integer
                  description: ID of related external data
                  example: 45678
