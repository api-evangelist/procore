      summary: Show Communication
      description: Shows detailed information around a single email communication
      tags:
      - Communications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    initial_post:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the initial email thread of the communication.
                        subject:
                          type: string
                          description: Subject line of the initial email thread.
                        email_sent_at:
                          type: string
                          description: Timestamp when the initial email was sent.
                          format: date-time
                    communication_tags:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 161072
                          name:
                            type: string
                            example: my tag
                - type: object
                  properties:
                    created_at:
                      type: string
                      description: Timestamp when the communication was created.
                      format: date
                    private:
                      type: boolean
                      description: Whether the communication is private.
                    closed:
                      type: boolean
                      description: Whether the communication is closed.
                - type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the communication.
                    subject:
                      type: string
                      description: Subject line of the communication.
