      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "[{\"line_item_guid\":\"7db65567-bdab-4982-88b1-8e9116e18e4c\",\"quantity\":0.1,\"estimated_delivery_at\":\"2019-08-24T14:15:22Z\"}]"


          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/materials_mgmt/shipments/%7Bid%7D/line_items", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
