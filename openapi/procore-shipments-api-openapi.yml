  /rest/v2.0/companies/{company_id}/projects/{project_id}/materials_mgmt/shipments/{id}/line_items/bulk_create:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      tags:
      - Shipments
      summary: Adds bulk line items to a shipment from a purchase order
      description: 'Creates multiple shipment line items from existing purchase order line items in a single request.

        The shipment must not be in a posted (Final) status for line items to be added.'
      operationId: Shipments_AddBulkLineItemsFromPo
      parameters:
      - name: id
        in: path
        description: The shipment ID from the route
        required: true
        schema:
          type: string
          format: uuid
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: Array of line item creation requests
        content:
          application/json:
            schema:
              oneOf:
              - title: CreateShipmentLinesFromItemRequest
                allOf:
                - required:
                  - items
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        required:
                        - item_id
                        type: object
                        properties:
                          item_id:
                            type: string
                            format: uuid
                        additionalProperties: false
                      description: 'Creates shipment lines from a collection of material items.

                        Use this when adding lines to a shipment by specifying individual catalog items.'
                  additionalProperties: false
              - title: CreateShipmentLinesFromLinesRequest
                allOf:
                - required:
                  - line_items
                  type: object
                  properties:
                    line_items:
                      type: array
                      items:
                        required:
                        - line_item_guid
                        type: object
                        properties:
                          line_item_guid:
                            type: string
                            format: uuid
                        additionalProperties: false
                      description: 'Creates shipment lines from a collection of existing line item GUIDs.

                        Use this when copying lines from another document into a shipment.'
                  additionalProperties: false
              - title: CreateShipmentLinesFromPurchaseOrderRequest
                allOf:
                - required:
                  - order_id
                  type: object
                  properties:
                    order_id:
                      type: string
                      description: 'Creates shipment lines from a purchase order.

                        All line items on the specified purchase order are imported into the shipment.'
                      format: uuid
                  additionalProperties: false
              additionalProperties: false
