    get:
      tags:
      - Shipments
      summary: Get all line items for a specific shipment
      description: 'Returns line items for the specified shipment.

        Use view=Receiving to get the receiving view (with PO line linkage and remaining-to-receive amounts);

        the default view returns standard line items with connected document details.'
      operationId: Shipments_GetAllPaginatedLineItemsForShipment
      parameters:
      - name: id
        in: path
