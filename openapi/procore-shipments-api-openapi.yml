        description: 'Whether to include line items with VOID line status.

          Defaults to true.'
        schema:
          type: boolean
        required: false
      - name: filters[status]
        in: query
        description: Filter by shipment status(es)
        schema:
          type: array
          items:
            enum:
            - IN_TRANSIT
            - DELIVERED
            - TRANSFER_RECEIVED
            - VOID
            - STARTED
            type: string
          description: Comma-separated list of line item statuses to filter by
        required: false
      - name: filters[labels]
