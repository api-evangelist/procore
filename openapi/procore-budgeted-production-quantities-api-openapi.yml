openapi: 3.2.0
info:
  title: Procore REST Budgeted Production Quantities API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Budgeted Production Quantities
paths:
  /rest/v1.0/projects/{project_id}/budgeted_production_quantities:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List all Project Budgeted Production Quantities
      description: Return a list of all Budgeted Production Quantities with details for a specified Project.
      tags:
      - Budgeted Production Quantities
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Budgeted Production Quantities
                items:
                  type: object
                  description: Budgeted Production Quantity
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this budgeted production quantity. Use as the {id} path parameter to show, update, or delete the record via /rest/v1.0/projects/{project_id}/budgeted_production_quantities/{id}.
                      example: 75414
                    unit_of_measure:
                      type: string
                      description: Unit of measure for the budgeted quantity (for example, lf for linear feet, sf for square feet, or days). Drawn from the company's master Units of Measure list, including units categorized as Time.
                      example: lf
                    project_id:
                      type: integer
                      description: ID of the project this budgeted production quantity belongs to. Matches the {project_id} path parameter used to access the record.
                      example: 1
                    wbs_code_id:
                      type: integer
                      description: ID of the WBS (work breakdown structure) production quantity code this budgeted quantity is associated with.
                      example: 1234
                    cost_code:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            description: Cost Code ID
                            example: 12345
                          biller_id:
                            type: integer
                            description: Biller ID
                            example: 12345
                          biller_type:
                            type: string
                            enum:
                            - Project
                            - SubJob
                            description: Biller type
                            example: Project
                          code:
                            type: string
                            description: Cost code, not including parent prefix
                            example: '300'
                          created_at:
                            type: string
                            format: date-time
                            description: Created at
                            example: '2015-05-15T00:00:00Z'
                          deleted_at:
                            type: string
                            format: date-time
                            description: Deleted at
                            example: '2017-07-29T21:39:40Z'
                          full_code:
                            type: string
                            description: Full Cost code, including parent prefixes
                            example: 02-300
                          name:
                            type: string
                            description: Name
                            example: Earthwork
                          parent_id:
                            type: integer
                            description: Parent
                            example: 2345
                          position:
                            type: integer
                            description: Ordering position of the cost code among its siblings
                            example: 1
                          sortable_code:
                            type: string
                            description: Sortable code (this property is deprecated - see full_code)
                            example: 02-300
                          standard_cost_code_id:
                            type: integer
                            description: Standard Cost Code ID
                            example: 122334
                          updated_at:
                            type: string
                            format: date-time
                            description: Updated at
                            example: '2015-05-15T00:00:00Z'
                    quantity:
                      type: number
                      minimum: 0
                      description: Amount of cost code budgeted to be installed, rounded to two decimal places
                      example: 1000.5
                      exclusiveMaximum: 1000000000
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when this budgeted production quantity was last updated, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this budgeted production quantity was created, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    deleted_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: Timestamp when this budgeted production quantity was soft-deleted, in ISO 8601 format. Null when the record is active.
                      example: '2017-07-29T21:39:40Z'
                    wbs_code:
                      type: object
                      description: The WBS (work breakdown structure) code this budgeted production quantity is associated with.
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the WBS code. Matches wbs_code_id.
                          example: 1234
                        flat_code:
                          type: string
                          description: Concatenated code string for the WBS code, combining its segment codes (for example, the cost code and sub job codes).
                          example: 02-300
                        description:
                          type: string
                          description: Human-readable description of the WBS code.
                          example: Earthwork
                        flat_name:
                          type: string
                          description: Concatenated display name for the WBS code, combining the names of its segments.
                          example: Earthwork
                    created_by:
                      allOf:
                      - type: object
                        properties:
                          login:
                            type: string
                            description: Email
                            example: carl.contractor@example.com
                      - type: object
                        properties:
                          id:
                            type: integer
                            example: 161072
                          name:
                            type: string
                            example: Carl the Contractor
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/budgeted_production_quantities',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[updated_at]': 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/budgeted_production_quantities?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/budgeted_production_quantities?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/budgeted_production_quantities?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: listAllProjectBudgetedProductionQuantities
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
