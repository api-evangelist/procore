                          type: string
                          description: How the line item amount is derived. `calculated` means the amount is computed as quantity times unit cost; `manual` means the amount was entered directly.
                          enum:
                          - manual
                          - calculated
                          example: calculated
                        wbs_code_id:
                          type: string
                          description: ID
                          example: '100'
                        tax_code_id:
                          type: string
                          description: ID
                          example: '100'
                        position:
                          type: number
                          description: One-based ordering position of this line item within its schedule of values (the first item has position 1). Use it to preserve display order.
