                        description: ID of the prime contract line item associated with this line item
                        example: '12345'
                      funding_rule_id:
                        type: string
                        description: ID of the funding rule associated with this line item
                        example: '12345'
                      id:
                        type: string
                        description: ID
                        example: '100'
                      description:
                        type: string
                        description: Free-text description of the work or material this line item covers.
                        example: Drywall for the 2nd floor
                      uom:
                        type: string
                        description: Unit of measure for the line item quantity (e.g. hours, square meters). Present only on unit-quantity schedules of values.
                        example: m²
                      quantity:
                        type: number
                        description: Number of units for this line item, in the line item's unit of measure. Present only on unit-quantity schedules of values.
                        example: 100
                      unit_cost:
                        type: string
                        pattern: ^[-+]?[0-9]*\.?[0-9]+$
                        example: '-12345.6789'
                        description: 'An "unformatted" decimal number. Specifically a number with a period as the decimal separator, without a thousands separator, and with an optional sign. It should be assumed that this number includes arbitrary precision and scale, however, the API may not store or process the number with infinite precision and scale.

                          '
