                  example: 01JFHMDB8AD4750F18KN8R2TF2
                amount:
                  type: string
                  description: Amount - this field is nullable on unit quantity SOVs but NOT amount-based SOVs. For line item creates, if this field is omitted on unit quantity SOVs,  the amount will be calculated as quantity * unit_cost. For line item updates, if a null amount is passed in on unit quantity SOVs, it will set the line item extended type to "calculated".
                  example: '1000.0'
