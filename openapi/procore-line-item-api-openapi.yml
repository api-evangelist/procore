                        example: '-12345.6789'
                        description: 'An "unformatted" decimal number. Specifically a number with a period as the decimal separator, without a thousands separator, and with an optional sign. It should be assumed that this number includes arbitrary precision and scale, however, the API may not store or process the number with infinite precision and scale.

                          '
                      extended_type:
                        type: string
                        description: How the line item amount is derived. `calculated` means the amount is computed as quantity times unit cost; `manual` means the amount was entered directly.
                        enum:
                        - manual
                        - calculated
                        example: calculated
                      wbs_code_id:
                        type: string
                        description: ID
                        example: '100'
                      tax_code_id:
                        type: string
                        description: ID
                        example: '100'
                      position:
                        type: number
                        description: One-based ordering position of this line item within its schedule of values (the first item has position 1). Use it to preserve display order.
                        example: 1
