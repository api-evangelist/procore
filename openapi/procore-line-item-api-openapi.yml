          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Body
              properties:
                prime_line_item_id:
                  type: string
                  description: ID of the prime contract line item associated with this line item
                  example: '12345'
                amount:
                  type: string
                  description: Amount - this field is nullable on unit quantity SOVs but NOT amount-based SOVs. For line item creates, if this field is omitted on unit quantity SOVs,  the amount will be calculated as quantity * unit_cost. For line item updates, if a null amount is passed in on unit quantity SOVs, it will set the line item extended type to "calculated".
                  example: '1000.0'
                description:
                  type: string
                  description: Description
                  example: Cleanup
                quantity:
                  type: string
                  description: Quantity - only accepted on unit quantity SOVs
                  example: '20.0'
                unit_cost:
                  type: string
                  description: Unit cost - only accepted on unit quantity SOVs
                  example: '50.00'
                uom:
                  type: string
                  description: Unit of measure - only accepted on unit quantity SOVs. For line item updates, pass null or an empty string to clear the unit of measure.
                  example: Hours
                  enum:
                  - Any value present in the Company list of Units of Measure
                wbs_code_id:
                  type: string
                  description: WBS code ID
                  example: '34567'
                tax_code_id:
                  type: string
                  description: Tax code ID
                  example: '12345'
                funding_rule_id:
                  type: string
                  description: ID of the funding rule associated with this line item. Funding Sources must be enabled at the project level. The rule must be ACTIVE and its currency must match the contract currency. Pass null to disassociate an existing funding rule.
                  example: '12345'
