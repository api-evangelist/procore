                  example: '12345'
                rate_value_id:
                  type:
                  - string
                  - 'null'
                  description: ID of the project rate value selected for this line item. Accepted only for unit-quantity schedule of values. Pass null when updating to clear the selected rate.
                  example: 01JFHMDB8AD4750F18KN8R2TF1
                resource_id:
                  type:
                  - string
                  - 'null'
                  description: ID of the resource assigned to this line item. When provided with a rate value, the resource must match the resource associated with that rate. Accepted only for unit-quantity schedule of values. Pass null when updating to clear the assigned resource.
                  example: 01JFHMDB8AD4750F18KN8R2TF2
                amount:
                  type: string
                  description: Amount - this field is nullable on unit quantity SOVs but NOT amount-based SOVs. For line item creates, if this field is omitted on unit quantity SOVs,  the amount will be calculated as quantity * unit_cost. For line item updates, if a null amount is passed in on unit quantity SOVs, it will set the line item extended type to "calculated".
                  example: '1000.0'
                description:
                  type: string
                  description: Description
                  example: Cleanup
                quantity:
                  type: string
                  description: Quantity - only accepted on unit quantity SOVs
                  example: '20.0'
                unit_cost:
                  type: string
                  description: Unit cost - only accepted on unit quantity SOVs
                  example: '50.00'
                uom:
                  type: string
                  description: Unit of measure - only accepted on unit quantity SOVs. For line item updates, pass null or an empty string to clear the unit of measure.
                  example: Hours
                  enum:
                  - Any value present in the Company list of Units of Measure
                wbs_code_id:
