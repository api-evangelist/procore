      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List programs
      description: Return a list of programs for a company.
      tags:
      - Programs
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        required: false
        description: Response field set to return. Defaults to normal.
        schema:
          type: string
          enum:
          - normal
          - name
          default: normal
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of programs.
                items:
                  title: Program
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this program.
                      example: 1
                    name:
                      type: string
                      description: Display name of the program.
                      example: NW USA
                    address_freeform:
                      type:
                      - string
                      - 'null'
                      description: Freeform address of the program.
                      example: Seattle
                    website:
                      type:
                      - string
                      - 'null'
                      description: Website URL for the program.
                      example: http://nwexampleprogram.com
                    photo_prostore_file_id:
                      type:
                      - integer
                      - 'null'
                      description: ID of the Prostore file used as the program photo.
                      example: 1001
                    logo_prostore_file_id:
                      type:
                      - integer
                      - 'null'
                      description: ID of the Prostore file used as the program logo.
                      example: 1002
                    photo_prostore_file_url:
                      type:
                      - string
                      - 'null'
                      description: URL of the program photo.
                      example: https://storage.procore.com/programs/photo.jpg
                    logo_prostore_file_url:
                      type:
                      - string
                      - 'null'
                      description: URL of the program logo.
                      example: https://storage.procore.com/programs/logo.jpg
                    project_count:
                      type: integer
                      description: Number of projects associated with the program.
                      example: 3
                  example:
                    id: 1
                    name: NW USA
                    address_freeform: Seattle
                    website: http://nwexampleprogram.com
                    photo_prostore_file_id: 1001
                    logo_prostore_file_id: 1002
                    photo_prostore_file_url: https://storage.procore.com/programs/photo.jpg
                    logo_prostore_file_url: https://storage.procore.com/programs/logo.jpg
                    project_count: 3
