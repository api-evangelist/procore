      - summary: Align bulk update validation error payload with specification section divisions API
        description: "**Breaking change for error parsing only.** Success responses are unchanged.\n\nPATCH `/rest/v2.0/companies/{company_id}/projects/{project_id}/specification_sets` previously returned a flat\n`error.details` array where each item looked like `{ \"reason_code\": \"taken\", \"message\": \"...\", \"source\": \"name\", \"object_id\": 2906 }`.\n\nThe endpoint now returns the same shape as specification section divisions bulk update:\n- `error.message` uses the localized validation summary (for example \"One or more validation errors occurred\").\n- `error.details` is a single-element array. The element has `reason_code: \"VALIDATION_FAILED\"`, a `message`, and `failures`:\n  - `creation_failures`: object keyed by stringified client `key` from `creation_params` (or index string if `key` is omitted).\n  - `updation_failures`: object keyed by specification set id string; values are objects with field keys like `name_error`, `position_error`, `date_error` mapping to localized messages.\n  - `deletion_failures`: object (reserved; typically empty).\n\nExample error body:\n\n```json\n{\n  \"error\": {\n    \"code\": \"BAD_REQUEST\",\n    \"message\": \"One or more validation errors occurred\",\n    \"details\": [\n      {\n        \"reason_code\": \"VALIDATION_FAILED\",\n        \"message\": \"One or more validation errors occurred\",\n        \"failures\": {\n          \"creation_failures\": {},\n          \"updation_failures\": {\n            \"2906\": { \"name_error\": \"Name has already been taken\" }\n          },\n          \"deletion_failures\": {}\n        }\n      }\n    ]\n  }\n}\n```\n\nOpenAPI (`specification_sets_v2_0.yml`) and schema `specification_sets_bulk_validation_error.yml` document the `400` response and request body."
