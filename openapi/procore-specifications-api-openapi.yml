                          example: '100120'
                          description: ID of the specification area the section belongs to.
                        specification_section_id:
                          type: string
                          example: '100120'
                          description: ID of the specification section this revision belongs to.
                        updated_at:
                          type: string
                          description: Updated at
                          example: '2017-08-24T22:12:22Z'
                        url:
