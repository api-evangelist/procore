      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                creation_params:
                  type: array
                  description: New sets to create. Use `key` to correlate validation errors in the response.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        description: Client-supplied id for matching entries in `error.details[0].failures.creation_failures`.
                      name:
                        type: string
                        description: Name of the specification set.
                      date:
                        type: string
                        description: Set date (ISO date string).
                      position:
                        type: integer
                        description: Ordering position of the set within the project.
                updation_params:
                  type: array
                  description: Existing sets to update; failures are keyed by set `id` in the error payload.
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Specification set id.
                        example: '2906'
                      name:
                        type: string
                        description: Updated name of the specification set.
                      date:
                        type: string
                        description: Updated set date (ISO date string).
                      position:
                        type: integer
                        description: Updated ordering position of the set within the project.
                deletion_params:
                  type: array
                  description: Sets to delete.
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: Specification set id to delete.
                        example: '2906'
      responses:
