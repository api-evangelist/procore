          content:
            application/json:
              schema:
                type: object
                title: Specification Sets Bulk Validation Error
                description: 'Returned when PATCH bulk update fails model validation. Structure matches other specifications bulk endpoints (for example specification section divisions): grouped failures by operation with `VALIDATION_FAILED` in `details[0].reason_code`.'
                properties:
                  error:
                    type: object
