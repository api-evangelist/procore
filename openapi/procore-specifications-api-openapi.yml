                      code:
                        type: string
                        example: BAD_REQUEST
                        description: HTTP status equivalent in screaming snake case.
                      message:
                        type: string
                        example: One or more validation errors occurred
                        description: Localized summary message.
                      details:
                        type: array
                        description: Contains one object describing validation failures when `reason_code` is `VALIDATION_FAILED`.
                        minItems: 1
                        maxItems: 1
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          - failures
                          properties:
                            reason_code:
                              type: string
                              enum:
