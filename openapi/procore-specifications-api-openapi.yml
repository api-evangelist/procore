                              example: VALIDATION_FAILED
                            message:
                              type: string
                              example: One or more validation errors occurred
                              description: Localized message for this detail entry.
                            failures:
                              type: object
                              required:
                              - creation_failures
                              - updation_failures
                              - deletion_failures
                              properties:
                                creation_failures:
                                  type: object
                                  description: Map of client `key` from `creation_params` (stringified) to field errors. If `key` is omitted, the server uses the zero-based index of the item in `creation_params` as a string key.
                                  additionalProperties:
