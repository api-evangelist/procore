paths:
  /rest/v1.0/companies/{company_id}/managed_equipment/user_permissions:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      deprecated: true
      x-deprecated-at: '2024-12-01'
      x-sunset: '2025-12-02'
      summary: List all Company Managed Equipment User Permissions
      description: Return a list of all Company Managed Equipment User Permissions for a specified company.
      tags:
      - Company Managed Equipment User Permissions
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Company Managed Equipment user permissions
                items:
                  type: object
                  title: CompanyManagedEquipmentUserPermission
                  description: Company Managed Equipment User Permission
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the user permission record.
                      example: 93988
                    company_directory_admin:
                      type: boolean
                      description: User is a Company directory admin
                      example: false
                    name:
                      type: string
                      description: Full name of user
                      example: user, test
                    user_access_level:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Numeric access level identifier.
                        name:
                          type: string
                          description: Human-readable name for the access level (e.g., None, Read-Only, Standard, Admin).
                    permission_template:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the Permission Template
                          example: 1
                        name:
                          type: string
                          description: The name of the Permission Template
                          example: General Contractor
                        project_specific:
                          type: boolean
                          description: If the Permission Template is project specific
                          example: true
                      example:
                        id: 1
                        name: General Contractor
                        project_specific: true
                    vendor:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the vendor.
                          example: 161072
                        name:
                          type: string
                          description: Name of the vendor.
                          example: SID Architecture
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
