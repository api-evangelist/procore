      - name: serializer_view
        in: query
        description: "Controls the RFI list item response shape. The default response schema shown\nfor this endpoint documents the standard list item shape; the values below\nreturn alternate shapes used by existing clients.\n\n- `ids_only` - Returns an array of RFI IDs only. Filters and pagination apply\n  as usual, but `search`, `q`, and `sort[attribute]` are ignored for this\n  view; results are always ordered by RFI ID descending.\n- `base_web_index` - Returns compact web index objects containing only the RFI\n  ID, full RFI number, and subject.\n- `web_index` - Returns web index objects with list display fields, full\n  object associations for project stage, cost code, location, sub job,\n  responsible contractor, user fields, assignees, ball-in-court users, custom\n  fields, requester edit permissions, linked external RFIs, and connected RFI\n  origin data.\n- `flatten_v0` - Returns flattened mobile-compatible objects with related\n  resource IDs instead of several full objects, question and answer data,\n  assignees, ball-in-court users, distribution list users, linked external\n  RFIs, deletion metadata, and connected RFI origin data.\n- Default (not specified) - Returns the standard RFI list item shape shown in\n  the response schema.\n\nUnrecognized values are not rejected. Any value outside the list above returns\nthe default RFI list item shape, so a misspelled view returns a successful\nresponse in the wrong shape.\n"
        schema:
          type: string
          enum:
          - ids_only
          - base_web_index
          - web_index
          - flatten_v0
        required: false
      - name: as_datetimes
        in: query
        description: When true, returns date fields as datetime format
        schema:
          type: boolean
          default: false
        required: false
      - name: search
        in: query
        description: Search for RFIs by subject or number. This parameter will return all RFIs that match the search term.
        schema:
          type: string
      - name: q
        in: query
        description: Alias for `search`. Search for RFIs by subject or number.
        schema:
          type: string
      - name: sort[attribute]
        in: query
        description: Field to sort the RFI list by.
        schema:
          type: string
          enum:
          - assigned_id
          - ball_in_court_id
          - cost_code_id
          - cost_impact
          - created_by_id
          - date_created
          - drawing_number
          - due_date
          - due_date_variance
          - initiated_at
          - location_id
          - number
          - position
          - priority
          - received_from_login_information_id
          - reference
          - responsible_contractor_id
          - schedule_impact
          - specification_section_id
          - status
          - subject
          - time_resolved
          - rfi_manager_id
      - name: sort[direction]
        in: query
        description: Sort direction. Only applies when `sort[attribute]` is also set.
        schema:
          type: string
          enum:
          - asc
          - desc
