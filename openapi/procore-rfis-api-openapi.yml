        explode: false
        schema:
          oneOf:
          - type: boolean
          - type: array
            items:
              type: boolean
      - name: filters[sub_job_id]
        in: query
        description: Return item(s) with the specified Sub Job ID or IDs. ID values may be sent as integers or numeric query-string values.
        required: false
        style: form
        explode: false
        schema:
