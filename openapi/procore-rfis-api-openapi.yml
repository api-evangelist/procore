          - type: integer
          - type: string
            format: integer
          - type: array
            items:
              oneOf:
              - type: integer
              - type: string
                format: integer
      - name: filters[priority]
        in: query
        description: Return item(s) with the specified RFI priority or priorities.
        required: false
        style: form
        explode: false
        schema:
          oneOf:
          - type: string
            enum:
            - low
            - medium
            - high
            - urgent
          - type: integer
            enum:
            - 0
            - 1
            - 2
            - 3
          - type: string
            enum:
            - '0'
            - '1'
            - '2'
            - '3'
          - type: array
            items:
              oneOf:
              - type: string
                enum:
                - low
                - medium
                - high
                - urgent
              - type: integer
                enum:
                - 0
                - 1
                - 2
                - 3
              - type: string
                enum:
                - '0'
                - '1'
                - '2'
                - '3'
      - name: filters[linked_to_connected_rfis]
        in: query
        description: Legacy alias of `filters[linked_to_external_rfis]`, which is the preferred parameter name. Returns RFIs linked to an external (connected) RFI when `true`, and RFIs with no such link when `false`. Sending both with conflicting values returns an empty result set.
        required: false
        schema:
          type: boolean
      - name: filters[linked_to_external_rfis]
        in: query
        description: Returns RFIs linked to an external (connected) RFI when `true`, and RFIs with no such link when `false`. This is the preferred parameter name; `filters[linked_to_connected_rfis]` is a legacy alias that resolves to the same filter. Sending both with conflicting values returns an empty result set.
        required: false
        schema:
          type: boolean
      - name: filters[overdue]
        in: query
        description: Returns only overdue RFIs. The filter applies whenever the parameter is present and the value is not evaluated, so `filters[overdue]=false` returns the same overdue results as `true`. Omit the parameter to include RFIs regardless of due date.
        required: false
        style: form
        explode: false
        schema:
          oneOf:
