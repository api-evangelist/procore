    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Batch Update RFIs
      description: Update specified RFIs in a specified project. Specify the RFIs by their IDs. Pass in the same values for each specified RFI for the action to succeed.
      tags:
      - RFIs
      parameters:
      - name: run_configurable_validations
        in: query
        required: false
        description: If true, validations are run for the corresponding Configurable Field Set.
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: RFI Body
              type: object
              required:
              - data
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: The ID of the RFI
                        example: 12345
                      add_assignee_ids:
                        type: array
                        description: Array of Assignee IDs to add to the Assignees List
                        items:
                          type: integer
                          description: Assignee ID
                        example:
                        - 123
                        - 456
                      add_required_assignee_ids:
                        type: array
                        description: 'Array of Assignee IDs to make required in the Assignees List.  Note: The Assignee must also be in the Assignees List to be marked as required.'
                        items:
                          type: integer
                          description: Required Assignee ID
                        example:
                        - 123
                        - 456
                      remove_assignee_ids:
                        type: array
                        description: Array of Assignee IDs to remove from the Assignees List
                        items:
                          type: integer
                          description: Assignee ID
                        example:
                        - 123
                        - 456
                      add_distribution_ids:
                        type: array
                        description: Array of Distribution Member IDs to add to the Distribution List
                        items:
                          type: integer
                          description: Distribution Member ID
                        example:
                        - 123
                        - 456
                      remove_distribution_ids:
                        type: array
                        description: Array of Distribution Member IDs to remove from the Distribution List
                        items:
                          type: integer
                          description: Distribution Member ID
                        example:
                        - 123
                        - 456
                      cost_code_id:
                        type: integer
                        description: The ID of the Cost Code of the RFI
                        example: 21
                      cost_impact:
                        type: object
                        description: The Cost Impact of the RFI
                        properties:
                          status:
                            type: string
                            description: The Status of the Cost Impact
                            enum:
                            - yes_known
                            - yes_unknown
                            - no_impact
                            - tbd
                            - n_a
                            example: yes_known
                          value:
                            type: number
                            format: float
                            description: Cost impact value in dollars
                            example: 12039.55
                      drawing_number:
                        type: string
                        description: The Drawing Number of the RFI
                        example: 1A
                      due_date:
                        type: string
                        description: 'The Due Date of the RFI

                          *Only admin users can set this field'
                        format: date
                        example: '2021-07-26'
                      location_id:
                        type: integer
                        description: The ID of the Location of the RFI
                        example: 21
                      private:
                        type: boolean
                        description: The Private status of the RFI
                        default: false
                        example: false
                      received_from_login_information_id:
                        type: integer
                        description: The ID of the Received From User of the RFI
                        example: 123
                      reference:
                        type: string
                        description: The Reference of the RFI
                        example: Color of the kitchen wall
                      responsible_contractor_id:
                        type: integer
                        description: The ID of the Responsible Contractor Vendor of the RFI
                        example: 123
                      rfi_manager_id:
                        type: integer
                        description: The ID of the RFI Manager User of the RFI *Only admin users (or standard users, if the project's configuration allows for it) can set this field
                        example: 1
                      schedule_impact:
                        type: object
                        description: The Schedule Impact of the RFI
                        properties:
                          status:
                            type: string
                            description: The Status of the Schedule Impact
                            enum:
                            - yes_known
                            - yes_unknown
                            - no_impact
                            - tbd
                            - n_a
                            example: yes_known
                          value:
                            type: integer
                            description: The Value in days of the Schedule Impact
                            example: 0
                      specification_section_id:
                        type: integer
                        description: The ID of the Specification Section of the RFI
                        example: 123
                      sub_job_id:
                        type: integer
                        description: The ID of the Sub Job of the RFI
                        example: 123
                      subject:
                        type: string
                        description: The Subject of the RFI
                        example: Wall color
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
