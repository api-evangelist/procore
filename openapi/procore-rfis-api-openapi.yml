      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis',\n  qs: {run_configurable_validations: 'SOME_BOOLEAN_VALUE'},\n  headers: {\n    Authorization: 'Bearer REPLACE_BEARER_TOKEN',\n    'content-type': 'application/json'\n  },\n  body: {\n    rfi: {\n      subject: 'Wall Color',\n      reference: 'Color of the kitchen wall',\n      assignee_id: 0,\n      assignee_ids: [123, 456],\n      required_assignee_ids: [123, 456],\n      draft: false,\n      due_date: '2021-07-26',\n      received_from_login_information_id: 123,\n      responsible_contractor_id: 123,\n      distribution_ids: [123, 456],\n      number: '1234',\n      private: false,\n      project_stage_id: 21,\n      schedule_impact: {status: 'yes_known', value: 0},\n      cost_impact: {status: 'yes_known', value: 12039.55},\n      location_id: 123,\n      drawing_number: '1A',\n      specification_section_id: 123,\n      cost_code_id: 123,\n      rfi_manager_id: 1,\n      question: {\n        body: 'What color should the kitchen wall be?',\n        attachments: ['<attachment.png>'],\n        prostore_file_ids: [6, 7],\n        drawing_revision_ids: [4, 5],\n        file_version_ids: [6, 7],\n        form_ids: [7, 8],\n        image_ids: [9, 10],\n        upload_ids: ['4120226e-36a8-416f-970e-880bae78164f', 'de07e35a-4860-4f96-acd8-8360833dc495'],\n        document_management_document_revision_ids: ['5c9800d3-bd12-45dd-a280-85fe887858b2', 'da4b5e3b-ddaf-406f-8b2c-dceb6a60a203']\n      },\n      custom_textfield_1: 'string',\n      custom_textfield_2: 'string',\n      'custom_field_%{custom_field_definition_id}': 'custom field value',\n      revision: '1',\n      source_rfi_header_id: 12345\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
