      summary: Update RFI
      description: Updates a specified RFI in a specified Project.
      tags:
      - RFIs
      parameters:
      - name: run_configurable_validations
        in: query
        required: false
        description: If true, validations are run for the corresponding Configurable Field Set.
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: RFI Update Body
              type: object
              required:
              - rfi
              properties:
                rfi:
                  type: object
                  properties:
                    subject:
                      type: string
                      description: The Subject of the RFI
                      example: Wall Color
                    reference:
                      type: string
                      description: The Reference of the RFI
                      example: Color of the kitchen wall
                    accepted:
                      type: boolean
                      description: The Accepted status of the RFI - closes or opens an RFI
                      default: false
                      example: false
                    assignee_id:
                      type: integer
                      description: 'The ID of the Assignee User. Note: not required if the creator is an admin and the RFI is a draft.

                        *Only admin users can set this field

                        DEPRECATED. Please use assignee_ids instead'
                    assignee_ids:
                      type: array
                      description: 'An array of IDs of the Assignees of the RFI

                        *Only admin users can set this field

                        **If this param is not provided, the assigned_id will be used instead'
                      items:
                        type: integer
                        example: 123
                      example:
                      - 123
                      - 456
                    required_assignee_ids:
                      type: array
                      description: 'An array of IDs of the Assignees that are required to respond to the RFI * Only admin users can set this field ** IDs must also be present in assignee_ids

                        '
                      items:
                        type: integer
                        example: 123
                      example:
                      - 123
                      - 456
                    ball_in_court_id:
                      type: integer
                      description: The ID of the Ball in Court of the RFI. This field is DEPRECATED as of March 31, 2019 and will no longer be supported as of October 1, 2019.
