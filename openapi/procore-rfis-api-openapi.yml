      - summary: Added connect_export_origin to RFI detail response
        description: The RFI detail response now includes a connect_export_origin object when the RFI was exported via cross-account collaboration. The object contains source_provider_name (the originating company or project name) and rfi_number (the originating RFI number). Returns null when the RFI has no cross-collaboration origin.
        endpoint: GET /projects/{project_id}/rfis/{id}
        type: feature
        breaking: false
        datestamp: '2026-03-02'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#show-rfi
      - summary: Added origin_rfi_url to linked external/connected RFIs on the RFI detail response
        description: Linked external (cross-collaboration) RFIs returned on a local RFI's detail payload now include an `origin_rfi_url` field. It contains a zone-aware MFE deep-link back to the original RFI in the upstream (GC) project, or `null` when the upstream connection cannot be resolved (e.g. unsupported zone).
        endpoint: GET /projects/{project_id}/rfis/{id}
        type: feature
        breaking: false
        datestamp: '2026-06-08'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
