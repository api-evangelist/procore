      - RFIs
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified RFI ID or IDs. ID values may be sent as integers or numeric query-string values.
        required: false
        style: form
        explode: false
        schema:
          oneOf:
          - type: integer
          - type: string
            format: integer
          - type: array
            items:
              oneOf:
              - type: integer
              - type: string
                format: integer
      - name: filters[status]
        in: query
        description: Return item(s) with the specified RFI status or statuses.
        style: form
        explode: false
        schema:
          oneOf:
          - type: string
            enum:
            - open
            - closed
            - draft
            - closed_with_revision
            - closed_draft
          - type: array
            items:
              type: string
              enum:
              - open
              - closed
              - draft
              - closed_with_revision
              - closed_draft
      - name: filters[assigned_id]
        in: query
        description: Return item(s) with the specified Assigned ID or IDs. ID values may be sent as integers or numeric query-string values.
        required: false
        style: form
        explode: false
