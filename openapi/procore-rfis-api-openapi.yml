                      example: 123
                    distribution_ids:
                      type: array
                      description: An array of IDs of the Distributions of the RFI
                      items:
                        type: integer
                        example: 123
                      example:
                      - 123
                      - 456
                    number:
                      type: string
                      description: 'The Number of the RFI

                        *This field will be auto-populated if the RFI is not draft'
                      example: 1234
                    private:
                      type: boolean
                      description: The Private status of the RFI
                      default: false
                      example: false
                    project_stage_id:
                      type: integer
                      description: 'The ID of the Project Stage of the RFI

                        *If Number By Stage is enabled in RFI settings, this will add the prefix of the project stage to the full number of the RFI.'
                      example: 42
                    schedule_impact:
                      type: object
                      description: The Schedule Impact of the RFI
                      properties:
                        status:
                          type: string
                          description: The Status of the Schedule Impact
                          enum:
                          - yes_known
                          - yes_unknown
                          - no_impact
                          - tbd
                          - n_a
                          example: yes_known
                        value:
                          type: integer
                          description: The Value in days of the Schedule Impact
                          example: 0
                    cost_impact:
                      type: object
                      description: The Cost Impact of the RFI
                      properties:
                        status:
                          type: string
                          description: The Status of the Cost Impact
                          enum:
                          - yes_known
                          - yes_unknown
                          - no_impact
                          - tbd
                          - n_a
                          example: yes_known
                        value:
                          type: number
                          format: float
                          description: Cost impact value in dollars
                          example: 12039.55
                    location_id:
                      type: integer
                      description: The ID of the Location of the RFI
                      example: 123
                    drawing_number:
                      type: string
                      description: The Drawing Number of the RFI
                      example: 1A
                    specification_section_id:
                      type: integer
                      description: The ID of the Specification Section of the RFI
                      example: 123
                    cost_code_id:
                      type: integer
                      description: The ID of the Cost Code of the RFI
                      example: 123
                    rfi_manager_id:
                      type: integer
                      description: 'The ID of the RFI Manager User of the RFI

                        *Only admin users (or standard users, if the project''s configuration allows for it) can set this field'
                      example: 123
                    question:
                      type: object
                      description: The Question of the RFI
                      required:
                      - body
                      properties:
                        body:
                          type: string
                          description: The Body of the Question
                          example: What color should the kitchen wall be?
                        prostore_file_ids:
                          type: array
                          description: An array of Prostore File IDs. The Prostore Files will be associated with the RFI as attachments.
                          items:
                            type: integer
                          example:
                          - 6
                          - 7
                        drawing_revision_ids:
                          type: array
                          description: Drawing Revisions to attach to the response
                          items:
                            type: integer
                          example:
                          - 4
                          - 5
                        file_version_ids:
                          type: array
                          description: File Versions to attach to the response
                          items:
                            type: integer
                          example:
                          - 6
                          - 7
                        form_ids:
                          type: array
                          description: Forms to attach to the response
                          items:
                            type: integer
                          example:
                          - 7
                          - 8
                        image_ids:
                          type: array
                          description: Images to attach to the response
                          items:
                            type: integer
                          example:
                          - 9
                          - 10
                        upload_ids:
                          type: array
                          description: Uploads to attach to the response
                          items:
                            type: string
                          example:
                          - 4120226e-36a8-416f-970e-880bae78164f
                          - de07e35a-4860-4f96-acd8-8360833dc495
                        document_management_document_revision_ids:
                          type: array
                          description: Document Management Document Revisions to attach to the response
                          items:
                            type: string
                          example:
                          - 5c9800d3-bd12-45dd-a280-85fe887858b2
                          - da4b5e3b-ddaf-406f-8b2c-dceb6a60a203
                    custom_textfield_1:
                      type: string
                      description: The Custom Textfield 1 of the RFI
                    custom_textfield_2:
                      type: string
                      description: The Custom Textfield 2 of the RFI
                    custom_field_%{custom_field_definition_id}:
                      description: 'Value of the custom field. The data type of the value passed in corresponds with the data_type of the Custom Field Definition.

                        For a lov_entry data_type the value passed in should be the ID of one of the Custom Field Definition''s LOV Entries. For a lov_entries data_type the value passed in should be an array of IDs of the Custom Field Definition''s LOV Entries.'
                      example: custom field value
                      oneOf:
                      - type: string
                        title: string
                      - type: number
                        title: number
                      - type: boolean
                        title: boolean
                      - type: array
                        title: array
                        items:
                          type: integer
