          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Added connect_exported_project_ids to the flatten_v0 RFI list view
        description: RFI list responses requested with `serializer_view=flatten_v0` now include `connect_exported_project_ids`, listing the connected projects this RFI has already been exported to. The list is empty when cross-account collaboration is unavailable to the caller.
