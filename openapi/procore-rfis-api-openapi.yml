openapi: 3.2.0
info:
  title: Procore REST RFIs API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: RFIs
paths:
  /rest/v1.0/projects/{project_id}/rfis/{id}/advanced_exports:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    - name: id
      in: path
      description: RFI ID
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Export Options for Existing RFI
      description: Get the available export options for an existing RFI.
      tags:
      - RFIs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                      description: Machine-readable key identifying the export option group, e.g. `cover_sheet` or `files`. Pass sub-options from this group in the `options` request body when creating an export.
                      example: cover_sheet
                    name:
                      type: string
                      description: Human-readable label for the export option group, suitable for display in an export UI.
                      example: Responses
                    type:
                      type: string
                      description: Selection mode for this option group. `single_select` allows exactly one option to be chosen; `multi_select` allows multiple.
                      enum:
                      - single_select
                      - multi_select
                    options:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            description: The value to pass in the request body for this option. For the `cover_sheet` group, pass this as `options.cover_sheet`; for the `files` group, pass this integer ID in the `options.files` array.
                            example: official_responses_only
                            oneOf:
                            - type: string
                            - type: integer
                          name:
                            type: string
                            description: Human-readable display label for this export option.
                            example: Official Responses Only
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: getExportOptionsForExistingRfi
  /rest/v2.0/companies/{company_id}/projects/{project_id}/external_rfis/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: id
      in: path
      description: Unique identifier of the External RFI
      required: true
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Show External RFI
      description: Returns the specified External RFI
      tags:
      - RFIs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: External RFI
                    properties:
                      id:
                        type: string
                        description: Unique string identifier for this external RFI.
                        example: '999'
                      position:
                        type: string
                        description: Sequential position number of this external RFI within the project.
                        example: '1'
                      full_position:
                        type: string
                        description: Position number prefixed with the project identifier (e.g. `PRE-1`).
                        example: PRE-1
                      subject:
                        type: string
                        description: Subject line of the external RFI.
                        example: Specifications [99 14.44B]
                      revision:
                        type: string
                        description: Revision counter. Increments each time a new revision of this RFI is created.
                        example: '5'
                      current_revision:
                        type: boolean
                        description: When `true`, this record represents the most recent revision of the RFI.
                        example: true
                      has_revisions:
                        type: boolean
                        description: When `true`, this RFI has one or more prior revisions.
                        example: true
                      private:
                        type: boolean
                        description: When `true`, this RFI is only visible to users with admin-level access.
                        example: true
                      responsible_contractor:
                        type: object
                        description: Vendor designated as the party responsible for responding to this RFI.
                        properties:
                          id:
                            type: string
                            description: Unique string identifier of the vendor.
                            example: '161072'
                          name:
                            type: string
                            description: Display name of the responsible contractor vendor.
                            example: SID Architecture
                      last_updated_at:
                        type: string
                        format: date-time
                        description: Timestamp of the most recent update to this external RFI, in ISO 8601 format.
                        example: '2012-10-24T21:39:40Z'
                      sync_status:
                        type: string
                        description: Synchronization state between the local and upstream RFI.
                        example: in_sync
                        enum:
                        - in_sync
                        - upstream_private
                      status:
                        type: string
                        description: Lifecycle status of the external RFI. Recycled variants (e.g. `open_recycled`) appear when the RFI has been moved to the recycle bin.
                        example: open
                        enum:
                        - open
                        - closed
                        - draft
                        - pending
                        - closed_draft
                        - closed_with_revision
                        - open_recycled
                        - draft_recycled
                        - closed_recycled
                        - pending_recycled
                        - closed_draft_recycled
                        - closed_with_revision_recycled
                      due_date:
                        type:
                        - string
                        - 'null'
                        description: Date by which a response is expected, in `YYYY-MM-DD` format. Null if no due date is set.
                        format: date
                        example: '2017-01-18'
                      created_by:
                        type: object
                        description: Contact who originally created this external RFI.
                        properties:
                          id:
                            type: string
                            description: Unique string identifier of the contact record.
                            example: '161072'
                          login_information_id:
                            type: string
                            deprecated: true
                            description: Deprecated. This field is not returned by the API.
                            example: '161072'
                          name:
                            type: string
                            description: Full display name of the contact.
                            example: Carl the Contractor
                      rfi_manager:
                        type: object
                        description: Contact assigned as manager of this external RFI.
                        properties:
                          id:
                            type: string
                            description: Unique string identifier of the contact record.
                            example: '161072'
                          login_information_id:
                            type: string
                            deprecated: true
                            description: Deprecated. This field is not returned by the API.
                            example: '161072'
                          name:
                            type: string
                            description: Full display name of the contact.
                            example: Carl the Contractor
                      received_from:
                        type: object
                        description: Contact who submitted or originated this external RFI.
                        properties:
                          id:
                            type: string
                            description: Unique string identifier of the contact record.
                            example: '161072'
                          login_information_id:
                            type: string
                            deprecated: true
                            description: Deprecated. This field is not returned by the API.
                            example: '161072'
                          name:
                            type: string
                            description: Full display name of the contact.
                            example: Carl the Contractor
                      download_all_attachments_url:
                        type: string
                        description: URL to download a zip archive of all attachments on this external RFI.
                        example: http://www.example.com/download/all
                      initiated_at:
                        type:
                        - string
                        - 'null'
                        description: Timestamp when this external RFI was opened/initiated, in ISO 8601 format. Null for draft external RFIs.
                        format: date-time
                        example: '2016-08-23T15:23:57Z'
                      time_resolved:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Timestamp when this external RFI was closed, in ISO 8601 format. Null if still open.
                        example: '2017-01-12T17:09:15Z'
                      created_at:
                        type: string
                        description: Timestamp when this external RFI record was created, in ISO 8601 format.
                        format: date-time
                        example: '2016-08-23T15:23:57Z'
                      question:
                        type: string
                        description: Body of the RFI question. May contain HTML markup.
                        example: <p>Are the items listed on Schedule C acceptable?</p>
                      attachments:
                        type: array
                        description: Files attached directly to this external RFI (not to its responses).
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique string identifier of the attachment file.
                              example: '5324'
                            url:
                              type: string
                              description: Download URL for this attachment.
                              example: http://www.example.com/
                            viewable:
                              type: boolean
                              description: When `true`, the file can be rendered inline in a document viewer.
                              example: true
                            can_be_viewed:
                              type: boolean
                              description: When `true`, the current user has permission to view this attachment.
                              example: true
                      cover_sheet:
                        type:
                        - object
                        - 'null'
                        description: Cover sheet document for this external RFI, if one has been attached.
                        properties:
                          id:
                            type: string
                            example: '12345'
                          attachment:
                            type: object
                            properties:
                              id:
                                type: string
                                example: '161072'
                              name:
                                type: string
                                example: coversheet.pdf
                              url:
                                type: string
                                description: Download URL for the cover sheet.
                                example: http://www.example.com/coversheet.pdf
                              viewable:
                                type: boolean
                                description: When `true`, the cover sheet can be rendered inline in a document viewer.
                                example: true
                              can_be_viewed:
                                type: boolean
                                description: When `true`, the current user has permission to view the cover sheet.
                                example: true
                      responses:
                        type: array
                        description: Official and informal responses to this external RFI.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique string identifier of the response.
                              example: '161072'
                            body:
                              type: string
                              description: Body text of the response. May contain HTML markup.
                              example: RFI Response 1
                            created_by:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Unique string identifier of the response author contact.
                                  example: '161072'
                                login_information_id:
                                  type: string
                                  deprecated: true
                                  description: Deprecated. This field is not returned by the API.
                                  example: '161072'
                                name:
                                  type: string
                                  description: Full display name of the response author.
                                  example: Carl the Contractor
                            created_at:
                              type: string
                              description: Timestamp when this response was created, in ISO 8601 format.
                              format: date-time
                              example: '2016-08-23T15:23:57Z'
                            official:
                              type: boolean
                              description: When `true`, this is an official response to the RFI.
                              example: true
                            download_all_attachments_url:
                              type: string
                              description: URL to download a zip archive of all attachments on this response.
                              example: http://www.example.com/download/all
                            attachments:
                              type: array
                              description: Files attached to this response.
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Unique string identifier of the attachment file.
                                    example: '5324'
                                  url:
                                    type: string
                                    description: Download URL for this attachment.
                                    example: http://www.example.com/
                                  viewable:
                                    type: boolean
                                    description: When `true`, the file can be rendered inline in a document viewer.
                                    example: true
                                  can_be_viewed:
                                    type: boolean
                                    description: When `true`, the current user has permission to view this attachment.
                                    example: true
                      project_connection:
                        type:
                        - object
                        - 'null'
                        description: Details of the upstream project this external RFI is connected to. Null if not connected.
                        properties:
                          upstream_project_name:
                            type: string
                            description: Display name of the upstream (GC) project.
                            example: Carpinteria Head Quarters
                          upstream_company_name:
                            type: string
                            description: Display name of the company that owns the upstream project.
                            example: Procore Construction
                          upstream_project_id:
                            type: string
                            description: Unique string identifier of the upstream project.
                            example: '42'
                          upstream_company_id:
                            type: string
                            description: Unique string identifier of the company that owns the upstream project.
                            example: '7'
                          sync_on_open_enabled:
                            type: boolean
                            description: When `true`, this connection syncs open RFIs from the upstream project in addition to closed ones. `false` when the connection syncs closed RFIs only, or the setting cannot be determined.
                            example: false
                      connection_status:
                        type: string
                        description: Whether this external RFI is actively connected to a local RFI. One of `connected` or `disconnected`.
                        example: connected
                        enum:
                        - connected
                        - disconnected
                      download_external_rfi_and_responses_attachments_url:
                        type:
                        - string
                        - 'null'
                        description: URL to download a zip of all attachments across this external RFI and its responses. Null if no attachments exist.
                        example: http://www.example.com/download/all
                      origin_rfi_id:
                        type:
                        - string
                        - 'null'
                        description: ID of the originating local RFI that was exported to create this external RFI. Null if there is no originating RFI.
                        example: '101'
                      origin_project_id:
                        type: string
                        description: ID of the upstream project that the originating RFI belongs to.
                        example: '42'
                      origin_company_id:
                        type:
                        - string
                        - 'null'
                        description: ID of the company that owns the upstream project. Null if there is no upstream company.
                        example: '7'
                      linked_local_rfis:
                        type: array
                        description: Local RFIs linked to this external RFI.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique string identifier of the linked local RFI.
                              example: '55'
                            status:
                              type: string
                              description: Current lifecycle status of the linked local RFI.
                              example: open
                            formatted_name:
                              type: string
                              description: Human-readable display name of the linked local RFI.
                              example: RFI-001 — Confirm spec material
                      cross_collab_originated:
                        type: boolean
                        description: When `true`, this external RFI was created via cross-company collaboration export.
                        example: false
                      origin_rfi_url:
                        type:
                        - string
                        - 'null'
                        description: URL to the originating RFI in the upstream project. Null if no origin RFI or URL is unavailable.
                        example: https://app.procore.com/123/project/rfi/show/456
                      linked_drawings:
                        type: array
                        description: Drawing attachments linked to this external RFI.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique string identifier of the linked drawing record.
                              example: '78'
                            attachment:
                              type: object
                              description: The drawing file attachment.
                              properties:
                                id:
                                  type: string
                                  description: Unique string identifier of the attachment file.
                                  example: '161072'
                                name:
                                  type: string
                                  description: Display name of the drawing file.
                                  example: Floor Plan Rev A.pdf
                                url:
                                  type: string
                                  description: Download URL for this drawing.
                                  example: http://www.example.com/drawing.pdf
                                viewable:
                                  type: boolean
                                  description: When `true`, the drawing can be rendered inline in a document viewer.
                                  example: true
                                can_be_viewed:
                                  type: boolean
                                  description: When `true`, the current user has permission to view this drawing.
                                  example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis/%7Bid%7D',\n  headers: {Authorization: 'Bearer REPLACE_BEARER_TOKEN'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Authorization'': "Bearer REPLACE_BEARER_TOKEN" }


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis/%7Bid%7D", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis/%7Bid%7D \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis/%7Bid%7D\"),\n    Headers =\n    {\n        { \"Authorization\", \"Bearer REPLACE_BEARER_TOKEN\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: showExternalRfi
  /rest/v2.0/companies/{company_id}/projects/{project_id}/external_rfis/{id}/revisions:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: id
      in: path
      description: External RFI ID
      required: true
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: List External RFI Revisions
      description: Return information about specified External RFI revisions
      tags:
      - RFIs
      parameters:
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: RFI Revision
                      properties:
                        id:
                          type: string
                          description: Unique string identifier for this RFI revision.
                        title:
                          type: string
                          description: Display title of the RFI revision (the formatted name of the RFI at that revision point).
                        current_revision:
                          type: boolean
                          description: When `true`, this record is the most recent revision.
                        status:
                          type: string
