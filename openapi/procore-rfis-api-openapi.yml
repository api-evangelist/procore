      x-changelog:
      - summary: Fixed responsible_contractor_id filter parameter documentation
        description: The `filters[responsible_contractor_id]` parameter documentation has been corrected to show it accepts an array of Responsible Contractor IDs.
        endpoint: GET /projects/{project_id}/rfis
        type: refinement
        breaking: false
        datestamp: '2025-12-12'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Added connect_export_origin to RFI list response
        description: The RFI list response now includes a connect_export_origin object on each list item when the RFI was exported via cross-account collaboration. The object contains source_provider_name (the originating company or project name) and rfi_number (the originating RFI number). Returns null for RFIs without a cross-collaboration origin.
        endpoint: GET /projects/{project_id}/rfis
        type: feature
        breaking: false
        datestamp: '2026-03-02'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Added `reference` field to the `flatten_v0` serializer view
        description: The `reference` field is now included in the response when using `serializer_view=flatten_v0`. Previously, this field was only available in the default and extended views. The field is a nullable string  and its value is identical to what is returned by the standard v1.0 API.
        endpoint: GET /projects/{project_id}/rfis
        type: refinement
        breaking: false
        datestamp: '2026-03-31'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Documented RFI list serializer_view response variants
        description: The RFI list API documentation now describes the supported `serializer_view` values and the response shape returned by each view, including `ids_only`, `base_web_index`, `web_index`, and `flatten_v0`.
        endpoint: GET /projects/{project_id}/rfis
        type: refinement
        breaking: true
        datestamp: '2026-07-20'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Documented additional RFI list filters, sort attributes, and search alias
        description: 'The RFI list API documentation now describes filters that the endpoint has always accepted but did not document: `current_revision`, `sub_job_id`, `priority`, `overdue`, `linked_to_external_rfis`, `linked_to_connected_rfis`, `for_location_id_with_sublocations`, and `initiated_at`. Existing ID filters are now documented as accepting a single value or an array, `filters[status]` documents the `closed_with_revision` and `closed_draft` values, and `filters[number]` is corrected to a string because it matches the full RFI number rather than a numeric ID. `sort[attribute]` documents the `ball_in_court_id`, `priority`, and `status` values, and the `q` search alias and `as_datetimes` parameters are now listed.'
        endpoint: GET /projects/{project_id}/rfis
        type: refinement
        breaking: false
        datestamp: '2026-07-30'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Documented linked external RFI status, sync, and connection values
        description: The linked external RFI objects returned by the `web_index` and `flatten_v0` RFI list views now document their allowed values. `status` includes the existing `_recycled` variants returned when the upstream RFI is in the recycle bin, `sync_status` documents `in_sync` and `upstream_private`, and `connection_status` documents `connected` and `disconnected`. Integrations should tolerate unknown future values.
        endpoint: GET /projects/{project_id}/rfis
        type: refinement
        breaking: true
        datestamp: '2026-07-30'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: rfis?version=1.0#list-rfis
      - summary: Corrected documented RFI response status values
        description: The standard and extended RFI response schemas now document the existing `closed_with_revision` and `closed_draft` status values and no longer list `recycled`, which is not returned as an RFI status. Generated clients should handle the newly documented values and tolerate unknown future status values.
        endpoint: GET /projects/{project_id}/rfis
        type: refinement
        breaking: true
        datestamp: '2026-07-30'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
