    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Download RFIs List
      description: Downloads a PDF or CSV of the RFIs List
      tags:
      - RFIs
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: filters[query]
        in: query
        description: Search Query
        schema:
          type: string
      - name: export_format
        in: query
        description: File format for the export - 'pdf' or 'csv'.
        schema:
          type: string
          enum:
          - pdf
          - csv
      - name: table_configuration_for_export
        in: query
        description: "Table configuration for the export that controls which columns are visible and their order in the generated PDF or CSV.\n\nWhen provided, the export will respect both the column visibility settings and the column order from the frontend table configuration.\nColumns marked as `hidden: true` will be excluded from the export, and visible columns will appear in the same order \nas specified in the columnState array.\n\nIf this parameter is not provided, the export will use default column visibility and order based on configurable field sets.\n"
        schema:
          type: object
          description: Table configuration object containing column state information
          properties:
            columnState:
              type: array
              description: Array of column configuration objects that determines both visibility and order of columns in the export
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: The field name/identifier for the column. The order of fields in the array determines the column order in the export.
                    enum:
                    - subject
                    - received_from_login_information_id
                    - revision
                    - status
                    - position
                    - responsible_contractor_id
                    - initiated_at
                    - rfi_manager_id
                    - assignees
                    - ball_in_courts
                    - due_date
                    - time_resolved
                    - location_id
                    - schedule_impact
                    - cost_impact
                    - cost_code_id
                    - sub_job_id
                    - project_stage_id
                    - priority
                    - private
                  hidden:
                    type: boolean
                    description: Whether the column should be hidden in the export
                required:
                - field
                - hidden
                additionalProperties: true
          example:
            columnState:
            - field: position
              hidden: false
            - field: subject
              hidden: false
            - field: status
              hidden: false
            - field: assignees
              hidden: false
            - field: due_date
              hidden: false
            - field: initiated_at
              hidden: false
            - field: priority
              hidden: false
            - field: responsible_contractor_id
              hidden: true
            - field: ball_in_courts
              hidden: false
            - field: location_id
              hidden: true
            - field: private
              hidden: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                description: CSV Format (if export_format=csv)
                example: '#,Created By,Initiated At,Assigned,Due Date,Subject,Responsible Contractor,Received From,Cost Impact,Cost Impact Value,Schedule Impact,Schedule Impact Value,Drawing Number,Reference,Closed Date,Cost Code,Location,Closed?,Ball In Court,Latest Assignee Response Date,Private,"",""

                  61,"The Contractor, Carl ",2017-02-16,"The Contractor, Carl",2017-02-19,An Interesting Subject,,,"",,"",,"","","",N/A,,false,"The Contractor, Carl",02/16/17,true,,'
