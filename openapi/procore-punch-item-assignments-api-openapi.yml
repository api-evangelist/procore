                    comment:
                      type: string
                      description: Comment
                      example: This Punch Item task is complete
                    login_information_id:
                      type: integer
                      description: User ID
                      example: 421
                attachments:
                  type: array
                  description: 'Punch Item Assignment attachments.

                    To upload attachments you must upload the entire payload as `multipart/form-data` content-type and

                    specify each parameter as form-data together with `attachments[]` as files.'
                  example:
                  - <file.png>
                  items:
                    type: string
        required: true
