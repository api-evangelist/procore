openapi: 3.2.0
info:
  title: Procore REST Punch Item Assignments API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Punch Item Assignments
paths:
  /rest/v1.0/projects/{project_id}/punch_item_assignments/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      description: ID of the Punch Item Assignment
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Show Punch Assignment
      description: Returns single Punch Item Assignment.
      tags:
      - Punch Item Assignments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the Punch Item Assignment.
                    example: 333675
                  approved:
                    type: boolean
                    description: Resolution status
                    example: true
                  status:
                    type: string
                    description: Status of Assignment
                    example: unresolved
                  name:
                    type: string
                    description: Name of the assigned user.
                    example: Extra work
                  comment:
                    type: string
                    description: Comment
                    example: Completed
                  login_information_id:
                    type: integer
                    description: ID of the assigned user's login information.
                    example: 420
                  login_information_name:
                    type: string
                    description: Name of the assigned user.
                    example: Edgar Admin
                  login_information:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                      company_name:
                        type: string
                        description: Company Name
                        example: ABC drywall
                  attachments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 5324
                        url:
                          type: string
                          description: URL
                          example: http://www.example.com/
                        filename:
                          type: string
                          description: Filename
                          example: january_receipt_copy.jpg
                        viewable_document_id:
                          type: integer
                          description: Viewable Document ID
                          example: 492
                        attached_to_item_id:
                          type:
                          - integer
                          - 'null'
                          description: Attached to item ID
                          example: 323
                        attached_to_item_type:
                          type:
                          - string
                          - 'null'
                          description: Attached to item type
                          example: Image
                        viewer_url:
                          type:
                          - string
                          - 'null'
                          description: Unified viewer link
                          example: /webclients/host/companies/1/projects/1/tools/document-viewer/document-viewer/51GW47XAV5N64CQ2F8HTWFW0M4?item_type=ProcoreComment&item_id=1&parent_id=1&fullscreen
                  vendor:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        example: 161072
                      name:
                        type: string
                        example: SID Architecture
                  notified_at:
                    type: string
                    description: Date assignee was notified of Punch Item
                    example: '2018-10-22T23:46:50Z'
                  responded_at:
                    type: string
                    description: Date Assignee responded to the Punch Item
                    example: '2018-10-26T17:51:30Z'
                  manager_accepted_at:
                    type: string
                    description: Date Punch Item Manager resolved the Punch Item Assignment
                    example: '2018-10-26T18:15:26Z'
                  user_name:
                    type: string
                    description: Name of the assigned user.
                    example: Edgar Admin
                  updated_at:
                    type: string
                    description: Date Assignment was updated
                    example: '2018-10-26T18:15:26Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: User does not have right permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
