      summary: Update Punch Item Assignment
      description: Update single Punch Item Assignment.
      tags:
      - Punch Item Assignments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - punch_item_assignment
              properties:
                send_emails:
                  type: string
                  description: Parameter to send email to assignees, distribution members and creator of the Punch Item. Parameter must be true and status or comment must have changed for an email to send.
                  example: true
                punch_item_assignment:
                  type: object
                  description: Punch Item Assignment object
                  properties:
                    approved:
                      type: boolean
                      description: Resolution status
                      default: false
                      example: true
                    comment:
                      type: string
                      description: Comment
                      example: This Punch Item task is complete
                    login_information_id:
                      type: integer
                      description: User ID
                      example: 421
                    status:
                      type: string
                      description: Punch Item Assignment Status
                      default: unresolved
                      example: ready_for_review
                      enum:
                      - unresolved
                      - ready_for_review
                      - work_not_accepted
                      - resolved
                    document_management_document_revision_ids:
                      type: array
                      description: Document Management Document Revisions to attach to the response
                      items:
                        type: string
                      example:
                      - 5c9800d3-bd12-45dd-a280-85fe887858b2
                      - da4b5e3b-ddaf-406f-8b2c-dceb6a60a203
                    upload_ids:
                      type: array
                      description: Uploads to attach to the response
                      items:
                        type: string
                      example:
                      - 01JDENGN32Z9AJN1EB8R6NWYGD
                      - 01JDENH8W5GWSF34A5TA5T39CC
          multipart/form-data:
            schema:
              type: object
              required:
              - punch_item_assignment
              properties:
                send_emails:
                  type: string
                  description: Parameter to send email to assignees, distribution members and creator of the Punch Item. Parameter must be true and status or comment must have changed for an email to send.
                  example: true
