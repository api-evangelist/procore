openapi: 3.2.0
info:
  title: Procore REST Estimating Project API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: EstimatingProject
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/estimating/estimating_project:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      tags:
      - EstimatingProject
      summary: Get estimating project data by Procore project id
      operationId: EstimatingProject_GetProject
      parameters:
      - name: company_id
        in: path
        required: true
        description: Unique company identifier associated with the Procore User Account.
        schema:
          type: string
        x-position: 1
      - name: project_id
        in: path
        required: true
        description: Unique project identifier
        schema:
          type: string
        x-position: 2
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type:
                    - object
                    - 'null'
                    description: Represents a project as returned in portfolio (company-wide) listings.
                    additionalProperties: false
                    properties:
                      id:
                        type:
                        - string
                        - 'null'
                        description: The unique identifier of the Bid Board project.
                      name:
                        type:
                        - string
                        - 'null'
                        description: The name of the Bid Board project.
                      description:
                        type:
                        - string
                        - 'null'
                        description: The description of the Bid Board project.
                      created_on:
                        type:
                        - string
                        - 'null'
                        description: The creation date of the Bid Board project.
                        format: date-time
                      due_date:
                        type:
                        - string
                        - 'null'
                        description: The due date of the Bid Board project.
                        format: date-time
                        example: '2025-01-22T16:40:00Z'
                      last_status_change:
                        type:
                        - string
                        - 'null'
                        description: The date when the Bid Board project's status was last changed.
                        format: date-time
                      status:
                        type: string
                        description: The current status of the project.
                        x-enumNames:
                        - Estimating
                        - BidSubmitted
                        - Accepted
                        - Delayed
                        - Lost
                        - InProgress
                        - Complete
                        - Invitation
                        - ToDo
                        - CustomStage1
                        - CustomStage2
                        - CustomStage3
                        - CustomStage4
                        - CustomStage5
                        - CustomStage6
                        - CustomStage7
                        enum:
                        - ESTIMATING
                        - BID_SUBMITTED
                        - ACCEPTED
                        - DELAYED
                        - LOST
                        - IN_PROGRESS
                        - COMPLETE
                        - INVITATION
                        - TO_DO
                        - CUSTOM_STAGE1
                        - CUSTOM_STAGE2
                        - CUSTOM_STAGE3
                        - CUSTOM_STAGE4
                        - CUSTOM_STAGE5
                        - CUSTOM_STAGE6
                        - CUSTOM_STAGE7
                      archived:
                        type: boolean
                        description: Indicates whether the Bid Board project is archived.
                        example: false
                      use_metric_units:
                        type: boolean
                        description: Indicates whether the Bid Board project uses metric units.
                      use_tax_from_cost:
                        type: boolean
                        description: Indicates whether the Bid Board project uses tax calculations based on cost.
                      individual_labor_rates:
                        type: boolean
                        description: Indicates whether the Bid Board project uses individual labor rates.
                      stats:
                        type:
                        - object
                        - 'null'
                        description: The Bid Board project statistics.
                        additionalProperties: false
                        properties:
                          total:
                            type: number
                            description: The total cost or value associated with the Bid Board project.
                            format: decimal
                          completed_tasks:
                            type: integer
                            description: The number of completed tasks in the Bid Board project.
                            format: int32
                          total_tasks:
                            type: integer
                            description: The total number of tasks in the Bid Board project.
                            format: int32
                          total_notes:
                            type: integer
                            description: The total number of notes associated with the Bid Board project.
                            format: int32
                      project_number:
                        type:
                        - string
                        - 'null'
                        description: The Bid Board project number.
                      square_footage:
                        type:
                        - number
                        - 'null'
                        description: The square footage of the Bid Board project.
                        format: decimal
                        example: 0
                      pricing_locked:
                        type: boolean
                        description: Indicates whether the Bid Board project pricing is locked.
                        example: false
                      address:
                        type:
                        - object
                        - 'null'
                        description: The address associated with the Bid Board project.
                        additionalProperties: false
                        properties:
                          street:
                            type:
                            - string
                            - 'null'
                            description: The street address.
                          city:
                            type:
                            - string
                            - 'null'
                            description: The city of the address.
                          state:
                            type:
                            - string
                            - 'null'
                            description: The state of the address.
                          zip:
                            type:
                            - string
                            - 'null'
                            description: The zip code of the address.
                          country:
                            type:
                            - string
                            - 'null'
                            description: The country of the address.
                      is_template:
                        type: boolean
                        description: Indicates whether the Bid Board project is a template.
                        example: false
                      updated_at:
                        type:
                        - string
                        - 'null'
                        description: The date and time when the Bid Board project was last updated.
                        format: date-time
                        example: '2026-03-25T13:25:00Z'
                      project_id:
                        type:
                        - string
                        - 'null'
                        description: 'The Procore Portfolio project identifier linked to this Bid Board project. Null if the Bid Board project is not added to Portfolio.

                          Use this to join Bid Board Project data with the Procore Portfolio Project API data.'
      x-doc:
        stage: ga
        visibility: public
        exposure: public
      x-changelog:
      - summary: Introducing new endpoint to get Procore project estimating information
        description: This endpoint allows retrieving estimating information for a Procore project.
        endpoint: GET /companies/{company_id}/projects/{project_id}/estimating/estimating_project
        type: new
        breaking: false
        datestamp: '2026-03-30'
        versions:
        - v2.0
      - summary: 'Introducing new field to the response models: project_id'
        description: 'The response of Bid Board project endpoints now includes project_id: the Procore Portfolio project identifier linked to this Bid Board project.'
        endpoint: GET /companies/{company_id}/projects/{project_id}/estimating/estimating_project
        type: refinement
        breaking: false
        datestamp: '2026-05-18'
        versions:
        - v2.0
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/estimating/estimating_project'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/estimating/estimating_project")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/estimating/estimating_project"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/estimating/estimating_project\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
