openapi: 3.2.0
info:
  title: Procore REST Recent Activity API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Recent Activity
paths:
  /rest/v1.0/projects/{project_id}/recent_activity:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Recent Activity Items
      description: Return a list of items that have been recently updated by the users.
      tags:
      - Recent Activity
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Recent Activity Items
                items:
                  type: object
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 0
                      details:
                        type: string
                        example: '#211000-1.0: Private submittal with Sub-GC-AE workflow'
                      number:
                        type: number
                        example: 1
                      created_by:
                        type: string
                        example: Jennifer Howard
                      created_at:
                        type: string
                        format: date-time
                        example: '2022-12-15T18:16:57Z'
                      updated_at:
                        type: string
                        format: date-time
                        example: '2022-12-15T18:17:19Z'
                      status:
                        type: string
                        example: Draft
                      type:
                        type: string
                        example: Submittals
                      activity_type:
                        type: string
                        example: submittal_log
                      url:
                        type: string
                        example: https://localhost/3279/project/submittal_logs/66951
                      due_date:
                        type: string
                        format: date
                        example: '2023-01-26'
                example:
                - id: 0
                  details: '#1: Punch List'
                  number: 1
                  created_by: Marcia Carrera
                  created_at: '2023-12-28T17:16:27Z'
                  updated_at: '2023-12-28T17:16:27Z'
                  due_date: '2023-12-31'
                  status: Pending
                  type: Punchlist Item
                  activity_type: punch_list
                  url: http://localhost:3000/1/project/punch_list/1
                - id: 1
                  details: '#1: RFI1'
                  number: 1
                  created_by: Marcia Carrera
                  created_at: '2023-12-27T22:11:35Z'
                  updated_at: '2023-12-27T22:11:35Z'
                  due_date: '2023-12-30'
                  status: Open
                  type: RFI
                  activity_type: rfi
                  url: http://localhost:3000/1/project/rfi/show/1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/recent_activity',\n  qs: {page: 'SOME_INTEGER_VALUE', per_page: 'SOME_INTEGER_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/recent_activity?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/recent_activity?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/recent_activity?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: listRecentActivityItems
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
