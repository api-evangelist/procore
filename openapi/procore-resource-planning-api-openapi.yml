openapi: 3.2.0
info:
  title: Procore REST Resource Planning API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Resource Planning
paths:
  /rest/v1.0/workforce-planning/v2/companies/{company_id}/assignments:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Company Assignments
      description: Returns all of the Resource Planning Assignment data for the given company
      tags:
      - Resource Planning
      parameters:
      - name: company_id
        in: path
        description: 'Unique identifier for the company. This parameter accepts both formats:

          - **Recommended**: Procore company ID (integer) - Use this for new integrations

          - Legacy: LaborChart UUID format (uuid string) - Supported for backward compatibility


          A proxy layer automatically handles both formats, but using the Procore company ID is preferred for consistency with other Procore APIs.

          '
        required: true
        schema:
          oneOf:
          - type: integer
            description: Procore company ID (recommended)
          - type: string
            format: uuid
            description: LaborChart UUID (legacy support)
      - name: created_after
        in: query
        description: 'Filters items created on or after the specified date (inclusive). Accepts an ISO 8601 date string.

          '
        required: false
        schema:
          type: string
          format: date
      - name: created_at
        in: query
        description: 'Filters items based on their creation timestamp. Accepts an ISO 8601 date string.

          '
        required: false
        schema:
          type: string
          format: date
      - name: created_before
        in: query
        description: 'Filters items created on or before the specified date (inclusive). Accepts an ISO 8601 date string.

          '
        required: false
        schema:
          type: string
          format: date
      - name: dayRange
        in: query
        description: 'A value specifying how many days forward you would like to get assignments for from the specified startDay. Assignments whose start_day falls within the given range will be returned in the response.

          The startDay parameter in conjunction with the dayRange parameter will create a range of dates that will filter each assignment based on its start_day field.

          For example, passing in a startDay of 2024-01-01 and a dayRange of 1 will return all assignments that begin on either the 1st or 2nd of January.

          If we pass in the same startDay, but with a dayRange of 15, the results will include all assignments whose start_day exists between the dates of 2024-01-01 and 2024-01-15.

          Max value is 365.

          '
        required: true
        schema:
          type: string
          minimum: 1
          maximum: 365
          example: 15
      - name: page
        in: query
        description: 'This is a **0-based index** representing the page slice of the data you want to retrieve. Each page contains up to **400 items**.

          ### **📌 Pageable Endpoints** People endpoints that return multiple records **support pagination**. It is recommended to use this feature to prevent network timeouts from excessively large data requests.

          ### **📌 Response Structure** A successful response will include the following properties:

          - **`possible_pages`** *(integer)* → Total number of pages available to retrieve all data. - **`current_page`** *(integer)* → The **0-based index** of the page retrieved. - **`data`** *(array)* → List of records returned for the requested page (up to 400 items per page).

          If a **page value exceeds** `possible_pages`, the `data` property will return an **empty array**.

          '
        required: false
        schema:
          type: integer
          minimum: 0
      - name: start_day
        in: query
        description: The starting day to filter assignments by.
        required: true
        schema:
          type: string
          example: '2024-01-01'
      - name: updated_after
        in: query
        description: 'Filters items updated on or after the specified date (inclusive). Accepts an ISO 8601 date string.

          '
        required: false
        schema:
          type: string
          format: date
      - name: updated_at
        in: query
        description: 'Filters items based on their last updated timestamp. Accepts an ISO 8601 date string.

          '
        required: false
        schema:
          type: string
          format: date
      - name: updated_before
        in: query
        description: 'Filters items updated on or before the specified date (inclusive). Accepts an ISO 8601 date string.

          '
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Response schema for company assignments
                  properties:
                    possible_pages:
                      type: integer
                      description: Total number of pages available based on the query parameters
                      example: 3
                    current_page:
                      type: integer
                      description: The current 0-based page index of the returned data
                      example: 0
                    data:
                      type: array
                      description: List of people and their assignments
                      items:
                        type: object
                        properties:
                          person_id:
                            type: string
                            description: Unique identifier for the person
                            example: ce7da5a6-c908-4506-a251-16fcbf5e96d7
                          person_name:
                            type: string
                            description: Full name of the person
                            example: Aaron Kelly
                          employee_number:
                            type: string
                            description: Employee number assigned to the person
                            example: 123-a234s-456
                          job_title_name:
                            type: string
                            description: The job title associated with the person
                            example: Apprentice-4
                          job_title_id:
                            type: string
                            description: Unique identifier for the job title
                            example: abe0afa9-c5be-4cee-8805-1adc88880d09
                          job_title_color:
                            type: string
                            description: The color associated with the job title
                            example: '#5bd043'
                          assignments:
                            type: array
                            description: List of assignments associated with the person
                            items:
                              type: object
                              properties:
                                assignment_status:
                                  type: object
                                  description: Status of the assignment
                                  properties:
                                    abbreviation:
                                      type: string
                                      description: Abbreviated status
                                      example: COMP
                                    color:
                                      type: string
                                      description: Status color code
                                      example: '#FFFB23'
                                    id:
                                      type: string
                                      description: Unique identifier for the assignment status
                                      example: c80148f1-1f29-4595-b552-08fbf16fdb30
                                    name:
                                      type: string
                                      description: Full name of the status
                                      example: Complete
                                start_day:
                                  type: string
                                  format: date
                                  description: Start date of the assignment (string format)
                                  example: 06/25/18
                                end_day:
                                  type: string
                                  format: date
                                  description: End date of the assignment (string format)
                                  example: 06/29/18
                                project_name:
                                  type: string
                                  description: Name of the project assigned to
                                  example: Airport Concourse
                                project_number:
                                  type: string
                                  description: Project number
                                  example: '112233'
                                project_id:
                                  type: string
                                  description: Unique identifier for the project
                                  example: 446e7813-02f0-4629-b2b7-81dd942a8941
                                procore_project_id:
                                  type: integer
                                  description: Procore-specific project identifier
                                  example: 12345
                                category_name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Name of the assignment category (if applicable)
                                  example: null
                                category_id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Unique identifier for the assignment category (if applicable)
                                  example: null
                                subcategory_name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Name of the assignment subcategory (if applicable)
                                  example: null
                                subcategory_id:
                                  type:
                                  - string
                                  - 'null'
                                  description: Unique identifier for the assignment subcategory (if applicable)
                                  example: null
                                start_time:
                                  type: string
                                  description: Start time of the assignment
                                  example: 7:30 AM
                                end_time:
                                  type: string
                                  description: End time of the assignment
                                  example: 3:30 PM
                                work_days:
                                  type: object
                                  description: Workdays for the assignment, where 0 represents Sunday and 6 represents Saturday
                                  properties:
                                    '0':
                                      type: boolean
                                      example: false
                                    '1':
                                      type: boolean
                                      example: true
                                    '2':
                                      type: boolean
                                      example: true
                                    '3':
                                      type: boolean
                                      example: true
                                    '4':
                                      type: boolean
                                      example: true
                                    '5':
                                      type: boolean
                                      example: true
                                    '6':
                                      type: boolean
                                      example: false
                                id:
                                  type: string
                                  description: Unique identifier for the assignment
                                  example: 6bf79bbe-2038-423f-8fee-f890abcbd929
                                created_at:
                                  type: string
                                  description: Timestamp of when the assignment was created (string format)
                                  example: 06/24/18
                                updated_at:
                                  type:
                                  - string
                                  - 'null'
                                  description: Timestamp of when the assignment was last updated (string format)
                                  example: null
                          timeoff:
                            type: array
                            description: List of time-off records for the person
                            items:
                              type: object
                              properties:
                                reason:
                                  type: string
                                  description: Reason for the time off
                                  example: family
                                is_paid:
                                  type: boolean
                                  description: Indicates whether the time off is paid
                                  example: true
                                repeat:
                                  type: string
                                  description: Recurrence pattern of the time off
                                  example: never
                                start_time:
                                  type: string
                                  description: Start time of the time-off period
                                  example: 7:00 AM
                                end_time:
                                  type: string
                                  description: End time of the time-off period
                                  example: 3:30 PM
                                start_day:
                                  type: string
                                  description: Start date of the time-off period (string format)
                                  example: 07/09/18
                                end_day:
                                  type: string
                                  description: End date of the time-off period (string format)
                                  example: 07/13/18
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid request parameters
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                    description: If you receive a 401 error, please ensure you are following the OAuth 2.0 guidelines outlined at https://developers.procore.com/documentation/introduction and verify you can successfully call the /me endpoint using your access token. Additionally, the user associated with that token must be added as a user in the Workforce Planning People List for the corresponding company.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Access denied
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Resource not found
