      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Requested Changes
      description: List all Requested Changes of a Task.
      x-deprecated-at: '2022-04-06'
      deprecated: true
      tags:
      - Requested Changes
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: task_id
        in: query
        description: The task for which all requested changes will be retrieved.
        required: false
        schema:
          type: integer
      - name: view
        in: query
        description: The `with_task` view includes an additional task data for correspondent requested changes
        schema:
          type: string
        required: false
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested_changes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Requested change id
                          example: 333713
                        requested_by:
                          type: string
                          description: Requested change requested by
                          example: Bob Dole on Nov. 24
                        change_requested:
                          type: string
                          description: Requested change
                          example: '<ul><li>Other change: why7</li></ul>'
                        reason:
                          type: string
                          description: Requested change reason
                          example: <p>this is a description</p>
                        status:
                          type: string
                          description: Requested change status localized
                          enum:
                          - Approved
                          - Rejected
                          - Pending
                          example: Pending
                        status_not_localized:
                          type: string
                          description: Requested change status not localized
                          enum:
                          - approved
                          - rejected
                          - pending
                          example: pending
                        notes:
                          type: string
                          description: Requested change notes
                          example: Notes
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
