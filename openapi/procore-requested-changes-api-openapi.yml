                          example: '2022-02-15'
                        percentage:
                          type: integer
                          description: Requested change percentage
                          example: 50
                    notes:
                      type: string
                      description: Requested change notes
                      example: Delayed due to weather
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Requested change id
                    example: 333713
                  change_requested:
                    type: string
                    description: Requested change
                    example: '<ul><li>Other change: why7</li></ul>'
                  created_by:
                    type: object
                    properties:
                      id:
