                    - 'null'
                    format: date
                    description: Requested change finish date
                    example: '2022-03-04T00:00:00Z'
                  new_start:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Requested change start date
                    example: '2022-01-31T00:00:00Z'
                  new_percentage:
                    type:
                    - integer
                    - 'null'
                    description: Requested change percentage
                    example: 50
                  old_finish:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Current finish date
                    example: '2022-03-04T00:00:00Z'
                  old_start:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Current start date
                    example: '2022-01-31T00:00:00Z'
                  old_percentage:
                    type:
                    - integer
                    - 'null'
                    description: Current percentage
                    example: 50
                  other_change:
                    type: string
                    description: Other change
                    example: Add as milestone
                  reason:
                    type:
                    - string
                    - 'null'
                    description: Requested change reason
                    example: <p>this is a description</p>
                  status:
                    type: string
                    description: Localized requested change status
                    example: Pending
                  status_not_localized:
                    type: string
                    description: Requested change status not localized
                    enum:
                    - approved
                    - rejected
                    - pending
                    example: pending
                  notes:
                    type:
                    - string
                    - 'null'
                    description: Requested change notes
                    example: Notes
                  created_at:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Requested change created date
                    example: '2022-03-04T00:00:00Z'
