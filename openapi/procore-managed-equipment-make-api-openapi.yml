      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      deprecated: true
      x-deprecated-at: '2024-12-01'
      x-sunset: '2025-12-02'
      summary: List all equipment makes
      description: Return a list of all equipment makes.
      tags:
      - Managed Equipment Make
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of managed equipment makes
                items:
                  type: object
                  title: ManagedEquipmentMake
                  description: Equipment Make
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of this equipment make.
                      example: 75414
                    name:
                      type: string
                      description: Display name of the equipment make (manufacturer brand), unique within the company.
                      example: CAT
                    company_id:
                      type: integer
                      description: Identifier of the company that owns this equipment make.
                      example: 3355
                    is_active:
                      type: boolean
                      description: Whether this equipment make is currently active. Inactive makes are hidden from selection lists but retained for historical records.
                      example: true
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp of the last update to this record, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this record was created, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when this record was soft-deleted, in ISO 8601 format. Null if the record is active.
                      example: '2015-11-12T21:26:28Z'
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user who created this make.
                          example: 160586
                        login:
                          type: string
                          description: Email address (login) of the user who created this make.
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Full name of the user who created this make.
                          example: Carl Contractor
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
