openapi: 3.2.0
info:
  title: Procore REST External RFIs API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: External RFIs
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/external_rfis:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: List External RFIs
      description: 'Returns all External RFIs in the specified Project.

        See Filtering on List Actions for information on using the filtering capabilities provided by this endpoint.'
      tags:
      - External RFIs
      parameters:
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: filters[sync_status]
        in: query
        description: Return item(s) with the specified External RFI Sync Status.
        required: false
        schema:
          type: string
          enum:
          - in_sync
          - out_of_sync
          - deleted
      - name: filters[connection_status]
        in: query
        description: Return item(s) with the specified External RFI Connection Status.
        required: false
        schema:
          type: string
          enum:
          - connected
          - disconnected
      - name: filters[rfi_manager_id]
        in: query
        description: Returns item(s) with the specified External RFI's Manager ID.
        required: false
        schema:
          type: string
      - name: filters[responsible_contractor_id]
        in: query
        description: Returns item(s) with the specified External RFI's Responsible Contractor ID.
        required: false
        schema:
          type: string
      - name: filters[received_from_id]
        in: query
        description: Returns item(s) with the specified External RFI's Received From ID.
        required: false
        schema:
          type: string
      - name: filters[due_date]
        in: query
        description: 'Return item(s) that are due within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          title: range
          example: 2026-07-01...2026-07-31
      - name: filters[time_resolved]
        in: query
        description: 'Return item(s) that are due within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          title: range
          example: 2026-07-01T00:00:00Z...2026-07-31T23:59:59Z
      - name: filters[initiated_at]
        in: query
        description: 'Return item(s) that were Initiated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          title: range
          example: 2026-07-01T00:00:00Z...2026-07-31T23:59:59Z
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: sort
        in: query
        description: 'Field to sort the External Rfi list by. If the field is passed with a prefixed ''-'' (Example: -position) it will be sorted in reverse order.'
        required: false
        schema:
          type: string
          enum:
          - position
          - subject
          - updated_at
          - created_at
          - due_date
          - initiated_at
          - rfi_manager_id
          - received_from_id
          - responsible_contractor_id
          - time_resolved
          - private
          - status
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            description: Unique string identifier for this external RFI.
                            example: '999'
                          last_updated_at:
                            type: string
                            description: Timestamp of the most recent update, in ISO 8601 format.
                            format: date-time
                            example: '2017-08-23T15:23:57Z'
                          subject:
                            type: string
                            description: Subject line of the external RFI.
                            example: Specifications [99 14.44B]
                          position:
                            type: string
                            description: Sequential position number within the project.
                            example: '4'
                          revision:
                            type: string
                            description: Revision counter. Increments each time a new revision is created.
                            example: '5'
                          current_revision:
                            type: boolean
                            description: When `true`, this record is the most recent revision of the RFI.
                            example: true
                          has_revisions:
                            type: boolean
                            description: When `true`, this RFI has one or more prior revisions.
                            example: true
                          private:
                            type: boolean
                            description: When `true`, visible only to admin-level users.
                            example: true
                          full_position:
                            type: string
                            description: Position number prefixed with the project identifier (e.g. `PRE-1`).
                            example: PRE-1
                          sync_status:
                            type: string
                            description: Synchronization state of the External RFI. Returns `private` when the origin RFI is private and unavailable to the current project.
                            example: in_sync
                            enum:
                            - in_sync
                            - private
                          origin_rfi_id:
                            type:
                            - string
                            - 'null'
                            description: ID of the RFI in the origin project, or null until the origin ID is available.
                            example: '12345'
                          origin_project_id:
                            type: string
                            description: ID of the project that owns the origin RFI.
                            example: '42'
                          origin_company_id:
                            type:
                            - string
                            - 'null'
                            description: ID of the company that owns the origin project, or null when connection data is unavailable.
                            example: '7'
                          created_by:
                            type: object
                            description: Contact who originally created this external RFI.
                            properties:
                              id:
                                type: string
                                description: Unique string identifier of the contact record.
                                example: '161072'
                              name:
                                type:
                                - string
                                - 'null'
                                description: Full display name of the contact.
                                example: Carl the Contractor
                          responsible_contractor:
                            type:
                            - object
                            - 'null'
                            description: Vendor designated as the party responsible for responding to this RFI.
                            properties:
                              id:
                                type: string
                                description: Unique string identifier of the vendor.
                                example: '161072'
                              name:
                                type: string
                                description: Display name of the responsible contractor vendor.
                                example: SID Architecture
                          status:
                            type: string
                            description: Lifecycle status of the external RFI. Recycled variants (e.g. `open_recycled`) appear when the RFI is in the recycle bin.
                            example: open
                            enum:
                            - open
                            - open_recycled
                            - closed
                            - closed_recycled
                            - draft
                            - draft_recycled
                            - closed_draft
                            - closed_draft_recycled
                            - closed_with_revision
                            - closed_with_revision_recycled
                          due_date:
                            type:
                            - string
                            - 'null'
                            description: Response due date in `YYYY-MM-DD` format. Null if not set.
                            format: date
                            example: '2017-01-18'
                          rfi_manager:
                            type: object
                            description: Contact assigned as manager of this external RFI.
                            properties:
                              id:
                                type: string
                                description: Unique string identifier of the contact record.
                                example: '161072'
                              name:
                                type:
                                - string
                                - 'null'
                                description: Full display name of the contact.
                                example: Carl the Contractor
                          received_from:
                            type:
                            - object
                            - 'null'
                            description: Contact who submitted or originated this external RFI.
                            properties:
                              id:
                                type: string
                                description: Unique string identifier of the contact record.
                                example: '161072'
                              name:
                                type:
                                - string
                                - 'null'
                                description: Full display name of the contact.
                                example: Carl the Contractor
                          initiated_at:
                            type:
                            - string
                            - 'null'
                            description: Timestamp when the RFI was opened/initiated, in ISO 8601 format. Null for draft external RFIs.
                            format: date-time
                            example: '2016-08-23T15:23:57Z'
                          time_resolved:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: Timestamp when the RFI was closed, in ISO 8601 format. Null if still open.
                            example: '2017-01-12T17:09:15Z'
                          project_connection:
                            type:
                            - object
                            - 'null'
                            description: Details of the upstream project this external RFI is connected to. Null if not connected.
                            properties:
                              upstream_project_name:
                                type: string
                                description: Display name of the upstream (GC) project.
                                example: Carpinteria Head Quarters
                              upstream_company_name:
                                type: string
                                description: Display name of the company that owns the upstream project.
                                example: Procore Construction
                              upstream_project_id:
                                type: string
                                description: Unique string identifier of the upstream project.
                                example: '42'
                              upstream_company_id:
                                type: string
                                description: Unique string identifier of the company that owns the upstream project.
                                example: '7'
                          connection_status:
                            type: string
                            description: Whether this external RFI is actively connected to a local RFI. One of `connected` or `disconnected`.
                            example: connected
                            enum:
                            - connected
                            - disconnected
                          download_external_rfi_and_responses_attachments_url:
                            type:
                            - string
                            - 'null'
                            description: URL to download a zip of all attachments across this external RFI and its responses. Null if no attachments exist.
                            example: http://www.example.com/download/all
                          download_pdf_export_url:
                            type:
                            - string
                            - 'null'
                            description: URL to download the most recent PDF export for this external RFI. Null if no export has been generated.
                            example: http://www.example.com/download
                          linked_local_rfis:
                            type: array
                            description: Local RFIs linked to this external RFI.
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Unique string identifier of the linked local RFI.
                                  example: '55'
                                status:
                                  type: string
                                  description: Current lifecycle status of the linked local RFI.
                                  example: open
                                formatted_name:
                                  type: string
                                  description: Human-readable display name of the linked local RFI.
                                  example: RFI-001 — Confirm spec material
                          cross_collab_originated:
                            type: boolean
                            description: When `true`, this external RFI was created via cross-company collaboration export.
                            example: false
                          origin_rfi_url:
                            type:
                            - string
                            - 'null'
                            description: URL to the originating RFI in the upstream project. Null if no origin RFI or URL is unavailable.
                            example: https://app.procore.com/123/project/rfi/show/456
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[sync_status]': 'SOME_STRING_VALUE',\n    'filters[connection_status]': 'SOME_STRING_VALUE',\n    'filters[rfi_manager_id]': 'SOME_STRING_VALUE',\n    'filters[responsible_contractor_id]': 'SOME_STRING_VALUE',\n    'filters[received_from_id]': 'SOME_STRING_VALUE',\n    'filters[due_date]': '2026-07-01...2026-07-31',\n    'filters[time_resolved]': '2026-07-01T00:00:00Z...2026-07-31T23:59:59Z',\n    'filters[initiated_at]': '2026-07-01T00:00:00Z...2026-07-31T23:59:59Z',\n    'filters[updated_at]': 'SOME_STRING_VALUE',\n    sort: 'SOME_STRING_VALUE'\n  },\n  headers: {Authorization: 'Bearer REPLACE_BEARER_TOKEN'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Authorization'': "Bearer REPLACE_BEARER_TOKEN" }


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bsync_status%5D=SOME_STRING_VALUE&filters%5Bconnection_status%5D=SOME_STRING_VALUE&filters%5Brfi_manager_id%5D=SOME_STRING_VALUE&filters%5Bresponsible_contractor_id%5D=SOME_STRING_VALUE&filters%5Breceived_from_id%5D=SOME_STRING_VALUE&filters%5Bdue_date%5D=2026-07-01...2026-07-31&filters%5Btime_resolved%5D=2026-07-01T00%3A00%3A00Z...2026-07-31T23%3A59%3A59Z&filters%5Binitiated_at%5D=2026-07-01T00%3A00%3A00Z...2026-07-31T23%3A59%3A59Z&filters%5Bupdated_at%5D=SOME_STRING_VALUE&sort=SOME_STRING_VALUE", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bsync_status%5D=SOME_STRING_VALUE&filters%5Bconnection_status%5D=SOME_STRING_VALUE&filters%5Brfi_manager_id%5D=SOME_STRING_VALUE&filters%5Bresponsible_contractor_id%5D=SOME_STRING_VALUE&filters%5Breceived_from_id%5D=SOME_STRING_VALUE&filters%5Bdue_date%5D=2026-07-01...2026-07-31&filters%5Btime_resolved%5D=2026-07-01T00%3A00%3A00Z...2026-07-31T23%3A59%3A59Z&filters%5Binitiated_at%5D=2026-07-01T00%3A00%3A00Z...2026-07-31T23%3A59%3A59Z&filters%5Bupdated_at%5D=SOME_STRING_VALUE&sort=SOME_STRING_VALUE' \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/external_rfis?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bsync_status%5D=SOME_STRING_VALUE&filters%5Bconnection_status%5D=SOME_STRING_VALUE&filters%5Brfi_manager_id%5D=SOME_STRING_VALUE&filters%5Bresponsible_contractor_id%5D=SOME_STRING_VALUE&filters%5Breceived_from_id%5D=SOME_STRING_VALUE&filters%5Bdue_date%5D=2026-07-01...2026-07-31&filters%5Btime_resolved%5D=2026-07-01T00%3A00%3A00Z...2026-07-31T23%3A59%3A59Z&filters%5Binitiated_at%5D=2026-07-01T00%3A00%3A00Z...2026-07-31T23%3A59%3A59Z&filters%5Bupdated_at%5D=SOME_STRING_VALUE&sort=SOME_STRING_VALUE\"),\n    Headers =\n    {\n        { \"Authorization\", \"Bearer REPLACE_BEARER_TOKEN\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Introduced Public API endpoints for External RFIs
        description: 'Introduced the following Public API endpoints for External RFIs:

          - GET /companies/{company_id}/projects/{project_id}/external_rfis (List External RFIs)

          - GET /companies/{company_id}/projects/{project_id}/external_rfis/{id} (Show External RFI)

          - GET /companies/{company_id}/projects/{project_id}/external_rfis/{id}/revisions (List External RFI Revisions)

          - PATCH /companies/{company_id}/projects/{project_id}/external_rfis/{id}/linked_local_rfis (Update Linked Local RFIs for an External RFI)

          - GET /companies/{company_id}/projects/{project_id}/external_rfis/{id}/download_external_rfi_and_responses_attachments (Download External RFI and Responses Attachments)

          - GET /companies/{company_id}/projects/{project_id}/external_rfis/{external_rfi_id}/advanced_exports (Show Advanced Export Options for External RFI)

          - GET /companies/{company_id}/projects/{project_id}/external_rfis/{external_rfi_id}/external_rfi_pdf_exports/{id}/download (Download External RFI PDF Export)'
        endpoint: GET /companies/{company_id}/projects/{project_id}/external_rfis
        type: feature
        breaking: false
        datestamp: '2026-07-21'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: beta
          exposure: public
        link: external-rfi?version=2.0#list-external-rfis
      - summary: Documented recycled External RFI status values
        description: The List External RFIs response documentation now includes the existing `_recycled` status variants returned when an upstream RFI is in the recycle bin. Generated clients should handle these variants, and integrations should tolerate unknown future status values.
        endpoint: GET /companies/{company_id}/projects/{project_id}/external_rfis
        type: refinement
        breaking: true
        datestamp: '2026-07-30'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: beta
          exposure: public
        link: external-rfi?version=2.0#list-external-rfis
      - summary: Corrected the documented External RFI list response
        description: The List External RFIs response documentation now matches the existing runtime payload for synchronization state, origin RFI/project/company IDs, project connection IDs, linked local RFIs, cross-account origin state, and the origin RFI URL. Contact objects now list only the `id` and `name` fields returned by the API. Generated clients should handle the newly documented `private` synchronization state.
        endpoint: GET /companies/{company_id}/projects/{project_id}/external_rfis
        type: refinement
        breaking: true
        datestamp: '2026-07-30'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: beta
          exposure: public
        link: external-rfi?version=2.0#list-external-rfis
      operationId: listExternalRfis
  /rest/v2.0/companies/{company_id}/projects/{project_id}/external_rfis/{external_rfi_id}/advanced_exports:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: external_rfi_id
      in: path
      description: External RFI ID
      required: true
      schema:
        type: string
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Show Advanced Export Options for External RFI
      description: Returns the available advanced export configuration options for a specified External RFI, including cover sheet and file attachment selections.
      tags:
      - External RFIs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                          description: Unique identifier for the option set
                          example: cover_sheet
                        name:
                          type: string
                          description: Display name of the option set
                          example: Cover Sheet
                        type:
                          type: string
                          description: Selection type
                          enum:
                          - single_select
                          - multi_select
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Option identifier
                              name:
                                type: string
                                description: Display name of the option
                              content_type:
                                type: string
                                description: MIME content type (for file options)
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
