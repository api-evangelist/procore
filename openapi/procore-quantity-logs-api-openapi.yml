    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update Quantity Log
      description: 'Update single Quantity Log.


        #### See - Daily Log guide - for additional info on

        * Attachments

        * Locations'
      tags:
      - Quantity Logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity_log
              properties:
                quantity_log:
                  type: object
                  allOf:
                  - properties:
                      date:
                        type: string
                        format: date
                        description: 'Format: YYYY-MM-DD Example: 2016-04-19'
                        example: '2016-05-19'
                      description:
                        type: string
                        description: Description
                        example: Quantity amount was exact
                      quantity:
                        type: integer
                        description: Total number of the specified materials placed on the site that day
                        example: 4
                      unit:
                        type: string
                        description: Units that were delivered
                        example: '5'
                      cost_code_id:
                        type: integer
                        description: Cost Code ID
                        example: 24086477
                      location_id:
                        type: integer
                        description: The ID of the Location of the Quantity Log. `location_id` takes precedence over `mt_location`
                        example: 153252
                      mt_location:
                        type: array
                        description: Use this for creating a new multi-tier or single-tier Location. This will be ignored if `location_id` is provided.
                        example:
                        - 1space
                        items:
                          type: string
                          description: Look at Daily Log Guide for more info.
                      vendor_id:
                        type: integer
                        description: ID of the Vendor associated to the quantity log
                        example: 1120327
                      daily_log_segment_id:
                        type:
                        - integer
                        - 'null'
                        description: Daily Log Segment ID
                        example: 123456
                  - properties:
                      drawing_revision_ids:
                        type: array
                        description: Drawing Revisions to attach to the response
                        items:
                          type: integer
                        example:
                        - 4
                        - 5
                      file_version_ids:
                        type: array
                        description: File Versions to attach to the response
                        items:
                          type: integer
                        example:
                        - 6
                        - 7
                      form_ids:
                        type: array
                        description: Forms to attach to the response
                        items:
                          type: integer
                        example:
                        - 7
                        - 8
                      image_ids:
                        type: array
                        description: Images to attach to the response
                        items:
                          type: integer
                        example:
                        - 9
                        - 10
                      upload_ids:
                        type: array
                        description: Uploads to attach to the response
                        items:
                          type: string
                        example:
                        - 4120226e-36a8-416f-970e-880bae78164f
                        - de07e35a-4860-4f96-acd8-8360833dc495
                      document_management_document_revision_ids:
                        type: array
                        description: PDM document to attach to the response
                        items:
                          type: string
                        example:
                        - 01JC3TZNKJK6121Z1A2V7G574Q
                        - 01JC3TZPXCJMC6P88CHHD6PTZ9
          multipart/form-data:
            schema:
              type: object
              required:
              - quantity_log
              properties:
                quantity_log:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                      description: 'Format: YYYY-MM-DD Example: 2016-04-19'
                      example: '2016-05-19'
                    description:
                      type: string
                      description: Description
                      example: Quantity amount was exact
                    quantity:
                      type: integer
                      description: Total number of the specified materials placed on the site that day
                      example: 4
                    unit:
                      type: string
                      description: Units that were delivered
                      example: '5'
                    cost_code_id:
                      type: integer
                      description: Cost Code ID
                      example: 24086477
                    location_id:
                      type: integer
                      description: The ID of the Location of the Quantity Log. `location_id` takes precedence over `mt_location`
                      example: 153252
                    mt_location:
                      type: array
                      description: Use this for creating a new multi-tier or single-tier Location. This will be ignored if `location_id` is provided.
                      example:
                      - 1space
                      items:
                        type: string
                        description: Look at Daily Log Guide for more info.
                    vendor_id:
                      type: integer
                      description: ID of the Vendor associated to the quantity log
                      example: 1120327
                    daily_log_segment_id:
                      type:
                      - integer
                      - 'null'
                      description: Daily Log Segment ID
                      example: 123456
                attachments:
                  type: array
                  description: Quantity Log Attachments. To upload attachments you must upload the entire payload as `multipart/form-data` content-type and specify each parameter as form-data together with `attachments[]` as files.
                  items:
                    type: string
                    description: Look at Daily Log Guide for more info.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the Quantity Log.
                    example: 333675
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when the Quantity Log was created.
                    example: '2012-10-23T21:39:40Z'
                  date:
                    type: string
                    format: date
                    description: Date of record.
                    example: '2016-05-19'
                  datetime:
                    type: string
                    format: date-time
                    description: Estimated UTC datetime of record
                    example: '2016-05-19T12:00:00Z'
                  description:
                    type: string
                    description: Description of the quantity entry.
                    example: Quantity amount was exact
                  position:
                    type: integer
                    description: Order in which this entry was recorded for the day
                    example: 11241
                  quantity:
                    type: integer
                    description: Total number of the specified materials placed on the site that day
                    example: 4
                  unit:
                    type: string
                    description: Units that were delivered
                    example: '5'
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when the Quantity Log was last updated.
                    example: '2012-10-24T21:39:40Z'
                  cost_code:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 12345
                      name:
                        type: string
                        description: Name
                        example: Earthwork
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 160586
                      login:
                        type: string
                        description: Email
                        example: carl.contractor@example.com
                      name:
                        type: string
                        description: Name
                        example: Carl Contractor
                  location:
                    type: object
                    title: Location
                    properties:
                      id:
                        type: integer
                        description: Location ID
                        example: 15504
                      name:
                        type: string
                        description: Location name
                        example: 1space>1 space
                      node_name:
                        type: string
                        description: Location node name
                        example: 1 space
                      parent_id:
                        type: integer
                        description: Location parent id
                        example: 788866
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp of Location creation
                        example: '2016-08-01T23:33:54Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp of last update to Location
                        example: '2016-08-01T23:33:54Z'
                  vendor:
                    type: object
                    title: Compact
                    properties:
                      id:
                        type: integer
                        description: Unique integer identifier for this vendor/company.
                        example: 161072
                      name:
                        type: string
                        description: Display name of the vendor or contractor company.
                        example: SID Architecture
                  attachments:
                    type: array
                    description: Quantity Log Attachments
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: Use :name, :filename to be deprecated
                        url:
                          type: string
                        filename:
                          type: string
                          description: :filename to be deprecated, use :name
                  daily_log_segment_id:
                    type:
                    - integer
                    - 'null'
                    description: Daily Log Segment ID
                    example: 123456
                  daily_log_segment:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 123456
                      name:
                        type: string
                        description: Name of the segment
                        example: Morning Shift
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the segment
                        example: Work performed during the morning shift
                      deleted_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Timestamp when the segment was soft deleted
                        example: '2025-01-15T10:30:00Z'
                      deleted:
                        type: boolean
                        description: Indicates if the segment is deleted
                        example: false
                  deleted_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Timestamp when the Quantity Log was deleted; null if not deleted.
                    example: '2016-05-20T12:00:00Z'
                  status:
                    type: string
                    description: Approval state of the log.
                    enum:
                    - approved
                    - pending
                    - rejected
                    example: approved
                  created_by_collaborator:
                    type: boolean
                    description: Whether this log was created by a collaborator.
                    example: false
                  custom_fields:
                    type: object
                    properties:
                      custom_field_%{custom_field_string_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: Data type of the Custom Field Definition
                            example: string
                          value:
                            type: string
                            description: The value of the custom field
                            example: custom field value
                          variant:
                            type: string
                            description: The variant of the Custom Field Definition (e.g. `phone_number`). Present only when the definition has an associated variant.
                            example: phone_number
                      custom_field_%{custom_field_decimal_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: Data type of the Custom Field Definition
                            example: decimal
                          value:
                            type: number
                            description: The value of the custom field
                            example: 2.2
                      custom_field_%{custom_field_boolean_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: Data type of the Custom Field Definition
                            example: boolean
                          value:
                            type: boolean
                            description: The value of the custom field
                            example: true
                      custom_field_%{custom_field_lov_entry_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: Data type of the Custom Field Definition
                            example: lov_entry
                          value:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: ID of the LOV Entry
                                example: 1
                              label:
                                type: string
                                description: Label of the LOV Entry
                                example: Open
                          variant:
                            type: string
                            description: The variant of the Custom Field Definition (e.g. `project_directory`). Present only when the definition has an associated variant.
                            example: with_code
                      custom_field_%{custom_field_lov_entries_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: Data type of the Custom Field Definition
                            example: lov_entries
