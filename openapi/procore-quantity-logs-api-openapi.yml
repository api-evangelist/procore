openapi: 3.2.0
info:
  title: Procore REST Quantity Logs API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Quantity Logs
paths:
  /rest/v1.0/projects/{project_id}/quantity_logs:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Quantity Logs
      description: 'Returns all Quantity Logs for the current date.


        See Working with Daily Logs for information on filtering the response using the log\_date, start\_date, and end\_date parameters. Note that if none of the date parameters are provided in the call, only logs from the current date are returned.'
      tags:
      - Quantity Logs
      parameters:
      - name: log_date
        in: query
        description: Date of specific logs desired in YYYY-MM-DD format
        schema:
          type: string
          format: date
      - name: start_date
        in: query
        description: Start date of specific logs desired in YYYY-MM-DD format (use together with end_date)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: End date of specific logs desired in YYYY-MM-DD format (use together with start_date)
        schema:
          type: string
          format: date
      - name: filters[created_by_id]
        in: query
        description: Returns item(s) created by the specified User IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[location_id]
        in: query
        description: Return item(s) with the specified Location IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - example:
        - 123456
        name: filters[daily_log_segment_id]
        in: query
        description: Daily Log Segment ID filter
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the Quantity Log.
                      example: 333675
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the Quantity Log was created.
                      example: '2012-10-23T21:39:40Z'
                    date:
                      type: string
                      format: date
                      description: Date of record.
                      example: '2016-05-19'
                    datetime:
                      type: string
                      format: date-time
                      description: Estimated UTC datetime of record
                      example: '2016-05-19T12:00:00Z'
                    description:
                      type: string
                      description: Description of the quantity entry.
                      example: Quantity amount was exact
                    position:
                      type: integer
                      description: Order in which this entry was recorded for the day
                      example: 11241
                    quantity:
                      type: integer
                      description: Total number of the specified materials placed on the site that day
                      example: 4
                    unit:
                      type: string
                      description: Units that were delivered
                      example: '5'
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when the Quantity Log was last updated.
                      example: '2012-10-24T21:39:40Z'
                    cost_code:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 12345
                        name:
                          type: string
                          description: Name
                          example: Earthwork
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    location:
                      type: object
                      title: Location
                      properties:
                        id:
                          type: integer
                          description: Location ID
                          example: 15504
                        name:
                          type: string
                          description: Location name
                          example: 1space>1 space
                        node_name:
                          type: string
                          description: Location node name
                          example: 1 space
                        parent_id:
                          type: integer
                          description: Location parent id
                          example: 788866
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp of Location creation
                          example: '2016-08-01T23:33:54Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp of last update to Location
                          example: '2016-08-01T23:33:54Z'
                    vendor:
                      type: object
                      title: Compact
                      properties:
                        id:
                          type: integer
                          description: Unique integer identifier for this vendor/company.
                          example: 161072
                        name:
                          type: string
                          description: Display name of the vendor or contractor company.
                          example: SID Architecture
                    attachments:
                      type: array
                      description: Quantity Log Attachments
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                            description: Use :name, :filename to be deprecated
                          url:
                            type: string
                          filename:
                            type: string
                            description: :filename to be deprecated, use :name
                    daily_log_segment_id:
                      type:
                      - integer
                      - 'null'
                      description: Daily Log Segment ID
                      example: 123456
                    daily_log_segment:
                      type:
                      - object
                      - 'null'
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 123456
                        name:
                          type: string
                          description: Name of the segment
                          example: Morning Shift
                        description:
                          type:
                          - string
                          - 'null'
                          description: Description of the segment
                          example: Work performed during the morning shift
                        deleted_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Timestamp when the segment was soft deleted
                          example: '2025-01-15T10:30:00Z'
                        deleted:
                          type: boolean
                          description: Indicates if the segment is deleted
                          example: false
                    deleted_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: Timestamp when the Quantity Log was deleted; null if not deleted.
                      example: '2016-05-20T12:00:00Z'
                    status:
                      type: string
                      description: Approval state of the log.
                      enum:
                      - approved
                      - pending
                      - rejected
                      example: approved
                    created_by_collaborator:
                      type: boolean
                      description: Whether this log was created by a collaborator.
                      example: false
                    custom_fields:
                      type: object
                      properties:
                        custom_field_%{custom_field_string_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: string
                            value:
                              type: string
                              description: The value of the custom field
                              example: custom field value
                            variant:
                              type: string
                              description: The variant of the Custom Field Definition (e.g. `phone_number`). Present only when the definition has an associated variant.
                              example: phone_number
                        custom_field_%{custom_field_decimal_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: decimal
                            value:
                              type: number
                              description: The value of the custom field
                              example: 2.2
                        custom_field_%{custom_field_boolean_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: boolean
                            value:
                              type: boolean
                              description: The value of the custom field
                              example: true
                        custom_field_%{custom_field_lov_entry_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: lov_entry
                            value:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: ID of the LOV Entry
                                  example: 1
                                label:
                                  type: string
                                  description: Label of the LOV Entry
                                  example: Open
                            variant:
                              type: string
                              description: The variant of the Custom Field Definition (e.g. `project_directory`). Present only when the definition has an associated variant.
                              example: with_code
                        custom_field_%{custom_field_lov_entries_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: Data type of the Custom Field Definition
                              example: lov_entries
                            value:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID of the LOV Entry
                                    example: 2
                                  label:
                                    type: string
                                    description: Label of the LOV Entry
                                    example: Open
                    permissions:
                      type: object
                      description: TBD
                      properties:
                        can_update:
                          type: boolean
                          description: Can Update
                          example: true
                        can_delete:
                          type: boolean
                          description: Can Delete
                          example: false
        '403':
          description: User does not have right permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/quantity_logs',\n  qs: {\n    log_date: 'SOME_STRING_VALUE',\n    start_date: 'SOME_STRING_VALUE',\n    end_date: 'SOME_STRING_VALUE',\n    'filters[created_by_id]': 'SOME_ARRAY_VALUE',\n    'filters[location_id]': 'SOME_ARRAY_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[daily_log_segment_id]': '123456'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/quantity_logs?log_date=SOME_STRING_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Blocation_id%5D=SOME_ARRAY_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bdaily_log_segment_id%5D=123456")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/quantity_logs?log_date=SOME_STRING_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Blocation_id%5D=SOME_ARRAY_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bdaily_log_segment_id%5D=123456'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/quantity_logs?log_date=SOME_STRING_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&filters%5Bcreated_by_id%5D=SOME_ARRAY_VALUE&filters%5Blocation_id%5D=SOME_ARRAY_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bdaily_log_segment_id%5D=123456\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
