                        description: Timestamp of last update to Location
                        example: '2016-08-01T23:33:54Z'
                  vendor:
                    type: object
                    title: Compact
                    properties:
                      id:
                        type: integer
                        description: Unique integer identifier for this vendor/company.
                        example: 161072
                      name:
                        type: string
                        description: Display name of the vendor or contractor company.
                        example: SID Architecture
                  attachments:
                    type: array
                    description: Quantity Log Attachments
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: Use :name, :filename to be deprecated
                        url:
                          type: string
                        filename:
                          type: string
                          description: :filename to be deprecated, use :name
                  daily_log_segment_id:
                    type:
                    - integer
                    - 'null'
                    description: Daily Log Segment ID
                    example: 123456
                  daily_log_segment:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 123456
                      name:
                        type: string
                        description: Name of the segment
                        example: Morning Shift
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the segment
                        example: Work performed during the morning shift
                      deleted_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Timestamp when the segment was soft deleted
                        example: '2025-01-15T10:30:00Z'
                      deleted:
                        type: boolean
                        description: Indicates if the segment is deleted
                        example: false
                  deleted_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Timestamp when the Quantity Log was deleted; null if not deleted.
                    example: '2016-05-20T12:00:00Z'
                  status:
                    type: string
                    description: Approval state of the log.
                    enum:
                    - approved
                    - pending
                    - rejected
                    example: approved
                  created_by_collaborator:
                    type: boolean
                    description: Whether this log was created by a collaborator.
                    example: false
                  custom_fields:
                    type: object
                    properties:
                      custom_field_%{custom_field_string_definition_id}:
                        type: object
                        properties:
                          data_type:
                            type: string
                            description: Data type of the Custom Field Definition
                            example: string
                          value:
                            type: string
                            description: The value of the custom field
                            example: custom field value
                          variant:
                            type: string
