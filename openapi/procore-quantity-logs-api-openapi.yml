    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Quantity Log
      description: 'Creates single Quantity Log.


        #### See - Daily Log guide - for additional info on

        * Attachments

        * Locations'
      tags:
      - Quantity Logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quantity_log
              properties:
                quantity_log:
                  type: object
                  allOf:
                  - properties:
                      date:
                        type: string
                        format: date
                        description: 'Format: YYYY-MM-DD Example: 2016-04-19'
                        example: '2016-05-19'
                      description:
                        type: string
                        description: Description
                        example: Quantity amount was exact
                      quantity:
                        type: integer
                        description: Total number of the specified materials placed on the site that day
                        example: 4
                      unit:
                        type: string
                        description: Units that were delivered
                        example: '5'
                      cost_code_id:
                        type: integer
                        description: Cost Code ID
                        example: 24086477
                      location_id:
                        type: integer
                        description: The ID of the Location of the Quantity Log. `location_id` takes precedence over `mt_location`
                        example: 153252
                      mt_location:
                        type: array
                        description: Use this for creating a new multi-tier or single-tier Location. This will be ignored if `location_id` is provided.
                        example:
                        - 1space
                        items:
                          type: string
                          description: Look at Daily Log Guide for more info.
                      vendor_id:
                        type: integer
                        description: ID of the Vendor associated to the quantity log
                        example: 1120327
                      daily_log_segment_id:
                        type:
                        - integer
                        - 'null'
                        description: Daily Log Segment ID
                        example: 123456
                  - properties:
                      drawing_revision_ids:
                        type: array
                        description: Drawing Revisions to attach to the response
                        items:
                          type: integer
                        example:
                        - 4
                        - 5
                      file_version_ids:
                        type: array
                        description: File Versions to attach to the response
                        items:
                          type: integer
                        example:
                        - 6
                        - 7
                      form_ids:
                        type: array
                        description: Forms to attach to the response
                        items:
                          type: integer
                        example:
                        - 7
                        - 8
                      image_ids:
                        type: array
                        description: Images to attach to the response
                        items:
                          type: integer
                        example:
                        - 9
                        - 10
                      upload_ids:
                        type: array
                        description: Uploads to attach to the response
                        items:
                          type: string
                        example:
                        - 4120226e-36a8-416f-970e-880bae78164f
                        - de07e35a-4860-4f96-acd8-8360833dc495
                      document_management_document_revision_ids:
                        type: array
                        description: PDM document to attach to the response
                        items:
                          type: string
                        example:
                        - 01JC3TZNKJK6121Z1A2V7G574Q
                        - 01JC3TZPXCJMC6P88CHHD6PTZ9
          multipart/form-data:
            schema:
              type: object
              required:
              - quantity_log
              properties:
                quantity_log:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                      description: 'Format: YYYY-MM-DD Example: 2016-04-19'
                      example: '2016-05-19'
                    description:
                      type: string
                      description: Description
                      example: Quantity amount was exact
                    quantity:
                      type: integer
                      description: Total number of the specified materials placed on the site that day
                      example: 4
                    unit:
                      type: string
                      description: Units that were delivered
                      example: '5'
                    cost_code_id:
                      type: integer
                      description: Cost Code ID
                      example: 24086477
                    location_id:
                      type: integer
                      description: The ID of the Location of the Quantity Log. `location_id` takes precedence over `mt_location`
                      example: 153252
                    mt_location:
                      type: array
                      description: Use this for creating a new multi-tier or single-tier Location. This will be ignored if `location_id` is provided.
                      example:
                      - 1space
                      items:
                        type: string
                        description: Look at Daily Log Guide for more info.
                    vendor_id:
                      type: integer
                      description: ID of the Vendor associated to the quantity log
                      example: 1120327
                    daily_log_segment_id:
                      type:
                      - integer
                      - 'null'
                      description: Daily Log Segment ID
                      example: 123456
                attachments:
                  type: array
                  description: Quantity Log Attachments. To upload attachments you must upload the entire payload as `multipart/form-data` content-type and specify each parameter as form-data together with `attachments[]` as files.
                  items:
                    type: string
                    description: Look at Daily Log Guide for more info.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
