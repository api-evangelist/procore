                                id:
                                  type: integer
                                  description: ID of the LOV Entry
                                  example: 2
                                label:
                                  type: string
                                  description: Label of the LOV Entry
                                  example: Open
                  permissions:
                    type: object
                    description: TBD
                    properties:
                      can_update:
                        type: boolean
                        description: Can Update
                        example: true
                      can_delete:
                        type: boolean
                        description: Can Delete
