                    example: 4
                  unit:
                    type: string
                    description: Units that were delivered
                    example: '5'
                  updated_at:
                    type: string
                    format: date-time
                    description: Timestamp when the Quantity Log was last updated.
                    example: '2012-10-24T21:39:40Z'
                  cost_code:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 12345
                      name:
                        type: string
                        description: Name
                        example: Earthwork
                  created_by:
                    type: object
                    properties:
                      id:
                        type: integer
