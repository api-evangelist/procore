  /rest/v2.0/companies/{company_id}/projects/{project_id}/workflows/instances/bulk_history:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: partial
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Bulk Project Workflowable Object Instance Histories
      description: 'Returns workflow instance histories for multiple workflowable objects in a single request, grouped by `item_id`. Each group contains the full ordered history for every workflow instance associated with that object.


        **Authorization:** The request fails with 403 if the requesting user cannot view the history of all workflow instances for any submitted `item_id`. Objects with no workflow instances return an empty `instances` array without causing an error.


        **Granular permissions:** Within each instance, history events are filtered to those the requesting user is permitted to see (full history, previous step only, or none).'
      tags:
      - Workflow Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool_type
              - item_ids
              properties:
                tool_type:
                  type: string
                  description: Workflowable tool type. Supports external name (preferred) and class name (compatibility).
                item_ids:
                  type: array
                  description: One or more workflowable object identifiers. All submitted identifiers must be accessible to the requesting user; if any identifier has hidden instances the request fails with 403.
                  items:
                    type: string
                filters:
                  type: object
                  properties:
                    activity_types:
                      type: array
                      description: Optional activity filter (`comments`, `attachments`). When present, **future step events are not included** (linear templates only).
                      items:
                        type: string
                        enum:
                        - comments
                        - attachments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Bulk workflow instance histories grouped by workflowable object identifier
                required:
                - data
                properties:
                  data:
                    type: array
                    description: List of workflowable objects and their corresponding workflow instance histories
                    items:
                      type: object
                      required:
                      - item_id
                      - instances
                      properties:
                        item_id:
                          type: string
                          description: The workflowable object identifier that was submitted in the request
                          example: '42'
                        instances:
                          type: array
                          description: Workflow instance histories for this workflowable object, ordered most-recent-first. Empty array when the object has no workflow instances.
                          items:
                            type: object
                            required:
                            - instance_id
                            - name
                            - format
                            - status
                            - started_at
                            - ended_at
                            - blocked_reason
                            - blocked_is_retriable
                            - current_step_index
                            - history
                            properties:
                              instance_id:
                                type: string
                                description: Unique identifier of the workflow instance
                                example: '42'
                              name:
                                type: string
                                description: Display name of the workflow template for this instance
                              format:
                                type: string
                                enum:
                                - diagram
                                - linear
                              status:
                                type:
                                - string
                                - 'null'
                                description: Status for the workflow instance
                                enum:
                                - blocked
                                - overdue
                                - warning
                                - in_progress
                                - complete
                                - processing
                                - terminated
                              started_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: Timestamp when the workflow instance was started
                                example: '2024-01-15T10:00:00Z'
                              ended_at:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: Timestamp when the workflow instance ended
                                example: '2024-01-15T12:00:00Z'
                              blocked_reason:
                                type:
                                - string
                                - 'null'
                              blocked_is_retriable:
                                type: boolean
                                description: True when a blocked instance may recover via an instance refresh.
                              blocked_learn_more_url:
                                type:
                                - string
                                - 'null'
                                description: Optional support URL for additional guidance. Null when the instance is not blocked.
                                example: https://support.procore.com/products/online/user-guide/project-level/project-overview/tutorials/manage-project-team-roles-from-the-project-overview
                              history:
                                type: array
                                description: Ordered list of history events for this workflow instance
                                items:
                                  oneOf:
                                  - type: object
                                    description: Workflow started event
                                    properties:
                                      type:
                                        type: string
                                        description: The type of history event
                                        example: WorkflowStarted
                                        enum:
                                        - WorkflowStarted
                                      details:
                                        type: object
                                        description: Details of the workflow started event
                                        properties:
                                          started_at:
                                            type: string
                                            format: date-time
                                            description: Timestamp when the workflow was started
                                            example: '2024-01-15T10:00:00Z'
                                  - type: object
                                    description: Workflow terminated event
                                    properties:
                                      type:
                                        type: string
                                        description: The type of history event
                                        example: WorkflowTerminated
                                        enum:
                                        - WorkflowTerminated
                                      details:
                                        type: object
                                        description: Details of the workflow terminated event
                                        properties:
                                          name:
                                            type: string
                                            description: Name of the workflow instance
                                            example: Bulk Assignee Update
                                          terminated_at:
                                            type: string
                                            format: date-time
                                            description: Timestamp when the workflow was terminated
                                            example: '2024-01-15T10:30:00Z'
                                          terminated_by:
                                            type: object
                                            description: User who terminated the workflow instance, when available
