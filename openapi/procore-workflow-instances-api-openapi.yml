        title: Curl
        content: "curl --request POST \\\n  --url https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/workflows/instances \\\n  --header 'content-type: application/json' \\\n  --data '{\"tool_type\":\"generic_tool_item\",\"tool_subtype\":\"-123\",\"item_id\":\"483\",\"template_id\":\"534\",\"preset_id\":\"876\"}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/workflows/instances\"),\n    Content = new StringContent(\"{\\\"tool_type\\\":\\\"generic_tool_item\\\",\\\"tool_subtype\\\":\\\"-123\\\",\\\"item_id\\\":\\\"483\\\",\\\"template_id\\\":\\\"534\\\",\\\"preset_id\\\":\\\"876\\\"}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
