                                          description: Unique identifier for this assignee response
                                        response_id:
                                          type:
                                          - string
                                          - 'null'
                                          description: Unique identifier for this response option
                                        login:
                                          type:
                                          - string
                                          - 'null'
                                          description: Email/login of the assignee
                                        name:
                                          type:
                                          - string
                                          - 'null'
                                          description: Full name of the assignee
                                        response:
                                          type:
                                          - string
                                          - 'null'
                                          description: Name of the response option
                                        response_type:
                                          type:
                                          - string
                                          - 'null'
                                          enum:
                                          - approve
                                          - reject
                                          - return
                                          - otherwise
                                          description: Type of the response option
                                        required:
                                          type: boolean
                                          description: Whether this assignee is required to respond
                                        role_type:
                                          type: string
                                          enum:
                                          - responder
                                          - commenter
                                          description: Role of the assignee on this response row.
                                          example: responder
                                        comment:
                                          type:
                                          - string
                                          - 'null'
                                          description: Optional comment associated with the response
                                        responded_at:
                                          type:
                                          - string
                                          - 'null'
                                          format: date-time
                                          description: Timestamp when the response was submitted
                                        attachments:
                                          type: array
                                          description: List of attachments associated with the response
                                          items:
                                            type: object
                                            required:
                                            - id
                                            - name
                                            - url
                                            properties:
                                              id:
                                                type: string
                                                description: Unique identifier of the attachment
                                              name:
                                                type: string
                                                description: Name of the attachment
                                              url:
