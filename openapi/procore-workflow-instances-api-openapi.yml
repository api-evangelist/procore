      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Added responsible group name to instance memberships
        description: Added a nullable `name` field on each `responsible_group_memberships[]` entry in the workflow instance response.
        endpoint: POST /companies/{company_id}/projects/{project_id}/workflows/instances
        type: refinement
        breaking: false
        datestamp: '2026-06-22'
        versions:
        - '2.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: workflow-instances?version=2.0#create-a-workflow-instance-project-public
      operationId: createAWorkflowInstanceProjectPublic
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Workflow Instances (Project)
      description: Returns a list of workflow instances for a given project.
      tags:
      - Workflow Instances
      parameters:
      - name: filters[tool_type]
        in: query
        description: Filter instances with matching tool type.
        required: true
        schema:
          type: string
      - name: filters[tool_subtype]
        in: query
        description: Filter instances by tool subtype.  Required when tool_type is 'correspondence'.
        required: false
        schema:
          type: integer
      - name: filters[item_id]
        in: query
        description: Filter instances with matching item id.
        required: false
        schema:
          type: string
      - name: filters[assignee_id]
        in: query
        description: Filter instances with matching current assignee.
        required: false
        schema:
          type: string
      - name: filters[active]
        in: query
        description: Return only instances that are active.
        required: false
        schema:
          type: boolean
      - name: filters[overdue]
        in: query
        description: Return only instances whose next workflow step is overdue.
        required: false
        schema:
          type: boolean
      - name: include_internal
        in: query
        description: Include internal workflow instances when true. Defaults to false when omitted.
        required: false
        schema:
          type: boolean
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: cursor
        in: query
        description: Cursor location where the returned list of items are before or after this cursor location. Cursor pagination is used by default. Cannot be combined with the `page` parameter.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page number for page-based pagination. When provided, page-based pagination is used instead of the default cursor pagination. Cannot be combined with the `cursor` parameter.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Workflow Instance (Index)
                properties:
                  data:
                    type: array
                    description: Workflow instance details
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the workflow instance
                          example: '43584'
                        item_id:
                          type: string
                          description: The associated item's ID
                          example: '2387'
                        tool_subtype:
                          type:
                          - string
                          - 'null'
                          description: The subtype of the associated tool (used for correspondence)
                          example: '-873'
                        tool_type:
                          type: string
                          description: The type of the associated tool
                          example: correspondence
                        created_at:
                          type: string
