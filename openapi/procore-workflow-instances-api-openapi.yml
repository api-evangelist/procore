      summary: Get Bulk Company Workflowable Object Instance Histories
      description: 'Returns workflow instance histories for multiple workflowable objects in a single request, grouped by `item_id`. Each group contains the full ordered history for every workflow instance associated with that object.


        **Authorization:** The request fails with 403 if the requesting user cannot view the history of all workflow instances for any submitted `item_id`. Objects with no workflow instances return an empty `instances` array without causing an error.


        **Granular permissions:** Within each instance, history events are filtered to those the requesting user is permitted to see (full history, previous step only, or none).'
      tags:
      - Workflow Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool_type
              - item_ids
              properties:
                tool_type:
                  type: string
                  description: Workflowable tool type. Supports external name (preferred) and class name (compatibility).
                item_ids:
                  type: array
                  description: One or more workflowable object identifiers. All submitted identifiers must be accessible to the requesting user; if any identifier has hidden instances the request fails with 403.
                  items:
                    type: string
                filters:
                  type: object
                  properties:
                    activity_types:
                      type: array
                      description: Optional activity filter (`comments`, `attachments`). When present, **future step events are not included** (linear templates only).
                      items:
                        type: string
                        enum:
                        - comments
                        - attachments
