openapi: 3.2.0
info:
  title: Procore REST Workflow Instances API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Workflow Instances
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/workflows/instances:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create a Workflow Instance (Project Public)
      description: Creates a new workflow instance for a given project. The template_id and preset_id options can be used to specify a specific template. If neither are specified, the default preset will be used. If both are specified, the preset_id will be used.
      tags:
      - Workflow Instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool_type
              - item_id
              properties:
                tool_type:
                  type: string
                  description: The type of tool for the workflow instance.
                  example: generic_tool_item
                tool_subtype:
                  type: string
                  description: The subtype of the tool. Required when tool_type is 'correspondence'.
                  example: '-123'
                item_id:
                  type: string
                  description: The ID of the item to associate with the workflow instance.
                  example: '483'
                template_id:
                  type: string
                  description: Optional. Specific template ID to use for the workflow instance.
                  example: '534'
                preset_id:
                  type: string
                  description: Optional. Specific preset ID to use for the workflow instance. Takes precedence over template_id if both are provided.
                  example: '876'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Workflow Instance (Show)
                properties:
                  data:
                    type: object
                    description: Workflow instance details
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the workflow instance
                        example: '123'
                      tool_type:
                        type: string
                        description: The type of the associated tool
                        example: purchase_order_contract
                      tool_subtype:
                        type:
                        - string
                        - 'null'
                        description: The subtype of the associated tool (used for correspondence)
                        example: null
                      item_id:
                        type: string
                        description: The associated item's ID
                        example: '123'
                      created_at:
                        type: string
                        description: Date when the instance was created
                        format: date-time
                        example: '2018-04-20T16:20:57Z'
                      updated_at:
                        type: string
                        description: Date when the instance was last updated
                        format: date-time
                        example: '2018-04-20T16:20:57Z'
                      started_at:
                        type:
                        - string
                        - 'null'
                        description: Date when the instance was started
                        format: date-time
                        example: '2018-04-20T16:20:57Z'
                      ended_at:
                        type:
                        - string
                        - 'null'
                        description: Date when the instance ended
                        format: date-time
                        example: '2018-05-20T16:20:57Z'
                      current_step_occurrence:
                        type: object
                        description: Details of the current workflow step
                        properties:
                          id:
                            type: string
                            description: Unique identifier for the step occurrence
                            example: '123'
                          step_uuid:
                            type: string
                            description: UUID of the current step
                            example: 2d931510-d99f-494a-8c67-87feb05e1594
                          name:
                            type: string
                            description: Name of the current step
                            example: Architectural Review
                          started_at:
                            type: string
                            description: Date when the step was started
                            format: date-time
                            example: '2018-04-20T16:20:57Z'
                          overdue_at:
                            type: string
                            description: Date when the step became overdue
                            format: date-time
                            example: '2018-04-20T16:20:57Z'
                          step_histories:
                            description: History of assignee replacements for this step occurrence
                            type:
                            - array
                            - 'null'
                            items:
                              type: object
                              properties:
                                title:
                                  type: string
                                  description: Event category title
                                  example: Assignees Replaced
                                subtitle:
                                  type: string
                                  description: Event timestamp for display
                                  example: '2024-01-15T10:30:00Z'
                                created_at:
                                  type: string
                                  format: date-time
                                  description: ISO timestamp for sorting against other assignee updates
                                  example: '2024-01-15T10:30:00Z'
                                icon:
                                  type: string
                                  description: Icon identifier for the event type
                                  example: gray-people
                                details:
                                  type: array
                                  description: Array of specific replacement details
                                  items:
                                    type: object
                                    properties:
                                      title:
                                        type:
                                        - string
                                        - 'null'
                                        description: Optional detail title
                                        example: A temporary replacement failed/expired
                                      description:
                                        type: string
                                        description: Human-readable description of the change
                                        example: Bob replaced Sally
                                      subtitle:
                                        type:
                                        - string
                                        - 'null'
                                        description: Optional timestamp for the detail
                                        example: '2024-01-15T10:30:00Z'
                                      icon:
                                        type: string
                                        description: Icon identifier for the detail type
                                        example: dark-people
                                      fields:
                                        type: array
                                        description: Array of labeled field information
                                        items:
                                          type: object
                                          properties:
                                            label:
                                              type: string
                                              description: Field label for display
                                              example: Change made by
                                            value:
                                              type: string
                                              description: Field value
                                              example: John
                                            type:
                                              type: string
                                              description: Field type for styling
                                              example: normal
                          available_response_options:
                            type: array
                            description: List of available response options for the step
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: ID of the response option
                                  example: '2387'
                                response_type:
                                  type: string
                                  description: Type of the response
                                  example: APPROVE
                                name:
                                  type: string
                                  description: Name of the response option
                                  example: Approve
                          individual_assignees:
                            type: array
                            description: Individual assignees for the current step, filtered by step UUID and enriched with login information
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Login information ID of the assignee
                                  example: '161072'
                                required:
                                  type: boolean
                                  description: Whether the assignee's response is required
                                  example: true
                                role_type:
                                  type: string
                                  enum:
                                  - responder
                                  - commenter
                                  description: Role of the individual assignee on this step.
                                  example: responder
                                name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Full name of the assignee
                                  example: Carl the Contractor
                                login:
                                  type:
                                  - string
                                  - 'null'
                                  description: Email login of the assignee
                                  example: carl.contractor@example.com
                          notification_recipients:
                            type: array
                            description: List of notification recipients for the current step
                            items:
                              type: object
                              description: Workflow assignee (id, login, name, company only)
                              properties:
                                id:
                                  type: string
                                  description: ID of the assignee
                                  example: '1'
                                name:
                                  type: string
                                  description: Name of the assignee
                                  example: Jane Doe
                                login:
                                  type: string
                                  description: Assignee login
                                  example: jane.doe@example.com
                                company:
                                  type:
                                  - object
                                  - 'null'
                                  description: Company of the assignee
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the company
                                      example: Brickworks
                              required:
                              - id
                              - login
                              - name
                              - company
                          response_occurrences:
                            type: array
                            description: List of response occurrences for the step
                            items:
                              type: object
                              properties:
                                submitted_at:
                                  type:
                                  - string
                                  - 'null'
                                  description: Date when the response was submitted
                                  format: date-time
                                  example: '2018-04-20T16:20:57Z'
                                selected_response_option:
                                  type:
                                  - object
                                  - 'null'
                                  description: The selected response option, or null if not submitted
                                  properties:
                                    id:
                                      type: string
                                      description: ID of the selected response option
                                      example: '2387'
                                    response_type:
                                      type: string
                                      description: Type of the response
                                      example: APPROVE
                                    name:
                                      type: string
                                      description: Name of the response option
                                      example: Approve
                                comment:
                                  type:
                                  - string
                                  - 'null'
                                  description: Optional comment associated with the response
                                  example: Looks good to me!
                                attachments:
                                  type: array
                                  description: List of attachments associated with the response
                                  items:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                        description: Name of the attachment
                                        example: photo.png
                                      url:
                                        type: string
                                        description: URL of the attachment
                                        format: uri
                                        example: https://some_aws_bucket.com/photo.png
                                role_type:
                                  type: string
                                  enum:
                                  - responder
                                  - commenter
                                  description: Role of the assignee on this response occurrence.
                                  example: responder
                                assignee:
                                  type: object
                                  description: Details of the response assignee
                                  properties:
                                    id:
                                      type: string
                                      description: ID of the assignee
                                      example: '133'
                                    login:
                                      type: string
                                      description: Login of the assignee
                                      example: marcia@example.com
                                    name:
                                      type: string
                                      description: Name of the assignee
                                      example: Marcia Example
                                    company:
                                      type: object
                                      description: Company of the assignee
                                      properties:
                                        name:
                                          type: string
                                          description: Name of the company
                                          example: Brickworks
                                    required:
                                      type: boolean
                                      description: Whether the assignee's response is required
                                      example: true
                                original_assignees:
                                  type: array
                                  description: Users on whose behalf this response was submitted via bulk assignee management. Empty array if not a substituted response.
                                  items:
                                    type:
                                    - object
                                    - 'null'
                                    description: Login Information
                                    properties:
                                      id:
                                        type: string
                                        description: Login Information ID
                                        example: '1738090'
                                      name:
                                        type: string
                                        description: User name
                                        example: John Doe
                                      login:
                                        type: string
                                        description: User email
                                        example: johndoe@example.com
                      workflow_manager:
                        description: Workflow manager
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique identifier for the workflow manager
                            example: '161072'
                          login:
                            type: string
                            description: Workflow manager login
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Name of the workflow manager
                            example: Carl the Contractor
                          company:
                            type:
                            - object
                            - 'null'
                            description: Workflow manager's company
                            properties:
                              name:
                                type: string
                                description: Name of the company
                                example: Procore
                      responsible_group_memberships:
                        type: array
                        description: List of responsible group memberships
                        items:
                          type: object
                          properties:
                            responsible_group_uuid:
                              type: string
                              description: UUID of the responsible group
                              example: 89891510-d99f-494a-8c67-87feb05e1594
                            name:
                              type:
                              - string
                              - 'null'
                              description: Localized display name of the responsible group. For a tool role group, this is the tool's translated role name rather than the raw configuration key.
                              example: Approvers
                            assignees:
                              type: array
                              description: List of assignees in the group
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: ID of the assignee
                                    example: '1'
                                  name:
                                    type: string
                                    description: Name of the assignee
                                    example: Jane Doe
                                  login:
                                    type: string
                                    description: Assignee login
                                    example: jane.doe@example.com
                                  company_name:
                                    type:
                                    - string
                                    - 'null'
                                    description: Vendor company name for the assignee when one is associated in the requested company context
                                    example: Brickworks
                      all_assignees:
                        type: array
                        description: List of all current assignees across all steps of the workflow. Includes fully resolved project role assignments and accounts for temporary replacements.
                        items:
                          type: object
                          description: Workflow assignee (id, login, name, company only)
                          properties:
                            id:
                              type: string
                              description: ID of the assignee
                              example: '1'
                            name:
                              type: string
                              description: Name of the assignee
                              example: Jane Doe
                            login:
                              type: string
                              description: Assignee login
                              example: jane.doe@example.com
                            company:
                              type:
                              - object
                              - 'null'
                              description: Company of the assignee
                              properties:
                                name:
                                  type: string
                                  description: Name of the company
                                  example: Brickworks
                          required:
                          - id
                          - login
                          - name
                          - company
                      template_version_id:
                        type: string
                        description: ID of the template version
                        example: '123'
                      created_by:
                        type:
                        - object
                        - 'null'
                        description: User who created the workflow instance
                        properties:
                          id:
                            type: string
                            description: ID of the user who created the workflow
                            example: '161072'
                          login:
                            type: string
                            description: Login/email of the user who created the workflow
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Name of the user who created the workflow
                            example: Carl the Contractor
                          company:
                            type:
                            - object
                            - 'null'
                            description: Company of the user
                            properties:
                              name:
                                type: string
                                description: Name of the company
                                example: Procore
                required:
                - id
                - tool_type
                - tool_subtype
                - item_id
                - created_at
                - updated_at
                - started_at
                - ended_at
                - current_step_occurrence
                - workflow_manager
                - responsible_group_memberships
                - template_version_id
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
