        description: 'New REST V2 API for retrieving workflow instance histories for multiple workflowable

          objects in a single request. Results are grouped by `item_id`. Requires `tool_type`

          and at least one `item_ids` body parameters.


          Authorization is all-or-nothing: if the requesting user cannot view the history of

          all workflow instances for any submitted object, the entire request fails with 403.

          Objects with no workflow instances return an empty `instances` array.


