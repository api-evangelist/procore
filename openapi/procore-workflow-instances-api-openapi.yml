  /rest/v2.0/companies/{company_id}/workflows/instances/history:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: tool_type
      in: query
      description: Workflowable tool type. Supports external name (preferred) and class name (compatibility).
      required: true
      schema:
        type: string
    - name: item_id
      in: query
      description: Workflowable object identifier.
      required: true
      schema:
        type: string
    - name: filters[activity_types][]
      in: query
      required: false
      description: Optional activity filter (`comments`, `attachments`). When present, **future step events are not included** (linear templates only).
      schema:
        type: array
        items:
          type: string
          enum:
          - comments
          - attachments
