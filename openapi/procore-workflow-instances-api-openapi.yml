  /rest/v2.0/companies/{company_id}/workflows/instances/{id}/history:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: id
      in: path
      description: Unique identifier for the workflow instance.
      required: true
      schema:
        type: string
    - name: filters[activity_types][]
      in: query
      required: false
      description: Optional activity filter (`comments`, `attachments`). When present, the response only includes timeline rows that match the filter. **Future step events are not included** when this filter is used (linear templates only).
      schema:
        type: array
        items:
          type: string
          enum:
          - comments
          - attachments
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Workflow Instance History (Company)
      description: 'Returns an ordered list of history events for a given company workflow instance. Each event in the `history` array has a `type` field and a `details` object. The following event types are supported:


        **WorkflowStarted** — emitted when the workflow begins. ```json

        {

        "type": "WorkflowStarted",

        "details": {

        "started_at": "2024-01-15T10:00:00Z"

        }

        }

        ```


        **WorkflowTerminated** — emitted when the workflow is terminated before completion. ```json

        {

        "type": "WorkflowTerminated",

        "details": {

        "name": "Bulk Assignee Update",

        "terminated_at": "2024-01-15T10:30:00Z",

        "terminated_by": {

        "id": "77",

        "login": "mary@example.com",

        "name": "Mary Thompson"

        },

        "terminate_reason": "Suspended",

        "terminate_result": {

        "details": [

        {

        "items": [

        {

        "label": "Status",

        "text": "Approved"

        }

        ]

        }

        ]

        }

        }

        }

        ```


        **ResponseStep** — emitted for each response step, including who responded and what they said.'
      tags:
      - Workflow Instances
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Workflow Instance History
                required:
                - data
                properties:
                  data:
                    type: object
                    description: Workflow instance history details
                    required:
                    - name
                    - format
                    - status
                    - started_at
                    - ended_at
                    - blocked_reason
                    - blocked_is_retriable
                    - current_step_index
                    - history
                    properties:
                      name:
                        type: string
                        description: Display name of the workflow template for this instance
                        example: Submittal Approval
                      format:
                        type: string
                        description: Template layout format
                        enum:
                        - diagram
                        - linear
                      status:
                        type:
                        - string
                        - 'null'
                        description: Urgency-derived status for the workflow instance, or null when urgency has not been set.
                        enum:
                        - blocked
                        - overdue
                        - warning
                        - in_progress
                        - complete
                        - processing
                        - terminated
                      started_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Timestamp when the workflow instance was started
                        example: '2024-01-15T10:00:00Z'
                      ended_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Timestamp when the workflow instance ended
                        example: '2024-01-15T12:00:00Z'
                      blocked_reason:
                        type:
                        - string
                        - 'null'
                        description: Human-readable reason when status is blocked
                      blocked_is_retriable:
                        type: boolean
                        description: True when a blocked instance may recover by refreshing the workflow.
                      blocked_learn_more_url:
                        type:
                        - string
                        - 'null'
                        description: Optional support URL for additional guidance. Null when the instance is not blocked.
                        example: https://support.procore.com/products/online/user-guide/project-level/project-overview/tutorials/manage-project-team-roles-from-the-project-overview
                      current_step_index:
                        type:
                        - integer
                        - 'null'
                        description: Zero-based index within the history array pointing to the current active step, or null when inactive
                        example: 1
                      history:
                        type: array
                        description: Ordered list of history events for the workflow instance
                        items:
                          oneOf:
                          - type: object
                            description: Workflow started event
                            properties:
                              type:
                                type: string
                                description: The type of history event
                                example: WorkflowStarted
                                enum:
                                - WorkflowStarted
                              details:
                                type: object
                                description: Details of the workflow started event
                                properties:
                                  started_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp when the workflow was started
                                    example: '2024-01-15T10:00:00Z'
                          - type: object
                            description: Workflow terminated event
                            properties:
                              type:
                                type: string
                                description: The type of history event
                                example: WorkflowTerminated
                                enum:
                                - WorkflowTerminated
                              details:
                                type: object
                                description: Details of the workflow terminated event
                                properties:
                                  name:
                                    type: string
                                    description: Name of the workflow instance
                                    example: Bulk Assignee Update
                                  terminated_at:
                                    type: string
                                    format: date-time
                                    description: Timestamp when the workflow was terminated
                                    example: '2024-01-15T10:30:00Z'
                                  terminated_by:
                                    type: object
                                    description: User who terminated the workflow instance, when available
                                    properties:
                                      id:
                                        type: string
                                        description: Unique identifier of the terminating user
                                        example: '77'
                                      login:
                                        type:
                                        - string
                                        - 'null'
                                        description: Email/login of the terminating user
                                        example: mary@example.com
                                      name:
                                        type:
                                        - string
                                        - 'null'
                                        description: Full name of the terminating user
                                        example: Mary Thompson
                                  terminate_reason:
                                    type: string
                                    description: Termination reason, when provided
                                    example: Suspended
                                  terminate_result:
                                    type: object
                                    description: Additional tool-specific details about the termination result, when provided
                                    example:
                                      details:
                                      - items:
                                        - label: Status
                                          text: Approved
                          - type: object
                            description: Response step event
                            properties:
                              type:
                                type: string
                                description: The type of history event
                                example: ResponseStep
                                enum:
                                - ResponseStep
                              details:
                                type: object
                                description: Details of the response step event
                                properties:
                                  id:
                                    type:
                                    - string
                                    - 'null'
                                    description: Unique identifier for this step occurrence; null for future steps.
                                  uuid:
                                    type: string
                                    description: Unique identifier for this step definition
                                  name:
                                    type: string
                                    description: Name of the workflow step
                                    example: Step 1
                                  started_at:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: Timestamp when the step was started. Null for future steps.
                                    example: '2024-01-15T10:00:00Z'
                                  ended_at:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: Timestamp when the step ended
                                    example: '2024-01-15T11:00:00Z'
                                  due_date:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: Step due date; projected for future steps when applicable.
                                  decision_type:
                                    type:
                                    - string
                                    - 'null'
                                    description: How assignee responses are combined into a single step decision.
                                    enum:
                                    - unanimous
                                    - any
                                    - first
                                    example: first
                                  required_responders_decide:
                                    type:
                                    - boolean
                                    - 'null'
                                    description: 'When the decision type is unanimous: if true, the aggregated step decision is based only on assignees who must respond; if false, all submitted responses are considered.'
                                  responses:
                                    type: array
                                    description: List of assignee responses for this step. For current and future steps, includes assignees who have not yet responded.
                                    items:
