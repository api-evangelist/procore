          application/json:
            schema:
              type: object
              required:
              - step_occurrence_id
              - required
              - reason
              - assignee_ids
              properties:
                step_occurrence_id:
                  type: string
                  description: The ID of the step occurrence to add assignees to.
                  example: '123'
                required:
                  type: boolean
                  description: Whether the additional assignees are required to respond.
                  example: true
                role_type:
                  type: string
                  description: Role applied to the additional assignees on the step. Defaults to responder when omitted.
                  example: responder
                  enum:
                  - responder
                  - commenter
                reason:
                  type: string
                  description: The reason for adding the additional assignees.
                  example: new_employee
                  enum:
                  - new_employee
                  - original_assignee_left_company
                  - original_assignee_left_the_project
                  - original_assignee_on_extended_leave
                  - original_assignee_on_vacation
                  - other
                comment:
                  type: string
                  description: Optional comment about this invitation.
                  example: A note about this invitation
                message:
                  type: string
                  description: Optional message to send to the assignees.
                  example: You've been assigned to a workflow
                assignee_ids:
                  type: array
                  description: List of user IDs to add as additional assignees.
                  items:
                    type: string
                  example:
                  - '8'
                  - '42'
                  - '79'
