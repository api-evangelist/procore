                                      format: date-time
                                      description: Timestamp when the workflow was started
                                      example: '2024-01-15T10:00:00Z'
                            - type: object
                              description: Workflow terminated event
                              properties:
                                type:
                                  type: string
                                  description: The type of history event
                                  example: WorkflowTerminated
                                  enum:
                                  - WorkflowTerminated
                                details:
                                  type: object
                                  description: Details of the workflow terminated event
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the workflow instance
                                      example: Bulk Assignee Update
                                    terminated_at:
                                      type: string
                                      format: date-time
                                      description: Timestamp when the workflow was terminated
                                      example: '2024-01-15T10:30:00Z'
                                    terminated_by:
                                      type: object
                                      description: User who terminated the workflow instance, when available
                                      properties:
                                        id:
                                          type: string
                                          description: Unique identifier of the terminating user
                                          example: '77'
                                        login:
                                          type:
                                          - string
                                          - 'null'
                                          description: Email/login of the terminating user
                                          example: mary@example.com
                                        name:
                                          type:
                                          - string
                                          - 'null'
                                          description: Full name of the terminating user
                                          example: Mary Thompson
                                    terminate_reason:
                                      type: string
                                      description: Termination reason, when provided
                                      example: Suspended
                                    terminate_result:
                                      type: object
                                      description: Additional tool-specific details about the termination result, when provided
                                      example:
                                        details:
                                        - items:
                                          - label: Status
