        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/workflows/instances/bulk_history',\n  headers: {'content-type': 'application/json'},\n  body: {\n    tool_type: 'string',\n    item_ids: ['string'],\n    filters: {activity_types: ['comments']}\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"tool_type\":\"string\",\"item_ids\":[\"string\"],\"filters\":{\"activity_types\":[\"comments\"]}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/workflows/instances/bulk_history", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
