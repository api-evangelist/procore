                                        forwarded:
                                          type: boolean
                                          description: True when this assignee is on the step because a step assignee forwarded it to them (as a responder or a commenter). False for template assignees, individual assignees, other additional assignees, and projected rows on future steps.
                                          example: false
                                  overall_response:
                                    type:
                                    - string
                                    - 'null'
                                    description: The overall aggregated response for the step
                                    example: Approved
                                  overall_response_type:
                                    type:
