              type: object
              properties:
                name:
                  type:
                  - string
                  - 'null'
                  description: Name of the transfer. Optional — auto-generated if not provided.
                notes:
                  type:
                  - string
                  - 'null'
                  description: Notes for the transfer.
                properties:
                  type:
                  - object
                  - 'null'
                  additionalProperties:
                    type: string
                  description: Properties (key-value pairs) to be associated with the transfer.
                to_project_id:
                  type:
                  - string
                  - 'null'
                  description: The ID of the destination project.
                estimated_delivery_at:
                  type:
                  - string
                  - 'null'
                  description: The estimated delivery date.
                  format: date-time
                items:
                  type:
                  - array
                  - 'null'
                  items:
                    required:
                    - id
                    type: object
                    properties:
                      id:
                        type: string
                        description: The ID of the material/resource (item_physical.id). Required.
                        format: uuid
                      from_location:
                        type:
                        - integer
                        - 'null'
                        description: From location ID.
                        format: int64
                      from_condition:
                        enum:
                        - ACCEPTABLE
                        - UNACCEPTABLE
                        - DAMAGED
                        - SHORT
                        - OVERAGE
                        - ADD
                        - REMOVE
                        - RETURNED_TO_STOCK
                        type: string
                      quantity:
                        type:
                        - number
                        - 'null'
                        description: Quantity for the line item. Optional (defaults to 1.0).
                        format: double
                      notes:
                        type:
                        - string
                        - 'null'
                        description: Notes for the line item.
                    additionalProperties: false
                  description: The line items for the transfer. Omitted, `null`, and `[]` are equivalent (no lines yet).
                delivery_instructions:
                  type:
                  - string
                  - 'null'
                  description: The delivery instructions for the transfer.
              additionalProperties: false
