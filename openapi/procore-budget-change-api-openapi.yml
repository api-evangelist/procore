  /rest/v1.0/projects/{project_id}/budget_changes/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    - name: id
      in: path
      description: Unique identifier of budget change
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get information of a budget change
      description: Get information of a budget change (without adjustment)
      tags:
      - Budget Change
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - type: object
                      description: Budget Change Package information
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the budget change
                          example: 75414
                        number:
                          type: number
                          description: Number field of the budget change
                          example: 10
                        status:
                          type: string
                          description: Status of the budget change
                          example: draft
                          enum:
                          - draft
                          - approved
                          - under_review
                          - void
                        title:
                          type: string
                          description: Title of budget change
                          example: My title
                        description:
                          type: string
                          description: Description of the budget change in HTML format
                          example: <p>Bla bla <em>description</em></p>
                        erp_status:
                          type: string
                          description: The ERP (Enterprise Resource Planning) synchronization state of this budget change.
                          example: ready_to_export
                          enum:
                          - not_in_erp
                          - ready_to_export
                          - exporting
                          - failed_to_export
                          - rejected
                          - invalid
                          - synced
                          - not_integrated
                    - type: object
                      properties:
                        amount:
                          type: number
                          description: Total amount of the budget change
                          example: 9.99
                        prime_contract:
                          type:
                          - object
                          - 'null'
                          description: Information on the prime contract this budget change is associated with
                          properties:
                            id:
                              type: number
                              description: The ID of the prime contract
                              example: 1
                            number:
                              type: string
                              description: Number
                              example: A-1
                            title:
                              type: string
                              description: Title
                              example: ABC Owner Contract
                        budget_change_type:
                          type:
                          - object
                          - 'null'
                          description: The budget change type categorizing this budget change. Null when no type is assigned.
                          properties:
                            id:
                              type: integer
                              description: ID of the budget change type.
                              example: 12
                            display_name:
                              type: string
                              description: Human-readable name of the budget change type.
                              example: Owner Change
                        attachments:
                          type: array
                          items:
                            type: object
                            properties:
                              prostore_file_id:
                                type: integer
                                description: Unique identifier of the attached file
                              name:
                                type: string
                                description: Base name of the file without its path
                                example: snapshot.png
                              url:
                                type: string
                                description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                                example: https://storage.procore.com/v3/d/default/procore-files/1ZE258W9K804SAJJZX19JVAB3R?sig=e7a476ec0a46154d05e0d4a554fb2ea0904cb6604670f9247c54d7c56a84d0b6
                        adjustment_line_items:
                          type: array
                          description: todo this key be renamed to line_items in the future
                          items:
                            type: object
                            description: Budget Change Adjustment line item
                            properties:
                              id:
                                type: number
                                description: ID of this adjustment
                                example: 56
                              ref:
                                type:
                                - string
                                - 'null'
                                description: Identifier used to map line items in the request to their respective objects or errors in the response
                                example: item56
                              adjustment_number:
                                type: integer
                                description: Number of this adjustment. When creating a line item with type 'change_event', this is optional and it will be auto-assigned an adjustment_number. However, it is required when creating a line item with type 'budget_change'.
                                example: 5
                              budget_change_id:
                                type: number
                                description: ID of the budget change this line item belongs to.
                                example: 235
                              wbs_code:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: Wbs Code ID
                                    example: 999
                                  flat_code:
                                    type: string
                                    description: Wbs Code
                                    example: 01-011.CT1
                                  description:
                                    type: string
                                    description: Wbs Code Description
                                    example: Project Engineer.Cost Type 1
                              description:
                                type:
                                - string
                                - 'null'
                                description: Description of the adjustment
                                example: Foobar
                              comment:
                                type:
                                - string
                                - 'null'
                                description: Comment of the adjustment
                                example: Baz
                              created_at:
                                type: string
                                format: date-time
                                description: Timestamp when this line item was created, in ISO 8601 format.
                                example: '2018-04-19T09:36:42Z'
                              calculation_strategy:
                                type: string
                                description: Cost calculation strategy
                                example: manual
                                enum:
                                - automatic
                                - manual
                              quantity:
                                type: number
                                description: Estimated cost quantity
                                example: 1
                              type:
                                type: string
                                description: used to identify type of line item. id uniqueness is guaranteed per type
                                example: change_event
                                enum:
                                - budget_change
                                - change_event
                              uom:
                                type: string
                                description: Unit of measure used
                                example: Ea
                              unit_cost:
                                type: number
                                description: Estimated unit cost
                                example: 30.5
                              amount:
                                type: number
                                description: Estimated cost amount
                                example: 76.25
                              change_event_line_item_id:
                                type:
                                - number
                                - 'null'
                                description: ID of the associated change event line item if it exists (To be deprecated, use change_event_line_item instead)
                                example: 78
                              change_event_line_item:
                                type:
                                - object
                                - 'null'
                                description: change event line item simple object
                                properties:
                                  id:
                                    type: integer
                                    description: ID of the associated change event line item if it exists
                                    example: 78
                                  event_id:
                                    type: integer
                                    description: ID of the associated change event that this change event line item is associated with
                                    example: 999
                              currency_configuration:
                                type: object
                                properties:
                                  currency_iso_code:
                                    type:
                                    - string
                                    - 'null'
                                    description: Currency ISO Code configured for the financial entity
                                    example: USD
                        production_quantities:
                          type: array
                          description: List of budget change production quantities
                          items:
                            type: object
                            description: Budget Change Adjustment Production Quantity
                            properties:
                              id:
                                type: number
                                description: ID of this production quantity
                                example: 56
                              budget_change_id:
                                type:
                                - number
                                - 'null'
                                description: ID of the Budget Change to which this production quantity is associated
                                example: 78
                              comment:
                                type:
                                - string
                                - 'null'
                                description: Comment of the production quantity
                                example: Baz
                              created_at:
                                type: string
                                format: date-time
                                description: Timestamp when this production quantity was created, in ISO 8601 format.
                                example: '2018-04-19T09:36:42Z'
                              description:
                                type:
                                - string
                                - 'null'
                                description: Description of the production quantity
                                example: Foobar
                              quantity:
                                type: number
                                description: Estimated cost quantity
                                example: 1
                              ref:
                                type:
                                - string
                                - 'null'
                                description: Identifier used to map production quantities in the request to their respective objects or errors in the response
                                example: item56
                              uom:
                                type: string
                                description: Unit of measure used
                                example: Ea
                              wbs_code:
                                type: object
                                description: Work Breakdown Structure
                                properties:
                                  id:
                                    type: number
                                    description: The ID of the WBS Code
                                    example: 1
                                  flat_code:
                                    type: string
                                    description: wbs code flat code
                                    example: 2.E
                                  description:
                                    type: string
                                    description: The description of the WBS Code
                                    example: Purpose
                              cost_code:
                                type: object
                                description: The cost code associated with the Production Quantity
                                properties:
                                  id:
                                    type: number
                                    description: The ID of the Cost Code
                                    example: 1
                                  label:
                                    type: string
                                    description: The display value for the Cost Code
                                    example: 01-000 - Purpose
                              sub_job:
                                type: object
                                description: The sub job associated with the Production Quantity
                                properties:
                                  id:
                                    type:
                                    - number
                                    - 'null'
                                    description: The ID of the sub job
                                    example: 1
                                  label:
                                    type:
                                    - string
                                    - 'null'
                                    description: The name of the Sub Job
                                    example: Floor 1
                              change_event_production_quantity_id:
                                type: number
                                description: ID of the associated Change Event Production Quantity
                                example: 1
                        currency_configuration:
                          type: object
                          properties:
                            currency_iso_code:
                              type:
                              - string
                              - 'null'
                              description: Currency ISO Code configured for the financial entity
                              example: USD
                        created_at:
                          type: string
                          format: date-time
                          example: '2012-10-23T21:39:40Z'
                        updated_at:
                          type: string
                          format: date-time
                          example: '2012-10-23T21:39:40Z'
                        created_by:
                          type: object
                          description: The user who created the budget change
                          properties:
                            id:
                              type: number
                              description: The ID of the user
                              example: 1
                            name:
                              type: string
                              description: The name of the user
                              example: John Doe
                            login:
                              type: string
                              description: The login of the user
                              example: johndoe@example.com
                        custom_fields:
                          type: object
                          properties:
                            custom_field_%{custom_field_string_definition_id}:
                              type: object
                              properties:
                                data_type:
                                  type: string
                                  description: Data type of the Custom Field Definition
                                  example: string
