openapi: 3.2.0
info:
  title: Procore REST Budget Change API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Budget Change
paths:
  /rest/v1.0/projects/{project_id}/budget_changes:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Budget Change Summaries
      description: Return a list of budget change summary rows.
      tags:
      - Budget Change
      parameters:
      - name: exclude_custom_fields
        in: query
        description: When true, omits custom_fields from each summary row for faster response.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Result set of budget change summary rows. Summary row doesn't contain all fields of a budget change.
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - type: object
                        description: Budget Change Package information
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for the budget change
                            example: 75414
                          number:
                            type: number
                            description: Number field of the budget change
                            example: 10
                          status:
                            type: string
                            description: Status of the budget change
                            example: draft
                            enum:
                            - draft
                            - approved
                            - under_review
                            - void
                          title:
                            type: string
                            description: Title of budget change
                            example: My title
                          description:
                            type: string
                            description: Description of the budget change in HTML format
                            example: <p>Bla bla <em>description</em></p>
                          erp_status:
                            type: string
                            description: The ERP (Enterprise Resource Planning) synchronization state of this budget change.
                            example: ready_to_export
                            enum:
                            - not_in_erp
                            - ready_to_export
                            - exporting
                            - failed_to_export
                            - rejected
                            - invalid
                            - synced
                            - not_integrated
                      - type: object
                        description: Budget Change Summary information
                        properties:
                          prime_contract_id:
                            type:
                            - integer
                            - 'null'
                            description: Unique identifier for the prime contract this budget change is associated with
                            example: 1234
                          amount:
                            type: number
                            description: Total amount of adjustments
                            example: 0
                          change_event_line_item_ids:
                            type: array
                            description: List of change event line item ids
                            items:
                              type: integer
                              example: 22
                          created_by:
                            type: object
                            description: The user who created the budget change
                            properties:
                              id:
                                type: number
                                description: The ID of the user
                                example: 1
                              name:
                                type: string
                                description: The name of the user
                                example: John Doe
                              login:
                                type: string
                                description: The login of the user
                                example: johndoe@example.com
                          custom_fields:
                            type: object
                            properties:
                              custom_field_%{custom_field_string_definition_id}:
                                type: object
                                properties:
                                  data_type:
                                    type: string
                                    description: Data type of the Custom Field Definition
                                    example: string
                                  value:
                                    type: string
                                    description: The value of the custom field
                                    example: custom field value
                                  variant:
                                    type: string
                                    description: The variant of the Custom Field Definition (e.g. `phone_number`). Present only when the definition has an associated variant.
                                    example: phone_number
                              custom_field_%{custom_field_decimal_definition_id}:
                                type: object
                                properties:
                                  data_type:
                                    type: string
                                    description: Data type of the Custom Field Definition
                                    example: decimal
                                  value:
                                    type: number
                                    description: The value of the custom field
                                    example: 2.2
                              custom_field_%{custom_field_boolean_definition_id}:
                                type: object
                                properties:
                                  data_type:
                                    type: string
                                    description: Data type of the Custom Field Definition
                                    example: boolean
                                  value:
                                    type: boolean
                                    description: The value of the custom field
                                    example: true
                              custom_field_%{custom_field_lov_entry_definition_id}:
                                type: object
                                properties:
                                  data_type:
                                    type: string
                                    description: Data type of the Custom Field Definition
                                    example: lov_entry
                                  value:
                                    type: object
                                    properties:
                                      id:
                                        type: integer
                                        description: ID of the LOV Entry
                                        example: 1
                                      label:
                                        type: string
                                        description: Label of the LOV Entry
                                        example: Open
                                  variant:
                                    type: string
                                    description: The variant of the Custom Field Definition (e.g. `project_directory`). Present only when the definition has an associated variant.
                                    example: with_code
                              custom_field_%{custom_field_lov_entries_definition_id}:
                                type: object
                                properties:
                                  data_type:
                                    type: string
                                    description: Data type of the Custom Field Definition
                                    example: lov_entries
                                  value:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: ID of the LOV Entry
                                          example: 2
                                        label:
                                          type: string
                                          description: Label of the LOV Entry
                                          example: Open
                          currency_configuration:
                            type: object
                            properties:
                              currency_iso_code:
                                type:
                                - string
                                - 'null'
                                description: Currency ISO Code configured for the financial entity
                                example: USD
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/budget_changes',\n  qs: {exclude_custom_fields: 'SOME_BOOLEAN_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/budget_changes?exclude_custom_fields=SOME_BOOLEAN_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/budget_changes?exclude_custom_fields=SOME_BOOLEAN_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/budget_changes?exclude_custom_fields=SOME_BOOLEAN_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Introducing a List Budget Change Summaries endpoint
        description: Introduces a new endpoint to list the budget change summaries for the project
        endpoint: GET /projects/{project_id}/budget_changes
        type: new
        breaking: false
        datestamp: '2021-08-16'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: Additional created_by_id field is returned as part of response for Budget Change.
        description: The budget_changes endpoint will now also return the user ID who created the entry as 'created_by_id'.
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2022-03-25'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: Extend Budget Change index endpoint to return ERP status in projects that are ERP integrated
        description: The budget change index endpoint will now return the ERP status of each budget change summary if ERP integration is on.
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2022-09-01'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: Extend Budget Change index endpoint to return currency configuration
        description: The budget change index endpoint will now return the currency configuration on each budget change and adjustment line item.
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2023-08-23'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: The Budget Change Index endpoint includes the identifier for the associated prime contract
        description: The Budget Change index endpoint response includes the id of the associated prime contract
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2023-10-20'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: Extend Budget Change List created_by attribute
        description: The budget change list created_by attribute will now return the created_by object in the budget change body.
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2025-01-13'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: Budget Change Number attribute includes decimals
        description: The budget change number attribute will now accept decimals(1.1) or integers(1).
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2025-04-03'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      - summary: Extend Budget Change index endpoint to include skip custom fields parameter
        description: 'The budget change index endpoint already returns the custom_fields object on each summary row when available.

          A new query parameter ''exclude_custom_fields'' can be provided to omit custom_fields from the response for faster response time.'
        endpoint: GET /projects/{project_id}/budget_changes
        type: feature
        breaking: false
        datestamp: '2026-02-23'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: budget-change?version=1.0#list-budget-change-summaries
      operationId: listBudgetChangeSummaries
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create a budget change
      description: Create a new budget change with adjustments.
      tags:
      - Budget Change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Budget Change Package information Input
              properties:
                number:
                  type: number
                  description: Number field of budget change. If not provided, it will be assigned.
                  example: 10
                status:
                  type: string
                  description: Status of budget change
                  example: draft
                  enum:
                  - draft
                  - approved
                  - under_review
                  - void
                title:
                  type: string
                  description: Title of budget change
                  example: Equipment
                description:
                  type: string
                  description: Description of budget change in HTML format
                  example: <p>bla bla <em>description</em></p>
                adjustment_line_items:
                  type: array
                  description: List of budget change line items. todo this key be renamed to line_items in the future
                  items:
                    type: object
                    description: Budget Change Adjustment line item
                    properties:
                      ref:
                        type:
                        - string
                        - 'null'
                        description: Identifier used to map line items in the request to their respective objects or errors in the response
                        example: item56
                      adjustment_number:
                        type: integer
                        description: Number of this adjustment
                        example: 5
                      wbs_code_id:
                        type: integer
                        description: Work Breakdown Structure Code ID
                        example: 56
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the adjustment
                        example: Foobar
                      comment:
                        type:
                        - string
                        - 'null'
                        description: Comment of the adjustment
                        example: Baz
                      calculation_strategy:
                        type: string
                        description: Cost calculation strategy
                        example: manual
                        enum:
                        - automatic
                        - manual
                      quantity:
                        type: number
                        description: Estimated cost quantity
                        example: 1
                      type:
                        type: string
                        description: 'Used to identify type of line item. id uniquess is guaranteed per type.


                          NOTE: To add an Adjustment Line Item with the type budget_change for an adjustment_number, an Adjustment Line item with the type change_event must be created for the same adjustment_number.'
                        example: change_event
                        enum:
                        - change_event
                        - budget_change
                      uom:
                        type: string
                        description: Unit of measure used
                        example: Ea
                      unit_cost:
                        type: number
                        description: Estimated unit cost
                        example: 500
                      amount:
                        type: number
                        description: Estimated cost amount
                        example: 500
                      change_event_line_item_id:
                        type:
                        - integer
                        - 'null'
                        description: ID for the change event line item associated with the adjustment
                        example: 860001
                prostore_file_ids:
                  type: array
                  description: The prostore file identifiers that will be associated with this budget change as attachments
                  items:
                    type: integer
                    example: 123
                production_quantities:
                  type: array
                  description: List of budget change production quantities
                  items:
                    type: object
                    description: Budget Change Adjustment Production Quantity
                    properties:
                      comment:
                        type:
                        - string
                        - 'null'
                        description: Comment of the production quantity
                        example: Baz
                      cost_code_id:
                        type: integer
                        description: Cost Code ID
                        example: 56
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the production quantity
                        example: Foobar
                      quantity:
                        type: number
                        description: Estimated cost quantity
                        example: 1
                      ref:
                        type:
                        - string
                        - 'null'
                        description: Identifier used to map production quantities in the request to their respective objects or errors in the response
                        example: item56
                      uom:
                        type: string
                        description: Unit of measure used
                        example: Ea
                      change_event_production_quantity_id:
                        type:
                        - number
                        - 'null'
                        description: ID of the Change Event Production Quantity that is to be associated with the Budget Change Production Quantity
                        example: 1
                    required:
                    - cost_code_id
                    - quantity
                    - uom
              required:
              - status
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - type: object
                      description: Budget Change Package information
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the budget change
                          example: 75414
                        number:
                          type: number
                          description: Number field of the budget change
                          example: 10
                        status:
                          type: string
                          description: Status of the budget change
                          example: draft
                          enum:
                          - draft
                          - approved
                          - under_review
                          - void
                        title:
                          type: string
                          description: Title of budget change
                          example: My title
                        description:
                          type: string
                          description: Description of the budget change in HTML format
                          example: <p>Bla bla <em>description</em></p>
                        erp_status:
                          type: string
                          description: The ERP (Enterprise Resource Planning) synchronization state of this budget change.
                          example: ready_to_export
                          enum:
                          - not_in_erp
                          - ready_to_export
                          - exporting
                          - failed_to_export
                          - rejected
                          - invalid
                          - synced
                          - not_integrated
                    - type: object
                      properties:
                        attachments:
                          type: array
                          items:
                            type: object
                            properties:
                              prostore_file_id:
                                type: integer
                                description: Unique identifier of the attached file
                              name:
                                type: string
                                description: Base name of the file without its path
                                example: snapshot.png
                              url:
                                type: string
                                description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                                example: https://storage.procore.com/v3/d/default/procore-files/1ZE258W9K804SAJJZX19JVAB3R?sig=e7a476ec0a46154d05e0d4a554fb2ea0904cb6604670f9247c54d7c56a84d0b6
                        adjustment_line_items:
                          type: array
                          description: todo this key be renamed to line_items in the future
                          items:
                            type: object
                            description: Budget Change Adjustment line item
                            properties:
                              id:
                                type: number
                                description: ID of this adjustment
                                example: 56
                              ref:
                                type:
                                - string
                                - 'null'
                                description: Identifier used to map line items in the request to their respective objects or errors in the response
                                example: item56
                              adjustment_number:
                                type: integer
                                description: Number of this adjustment. When creating a line item with type 'change_event', this is optional and it will be auto-assigned an adjustment_number. However, it is required when creating a line item with type 'budget_change'.
                                example: 5
                              budget_change_id:
                                type: number
                                description: ID of the budget change this line item belongs to.
                                example: 235
                              wbs_code:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: Wbs Code ID
                                    example: 999
                                  flat_code:
                                    type: string
                                    description: Wbs Code
                                    example: 01-011.CT1
                                  description:
                                    type: string
                                    description: Wbs Code Description
                                    example: Project Engineer.Cost Type 1
                              description:
                                type:
                                - string
                                - 'null'
                                description: Description of the adjustment
                                example: Foobar
                              comment:
                                type:
                                - string
                                - 'null'
                                description: Comment of the adjustment
                                example: Baz
                              created_at:
                                type: string
                                format: date-time
                                description: Timestamp when this line item was created, in ISO 8601 format.
                                example: '2018-04-19T09:36:42Z'
                              calculation_strategy:
                                type: string
                                description: Cost calculation strategy
                                example: manual
                                enum:
                                - automatic
                                - manual
                              quantity:
                                type: number
                                description: Estimated cost quantity
                                example: 1
                              type:
                                type: string
                                description: used to identify type of line item. id uniqueness is guaranteed per type
                                example: change_event
                                enum:
                                - budget_change
                                - change_event
                              uom:
                                type: string
                                description: Unit of measure used
                                example: Ea
                              unit_cost:
                                type: number
                                description: Estimated unit cost
                                example: 30.5
                              amount:
                                type: number
                                description: Estimated cost amount
                                example: 76.25
                              change_event_line_item_id:
                                type:
                                - number
                                - 'null'
                                description: ID of the associated change event line item if it exists (To be deprecated, use change_event_line_item instead)
                                example: 78
                              change_event_line_item:
                                type:
                                - object
                                - 'null'
                                description: change event line item simple object
                                properties:
                                  id:
                                    type: integer
                                    description: ID of the associated change event line item if it exists
                                    example: 78
                                  event_id:
                                    type: integer
                                    description: ID of the associated change event that this change event line item is associated with
                                    example: 999
                              currency_configuration:
                                type: object
                                properties:
                                  currency_iso_code:
                                    type:
                                    - string
                                    - 'null'
                                    description: Currency ISO Code configured for the financial entity
                                    example: USD
                        created_change_event:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: integer
                              description: Identifier of the created change event
                              example: 123
                            number:
                              type: string
                              description: Number of the created change event
                              example: '456'
                        production_quantities:
                          type: array
                          description: List of budget change production quantities
                          items:
                            type: object
                            description: Budget Change Adjustment Production Quantity
                            properties:
                              id:
                                type: number
                                description: ID of this production quantity
                                example: 56
                              budget_change_id:
                                type:
                                - number
                                - 'null'
                                description: ID of the Budget Change to which this production quantity is associated
                                example: 78
                              comment:
                                type:
                                - string
                                - 'null'
                                description: Comment of the production quantity
                                example: Baz
                              created_at:
                                type: string
                                format: date-time
                                description: Timestamp when this production quantity was created, in ISO 8601 format.
                                example: '2018-04-19T09:36:42Z'
                              description:
                                type:
                                - string
                                - 'null'
                                description: Description of the production quantity
                                example: Foobar
                              quantity:
                                type: number
                                description: Estimated cost quantity
                                example: 1
                              ref:
                                type:
                                - string
                                - 'null'
                                description: Identifier used to map production quantities in the request to their respective objects or errors in the response
                                example: item56
                              uom:
                                type: string
                                description: Unit of measure used
                                example: Ea
                              wbs_code:
                                type: object
                                description: Work Breakdown Structure
                                properties:
                                  id:
                                    type: number
                                    description: The ID of the WBS Code
                                    example: 1
                                  flat_code:
                                    type: string
                                    description: wbs code flat code
                                    example: 2.E
                                  description:
                                    type: string
                                    description: The description of the WBS Code
                                    example: Purpose
                              cost_code:
                                type: object
                                description: The cost code associated with the Production Quantity
                                properties:
                                  id:
                                    type: number
                                    description: The ID of the Cost Code
                                    example: 1
                                  label:
                                    type: string
                                    description: The display value for the Cost Code
                                    example: 01-000 - Purpose
                              sub_job:
                                type: object
                                description: The sub job associated with the Production Quantity
                                properties:
                                  id:
                                    type:
                                    - number
                                    - 'null'
                                    description: The ID of the sub job
                                    example: 1
                                  label:
                                    type:
                                    - string
                                    - 'null'
                                    description: The name of the Sub Job
                                    example: Floor 1
                              change_event_production_quantity_id:
                                type: number
                                description: ID of the associated Change Event Production Quantity
                                example: 1
                        currency_configuration:
                          type: object
