    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update information of a Budget Change
      tags:
      - Budget Change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Budget Change Package information Input
              properties:
                id:
                  type: integer
                  description: Unique identifier of this budget change
                  example: 1
                number:
                  type: number
                  description: Number field of budget change
                  example: 10
                status:
                  type: string
                  description: Status of budget change
                  example: draft
                  enum:
                  - draft
                  - approved
                  - under_review
                  - void
                title:
                  type: string
                  description: Title of budget change
                  example: Equipment
                description:
                  type: string
                  description: Description of budget change in HTML format
                  example: <p>bla bla <em>description</em></p>
                adjustment_line_items:
                  type: array
                  description: List of budget change adjustments
                  items:
                    type: object
                    description: Budget Change Adjustment line item
                    properties:
                      id:
                        type:
                        - integer
                        - 'null'
                        description: ID of this adjustment
                        example: 56
                      type:
                        type: string
                        description: 'Used to identify type of line item. id uniqueness is guaranteed per type


                          NOTE: To update an Adjustment Line Item with the type budget_change for an adjustment_number, an Adjustment Line item with the type change_event must exist for the same adjustment_number.'
                        example: change_event
                        enum:
                        - change_event
                        - budget_change
                      ref:
                        type:
                        - string
                        - 'null'
                        description: Identifier used to map line items in the request to their respective objects or errors in the response
                        example: item56
                      adjustment_number:
                        type: integer
                        description: Number of this adjustment
                        example: 5
                      wbs_code_id:
                        type: integer
                        description: Work Breakdown Structure Code ID
                        example: 56
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the adjustment
                        example: Foobar
                      comment:
                        type:
                        - string
                        - 'null'
                        description: Comment of the adjustment
                        example: Baz
                      calculation_strategy:
                        type: string
                        description: Cost calculation strategy
                        example: manual
                        enum:
                        - automatic
                        - manual
                      quantity:
                        type: number
                        description: Estimated cost quantity
                        example: 1
                      uom:
                        type: string
                        description: Unit of measure used
                        example: Ea
                      unit_cost:
                        type: number
                        description: Estimated unit cost
                        example: 500
                      amount:
                        type: number
                        description: Estimated cost amount
                        example: 500
                      change_event_line_item_id:
                        type:
                        - integer
                        - 'null'
                        description: ID for the change event line item associated with the adjustment
                        example: 860001
                      _delete:
                        type: boolean
                        description: Whether this adjustment should be deleted
                        example: true
                prostore_file_ids:
                  type: array
                  description: The desired prostore file identifiers that will replace the current collection of attachments associated with the budget change
                  items:
                    type: integer
                    example: 123
                production_quantities:
                  type: array
                  description: List of budget change production quantities
                  items:
                    type: object
                    description: Budget Change Adjustment Production Quantity
                    properties:
                      id:
                        type:
                        - integer
                        - 'null'
                        description: ID of this Production Quantity
                        example: 56
                      comment:
                        type:
                        - string
                        - 'null'
                        description: Comment of the adjustment
                        example: Baz
                      cost_code_id:
                        type: integer
                        description: Cost Code ID
                        example: 56
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the Production Quantity
                        example: Foobar
                      quantity:
                        type: number
                        description: Estimated cost quantity
                        example: 1
                      ref:
                        type:
                        - string
                        - 'null'
                        description: Identifier used to map production quantities in the request to their respective objects or errors in the response
                        example: item56
                      uom:
                        type: string
                        description: Unit of measure used
                        example: Ea
                      change_event_production_quantity_id:
                        type:
                        - number
                        - 'null'
                        description: ID of the Change Event Production Quantity that is to be associated with the Budget Change Production Quantity
                        example: 1
                      _delete:
                        type: boolean
                        description: Whether this production quantity should be deleted
                        example: true
                    required:
                    - cost_code_id
                    - quantity
                    - uom
