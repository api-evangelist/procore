openapi: 3.2.0
info:
  title: Procore REST Change History API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Change History
paths:
  /rest/v2.1/companies/{company_id}/projects/{project_id}/specification_section_revisions/{id}/change_history:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: id
      in: path
      required: true
      description: Unique identifier for the specification section revision.
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Change History of Specification Section Revision
      description: This endpoint returns the change history of a specification section revision.
      tags:
      - Change History
      parameters:
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        required: false
        description: Sort by `created_at` ascending when provided; otherwise results are newest first.
        schema:
          type: string
          enum:
          - created_at
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: The message of the change history
                        example: Change history sent successfully
        '403':
          description: User does not have right permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/specification_section_revisions/%7Bid%7D/change_history',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    sort: 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v2.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/specification_section_revisions/%7Bid%7D/change_history?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&sort=SOME_STRING_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v2.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/specification_section_revisions/%7Bid%7D/change_history?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&sort=SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/specification_section_revisions/%7Bid%7D/change_history?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&sort=SOME_STRING_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: added change history endpoint for specification section revisions
        description: List of change history for a Specification Section Revisions
        endpoint: GET /companies/{company_id}/projects/{project_id}/specification_section_revisions/{id}/change_history
        type: feature
        breaking: false
        datestamp: '2025-10-25'
        versions:
        - '2.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: specification-section-revisions?version=2.1#change-history-of-specification-section-revision
      - summary: added sort parameter to change history endpoint for specification section revisions
        description: 'Sort change history by created_at.

          To sort by created_at, add the following query parameter:

          `?sort=created_at`

          To sort by created_at in descending order, add the following query parameter:

          `?sort=-created_at`'
        endpoint: GET /companies/{company_id}/projects/{project_id}/specification_section_revisions/{id}/change_history
        type: feature
        breaking: false
        datestamp: '2025-11-12'
        versions:
        - '2.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: specification-section-revisions?version=2.1#change-history-of-specification-section-revision
      operationId: changeHistoryOfSpecificationSectionRevision
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
