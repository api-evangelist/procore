          content:
            application/json:
              schema:
                type: array
                description: Array of permission templates
                items:
                  type: object
                  properties:
                    filter_value:
                      type: integer
                      description: Permission template ID
                      example: 1
                    label:
                      type: string
                      description: Permission template name
                      example: General Contractor
