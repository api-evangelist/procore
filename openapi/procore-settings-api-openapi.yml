  /rest/v1.0/companies/{company_id}/settings/logo:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    put:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update company's logo
      description: Upload and set the company logo.
      tags:
      - Settings
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: type
        in: query
        required: false
        description: When set to `pcn`, updates the PCN company logo URL instead of the company icon.
        schema:
          type: string
          enum:
          - pcn
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  prostore_file_id:
                    type: integer
                    description: ID of an existing Prostore file to use as the company logo.
                    example: 123456
              - type: object
                properties:
                  filename:
                    type: string
                    description: Filename for the uploaded logo image.
                    example: company-logo.png
                  base64_image_data:
                    type: string
                    description: Base64-encoded image data, including the data URI prefix.
                    example: data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/
      responses:
        '200':
          description: Company logo updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logo_url:
                    type:
                    - string
                    - 'null'
                    description: URL of the company logo after the update.
                    example: https://storage.procore.com/companies/1/logo.png
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
