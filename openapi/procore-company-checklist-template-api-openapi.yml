  /rest/v1.0/companies/{company_id}/recycle_bin/checklist/list_templates/{id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      description: Company Checklist Template ID
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Show Recycled Company Checklist Template
      description: View the details of a Recycled Company Checklist Template
      tags:
      - Company Checklist Template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - title: Company Checklist Template
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the checklist template.
                      example: 142
                    name:
                      type: string
                      description: Name of the checklist template.
                      example: Window Inspection
                    description:
                      type: string
                      description: Description of the checklist template.
                      example: Checklist for windows
                    inspection_type:
                      type:
                      - object
                      - 'null'
                      title: Inspection Type
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the inspection type.
                          example: 142
                        name:
                          type: string
                          description: Name of the inspection type.
                          example: Safety Compliance
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp of creation
                          example: '2014-12-10T23:36:30Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp of last update
                          example: '2014-12-11T04:58:42Z'
                    trade:
                      type:
                      - object
                      - 'null'
                      title: Trade
                      properties:
                        id:
                          type: integer
                          description: Trade ID
                          example: 999
                        name:
                          type: string
                          description: Trade name
                          example: 09 - acoustical panels
                        active:
                          type: boolean
                          description: Trade availability
                          example: true
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp of last update to Trade
                          example: '2016-08-01T23:33:54Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp of creation
                      example: '2014-12-10T23:36:30Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp of last update
                      example: '2014-12-11T04:58:42Z'
                    broken_config:
                      type: boolean
                      description: Indicates whether the template has an invalid configuration because an item requirement or display condition references a response option or status that its response set does not provide. When true, update the affected items or response sets before using the template.
                      example: false
                - type: object
                  properties:
                    alternative_response_set_id:
                      type:
                      - integer
                      - 'null'
                      description: The ID of the associated Alternative Response Set (if null, the default response set is being used)
                      example: 12
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user who created the template.
                          example: 160586
                        login:
                          type: string
                          description: Email
                          example: exampleuser@example.com
                        name:
                          type: string
                          description: Name
                          example: Carl Contractor
                    attachments:
                      type: array
                      description: Attachments
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier for the attachment.
                            example: 5324
                          url:
                            type: string
                            description: URL of the attachment.
                            example: http://www.example.com/
                          filename:
                            type: string
                            description: Filename of the attachment.
                            example: january_receipt_copy.jpg
                    response_set:
                      title: ChecklistDefaultResponseSet
                      type: object
                      properties:
                        conforming_response:
                          type: string
                          description: Term used to represent conforming statuses on items within the current template, e.g. "Pass" or "Safe". This maps to an item status of "yes".
                          example: Pass
                        deficient_response:
                          type: string
                          description: Term used to represent deficient statuses on items within the current template, e.g. "Fail" or "At Risk".  This maps to an item status of "no".
                          example: Fail
                        global:
                          type: boolean
                          description: Represents whether a response set has been provided by Procore.
                          example: true
                    sections:
                      type: array
                      description: Sections
                      items:
                        allOf:
                        - title: Checklist Template Section
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Unique identifier for the checklist section.
                              example: 142
                            name:
                              type: string
                              description: Name of the checklist section.
                              example: Fall Protection and Perimeter Protection
                            position:
                              type: integer
                              description: Sort position of the section within its checklist template.
                              example: 2
                        - type: object
                          properties:
                            items:
                              type: array
                              items:
                                allOf:
                                - title: Checklist Template Item
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      description: Unique identifier for the checklist item.
                                      example: 2
                                    name:
                                      type: string
                                      description: Name of the checklist item.
                                      example: Item 1
                                    section_id:
                                      type: integer
                                      description: Checklist Template Section ID
                                      example: 21
                                    position:
                                      type: integer
                                      description: Sort position of the item within its section.
                                      example: 1
                                    response_set:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: ID of the response set
                                          example: 83
                                        name:
                                          type: string
                                          description: Name of the response set
                                          example: Safety Responses
                                        responses:
                                          type: array
                                          items:
                                            title: ChecklistResponse
                                            type: object
                                            properties:
                                              id:
                                                type: integer
                                                description: ID
                                                example: 1
                                              name:
                                                type: string
                                                description: The name of the Response
                                                example: Safe - Knowledge
                                              corresponding_status:
                                                type: string
                                                description: Corresponding Checklist Item status
                                                enum:
                                                - 'yes'
                                                - 'no'
                                                - n/a
                                                - none
                                                example: 'yes'
