  /rest/v2.0/companies/{company_id}/projects/{project_id}/materials_mgmt/materials/sync:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      tags:
      - Materials
      summary: Syncs Materials
      description: 'Creates or updates Materials identified using either ids or origin_ids.

        The maximum number of entities per request is 1000. Exceeding this limit will result in a 413 response.

        See https://developers.procore.com/documentation/using-sync-actions for more information.'
      operationId: Materials_SyncMaterials
      parameters:
      - name: company_id
        in: path
        description: The company identifier
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        description: The project identifier
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              maxItems: 1000
              type: array
              items:
                type: object
                properties:
                  id:
                    type:
                    - string
                    - 'null'
                    description: The Procore id of the resource. This should only be set when updating existing resources.
                    format: uuid
                  origin_id:
                    type:
                    - string
                    - 'null'
                    description: The origin id of the resource. If an entry is missing both id and origin_id, then that entry will always be interpreted as an insert.
                  origin_data:
                    type:
                    - string
                    - 'null'
                    description: The origin data for the resource. Procore does not interpret this value.
                  name:
                    type:
                    - string
                    - 'null'
                    description: The name of this material.
                  description:
                    type:
                    - string
