openapi: 3.2.0
info:
  title: Procore REST Document Controller V 1 Dot 1 API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: document-controller-v-1-dot-1
paths:
  /rest/v1.1/companies/{company_id}/projects/{project_id}/viewer_documents:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      tags:
      - document-controller-v-1-dot-1
      summary: Find or create an Annotated Document with markup context filtering
      description: Find or create an Annotated Document where markup may be added. Supports filtering by a single markup context (WORKFLOW, WORKSPACE, or PIN). When markup_context is PIN, pin_origin (WORKFLOW or WORKSPACE) is required. Pass markup_context=NO_CONTEXT to skip markup retrieval entirely and receive only the viewer document, document descriptor, and permissions.
      operationId: discoverOrCreateAnnotatedDocument_1
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: combined_xfdf
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: markup_context
        in: query
        required: false
        schema:
          type: string
      - name: pin_origin
        in: query
        required: false
        schema:
          type: string
      - name: layer_type
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                item_id:
                  type: string
                item_type:
                  type: string
                attachment_id:
                  type: string
                attachment_source:
                  type: string
                internal_pdm_tool_data:
                  type: object
                  properties:
                    file_key:
                      type: string
                    file_format:
                      type: string
                    file_locked:
                      type: boolean
                    document_container_id:
                      type: string
                    position_within_container:
                      type: string
              required:
              - item_id
              - item_type
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewer_doc_id:
                    type: string
                  markups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        xfdf_id:
                          type: string
                        markup_type:
                          type: string
                        viewer_doc_id:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        created_by_id:
                          type: string
                        updated_by_id:
                          type: string
                        company_id:
                          type: string
                        project_id:
                          type: string
                        deleted:
                          type: boolean
                        editable:
                          type: boolean
                        xfdf:
                          type: string
                        created_by_name:
                          type: string
                        updated_by_name:
                          type: string
                        created_by_vendor_id:
                          type: string
                        created_by_vendor_name:
                          type: string
                        page_number:
                          type: integer
                          format: int32
                        audit_transaction_timestamp:
                          type: string
                          format: date-time
                        markup_context:
                          type: string
                          enum:
                          - WORKFLOW
                          - WORKSPACE
                          - PIN
                          - NO_CONTEXT
                        group_id:
                          type: string
                        pin_id:
                          type: string
                        comment_id:
                          type: string
                        document:
                          type: object
                          properties:
                            external_document_id:
                              type: string
                            document_type:
                              type: string
                        markup_source:
                          type: string
                  combined_xfdf:
                    type: string
                  permissions:
                    type: object
                    properties:
                      file_locked:
                        type: boolean
                      allowed_actions:
                        type: array
                        items:
                          type: string
                  document:
                    type: object
                    properties:
                      external_document_id:
                        type: string
                      document_type:
                        type: string
      x-rate-limit-enabled: true
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'http://localhost:8080/rest/v1.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents',\n  qs: {\n    combined_xfdf: 'SOME_BOOLEAN_VALUE',\n    markup_context: 'SOME_STRING_VALUE',\n    pin_origin: 'SOME_STRING_VALUE',\n    layer_type: 'SOME_STRING_VALUE'\n  },\n  headers: {'content-type': 'application/json'},\n  body: {\n    item_id: 'string',\n    item_type: 'string',\n    attachment_id: 'string',\n    attachment_source: 'string',\n    internal_pdm_tool_data: {\n      file_key: 'string',\n      file_format: 'string',\n      file_locked: true,\n      document_container_id: 'string',\n      position_within_container: 'string'\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPConnection("localhost:8080")


          payload = "{\"item_id\":\"string\",\"item_type\":\"string\",\"attachment_id\":\"string\",\"attachment_source\":\"string\",\"internal_pdm_tool_data\":{\"file_key\":\"string\",\"file_format\":\"string\",\"file_locked\":true,\"document_container_id\":\"string\",\"position_within_container\":\"string\"}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents?combined_xfdf=SOME_BOOLEAN_VALUE&markup_context=SOME_STRING_VALUE&pin_origin=SOME_STRING_VALUE&layer_type=SOME_STRING_VALUE", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url 'http://localhost:8080/rest/v1.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents?combined_xfdf=SOME_BOOLEAN_VALUE&markup_context=SOME_STRING_VALUE&pin_origin=SOME_STRING_VALUE&layer_type=SOME_STRING_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"item_id\":\"string\",\"item_type\":\"string\",\"attachment_id\":\"string\",\"attachment_source\":\"string\",\"internal_pdm_tool_data\":{\"file_key\":\"string\",\"file_format\":\"string\",\"file_locked\":true,\"document_container_id\":\"string\",\"position_within_container\":\"string\"}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"http://localhost:8080/rest/v1.1/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents?combined_xfdf=SOME_BOOLEAN_VALUE&markup_context=SOME_STRING_VALUE&pin_origin=SOME_STRING_VALUE&layer_type=SOME_STRING_VALUE\"),\n    Content = new StringContent(\"{\\\"item_id\\\":\\\"string\\\",\\\"item_type\\\":\\\"string\\\",\\\"attachment_id\\\":\\\"string\\\",\\\"attachment_source\\\":\\\"string\\\",\\\"internal_pdm_tool_data\\\":{\\\"file_key\\\":\\\"string\\\",\\\"file_format\\\":\\\"string\\\",\\\"file_locked\\\":true,\\\"document_container_id\\\":\\\"string\\\",\\\"position_within_container\\\":\\\"string\\\"}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
