openapi: 3.2.0
info:
  title: Procore REST Payment Terms API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Payment Terms
paths:
  /rest/v2.0/companies/{company_id}/payment_terms:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: List Payment Terms
      description: Returns all company-level Payment Terms. Requires company payments read permission.
      tags:
      - Payment Terms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: 'Company-level payment term definition. Commitments reference this resource via payment_terms_id. The same term may be snapshotted onto invoices as an Invoice Payment Term.

                        '
                      properties:
                        id:
                          type: string
                          description: Unique identifier (UUID) for the payment term. Matches payment_terms_id on commitment contracts.
                          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        company_id:
                          type: string
                          description: Company ID that owns this payment term
                          example: '789'
                        name:
                          type: string
                          description: Display name of the payment term
                          example: Net 30
                        payment_term_type:
                          type: string
                          description: Type of payment term
                          enum:
                          - NET_DAYS_AFTER_SUBMISSION
                          - DISCOUNT_TERMS
                          - OWNER_FUNDING_RECEIVED
                          example: NET_DAYS_AFTER_SUBMISSION
                        net_days:
                          type:
                          - integer
                          - 'null'
                          description: Number of days after the qualifying event that payment is due
                          example: 30
                        discount_rate:
                          type:
                          - integer
                          - 'null'
                          description: Discount rate in basis points
                          example: 200
                        discount_valid_days:
                          type:
                          - integer
                          - 'null'
                          description: Number of days the discount remains valid after invoice submission
                          example: 10
                        discount_due_day_of_month:
                          type:
                          - integer
                          - 'null'
                          description: Day of the month the discount expires, for DISCOUNT_TERMS payment terms
                          example: 15
                        auto_expire_discount:
                          type: boolean
                          description: Whether the discount automatically expires once the due date passes
                          example: true
                        erp_id:
                          type:
                          - string
                          - 'null'
                          description: External ERP system identifier for this payment term, when configured
                          example: ERP-PT-100
                        active:
                          type: boolean
                          description: Whether the payment term is currently active and available for assignment
                          example: true
                        created_at:
                          type: string
                          format: date-time
                          description: Timestamp when the payment term was created
                          example: '2025-05-31T13:21:20Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Timestamp when the payment term was last updated
                          example: '2025-06-01T13:21:20Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
