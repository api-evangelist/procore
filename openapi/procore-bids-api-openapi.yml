openapi: 3.2.0
info:
  title: Procore REST Bids API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Bids
paths:
  /rest/v1.0/projects/{project_id}/bid_contacts:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Bid Contacts
      description: 'Get a list of all the contacts of a company or contacts of a perticular vendor of the company (with vendor_id as a parameter).


        See Filtering on List Actions for information on using the filtering capabilities provided by this endpoint.'
      tags:
      - Bids
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[created_at]
        in: query
        description: 'Return item(s) created within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[vendor_id]
        in: query
        description: Return item(s) with the specified Vendor IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[origin_id]
        in: query
        description: Origin ID. Returns item(s) with the specified Origin ID.
        required: false
        schema:
          type: string
      - name: filters[trade_id][]
        in: query
        description: Returns users whose vendor record is associated with the specified trade id(s).
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filters[search]
        in: query
        description: Return users where the search string matches the user's first name, last name, email address, keywords, job title, or company name
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Return items with the specified sort.
        required: false
        schema:
          type: string
          enum:
          - name
          - vendor_name
          - permission_template
          - full_name
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of company users
                items:
                  title: Company User
                  description: Company User
                  type: object
                  properties:
                    address:
                      description: User address
                      example: 6305 Carpinteria Ave
                      type:
                      - string
                      - 'null'
                    avatar:
                      description: User avatar url
                      example: http://s3.amazonaws.com/pro-core.com/prostore/20150713184222_production_74548228.gif?AWSAccessKeyId=0PFNH01C4MZVXKXZNK82&Expires=2067964943&Signature=l4zpZIM3bgxydrr4hn6lM%2FdtreQ%3D
                      type:
                      - string
                      - 'null'
                    business_id:
                      description: Business id
                      example: 89cac92d-fbd8-40ec-a1fc-24bbbd035a78
                      type:
                      - string
                      - 'null'
                    business_phone:
                      description: User business phone
                      example: 1-555-555-1234
                      type:
                      - string
                      - 'null'
                    business_phone_extension:
                      description: User business phone extension
                      example: 123
                      type:
                      - integer
                      - 'null'
                    city:
                      description: User city
                      example: Carpinteria
                      type:
                      - string
                      - 'null'
                    contact_id:
                      type: integer
                      description: User Contact ID
                      example: 1
                    country_code:
                      description: User country code (ISO-3166 Alpha-2 format)
                      example: US
                      type:
                      - string
                      - 'null'
                    created_at:
                      type: string
                      format: date-time
                      description: User created at
                      example: '2016-10-23T21:39:40Z'
                    email_address:
                      format: email
                      description: User email
                      example: jane.doe@example.com
                      type:
                      - string
                      - 'null'
                    email_signature:
                      description: User email signature
                      example: <p>Sent from Procore.</p>
                      type:
                      - string
                      - 'null'
                    employee_id:
                      description: User employee id
                      example: '123456789'
                      type:
                      - string
                      - 'null'
                    erp_integrated_accountant:
                      type: boolean
                      description: User ERP integrated accountant status
                      example: true
                    fax_number:
                      description: User fax number
                      example: 1-555-555-1234
                      type:
                      - string
                      - 'null'
                    first_name:
                      description: User first name
                      example: Jane
                      type:
                      - string
                      - 'null'
                    id:
                      type: integer
                      description: User id
                      example: 381006
                    initials:
                      description: User initials
                      example: JD
                      type:
                      - string
                      - 'null'
                    is_active:
                      description: User active status
                      example: true
                      type:
                      - boolean
                      - 'null'
                    is_employee:
                      description: User employee status
                      example: false
                      type:
                      - boolean
                      - 'null'
                    job_title:
                      description: User job title
                      example: QA Manager
                      type:
                      - string
                      - 'null'
                    last_activated_at:
                      format: date-time
                      description: User last activated at
                      example: '2016-06-30T20:41:58Z'
                      type:
                      - string
                      - 'null'
                    last_login_at:
                      format: date-time
                      description: User last login at
                      example: '2016-06-30T20:41:58Z'
                      type:
                      - string
                      - 'null'
                    last_name:
                      type: string
                      description: User last name
                      example: Doe
                    mobile_phone:
                      description: User mobile phone
                      example: 1-555-555-1234
                      type:
                      - string
                      - 'null'
                    name:
                      type: string
                      description: User full name
                      example: Jane Doe
                    notes:
                      description: User notes
                      example: notes
                      type:
                      - string
                      - 'null'
                    origin_id:
                      description: User origin id
                      example: foobar
                      type:
                      - string
                      - 'null'
                    origin_data:
                      description: User origin data
                      example: OD-2398273424
                      type:
                      - string
                      - 'null'
                    state_code:
                      description: User state code (ISO-3166 Alpha-2 format)
                      example: CA
                      type:
                      - string
                      - 'null'
                    updated_at:
                      type: string
                      format: date-time
                      description: User updated at
                      example: '2016-10-23T21:39:40Z'
                    welcome_email_sent_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: User welcome email sent at
                      example: '2013-05-30T20:41:58Z'
                    zip:
                      description: User zip code
                      example: '93013'
                      type:
                      - string
                      - 'null'
                    work_classification_id:
                      type:
                      - integer
                      - 'null'
                      description: Work classification id
                      example: 13
                    party_id:
                      type:
                      - integer
                      - 'null'
                      description: The Directory Party ID for this user, resolved via Contact → Person → Party. Null when the user has no associated person record. Use this ID when calling endpoints that require a party identifier (e.g. certification assignments).
                      example: 12345
                    permission_template:
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the Permission Template
                          example: 1
                        name:
                          type: string
                          description: The name of the Permission Template
                          example: General Contractor
                        project_specific:
                          type: boolean
                          description: If the Permission Template is project specific
                          example: true
                        type:
                          type: string
                          description: The type of the Permission Template
                          enum:
                          - company_tools
                          - global
                          - project_specific
                      type:
                      - object
                      - 'null'
                    company_permission_template:
                      properties:
                        id:
                          type: integer
                          description: Unique identifier for the Permission Template
                          example: 1
                        name:
                          type: string
                          description: The name of the Permission Template
                          example: General Contractor
                        project_specific:
                          type: boolean
                          description: If the Permission Template is project specific
                          example: true
                        type:
                          type: string
                          description: The type of the Permission Template
                          enum:
                          - company_tools
                          - global
                          - project_specific
                      type:
                      - object
                      - 'null'
                    vendor:
                      properties:
                        id:
                          type: integer
                          example: 161072
                        name:
                          type: string
                          example: SID Architecture
                      type:
                      - object
                      - 'null'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/bid_contacts',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[created_at]': 'SOME_STRING_VALUE',\n    'filters[updated_at]': 'SOME_STRING_VALUE',\n    'filters[vendor_id]': 'SOME_ARRAY_VALUE',\n    'filters[origin_id]': 'SOME_STRING_VALUE',\n    'filters[trade_id][]': 'SOME_ARRAY_VALUE',\n    'filters[search]': 'SOME_STRING_VALUE',\n    sort: 'SOME_STRING_VALUE'\n  },\n  headers: {Authorization: 'Bearer REPLACE_BEARER_TOKEN'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Authorization'': "Bearer REPLACE_BEARER_TOKEN" }


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/bid_contacts?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bvendor_id%5D=SOME_ARRAY_VALUE&filters%5Borigin_id%5D=SOME_STRING_VALUE&filters%5Btrade_id%5D%5B%5D=SOME_ARRAY_VALUE&filters%5Bsearch%5D=SOME_STRING_VALUE&sort=SOME_STRING_VALUE", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/bid_contacts?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bvendor_id%5D=SOME_ARRAY_VALUE&filters%5Borigin_id%5D=SOME_STRING_VALUE&filters%5Btrade_id%5D%5B%5D=SOME_ARRAY_VALUE&filters%5Bsearch%5D=SOME_STRING_VALUE&sort=SOME_STRING_VALUE' \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/bid_contacts?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bcreated_at%5D=SOME_STRING_VALUE&filters%5Bupdated_at%5D=SOME_STRING_VALUE&filters%5Bvendor_id%5D=SOME_ARRAY_VALUE&filters%5Borigin_id%5D=SOME_STRING_VALUE&filters%5Btrade_id%5D%5B%5D=SOME_ARRAY_VALUE&filters%5Bsearch%5D=SOME_STRING_VALUE&sort=SOME_STRING_VALUE\"),\n    Headers =\n    {\n        { \"Authorization\", \"Bearer REPLACE_BEARER_TOKEN\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Added party_id for List bid contacts
        description: 'The `party_id` field is now returned in the response body of the List bid

          contacts endpoint. `party_id` is the Directory Party ID for the user and is

          nullable for users without an associated person record.'
        endpoint: GET /projects/{project_id}/bid_contacts
        type: new
        breaking: false
        datestamp: '2026-08-10'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: bid-contacts?version=1.0#list-bid-contacts
      - summary: Added support to fetch bid contacts (i.e all the users of a company).
        description: 'Get a list of all the contacts of a company or contacts of a particular vendor of the company (with vendor_id as a parameter).

          See [Filtering on List Actions](https://developers.procore.com/documentation/filtering-on-list-actions) for information on using the filtering capabilities provided by this endpoint.'
        endpoint: GET /projects/{project_id}/bid_contacts
        type: new
        breaking: false
        datestamp: '2022-06-21'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: bid-contacts?version=1.0#list-bid-contacts
      operationId: listBidContacts
  /rest/v1.0/companies/{company_id}/planroom/bid_packages/{bid_package_id}/documents:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    - name: bid_package_id
      in: path
      description: Bid Package ID
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Gets documents attached to Bid Package
      description: Returns list of all documents attached to Bid Package, with meta information about all drawings and PDM (Project Document Management) attachments. Supports optional pagination and sorting for PDM attachments via query parameters.
      tags:
      - Bids
      parameters:
      - name: pdm_page
        in: query
        required: false
        description: Page number for paginating PDM attachments
        schema:
          type: integer
          minimum: 1
          example: 1
      - name: pdm_per_page
        in: query
        required: false
        description: Number of PDM attachments per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
      - name: pdm_sort_by
        in: query
        required: false
        description: Field to sort PDM attachments by
        schema:
          type: string
          enum:
          - document_revision_id
          - document_container_id
          - document_collection_id
          - created_at
          - updated_at
          default: document_revision_id
          example: created_at
      - name: pdm_sort_order
        in: query
        required: false
        description: Sort order for PDM attachments
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
          example: desc
      - name: pdm_search
        in: query
        required: false
        description: Search term to filter PDM attachments by document_revision_id
        schema:
          type: string
          example: 01HZ8K9M2N3P4Q5R6S7T8U9V0W
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Bid Package Documents
                properties:
                  id:
                    type: integer
                    description: ID
                    example: 101
                  title:
                    type: string
                    description: Bid package title
                    example: Floor Bid Package
                  files:
                    type: array
                    description: List of files, attached to the bid package
                    items:
                      type: object
                      properties:
                        size:
                          type: integer
                          description: Size of the file in bytes
                          example: 17656
                        file_path:
                          type: string
                          description: Name of the file (as would be presented in bid package zip)
                          example: Bid_Drawings/Current/123-Sample-Plans.pdf
                        s3_source:
                          type: string
                          description: URI, where the file is accessible at. Could have limited lifetime
                          example: https://storage.procore.com/us-east-1/pro-core.com/prostore/file.pdf?sig=deadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeaf
                        type:
                          type: string
                          description: type of the file
                          example: ZipManifests::BidDocsManifest::DrawingRevisionRow
                        drawing:
                          type: object
                          description: Metadata about drawing (if file is drawing)
                          properties:
                            dpi:
                              type: number
                              description: DPI of the drawing
                              example: 72
                            revision:
                              type: string
                              description: Revision property of the drawing
                              example: '0'
                            drawing_set_id:
                              type: number
                              description: ID of the drawing set
                              example: 9
                            drawing_id:
                              type: number
                              description: ID of the drawing
                              example: 309
                            width:
                              type: number
                              description: Width of the drawing, in pixels
                              example: 4000
                            height:
                              type: number
                              description: Height of the drawing, in pixels
                              example: 3000
                            png_s3_source:
                              type: string
                              description: URI, where the drawing, converted to PNG, is accessible at. Could have limited lifetime
                              example: https://storage.procore.com/us-east-1/pro-core.com/prostore/file.png?sig=deadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeaf
                            thumbnail_url:
                              type: string
                              description: URI, where the drawing's thumbnail is accessible at. Could have limited lifetime
                              example: https://storage.procore.com/us-east-1/pro-core.com/prostore/thumbnail.png?sig=deadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeafdeadbeaf
                        pdm:
                          type: object
                          description: Metadata about PDM (Project Document Management) attachment (if file is a PDM document)
                          properties:
                            id:
                              type: integer
                              description: ID of the PDM reference
                              example: 1
                            document_revision_id:
                              type: string
                              description: Document revision ID (ULID)
                              example: 01HZ8K9M2N3P4Q5R6S7T8U9V0W
                            document_container_id:
                              type: string
                              description: Document container ID (ULID)
                              example: 01HZ8K9M2N3P4Q5R6S7T8U9V0Y
                            document_collection_id:
                              type: string
                              description: Document collection ID (ULID)
                              example: 01HZ8K9M2N3P4Q5R6S7T8U9V0Z
                            document_revision:
                              type: object
                              description: Document revision data returned from Documents service
                              properties:
                                name:
                                  type: string
                                  description: Name of the document revision
                                  example: Sample Document.pdf
                                download_url:
                                  type: string
                                  description: URL to download the document revision
                                  example: https://document-service.example/rest/v1.0/companies/42/projects/42/document_revisions/01HZ8K9M2N3P4Q5R6S7T8U9V0W/download
                                file_locked:
                                  type: boolean
                                  description: Whether the document revision file is locked
                                  example: false
                                status:
                                  type: string
                                  description: Status of the document
                                  example: active
                                description:
                                  type: string
                                  description: Description of the document
                                  example: Sample document description
                                type:
                                  type: string
                                  description: Type of the document
                                  example: drawing
                                revision:
                                  type: string
                                  description: Revision number
                                  example: '1.0'
                                format:
                                  type: string
                                  description: File format
                                  example: pdf
                                original_filename:
                                  type: string
                                  description: Original filename
                                  example: Sample Document.pdf
                                file_size:
                                  type: string
                                  description: File size in bytes
                                  example: '1024'
                                originator:
                                  type: string
                                  description: Originator of the document
                                  example: John Doe
                                number:
                                  type: string
                                  description: Document number
                                  example: DOC-001
                                location:
                                  type: string
                                  description: Location of the document
                                  example: Site A
                                discipline:
                                  type: string
                                  description: Discipline of the document
                                  example: Architecture
                                date_authored:
                                  type: string
                                  description: Date the document was authored
                                  example: '2024-01-15'
                                version:
                                  type: string
                                  description: Version of the document revision
                                  example: '1.0'
                                uploaded_at:
                                  type: string
                                  description: Date the document was uploaded
                                  example: '2024-01-15'
                                permissions:
                                  type: object
                                  description: Permissions for the document revision
                                  properties:
                                    allowed_actions:
                                      type: array
                                      description: Allowed actions for the document revision
                                      items:
                                        type: string
                                      example:
                                      - view
                                      - download
                            attachment:
                              type:
                              - object
                              - 'null'
                              description: Attachment information for viewing the document
                              properties:
                                attached_to_item_id:
                                  type: string
                                  description: Document revision ID (ULID) - the document this attachment references
                                  example: 01K3VCBXQKG183X0SAASRVEZXF
                                attached_to_item_type:
                                  type: string
                                  description: Type of the item - always "document_management_document_revision" for PDM attachments
                                  example: document_management_document_revision
                                viewer_url:
                                  type: string
                                  description: URL to view the document in the document viewer
                                  example: /webclients/host/companies/8/projects/113050/tools/document-viewer/document_revision/01K3VCBXQKG183X0SAASRVEZXF?item_type=BidPackagePdmReference&item_id=5
                  pdm_pagination:
                    type: object
                    description: Pagination metadata for PDM attachments (only included when pagination parameters are provided)
