      summary: Update a Bid within a Company
      description: Update a Bid at a company level.
      tags:
      - Bids
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bid:
                  type: object
                  properties:
                    attachments_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: number
                            description: Attachment ID
                            example: 123
                          item_type:
                            type: string
                            description: Type of item attachment belongs to
                            example: Bid
                          prostore_file_id:
                            type: integer
                            description: prostore file ID
                            example: 1234
                          item_id:
                            type: integer
                            description: The ID of the item associated with the attachment
                            example: 5678
                          _destroy:
                            type: boolean
                            description: Set to true to delete the attachment
                            example: false
                    bidder_comments:
                      type: string
                      description: Comments
                      example: Test Bid Comment
                    bidder_exclusion:
                      type: string
                      description: Exclusions
                      example: Exclude Plumbing
                    bidder_id:
                      type: number
                      description: Bidder Login ID
                      example: 42
                    bidder_inclusion:
                      type: string
                      description: Inclusions
                      example: Include Concrete
                    bid_items_attributes:
                      type: array
                      items:
                        type: object
                        properties:
                          amount_in_cents:
                            type: number
                            description: Amount In Cents
                            example: 100000
                          bid_form_item_id:
                            type: number
                            description: Bid Form Item ID
                            example: 32780682
                          cost_code_id:
                            type: number
                            description: Cost Code ID
                            example: 32780682
                          id:
                            type: number
                            description: ID
                            example: 123124112
                          included:
                            type: boolean
                            description: Incldued
                            example: true
                          quantity:
                            type: string
                            description: Quantity
                            example: 15
                          unit_cost:
                            type: string
                            description: Unit Cost
                            example: 900
                          uom:
                            type: string
                            description: Unit of Measure
                            example: pounds
                    is_bidder_committed:
                      type: boolean
                      description: Bidder committed
                      example: true
                    lump_sum_amount:
                      type: number
                      description: Lump sum (overall) amount
                      format: float
                      example: 10000
                    submitted:
                      type: boolean
                      description: Vendor submitted Bid
                      example: true
                      default: false
                    uploads:
                      type: array
                      items:
                        type: object
                        properties:
                          uuid:
                            type: string
                            description: uuid of the upload
                            example: ab1fa9b8a1a4fc1ed7b6e2c64968ebe77729
                    bid_items_to_delete:
                      type: array
                      description: IDs of Bid Items that need to be deleted
                      example:
                      - 1234324
                      - 4992392
                      items:
                        type: integer
        required: true
      responses:
