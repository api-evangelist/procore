openapi: 3.2.0
info:
  title: Procore REST Generic Tool API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Generic Tool
paths:
  /rest/v1.0/companies/{company_id}/generic_tools:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Generic Tool
      description: 'Create a new Generic Tool in the specified Company.

        For more information on Generic Tool and Correspondence Tool endpoints,

        see Working with the Correspondence Tool.'
      tags:
      - Generic Tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - generic_tool
              properties:
                generic_tool:
                  title: The Generic Tool object
                  type: object
                  required:
                  - title
                  properties:
                    title:
                      type: string
                      description: The title of the generic tool.
                      example: My Custom Tool
                    abbreviation:
                      type: string
                      description: An abbreviation for the generic tool.
                      example: CT
                    private_by_default:
                      type: boolean
                      description: If this property is set to true, any items that are created for the tool are private by default.
                    new_project_default:
                      type: boolean
                      description: If this property is set to true, the generic tool will be added to new projects by default.
                    send_overdue_notifications:
                      type: boolean
                      description: If this property is set to true, notifications will be sent to assignees when an item is overdue.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for the generic tool.
                      example: 5324
                    domain_id:
                      type: integer
                      description: Unique identifier for the generic tool domain.
                      example: -5324
                    title:
                      type: string
                      description: Primary name/title for the generic tool.
                      example: Custom Tool
                - type: object
                  properties:
                    abbreviation:
                      type: string
                      description: Abbreviation for the Title. Will be used as a prefix for the Generic Tool Item number.
                      example: CT
                    private_by_default:
                      type: boolean
                      description: If true, items created in the tool are private by default.
                      example: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/generic_tools',\n  headers: {'content-type': 'application/json'},\n  body: {\n    generic_tool: {\n      title: 'My Custom Tool',\n      abbreviation: 'CT',\n      private_by_default: true,\n      new_project_default: true,\n      send_overdue_notifications: true\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"generic_tool\":{\"title\":\"My Custom Tool\",\"abbreviation\":\"CT\",\"private_by_default\":true,\"new_project_default\":true,\"send_overdue_notifications\":true}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.0/companies/%7Bcompany_id%7D/generic_tools", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/generic_tools \\\n  --header 'content-type: application/json' \\\n  --data '{\"generic_tool\":{\"title\":\"My Custom Tool\",\"abbreviation\":\"CT\",\"private_by_default\":true,\"new_project_default\":true,\"send_overdue_notifications\":true}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/generic_tools\"),\n    Content = new StringContent(\"{\\\"generic_tool\\\":{\\\"title\\\":\\\"My Custom Tool\\\",\\\"abbreviation\\\":\\\"CT\\\",\\\"private_by_default\\\":true,\\\"new_project_default\\\":true,\\\"send_overdue_notifications\\\":true}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: createGenericTool
