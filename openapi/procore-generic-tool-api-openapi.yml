                    type: string
                    description: Primary name/title for the generic tool.
                    example: Custom Tool
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
