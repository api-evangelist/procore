openapi: 3.2.0
info:
  title: Procore REST Drawings API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Drawings
paths:
  /rest/v1.0/projects/{project_id}/drawing_areas:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List drawing areas
      description: Returns a list of all Drawing Areas in the specified Project.
      tags:
      - Drawings
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[exclude_empty_connected]
        in: query
        description: 'When `true`, excludes connected drawing areas with no active revisions.

          Example: `filters[exclude_empty_connected]=true`'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of drawing areas
                items:
                  type: object
                  description: Drawing Area
                  title: DrawingArea
                  properties:
                    id:
                      type: integer
                      description: Drawing Area ID
                      example: 1
                    name:
                      type: string
                      description: Drawing Area name
                      example: Building A
                    drawings_count:
                      type: integer
                      description: Amount of Drawings
                      example: 3
                    description:
                      type: string
                      description: Drawing Area Description
                      example: East Hall
                    drawing_sets:
                      type: array
                      description: Array of Drawing Sets
                      items:
                        type: object
                        title: DrawingSet
                        description: Drawing Set
                        properties:
                          id:
                            type: integer
                            description: Drawing Set ID
                            example: 268062
                          project_id:
                            type: integer
                            description: Drawing Set project ID
                            example: 225096
                          name:
                            type: string
                            description: Drawing Set name
                            example: another new drawing set
                          created_at:
                            type: string
                            format: date-time
                            description: Drawing Set created at
                            example: '2016-09-01T20:02:27Z'
                          updated_at:
                            type: string
                            format: date-time
                            description: Drawing Set updated at
                            example: '2016-09-01T20:02:27Z'
                          date:
                            type: string
                            format: date
                            description: Drawing Set date
                            example: '2016-08-31'
                          position:
                            type: integer
                            description: Drawing Set position
                            example: 1
                          drawing_revisions_count:
                            type: integer
                            description: Amount of Drawing Revisions
                            example: 3
                    drawing_disciplines:
                      type: array
                      description: Array of Drawing Disciplines
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Drawing Discipline ID
                            example: 6739
                          name:
                            type: string
                            description: Drawing Discipline name
                            example: Architectural
                          position:
                            type: integer
                            description: Drawing Discipline position
                            example: 1
                    created_at:
                      type: string
                      format: date-time
                      description: Drawing Area created at
                      example: '2015-03-19T12:00:00Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Drawing Area updated at
                      example: '2015-03-19T12:00:00Z'
                    deletable:
                      type: boolean
                      description: Whether the Drawing Area can be deleted.
                      example: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
