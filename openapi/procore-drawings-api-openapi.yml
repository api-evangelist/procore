      x-changelog:
      - summary: Added exclude_empty_connected filter
        description: Added support for `filters[exclude_empty_connected]=true` on the drawing areas index route to exclude connected drawing areas that have no active revisions.
        endpoint: GET /projects/{project_id}/drawing_areas
        type: feature
        breaking: false
        datestamp: '2026-03-31'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: drawing-areas?version=1.0#list-drawing-areas
      - summary: Updated response
        description: Updated index route to include created_at, updated_at, and deletable.
        endpoint: GET /projects/{project_id}/drawing_areas
        type: new
        breaking: false
        datestamp: '2025-10-03'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: drawing-areas?version=1.0#list-drawing-areas
      - summary: Added GET view param
        description: Added support for `mfe` view param, which will solely support the Drawings Micro Frontend Application
        endpoint: GET /projects/{project_id}/drawing_areas
        type: new
        breaking: false
        datestamp: '2026-03-13'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: drawing-areas?version=1.0#list-drawing-areas
      - summary: Added latest_revision_update to mfe view
        description: Added `latest_revision_update` field to the mfe view response. Returns the timestamp of the most recent revision update in the drawing area, or the area's own updated_at if no revisions exist.
        endpoint: GET /projects/{project_id}/drawing_areas
        type: feature
        breaking: false
        datestamp: '2026-03-17'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: drawing-areas?version=1.0#list-drawing-areas
      - summary: Fixed drawing_disciplines in response
        description: A drawing area now only lists disciplines that have at least one active revision in that area.
        endpoint: GET /projects/{project_id}/drawing_areas
        type: fix
        breaking: false
        datestamp: '2026-07-16'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: drawing-areas?version=1.0#list-drawing-areas
      - summary: Fixed drawing_disciplines to list only published drawings
        description: A drawing area's `drawing_disciplines` now only lists disciplines that have at least one published, non-obsolete drawing in that area. Disciplines whose only drawings in the area are unreviewed, reviewed but not yet published, or obsolete are no longer listed. The response schema is unchanged.
        endpoint: GET /projects/{project_id}/drawing_areas
        type: fix
        breaking: false
        datestamp: '2026-09-29'
        versions:
        - '1.0'
        - '1.1'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: drawing-areas?version=1.0#list-drawing-areas
