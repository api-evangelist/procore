        in: query
        description: 'Filter by Drawing Set.

          To retreive revisions from current set add `drawing_set_id=current_set` to query'
        schema:
          type: integer
      - name: id
        in: query
        description: 'Filter by Drawing Revision ID

          To request specific drawing revision ids add `id[]=42&id[]=43` to query'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[ids]
        in: query
        description: 'Filter by Drawing Revisions ID

          To request specific drawing revision ids add `filters[ids]=[1,2,3]` to filters'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[deleted]
        in: query
        description: Include deleted drawing revisions. Deleted drawing revisions are filtered by default.
        required: false
        schema:
          type: string
          enum:
          - only
          - with
      - name: filters[viewer_experience]
        in: query
        description: 'Return only drawing revisions confirmed under the given viewer experience.

          Combine with `filters[deleted]=only` to split the Recycle Bin into legacy

          and unified revisions. A value other than `legacy` or `unified` is ignored

          and the filter is not applied.'
        required: false
        schema:
          type: string
          enum:
          - legacy
          - unified
      - name: is_reviewed
        in: query
        description: Filter by `reviewed` status
        schema:
          type: boolean
      - name: query
        in: query
        description: Filter by custom query
        schema:
          type: string
      - name: with_obsolete
        in: query
        description: Include obsolete drawing revisions. Obsolete drawing revisions are filtered by default.
        schema:
          type: boolean
      - name: sort
        in: query
        description: Sort by field. Prefix the sort key with `-` for descending order (e.g. `-drawing_number`). Multiple comma-separated sort keys are supported and applied in order. In addition to the fixed keys below, drawing revisions can be sorted by custom fields using the `custom_field_<id>` key format, where `<id>` is the custom field definition id (e.g. `custom_field_42`). Unknown or unsupported sort keys (including invalid custom field keys) are ignored; the endpoint falls back to the default sort order and returns HTTP 200. `number` and `revision` are accepted as legacy aliases of `drawing_number` and `revision_number`.
        required: false
        schema:
          type: string
          enum:
          - id
          - -id
          - created_at
          - deleted_at
          - drawing_number
          - number
          - title
          - drawing_date
          - received_date
          - status
          - revision_number
          - revision
          - drawing_set
          - sheet_number
          - obsolete
      - name: view
        in: query
