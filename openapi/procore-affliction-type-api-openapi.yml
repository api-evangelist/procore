  /rest/v1.0/companies/{company_id}/incidents/affliction_types/bulk_update:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Bulk Update Affliction Types
      description: Update multiple Affliction Types with one request.
      tags:
      - Affliction Type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - affliction_type
              properties:
                affliction_type:
                  type: object
                  description: IDs of all Affliction Types specified for bulk update
                  properties:
                    ids:
                      type: array
                      items:
                        type: integer
                        description: Identifier of an affliction type to include in the bulk update.
                        example: 435
                    active:
                      type: boolean
                      description: Flag that denotes if the Affliction Types are available for use
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Affliction Type
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this affliction type.
                      example: 999
                    name:
                      type: string
                      description: Display name of the affliction type, localized to the requester's language preference.
                      example: Sprain
                    name_key:
                      type: string
                      description: Untranslated key for the affliction type name. Use this value for programmatic comparisons rather than the localized name field.
                      example: Sprain
                    active:
                      type: boolean
                      description: Indicates whether this affliction type is available for selection when recording injuries. Inactive types are hidden from end users.
                      example: true
                    global:
                      type: boolean
                      description: Indicates whether this affliction type is a Procore-provided default. Global types cannot have their names changed.
                      example: true
                    created_at:
                      type: string
                      description: ISO 8601 timestamp of when this affliction type was created.
                      format: date-time
                      example: '2016-10-25T17:53:35Z'
                    updated_at:
                      type: string
                      description: ISO 8601 timestamp of the most recent update to this affliction type.
                      format: date-time
                      example: '2016-10-25T17:53:35Z'
        '400':
          description: Bad Request
          content:
