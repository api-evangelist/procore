openapi: 3.2.0
info:
  title: Procore REST Coordination Issue Templates API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Coordination Issue Templates
paths:
  /rest/v2.0/companies/{company_id}/projects/{project_id}/coordination_issues/templates/picker:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      operationId: listCoordinationIssueTemplatePicker
      tags:
      - Coordination Issue Templates
      summary: List active templates for the issue creation picker (REST v2.0)
      description: 'Returns a paginated list of active coordination issue templates suitable for the issue creation

        picker UI. Templates are sorted by abbreviation ascending.


        Response includes a `recent` array of up to 5 templates recently used by the current user

        (based on the most recent coordination issues they created with a template).


        Use the `search` parameter to filter templates by abbreviation or title (case-insensitive partial match).'
      parameters:
      - name: search
        in: query
        required: false
        description: 'Case-insensitive partial match against template `abbreviation` or `title` (from `issue_details`).

          '
        schema:
          type: string
          example: MEP
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: OK — paginated active templates plus recently used templates
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: 'Streamlined template representation for the issue creation picker.

                        Default view returns id, abbreviation, title, is_active, and category.

                        Detail view adds a `fields` array with enriched label/value pairs.

                        '
                      properties:
                        id:
                          type: string
                          example: '1'
                          description: Template ID.
                        abbreviation:
                          type: string
                          description: Template abbreviation code (e.g. "MEP", "STR").
                        title:
                          type:
                          - string
                          - 'null'
                          description: Title from the template's `issue_details` (may be null if not set).
                        is_active:
                          type: boolean
                          description: Whether the template is active. Picker only returns active templates.
                        category:
                          type:
                          - object
                          - 'null'
                          description: Template category (from `TemplateCategoryBlueprint`). Null if no category assigned.
                          properties:
                            id:
                              type: string
                              example: '10'
                              description: Category ID.
                            name:
                              type: string
                              description: Category name.
                            project_id:
                              type:
                              - string
                              - 'null'
                              example: '1'
                              description: Project ID if project-scoped; null for company-level categories.
                            scope:
                              type: string
                              enum:
                              - company
                              - project
                              description: Whether the category is company-level or project-level.
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                  recent:
                    type: array
                    description: Up to 5 recently used templates by the current user (id + abbreviation only).
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: '1'
                          description: Template ID.
                        abbreviation:
                          type: string
                          description: Template abbreviation code.
              example:
                data:
                - id: '1'
                  abbreviation: MEP
                  title: MEP Clash
                  is_active: true
                  category:
                    id: '10'
                    name: Mechanical
                    project_id: null
                    scope: company
                    created_at: '2026-06-01T00:00:00Z'
                    updated_at: '2026-06-01T00:00:00Z'
                recent:
                - id: '1'
                  abbreviation: MEP
                - id: '3'
                  abbreviation: STR
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden — requires view_coordination_issue permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/coordination_issues/templates/picker',\n  qs: {search: 'MEP', page: 'SOME_INTEGER_VALUE', per_page: 'SOME_INTEGER_VALUE'},\n  headers: {'Procore-Company-Id': 'SOME_STRING_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Procore-Company-Id'': "SOME_STRING_VALUE" }


          conn.request("GET", "/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/coordination_issues/templates/picker?search=MEP&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/coordination_issues/templates/picker?search=MEP&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE' \\\n  --header 'Procore-Company-Id: SOME_STRING_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/coordination_issues/templates/picker?search=MEP&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n    Headers =\n    {\n        { \"Procore-Company-Id\", \"SOME_STRING_VALUE\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
  /rest/v2.0/companies/{company_id}/projects/{project_id}/coordination_issues/templates/picker/{template_id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: string
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: string
    - name: template_id
      in: path
      required: true
      description: Coordination Issue Template ID (numeric).
      schema:
        type: string
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      operationId: showCoordinationIssueTemplatePickerDetail
      tags:
      - Coordination Issue Templates
      summary: Show template detail for the issue creation picker (REST v2.0)
      description: 'Returns a single active template with enriched issue details. The `fields` array contains

        label/value pairs for all non-title, non-custom-field keys in `issue_details`, with values

        resolved to display names (e.g., location name instead of location ID).


        Used to preview template defaults before creating a coordination issue.'
      responses:
        '200':
          description: OK — template with enriched detail fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                    - type: object
                      description: 'Streamlined template representation for the issue creation picker.

                        Default view returns id, abbreviation, title, is_active, and category.

                        Detail view adds a `fields` array with enriched label/value pairs.

                        '
                      properties:
                        id:
                          type: string
                          example: '1'
                          description: Template ID.
                        abbreviation:
                          type: string
                          description: Template abbreviation code (e.g. "MEP", "STR").
                        title:
                          type:
                          - string
                          - 'null'
                          description: Title from the template's `issue_details` (may be null if not set).
                        is_active:
                          type: boolean
                          description: Whether the template is active. Picker only returns active templates.
                        category:
                          type:
                          - object
                          - 'null'
                          description: Template category (from `TemplateCategoryBlueprint`). Null if no category assigned.
                          properties:
                            id:
                              type: string
                              example: '10'
                              description: Category ID.
                            name:
                              type: string
                              description: Category name.
                            project_id:
                              type:
                              - string
                              - 'null'
                              example: '1'
                              description: Project ID if project-scoped; null for company-level categories.
                            scope:
                              type: string
                              enum:
                              - company
                              - project
                              description: Whether the category is company-level or project-level.
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                    - type: object
                      properties:
                        fields:
                          type: array
                          description: 'Enriched issue detail fields (excludes title and custom fields).

                            Each item is a label/value pair where the value is resolved to a display name.

                            '
                          items:
                            type: object
                            properties:
                              label:
                                type: string
                                description: Human-readable field label (e.g. "Location", "Assignee").
                              value:
                                oneOf:
                                - type: string
                                - type: array
                                  items:
                                    type: string
                                description: Resolved display value(s) for the field.
              example:
                data:
                  id: '1'
                  abbreviation: MEP
                  title: MEP Clash
                  is_active: true
                  category:
                    id: '10'
                    name: Mechanical
                    project_id: null
                    scope: company
                    created_at: '2026-06-01T00:00:00Z'
                    updated_at: '2026-06-01T00:00:00Z'
                  fields:
                  - label: Location
                    value: Level 2
                  - label: Assignee
                    value: Jane Smith
                  - label: Priority
                    value: High
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
