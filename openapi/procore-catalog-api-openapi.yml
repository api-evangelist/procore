        type: integer
    x-compliance-level: full
    get:
      tags:
      - Catalog
      summary: Get Catalogs
      description: Returns all Cost Catalogs.
      operationId: Catalog_GetCatalog
      parameters:
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
        x-position: 1
        required: false
      - name: per_page
        in: query
        description: Items per page
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
        x-position: 2
        required: false
      - name: company_id
        in: path
        required: true
        description: Unique company identifier associated with the Procore User Account.
        schema:
          type: string
        x-position: 3
      responses:
        '200':
          description: ''
          headers:
            Total:
              description: Total number of items
              schema:
                type: integer
            Per-Page:
              description: Number of items per page
              schema:
                type: integer
            Link:
              description: Links to other pages
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    type:
                    - array
                    - 'null'
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type:
                          - string
                          - 'null'
                        id:
                          type:
                          - string
                          - 'null'
                        custom:
                          type: boolean
                        sealed:
                          type: boolean
                        catalogs:
                          type:
                          - array
                          - 'null'
                          description: Sub Catalogs
                          items:
                            type: object
                            description: A catalog entry without nested sub catalogs.
                            additionalProperties: false
                            properties:
                              name:
                                type:
                                - string
                                - 'null'
                              id:
                                type:
                                - string
                                - 'null'
                              custom:
                                type: boolean
                              sealed:
                                type: boolean
      x-doc:
        stage: ga
        visibility: public
        exposure: public
      x-changelog:
      - summary: Introducing new endpoint to get all Cost Catalogs
        description: This endpoint allows retrieving all Cost Catalogs.
