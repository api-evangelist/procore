                      example: '2019-09-20'
                    updated_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: Timestamp when the lien waiver was last updated, in ISO 8601 format. Null if the waiver has not been updated since creation.
                      example: '2019-09-20T12:42:00Z'
                    waiver_created:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      description: Timestamp when the lien waiver was created, in ISO 8601 format. Null if unavailable.
                      example: '2019-09-20T12:42:00Z'
                    locked:
                      type: boolean
                      description: Whether the signed lien waiver is locked from the general contractor's view. Unconditional waivers remain locked until released via the unlock endpoint.
                      example: true
