openapi: 3.2.0
info:
  title: Procore Rest API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Rest
paths:
  /rest/v1.0/projects/{project_id}/rfis/{id}/advanced_exports:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    - name: id
      in: path
      description: RFI ID
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Advanced Export for Existing RFI
      description: Request an advanced export for an existing RFI. Specify which kind of cover sheet you'd like, if one at all, and which associated attachments with the RFI you'd like included in the export. Specify whether you'd like the export to be in PDF or ZIP format at the tail end of the URL request.
      parameters:
      - name: format
        in: query
        description: Output format for the generated export. Pass as a query string parameter when posting to this endpoint.
        required: true
        schema:
          type: string
          enum:
          - pdf
          - zip
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - options
              properties:
                options:
                  type: object
                  properties:
                    cover_sheet:
                      type: string
                      description: Which version of the response cover sheet to include in the export. Omit to include no cover sheet.
                      enum:
                      - all_responses
                      - official_responses_only
                      example: all_responses
                    files:
                      type: array
                      description: Array of attachment IDs to include in the export. IDs correspond to the `id` values in the GET response's `options` array for prostore file option sets. Pass an empty array to include no attachments.
                      example:
                      - 3453247
                      - 6543893
                      - 3476145
                      items:
                        type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Confirmation message. The export is processed asynchronously; the compiled file is delivered by email when ready.
                    example: Success! You'll receive an email with the file when we're done.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports',\n  qs: {format: 'SOME_STRING_VALUE'},\n  headers: {'content-type': 'application/json'},\n  body: {options: {cover_sheet: 'all_responses', files: [3453247, 6543893, 3476145]}},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"options\":{\"cover_sheet\":\"all_responses\",\"files\":[3453247,6543893,3476145]}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports?format=SOME_STRING_VALUE", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports?format=SOME_STRING_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"options\":{\"cover_sheet\":\"all_responses\",\"files\":[3453247,6543893,3476145]}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/rfis/%7Bid%7D/advanced_exports?format=SOME_STRING_VALUE\"),\n    Content = new StringContent(\"{\\\"options\\\":{\\\"cover_sheet\\\":\\\"all_responses\\\",\\\"files\\\":[3453247,6543893,3476145]}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: createAdvancedExportForExistingRfi
      tags:
      - Rest
  /rest/v1.0/bim_file_extractions:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List BIM File Extractions
      description: 'Return a list of all BIM File Extractions

        A BIM File Extraction can fail for several reasons. When it does, the errors attribute contains a list of errors encountered while processing the model. The following table lists the possible error codes and types.


        #### Error Types


        | Code | Type |

        |------|------------------------|

        | 1 | Undefined |

        | 2 | NetworkErr |

        | 3 | ServerErr |

        | 4 | JsonParseErr |

        | 5 | TokenExpiredErr |

        | 6 | FileOpenErr |

        | 7 | FileWriteErr |

        | 8 | FileCompressionErr |

        | 9 | FileUploadError |

        | 10 | ModelReadErr |

        | 11 | ModelFileSizeErr |

        | 12 | ModelExportErr |

        | 13 | ModelEmptyDBErr |

        | 14 | ModelViewpointErr |

        | 15 | ModelErr |

        | 16 | InvalidStatusError |

        | 17 | FileDecompressionErr |

        | 18 | UnsupportedFileFormat |

        | 19 | No3DGeometry |

        | 20 | InvalidInputError |

        | 21 | UnsupportedFileSource |

        | 22 | MeshNodeLimitError |

        | 23 | RateLimitExhausted |

        | 24 | ODAGenericError |

        | 25 | FileUploadFasError |'
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[id]
        in: query
        description: Return item(s) with the specified IDs.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filters[status]
        in: query
        description: Filter item(s) with matching status
        schema:
          type: string
      - name: filters[extraction_format]
        in: query
        description: Filter item(s) with matching extraction format
        schema:
          type: array
          items:
            type: string
            enum:
            - MobileFormat
            - WebFormat
            - Properties
            - ObjectSearch
            example: WebFormat
      - name: filters[bim_file_id]
        in: query
        description: Return item(s) with the specified bim_file_id in bim_file_upload
        schema:
          type: array
          items:
            type: integer
      - name: filters[bim_file_upload_id]
        in: query
        description: Return item(s) with the specified bim_file_upload_id
        schema:
          type: array
          items:
            type: integer
      - name: filters[file_version_id]
        in: query
        description: Return item(s) with the specified file_version_id in bim_file_upload
        schema:
          type: array
          items:
            type: integer
      - name: filters[document_upload_id]
        in: query
        description: Return item(s) with the specified document_upload_id in bim_file_upload
        schema:
          type: array
          items:
            type: string
      - name: filters[document_revision_id]
        in: query
        description: Return item(s) with the specified document_revision_id in bim_file_upload
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of BIM File Extractions
                items:
                  type: object
                  title: BIM File Extraction
                  properties:
                    id:
                      type: integer
                      description: ID
                      example: 206
                    parent_bim_file_extraction_id:
                      type: integer
                      description: ID of the parent BIM File Extraction
                      example: 138
                    bim_file_upload_id:
                      type: integer
                      description: ID of the uploaded BIM File
                      example: 198
                    bim_file_upload:
                      type: object
                      title: BIM File upload
                      properties:
                        id:
                          type: integer
                          description: ID
                          example: 198
                        bim_file_id:
                          type:
                          - integer
                          - 'null'
                          description: ID of the associated BIM File
                          example: 51
                        document_upload_id:
                          type:
                          - integer
                          - 'null'
                          description: ID of the associated Document Upload
                          example: 01AABBCCDDEEFFGGHHIIJJKKL
                        file_version:
                          type:
                          - object
                          - 'null'
                          properties:
                            id:
                              type: integer
                              description: ID of the associated Document
                            file_id:
                              type: integer
                              description: ID of the associated Folder File
                        attachment:
                          type: object
                          properties:
                            id:
                              type: integer
                            content_type:
                              type: string
                            name:
                              type: string
                            url:
                              type: string
                            size:
                              type: number
                        created_by:
                          allOf:
                          - type: object
                            description: Login Information
                            properties:
                              id:
                                type: integer
                                description: Login Information ID
                                example: 1738090
                              company_name:
                                type:
                                - string
                                - 'null'
                                description: User Company name
                                example: Builders Inc.
                              name:
                                type: string
                                description: User name
                                example: John Doe
                              locale:
                                type:
                                - string
                                - 'null'
                                description: User dictionary
                                example: ko
                          - type: object
                            properties:
                              login:
                                type: string
                                description: User email
                                example: johndoe@example.com
                        created_at:
                          type: string
                          format: date-time
                          description: Created date
                          example: '2020-07-26T11:15:00Z'
                        updated_at:
                          type: string
                          format: date-time
                          description: Updated date
                          example: '2020-07-26T11:15:00Z'
                        metadata:
                          type:
                          - object
                          - 'null'
                          description: Meta data
                          properties:
                            linked_files:
                              type: array
                              description: Array of linked files
                              items:
                                type: object
                                description: Linked file
                                properties:
                                  name:
                                    type: string
                                    description: Name of linked file
                                    example: abc.ext
                                  saved_path:
                                    type: string
                                    description: Path of linked file
                                    example: 24-RD_03-ATL-PUB-R21_NoGeometry.rvt
                                  path_type:
                                    type: string
                                    description: Type of path
                                    example: relative
                            drawing_sheets:
                              type: array
                              description: Array of drawing sheets
                              items:
                                type: object
                                description: Drawing sheet
                                properties:
                                  name:
                                    type: string
                                    description: Name of drawing sheet
                                    example: ABC_LEVEL_1
                            file_type:
                              type: string
                              enum:
                              - 2d
                              - 3d
                              description: File Type (either 2d or 3d)
                              example: 3d
                    bim_model_revision_id:
                      type:
                      - integer
                      - 'null'
                      description: ID of the BIM Model Revision
                      example: 116
                    status:
                      type: string
                      description: Extraction Status
                      example: ready
                    progress:
                      type: number
                      description: Progress of overall extraction taking into account the individual extraction items
                      example: 46.5
                    retry_count:
                      type: integer
                      description: No. of retries performed on the extraction
                      example: 2
                    viewpoint_id:
                      type: integer
                      description: ID of the BIM Viewpoint
                      example: 781
                    extraction_format_requests:
                      type: array
                      description: Array of items indicating formats of items requested to be extracted
                      items:
                        type: object
                        title: BIM File Extraction Item Type
                        properties:
                          type:
                            type: string
                            description: Extraction type
                            example: MobileFormat
                    extraction_items:
                      type: array
                      description: An array of items extracted from a 3d model
                      items:
                        type: object
                        title: BIM File Extraction Item
                        properties:
                          id:
                            type: integer
                            description: ID
                            example: 226
                          bim_file_extraction_id:
                            type: integer
                            description: BIM File extraction ID
                            example: 206
                          item_type:
                            type: string
                            description: Extraction type
                            example: MobileFormat
                            enum:
                            - Grid
                            - MobileFormat
                            - Properties
                            - WebFormat
                            - ObjectSearch
                            - ViewpointCollection
                          progress:
                            type: number
                            description: Extraction progress
                            example: 15.6
                          artifact:
                            type: object
                            description: Artifact extracted from a 3d model. Only one of grid, mobile_format, properties, web_format, ifc, object_search, and viewpoint_collection will have data associated to the artifact extracted
                            properties:
