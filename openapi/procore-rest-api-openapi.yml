                        example: Workflow for Subcontracts < 10M
                      class_name:
                        type: string
                        description: Class Name
                        example: WorkOrderContract
                      friendly_name:
                        type:
                        - string
                        - 'null'
                        description: Localized human-readable name of the workflowed object's type. Uses the same `views.workflow` catalog as Workflow Config / the legacy settings tab (parameterized from the model's `friendly_name`), and falls back to the raw friendly name when no translation exists.
                        example: Contract
