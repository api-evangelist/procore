                    description: Workflow State
                    properties:
                      id:
                        type: integer
                        description: ID
                        example: 43584
                      name:
                        type: string
                        description: Name
                        example: Under Review
                      status:
                        type: string
                        description: Human-readable status. In the Show response (GET /workflow_instances/{id}) this uses the workflowed object's status text when available, otherwise the workflow state's status. The list endpoint returns the workflow state's status.
                        example: Draft
                      ball_in_court:
                        type: array
