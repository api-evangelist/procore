    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Workflow Activity Histories
      description: 'Return a list of activities performed for a workflow instance.


        Identify the instance with `workflow_instance_id`, or with both `filters[workflowed_object_type]` and `filters[workflowed_object_id]` (the same object addressing used by Legacy Workflow Permanent Logs and Workflow Setup). When `workflow_instance_id` is present it is used and the object filters are ignored. Change-order object types also require `project_id`.'
      parameters:
      - name: workflow_instance_id
        in: query
        description: Workflow Instance ID. Required unless both `filters[workflowed_object_type]` and `filters[workflowed_object_id]` are provided.
        required: false
        schema:
          type: integer
      - name: filters[workflowed_object_type]
        in: query
        description: Tool or V1 class name of the workflowed object. Used with `filters[workflowed_object_id]` to locate the instance when `workflow_instance_id` is omitted.
        required: false
        schema:
          type: string
      - name: filters[workflowed_object_id]
        in: query
        description: ID of the workflowed object. Used with `filters[workflowed_object_type]` to locate the instance when `workflow_instance_id` is omitted.
        required: false
        schema:
          type: integer
      - name: project_id
        in: query
        description: Project ID. Required when locating the instance with a change-order `filters[workflowed_object_type]` and no `workflow_instance_id`.
        required: false
        schema:
          type: integer
      - name: company_id
        in: query
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: sort
        in: query
        description: Sort attribute. Prefix with `-` for descending order. Omit to keep the default ascending primary-key order. Use `sort=-created_at` for newest-first pagination (for example, panel "Show more" loads of older history).
        schema:
          type: string
          enum:
          - created_at
          - -created_at
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Workflow Activity History
                  properties:
                    id:
                      type: integer
                      description: ID
                      example: 43584
                    attachments:
                      type: array
                      description: List of Attachment URLs
                      items:
                        type: string
                        description: URL
                        example: http://www.example.com/
                    file_attachments:
                      type: array
                      description: List of file attachments with their identifying metadata
                      items:
                        type: object
                        description: File Attachment
                        properties:
                          id:
                            type: integer
                            description: Prostore File ID
                            example: 12334
                          name:
                            type: string
                            description: File name
                            example: doc.pdf
                          url:
                            type: string
                            description: File download URL
                            example: http://www.example.com/
                    assigned_to_id:
                      type: integer
                      description: Login Information ID of the user the activity is assigned to.
                      example: 12345
                    assigned_to_name:
                      type: string
                      description: Full Name of Contact for the assigned Login Information
                      example: Rahul Sharma
                    bic_duration:
                      type: string
                      description: Ball In Court duration in days
                      example: 2 days
                    bic_start:
                      type: string
                      format: date-time
                      description: Ball In Court started at
                      example: '2017-10-23T21:39:40Z'
                    bic_end:
