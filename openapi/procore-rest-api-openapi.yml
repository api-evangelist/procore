        in: query
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  strict_file_uploading:
                    type: boolean
                    description: Whether strict file uploading is enabled for the company.
                    example: true
                  enable_image_real_time_as_builts:
                    type: boolean
                    description: Whether real-time image as-builts are enabled.
                    example: true
                  currency_symbol:
                    type: string
                    description: Currency symbol for the company.
                    example: $
                  currency_display:
                    type: string
                    description: How currency amounts are displayed for the company.
                    example: symbol
                  currency_iso_code:
                    type: string
                    description: ISO currency code for the company.
                    example: USD
                  force_automatic_overtime:
                    type: boolean
                    description: When true, overtime rules determine the time type and may split entries, ignoring any time type provided on the request.
                    example: false
                  overtime_management_enabled:
                    type: boolean
                    description: Whether overtime management is enabled for the company.
                    example: false
                  timecard_employees_see_all_projects:
                    type: boolean
                    description: Whether timecard employees can see all company projects.
                    example: true
                  timesheet_enabled_cost_type:
                    type: array
                    description: IDs of line item types enabled for timesheets.
                    items:
                      type: integer
                    example:
                    - 1
                    - 2
                    - 3
                  timesheet_type:
                    type: array
                    description: Alias of `timesheet_enabled_cost_type`; IDs of line item types enabled for timesheets.
                    items:
                      type: integer
                    example:
                    - 1
                    - 2
                    - 3
                  enable_sd_storage:
                    type: boolean
                    description: Whether SD storage is enabled for the company.
                    example: true
                  timesheets_custom_signature_text:
                    type: string
                    description: Default custom signature text for timesheets.
                    example: Custom signature text
                  timesheets_week_start_day:
                    type: integer
                    description: Day of the week that timesheet weeks start on.
                    example: 1
                  use_24_hour_mode:
                    type: boolean
                    description: Whether timesheets use 24-hour clock format.
                    example: true
                  timesheets_tab_enabled:
                    type: boolean
                    description: Whether the timesheets tool is enabled for the company.
                    example: true
