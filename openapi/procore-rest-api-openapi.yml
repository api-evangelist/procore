                type: array
                description: Array of lien waivers
                items:
                  type: object
                  description: Lien waivers belonging to an invoice
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the lien waiver. Use as the {id} path parameter to delete the waiver via DELETE /rest/v1.0/projects/{project_id}/lien_waivers/{id}.
                      example: 12345
                    company_id:
                      type: integer
                      description: ID of the company that owns this lien waiver.
                      example: 54321
                    project_id:
                      type: integer
                      description: ID of the project this lien waiver belongs to. Matches the {project_id} path parameter used to list and manage waivers.
                      example: 1234
                    invoice_id:
                      type: integer
                      description: ID of the invoice this lien waiver is associated with. Pass as the invoice_id query parameter when listing or managing an invoice's waivers.
                      example: 5678
                    status:
                      type: string
                      enum:
                      - awaiting_signature
                      - complete
                      - cancelled
                      - draft
                      description: Current signing status of the lien waiver.
                      example: awaiting_signature
                    type:
                      type: string
                      enum:
                      - conditional_progress
                      - unconditional_progress
                      - conditional_final
                      - unconditional_final
                      description: Classification of the lien waiver, combining its condition (conditional vs. unconditional) and billing stage (progress vs. final).
                      example: conditional_progress
                    waiver_date:
                      type: string
                      format: date
