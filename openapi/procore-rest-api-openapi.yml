                          description: ID of the user who terminated the workflow
                          example: 1
                        login:
                          type: string
                          description: Login/email of the user who terminated the workflow
                          example: abc@example.com
                        name:
                          type: string
                          description: Name of the user who terminated the workflow
                          example: Customer Support
                    permissions:
                      type: object
                      description: Permissions of the requesting user against this workflow instance. Computed independently for each instance in list and show responses. Two instances in the same list can therefore return different flags for the same user (assignee on one instance, not the other). When serialized without a requesting user, every flag is returned as false.
                      properties:
                        can_view:
                          type: boolean
                          description: Whether the user can view this workflow instance. True when the user is a company directory admin (company-scoped GET /workflow_instances), passes the workflowed object's VisiblePolicy (project-scoped GET /projects/{project_id}/workflow_instances), or can respond to the current state.
                          example: true
                        can_respond:
                          type: boolean
                          description: Whether the user can respond to the current state. False for an archived instance. Otherwise true when the user is a company directory admin (REST POST /workflow_activity_histories), is a tool/domain admin for the workflowed object, or is an assignee of a current workflow user role that can act (GenericWorkflowActivityHistoriesController#create).
                          example: true
                        can_act_on_behalf_of:
                          type: boolean
                          description: 'Whether the user can act on behalf of an assignee on the current state. Matches legacy UI: true when the user is a tool/domain admin for the workflowed object and satisfies the company''s WorkflowAdminOverride settings (company/project/tool admin allow-list). When no override flags are enabled, tool admins can act on behalf.'
                          example: false
                        can_edit_roles:
                          type: boolean
                          description: Whether the user can open Workflow Setup and edit assignee roles for this instance. True when the user satisfies the company's WorkflowAdminOverride settings for the workflowed object's provider and domain. When no override flags are enabled, returns true for any requesting user.
                          example: false
                        can_terminate:
                          type: boolean
                          description: Whether the user can terminate this legacy workflow instance. True when the instance is not already archived and the user is a tool/domain admin for the workflowed object who satisfies the company's WorkflowAdminOverride settings.
                          example: false
                        can_restart:
                          type: boolean
                          description: Whether this V1 instance can be replaced by a new V2 instance for the filters[workflowed_object_type] and filters[workflowed_object_id] supplied to the Show request. This verifies V1 termination permission, the V1-to-V2 tool and object mapping, V2 tool enablement, V2 create permission, absence of an active V2 instance, and availability of a valid default preset. False when those filters are not supplied.
                          example: false
