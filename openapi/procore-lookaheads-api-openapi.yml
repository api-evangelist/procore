openapi: 3.2.0
info:
  title: Procore REST Lookaheads API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Lookaheads
paths:
  /rest/v1.0/projects/{project_id}/schedule/lookahead_tasks:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Lookahead Task
      description: Create new Lookahead Task for the project schedule
      tags:
      - Lookaheads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lookahead_task
              properties:
                lookahead_task:
                  title: Lookahead Task
                  type: object
                  required:
                  - lookahead_id
                  - parent_id
                  - name
                  properties:
                    lookahead_id:
                      type: integer
                      description: ID of the associated Lookahead
                      example: 8
                    parent_id:
                      type: integer
                      description: ID of the parent Lookahead Task
                      example: 1
                    name:
                      type: string
                      description: The name of the Task
                      example: Interior
                    start_date:
                      type: string
                      description: Task start date, in project time zone
                      example: '2019-09-20'
                    end_date:
                      type: string
                      description: Task end date, in project time zone
                      example: '2019-09-30'
                    resource_ids:
                      type: array
                      description: ID of Resource(s) to assign to this Lookahead Task
                      items:
                        type: integer
                        example: 1
                    comment:
                      type: string
                      description: Additional comments
                    segments:
                      type: array
                      items:
                        type: object
                        required:
                        - date
                        - status
                        properties:
                          date:
                            type: string
                            description: Date represented by the task segment
                            example: '2019-09-20'
                          status:
                            type: string
                            description: Completion status of the task segment
                            example: complete
                            enum:
                            - blank
                            - complete
                            - incomplete
                    assignee_ids:
                      type: array
                      description: ID of Contact(s) to assign to this Lookahead Task
                      items:
                        type: integer
                        example: 1
                    vendor_ids:
                      type: array
                      description: ID of Company(s) to assign to this Lookahead Task
                      items:
                        type: integer
                        example: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Schedule Lookahead Task
                properties:
                  id:
                    type: integer
                    description: Lookahead Task ID
                  project_id:
                    type: integer
                    description: ID of the associated Project
                    example: 156293
                  company_id:
                    type: integer
                    description: ID of the associated Company
                    example: 5499
                  lookahead_id:
                    type: integer
                    description: ID of the associated Lookahead
                    example: 8
                  task_id:
                    type: integer
                    description: ID of the associated Task in the Master Schedule
                    example: 2401832
                  created_at:
                    type: string
                    format: date-time
                    description: Lookahead Task creation time
                    example: '2019-09-20T00:00:00Z'
                  created_by_id:
                    type: integer
                    description: ID of the user who created the Lookahead Task
                    example: 12
                  original_created_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: Original creation timestamp of the Lookahead Task
                    example: '2019-09-20T00:00:00Z'
                  parent_id:
                    type: integer
                    description: ID of the parent Lookahead Task
                    example: 1
                  name:
                    type: string
                    description: The name of the Lookahead Task
                    example: Interior
                  start_date:
                    type: string
                    description: Lookahead Task start date, in project time zone
                    example: '2019-09-20'
                  end_date:
                    type: string
                    description: Lookahead Task end date, in project time zone
                    example: '2019-09-30'
                  row_number:
                    type: integer
                    description: 'Defines the sequence in which Lookahead Tasks are normally

                      expected to be displayed'
                    example: 2
                  critical_path:
                    type: boolean
                    description: True if this Lookahead Task is on the critical path
                    example: false
                  comment:
                    type: string
                    description: Additional comments
                  activity_id:
                    type: string
                    description: Activity ID
                    example: 1000435
                  wbs:
                    type: string
                    description: WBS
                    example: 1.2
                  assignee_ids:
                    type: array
                    description: IDs of Assignee(s) assigned to this Lookahead Task
                    items:
                      type: integer
                  resource_ids:
                    type: array
                    description: IDs of Resource(s) assigned to this Lookahead Task
                    items:
                      type: integer
                  vendor_ids:
                    type: array
                    description: IDs of Vendor(s) assigned to this Lookahead Task
                    items:
                      type: integer
                  segments:
                    type: array
                    description: 'Segments define the set of days for the entire date range of the Lookahead Task,

                      and the completion status of each day in the Lookahead Task'
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: Date represented by the Lookahead Task Segment
                          format: date
                          example: '2020-02-12'
                        status:
                          type: string
                          description: Completion status of the Lookahead Task Segment
                          example: complete
                          enum:
                          - blank
                          - complete
                          - incomplete
                  resources:
                    type: array
                    deprecated: true
                    description: Resources assigned to this Task
                    items:
                      allOf:
                      - type: object
                        title: Resource
                        properties:
                          source_uid:
                            type: string
                            description: The unique identifier for this resource from the external system which owns the schedule data.
                            example: 0687b2f6-dc92-40c7-a8c8-a3c1f3ac9305
                      - type: object
                        title: Resource
                        properties:
                          id:
                            type: integer
                            description: Resource id
                            example: 1359235
                          name:
                            type: string
                            description: Resource name
                            example: INTERIOR
        '403':
          description: User does not have right permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
