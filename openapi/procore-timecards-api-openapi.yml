openapi: 3.2.0
info:
  title: Procore REST Timecards API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Timecards
paths:
  /rest/v1.0/timecard_entries:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List timecard entries
      description: Return a list of all Timecard Entries within a specified date range.
      tags:
      - Timecards
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: start_date
        in: query
        description: The beginning of the date range for entries. (YYYY-MM-DD); if not provided, this will default to 1 week ago
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: The end of the date range for entries. (YYYY-MM-DD); if not provided, this will default to today
        schema:
          type: string
          format: date
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of timecard entries
                items:
                  allOf:
                  - type: object
                    title: TimecardEntry
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the timecard entry.
                        example: 1
                      date:
                        type: string
                        format: date
                        description: Date of this timecard entry.
                        example: '2015-05-12'
                      project_id:
                        type: integer
                        description: Identifier of the project this timecard entry belongs to.
                        example: 456
                      updated_at:
                        type: string
                        format: date-time
                        description: Timestamp when this timecard entry was last modified, in ISO 8601 format.
                        example: '2015-11-12T21:26:28Z'
                      origin_id:
                        type: integer
                        description: ID of related external data
                        example: 23423
                      origin_data:
                        type: string
                        description: Value of related external data
                        example: '{''example'':''related data''}'
                      time_in:
                        type: string
                        format: date-time
                        description: Clock-in time for this entry, in ISO 8601 format.
                        example: '2015-05-12T08:00:00Z'
                      time_out:
                        type: string
                        format: date-time
                        description: Clock-out time for this entry, in ISO 8601 format.
                        example: '2015-05-12T17:00:00Z'
                      lunch_start_time:
                        type: string
                        format: date-time
                        description: Lunch break start time, in ISO 8601 format.
                        example: '2015-05-12T12:00:00Z'
                      lunch_stop_time:
                        type: string
                        format: date-time
                        description: Lunch break end time, in ISO 8601 format.
                        example: '2015-05-12T12:30:00Z'
                      lunch_time_start_time:
                        type: string
                        format: date-time
                        description: Alias for lunch_start_time, in ISO 8601 format.
                        example: '2015-05-12T12:00:00Z'
                      lunch_time_stop_time:
                        type: string
                        format: date-time
                        description: Alias for lunch_stop_time, in ISO 8601 format.
                        example: '2015-05-12T12:30:00Z'
                      alternate_time_out:
                        type: string
                        format: date-time
                        description: Calculated time-out derived from time_in plus hours worked, in ISO 8601 format.
                        example: '2015-05-12T17:00:00Z'
                      project_number:
                        type: string
                        description: Project number of the project this timecard entry belongs to.
                        example: '0123'
                      cost_code:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the cost code.
                            example: 12345
                          name:
                            type: string
                            description: Display name of the cost code.
                            example: Earthwork
                      party:
                        type: object
                        title: Party
                        properties:
                          id:
                            type: integer
                            description: Identifier of the party (employee/contact).
                            example: 1
                          name:
                            type: string
                            description: Full name of the party.
                            example: Carl Contractor
                      timecard_time_type:
                        type: object
                        title: TimecardTimeType
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the time type.
                            example: 1
                          abbreviated_time_type:
                            type: string
                            description: Abbreviated code for this time type (e.g., REG, OVE).
                            example: REG
                          company_id:
                            type: integer
                            description: Identifier of the company that owns this time type.
                            example: 15125
                          global:
                            type: boolean
                            description: Whether this is a system-provided global time type.
                            example: false
                          time_type:
                            type: string
                            description: Display name of the time type (e.g., Regular Time, Overtime).
                            example: Regular Time
                  - type: object
                    properties:
                      automatically_split_timecard_entries:
                        description: Timecard entries returned with associated object as part of overtime_management
                        type: array
                        items:
                          type: object
                          title: TimecardEntry
                          properties:
                            id:
                              type: integer
                              description: Unique identifier of the timecard entry.
                              example: 1
                            date:
                              type: string
                              format: date
                              description: Date of this timecard entry.
                              example: '2015-05-12'
                            project_id:
                              type: integer
                              description: Identifier of the project this timecard entry belongs to.
                              example: 456
                            updated_at:
                              type: string
                              format: date-time
                              description: Timestamp when this timecard entry was last modified, in ISO 8601 format.
                              example: '2015-11-12T21:26:28Z'
                            origin_id:
                              type: integer
                              description: ID of related external data
                              example: 23423
                            origin_data:
                              type: string
                              description: Value of related external data
                              example: '{''example'':''related data''}'
                            time_in:
                              type: string
                              format: date-time
                              description: Clock-in time for this entry, in ISO 8601 format.
                              example: '2015-05-12T08:00:00Z'
                            time_out:
                              type: string
                              format: date-time
                              description: Clock-out time for this entry, in ISO 8601 format.
                              example: '2015-05-12T17:00:00Z'
                            lunch_start_time:
                              type: string
                              format: date-time
                              description: Lunch break start time, in ISO 8601 format.
                              example: '2015-05-12T12:00:00Z'
                            lunch_stop_time:
                              type: string
                              format: date-time
                              description: Lunch break end time, in ISO 8601 format.
                              example: '2015-05-12T12:30:00Z'
                            lunch_time_start_time:
                              type: string
                              format: date-time
                              description: Alias for lunch_start_time, in ISO 8601 format.
                              example: '2015-05-12T12:00:00Z'
                            lunch_time_stop_time:
                              type: string
                              format: date-time
                              description: Alias for lunch_stop_time, in ISO 8601 format.
                              example: '2015-05-12T12:30:00Z'
                            alternate_time_out:
                              type: string
                              format: date-time
                              description: Calculated time-out derived from time_in plus hours worked, in ISO 8601 format.
                              example: '2015-05-12T17:00:00Z'
                            project_number:
                              type: string
                              description: Project number of the project this timecard entry belongs to.
                              example: '0123'
                            cost_code:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: Unique identifier of the cost code.
                                  example: 12345
                                name:
                                  type: string
                                  description: Display name of the cost code.
                                  example: Earthwork
                            party:
                              type: object
                              title: Party
                              properties:
                                id:
                                  type: integer
                                  description: Identifier of the party (employee/contact).
                                  example: 1
                                name:
                                  type: string
                                  description: Full name of the party.
                                  example: Carl Contractor
                            timecard_time_type:
                              type: object
                              title: TimecardTimeType
                              properties:
                                id:
                                  type: integer
                                  description: Unique identifier of the time type.
                                  example: 1
                                abbreviated_time_type:
                                  type: string
                                  description: Abbreviated code for this time type (e.g., REG, OVE).
                                  example: REG
                                company_id:
                                  type: integer
                                  description: Identifier of the company that owns this time type.
                                  example: 15125
                                global:
                                  type: boolean
                                  description: Whether this is a system-provided global time type.
                                  example: false
                                time_type:
                                  type: string
                                  description: Display name of the time type (e.g., Regular Time, Overtime).
                                  example: Regular Time
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/timecard_entries',\n  qs: {\n    project_id: 'SOME_INTEGER_VALUE',\n    start_date: 'SOME_STRING_VALUE',\n    end_date: 'SOME_STRING_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/timecard_entries?project_id=SOME_INTEGER_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/timecard_entries?project_id=SOME_INTEGER_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/timecard_entries?project_id=SOME_INTEGER_VALUE&start_date=SOME_STRING_VALUE&end_date=SOME_STRING_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: listTimecardEntries
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create timecard entry
      description: 'Create a new Timecard Entry.

        #### See - Project People guide - for additional info on

        * Getting a contact''s party_id'
      tags:
      - Timecards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - timecard_entry
              properties:
                project_id:
                  type: integer
                  description: The ID of the Project the Timecard Entry belongs to
                timecard_entry:
                  title: TimecardEntry
                  type: object
                  description: Timecard Entry object
                  required:
                  - date
                  - hours
                  properties:
                    party_id:
                      type: integer
                      description: The ID of the Party of the Timecard Entry
                      example: 2342
                    hours:
                      type: string
                      description: The Hours of the Timecard Entry
                      example: '8.0'
                    billable:
                      type: boolean
                      description: The Billable status of the Timecard Entry
                      default: false
                    date:
                      type: string
                      format: date
                      description: The Date of the Timecard Entry
                      example: '2019-06-01'
                    description:
                      type: string
                      description: The Description of the Timecard Entry
                      example: A description for the Timecard Entry.
                    timecard_time_type_id:
                      type: integer
                      description: The ID of the Timecard Time Type of the Timecard Entry
                      example: 1029
                    cost_code_id:
                      type: integer
                      description: The ID of the Cost Code of the Timecard Entry
                      example: 12345
                    login_information_id:
                      type: integer
                      description: The ID of the Login Information of the Timecard Entry
                      example: 1009
                    origin_id:
                      type: integer
                      description: ID of related external data
                      example: 23423
                    origin_data:
                      type: string
                      description: Value of related external data
                      example: '{''example'':''related data''}'
                    line_item_type_id:
                      type: integer
                      description: The ID of the Line Item Type of the Timecard Entry
                      example: 13
                    clock_in_time:
                      type: string
                      description: The datetime a timecard clock in was punched
                      example: '2020-03-24T04:14:06Z'
                    clock_out_time:
                      type: string
                      description: The datetime a timecard clock out was punched
                      example: '2020-03-24T05:14:22Z'
              example:
                project_id: 513526
                timecard_entry:
                  date: '2015-05-06'
                  description: Description
                  billable: true
                  hours: '8.0'
                  timecard_time_type_id: 1
                  cost_code_id: 1
                  login_information_id: 2341
                  party_id: 2342
                  origin_id: 23423
                  origin_data: '{''example'':''related data''}'
                  line_item_type_id: 13
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  title: TimecardEntry
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the timecard entry.
                      example: 1
                    approval_status:
                      type: string
                      description: Supervisor approval status for this timecard entry.
                      enum:
                      - pending
                      - reviewed
                      - approved
                      - completed
                      example: pending
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this timecard entry was created, in ISO 8601 format.
                      example: '2012-10-23T21:39:40Z'
                    date:
                      type: string
                      format: date
                      description: Date of this timecard entry.
                      example: '2015-05-12'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when this timecard entry was soft-deleted, in ISO 8601 format. Null if active.
                      example: '2017-07-29T21:39:40Z'
                    description:
                      type: string
                      description: Description or notes for this timecard entry.
                      example: Description
                    billable:
                      type: boolean
                      description: Whether this timecard entry is billable.
                      example: true
                    hours:
                      type: string
                      description: Total hours worked for this timecard entry.
                      example: '5.0'
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when this timecard entry was last modified, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    timecard_type:
                      type: string
                      description: Display name of the time type (e.g., Regular Time, Overtime).
                      example: Regular Time
                    cost_code:
                      type: string
                      description: Name of the cost code assigned to this entry.
                      example: Summary
                    origin_id:
                      type: integer
                      description: ID of related external data
                      example: 23423
                    origin_data:
                      type: string
                      description: Value of related external data
                      example: '{''example'':''related data''}'
                    timesheet_status:
                      type: string
                      description: Deprecated. Reference status property.
                      example: pending
                      deprecated: true
                    full_cost_code:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the cost code.
                          example: 12345
                        name:
                          type: string
                          description: Display name of the cost code.
                          example: Earthwork
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user who created this entry.
                          example: 160586
                        login:
                          type: string
                          description: Email address of the user who created this entry.
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Full name of the user who created this entry.
                          example: Carl Contractor
                    login_information:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user this entry is for.
                          example: 160586
                        login:
                          type: string
                          description: Email address of the user this entry is for.
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Full name of the user this entry is for.
                          example: Carl Contractor
                    timecard_time_type:
                      type: object
                      title: TimecardTimeType
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the time type.
                          example: 1
                        abbreviated_time_type:
                          type: string
                          description: Abbreviated code for this time type (e.g., REG, OVE).
                          example: REG
                        company_id:
                          type: integer
                          description: Identifier of the company that owns this time type.
                          example: 15125
                        global:
                          type: boolean
                          description: Whether this is a system-provided global time type.
                          example: false
                        time_type:
                          type: string
                          description: Display name of the time type (e.g., Regular Time, Overtime).
                          example: Another Time
                    line_item_type_id:
                      type: integer
                      description: Identifier of the line item type assigned to this entry.
                      example: 13
                    daily_log_segment_id:
                      type:
                      - integer
                      - 'null'
                      description: Identifier of the daily log segment this entry belongs to. Null if not linked.
                      example: 123456
                    custom_fields:
                      type: object
                      properties:
                        custom_field_%{custom_field_string_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: The data type of the Custom Field Definition.
                              example: string
                            value:
                              type: string
                              description: The value of the custom field.
                              example: custom field value
                        custom_field_%{custom_field_decimal_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: The data type of the Custom Field Definition.
                              example: decimal
                            value:
                              type: number
                              description: The value of the custom field.
                              example: 2.2
                        custom_field_%{custom_field_boolean_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: The data type of the Custom Field Definition.
                              example: boolean
                            value:
                              type: boolean
                              description: The value of the custom field.
                              example: true
                        custom_field_%{custom_field_lov_entry_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: The data type of the Custom Field Definition.
                              example: lov_entry
                            value:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: The unique identifier of the list of values (LOV) entry.
                                  example: 1
                                label:
                                  type: string
                                  description: Label of the list of values (LOV) entry.
                                  example: Open
                        custom_field_%{custom_field_lov_entries_definition_id}:
                          type: object
                          properties:
                            data_type:
                              type: string
                              description: The data type of the Custom Field Definition.
                              example: lov_entries
                            value:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: The unique identifier of the list of values (LOV) entry.
                                    example: 2
                                  label:
                                    type: string
                                    description: The label of the list of values (LOV) entry.
                                    example: Open
                - type: object
                  properties:
                    automatically_split_timecard_entries:
                      description: Timecard entries returned with associated object as part of overtime_management
                      type: array
                      items:
                        type: object
                        title: TimecardEntry
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the timecard entry.
                            example: 1
                          approval_status:
                            type: string
                            description: Supervisor approval status for this timecard entry.
                            enum:
                            - pending
                            - reviewed
                            - approved
                            - completed
                            example: pending
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp when this timecard entry was created, in ISO 8601 format.
                            example: '2012-10-23T21:39:40Z'
                          date:
                            type: string
                            format: date
                            description: Date of this timecard entry.
                            example: '2015-05-12'
                          deleted_at:
                            type: string
                            format: date-time
                            description: Timestamp when this timecard entry was soft-deleted, in ISO 8601 format. Null if active.
                            example: '2017-07-29T21:39:40Z'
                          description:
                            type: string
                            description: Description or notes for this timecard entry.
                            example: Description
                          billable:
                            type: boolean
                            description: Whether this timecard entry is billable.
                            example: true
                          hours:
                            type: string
                            description: Total hours worked for this timecard entry.
                            example: '5.0'
                          updated_at:
                            type: string
                            format: date-time
                            description: Timestamp when this timecard entry was last modified, in ISO 8601 format.
                            example: '2015-11-12T21:26:28Z'
                          timecard_type:
                            type: string
                            description: Display name of the time type (e.g., Regular Time, Overtime).
                            example: Regular Time
                          cost_code:
                            type: string
                            description: Name of the cost code assigned to this entry.
                            example: Summary
                          origin_id:
                            type: integer
                            description: ID of related external data
                            example: 23423
                          origin_data:
                            type: string
                            description: Value of related external data
                            example: '{''example'':''related data''}'
                          timesheet_status:
                            type: string
                            description: Deprecated. Reference status property.
                            example: pending
                            deprecated: true
                          full_cost_code:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Unique identifier of the cost code.
                                example: 12345
                              name:
                                type: string
                                description: Display name of the cost code.
                                example: Earthwork
                          created_by:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Unique identifier of the user who created this entry.
                                example: 160586
                              login:
                                type: string
                                description: Email address of the user who created this entry.
                                example: carl.contractor@example.com
                              name:
