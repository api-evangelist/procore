                        description: ID
                        example: 189
                      project_id:
                        type: integer
                        description: Project ID
                        example: 101
                      created_by_id:
                        type: integer
                        description: Creator ID
                        example: 101
                      created_at:
                        type: string
                        format: date-time
                        description: Created date
                        example: '2019-01-04T06:13:10Z'
                      updated_at:
                        type: string
                        format: date-time
                        description: Updated date
                        example: '2019-01-06T11:26:08Z'
                  - type: object
                    properties:
                      bim_model_revision_id:
                        type:
                        - integer
                        - 'null'
                        description: ID of associated model revision
                        example: 2264
                      cell_file_id:
                        type: integer
                        description: ID of associated cell geometry file
                        example: 2265
                      node_file_id:
                        type: integer
                        description: ID of associated node geometry file
                        example: 2266
                      mesh_node_file_id:
                        type: integer
                        description: ID of associated mesh node geometry file
                        example: 2267
                      mesh_file_id:
                        type: integer
                        description: ID of associated mesh geometry file
                        example: 2268
                      manifest_file_id:
                        type:
                        - integer
                        - 'null'
                        description: ID of associated manifest file
                        example: 2269
                - allOf:
