  /rest/v1.0/bim_levels/batch:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create a batch of BIM Levels
      tags:
      - BIM Models
      requestBody:
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - project_id
              - bim_levels
              properties:
                project_id:
                  type: integer
                  description: Unique identifier for the project.
                  example: 126
                view:
                  type: string
                  description: Specify response schema view
                  enum:
                  - compact
                  - normal
                  - extended
                bim_levels:
                  type: array
                  description: An array of BIM Level payloads
                  items:
                    type: object
                    description: BIM Level
                    required:
                    - elevation
                    - bim_file_id
                    - location_id
                    properties:
                      elevation:
                        type: number
                        format: float
                        description: Level elevation
                        example: 10.25
                      bim_file_id:
                        type: integer
                        description: ID of the BIM File linked to the Level
                        example: 16
                      location_id:
                        type: integer
                        description: ID of location linked to the Level
                        example: 16
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: BIM Level Batch create response
                type: object
                properties:
                  bim_levels:
                    type: array
                    items:
                      oneOf:
                      - allOf:
                        - type: object
                          description: BIM Model Level
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 144
                            elevation:
                              type: number
                              format: float
                              description: Level elevation
                              example: 10.25
                            name:
                              type: string
                              description: Level name
                              example: 1space>1 space
                            created_at:
                              type: string
                              format: date-time
                              description: Created date
                              example: '2019-01-04T06:13:10Z'
                            updated_at:
                              type: string
                              format: date-time
                              description: Updated date
                              example: '2019-01-06T11:26:08Z'
                        - type: object
                          properties:
                            bim_file_id:
                              type: integer
                              description: ID of the BIM Model revision linked to the Level
                              example: 16
                            location_id:
                              type:
                              - integer
                              - 'null'
                              description: ID of location linked to the Level
                              example: 16
                            created_by_id:
                              type: integer
                              description: ID of user that created the level
                              example: 16
                      - allOf:
                        - type: object
                          description: BIM Model Level
                          properties:
                            id:
                              type: integer
                              description: ID
                              example: 144
                            elevation:
                              type: number
                              format: float
                              description: Level elevation
                              example: 10.25
                            name:
                              type: string
                              description: Level name
                              example: 1space>1 space
                            created_at:
                              type: string
                              format: date-time
                              description: Created date
                              example: '2019-01-04T06:13:10Z'
                            updated_at:
                              type: string
                              format: date-time
                              description: Updated date
                              example: '2019-01-06T11:26:08Z'
                        - type: object
                          properties:
                            bim_file:
                              type: object
                              description: BIM File
                              properties:
                                id:
                                  type: integer
                                  description: ID
                                  example: 101
                                name:
                                  type: string
                                  description: Name of the file to be associated to a project
                                  example: 101_BLDG_FLR_2.NWF
                                uuid:
                                  type: string
                                  description: Unique UUID associated with the file
                                  example: a00147dd-a698-468a-b082-d277a564cf0c
                            location:
                              type:
                              - object
                              - 'null'
                              title: Location
                              properties:
                                id:
                                  type: integer
                                  description: Location ID
                                  example: 15504
                                name:
                                  type: string
                                  description: Location name
                                  example: North Building>First Floor>Electrical Closet
                                node_name:
                                  type: string
                                  description: Location node name
                                  example: Electrical Closet
                                parent_id:
                                  type:
                                  - integer
                                  - 'null'
                                  description: Location parent id
                                  example: 788866
                                created_at:
                                  type: string
                                  format: date-time
                                  description: Timestamp of Location creation
                                  example: '2016-08-01T23:33:54Z'
                                updated_at:
                                  type: string
                                  format: date-time
                                  description: Timestamp of last update to Location
                                  example: '2016-08-01T23:33:54Z'
                                code:
                                  type:
                                  - string
                                  - 'null'
                                  description: The unique code for this Location
                                  example: L1
                            created_by:
                              type: object
                              description: Login Information
                              properties:
                                id:
                                  type: integer
                                  description: Login Information ID uniquely identifying this user.
                                  example: 1738090
                                name:
                                  type: string
                                  description: User's display name, formatted first name then last name.
                                  example: John Doe
                                login:
                                  type: string
                                  description: User's login email address.
                                  example: johndoe@example.com
                                company_name:
                                  type:
                                  - string
                                  - 'null'
                                  description: User Company name. If the user belongs to a vendor, the vendor name will be returned.
                                  example: Builders Inc.
                                locale:
                                  type:
                                  - string
                                  - 'null'
                                  description: IETF locale code for the user's language preference (e.g., 'en', 'ko'). Null when the user has not set a locale.
                                  example: ko
                  errors:
                    type: array
                    items:
                      type: object
                      allOf:
                      - type: object
                        description: BIM Level
                        required:
                        - elevation
                        - bim_file_id
                        - location_id
                        properties:
                          elevation:
                            type: number
