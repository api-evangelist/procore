  /rest/v1.0/bim_models/{id}/change_history:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List BIM Model Change History
      description: This is a deprecated endpoint. This endpoint returns the change history for the specified BimModel. The change history is sorted by most recent first.
      x-deprecated-at: '2021-09-10'
      deprecated: true
      tags:
      - BIM Models
      parameters:
      - name: id
        in: path
        description: BIM Model ID
        required: true
        schema:
          type: integer
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: 'The extended view provides what is shown below.

          The normal view is the same as the extended view but excludes attribute created_by.

          The compact view returns ids only.

          The default view is normal.'
        schema:
          type: string
          enum:
          - compact
          - normal
          - extended
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: A single change history entry, recording one field modification on the parent resource.
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of this change history entry.
                      example: 101
                    column:
                      type: string
                      description: Internal column name of the field that was changed.
                      example: assignee_id
                    readable_column:
                      type: string
                      description: Localized, human-readable name of the field that was changed, translated to the requested locale.
                      example: Assignee
                    formatted_column:
                      type: string
                      description: Human-readable name of the field that was changed, in the default locale.
                      example: Assignee
                    old_value:
                      type:
                      - string
                      - 'null'
                      description: Previous value of the field. Null if the field was not previously set.
                      example: The original title
                    new_value:
                      type: string
                      description: New value of the field.
                      example: The updated title
                    created_by:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the user who made the change.
                            example: 160586
                          login:
                            type: string
                            description: Email address (login) of the user who made the change.
                            example: carl.contractor@example.com
                          name:
                            type: string
                            description: Full name of the user who made the change.
                            example: Carl the Contractor
                          locale:
                            type:
                            - string
                            - 'null'
                            description: Locale preference of the user who made the change. Null if not set.
                            example: en-GB
                      - type: object
                        properties:
                          company_name:
                            type: string
                            description: Name of the company the user belongs to.
                            example: Company ABC
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this change was recorded, in ISO 8601 format.
                      example: '2018-05-08T13:21:20Z'
