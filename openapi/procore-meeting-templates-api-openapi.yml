openapi: 3.2.0
info:
  title: Procore REST Meeting Templates API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Meeting Templates
paths:
  /rest/v1.0/companies/{company_id}/meeting_templates:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Meeting Templates
      description: Returns the paginated list of Meeting Templates configured for the specified company. Use the returned `id` values to fetch a single template via `GET /rest/v1.0/companies/{company_id}/meeting_templates/{id}`.
      tags:
      - Meeting Templates
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: view
        in: query
        description: Controls how much detail each template includes in the response. `default` returns the standard fields, `extended` adds fuller detail, and `compact` returns a reduced payload.
        required: false
        schema:
          type: string
          enum:
          - default
          - extended
          - compact
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Meeting Template
                  properties:
                    id:
                      type: integer
                      description: Id
                      example: 10
                    name:
                      type:
                      - string
                      - 'null'
                      description: Name
                      example: Better Signage
                    overview:
                      type:
                      - string
                      - 'null'
                      description: Overview
                      example: Discuss building better signage
                    private:
                      type: boolean
                      description: Indicates that this meeting template should be private
                      example: true
                    agendas:
                      type: array
                      description: Agendas
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Id
                            example: 2
                          title:
                            type:
                            - string
                            - 'null'
                            description: Title
                            example: Signs meeting agenda
                          category:
                            type:
                            - string
                            - 'null'
                            description: Category
                            example: Signs work
                          description:
                            type:
                            - string
                            - 'null'
                            description: Description
                            example: Discuss new signs
                          attachments:
                            type: array
                            description: Attachments
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Id
                                  example: '1'
                                name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Name
                                  example: agenda.pdf
                                url:
                                  type:
                                  - string
                                  - 'null'
                                  description: Url
                                  example: https://storage.procore.com/files/attachment.png
                    attachments:
                      type: array
                      description: Attachments
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Id
                            example: '1'
                          name:
                            type:
                            - string
                            - 'null'
                            description: Name
                            example: contract.pdf
                          url:
                            type:
                            - string
                            - 'null'
                            description: Url
                            example: https://storage.procore.com/files/attachment.png
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: User does not have right permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Endpoint not found.
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/meeting_templates',\n  qs: {\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    view: 'SOME_STRING_VALUE'\n  },\n  headers: {Authorization: 'Bearer REPLACE_BEARER_TOKEN'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Authorization'': "Bearer REPLACE_BEARER_TOKEN" }


          conn.request("GET", "/rest/v1.0/companies/%7Bcompany_id%7D/meeting_templates?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&view=SOME_STRING_VALUE", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/meeting_templates?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&view=SOME_STRING_VALUE' \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/companies/%7Bcompany_id%7D/meeting_templates?page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&view=SOME_STRING_VALUE\"),\n    Headers =\n    {\n        { \"Authorization\", \"Bearer REPLACE_BEARER_TOKEN\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
