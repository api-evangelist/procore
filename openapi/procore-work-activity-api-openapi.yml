  /rest/v1.0/companies/{company_id}/incidents/work_activities/bulk_update:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Unique identifier for the company.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Bulk Update Work Activities
      description: Update multiple Work Activities with one request.
      tags:
      - Work Activity
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - work_activity
              properties:
                work_activity:
                  type: object
                  description: IDs of all Work Activities specified for bulk update
                  properties:
                    ids:
                      type: array
                      items:
                        type: integer
                        description: ID
                        example: 435
                    active:
                      type: boolean
                      description: Flag that denotes if the Work Activities are available for use
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  title: Work Activity
                  properties:
                    id:
                      type: integer
                      description: Work Activity ID
                      example: 999
                    name:
                      type: string
                      description: Work Activity Name
                      example: Earthwork
                    active:
                      type: boolean
                      description: Represents whether a Work Activity is available for use.
                      example: true
                    global:
                      type: boolean
                      description: Represents whether a Work Activity has been provided by Procore.
                      example: true
                    created_at:
                      type: string
                      description: Timestamp of creation
                      format: date-time
                      example: '2016-10-25T17:53:35Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Date the work activity was updated
                      example: '2015-11-12T21:26:28Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
