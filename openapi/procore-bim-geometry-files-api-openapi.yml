paths:
  /rest/v1.0/bim_geometry_file_bundles:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-deprecated-at: '2024-11-04'
      x-sunset: '2025-11-30'
      deprecated: true
      summary: Create BIM Geometry File Bundle
      description: Create a BIM Geometry File Bundle in a Project
      tags:
      - BIM Geometry Files
      requestBody:
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - project_id
              - bim_geometry_file_bundle
              properties:
                project_id:
                  type: integer
                  description: Unique identifier for the project.
                  example: 326
                view:
                  type: string
                  description: Specify response schema view
                  enum:
                  - compact
                  - normal
                  - extended
                bim_geometry_file_bundle:
                  type: object
                  description: BIM Geometry File
                  required:
                  - bim_model_revision_id
                  - cell_upload_uuid
                  - node_upload_uuid
                  - mesh_node_upload_uuid
                  - mesh_upload_uuid
                  properties:
                    bim_model_revision_id:
                      type: integer
                      description: ID of the model revision to be associated
                      example: 1984
                    cell_upload_uuid:
                      type: string
                      description: UUID of uploaded cell geometry file
                      example: 1ZE258W9K804SAJJZX19JVAB3P
                    node_upload_uuid:
                      type: string
                      description: UUID of uploaded node geometry file
                      example: 1ZE258W9K804SAJJZX19JVAB3Q
                    mesh_node_upload_uuid:
                      type: string
                      description: UUID of uploaded mesh node geometry file
                      example: 1ZE258W9K804SAJJZX19JVAB3R
                    mesh_upload_uuid:
                      type: string
                      description: UUID of uploaded mesh geometry file
                      example: 1ZE258W9K804SAJJZX19JVAB3S
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  description: BIM Geometry File Bundle stores the details of a model geometry files
                  properties:
                    id:
                      type: integer
                      description: ID
                      example: 189
                    bim_model_revision_id:
                      type: integer
                      description: ID of associated model revision
                      example: 2264
                    project_id:
                      type: integer
                      description: Unique identifier for the project.
                      example: 101
                    created_by_id:
                      type: integer
                      description: Creator ID
                      example: 101
                    created_at:
                      type: string
                      format: date-time
                      description: Created date
                      example: '2019-01-04T06:13:10Z'
                    updated_at:
                      type: string
                      format: date-time
                      description: Updated date
                      example: '2019-01-06T11:26:08Z'
                - type: object
                  properties:
                    cell_file:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: Base name of the file without its path
                          example: filename.ext
                        content_type:
                          type: string
                          description: A mime type or a file extension
                          example: application/vnd.ext
                        url:
                          type: string
                          description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                          example: https://storage.procore.com/v3/d/default/procore-files/1ZE258W9K804SAJJZX19JVAB3R?sig=e7a476ec0a46154d05e0d4a554fb2ea0904cb6604670f9247c54d7c56a84d0b6
                    node_file:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: Base name of the file without its path
                          example: filename.ext
                        content_type:
                          type: string
                          description: A mime type or a file extension
                          example: application/vnd.ext
                        url:
                          type: string
                          description: URL to download the attached file. HTTP client should be prepared to follow redirects to successfully download the file.
                          example: https://storage.procore.com/v3/d/default/procore-files/1ZE258W9K804SAJJZX19JVAB3R?sig=e7a476ec0a46154d05e0d4a554fb2ea0904cb6604670f9247c54d7c56a84d0b6
                    mesh_node_file:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                          description: Base name of the file without its path
                          example: filename.ext
                        content_type:
                          type: string
                          description: A mime type or a file extension
                          example: application/vnd.ext
                        url:
