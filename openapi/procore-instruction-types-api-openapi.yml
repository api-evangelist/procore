paths:
  /rest/v1.0/projects/{project_id}/instruction_types:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Instruction Types
      description: Create a new Instruction Type associated with the specified Project.
      tags:
      - Instruction Types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - instruction_type
              properties:
                instruction_type:
                  title: Instruction Type
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Name of Instruction Type
                      example: Owner Instruction
      responses:
        '201':
          description: Instruction Type created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the instruction type.
                    example: 2
                  name:
                    type: string
                    description: Name of the instruction type.
                    example: Owner Instruction
                  prefix:
                    type: string
                    description: Prefix applied to instruction numbers of this type.
                    example: OI
        '403':
          description: User does not have permission to create Instruction Type
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '422':
          description: Error creating Instruction Type
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
