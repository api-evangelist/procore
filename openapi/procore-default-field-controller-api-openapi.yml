openapi: 3.2.0
info:
  title: Procore REST Default Field Controller API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: default-field-controller
paths:
  /rest/v2.0/companies/{company_id}/assets/field_values:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      tags:
      - default-field-controller
      summary: List Default Field Values
      description: Returns default field values for a given field code.
      operationId: getDefaultFieldValuesByCodeForCompany
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: field_code
        in: query
        description: Unique field code to retrieve values for (e.g., ATTACHMENT_TYPE)
        required: true
        schema:
          type: string
        example: ATTACHMENT_TYPE
      - name: applies_to
        in: query
        description: 'Optional attachment origins to filter by (DRAWINGS, PHOTOS, DOCUMENTS). Repeatable: when one or more values are provided, active types applicable to any of them (union) are returned; omit to return all active types.'
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - DRAWINGS
            - PHOTOS
            - DOCUMENTS
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        key:
                          type: string
                        active:
                          type: boolean
                        company_id:
                          type: string
                        source:
                          type: string
                          description: 'Where the record type originated: ASSETS (manually defined) or DOCUMENT_MANAGEMENT (imported).'
                          enum:
                          - ASSETS
                          - DOCUMENT_MANAGEMENT
                        applies_to:
                          type: array
                          description: Attachment origins this record type applies to.
                          items:
                            type: string
                            description: Attachment origins this record type applies to.
                            enum:
                            - DRAWINGS
                            - PHOTOS
                            - DOCUMENTS
                        source_type_stale:
                          type: boolean
                          description: For source-added (e.g. DOCUMENT_MANAGEMENT) record types, true when the linked source type is no longer active in the source tool, so the admin should delete this row. Null when not applicable (ASSETS-sourced) or when the source could not be checked.
                        display_order:
                          type: integer
                          format: int32
                          description: Admin-configured position of this record type within its company list.
                        created_at:
                          type: string
                          format: date-time
                        modified_at:
                          type: string
                          format: date-time
                        created_by:
                          description: Contact Information
                          properties:
                            id:
                              type: string
                              description: User ID
                              example: '12345'
                            name:
                              type: string
                              description: User's full name
                              example: John Doe
                            email:
                              type: string
                              description: User's email address
                              example: user@example.com
                        modified_by:
                          description: Contact Information
                          properties:
                            id:
                              type: string
                              description: User ID
                              example: '12345'
                            name:
                              type: string
                              description: User's full name
                              example: John Doe
                            email:
                              type: string
                              description: User's email address
                              example: user@example.com
        '400':
          description: The server could not understand the request due to invalid syntax or parameters that fail to meet validation requirements.
        '401':
          description: Although the HTTP standard specifies "unauthorized", semantically this response means "unauthenticated". That is, the client must authenticate itself to get the requested response.
        '403':
          description: The client does not have access rights to the content; that is, it is authenticated, but the server is refusing to give the requested resource. Unlike 401, the client's identity is known to the server.
        '404':
          description: The server can not find the requested resource. This can mean either the URL is not recognized, or the resource itself does not exist. Servers may also send this response instead of 403 to hide the existence of a resource from an unauthorized client.
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'http://localhost:8080/rest/v2.0/companies/1234/assets/field_values',\n  qs: {field_code: 'ATTACHMENT_TYPE', applies_to: 'SOME_ARRAY_VALUE'},\n  headers: {\n    'Procore-Company-Id': 'SOME_INTEGER_VALUE',\n    'Accept-Language': 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: "import http.client\n\nconn = http.client.HTTPConnection(\"localhost:8080\")\n\nheaders = {\n    'Procore-Company-Id': \"SOME_INTEGER_VALUE\",\n    'Accept-Language': \"SOME_STRING_VALUE\"\n    }\n\nconn.request(\"GET\", \"/rest/v2.0/companies/1234/assets/field_values?field_code=ATTACHMENT_TYPE&applies_to=SOME_ARRAY_VALUE\", headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'http://localhost:8080/rest/v2.0/companies/1234/assets/field_values?field_code=ATTACHMENT_TYPE&applies_to=SOME_ARRAY_VALUE' \\\n  --header 'Accept-Language: SOME_STRING_VALUE' \\\n  --header 'Procore-Company-Id: SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"http://localhost:8080/rest/v2.0/companies/1234/assets/field_values?field_code=ATTACHMENT_TYPE&applies_to=SOME_ARRAY_VALUE\"),\n    Headers =\n    {\n        { \"Procore-Company-Id\", \"SOME_INTEGER_VALUE\" },\n        { \"Accept-Language\", \"SOME_STRING_VALUE\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
  /rest/v2.0/companies/{company_id}/assets/settings/naming_standard/{rule_id}:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    put:
      tags:
      - default-field-controller
      summary: Update company naming standard rule
      description: Updates an existing naming rule. Use isActive=false to deactivate without deleting.
      operationId: updateCompanyNamingStandard
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: rule_id
        in: path
        description: Unique identifier for the naming rule.
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Request to update a field rule (definition + metadata)
              properties:
                rule_type:
                  type: string
                  description: 'Optional metadata. NOT updatable: if provided, must match the existing rule''s type; the server rejects mismatches.'
                  enum:
                  - NAMING
                  - FIELD_DEFAULTS
                  - VALIDATION
                  - CROSS_FIELD
                  - MANDATORY
                  - WARNING
                fieldset_id:
                  type: string
                  description: New fieldset id. FIELD_DEFAULTS only; ignored / rejected for NAMING. Provided to recover a rule whose asset type's fieldset has been changed by an admin. Must match the asset type's current fieldset and must contain the rule's trigger_field.
                  maxLength: 255
                  minLength: 0
                rule_name:
                  type: string
                  description: Display name for the rule
                  maxLength: 255
                  minLength: 0
                description:
                  type: string
                  description: Optional description
                  maxLength: 512
                  minLength: 0
                definition:
                  type: object
                  description: Rule definition. Shape must match the rule's stored type — for NAMING, supply expression_fields; for FIELD_DEFAULTS, supply actions. Sent as a raw JSON object; the server converts it to the correct subtype and runs explicit validation. Omit entirely to update only metadata (e.g. is_active toggles).
                is_active:
                  type: boolean
                  description: Whether the rule is active. Set to false to deactivate.
                conditions:
                  description: Conditions AST for a conditional-validation rule
                  properties:
                    schema_version:
                      type: integer
                      format: int32
                      description: Version of the conditions schema
                    root:
                      type: object
                      description: Root node of the recursive conditions tree
                  required:
                  - root
                  - schema_version
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Field rule response (NAMING or FIELD_DEFAULTS)
                    properties:
                      id:
                        type: string
                        description: Unique identifier of the field rule
                      company_id:
                        type: integer
                        format: int64
                        description: Company this rule belongs to
                      project_id:
                        type: integer
                        format: int64
                        description: Project this rule applies to; null for company-level rules
                      asset_type_id:
                        type: string
                        description: Asset type this rule applies to. Populated for FIELD_DEFAULTS; null for NAMING.
                      fieldset_id:
                        type: string
                        description: Fieldset scope. '-1' for Procore default fields, external configurable fieldset id for custom fields. Null for NAMING.
                      rule_type:
                        type: string
                        description: Kind of rule
                        enum:
                        - NAMING
                        - FIELD_DEFAULTS
                        - VALIDATION
                        - CROSS_FIELD
                        - MANDATORY
                        - WARNING
                      trigger_field:
                        type: string
                        description: Field that triggers this rule (e.g. asset_code for NAMING, custom_field_1234 for FIELD_DEFAULTS)
                      rule_name:
                        type: string
                        description: Name of the rule
                      description:
                        type: string
                        description: Optional description of the rule
                      definition:
                        description: 'Structured rule definition. Shape depends on ruleType: FieldRuleDefinitionDTO for NAMING, FieldDefaultsDefinitionDTO for FIELD_DEFAULTS, ConditionalValidationDefinitionDTO for MANDATORY/WARNING.'
                        oneOf:
                        - type: object
                          description: Rule definition containing expression segments
                          properties:
                            expression_fields:
                              type: array
                              description: Ordered list of expression segments
                              items:
                                type: object
                                description: Expression segment for naming rule
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - LITERAL
                                    - REF
                                    - DELIMITER
                                    - SEQ
                                  order:
                                    type: integer
                                    format: int32
                                    description: Display order of the segment
                                    minimum: 1
                                  value:
                                    type: string
                                    description: 'For LITERAL: static text value'
                                  field:
                                    type: string
                                    description: 'For REF: field identifier from Constants.NAMING_FIELDS (e.g. project, asset_type_id)'
                                  fallback:
                                    type: string
                                    description: 'For REF: fallback when field value is null or empty'
                                  skip_if_empty:
                                    type: boolean
                                    description: 'For REF: when true, omit this segment (and collapse delimiters) if the resolved value is empty instead of using fallback. Mutually exclusive with fallback. Default false.'
                                  dedupe_parent_segments:
                                    type: boolean
                                    description: 'For REF parent_asset_id only: when true, enable ancestor segment de-duplication by dropping other REF segments whose values are already represented in the parent asset ID. Default false.'
                                  digits:
                                    type: integer
                                    format: int32
                                    description: 'For SEQ: number of digits for padding (e.g. 3 -> 001)'
                                  start_value:
                                    type: integer
                                    format: int64
                                    description: 'For SEQ: optional starting sequence number'
                                  char:
                                    type: string
                                    description: 'For DELIMITER: single character (e.g. "-", "_")'
                                required:
                                - order
                                - type
                              maxItems: 2147483647
                              minItems: 1
                          required:
                          - expression_fields
                        - type: object
                          description: Rule definition for FIELD_DEFAULTS rules (actions-based)
                          properties:
                            actions:
                              type: array
                              description: Non-empty list of actions to apply. Must include exactly one SET_DEFAULT; SET_READ_ONLY is optional and appears at most once.
                              items:
                                type: object
                                description: A single action inside a field rule definition
                                properties:
                                  type:
                                    type: string
                                    description: Action type (SET_DEFAULT, SET_READ_ONLY)
                                    enum:
                                    - SET_DEFAULT
                                    - SET_READ_ONLY
                                  value:
                                    type: object
                                    description: 'Action value. For SET_DEFAULT: matches the Asset custom_fields storage format (String/Number/Boolean for primitives, {id, name} for reference types). For SET_READ_ONLY: Boolean true/false.'
                                  data_type:
                                    type: string
                                    description: FieldType key (required for SET_DEFAULT; null for SET_READ_ONLY)
                                    enum:
                                    - boolean
                                    - cost_code
                                    - datetime
                                    - datetime/time
                                    - datetime/mm_yyyy
                                    - datetime/yyyy
                                    - decimal
                                    - decimal/currency
                                    - location
                                    - login_information
                                    - login_information/project_directory
                                    - login_informations
                                    - lov_entries
                                    - lov_entry
                                    - lov_entry/radio_button
                                    - lov_entry/with_code
                                    - prequal_file_uploads
                                    - prostore_files
                                    - rich_text
                                    - rich_text/read_only
                                    - string
                                    - string/phone_number
                                    - vendor
                                  message:
                                    type: string
                                    description: Optional message (reserved for future action types like SET_REQUIRED)
                                required:
                                - type
                              maxItems: 2147483647
                              minItems: 1
                          required:
                          - actions
                        - type: object
                          description: Rule definition for MANDATORY/WARNING rules (optional custom message)
                          properties:
                            message:
                              type: string
                              description: Optional custom validation message shown when the rule fires
                              maxLength: 512
                              minLength: 0
                      conditions:
                        description: Conditions AST for a conditional-validation rule
                        properties:
                          schema_version:
                            type: integer
                            format: int32
                            description: Version of the conditions schema
                          root:
                            type: object
                            description: Root node of the recursive conditions tree
                        required:
                        - root
                        - schema_version
                      rule_group_id:
                        type: string
                        description: Group id linking granular rules authored from one admin UI row. Null when ungrouped.
                      expression:
                        type: string
                        description: Derived expression string (e.g. 'default=Carrier, readOnly=true')
                      is_active:
                        type: boolean
                        description: Whether the rule is active and applied; false to deactivate without deleting
                      lov_fields:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: '12345'
                              label:
                                type: string
                              code:
                                type: string
                              active:
                                type: boolean
                      validation_errors:
                        type: array
                        description: Validation issues detected on this rule. Null when the rule is valid; a non-empty list otherwise.
                        items:
                          type: object
                          description: Validation issue detected on a field rule at read time.
                          properties:
                            code:
                              type: string
                              description: Code identifying the class of issue.
                              enum:
                              - FIELDSET_NOT_FOUND
                              - FIELDSET_NOT_MAPPED
                              - FIELD_NOT_FOUND
                              - LOV_ENTRY_NOT_FOUND
                              - VENDOR_NOT_FOUND
                              - STATUS_NOT_FOUND
                              - STATUS_GROUP_MISMATCH
                              - CONDITIONAL_TARGET_FIELD_INELIGIBLE
                              - CONDITIONAL_TARGET_FIELD_ALWAYS_REQUIRED
                              - ASSET_TYPE_NOT_FOUND
                              - TRADE_NOT_FOUND
                              - ASSET_TYPE_HIDDEN_AT_PROJECT
                              - FIELDSET_VALIDATION_UNAVAILABLE
                              - REFERENCE_VALIDATION_UNAVAILABLE
                            severity:
                              type: string
                              description: Severity of the issue ("error" or "warning").
                            cause:
                              type: string
                              description: Description of what went wrong.
                            effect:
                              type: string
                              description: Description of the impact of this issue.
                            remedy:
                              type: string
                              description: Guidance on how an admin can resolve the issue.
                      overridden:
                        type: boolean
                        description: 'Project-scope overlay indicator. Populated only in the project-scoped list view: true when a project rule overrides the company configuration for this field (value and/or editability differs, or no company rule exists); false when the row is inherited from the company with no project override. Null in company-scoped responses.'
                      created_at:
                        type: string
                        format: date-time
                      modified_at:
                        type: string
                        format: date-time
                      created_by:
                        description: Contact Information
                        properties:
                          id:
                            type: string
                            description: User ID
                            example: '12345'
                          name:
                            type: string
                            description: User's full name
                            example: John Doe
                          email:
                            type: string
                            description: User's email address
                            example: user@example.com
                      modified_by:
                        description: Contact Information
                        properties:
                          id:
                            type: string
                            description: User ID
                            example: '12345'
                          name:
                            type: string
                            description: User's full name
                            example: John Doe
                          email:
                            type: string
                            description: User's email address
                            example: user@example.com
        '400':
          description: The server could not understand the request due to invalid syntax or parameters that fail to meet validation requirements.
        '401':
          description: Although the HTTP standard specifies "unauthorized", semantically this response means "unauthenticated". That is, the client must authenticate itself to get the requested response.
        '403':
          description: The client does not have access rights to the content; that is, it is authenticated, but the server is refusing to give the requested resource. Unlike 401, the client's identity is known to the server.
        '404':
          description: The server can not find the requested resource. This can mean either the URL is not recognized, or the resource itself does not exist. Servers may also send this response instead of 403 to hide the existence of a resource from an unauthorized client.
        '422':
          description: The request was well-formed but was unable to be followed due to semantic errors.
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'PUT',\n  url: 'http://localhost:8080/rest/v2.0/companies/1234/assets/settings/naming_standard/%7Brule_id%7D',\n  headers: {\n    'Procore-Company-Id': 'SOME_INTEGER_VALUE',\n    'Accept-Language': 'SOME_STRING_VALUE',\n    'content-type': 'application/json'\n  },\n  body: {\n    rule_type: 'NAMING',\n    fieldset_id: 'string',\n    rule_name: 'string',\n    description: 'string',\n    definition: {},\n    is_active: true,\n    conditions: {schema_version: 0, root: {}}\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: "import http.client\n\nconn = http.client.HTTPConnection(\"localhost:8080\")\n\npayload = \"{\\\"rule_type\\\":\\\"NAMING\\\",\\\"fieldset_id\\\":\\\"string\\\",\\\"rule_name\\\":\\\"string\\\",\\\"description\\\":\\\"string\\\",\\\"definition\\\":{},\\\"is_active\\\":true,\\\"conditions\\\":{\\\"schema_version\\\":0,\\\"root\\\":{}}}\"\n\nheaders = {\n    'Procore-Company-Id': \"SOME_INTEGER_VALUE\",\n    'Accept-Language': \"SOME_STRING_VALUE\",\n    'content-type': \"application/json\"\n    }\n\nconn.request(\"PUT\", \"/rest/v2.0/companies/1234/assets/settings/naming_standard/%7Brule_id%7D\", payload, headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request PUT \\\n  --url http://localhost:8080/rest/v2.0/companies/1234/assets/settings/naming_standard/%7Brule_id%7D \\\n  --header 'Accept-Language: SOME_STRING_VALUE' \\\n  --header 'Procore-Company-Id: SOME_INTEGER_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"rule_type\":\"NAMING\",\"fieldset_id\":\"string\",\"rule_name\":\"string\",\"description\":\"string\",\"definition\":{},\"is_active\":true,\"conditions\":{\"schema_version\":0,\"root\":{}}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Put,\n    RequestUri = new Uri(\"http://localhost:8080/rest/v2.0/companies/1234/assets/settings/naming_standard/%7Brule_id%7D\"),\n    Headers =\n    {\n        { \"Procore-Company-Id\", \"SOME_INTEGER_VALUE\" },\n        { \"Accept-Language\", \"SOME_STRING_VALUE\" },\n    },\n    Content = new StringContent(\"{\\\"rule_type\\\":\\\"NAMING\\\",\\\"fieldset_id\\\":\\\"string\\\",\\\"rule_name\\\":\\\"string\\\",\\\"description\\\":\\\"string\\\",\\\"definition\\\":{},\\\"is_active\\\":true,\\\"conditions\\\":{\\\"schema_version\\\":0,\\\"root\\\":{}}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
    delete:
      tags:
      - default-field-controller
      summary: Delete company naming standard rule
      description: Permanently deletes the naming rule.
      operationId: deleteCompanyNamingStandard
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
        example: '1234'
      - name: rule_id
        in: path
        description: Unique identifier for the naming rule.
        required: true
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: 'Locale for localized response messages (for example: en, fr-FR, pseudo)'
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: The server could not understand the request due to invalid syntax or parameters that fail to meet validation requirements.
        '401':
          description: Although the HTTP standard specifies "unauthorized", semantically this response means "unauthenticated". That is, the client must authenticate itself to get the requested response.
        '403':
          description: The client does not have access rights to the content; that is, it is authenticated, but the server is refusing to give the requested resource. Unlike 401, the client's identity is known to the server.
        '404':
          description: The server can not find the requested resource. This can mean either the URL is not recognized, or the resource itself does not exist. Servers may also send this response instead of 403 to hide the existence of a resource from an unauthorized client.
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'DELETE',\n  url: 'http://localhost:8080/rest/v2.0/companies/1234/assets/settings/naming_standard/%7Brule_id%7D',\n  headers: {\n    'Procore-Company-Id': 'SOME_INTEGER_VALUE',\n    'Accept-Language': 'SOME_STRING_VALUE'\n  }\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: "import http.client\n\nconn = http.client.HTTPConnection(\"localhost:8080\")\n\nheaders = {\n    'Procore-Company-Id': \"SOME_INTEGER_VALUE\",\n    'Accept-Language': \"SOME_STRING_VALUE\"\n    }\n\nconn.request(\"DELETE\", \"/rest/v2.0/companies/1234/assets/settings/naming_standard/%7Brule_id%7D\", headers=headers)\n\nres = conn.getresponse()\ndata = res.read()\n\nprint(data.decode(\"utf-8\"))"
