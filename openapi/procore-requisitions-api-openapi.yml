openapi: 3.2.0
info:
  title: Procore REST Requisitions API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Requisitions
paths:
  /rest/v1.0/requisitions/{requisition_id}/bulk_item_update:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Bulk Update Subcontractor Invoice (Requisitions) Items
      description: Updates all requisition items received in the body. Can be contract items, contract detail items, change-order detail items (CCO SSOV detail rows), or change order items.
      tags:
      - Requisitions
      parameters:
      - name: requisition_id
        in: path
        description: Requisition ID
        required: true
        schema:
          type: integer
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - requisition_items
              properties:
                requisition_items:
                  title: RequisitionBulkItemUpdate
                  type: array
                  description: Requisition Items
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: The id of the item to update
                        example: 1001
                      item_type:
                        type: string
                        description: The type of the item you are updating
                        enum:
                        - contract_item
                        - contract_detail_item
                        - change_order_detail_item
                        - change_order_item
                        example: contract_item
                      work_completed_this_period:
                        type: string
                        description: The amount of work completed this period
                        example: '1000.0'
                      materials_presently_stored:
                        type: string
                        description: The amount of materials presently stored
                        example: '500.0'
                      work_completed_retainage_retained_this_period:
                        type: string
                        description: Work completed retainage amount retained this period (admin user only, work_completed_this_period should be non-zero to hold a retainage)
                        example: '0.22'
                      materials_stored_retainage_currently_retained:
                        type: string
                        description: Materials stored retainage amount currently retained (admin user, amount accounting only, materials_presently_stored should be non-zero to hold a retainage)
                        example: '0.23'
                      work_completed_retainage_released_this_period:
                        type: string
                        description: The amount of work completed retainage released this period
                        example: '0.24'
                      work_completed_this_period_quantity:
                        type: string
                        description: Work completed this period quantity (unit accounting contract only)
                        example: '10.0'
                      subcontractor_claimed_amount:
                        type: string
                        description: The total amount the subcontractor original claimed for this line
                        example: '20.5'
                      status:
                        type: string
                        description: Approval status of the invoice line item
                        enum:
                        - approved
                        - rejected
                        - no_action
                        example: rejected
                      comment:
                        type: string
                        description: Comment about the invoice line item
                        example: This work was not yet completed
                      ssr_manual_override:
                        type: boolean
                        description: Flag indicating the schedule of subcontractor retainage (SSR) was manually overridden for this line item.
                        example: false
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  exception:
                    type: string
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'PATCH',\n  url: 'https://api.procore.com/rest/v1.0/requisitions/%7Brequisition_id%7D/bulk_item_update',\n  qs: {project_id: 'SOME_INTEGER_VALUE'},\n  headers: {'content-type': 'application/json'},\n  body: {\n    requisition_items: [\n      {\n        id: 1001,\n        item_type: 'contract_item',\n        work_completed_this_period: '1000.0',\n        materials_presently_stored: '500.0',\n        work_completed_retainage_retained_this_period: '0.22',\n        materials_stored_retainage_currently_retained: '0.23',\n        work_completed_retainage_released_this_period: '0.24',\n        work_completed_this_period_quantity: '10.0',\n        subcontractor_claimed_amount: '20.5',\n        status: 'rejected',\n        comment: 'This work was not yet completed',\n        ssr_manual_override: false\n      }\n    ]\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


