          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v1.0/requisitions/%7Brequisition_id%7D/bulk_item_update?project_id=SOME_INTEGER_VALUE", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request PATCH \\\n  --url 'https://api.procore.com/rest/v1.0/requisitions/%7Brequisition_id%7D/bulk_item_update?project_id=SOME_INTEGER_VALUE' \\\n  --header 'content-type: application/json' \\\n  --data '{\"requisition_items\":[{\"id\":1001,\"item_type\":\"contract_item\",\"work_completed_this_period\":\"1000.0\",\"materials_presently_stored\":\"500.0\",\"work_completed_retainage_retained_this_period\":\"0.22\",\"materials_stored_retainage_currently_retained\":\"0.23\",\"work_completed_retainage_released_this_period\":\"0.24\",\"work_completed_this_period_quantity\":\"10.0\",\"subcontractor_claimed_amount\":\"20.5\",\"status\":\"rejected\",\"comment\":\"This work was not yet completed\",\"ssr_manual_override\":false}]}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Patch,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/requisitions/%7Brequisition_id%7D/bulk_item_update?project_id=SOME_INTEGER_VALUE\"),\n    Content = new StringContent(\"{\\\"requisition_items\\\":[{\\\"id\\\":1001,\\\"item_type\\\":\\\"contract_item\\\",\\\"work_completed_this_period\\\":\\\"1000.0\\\",\\\"materials_presently_stored\\\":\\\"500.0\\\",\\\"work_completed_retainage_retained_this_period\\\":\\\"0.22\\\",\\\"materials_stored_retainage_currently_retained\\\":\\\"0.23\\\",\\\"work_completed_retainage_released_this_period\\\":\\\"0.24\\\",\\\"work_completed_this_period_quantity\\\":\\\"10.0\\\",\\\"subcontractor_claimed_amount\\\":\\\"20.5\\\",\\\"status\\\":\\\"rejected\\\",\\\"comment\\\":\\\"This work was not yet completed\\\",\\\"ssr_manual_override\\\":false}]}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: bulkUpdateSubcontractorInvoiceRequisitionsItems
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
