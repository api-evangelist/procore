      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'PATCH',\n  url: 'https://api.procore.com/rest/v1.0/prime_contracts/%7Bprime_contract_id%7D/payment_application_line_items/%7Bid%7D',\n  headers: {'content-type': 'application/json'},\n  body: {\n    project_id: 55001,\n    payment_application_line_item: {\n      work_completed_this_period: '1000.00',\n      materials_presently_stored: '500.00',\n      work_completed_retainage_retained_this_period: '100.00',\n      materials_stored_retainage_retained_this_period: '100.00',\n      work_completed_retainage_released_this_period: '0.00',\n      work_completed_this_period_quantity: '10.0'\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
