        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Patch,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/prime_contracts/%7Bprime_contract_id%7D/payment_application_line_items/%7Bid%7D\"),\n    Content = new StringContent(\"{\\\"project_id\\\":55001,\\\"payment_application_line_item\\\":{\\\"work_completed_this_period\\\":\\\"1000.00\\\",\\\"materials_presently_stored\\\":\\\"500.00\\\",\\\"work_completed_retainage_retained_this_period\\\":\\\"100.00\\\",\\\"materials_stored_retainage_retained_this_period\\\":\\\"100.00\\\",\\\"work_completed_retainage_released_this_period\\\":\\\"0.00\\\",\\\"work_completed_this_period_quantity\\\":\\\"10.0\\\"}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
