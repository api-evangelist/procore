          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url http://localhost:8080/rest/v2.0/companies/%7Bcompany_id%7D/projects/%7Bproject_id%7D/viewer_documents/%7Bviewer_doc_id%7D/markups/groups \\\n  --header 'content-type: application/json' \\\n  --data '{\"markup_ids\":[\"string\"],\"source_group_id\":\"string\",\"action\":\"string\",\"pin_id\":\"string\",\"escalate_to_pin\":true}'"
