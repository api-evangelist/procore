openapi: 3.2.0
info:
  title: Procore REST Time and Material Attachments API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Time and Material Attachments
paths:
  /rest/v1.0/projects/{project_id}/time_and_material_entry_attachments:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List all attachments
      description: Return a list of all Time and Material attachments for the specified Project user has access to.
      tags:
      - Time and Material Attachments
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of time and material attachments
                items:
                  type: object
                  description: Time and Material Entry Attachment
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the Time & Material entry attachment.
                      example: 1200
                    attachment_id:
                      type: integer
                      description: Identifier of the underlying stored file for this attachment.
                      example: 1233
                    content_type:
                      type: string
                      description: MIME type of the attached file (e.g., image/jpeg, application/pdf).
                      example: image/jpeg
                    presentation_url:
                      type: string
                      description: Publicly accessible URL for viewing the attached file in a browser.
                      example: http://www.example.com/presentation_url
                    url:
                      type: string
                      description: Direct download URL for the attached file.
                      example: http://www.example.com/
                    thumbnail_url:
                      type: string
                      description: URL for a thumbnail preview of the attached file.
                      example: http://www.example.com/thumbnail_url
                    filename:
                      type: string
                      description: Original filename of the uploaded attachment.
                      example: Example Filename
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments'\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: listAllAttachments
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create attachment
      description: Create a new attachment
      tags:
      - Time and Material Attachments
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - time_and_material_entry_attachment
              - time_and_material_entry_id
              properties:
                time_and_material_entry_id:
                  type: integer
                  description: Identifier of the Time & Material entry to attach files to.
                  example: 13
                time_and_material_entry_attachment:
                  type: object
                  properties:
                    documents:
                      type: array
                      items:
                        type: integer
                        description: Identifier of a document to attach.
                        example: 65
                    folders:
                      type: array
                      items:
                        type: integer
                        description: Identifier of a folder to attach.
                        example: 66
                    upload_uuids:
                      type: array
                      items:
                        type: integer
                        description: UUID of an uploaded file to attach.
                        example: 67
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Time and Material Entry Attachment
                properties:
                  id:
                    type: integer
                    description: Unique identifier of the Time & Material entry attachment.
                    example: 1200
                  attachment_id:
                    type: integer
                    description: Identifier of the underlying stored file for this attachment.
                    example: 1233
                  content_type:
                    type: string
                    description: MIME type of the attached file (e.g., image/jpeg, application/pdf).
                    example: image/jpeg
                  presentation_url:
                    type: string
                    description: Publicly accessible URL for viewing the attached file in a browser.
                    example: http://www.example.com/presentation_url
                  url:
                    type: string
                    description: Direct download URL for the attached file.
                    example: http://www.example.com/
                  thumbnail_url:
                    type: string
                    description: URL for a thumbnail preview of the attached file.
                    example: http://www.example.com/thumbnail_url
                  filename:
                    type: string
                    description: Original filename of the uploaded attachment.
                    example: Example Filename
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments',\n  headers: {'content-type': 'application/json'},\n  body: {\n    time_and_material_entry_id: 13,\n    time_and_material_entry_attachment: {documents: [65], folders: [66], upload_uuids: [67]}\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"time_and_material_entry_id\":13,\"time_and_material_entry_attachment\":{\"documents\":[65],\"folders\":[66],\"upload_uuids\":[67]}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments \\\n  --header 'content-type: application/json' \\\n  --data '{\"time_and_material_entry_id\":13,\"time_and_material_entry_attachment\":{\"documents\":[65],\"folders\":[66],\"upload_uuids\":[67]}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/projects/%7Bproject_id%7D/time_and_material_entry_attachments\"),\n    Content = new StringContent(\"{\\\"time_and_material_entry_id\\\":13,\\\"time_and_material_entry_attachment\\\":{\\\"documents\\\":[65],\\\"folders\\\":[66],\\\"upload_uuids\\\":[67]}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
