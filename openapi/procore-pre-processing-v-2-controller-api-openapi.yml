        title: Python3
        content: 'import http.client


          conn = http.client.HTTPConnection("localhost:8080")


          conn.request("POST", "/rest/v2.0/companies/%7Bcompany_id%7D/file_processors/preprocess/%7Bitem_type%7D/%7Bitem_id%7D?replace_existing=SOME_BOOLEAN_VALUE&attachment_id=SOME_STRING_VALUE&optimize=SOME_BOOLEAN_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
