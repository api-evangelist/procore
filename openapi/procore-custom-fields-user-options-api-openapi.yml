              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of users with access to tool for custom fields
                    items:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            description: The unique identifier of the user.
                            example: '160586'
                          login:
                            type: string
