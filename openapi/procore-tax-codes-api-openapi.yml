  /rest/v2.0/companies/{company_id}/tax/codes/bulk_create:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-endpoint-type: bulk
      summary: Bulk Create Tax Codes
      description: Bulk Create Tax Codes for a given company
      tags:
      - Tax Codes
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Tax Code Bulk Create
              type: array
              items:
                type: object
                required:
                - unique_id
                - tax_code
                properties:
                  unique_id:
                    type: string
                    description: 'Origin ID of external ERP integrated company, will not be persisted in tax code but will be used

                      to build responses and construct relation with outside system'
                    example: 1VT-33778-013
                  tax_code:
                    type: object
                    description: Tax Code fields
                    required:
                    - code
                    properties:
                      code:
                        type: string
                        description: Tax Code Name
                        example: NEW-CODE-1
                      description:
                        type: string
                        description: Tax Code Description
                        example: New Description 1
                      rate:
                        type: object
                        description: 'Tax code rate. Required for non-group codes. Optional for tax groups

                          (`is_group: true`): when omitted, the group rate is the sum of its

                          component rates. When provided, it must equal that sum or the item is rejected.'
                        required:
                        - rate
                        properties:
                          rate:
                            type: string
                            description: Tax Code Rate Value
                            example: '20.0'
                          invoice_tax_application:
                            type: string
                            enum:
                            - NET
                            - GROSS
                            - NONE
                            description: 'Tax Code Invoice Tax Application. Must be NET or GROSS for plain codes

                              and NONE for group tax codes. GROSS and NONE are accepted only when the

                              company is on the new tax experience. When omitted, defaults to NET for

                              plain codes and NONE for groups. Legacy companies must omit this field

                              or send NET.'
                            example: GROSS
                            default: NET
                      is_group:
                        type: boolean
                        description: 'When true, designates this tax code as a group whose effective rate is the sum of its

                          component tax codes. Rate may be omitted (it is derived from those components) or

                          provided if it equals that sum. Requires the tax groups feature flag to be enabled.

                          Must be accompanied by component_unique_ids.'
                        example: true
                      component_unique_ids:
                        type: array
                        description: 'ERP origin IDs of the component tax codes that make up this group. Each ID is resolved

                          to a Procore tax code via the external_data table or, for codes created in the same

                          request, via the unique_id of a sibling item. Required when is_group is true.

                          Only valid when is_group is true.'
                        items:
                          type: string
                        example:
                        - ERP_TAX_001
                        - ERP_TAX_002
