    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-endpoint-type: collection
      summary: Get Tax Codes
      description: Get Tax Codes for a given company
      tags:
      - Tax Codes
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        required: false
        description: Direction (asc/desc) can be controlled by the presence or absence of '-' before the sort parameter
        schema:
          type: string
          enum:
          - code
          - -code
          - id
          - -id
      - name: id
        in: query
        required: true
        description: List of tax code ids
        schema:
          type: array
          items:
            type: integer
      - name: code
        in: query
        required: false
        description: List of tax codes
        schema:
          type: array
          items:
            type: string
      - name: status
        in: query
        required: false
        description: include archived or active tax codes
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - ARCHIVED
      - name: include_rate
        in: query
        required: false
        description: Whether to include rate data
        schema:
          type: boolean
      - name: erp_synced
        in: query
        required: false
        description: 'Whether to filter results to only ERP-synced codes.

          - `true`: Return **only ERP-synced** codes.

          - `false`: Return **all** company codes.

          '
        schema:
          type: boolean
      - name: effective_as_of
        in: query
        required: false
        description: ISO 8601 date string to filter tax codes effective on or after this date. For example, '2024-01-01' returns codes whose rate is valid from January 1, 2024 onward.
        schema:
          type: string
      - name: query
        in: query
        required: false
        description: Partial Search tax codes by code or description
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'Filter by tax code type. Omit to return both.

          - `code` — Return only tax codes (non-groups).

          - `group` — Return only tax groups.

          '
        schema:
          type: string
          enum:
          - code
          - group
      - name: exclude_untaxed
        in: query
        required: false
        description: When true, exclude tax-exempt codes (where untaxed = true).
        schema:
          type: boolean
      - name: include_components
        in: query
        required: false
        description: When true, include component tax codes and their rates for group tax codes (components array in each group).
        schema:
          type: boolean
      - name: include_group_membership
        in: query
        required: false
        description: When true, include member_of_groups (groups this tax code is a component of) for each tax code.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                title: Company Tax Code Index
                type: object
                properties:
                  data:
                    description: Tax Code Index
                    type: array
                    items:
                      title: Company Tax Code
                      description: Tax Code
                      type: object
                      allOf:
                      - title: Common Tax Code Rate Properties
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique string identifier for this tax code. Use as the {id} path parameter in PATCH /rest/v2.0/companies/{company_id}/tax/codes/{id} to update this code.
                            example: '12'
                          code:
                            type: string
                            description: Short identifier string for the tax code (e.g., 'GST-10'). Must be unique within the company. Required on create.
                            example: NEW-CODE-1
                          description:
                            type:
                            - string
                            - 'null'
                            description: Human-readable description of the tax code's purpose (e.g., 'Goods and Services Tax'). Nullable.
                            example: New Description 1
                          archived:
                            type: boolean
                            description: Whether this tax code has been archived. Archived codes are excluded from active selection unless status=ARCHIVED is passed. true = archived, false = active.
                            example: false
                          display_in_budget:
                            type: boolean
                            description: Whether the tax code should be displayed in budget views
                            example: true
                          is_group:
                            type: boolean
                            description: Whether this tax code is a group that aggregates multiple component tax codes
                            example: false
                      - type: object
                        properties:
                          rate:
                            title: Company Rate Code
                            description: Tax Rate Create
                            type: object
                            allOf:
                            - title: Common Tax Code Rate Properties
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Tax Rate ID
                                  example: '12'
                                tax_code_id:
                                  type: string
                                  description: Tax Code Id
                                  example: '13'
                                rate:
                                  type: string
                                  description: Tax Code Rate Value
                                  example: '20.0'
                                effective_start_date:
                                  type: string
                                  description: ISO 8601 date string for when this tax rate becomes effective (e.g., '2024-01-01'). The rate applies to transactions on or after this date.
                                  example: '2024-01-01'
                                effective_end_date:
                                  type:
                                  - string
                                  - 'null'
                                  description: ISO 8601 date string for when this tax rate expires. Null if this is the current active rate with no scheduled successor.
                                  example: '2024-12-31'
                                created_at:
                                  type: string
                                  description: ISO 8601 timestamp when this rate record was created.
                                  example: '2024-01-01T00:00:00Z'
                                invoice_tax_application:
                                  type: string
                                  enum:
                                  - NET
                                  - GROSS
                                  - NONE
                                  description: 'Specifies how tax is applied on invoices. One of: ''NET'' (tax calculated on the net/pre-tax amount), ''GROSS'' (tax calculated on the gross/total amount), ''NONE'' (used for group tax codes — the effective rate is the aggregate of its component codes'' rates).'
                            - type: object
                              properties:
                                created_by:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: String ID of the user who created this tax rate. Use with the Users API to retrieve user details.
                                    name:
                                      type: string
                                      description: Display name of the user who created this tax rate.
                          components:
                            description: Present when include_components=true; component tax codes and rates for group tax codes.
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Component tax code ID
                                  example: '456'
                                code:
                                  type: string
                                  description: Short identifier string of this component tax code.
                                rate:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Tax code rate ID
                                      example: '1001'
                                    rate:
                                      type: number
                                      description: Numeric tax rate percentage for this component (e.g., 10.0 = 10%).
                                    invoice_tax_application:
                                      type: string
                                      enum:
                                      - NET
                                      - GROSS
                                      - NONE
                                      description: 'How tax is applied for this component on invoices. One of: ''NET'' (applied to the net amount), ''GROSS'' (applied to the gross amount), ''NONE'' (used for group tax codes where the effective rate is the aggregate of components).'
                          member_of_groups:
                            description: Present when include_group_membership=true; groups this tax code is a component of (same shape as components).
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  description: Group tax code ID
                                  example: '123'
                                code:
                                  type: string
                                  description: Short identifier string of this group tax code.
                                rate:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Tax code rate ID
                                      example: '1001'
                                    rate:
                                      type: number
                                      description: Numeric effective rate for this group, which is the sum of its component rates.
                                    invoice_tax_application:
                                      type: string
                                      enum:
                                      - NET
                                      - GROSS
                                      - NONE
                                      description: 'How tax is applied for this group on invoices. One of: ''NET'' (applied to the net amount), ''GROSS'' (applied to the gross amount), ''NONE'' (used for group tax codes where the effective rate is the aggregate of components).'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
