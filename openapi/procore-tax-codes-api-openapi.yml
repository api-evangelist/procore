openapi: 3.2.0
info:
  title: Procore REST Tax Codes API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Tax Codes
paths:
  /rest/v2.0/companies/{company_id}/tax/codes:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      x-endpoint-type: mutation
      summary: Create Tax Code
      description: Create Tax Code for a given company
      tags:
      - Tax Codes
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Tax Code Create
              type: object
              required:
              - code
              - description
              - rate
              properties:
                code:
                  type: string
                  description: Tax Code Name
                  example: NEW-CODE-1
                description:
                  type: string
                  description: Tax Code Description
                  example: New Description 1
                rate:
                  type: object
                  description: Tax Code Rate
                  properties:
                    rate:
                      type: string
                      description: Tax Code Rate Value
                      example: '20.0'
                    invoice_tax_application:
                      type: string
                      enum:
                      - gross
                      - net
                      description: Tax Code Invoice Tax Application. GROSS is accepted only when the company is on the new tax experience. Omit or send NET for the legacy experience.
                      example: gross
                display_in_budget:
                  type: boolean
                  description: Whether the tax code should be displayed in budget views
                  example: true
                is_group:
                  type: boolean
                  description: Whether this tax code is a group. A group tax code aggregates multiple component tax codes. Requires the `financials.tax.enable_tax_groups` feature flag to be enabled.
                  example: true
                component_tax_code_ids:
                  type: array
                  description: IDs of the component tax codes that make up this group. Only valid when `is_group` is `true`. Requires the `financials.tax.enable_tax_groups` feature flag to be enabled.
                  items:
                    type: integer
                  example:
                  - 101
                  - 102
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                title: Company Tax Code Create
                type: object
                properties:
                  data:
                    title: Company Tax Code
                    description: Tax Code
                    type: object
                    allOf:
                    - title: Common Tax Code Rate Properties
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique string identifier for this tax code. Use as the {id} path parameter in PATCH /rest/v2.0/companies/{company_id}/tax/codes/{id} to update this code.
                          example: '12'
                        code:
                          type: string
                          description: Short identifier string for the tax code (e.g., 'GST-10'). Must be unique within the company. Required on create.
                          example: NEW-CODE-1
                        description:
                          type:
                          - string
                          - 'null'
                          description: Human-readable description of the tax code's purpose (e.g., 'Goods and Services Tax'). Nullable.
                          example: New Description 1
                        archived:
                          type: boolean
                          description: Whether this tax code has been archived. Archived codes are excluded from active selection unless status=ARCHIVED is passed. true = archived, false = active.
                          example: false
                        display_in_budget:
                          type: boolean
                          description: Whether the tax code should be displayed in budget views
                          example: true
                        is_group:
                          type: boolean
                          description: Whether this tax code is a group that aggregates multiple component tax codes
                          example: false
                    - type: object
                      properties:
                        rate:
                          title: Company Rate Code
                          description: Tax Rate Create
                          type: object
                          allOf:
                          - title: Common Tax Code Rate Properties
                            type: object
                            properties:
                              id:
                                type: string
                                description: Tax Rate ID
                                example: '12'
                              tax_code_id:
                                type: string
                                description: Tax Code Id
                                example: '13'
                              rate:
                                type: string
                                description: Tax Code Rate Value
                                example: '20.0'
                              effective_start_date:
                                type: string
                                description: ISO 8601 date string for when this tax rate becomes effective (e.g., '2024-01-01'). The rate applies to transactions on or after this date.
                                example: '2024-01-01'
                              effective_end_date:
                                type:
                                - string
                                - 'null'
                                description: ISO 8601 date string for when this tax rate expires. Null if this is the current active rate with no scheduled successor.
                                example: '2024-12-31'
                              created_at:
                                type: string
                                description: ISO 8601 timestamp when this rate record was created.
                                example: '2024-01-01T00:00:00Z'
                              invoice_tax_application:
                                type: string
                                enum:
                                - NET
                                - GROSS
                                - NONE
                                description: 'Specifies how tax is applied on invoices. One of: ''NET'' (tax calculated on the net/pre-tax amount), ''GROSS'' (tax calculated on the gross/total amount), ''NONE'' (used for group tax codes — the effective rate is the aggregate of its component codes'' rates).'
                          - type: object
                            properties:
                              created_by:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: String ID of the user who created this tax rate. Use with the Users API to retrieve user details.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: HTTP status in screaming snake case (like BAD_REQUEST)
                      message:
                        type: string
                        description: Human readable message describing error.
                      details:
                        type: array
                        description: Additional information about the error.
                        items:
                          type: object
                          required:
                          - reason_code
                          - message
                          properties:
                            reason_code:
                              type: string
                              description: A machine-readable code that identifies the error specifically enough for the client to interpret what happened and take action.
                              example: BLANK
                            message:
                              type: string
                              description: Human readable message
                              example: Name can't be blank
                            source:
                              type: string
                              description: Source of the error
                              example: name
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/tax/codes',\n  headers: {'content-type': 'application/json'},\n  body: {\n    code: 'NEW-CODE-1',\n    description: 'New Description 1',\n    rate: {rate: '20.0', invoice_tax_application: 'gross'},\n    display_in_budget: true,\n    is_group: true,\n    component_tax_code_ids: [101, 102]\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"code\":\"NEW-CODE-1\",\"description\":\"New Description 1\",\"rate\":{\"rate\":\"20.0\",\"invoice_tax_application\":\"gross\"},\"display_in_budget\":true,\"is_group\":true,\"component_tax_code_ids\":[101,102]}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v2.0/companies/%7Bcompany_id%7D/tax/codes", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/tax/codes \\\n  --header 'content-type: application/json' \\\n  --data '{\"code\":\"NEW-CODE-1\",\"description\":\"New Description 1\",\"rate\":{\"rate\":\"20.0\",\"invoice_tax_application\":\"gross\"},\"display_in_budget\":true,\"is_group\":true,\"component_tax_code_ids\":[101,102]}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v2.0/companies/%7Bcompany_id%7D/tax/codes\"),\n    Content = new StringContent(\"{\\\"code\\\":\\\"NEW-CODE-1\\\",\\\"description\\\":\\\"New Description 1\\\",\\\"rate\\\":{\\\"rate\\\":\\\"20.0\\\",\\\"invoice_tax_application\\\":\\\"gross\\\"},\\\"display_in_budget\\\":true,\\\"is_group\\\":true,\\\"component_tax_code_ids\\\":[101,102]}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
