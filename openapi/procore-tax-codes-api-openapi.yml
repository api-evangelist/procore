          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"code\":\"NEW-CODE-1\",\"description\":\"New Description 1\",\"archived\":false,\"rate\":{\"rate\":\"20.0\",\"invoice_tax_application\":\"GROSS\",\"effective_start_date\":\"2023-01-01T00:00:00Z\"},\"display_in_budget\":true,\"is_group\":true,\"component_tax_code_ids\":[101,102]}"


          headers = { ''content-type'': "application/json" }


          conn.request("PATCH", "/rest/v2.0/companies/%7Bcompany_id%7D/tax/codes/%7Bid%7D", payload, headers)


          res = conn.getresponse()

          data = res.read()


