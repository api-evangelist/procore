openapi: 3.2.0
info:
  title: Procore REST Managed Equipment API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Managed Equipment
paths:
  /rest/v1.0/companies/{company_id}/managed_equipment:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      deprecated: true
      x-deprecated-at: '2024-12-01'
      x-sunset: '2025-12-02'
      summary: List all Equipment
      description: Return a list of all Equipment with details for a specified company.
      tags:
      - Managed Equipment
      parameters:
      - name: company_id
        in: path
        description: Unique identifier for the company.
        required: true
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[updated_at]
        in: query
        description: 'Return item(s) last updated within the specified ISO 8601 datetime range.

          Formats:

          `YYYY-MM-DD`...`YYYY-MM-DD` - Date

          `YYYY-MM-DDTHH:MM:SSZ`...`YYYY-MM-DDTHH:MM:SSZ` - DateTime with UTC Offset

          `YYYY-MM-DDTHH:MM:SS+XX:00`...`YYYY-MM-DDTHH:MM:SS+XX:00` - Datetime with Custom Offset'
        required: false
        schema:
          type: string
          format: date
      - name: filters[managed_equipment_id]
        in: query
        description: Return item(s) with the specified Managed Equipment ID.
        schema:
          type: integer
      - name: filters[managed_equipment_category_id]
        in: query
        description: Return item(s) with the specified Managed Equipment Category ID.
        schema:
          type: integer
      - name: filters[managed_equipment_type_id]
        in: query
        description: Return item(s) with the specified Managed Equipment Type ID.
        schema:
          type: integer
      - name: filters[managed_equipment_make_id]
        in: query
        description: Return item(s) with the specified Managed Equipment Make ID.
        schema:
          type: integer
      - name: filters[managed_equipment_model_id]
        in: query
        description: Return item(s) with the specified Managed Equipment Model ID.
        schema:
          type: integer
      - name: filters[company_visible]
        in: query
        description: If true, return item(s) with 'company visible' status.
        schema:
          type: boolean
      - name: filters[current_project_id]
        in: query
        description: Return item(s) with the specified current project ID.
        schema:
          type: integer
      - name: filters[year]
        in: query
        description: Return item(s) with the specified year.
        schema:
          type: integer
      - name: filters[status]
        in: query
        description: Returns item(s) matching the specified status value.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: filters[last_service_date]
        in: query
        description: Return item(s) with a last service date within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
      - name: filters[next_service_date]
        in: query
        description: Return item(s) with a next service date within the specified ISO 8601 datetime range.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Equipment
                items:
                  type: object
                  description: Managed Equipment
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the managed equipment.
                      example: 75414
                    name:
                      type: string
                      description: Display name of the managed equipment.
                      example: Backhoe
                    company_id:
                      type: integer
                      description: Identifier of the company that owns this managed equipment.
                      example: 1
                    current_project_id:
                      type: integer
                      description: Identifier of the project this equipment is currently dispatched to. Null if not assigned.
                      example: 1
                    company_visible:
                      type: boolean
                      description: Whether this equipment is visible at the company level across all projects.
                      example: false
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when this managed equipment was last modified, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this managed equipment was created, in ISO 8601 format.
                      example: '2015-11-12T21:26:28Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when this managed equipment was soft-deleted, in ISO 8601 format. Null if the record is active.
                      example: '2015-11-12T21:26:28Z'
                    serial_number:
                      type: string
                      description: Serial number of the equipment.
                      example: S#12892
                    identification_number:
                      type: string
                      description: Identification number of the equipment.
                      example: ID#9018290
                    description:
                      type: string
                      description: Description of the equipment.
                      example: This equipment was brought in for the backyard work.
                    managed_equipment_make_id:
                      type: integer
                      description: Identifier of the equipment make associated with this equipment.
                      example: 14
                    managed_equipment_model_id:
                      type: integer
                      description: Identifier of the equipment model associated with this equipment.
                      example: 13
                    managed_equipment_type_id:
                      type: integer
                      description: Identifier of the equipment type associated with this equipment.
                      example: 132
                    managed_equipment_category_id:
                      type: integer
                      description: Identifier of the equipment category associated with this equipment.
                      example: 13
                    year:
                      type: integer
                      description: Year the equipment was manufactured in.
                      example: 2017
                    status:
                      type: string
                      description: Current operational status of the equipment.
                      enum:
                      - available
                      - in_use
                      - under_maintenance
                      example: in_use
                    ownership:
                      type: string
                      description: Ownership arrangement for this equipment.
                      enum:
                      - owned
                      - rented
                      - sub
                      example: owned
