      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Materials
      description: Return a list of all Materials
      tags:
      - Material
      parameters:
      - name: project_id
        in: path
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Materials
                items:
                  type: object
                  description: Material
                  properties:
                    id:
                      type: integer
                      description: Unique identifier of the material entry.
                      example: 13
                    name:
                      type: string
                      description: Name of the material.
                      example: Wallpaper
                    description:
                      type: string
                      description: Description of the material.
                      example: This Material was used for the upper portion of the wall
                    uom:
                      type: string
                      description: Unit of measure for the material quantity (e.g., sf, lf, ea).
                      example: sf
                    quantity:
                      type: number
                      format: float
                      description: Amount of material used, in the specified unit of measure.
                      example: '2250.75'
                    project_id:
                      type: integer
                      description: Identifier of the project this material was logged for.
                      example: 14406
                    time_and_material_entry_id:
                      type: integer
                      description: Identifier of the Time & Material entry this material belongs to.
                      example: 13
                    material_id:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      description: Identifier of the associated material in the Materials catalog microservice, formatted as a UUID. Null when the material is not linked to a catalog record.
                      example: 019dac6d-e353-7a89-ab24-3637e2bf17bb
                    updated_at:
                      type: string
                      format: date-time
                      description: Timestamp when this material entry was last modified, in ISO 8601 format.
                      example: '2019-11-12T21:26:28Z'
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when this material entry was created, in ISO 8601 format.
                      example: '2019-11-12T21:26:28Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when this material entry was soft-deleted, in ISO 8601 format. Null if the record is active.
                      example: '2019-11-12T21:26:28Z'
                    created_by:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the user who created this material entry.
                          example: 160586
                        login:
                          type: string
                          description: Email address of the user who created this material entry.
                          example: carl.contractor@example.com
                        name:
                          type: string
                          description: Full name of the user who created this material entry.
                          example: Carl Contractor
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
