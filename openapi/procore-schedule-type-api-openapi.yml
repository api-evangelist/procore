      requestBody:
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - project_id
              - schedule_type
              properties:
                project_id:
                  type: integer
                  description: The ID of the Project the Schedule Type belongs to
                schedule_type:
                  title: Schedule Type
                  type: object
                  description: The schedule integration type to set for the project.
                  required:
                  - key
                  properties:
                    key:
                      type: string
                      enum:
                      - Microsoft Project
                      - Microsoft Project 2010
                      - Microsoft Project Documents
                      - Primavera P6
                      description: Schedule integration type.
                    p6_id:
                      type: string
                      description: Primavera P6 project identifier, used when the type is Primavera P6.
              example:
                project_id: 513526
                schedule_type:
                  key: Primavera P6
                  p6_id: 123456abc
        required: true
