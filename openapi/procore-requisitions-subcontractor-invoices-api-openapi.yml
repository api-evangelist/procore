      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/requisitions',\n  headers: {'content-type': 'application/json'},\n  body: {\n    project_id: 55001,\n    commitment_id: 66005,\n    attachments: ['string'],\n    requisition: {\n      period_id: 20093,\n      requisition_start: '2013-10-01',\n      requisition_end: '2013-10-31',\n      billing_date: '2013-10-31',\n      final: true,\n      invoice_number: 'ABC-1234',\n      payment_date: '2013-11-15',\n      origin_data: 'XYZ-0012',\n      origin_id: 'abc-123',\n      status: 'under_review',\n      submitted_at: '2013-11-02',\n      comment: 'Materials requested for foyer upgrade.',\n      'custom_field_%{custom_field_definition_id}': 'custom field value'\n    }\n  },\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"project_id\":55001,\"commitment_id\":66005,\"attachments\":[\"string\"],\"requisition\":{\"period_id\":20093,\"requisition_start\":\"2013-10-01\",\"requisition_end\":\"2013-10-31\",\"billing_date\":\"2013-10-31\",\"final\":true,\"invoice_number\":\"ABC-1234\",\"payment_date\":\"2013-11-15\",\"origin_data\":\"XYZ-0012\",\"origin_id\":\"abc-123\",\"status\":\"under_review\",\"submitted_at\":\"2013-11-02\",\"comment\":\"Materials requested for foyer upgrade.\",\"custom_field_%{custom_field_definition_id}\":\"custom field value\"}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.0/requisitions", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
