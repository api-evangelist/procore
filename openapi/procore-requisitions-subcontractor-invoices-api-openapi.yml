        description: '`previous_requisition_id` was always `null` for invoices whose `contract_invoicing_method` is `simplified`, because Simplified Invoicing does not store an invoice chain. It is now resolved as the non-deleted invoice on the same commitment that immediately precedes this one (`null` for the first invoice on the commitment). The field, its type and its nullability are unchanged; only the value for Simplified Invoicing invoices changes, and the field was never functional for them. Simplified Invoicing is not generally available, so no existing integration is affected. Progressive invoices are unaffected.'
