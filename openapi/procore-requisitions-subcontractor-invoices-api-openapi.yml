                              allowed: true
                              tooltip: null
                            status:
                              allowed: false
                              tooltip: The status of this invoice cannot be changed because there is a workflow enabled for this project.
                            items:
                              status:
                                allowed: true
                                tooltip: null
                              work_completed_this_period:
                                allowed: false
                                tooltip: Only the most recently created Invoice is editable or deletable
