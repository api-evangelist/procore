  /rest/v1.0/requisitions/{requisition_id}/single_pdf_compilers:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: requisition_id
      in: path
      description: Requisition (Subcontractor Invoice) ID
      required: true
      schema:
        type: integer
    - name: polling
      in: query
      description: When true, the response returns a `job_url` you can poll for async compilation status. When false or omitted, the compiled PDF is emailed to the requesting user and the response body is empty.
      required: false
      schema:
        type: boolean
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: Merges one or more PDFs of a requisition into a single PDF
      description: 'Merges one or more PDFs of a requisition into a single PDF. There are two ways to use this endpoint. First to generate a cover sheet for the requisition.

        If you would like to receive a polling URL that will follow the job provide the polling option in the query params `polling=true`. If you would like the file emailed to you omit the polling param in the query params.

        You can use the following request payload as an example


        ````json

        {

        "files":[

        {"type": "cover_sheet", "id": ""}

        ]

        }

        ````

        If you would like to include some attachments, you can use the following request payload as an example


        ````json

        {

        "files": [

        {

        "id": "",

        "type": "cover_sheet"

        },

        {

        "id": 1234,

        "url": "http://example.com/file_1.pdf",

        "type": "prostore_file"

        }

        ]

        }

        ````'
      tags:
      - Requisitions (Subcontractor Invoices)
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  items:
                    type: object
                    description: File associated with the requisition
                    required:
                    - type
                    - id
                    properties:
                      type:
                        type: string
                        description: Kind of file to include in the merged output. Use `cover_sheet` to generate the requisition cover sheet, or `prostore_file` to include an existing attachment referenced by `id`.
                        example: prostore_file
                      id:
                        type: integer
                        description: ID of the file to include. For `prostore_file` entries this is the Prostore file ID; for a `cover_sheet` entry send an empty value since the cover sheet is generated on demand.
                        example: 1234
                      url:
                        type: string
                        description: Optional source URL of the file to include, when the file is referenced by location rather than by stored attachment ID.
                        example: https://example.com/foo.pdf
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                oneOf:
                - type: object
                  description: An Invoicing Async Job URL
                  properties:
                    job_url:
                      type: string
                      description: URL to query for the job status
                      example: https://procore.com/rest/v1.0/companies/1/invoices/async_jobs/1234
                - type: object
                  description: Empty Response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
