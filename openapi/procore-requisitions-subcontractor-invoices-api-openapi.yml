openapi: 3.2.0
info:
  title: Procore REST Requisitions (Subcontractor Invoices) API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Requisitions (Subcontractor Invoices)
paths:
  /rest/v1.0/requisitions/{requisition_id}/change_histories:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: requisition_id
      in: path
      description: Requisition (Subcontractor Invoice) ID
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Requisition (Subcontractor Invoice) Change Histories
      description: Return a list of Requisition (Subcontractor Invoice) Change Histories
      tags:
      - Requisitions (Subcontractor Invoices)
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Array of Change Histories
                items:
                  type: object
                  description: Invoice Change History
                  properties:
                    id:
                      type: integer
                      description: Unique identifier for this change history entry.
                      example: 101
                    column:
                      type: string
                      description: Name of the field/attribute that was changed on the record.
                      example: assignee_id
                    old_value:
                      type: string
                      description: Human-readable value of the field before the change. Returns "None" when the previous value was blank.
                      example: The original title
                    new_value:
                      type: string
                      description: Human-readable value of the field after the change. Returns "None" when the new value is blank.
                      example: The updated title
                    action_by:
                      type: string
                      description: Full name of the user who made the change.
                      example: Tom Sawyer
                    action_by_id:
                      type: integer
                      description: ID of the user who made the change.
                      example: 1011
                    created_at:
                      type: string
                      format: date-time
                      description: Timestamp when the change was recorded, in ISO 8601 format.
                      example: '2018-05-08T13:21:20Z'
                    ref_id:
                      type: integer
                      description: ID of the record the change was made on.
                      example: 5424666
                    ref_type:
                      type: string
                      description: Type of the record the change was made on.
                      example: Billings::Requisition
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  exception:
                    type: string
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/requisitions/%7Brequisition_id%7D/change_histories',\n  qs: {project_id: 'SOME_INTEGER_VALUE'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          conn.request("GET", "/rest/v1.0/requisitions/%7Brequisition_id%7D/change_histories?project_id=SOME_INTEGER_VALUE")


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/requisitions/%7Brequisition_id%7D/change_histories?project_id=SOME_INTEGER_VALUE'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/requisitions/%7Brequisition_id%7D/change_histories?project_id=SOME_INTEGER_VALUE\"),\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Added Requisition (Subcontractor Invoice) Change Histories endpoint
        description: This endpoint returns the change history associated with a requisition
        endpoint: GET /requisitions/{requisition_id}/change_histories
        type: new
        breaking: false
        datestamp: '2020-07-09'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: requisition-subcontractor-invoice-change-histories?version=1.0#list-requisition-subcontractor-invoice-change-histories
      operationId: listRequisitionSubcontractorInvoiceChangeHistories
  /rest/v1.0/requisitions/{requisition_id}/change_order_items:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: requisition_id
      in: path
      description: Requisition (Subcontractor Invoice) ID
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Requisition (Subcontractor Invoice) Change Order Items
      description: 'Return a list of Requisition (Subcontractor Invoice) Change Order Items


        See Filtering on List Actions for information on using the filtering capabilities provided by this endpoint.'
      tags:
      - Requisitions (Subcontractor Invoices)
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[change_order_id]
        in: query
        description: Return item(s) associated to Change Orders with the specified IDs.
        style: form
        explode: false
        required: false
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                description: Array of Requisition (Subcontractor Invoice) Change Order Items
                items:
                  type: object
                  description: Requisition (Subcontractor Invoice) Change Order Item
                  properties:
                    id:
                      type: integer
                      description: ID for Change Order Item
                      example: 341256
                    cost_code_id:
                      description: Cost Code ID
                      example: 21585118
                      type:
                      - integer
                      - 'null'
                    line_item_id:
                      type: integer
                      description: Line Item ID
                      example: 3129856
                    commitment_line_item_id:
                      type: integer
                      description: Commitment Line Item ID
                      example: 3129856
                    commitment_line_item_origin_id:
                      type: string
                      description: Commitment Line Item Origin ID
                      example: abc-123
                    description_of_work:
                      description: Description of work
                      example: Install windows
                      type:
                      - string
                      - 'null'
                    scheduled_value:
                      type: string
                      description: Scheduled value amount
                      example: '1.00'
                    work_completed_from_previous_application:
                      type: string
                      description: Work completed from previous application amount
                      example: '0.00'
                    work_completed_this_period:
                      type: string
                      description: Work completed this period amount
                      example: '0.00'
                    materials_presently_stored:
                      type: string
                      description: Materials presently stored amount. Only present when using amount based accounting.
                      example: '0.00'
                    total_completed_and_stored_to_date:
                      type: string
                      description: Total completed and stored to date amount
                      example: '0.00'
                    total_completed_and_stored_to_date_percent:
                      type: string
                      description: Total completed and stored to date percent
                      example: '0.0'
                    work_completed_retainage_from_previous_application:
                      type: string
                      description: Work completed retainage amount from previous application
                      example: '0.0'
                    work_completed_retainage_retained_this_period:
                      type: string
                      description: Work completed retainage amount retained this period
                      example: '0.0'
                    work_completed_retainage_percent_this_period:
                      type: string
                      description: Work completed retainage percent this period
                      example: '10.0'
                    materials_stored_retainage_currently_retained:
                      type: string
                      description: Materials stored retainage amount currently retained. Only present when using amount based accounting.
                      example: '0.0'
                    materials_stored_retainage_percent_this_period:
                      type: string
                      description: Materials stored retainage percent this period. Only present when using amount based accounting.
                      example: '10.0'
                    work_completed_retainage_released_this_period:
                      type: string
                      description: Work completed retainage amount released this period
                      example: '0.0'
                    materials_stored_retainage_released_this_period:
                      type: string
                      description: Materials stored retainage amount released this period. Only present when using amount based accounting.
                      example: '0.0'
                    scheduled_quantity:
                      type: string
                      description: Scheduled quantity. Only present when using unit based accounting.
                      example: '0.0'
                    scheduled_unit_price:
                      type: string
                      description: Scheduled unit price. Only present when using unit based accounting.
                      example: '0.0'
                    work_completed_this_period_quantity:
                      type: string
                      description: Work completed this period quantity. Only present when using unit based accounting.
                      example: '0.0'
                    work_completed_from_previous_application_quantity:
                      type: string
                      description: Work completed from previous application quantity. Only present when using unit based accounting.
                      example: '0.0'
                    change_order_package_id:
                      type: integer
                      description: ID for Change Order Package
                      example: 12345
                    subcontractor_claimed_amount:
                      type: string
                      description: Amount claimed by the subcontractor for this line item.
                      example: '0.0'
                    comment:
                      type:
                      - string
                      - 'null'
                      description: Free-form comment on this change order item. Null when no comment is set.
                      example: Installation charges
                    status:
                      type: string
                      description: Review status of the change order item. See the enum for allowed values.
                      enum:
                      - approved
                      - rejected
                      - no_action
                      example: no_action
                    ssr_manual_override:
                      type: boolean
                      description: Whether the Sliding Scale Retainage (SSR) amounts on this line item have been manually overridden.
                      example: false
                    wbs_code:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Wbs Code ID
                          example: 999
                        flat_code:
                          type: string
                          description: Wbs Code
                          example: 01-011.CT1
                        description:
                          type: string
                          description: Wbs Code Description
                          example: Project Engineer.Cost Type 1
                    position:
                      type: integer
                      description: Sort position of this item within the change order.
                      example: 1
                    currency_configuration:
                      type: object
                      description: Currency Configuration
                      properties:
                        currency_iso_code:
                          type: string
                          description: ISO Code for the Currency
                          example: USD
                    materials_moved:
                      type: string
                      description: Materials automatically moved from previous line item into previous work completed. This will be non-zero only if move_materials_to_previous_work_completed is true on the payment application.
                      example: '0.00'
                    materials_retainage_retained_moved:
                      type: string
                      description: Retainage on materials automatically moved from previous line item into work completed retainage amount accrued previously. This will be non-zero only if move_materials_to_previous_work_completed is true on the payment application.
                      example: '0.00'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
