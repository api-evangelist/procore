                  action_policy:
                    allOf:
                    - type: object
                      description: 'Action policy for a Requisition (Subcontractor Invoice). Each key under `controls` is the name of an action (e.g. `update`, `destroy`, `send_to_erp`); each leaf is a `{ allowed: boolean, tooltip: string|null }` pair indicating whether the calling user can perform that action and, if not, why. Action-shaped controls (like `destroy`) nest a single `requisition` key, while field-shaped controls (like `update`) list one key per editable field; field-shaped controls may also nest an `items` object to gate edits on individual line item fields. `remove_billable_change_orders` additionally nests a `change_orders` object keyed by change order id, giving a per-change-order verdict (for example, a change order that was already billed on a previous invoice cannot be removed) alongside the requisition-level verdict.'
                      properties:
                        controls:
                          type: object
                          description: Map of action names to their permission descriptors.
                      example:
                        controls:
                          destroy:
                            requisition:
                              allowed: false
                              tooltip: Only the most recently created Invoice is deletable
                          send_to_erp:
                            requisition:
                              allowed: false
                              tooltip: This invoice is not in a status that can be sent to ERP
                          remove_billable_change_orders:
                            requisition:
                              allowed: true
                              tooltip: null
                            change_orders:
