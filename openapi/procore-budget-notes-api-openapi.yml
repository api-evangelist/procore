      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Budget Notes object
              properties:
                note:
                  type:
                  - string
                  - 'null'
                  description: Note text for the budget or forecasting row. The note key must be present. Send an empty string or null to clear the note. Omitting the key returns 400.
                  example: A very important budget note
                label:
                  type: string
                  description: The custom name you have assigned to your Budget Note column. Use 'Notes' if using the default name
                  example: Notes
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Budget Notes
                    properties:
                      note:
                        type: string
                        description: The note that was saved for a budget or a forecast row
                        example: A very important note
                      user:
                        type:
                        - string
                        - 'null'
                        description: Display name of the user who last created or updated the note. Null when no author history is available.
                        example: John Doe
                      updated_at:
                        type: string
                        description: Human-readable, locale- and timezone-formatted timestamp of when the note was last updated. Display only; not ISO 8601.
                        example: Oct 2, 2024, 5:15 AM PDT
