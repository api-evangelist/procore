  /rest/v1.0/projects/{project_id}/checklist/lists/filter_options/assets:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      required: true
      description: Unique identifier for the project.
      schema:
        type: integer
    x-compliance-level: partial
    get:
      x-doc:
        visibility: public
        stage: beta
        exposure: public
      summary: List Checklist List Asset Filter Options
      description: Returns a page of assets linked to inspections for filtering, each with a key (asset id) and value ("Code - Name" label). Defaults to 100 options per page (maximum 100). Optional query searches linked assets by code or name. Pagination and search are applied by Assets lookup over the full set of linked ids.
      tags:
      - Checklist List Filter Options
      parameters:
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Number of asset filter options to return per page. Defaults to 100. Maximum is 100.
        required: false
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 100
      - name: query
        in: query
        description: Search query to filter linked assets by code or name
        required: false
        schema:
          type: string
      - name: filters[inspection_type_grouping]
        in: query
        description: Filter by inspection type grouping
        required: false
        schema:
          type: string
          enum:
          - quality
          - safety
      - name: view
        in: query
        description: Set to 'recycle_bin' to return filter options from deleted inspections
        required: false
        schema:
          type: string
          enum:
          - recycle_bin
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Checklist List Filter Options Response
                  properties:
                    key:
                      type: string
                      description: ID of Checklist List filter object
                      example: '54'
                    value:
                      type: string
                      description: Value of Checklist List filter object
                      example: Value
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
