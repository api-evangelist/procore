openapi: 3.2.0
info:
  title: Procore REST Observation Assignee Options API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Observation Assignee Options
paths:
  /rest/v1.0/observations/assignees:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: List Observation Assignee options
      description: 'Returns the Project users the requesting user is permitted to assign to an Observation. Call this before setting `observation[assignee_id]` (Assignee is a single-select) or `observation[assignee_ids]` (Assignee is a multi-select) — assigning a user absent from this list is rejected with a `403`.


        The list narrows based on the requesting user''s own permissions: users who cannot assign standard-level members see only Observations admins.'
      tags:
      - Observation Assignee Options
      parameters:
      - name: project_id
        in: query
        required: true
        description: Unique identifier for the project.
        schema:
          type: integer
      - name: page
        in: query
        description: Page
        schema:
          type: integer
      - name: per_page
        in: query
        description: Elements per page
        schema:
          type: integer
      - name: filters[category_id]
        in: query
        required: false
        description: ID of the Observation Category used to narrow the returned users to those eligible to be assigned an Observation in that category.
        schema:
          type: integer
          example: 1
      responses:
        '200':
          description: OK
          headers:
            Per-Page:
              description: Number of items retrieved per page
              schema:
                type: integer
            Total:
              description: Total number of items to be retrieved
              schema:
                type: integer
            Link:
              description: Link headers for the first, prev, next, and last link
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  title: Observation Item Assignee
                  type: object
                  properties:
                    id:
                      type: integer
                      description: User ID of a person the requesting user is allowed to assign to an Observation. When Assignee is a single-select, pass as `observation[assignee_id]`. When Assignee is a multi-select, pass inside `observation[assignee_ids]`.
                      example: 9378
                    name:
                      type: string
                      description: User's name, formatted first-name-first.
                      example: Katrina Smith
                    vendor:
                      type:
                      - object
                      - 'null'
                      description: Company the user belongs to in this Procore company directory. Null when the user is not associated with a vendor. Use `vendor.id` with `filters[assignee_company_id]` to list Observations assigned to that company.
                      properties:
                        id:
                          type: integer
                          description: Vendor ID of the user's company.
                          example: 2675
                        name:
                          type: string
                          description: Name of the user's company.
                          example: Brick and Morty
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'GET',\n  url: 'https://api.procore.com/rest/v1.0/observations/assignees',\n  qs: {\n    project_id: 'SOME_INTEGER_VALUE',\n    page: 'SOME_INTEGER_VALUE',\n    per_page: 'SOME_INTEGER_VALUE',\n    'filters[category_id]': '1'\n  },\n  headers: {Authorization: 'Bearer REPLACE_BEARER_TOKEN'}\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          headers = { ''Authorization'': "Bearer REPLACE_BEARER_TOKEN" }


          conn.request("GET", "/rest/v1.0/observations/assignees?project_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bcategory_id%5D=1", headers=headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        title: Curl
        content: "curl --request GET \\\n  --url 'https://api.procore.com/rest/v1.0/observations/assignees?project_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bcategory_id%5D=1' \\\n  --header 'Authorization: Bearer REPLACE_BEARER_TOKEN'"
      - id: csharp_httpclient
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Get,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/observations/assignees?project_id=SOME_INTEGER_VALUE&page=SOME_INTEGER_VALUE&per_page=SOME_INTEGER_VALUE&filters%5Bcategory_id%5D=1\"),\n    Headers =\n    {\n        { \"Authorization\", \"Bearer REPLACE_BEARER_TOKEN\" },\n    },\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      x-changelog:
      - summary: Filter observations assignees endpoint by Observation Category
        description: 'Updated the observations assignees endpoint to accept an optional `filters[category_id]` parameter. Where

          advanced Observations permissions are in use, the endpoint now returns only the users who can be assigned

          an Observation in that category. When the parameter is omitted, it returns the users who can be assigned

          in at least one category the logged-in user can create an Observation in.'
        endpoint: GET /observations/assignees
        type: refinement
        breaking: false
        datestamp: '2026-09-13'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: observations-assignees?version=1.0#list-observation-assignee-options
      - summary: Update observations assignees endpoint to support granular permissions
        description: 'Updated the observations assignees endpoint to return users based on granular permissions. The endpoint now respects

          "Can be Assigned as Observation Assignee" and "Assign Observations to Users in the Same Company" granular

          permissions, allowing read-only users with the appropriate granular permissions to be included in the

          assignable users list.'
        endpoint: GET /observations/assignees
        type: refinement
        breaking: false
        datestamp: '2025-09-17'
        versions:
        - '1.0'
        x-doc:
          visibility: public
          stage: ga
          exposure: public
        link: observations-assignees?version=1.0#list-observation-assignee-options
      operationId: listObservationAssigneeOptions
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
