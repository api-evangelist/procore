openapi: 3.2.0
info:
  title: Procore REST Coordination Issue Assignment API
  version: v1.0/v2.0
  description: Merged from the per-resource OpenAPI documents Procore publishes through its developer portal (https://developers.procore.com/api/v1/resource_groups). Originals are kept verbatim in openapi/_original/resources/.
  x-source: https://developers.procore.com/api/v1/resource_groups
servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Coordination Issue Assignment
paths:
  /rest/v1.0/coordination_issues/{coordination_issue_id}/assignments:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Coordination Issue Assignment
      description: 'Create a Coordination Issue Assignment, which executes a series of actions that updates

        coordination issue assignee_id and creates an instance of CoordinationIssueActivity.'
      tags:
      - Coordination Issue Assignment
      parameters:
      - name: coordination_issue_id
        in: path
        description: Coordination Issue ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - project_id
              - coordination_issue_assignment
              properties:
                project_id:
                  type: integer
                  description: Unique identifier for the project.
                  example: 12345
                coordination_issue_assignment:
                  type: object
                  required:
                  - assignee_id
                  properties:
                    assignee_id:
                      type: integer
                      description: ID of Procore user that should be assigned the issue
                      example: 624
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Coordination Issue Assignment
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the coordination issue assignment.
                    example: 101
                  coordination_issue_id:
                    type: integer
                    description: Coordination Issue ID
                    example: 86
                  old_assignee_id:
                    type: integer
                    description: Coordination Issue Assignee ID before the change
                    example: 99
                  new_assignee_id:
                    type: integer
                    description: Coordination Issue Assignee ID after the change
                    example: 199
                  created_by_id:
                    type: integer
                    description: ID of the user responsible for the reassignment
                    example: 199
                  created_at:
                    type: string
                    format: date-time
                    description: Created date
                    example: '2019-05-14T14:39:36Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  fields:
                    type: string
                  reason:
                    description: A human-readable code providing additional detail on the cause of the error.
                    type: string
                  error:
                    description: Description of the error thrown.
                    type:
                    - string
                    - 'null'
                    example: Invalid Token
      x-code-samples:
      - id: node_request
        mimeType: application/json
        title: Node.js
        content: "const request = require('request');\n\nconst options = {\n  method: 'POST',\n  url: 'https://api.procore.com/rest/v1.0/coordination_issues/%7Bcoordination_issue_id%7D/assignments',\n  headers: {'content-type': 'application/json'},\n  body: {project_id: 12345, coordination_issue_assignment: {assignee_id: 624}},\n  json: true\n};\n\nrequest(options, function (error, response, body) {\n  if (error) throw new Error(error);\n\n  console.log(body);\n});\n"
      - id: python_python3
        mimeType: application/json
        title: Python3
        content: 'import http.client


          conn = http.client.HTTPSConnection("api.procore.com")


          payload = "{\"project_id\":12345,\"coordination_issue_assignment\":{\"assignee_id\":624}}"


          headers = { ''content-type'': "application/json" }


          conn.request("POST", "/rest/v1.0/coordination_issues/%7Bcoordination_issue_id%7D/assignments", payload, headers)


          res = conn.getresponse()

          data = res.read()


          print(data.decode("utf-8"))'
      - id: shell_curl
        mimeType: application/json
        title: Curl
        content: "curl --request POST \\\n  --url https://api.procore.com/rest/v1.0/coordination_issues/%7Bcoordination_issue_id%7D/assignments \\\n  --header 'content-type: application/json' \\\n  --data '{\"project_id\":12345,\"coordination_issue_assignment\":{\"assignee_id\":624}}'"
      - id: csharp_httpclient
        mimeType: application/json
        title: C#
        content: "var client = new HttpClient();\nvar request = new HttpRequestMessage\n{\n    Method = HttpMethod.Post,\n    RequestUri = new Uri(\"https://api.procore.com/rest/v1.0/coordination_issues/%7Bcoordination_issue_id%7D/assignments\"),\n    Content = new StringContent(\"{\\\"project_id\\\":12345,\\\"coordination_issue_assignment\\\":{\\\"assignee_id\\\":624}}\")\n    {\n        Headers =\n        {\n            ContentType = new MediaTypeHeaderValue(\"application/json\")\n        }\n    }\n};\nusing (var response = await client.SendAsync(request))\n{\n    response.EnsureSuccessStatusCode();\n    var body = await response.Content.ReadAsStringAsync();\n    Console.WriteLine(body);\n}"
      x-rate-limit-enabled: true
      x-procore-kong-tags:
      - rate-limit:enabled
      operationId: createCoordinationIssueAssignment
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
