servers:
- url: https://api.procore.com
  description: Production
security:
- bearerAuth: []
tags:
- name: Currency Configuration
paths:
  /rest/v1.0/companies/{company_id}/currency_configuration:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    - name: company_id
      in: path
      description: Integer ID of the Procore company. Obtainable from GET /rest/v1.0/companies. Identifies which company's currency configuration to act on.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Company Currency Configuration
      description: Returns the currency configuration for the specified company. When no configuration has been created yet, currency-related fields are returned as null while company eligibility and toggle defaults are still populated, so consumers can detect the unconfigured state without a 404.
      tags:
      - Currency Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Company Currency Configuration GET Response
                description: Currency configuration for a Procore company. When no configuration has been created yet, currency-related fields are returned as null while company eligibility and toggle defaults are still populated.
                type: object
                properties:
                  company_id:
                    type: integer
                    description: Procore company ID this configuration belongs to. Matches the {company_id} path parameter and is the foreign key to use for all company-scoped multicurrency requests.
                    example: 43
                  currency_iso_code:
                    type:
                    - string
                    - 'null'
                    description: ISO 4217 three-letter currency code for the company's base currency (e.g., 'USD', 'EUR', 'JPY'). All company-scoped monetary amounts in Procore are denominated in this currency. Null when no currency configuration has been created for the company.
                    example: USD
                  currency_display:
                    type:
                    - string
                    - 'null'
                    description: How currency amounts should be rendered. 'symbol' renders with the locale currency glyph (e.g., $); 'code' renders with the ISO code (e.g., USD). Null when no currency configuration has been created for the company.
                    enum:
                    - symbol
                    - code
                    example: code
                  multicurrency_enabled:
                    type: boolean
                    description: Whether multicurrency support is enabled for the company. When true, projects under this company may be configured with their own currency and exchange rates. Returns false (and effective date null) when no configuration exists or multicurrency has not been enabled.
                    example: false
                  multicurrency_enabled_effective_date:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: ISO 8601 timestamp marking when multicurrency was first enabled for the company. Null if multicurrency has never been enabled or no currency configuration exists. Use to audit when multicurrency went live.
                    example: '2023-08-24T18:27:44Z'
                  eligible_for_multicurrency:
                    type: boolean
                    description: Whether the company satisfies the prerequisites to enable multicurrency (e.g., compatible ERP integration). When false, attempts to enable multicurrency will be rejected; use this to decide whether to surface the multicurrency toggle in your UI.
                    example: true
                  multicurrency_phase_two_flag_enabled:
                    type: boolean
                    description: Whether the company has access to the extended multicurrency capabilities (separate base/quote currency tracking and per-record exchange rate fields used by multicurrency-aware downstream resources). When false, the company is limited to baseline multicurrency behavior. Use as a hint when deciding which API shape to expect from other multicurrency-aware endpoints.
                    example: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
