    patch:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Update Project Exchange Rates
      description: Updates existing project exchange rates in bulk. Requires the project to have multicurrency enabled. Each item in the `exchange_rates` array must include an integer `id` from a prior GET response; other fields are optional and only modified when present. Use `is_active` to soft-delete or reactivate a rate without losing its audit history. When project rates are synced with company rates, the rate values are computed automatically and the API-supplied `exchange_rate` is ignored.
      tags:
      - Currency Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - exchange_rates
              properties:
                exchange_rates:
                  type: array
                  description: Array of existing exchange rates to update. Each item must include the integer `id` of the rate being updated; other fields are optional and only updated if present.
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: integer
                        description: Integer ID of the exchange rate to update. Required. Obtain from a prior GET /rest/v1.0/companies/{company_id}/projects/{project_id}/currency_configuration/exchange_rates response.
                        example: 1
                      quote_currency_iso_code:
                        type: string
                        description: 'Optional. ISO 4217 three-letter code of the new quote currency for this rate.

                          Must not match the base currency. Must not conflict with an existing rate for

                          the same base currency pair — returns 400 if a rate for that quote currency already exists.

                          '
                        example: CAD
                      exchange_rate:
                        type: string
                        description: 'Optional decimal exchange rate (sent as a string for precision). Updated rate value, expressed as number of units of `quote_currency_iso_code` per one unit of `base_currency_iso_code`.

                          **Note:** If project exchange rates are synced with company rates, this value will be automatically calculated based on company rates and cannot be overridden through the API.

                          '
                        example: '1.0'
                      is_active:
                        type: boolean
                        description: Optional. Set to false to deactivate this rate. Set to true to reactivate a previously inactive rate.
                        example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Project Exchange Rates
                description: Collection of exchange rates configured at the project level. Each rate quotes how many units of `quote_currency_iso_code` equal one unit of `base_currency_iso_code` (the project's currency).
                type: object
                properties:
                  exchange_rates:
                    type: array
                    description: Array of project-level exchange rates. Empty when no rates have been configured. By default only active rates are returned; pass `include_inactive=true` to include inactive rates as well.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Integer identifier of the exchange rate. Pass this value as `exchange_rates[].id` in the PATCH body to update or activate/deactivate this rate.
                          example: 1
                        company_id:
                          type: integer
                          description: Procore company ID that owns the project this rate belongs to. Matches the {company_id} path parameter.
                          example: 43
                        project_id:
                          type: integer
                          description: Procore project ID this rate belongs to. Matches the {project_id} path parameter.
                          example: 44
                        base_currency_iso_code:
                          type: string
                          description: ISO 4217 three-letter code of the project base currency. All rates in this collection share the same base. One unit of this currency equals `exchange_rate` units of `quote_currency_iso_code`.
                          example: USD
                        quote_currency_iso_code:
                          type: string
                          description: ISO 4217 three-letter code of the quote currency. `(base_currency_iso_code, quote_currency_iso_code)` uniquely identifies the currency pair this rate covers.
                          example: CAD
                        exchange_rate:
                          type: string
                          description: Decimal exchange rate, returned as a string to preserve precision. Number of units of `quote_currency_iso_code` per one unit of `base_currency_iso_code` at the rate's effective date. When the project is synced with company rates, this value is computed from the company rate and cannot be overridden via the API.
                          example: '1.0'
                        is_active:
                          type: boolean
                          description: Whether this exchange rate is currently active. Active rates are used to convert between the currency pair at runtime. Inactive rates are retained for audit history but not used for new conversions.
                          example: true
                        updated_at:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp marking when the exchange rate was last updated.
                          example: '2023-07-10T00:00:00Z'
                        created_at:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp marking when the exchange rate was created.
                          example: '2023-07-10T00:00:00Z'
