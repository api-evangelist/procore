  /rest/v2.0/companies/{company_id}/currency_configuration:
    parameters:
    - name: Procore-Company-Id
      in: header
      description: Unique company identifier associated with the Procore User Account.
      required: true
      schema:
        type: integer
    x-compliance-level: partial
    post:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Create Company Currency Configuration
      description: Creates the initial currency configuration for the specified company. The supplied `currency_iso_code` becomes the company's base currency. Setting `multicurrency_enabled=true` requires a signed multicurrency beta agreement, otherwise the API returns 400 MISSING_BETA_AGREEMENT. Returns the created configuration wrapped under a `data` key (V2 convention).
      parameters:
      - name: company_id
        in: path
        description: String ID of the Procore company for which to create the currency configuration. Obtainable from GET /rest/v1.0/companies (cast to string).
        required: true
        schema:
          type: string
      tags:
      - Currency Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - currency_iso_code
              properties:
                currency_iso_code:
                  type: string
