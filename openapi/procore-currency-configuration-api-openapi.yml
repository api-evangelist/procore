                    example: code
                  multicurrency_enabled:
                    type: boolean
                    description: Whether multicurrency support is enabled for the company. When true, projects under this company may be configured with their own currency and exchange rates.
                    example: false
                  multicurrency_enabled_effective_date:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: ISO 8601 timestamp marking when multicurrency was first enabled for the company. Null if multicurrency has never been enabled. Use to audit when multicurrency went live.
