      summary: Create Project Currency Configuration
      description: Creates a project currency configuration. Requires the parent company to have multicurrency enabled, otherwise the API returns 400. The project currency may differ from the company base currency. Returns 400 if a configuration already exists for the project.
      tags:
      - Currency Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Project Currency Configuration Create Body
              type: object
              required:
              - currency_iso_code
              properties:
                currency_iso_code:
                  type: string
                  description: 'ISO 4217 three-letter code for the project''s currency (e.g., ''EUR''). Required.

                    May differ from the company base currency when company-level multicurrency is enabled.

                    Check `currency_iso_code_eligible_for_update` in the GET response before attempting

                    to update — if false, this field is locked and the request returns 400.

                    '
                  example: USD
                company_currency_exchange_rate_override:
                  type: string
                  description: Optional decimal override (sent as a string for precision). When set, overrides the company-level exchange rate when converting between this project's currency and the company base currency. Omit to use the company exchange rate.
                  example: '1.2'
                currency_display:
                  type: string
                  description: Controls how currency amounts are formatted in responses and rendered to end users. 'symbol' uses the locale currency glyph (e.g., $); 'code' uses the ISO code (e.g., USD). Defaults to 'symbol'.
                  enum:
                  - symbol
                  - code
                  default: symbol
                  example: symbol
                multicurrency_enabled:
                  type: boolean
                  description: Whether to apply project-level currency settings to this project's financial objects. Defaults to false. Requires the parent company to also have multicurrency enabled; otherwise the API returns 400.
                  example: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                title: Project Currency Configuration
                description: Currency configuration for a Procore project. Returned after a successful create, update, or delete; all fields reflect the persisted record.
                type: object
                properties:
                  company_id:
                    type: integer
                    description: Procore company ID that owns this project. Matches the {company_id} path parameter.
                    example: 43
                  project_id:
                    type: integer
                    description: Procore project ID this configuration belongs to. Matches the {project_id} path parameter and is the foreign key to use for all project-scoped multicurrency requests.
                    example: 56
                  currency_iso_code:
                    type: string
                    description: ISO 4217 three-letter currency code for the project's currency (e.g., 'USD', 'EUR'). May differ from the company base currency when company-level multicurrency is enabled.
                    example: USD
                  currency_display:
                    type: string
                    description: How currency amounts should be rendered for this project. 'symbol' renders with the locale currency glyph (e.g., $); 'code' renders with the ISO code (e.g., USD).
                    enum:
                    - symbol
                    - code
                    example: code
                  company_currency_exchange_rate_override:
                    type:
                    - string
                    - 'null'
                    description: Decimal override (sent as a string for precision) that supersedes the company-level exchange rate when converting between the project currency and the company base currency. Null to use the company exchange rate.
                    example: '1.2'
                  currency_iso_code_eligible_for_update:
                    type: boolean
                    description: Whether the project's `currency_iso_code` can still be changed. Currently always returns true; will reflect exchange-rate / multicurrency-record presence once project exchange-rate APIs are GA.
                    example: true
                  multicurrency_enabled:
                    type: boolean
                    description: Whether multicurrency settings apply to this project's financial objects. When true, financial objects can use a different currency from the company base. Requires the parent company to also have multicurrency enabled.
                    example: true
                  eligible_for_financial_objs_multicurrency:
                    type:
                    - boolean
                    - 'null'
                    description: Whether the parent company satisfies the prerequisites (e.g., ERP integration compatibility) to apply project-level multicurrency to financial objects. When false, attempts to enable `multicurrency_enabled` on the project are rejected. Conditionally present — absent from the response for companies that do not have project-level financial-object multicurrency rolled out.
                    example: true
                  multicurrency_phase_two_flag_enabled:
                    type: boolean
                    description: Inherited from the parent company. Indicates whether the project has access to the extended multicurrency capabilities (separate base/quote currency tracking and per-record exchange rate fields used by multicurrency-aware downstream resources). When false, the project is limited to baseline multicurrency behavior and attempts to set `multicurrency_enabled=true` on the project are rejected.
                    example: false
                  currency_status:
                    type: string
                    description: Confirmation lifecycle state of the project currency. `pending` until a user explicitly confirms the currency; `confirmed` afterwards, at which point `currency_iso_code` can no longer be changed. Display, exchange-rate override, and multicurrency settings remain editable after confirmation. Conditionally present — absent from the response unless the currency-confirmation feature is enabled for the company or project.
                    enum:
                    - pending
                    - confirmed
                    example: pending
