        type: integer
    x-compliance-level: full
    get:
      parameters:
      - name: include_inactive
        in: query
        description: When true, includes inactive (soft-deleted) exchange rates in the response alongside active ones. Defaults to false (only active rates returned). Useful for audit views and managing rate lifecycle. The string values "true" and "false" are coerced to Boolean by the controller.
        required: false
        example: true
        schema:
          type: boolean
          default: false
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Project Exchange Rates
      description: Returns the collection of project-level exchange rates. By default only active rates are returned; pass `include_inactive=true` to also include inactive rates (useful for audit views). Returns an empty array when no rates have been configured.
      tags:
      - Currency Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Project Exchange Rates
                description: Collection of exchange rates configured at the project level. Each rate quotes how many units of `quote_currency_iso_code` equal one unit of `base_currency_iso_code` (the project's currency).
                type: object
                properties:
                  exchange_rates:
                    type: array
                    description: Array of project-level exchange rates. Empty when no rates have been configured. By default only active rates are returned; pass `include_inactive=true` to include inactive rates as well.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Integer identifier of the exchange rate. Pass this value as `exchange_rates[].id` in the PATCH body to update or activate/deactivate this rate.
                          example: 1
                        company_id:
                          type: integer
                          description: Procore company ID that owns the project this rate belongs to. Matches the {company_id} path parameter.
                          example: 43
                        project_id:
                          type: integer
                          description: Procore project ID this rate belongs to. Matches the {project_id} path parameter.
                          example: 44
                        base_currency_iso_code:
                          type: string
                          description: ISO 4217 three-letter code of the project base currency. All rates in this collection share the same base. One unit of this currency equals `exchange_rate` units of `quote_currency_iso_code`.
                          example: USD
                        quote_currency_iso_code:
                          type: string
                          description: ISO 4217 three-letter code of the quote currency. `(base_currency_iso_code, quote_currency_iso_code)` uniquely identifies the currency pair this rate covers.
                          example: CAD
                        exchange_rate:
                          type: string
                          description: Decimal exchange rate, returned as a string to preserve precision. Number of units of `quote_currency_iso_code` per one unit of `base_currency_iso_code` at the rate's effective date. When the project is synced with company rates, this value is computed from the company rate and cannot be overridden via the API.
                          example: '1.0'
                        is_active:
                          type: boolean
                          description: Whether this exchange rate is currently active. Active rates are used to convert between the currency pair at runtime. Inactive rates are retained for audit history but not used for new conversions.
                          example: true
                        updated_at:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp marking when the exchange rate was last updated.
                          example: '2023-07-10T00:00:00Z'
                        created_at:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp marking when the exchange rate was created.
                          example: '2023-07-10T00:00:00Z'
