      summary: Update Company Currency Configuration
      description: Updates the company's currency configuration. Send only the fields you want to change; omitted fields are left unchanged. Note that `currency_iso_code` cannot be changed via this endpoint — the base currency is fixed once set. Enabling multicurrency for the first time requires a signed beta agreement (returns 400 MISSING_BETA_AGREEMENT otherwise).
      tags:
      - Currency Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              properties:
                currency_display:
                  type: string
                  description: How currency amounts should be rendered. 'symbol' renders with the locale currency glyph (e.g., $); 'code' renders with the ISO code (e.g., USD). Defaults to 'symbol' on first configuration. Omit to leave the existing value unchanged.
                  enum:
                  - symbol
                  - code
                  default: symbol
                  example: symbol
                multicurrency_enabled:
                  type: boolean
                  description: Whether to enable multicurrency for the company. When true, projects under this company may be configured with their own currency and exchange rates. The first time you set this to true the company must have a signed multicurrency beta agreement; otherwise the API returns 400 MISSING_BETA_AGREEMENT. Omit to leave the existing value unchanged.
                  default: false
                  example: false
