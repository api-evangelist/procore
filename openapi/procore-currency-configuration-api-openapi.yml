              schema:
                title: Company Currency Configuration
                description: Currency configuration for a Procore company. Returned after a successful update or delete; all fields reflect the persisted record.
                type: object
                properties:
                  company_id:
                    type: integer
                    description: Procore company ID this configuration belongs to. Matches the {company_id} path parameter and is the foreign key to use for all company-scoped multicurrency requests.
                    example: 43
                  currency_iso_code:
                    type: string
                    description: ISO 4217 three-letter currency code for the company's base currency (e.g., 'USD', 'EUR', 'JPY'). All company-scoped monetary amounts in Procore are denominated in this currency.
