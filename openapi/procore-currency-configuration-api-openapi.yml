      in: path
      description: Integer ID of the Procore company that owns the project. Obtainable from GET /rest/v1.0/companies.
      required: true
      schema:
        type: integer
    - name: project_id
      in: path
      description: Integer ID of the Procore project. Obtainable from GET /rest/v1.0/companies/{company_id}/projects. Identifies which project's currency configuration to act on.
      required: true
      schema:
        type: integer
    x-compliance-level: full
    get:
      x-doc:
        visibility: public
        stage: ga
        exposure: public
      summary: Get Project Currency Configuration
      description: Returns the currency configuration for the specified project. When no configuration has been created yet, currency-related fields are returned as null while company eligibility and toggle defaults are still populated, so consumers can detect the unconfigured state without a 404. When the currency-confirmation feature is enabled for the company, the response also carries `currency_status`, `confirmed_at`, and `confirmed_by`; these keys are absent, not null, when the feature is off.
      tags:
      - Currency Configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Project Currency Configuration GET Response
                description: Currency configuration for a Procore project. When no configuration has been created yet, currency-related fields are returned as null while company-eligibility and toggle defaults are still populated, so consumers can detect the unconfigured state without a 404.
                type: object
                properties:
                  company_id:
                    type: integer
                    description: Procore company ID that owns this project. Matches the {company_id} path parameter.
                    example: 43
                  project_id:
                    type: integer
                    description: Procore project ID this configuration belongs to. Matches the {project_id} path parameter and is the foreign key to use for all project-scoped multicurrency requests.
                    example: 56
                  currency_iso_code:
                    type:
                    - string
                    - 'null'
                    description: ISO 4217 three-letter currency code for the project's currency (e.g., 'USD', 'EUR'). May differ from the company base currency when company-level multicurrency is enabled. Null when no project currency configuration has been created.
                    example: USD
                  currency_display:
                    type:
                    - string
                    - 'null'
                    description: How currency amounts should be rendered for this project. 'symbol' renders with the locale currency glyph (e.g., $); 'code' renders with the ISO code (e.g., USD). Null when no project currency configuration has been created.
                    enum:
                    - symbol
                    - code
                    example: code
                  company_currency_exchange_rate_override:
                    type:
                    - string
                    - 'null'
                    description: Decimal override (sent as a string for precision) that supersedes the company-level exchange rate when converting between the project currency and the company base currency. Null to use the company exchange rate.
                    example: '1.2'
                  currency_iso_code_eligible_for_update:
                    type: boolean
                    description: Whether the project's `currency_iso_code` can still be changed. Currently always returns true; will reflect exchange-rate / multicurrency-record presence once project exchange-rate APIs are GA.
                    example: true
                  multicurrency_enabled:
                    type: boolean
                    description: Whether multicurrency settings apply to this project's financial objects. Defaults to false. When true, financial objects can use a different currency from the company base. Requires the parent company to also have multicurrency enabled.
                    example: true
                  eligible_for_financial_objs_multicurrency:
                    type:
                    - boolean
                    - 'null'
                    description: Whether the parent company satisfies the prerequisites (e.g., ERP integration compatibility) to apply project-level multicurrency to financial objects. When false, attempts to enable `multicurrency_enabled` on the project will be rejected. Conditionally present — absent from the response for companies that do not have project-level financial-object multicurrency rolled out.
                    example: true
                  multicurrency_phase_two_flag_enabled:
                    type: boolean
                    description: Inherited from the parent company. Indicates whether the project has access to the extended multicurrency capabilities (separate base/quote currency tracking and per-record exchange rate fields used by multicurrency-aware downstream resources). When false, the project is limited to baseline multicurrency behavior and attempts to set `multicurrency_enabled=true` on the project are rejected.
                    example: false
                  currency_status:
                    type: string
                    description: Confirmation lifecycle state of the project currency. `pending` until a user explicitly confirms the currency; `confirmed` afterwards, at which point `currency_iso_code` can no longer be changed. Returns `pending` when no project currency configuration has been created. Conditionally present — absent from the response unless the currency-confirmation feature is enabled for the company or project.
                    enum:
                    - pending
                    - confirmed
                    example: pending
                  confirmed_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: When the project currency was confirmed. Null while `currency_status` is `pending`. Conditionally present — absent from the response unless the currency-confirmation feature is enabled for the company or project.
                    example: '2026-09-01T12:00:00Z'
                  confirmed_by:
                    type:
                    - integer
                    - 'null'
                    description: Procore user ID of the user who confirmed the project currency. Null while `currency_status` is `pending`. Conditionally present — absent from the response unless the currency-confirmation feature is enabled for the company or project.
                    example: 1234
