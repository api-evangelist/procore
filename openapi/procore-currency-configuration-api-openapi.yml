      description: Creates one or more exchange rates for the project. Requires the project to have multicurrency enabled, otherwise the API returns 400. Every rate is created against the supplied `base_currency_iso_code`, which must match the project's existing currency. When project rates are synced with company rates, the rate values are computed automatically and the API-supplied `exchange_rate` is ignored.
