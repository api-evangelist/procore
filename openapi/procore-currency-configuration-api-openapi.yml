      summary: Update Company Exchange Rates
      description: Updates existing company exchange rates in bulk. Each item in the `exchange_rates` array must include an integer `id` from a prior GET response; other fields are optional and only modified when present. Use `is_active` to soft-delete or reactivate a rate without losing its audit history.
      tags:
      - Currency Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: Body
              type: object
              required:
              - exchange_rates
              properties:
                exchange_rates:
                  type: array
                  description: Array of existing exchange rates to update. Each item must include the integer `id` of the rate being updated; other fields are optional and only updated if present.
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: integer
                        description: Integer ID of the exchange rate to update. Required. Obtain from a prior GET /rest/v1.0/companies/{company_id}/currency_configuration/exchange_rates response.
                        example: 1
                      quote_currency_iso_code:
                        type: string
                        description: 'Optional. ISO 4217 three-letter code of the new quote currency for this rate.

                          Must not match the base currency. Must not conflict with an existing rate for

                          the same base currency pair — returns 400 if a rate for that quote currency already exists.

                          '
                        example: CAD
                      exchange_rate:
                        type: string
                        description: Optional decimal exchange rate (sent as a string for precision). Updated rate value, expressed as number of units of `quote_currency_iso_code` per one unit of `base_currency_iso_code`.
                        example: '1.0'
                      is_active:
                        type: boolean
                        description: Optional. Set to false to deactivate this rate. Set to true to reactivate a previously inactive rate.
                        example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Company Exchange Rates
                description: Collection of exchange rates configured at the company level. Each rate quotes how many units of `quote_currency_iso_code` equal one unit of `base_currency_iso_code`.
                type: object
                properties:
                  exchange_rates:
                    type: array
                    description: Array of company-level exchange rates. Empty when no rates have been configured for the company. Only active rates are returned (this V1 GET does not accept an include_inactive query parameter).
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Integer identifier of the exchange rate. Pass this value as `exchange_rates[].id` in the PATCH body to update or activate/deactivate this rate.
                          example: 1
                        company_id:
                          type: integer
                          description: Procore company ID that owns this exchange rate. Matches the {company_id} path parameter.
                          example: 43
                        base_currency_iso_code:
                          type: string
                          description: ISO 4217 three-letter code of the company's base currency. All rates in this collection share the same base. One unit of this currency equals `exchange_rate` units of `quote_currency_iso_code`.
                          example: USD
                        quote_currency_iso_code:
                          type: string
                          description: ISO 4217 three-letter code of the quote currency. `(base_currency_iso_code, quote_currency_iso_code)` uniquely identifies the currency pair this rate covers.
                          example: CAD
                        exchange_rate:
                          type: string
                          description: Decimal exchange rate, returned as a string to preserve precision. Number of units of `quote_currency_iso_code` per one unit of `base_currency_iso_code` at the rate's effective date.
                          example: '1.0'
                        is_active:
                          type: boolean
                          description: Whether this exchange rate is currently active. Active rates are used to convert between the currency pair at runtime. Inactive rates are retained for audit history but not used for new conversions.
                          example: true
                        updated_at:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp marking when the exchange rate was last updated.
                          example: '2023-07-10T00:00:00Z'
                        created_at:
                          type: string
                          format: date-time
                          description: ISO 8601 timestamp marking when the exchange rate was created.
