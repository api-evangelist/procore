                            type:
                            - object
                            - 'null'
                            properties:
                              id:
                                type: integer
                                description: Unique identifier of the verification method.
                                example: 21
                              active:
                                type: boolean
                                description: Whether this verification method is enabled for selection in template items.
                                example: true
                              name:
                                type: string
                                description: Display name of the verification method.
                                example: Hold Point
