                      format: date-time
                      description: Timestamp when the template item was created. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
                    deleted_at:
                      type: string
                      format: date-time
                      description: Timestamp when the template item was moved to the recycle bin. ISO 8601 format.
                      example: '2018-09-20T21:39:40Z'
                    description:
                      type: string
                      description: Detailed description of the work or inspection activity for this template item.
                      example: A New Recycled Action Plan Template Item Description
                    holding_type:
                      type: string
                      description: Scope of the hold point. 'section' holds subsequent items within the same section; 'plan' holds all subsequent items across the entire plan.
                      enum:
                      - plan
                      - section
                      example: plan
                    plan_template_id:
                      type: integer
                      description: Unique identifier of the parent Action Plan Template.
                      example: 43584
                    position:
                      type: integer
                      description: Ordinal position of this item within its section. Use to determine display order.
                      example: 3
                    plan_template_section_id:
                      type: integer
                      description: Unique identifier of the section this template item belongs to.
                      example: 43584
                    title:
                      type: string
                      description: Title of the template item describing the inspection or work activity.
