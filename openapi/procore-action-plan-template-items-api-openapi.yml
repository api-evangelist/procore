                      description: Unique identifier of the deleted template item.
                      example: 43584
                    plan_template_item_assignees:
                      type: array
                      description: Assignees responsible for this template item, rendered in compact view.
                      items:
                        type: object
                        description: Company Action Plan Template Item Assignee (Compact)
                        properties:
                          id:
                            type: integer
                            description: Unique identifier of the template item assignee.
                            example: 43584
                          created_at:
                            type: string
                            format: date-time
                            description: Timestamp when the assignee was created. ISO 8601 format.
                            example: '2018-09-20T21:39:40Z'
                          is_holding:
                            type: boolean
                            description: Whether this assignee must sign off at a hold point before subsequent work can proceed.
                            example: true
                          role:
                            type: string
                            description: Organizational role of the assignee within the inspection workflow.
                            enum:
                            - contractor
                            - specialty_contractor
                            - client
                            - architect
                            - third_party
                            - internal
                            example: architect
