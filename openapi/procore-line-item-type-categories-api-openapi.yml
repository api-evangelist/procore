                    type: array
                    items:
                      title: Line Item Type Category
                      type: object
                      required:
                      - id
                      - name
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the Line Item Type Category.
                          example: '12345'
                        name:
                          type: string
                          description: Cost Type Category name
                          example: Labor
              examples:
                response:
                  value:
